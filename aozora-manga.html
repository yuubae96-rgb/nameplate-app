<div class="card noPrint"><div class="viewSwitch"><button id="editViewBtn" class="blue" onclick="setView('edit')">編集表示</button><button id="bookViewBtn" class="ghost" onclick="setView('book')">📖 漫画本表示</button></div><div class="small" style="margin-top:6px">漫画本表示は右→左読み、1ページ4コマでPDF向けに整えます。</div></div>

<div class="card noPrint"><button class="ghost" style="width:100%" onclick="saveProject()">💾 途中保存</button><button class="green" style="width:100%;margin-top:7px" onclick="setView('book');window.print()">🖨 漫画本PDF / 印刷</button></div></section>
</main><div class="footerNav hidden" id="footer"><div><button class="ghost" onclick="document.querySelector('.input').scrollIntoView({behavior:'smooth'})">設定</button><button class="ghost" onclick="saveProject()">保存</button><button class="blue" onclick="setView('book')">漫画本</button><button class="orange" onclick="document.getElementById('result').scrollIntoView({behavior:'smooth'})">漫画へ</button></div></div>

function findFamous(t){const n=normTitle(t);return Object.entries(FAMOUS).find(([k])=>normTitle(k)===n)?.[1]||null}
function isProtectedKnown(t){return /伊豆の踊子|雪国|古都|千羽鶴/.test(normTitle(t))}
function status(s,bad=false){$('status').textContent=s;$('status').style.color=bad?'#a33':'#176b4a'}async function api(body){let r;try{r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}catch(e){throw Error('通信が途中で切れました。少し待って、もう一度押してください。')}const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'通信エラー');return d}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function loadAozora(){const u=$('url').value.trim();if(!u)return status('URLを入れてください',true);status('📖 本文を読み込み中…');try{const d=await api({action:'loadAozora',url:u});const a=(d.author||'').replace(/\s/g,'');if(/川端康成/.test(a)&&!$('rights').checked){$('author').value=d.author||'';$('title').value=d.title||'';$('text').value='';return status('⚠️ 川端康成作品は保護中です。権利確認後に使用してください。',true)}$('title').value=d.title||$('title').value;$('author').value=d.author||$('author').value;$('text').value=d.text;$('chars').textContent=`${d.chars.toLocaleString()}文字`;status('✅ 本文を読み込みました');return true}catch(e){status('⚠️ '+e.message,true);return false}}
async function loadByTitle(){const t=$('title').value.trim();if(!t)return status('作品名を入れてください。',true);if(isProtectedKnown(t)){return status('⚠️ この作品は現在も著作権保護中です。URLなしの自動取得はできません。利用権・許諾がある場合は本文を用意してください。',true)}const w=findFamous(t);if(!w)return status('まだ自動取得リストにない作品です。青空文庫URLを使うか、本文を貼り付けてください。',true);$('author').value=w.author;$('url').value=w.url;$('rights').checked=true;status('🔎 作品を見つけました。本文を取得します…');return await loadAozora()}
function rightsOK(){if(!$('rights').checked){status('著作権・利用権を確認してチェックしてください。',true);return false}return true}async function makePlan(){let text=$('text').value.trim();if(text.length<100&&$('title').value.trim()){const ok=await loadByTitle();if(!ok)return;text=$('text').value.trim()}if(!rightsOK())return;if(text.length<100)return status('本文を100文字以上入れてください。',true);status('🧠 章立てと漫画構成を作っています…');try{plan=await api({action:'makePlan',title:$('title').value,author:$('author').value,text,panels:+$('panels').value,tone:$('tone').value,heroLook:$('heroLook').value,artStyle:STYLE_LABELS[$('artStyle').value]});plan.heroLook=$('heroLook').value;plan.artStyle=$('artStyle').value;images={};characterRef='';charactersApproved=false;projectId='p'+Date.now();render();await saveProject(true);status(`✅ ${plan.panels.length}コマ構成ができました。次に人物設定シートを作ってください。`);$('result').scrollIntoView({behavior:'smooth'})}catch(e){status('⚠️ '+e.message,true)}}
function chapters(){return Array.isArray(plan?.chapters)&&plan.chapters.length?plan.chapters:[{no:1,title:'本編',purpose:'物語全体'}]}function chapterFor(n){return chapters().find(c=>Number(c.no)===Number(n))||chapters()[0]}
function render(){if(!plan)return;$('result').classList.remove('hidden');$('footer').classList.remove('hidden');$('mangaTitle').textContent=plan.title||$('title').value;$('subtitle').textContent=plan.subtitle||'';$('bible').textContent=(plan.characterBible||'')+'\n\n'+(plan.settingBible||'');$('chapters').innerHTML=chapters().map(c=>`<button class="ghost" onclick="jumpChapter(${c.no})">第${c.no}章 ${esc(c.title||'')}</button>`).join('');let last=null,html='';(plan.panels||[]).forEach((p,i)=>{if(p.chapter!==last){const c=chapterFor(p.chapter);html+=`<div class="chapterTitle" id="chapter-${p.chapter}"><b>第${c.no}章 ${esc(c.title||'')}</b><span>${esc(c.purpose||'')}</span></div>`;last=p.chapter}html+=panelHtml(p,i,false)});$('manga').innerHTML=html;attachDrags();renderCharacter();updateGate();updateProgress();renderBook()}
function posStyle(pos,fallback){return pos?`left:${pos.x}%;top:${pos.y}%;right:auto;bottom:auto`:fallback}
function panelHtml(p,i,book){const src=images[i];return `<article class="panel" id="panel-${i}"><div class="visual">${src?`<img src="${src}" alt="コマ${i+1}">`:`<div class="placeholder">コマ ${i+1}<br>${esc(p.scene||'')}</div>`}${p.dialogue?`<div class="bubble" data-panel="${i}" data-kind="bubble" style="${posStyle(p.bubblePos,'top:5%;right:5%')}">${esc(p.dialogue)}</div>`:''}${p.narration?`<div class="narr" data-panel="${i}" data-kind="narr" style="${posStyle(p.narrPos,'left:5%;bottom:5%')}">${esc(p.narration)}</div>`:''}</div>${book?'':`<div class="tools"><button class="ghost" onclick="generatePanel(${i})">🎨 描く</button><button class="ghost" onclick="editPanel(${i})">✏️ 文</button><button class="ghost" onclick="resetTextPos(${i})">↩ 位置</button></div>`}</article>`}
function renderBook(){if(!plan)return;const ps=plan.panels||[];let out='';for(let i=0,page=1;i<ps.length;i+=4,page++){out+=`<section class="bookPage">`;for(let j=0;j<4&&i+j<ps.length;j++)out+=panelHtml(ps[i+j],i+j,true);out+=`<div class="pageNo">${page}</div></section>`}$('book').innerHTML=out}
function attachDrags(){document.querySelectorAll('#manga .bubble,#manga .narr').forEach(el=>{el.onpointerdown=e=>{e.preventDefault();el.setPointerCapture(e.pointerId);el.classList.add('dragging');const visual=el.parentElement,rect=visual.getBoundingClientRect(),kind=el.dataset.kind,p=plan.panels[Number(el.dataset.panel)];const move=ev=>{const x=Math.max(0,Math.min(92,(ev.clientX-rect.left)/rect.width*100)),y=Math.max(0,Math.min(92,(ev.clientY-rect.top)/rect.height*100));el.style.left=x+'%';el.style.top=y+'%';el.style.right='auto';el.style.bottom='auto';p[kind==='bubble'?'bubblePos':'narrPos']={x:+x.toFixed(2),y:+y.toFixed(2)}};el.onpointermove=move;el.onpointerup=()=>{el.onpointermove=null;el.classList.remove('dragging');renderBook();saveProject(true)}}})}
function resetTextPos(i){delete plan.panels[i].bubblePos;delete plan.panels[i].narrPos;render();saveProject(true)}
function renderCharacter(){if(characterRef)$('characterSheetBox').innerHTML=`<img src="${characterRef}" alt="人物設定シート">`;else $('characterSheetBox').innerHTML='<div class="placeholder" style="aspect-ratio:3/4">人物設定シート<br>未作成</div>';$('approveBox').classList.toggle('hidden',!characterRef||charactersApproved);$('approvedMsg').classList.toggle('hidden',!charactersApproved)}
async function makeCharacterSheet(){if(!plan)return;charactersApproved=false;updateGate();$('characterSheetBox').innerHTML='<div class="placeholder" style="aspect-ratio:3/4">👥 人物設定シートを作成中…</div>';try{const guide=`${plan.characterBible||''}\n主人公の見た目：${$('heroLook').value||'原作から判断'}\n画風：${STYLE_LABELS[$('artStyle').value]}`;const d=await api({action:'makeCharacterSheet',characterBible:guide,settingBible:plan.settingBible,heroLook:$('heroLook').value,artStyle:STYLE_LABELS[$('artStyle').value]});characterRef=`data:${d.mimeType};base64,${d.data}`;renderCharacter();await saveProject(true)}catch(e){$('characterSheetBox').innerHTML=`<div class="placeholder">⚠️ ${esc(e.message)}</div>`}}
async function approveCharacters(){charactersApproved=true;renderCharacter();updateGate();await saveProject(true)}function updateGate(){const b=$('allBtn');if(!b)return;b.disabled=!charactersApproved;b.className=charactersApproved?'green':'disabled';$('gateText').textContent=charactersApproved?'人物承認済み。未作成コマを順番に生成できます。':'人物設定シートを承認すると押せます。'}
async function generatePanel(i){if(!plan)return;if(!characterRef)return status('先に人物設定シートを作ってください。',true);const p=plan.panels[i];const box=document.querySelector(`#panel-${i} .visual`);if(box&&!images[i])box.innerHTML='<div class="placeholder">🎨 描画中…</div>';try{const ref=i>0?images[i-1]:null,style=STYLE_LABELS[$('artStyle').value],hero=$('heroLook').value;const d=await api({action:'makePanel',prompt:`${p.imagePrompt||p.scene||''}\n画風：${style}\n主人公：${hero||'人物設定シートを厳密に維持'}`,characterBible:plan.characterBible,settingBible:plan.settingBible,continuity:p.continuity,tone:$('tone').value,artStyle:style,heroLook:hero,characterReference:characterRef,referenceImage:ref||undefined});images[i]=`data:${d.mimeType};base64,${d.data}`;render();await saveProject(true);return true}catch(e){render();status(`⚠️ コマ${i+1}: ${e.message}`,true);return false}}
async function generateAll(){if(!charactersApproved)return status('人物設定シートを承認してください。',true);stopRequested=false;$('pauseBtn').classList.remove('hidden');for(let i=0;i<plan.panels.length;i++){if(stopRequested)break;if(images[i])continue;status(`🎨 ${i+1}/${plan.panels.length} コマを作成中…`);await generatePanel(i)}$('pauseBtn').classList.add('hidden');status(stopRequested?'⏸ 一時停止しました。ここまで保存済みです。':'✅ 未作成コマの生成が完了しました。')}function pauseGeneration(){stopRequested=true}
function updateProgress(){if(!plan)return;const done=Object.keys(images).length,total=plan.panels.length;$('progressText').innerHTML=`<b>画像 ${done} / ${total}</b>`;$('progress').style.width=`${total?done/total*100:0}%`}
function editPanel(i){const p=plan.panels[i];const n=prompt('ナレーション',p.narration||'');if(n===null)return;const d=prompt('セリフ',p.dialogue||'');if(d===null)return;p.narration=n;p.dialogue=d;render();saveProject(true)}function jumpChapter(n){document.getElementById('chapter-'+n)?.scrollIntoView({behavior:'smooth',block:'start'})}function setView(v){currentView=v;$('manga').classList.toggle('hidden',v==='book');$('book').classList.toggle('hidden',v!=='book');$('editViewBtn').className=v==='edit'?'blue':'ghost';$('bookViewBtn').className=v==='book'?'blue':'ghost'}
function openDB(){return new Promise((res,rej)=>{const q=indexedDB.open('literatureMangaDB',2);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('projects'))q.result.createObjectStore('projects',{keyPath:'id'})};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}async function saveProject(silent=false){if(!plan)return;const db=await openDB();const tx=db.transaction('projects','readwrite');tx.objectStore('projects').put({id:projectId||('p'+Date.now()),title:plan.title||$('title').value,plan,images,characterRef,charactersApproved,tone:$('tone').value,author:$('author').value,heroLook:$('heroLook').value,artStyle:$('artStyle').value,updated:Date.now()});await new Promise((r,j)=>{tx.oncomplete=r;tx.onerror=()=>j(tx.error)});await refreshSaved();if(!silent)status('💾 保存しました')}
async function refreshSaved(){try{const db=await openDB();const tx=db.transaction('projects');const req=tx.objectStore('projects').getAll();const all=await new Promise((r,j)=>{req.onsuccess=()=>r(req.result);req.onerror=()=>j(req.error)});$('savedProjects').innerHTML='<option value="">保存作品を選ぶ</option>'+all.sort((a,b)=>b.updated-a.updated).map(x=>`<option value="${x.id}">${esc(x.title)} (${new Date(x.updated).toLocaleDateString('ja-JP')})</option>`).join('')}catch{}}
async function loadSaved(){const id=$('savedProjects').value;if(!id)return;const db=await openDB();const tx=db.transaction('projects');const req=tx.objectStore('projects').get(id);const p=await new Promise((r,j)=>{req.onsuccess=()=>r(req.result);req.onerror=()=>j(req.error)});if(!p)return;projectId=p.id;plan=p.plan;images=p.images||{};characterRef=p.characterRef||'';charactersApproved=!!p.charactersApproved;$('tone').value=p.tone||'原作重視';$('author').value=p.author||'';$('heroLook').value=p.heroLook||plan.heroLook||'';$('artStyle').value=p.artStyle||plan.artStyle||'classic';render();$('result').scrollIntoView({behavior:'smooth'})}
window.addEventListener('load',()=>{refreshSaved();showRecommendations('junior')})
</script><script src="aozora-easy-voicevox.js?v=20260921-2"></script></body></html>
