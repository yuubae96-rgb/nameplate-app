<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff7eb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="文学まんがAI"><title>文学まんがAI</title>
<style>:root{--ink:#222;--paper:#fff9ef;--line:#e5d4bd;--orange:#e36b2c;--green:#16885b;--blue:#315f91;--red:#b44;--muted:#756d64}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fff7eb,#f5eee5);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink)}main{max-width:980px;margin:auto;padding:16px 12px 110px}h1{margin:4px 0;font-size:27px}.sub{font-size:13px;color:var(--muted);margin-bottom:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 5px 18px #5d442214}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}label{display:block;font-weight:800;font-size:13px;margin:8px 0 4px}input,textarea,select{width:100%;font-size:16px;padding:11px;border:1px solid #d7c4aa;border-radius:11px;background:white}textarea{min-height:145px}button{border:0;border-radius:11px;padding:11px 13px;font-weight:800;font-size:14px}.green{background:var(--green);color:white}.orange{background:var(--orange);color:white}.blue{background:var(--blue);color:white}.red{background:var(--red);color:white}.ghost{background:#f4ecdf;color:#493d32}.notice{font-size:12px;line-height:1.55;background:#fff3d8;border:1px solid #e8c982;border-radius:11px;padding:10px}.small{font-size:12px;color:var(--muted)}.hidden{display:none!important}.status{font-weight:800;font-size:13px;margin-top:9px}</style></head><body><main>
<h1>📚 文学まんがAI</h1><div class="sub">青空文庫を漫画にする／内容をやさしく要約してVOICEVOXで聴く。</div>
<section class="card input"><div class="notice"><b>作品名だけでもOK</b><br>有名な著作権切れ作品は、作品名を入れるだけで青空文庫から本文を自動取得します。</div><div class="row"><div><label>作品名</label><input id="title" list="famousTitles" placeholder="例：走れメロス"></div><div><label>著者</label><input id="author" placeholder="分かれば入力"></div></div><datalist id="famousTitles"><option value="吾輩は猫である"><option value="坊っちゃん"><option value="こころ"><option value="羅生門"><option value="走れメロス"><option value="人間失格"><option value="銀河鉄道の夜"><option value="注文の多い料理店"><option value="山月記"></datalist><button class="blue" style="width:100%;margin-top:8px" onclick="loadByTitle()">🔎 作品名から本文を自動取得</button><details style="margin-top:10px"><summary class="small"><b>青空文庫URLを直接使う場合</b></summary><label>青空文庫URL</label><div class="row"><input id="url" placeholder="https://www.aozora.gr.jp/cards/..."><button class="orange" onclick="loadAozora()">本文を読み込む</button></div></details><label>本文</label><textarea id="text" placeholder="有名作品なら空欄のままでOK"></textarea><div class="small" id="chars"></div><div class="row"><div><label>漫画の規模</label><select id="panels"><option value="4">4コマ</option><option value="8">8コマ</option><option value="16">16コマ</option><option value="30" selected>30コマ・本格</option></select></div><div><label>方向</label><select id="tone"><option>原作重視</option><option>初心者にも分かりやすく</option><option>ドラマチック</option><option>子どもにも読みやすく</option></select></div></div><label style="display:flex;gap:8px;align-items:flex-start;font-weight:600"><input id="rights" type="checkbox" style="width:auto;margin-top:3px">著作権切れ、または必要な利用権・許諾を確認済みです。</label><button class="green" style="width:100%;margin-top:10px" onclick="makePlan()">✨ 漫画構成を作る</button><div id="status" class="status"></div></section>
<section class="card"><b>💾 保存した作品</b><div class="row" style="margin-top:8px"><select id="savedProjects"><option value="">選択</option></select><button class="blue" onclick="loadSaved()">続きを開く</button></div></section>
<section id="result" class="hidden"><div class="card"><h2 id="mangaTitle"></h2><div id="subtitle"></div><pre id="bible"></pre></div><div id="chapters"></div><div id="manga"></div><div id="book" class="hidden"></div></section>
</main>
<script>
const FN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/aozora-manga-ai';const $=id=>document.getElementById(id);let plan=null,images={},characterRef='',charactersApproved=false,projectId='',stopRequested=false,currentView='edit';
const FAMOUS={'吾輩は猫である':{author:'夏目漱石',url:'https://www.aozora.gr.jp/cards/000148/files/789_14547.html'},'坊っちゃん':{author:'夏目漱石',url:'https://www.aozora.gr.jp/cards/000148/files/50420_76846.html'},'こころ':{author:'夏目漱石',url:'https://www.aozora.gr.jp/cards/000148/files/773_14560.html'},'羅生門':{author:'芥川龍之介',url:'https://www.aozora.gr.jp/cards/000879/files/127_15260.html'},'走れメロス':{author:'太宰治',url:'https://www.aozora.gr.jp/cards/000035/files/1567_14913.html'},'人間失格':{author:'太宰治',url:'https://www.aozora.gr.jp/cards/000035/files/301_14912.html'},'銀河鉄道の夜':{author:'宮沢賢治',url:'https://www.aozora.gr.jp/cards/000081/files/456_15050.html'},'注文の多い料理店':{author:'宮沢賢治',url:'https://www.aozora.gr.jp/cards/000081/files/43754_17659.html'},'山月記':{author:'中島敦',url:'https://www.aozora.gr.jp/cards/000119/files/624_14544.html'}};
function status(s,b=false){$('status').textContent=s;$('status').style.color=b?'#a33':'#176b4a'}async function api(body){const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'通信エラー');return d}function findFamous(t){return FAMOUS[t.trim()]||null}async function loadAozora(){try{const d=await api({action:'loadAozora',url:$('url').value.trim()});$('title').value=d.title||$('title').value;$('author').value=d.author||$('author').value;$('text').value=d.text;$('chars').textContent=(d.chars||d.text.length).toLocaleString()+'文字';status('✅ 本文を読み込みました');return true}catch(e){status('⚠️ '+e.message,true);return false}}async function loadByTitle(){const w=findFamous($('title').value);if(!w)return status('青空文庫URLを使うか本文を貼り付けてください。',true);$('author').value=w.author;$('url').value=w.url;$('rights').checked=true;return loadAozora()}async function makePlan(){let text=$('text').value.trim();if(text.length<100){const ok=await loadByTitle();if(!ok)return;text=$('text').value.trim()}if(!$('rights').checked)return status('著作権・利用権を確認してください。',true);try{status('🧠 漫画構成を作っています…');plan=await api({action:'makePlan',title:$('title').value,author:$('author').value,text,panels:+$('panels').value,tone:$('tone').value});$('result').classList.remove('hidden');$('mangaTitle').textContent=plan.title||$('title').value;$('subtitle').textContent=plan.subtitle||'';$('bible').textContent=(plan.characterBible||'')+'\n'+(plan.settingBible||'');$('manga').innerHTML=(plan.panels||[]).map((p,i)=>`<div class="card"><b>コマ ${i+1}</b><p>${p.scene||''}</p><p>${p.narration||''}</p><p>${p.dialogue||''}</p></div>`).join('');status('✅ 漫画構成ができました')}catch(e){status('⚠️ '+e.message,true)}}function loadSaved(){}
</script><script src="aozora-easy-voicevox.js?v=20260918-1"></script></body></html>
