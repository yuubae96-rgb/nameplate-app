<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文学まんがAI</title><style>body{font-family:-apple-system,"Hiragino Sans",sans-serif;background:#fff7eb;margin:0;color:#222}main{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #e5d4bd;border-radius:18px;padding:14px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}input,textarea,select{width:100%;box-sizing:border-box;font-size:16px;padding:11px;border:1px solid #d7c4aa;border-radius:11px}textarea{min-height:150px}button{border:0;border-radius:11px;padding:12px;font-weight:800}.blue{background:#315f91;color:#fff}.green{background:#16885b;color:#fff}.ghost{background:#f4ecdf}.small{font-size:12px;color:#756d64}.status{font-weight:800;margin-top:8px}.hidden{display:none!important}.works{margin-top:8px;padding:12px;border:1px solid #cbd9eb;border-radius:13px;background:#f5f8fc}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.chips button{background:#fff;border:1px solid #9eb5d2;color:#234e7d}</style></head><body><main><h1>📚 文学まんがAI</h1><div class="small">青空文庫を漫画にする／やさしく要約してVOICEVOXで聴く</div><section class="card input"><div class="row"><div><label>作品名</label><input id="title" placeholder="例：ごん狐"></div><div><label>著者</label><input id="author" placeholder="例：新美南吉"></div></div><div id="authorWorks" class="works hidden"><b>📚 この著者の公開作品</b><div id="authorSearchStatus" class="small"></div><div id="workChips" class="chips"></div></div><button class="blue" style="width:100%;margin-top:8px" onclick="loadByTitle()">🔎 作品名から本文を自動取得</button><label>本文</label><textarea id="text"></textarea><div id="chars" class="small"></div><label><input id="rights" type="checkbox" style="width:auto"> 著作権・利用権を確認済み</label><div class="row"><select id="panels"><option value="4">4コマ</option><option value="8">8コマ</option><option value="16">16コマ</option><option value="30" selected>30コマ</option></select><select id="tone"><option>原作重視</option><option>初心者にも分かりやすく</option></select></div><button class="green" style="width:100%;margin-top:8px" onclick="makePlan()">✨ 漫画構成を作る</button><div id="status" class="status"></div></section><section id="result" class="hidden card"><h2 id="mangaTitle"></h2><div id="subtitle"></div><pre id="bible" style="white-space:pre-wrap"></pre><div id="manga"></div></section></main><script>const FN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/aozora-manga-ai',AUTHOR_FN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/aozora-author-search',$=id=>document.getElementById(id);let foundWorks=[],authorTimer=null;function status(s,b=false){$('status').textContent=s;$('status').style.color=b?'#a33':'#176b4a'}async function api(body){const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'通信エラー');return d}async function searchAuthor(){const author=$('author').value.trim(),box=$('authorWorks'),chips=$('workChips'),ss=$('authorSearchStatus');foundWorks=[];chips.innerHTML='';if(author.length<2){box.classList.add('hidden');return}box.classList.remove('hidden');ss.textContent='青空文庫の全作家から検索中…';try{const r=await fetch(AUTHOR_FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({author})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'検索エラー');foundWorks=Array.isArray(d.works)?d.works:[];if(!foundWorks.length){ss.textContent=d.message||'公開作品が見つかりませんでした';return}if(d.author)$('author').value=d.author;ss.textContent=`${foundWorks.length}作品見つかりました。作品を選んでください。`;chips.innerHTML=foundWorks.map((w,i)=>`<button type="button" data-work="${i}">${escapeHtml(w.title)}</button>`).join('');chips.querySelectorAll('button').forEach(b=>b.onclick=()=>selectWork(Number(b.dataset.work)))}catch(e){ss.textContent='検索できませんでした: '+e.message}}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function selectWork(i){const w=foundWorks[i];if(!w)return;$('title').value=w.title;loadWork(w)}async function loadWork(w){$('rights').checked=true;status('📖 青空文庫から本文を取得中…');try{const d=await api({action:'loadAozora',url:w.url});$('text').value=d.text;if(d.title)$('title').value=d.title;if(d.author)$('author').value=d.author;$('chars').textContent=(d.chars||d.text.length)+'文字';status('✅ 本文を読み込みました');return true}catch(e){status('⚠️ '+e.message,true);return false}}$('author').addEventListener('input',()=>{clearTimeout(authorTimer);authorTimer=setTimeout(searchAuthor,500)});$('author').addEventListener('change',searchAuthor);async function loadByTitle(){const title=$('title').value.trim();if(!title)return status('作品名を入力してください。',true);let w=foundWorks.find(x=>x.title===title);if(!w&&$('author').value.trim()){await searchAuthor();w=foundWorks.find(x=>x.title===title)}if(!w)return status('著者名を入力すると、青空文庫の全公開作品から候補を表示します。',true);return loadWork(w)}async function makePlan(){let text=$('text').value.trim();if(text.length<100){if(!await loadByTitle())return;text=$('text').value.trim()}try{const p=await api({action:'makePlan',title:$('title').value,author:$('author').value,text,panels:+$('panels').value,tone:$('tone').value});$('result').classList.remove('hidden');$('mangaTitle').textContent=p.title||$('title').value;$('subtitle').textContent=p.subtitle||'';$('bible').textContent=(p.characterBible||'')+'\n'+(p.settingBible||'');$('manga').innerHTML=(p.panels||[]).map((x,i)=>`<div class="card"><b>コマ ${i+1}</b><p>${x.scene||''}</p><p>${x.narration||''}</p><p>${x.dialogue||''}</p></div>`).join('');status('✅ 漫画構成ができました')}catch(e){status('⚠️ '+e.message,true)}}</script><script src="aozora-easy-voicevox.js?v=20260918-7"></script></body></html>
