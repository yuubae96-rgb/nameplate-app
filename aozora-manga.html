<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文学まんがAI</title><style>body{font-family:-apple-system,"Hiragino Sans",sans-serif;background:#fff7eb;margin:0;color:#222}main{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #e5d4bd;border-radius:18px;padding:14px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}input,textarea,select{width:100%;box-sizing:border-box;font-size:16px;padding:11px;border:1px solid #d7c4aa;border-radius:11px}textarea{min-height:150px}button{border:0;border-radius:11px;padding:12px;font-weight:800}.blue{background:#315f91;color:#fff}.green{background:#16885b;color:#fff}.ghost{background:#f4ecdf}.small{font-size:12px;color:#756d64}.status{font-weight:800;margin-top:8px}.hidden{display:none!important}.works{margin-top:8px;padding:12px;border:1px solid #cbd9eb;border-radius:13px;background:#f5f8fc}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.chips button{background:#fff;border:1px solid #9eb5d2;color:#234e7d}</style></head><body><main><h1>📚 文学まんがAI</h1><div class="small">青空文庫を漫画にする／やさしく要約してVOICEVOXで聴く</div><section class="card input"><div class="row"><div><label>作品名</label><input id="title" placeholder="例：走れメロス"></div><div><label>著者</label><input id="author" placeholder="例：森鴎外"></div></div><div id="authorWorks" class="works hidden"><b>📚 この著者の作品候補</b><div id="workChips" class="chips"></div></div><button class="blue" style="width:100%;margin-top:8px" onclick="loadByTitle()">🔎 作品名から本文を自動取得</button><label>本文</label><textarea id="text"></textarea><div id="chars" class="small"></div><label><input id="rights" type="checkbox" style="width:auto"> 著作権・利用権を確認済み</label><div class="row"><select id="panels"><option value="4">4コマ</option><option value="8">8コマ</option><option value="16">16コマ</option><option value="30" selected>30コマ</option></select><select id="tone"><option>原作重視</option><option>初心者にも分かりやすく</option></select></div><button class="green" style="width:100%;margin-top:8px" onclick="makePlan()">✨ 漫画構成を作る</button><div id="status" class="status"></div></section><section id="result" class="hidden card"><h2 id="mangaTitle"></h2><div id="subtitle"></div><pre id="bible" style="white-space:pre-wrap"></pre><div id="manga"></div></section></main><script>const FN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/aozora-manga-ai',$=id=>document.getElementById(id);const FAMOUS={'走れメロス':['太宰治','https://www.aozora.gr.jp/cards/000035/files/1567_14913.html'],'羅生門':['芥川龍之介','https://www.aozora.gr.jp/cards/000879/files/127_15260.html'],'吾輩は猫である':['夏目漱石','https://www.aozora.gr.jp/cards/000148/files/789_14547.html'],'坊っちゃん':['夏目漱石','https://www.aozora.gr.jp/cards/000148/files/50420_76846.html'],'こころ':['夏目漱石','https://www.aozora.gr.jp/cards/000148/files/773_14560.html'],'銀河鉄道の夜':['宮沢賢治','https://www.aozora.gr.jp/cards/000081/files/456_15050.html'],'山月記':['中島敦','https://www.aozora.gr.jp/cards/000119/files/624_14544.html'],'舞姫':['森鴎外','https://www.aozora.gr.jp/cards/000129/files/2078_15963.html'],'高瀬舟':['森鴎外','https://www.aozora.gr.jp/cards/000129/files/45245_22007.html'],'阿部一族':['森鴎外','https://www.aozora.gr.jp/cards/000129/files/673_23029.html'],'山椒大夫':['森鴎外','https://www.aozora.gr.jp/cards/000129/files/689_23257.html'],'最後の一句':['森鴎外','https://www.aozora.gr.jp/cards/000129/files/45224_22008.html'],'ヰタ・セクスアリス':['森鴎外','https://www.aozora.gr.jp/cards/000129/files/695_22806.html'],'うたかたの記':['森鴎外','https://www.aozora.gr.jp/cards/000129/files/694_23283.html']};const AUTHOR_WORKS={'森鴎外':['舞姫','高瀬舟','阿部一族','山椒大夫','最後の一句','ヰタ・セクスアリス','うたかたの記'],'森 鴎外':['舞姫','高瀬舟','阿部一族','山椒大夫','最後の一句','ヰタ・セクスアリス','うたかたの記'],'夏目漱石':['吾輩は猫である','坊っちゃん','こころ'],'太宰治':['走れメロス'],'芥川龍之介':['羅生門'],'宮沢賢治':['銀河鉄道の夜'],'中島敦':['山月記']};function status(s,b=false){$('status').textContent=s;$('status').style.color=b?'#a33':'#176b4a'}async function api(body){const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'通信エラー');return d}function showWorks(){const a=$('author').value.trim().replace(/\s/g,'');const key=Object.keys(AUTHOR_WORKS).find(k=>k.replace(/\s/g,'')===a);const box=$('authorWorks'),chips=$('workChips');if(!key){box.classList.add('hidden');return}chips.innerHTML=AUTHOR_WORKS[key].map(t=>`<button type="button" onclick="selectWork('${t}')">${t}</button>`).join('');box.classList.remove('hidden')}function selectWork(t){$('title').value=t;const w=FAMOUS[t];if(w)$('author').value=w[0];loadByTitle()}$('author').addEventListener('input',showWorks);$('author').addEventListener('change',showWorks);async function loadByTitle(){const w=FAMOUS[$('title').value.trim()];if(!w)return status('この作品はまだ直接取得リストにありません。',true);$('author').value=w[0];$('rights').checked=true;showWorks();try{const d=await api({action:'loadAozora',url:w[1]});$('text').value=d.text;$('chars').textContent=(d.chars||d.text.length)+'文字';status('✅ 本文を読み込みました');return true}catch(e){status('⚠️ '+e.message,true)}}async function makePlan(){let text=$('text').value.trim();if(text.length<100){if(!await loadByTitle())return;text=$('text').value.trim()}try{const p=await api({action:'makePlan',title:$('title').value,author:$('author').value,text,panels:+$('panels').value,tone:$('tone').value});$('result').classList.remove('hidden');$('mangaTitle').textContent=p.title||$('title').value;$('subtitle').textContent=p.subtitle||'';$('bible').textContent=(p.characterBible||'')+'\n'+(p.settingBible||'');$('manga').innerHTML=(p.panels||[]).map((x,i)=>`<div class="card"><b>コマ ${i+1}</b><p>${x.scene||''}</p><p>${x.narration||''}</p><p>${x.dialogue||''}</p></div>`).join('');status('✅ 漫画構成ができました')}catch(e){status('⚠️ '+e.message,true)}}</script><script src="aozora-easy-voicevox.js?v=20260918-3"></script></body></html>
