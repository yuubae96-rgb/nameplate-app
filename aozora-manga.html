<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7eb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="文学まんがAI">
<title>文学まんがAI</title>
<style>
:root{--ink:#1f2430;--paper:#fffaf2;--card:#fff;--line:#eadbc7;--accent:#e36b2c;--green:#1f9d68;--muted:#7a6f65;--blue:#315f91;--red:#b34848}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fff7eb,#f6efe6);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink)}main{max-width:960px;margin:auto;padding:18px 14px 112px}h1{font-size:28px;margin:4px 0 3px}h2{margin:8px 0}.sub{color:var(--muted);font-size:14px;margin-bottom:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 5px 18px #6a4b2b10}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}label{font-size:13px;font-weight:700;display:block;margin:8px 0 5px}input,textarea,select{width:100%;border:1px solid #d8c7b2;border-radius:12px;padding:12px;font-size:16px;background:#fff}textarea{min-height:160px;resize:vertical}button{border:0;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#fff}.green{background:var(--green);color:#fff}.blue{background:var(--blue);color:#fff}.red{background:var(--red);color:#fff}.ghost{background:#f5ede3;color:#4d4036}.quick{display:flex;gap:8px;overflow:auto;padding-bottom:3px}.quick button{white-space:nowrap}.notice{font-size:13px;line-height:1.55;background:#fff4d8;border:1px solid #ebcf8c;padding:11px;border-radius:12px}.status{font-size:14px;font-weight:700;margin-top:10px}.manga{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.panel{background:#111;border:3px solid #111;border-radius:10px;overflow:hidden;position:relative;min-height:320px}.panel img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:#eee}.placeholder{width:100%;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#eee7dc,#faf7f2);color:#75695f;padding:20px;text-align:center}.caption{background:#fff;padding:8px 10px;border-top:2px solid #111;font-size:13px;line-height:1.45}.dialogue{display:inline-block;background:#fff;border:2px solid #111;border-radius:20px;padding:7px 10px;margin:6px 0 2px;font-weight:800}.tools{display:flex;gap:6px;padding:8px;background:#fff}.tools button{font-size:12px;padding:8px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#f2e7d8;font-size:12px;font-weight:800}.hidden{display:none!important}.small{font-size:12px;color:var(--muted)}.chapterbar{display:flex;gap:7px;overflow:auto;padding:5px 0 10px;position:sticky;top:0;background:#fffaf2f2;z-index:7;backdrop-filter:blur(8px)}.chapterbar button{white-space:nowrap;padding:9px 11px;font-size:12px}.chapterTitle{grid-column:1/-1;background:#2a2520;color:#fff;border-radius:12px;padding:12px 14px;margin-top:8px}.chapterTitle b{font-size:17px}.chapterTitle span{display:block;font-size:12px;opacity:.8;margin-top:3px}.sheet{display:grid;grid-template-columns:180px 1fr;gap:14px;align-items:start}.sheet img{width:100%;border-radius:12px;border:2px solid #222}.progressWrap{height:12px;background:#eee4d8;border-radius:999px;overflow:hidden}.progress{height:100%;background:var(--green);width:0}.footerNav{position:fixed;left:0;right:0;bottom:0;padding:10px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:#fffdf8ef;border-top:1px solid #eadbc7;backdrop-filter:blur(12px);z-index:10}.footerNav>div{max-width:960px;margin:auto;display:flex;gap:8px}.footerNav button{flex:1;padding:10px 8px;font-size:13px}@media(max-width:640px){.manga{grid-template-columns:1fr}h1{font-size:25px}.panel{min-height:0}.sheet{grid-template-columns:1fr}.sheet img{max-width:220px}.chapterbar{top:0}}@media print{body{background:#fff}.card.input,.footerNav,.tools,.noPrint,.chapterbar{display:none!important}main{max-width:none;padding:0}.manga{gap:6px}.panel{break-inside:avoid}.caption{font-size:11px}.chapterTitle{break-after:avoid}}
</style>
</head><body><main>
<h1>📚 文学まんがAI</h1><div class="sub">短編4コマから、章立てした50コマ級の本格文学漫画まで。</div>
<section class="card input">
<div class="notice"><b>著作権について</b><br>青空文庫でも著作権保護中の作品があります。著作権切れ、または利用許諾・ライセンスを確認できる作品だけ漫画化してください。川端康成など保護期間中の作家は、権利確認なしでは漫画化を進めない仕様です。</div>
<label>すぐ試す（菊池寛）</label><div class="quick"><button class="ghost" onclick="quick('https://www.aozora.gr.jp/cards/000083/card496.html','菊池 寛','恩讐の彼方に')">恩讐の彼方に</button><button class="ghost" onclick="quick('https://www.aozora.gr.jp/cards/000083/card502.html','菊池 寛','父帰る')">父帰る</button><button class="ghost" onclick="quick('https://www.aozora.gr.jp/cards/000083/card4306.html','菊池 寛','形')">形</button></div>
<label>青空文庫の図書カードURL / XHTML URL</label><div class="row"><input id="url" placeholder="https://www.aozora.gr.jp/cards/..."><button class="primary" onclick="loadAozora()">本文を読み込む</button></div>
<div class="row"><div><label>作品名</label><input id="title"></div><div><label>著者</label><input id="author"></div></div>
<label>本文</label><textarea id="text" placeholder="本文を直接貼っても使えます"></textarea><div class="small" id="chars"></div>
<div class="row"><div><label>漫画の規模</label><select id="panels"><option value="4">4コマ・超短編</option><option value="8" selected>8コマ・短編</option><option value="16">16コマ・しっかり</option><option value="30">30コマ・本格漫画</option><option value="40">40コマ・長編</option><option value="50">50コマ・長編しっかり</option></select></div><div><label>漫画化の方向</label><select id="tone"><option>原作重視</option><option>初心者にも分かりやすく</option><option>ドラマチック</option><option>子どもにも読みやすく</option></select></div></div>
<div class="small">30コマ以上では、自動で章立てし、各章の役割と人物・衣装の連続性まで管理します。</div>
<label style="display:flex;gap:9px;align-items:flex-start;font-weight:600"><input id="rights" type="checkbox" style="width:auto;margin-top:3px">この作品は著作権切れ、または漫画化に必要な利用権・許諾を確認済みです。</label>
<button class="green" style="width:100%;margin-top:12px" onclick="makePlan()">✨ 漫画の構成を作る</button><div id="status" class="status"></div>
</section>
<section class="card noPrint">
<b>💾 保存した作品</b><div class="row" style="margin-top:8px"><select id="savedProjects"><option value="">保存作品を選ぶ</option></select><button class="blue" onclick="loadSaved()">続きを開く</button></div>
</section>
<section id="result" class="hidden">
<div class="card"><span class="badge">AI漫画構成</span><h2 id="mangaTitle"></h2><div id="subtitle" class="sub"></div><details><summary><b>登場人物・時代設定</b></summary><p id="bible" style="white-space:pre-wrap"></p></details></div>
<div class="card noPrint"><div class="sheet"><div id="characterSheetBox"><div class="placeholder" style="aspect-ratio:3/4">人物設定シート<br>未作成</div></div><div><h3 style="margin-top:0">人物を全コマで統一</h3><div class="small">長編では最初に人物設定シートを1枚作り、全コマが同じ見本を参照します。</div><button class="primary" style="margin-top:10px" onclick="makeCharacterSheet()">👥 人物設定シートを作る</button><button class="ghost" style="margin-top:10px" onclick="saveProject()">💾 今の状態を保存</button></div></div></div>
<div class="card noPrint"><div class="row"><div><b id="progressText">画像 0 / 0</b><div class="progressWrap" style="margin-top:8px"><div id="progress" class="progress"></div></div></div><button class="green" onclick="generateAll()">🎨 未作成コマを全部作る</button><button class="red hidden" id="pauseBtn" onclick="pauseGeneration()">■ 一時停止</button></div></div>
<div id="chapters" class="chapterbar"></div>
<div id="manga" class="manga"></div>
<div class="card noPrint"><button class="green" style="width:100%" onclick="generateAll()">🎨 未作成コマを全部作る</button><button class="ghost" style="width:100%;margin-top:8px" onclick="saveProject()">💾 途中保存</button><button class="ghost" style="width:100%;margin-top:8px" onclick="window.print()">🖨 PDF / 印刷</button></div>
</section>
</main>
<div class="footerNav hidden" id="footer"><div><button class="ghost" onclick="document.querySelector('.input').scrollIntoView({behavior:'smooth'})">設定</button><button class="ghost" onclick="saveProject()">保存</button><button class="primary" onclick="document.getElementById('result').scrollIntoView({behavior:'smooth'})">漫画へ</button></div></div>
<script>
const FN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/aozora-manga-ai';let plan=null,images={},characterRef='',projectId='',stopRequested=false;const $=id=>document.getElementById(id);
function setStatus(s,bad=false){$('status').textContent=s;$('status').style.color=bad?'#a93b3b':'#1f7a55'}async function api(body){const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'通信エラー');return d}function quick(url,author,title){$('url').value=url;$('author').value=author;$('title').value=title;loadAozora()}
async function loadAozora(){const u=$('url').value.trim();if(!u)return setStatus('青空文庫のURLを入れてください。',true);setStatus('📖 青空文庫から本文を読み込み中…');try{const d=await api({action:'loadAozora',url:u});const author=(d.author||$('author').value||'').replace(/\s/g,'');if(/川端康成/.test(author)&&!$('rights').checked){$('author').value=d.author||'川端康成';$('title').value=d.title||$('title').value;$('text').value='';$('chars').textContent='';return setStatus('⚠️ 川端康成は著作権保護期間中です。利用権・許諾を確認してチェックを入れた場合だけ本文を扱ってください。',true)}if(d.title&&!$('title').value)$('title').value=d.title;if(d.author&&!$('author').value)$('author').value=d.author;$('text').value=d.text;$('chars').textContent=`${d.chars.toLocaleString()}文字 読み込み済み`;setStatus('✅ 本文を読み込みました。')}catch(e){setStatus('⚠️ '+e.message,true)}}
function rightsCheck(){const a=$('author').value.replace(/\s/g,'');if(/川端康成/.test(a)&&!$('rights').checked){setStatus('川端康成は日本で著作権保護期間中です。権利を確認した本文だけ使用してください。',true);return false}if(!$('rights').checked){setStatus('著作権・利用権を確認したらチェックを入れてください。',true);return false}return true}
async function makePlan(){if(!rightsCheck())return;const text=$('text').value.trim();if(text.length<100)return setStatus('本文を100文字以上入れてください。',true);setStatus('🧠 AIが原作を読んで、章立てと漫画構成を作っています…');try{plan=await api({action:'makePlan',title:$('title').value,author:$('author').value,text,panels:+$('panels').value,tone:$('tone').value});images={};characterRef='';projectId='p'+Date.now();render();await saveProject(true);setStatus(`✅ ${plan.panels.length}コマの構成ができました。人物設定シートを作ると顔が安定します。`);$('result').scrollIntoView({behavior:'smooth'})}catch(e){setStatus('⚠️ '+e.message,true)}}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){if(!plan)return;$('result').classList.remove('hidden');$('footer').classList.remove('hidden');$('mangaTitle').textContent=plan.title||$('title').value;$('subtitle').textContent=plan.subtitle||'';$('bible').textContent=(plan.characterBible||'')+'\n\n'+(plan.settingBible||'');renderSheet();renderChapters();let html='',lastChapter=null;(plan.panels||[]).forEach((p,i)=>{if(p.chapter!==lastChapter){lastChapter=p.chapter;const ch=(plan.chapters||[]).find(c=>+c.no===+p.chapter);html+=`<div class="chapterTitle" id="chapter-${p.chapter}"><b>第${p.chapter||1}章 ${esc(ch?.title||'')}</b><span>${esc(ch?.purpose||'')}</span></div>`}html+=`<article class="panel" id="panel-${i}"><div id="img-${i}">${images[i]?`<img src="${images[i]}" alt="コマ${i+1}">`:`<div class="placeholder">コマ ${i+1}<br>${esc(p.scene||'')}</div>`}</div><div class="caption">${p.narration?`<div>${esc(p.narration)}</div>`:''}${p.dialogue?`<div class="dialogue">${esc(p.dialogue)}</div>`:''}</div><div class="tools"><button class="ghost" onclick="generatePanel(${i})">🎨 このコマ</button><button class="ghost" onclick="editPanel(${i})">✏️ 文を直す</button></div></article>`});$('manga').innerHTML=html;updateProgress()}
function renderSheet(){$('characterSheetBox').innerHTML=characterRef?`<img src="${characterRef}" alt="人物設定シート">`:`<div class="placeholder" style="aspect-ratio:3/4">人物設定シート<br>未作成</div>`}
function renderChapters(){$('chapters').innerHTML=(plan.chapters||[]).map(c=>`<button class="ghost" onclick="jumpChapter(${c.no})">第${c.no}章 ${esc(c.title||'')}</button>`).join('')}
function jumpChapter(n){document.getElementById('chapter-'+n)?.scrollIntoView({behavior:'smooth',block:'start'})}
async function makeCharacterSheet(){if(!plan)return;setStatus('👥 人物設定シートを作成中…');try{const d=await api({action:'makeCharacterSheet',characterBible:plan.characterBible,settingBible:plan.settingBible});characterRef=`data:${d.mimeType};base64,${d.data}`;renderSheet();await saveProject(true);setStatus('✅ 人物設定シートを作りました。全コマでこの顔を基準にします。')}catch(e){setStatus('⚠️ '+e.message,true)}}
async function generatePanel(i,quiet=false){if(!plan)return false;const p=plan.panels[i],box=$('img-'+i);box.innerHTML=`<div class="placeholder">🎨 コマ ${i+1} を描いています…</div>`;try{const prev=i>0?images[i-1]:'';const d=await api({action:'makePanel',prompt:p.imagePrompt,characterBible:plan.characterBible,settingBible:plan.settingBible,continuity:p.continuity||'',tone:$('tone').value,characterReference:characterRef||undefined,referenceImage:prev||undefined});images[i]=`data:${d.mimeType};base64,${d.data}`;box.innerHTML=`<img src="${images[i]}" alt="コマ${i+1}">`;updateProgress();await saveProject(true);if(!quiet)setStatus(`✅ コマ${i+1}を作りました。`);return true}catch(e){box.innerHTML=`<div class="placeholder">⚠️ ${esc(e.message)}</div>`;if(!quiet)setStatus('⚠️ '+e.message,true);return false}}
async function generateAll(){if(!plan)return;if(!characterRef){setStatus('まず人物設定シートを自動作成します…');await makeCharacterSheet();if(!characterRef)return}stopRequested=false;$('pauseBtn').classList.remove('hidden');const total=plan.panels.length;for(let i=0;i<total;i++){if(stopRequested)break;if(images[i])continue;setStatus(`🎨 全コマ作成中… ${i+1} / ${total}`);const ok=await generatePanel(i,true);if(!ok){setStatus(`⚠️ コマ${i+1}で止まりました。そこから再開できます。`,true);break}}$('pauseBtn').classList.add('hidden');await saveProject(true);if(stopRequested)setStatus('■ 一時停止しました。保存済みなので、あとで続きから再開できます。');else if(Object.keys(images).length===total)setStatus(`✅ 全${total}コマの画像が完成しました。`)}
function pauseGeneration(){stopRequested=true}
function updateProgress(){if(!plan)return;const done=Object.keys(images).filter(k=>images[k]).length,total=plan.panels.length;$('progressText').textContent=`画像 ${done} / ${total}`;$('progress').style.width=(total?done/total*100:0)+'%'}
function editPanel(i){const p=plan.panels[i];const n=prompt('ナレーション',p.narration||'');if(n===null)return;const d=prompt('セリフ',p.dialogue||'');if(d===null)return;p.narration=n;p.dialogue=d;render();saveProject(true);document.getElementById('panel-'+i)?.scrollIntoView({behavior:'smooth',block:'center'})}
function openDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open('literatureMangaAI',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('projects'))r.result.createObjectStore('projects',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function saveProject(silent=false){if(!plan)return;if(!projectId)projectId='p'+Date.now();try{const db=await openDb(),tx=db.transaction('projects','readwrite'),store=tx.objectStore('projects');store.put({id:projectId,title:$('title').value||plan.title||'作品',author:$('author').value,url:$('url').value,text:$('text').value,panels:$('panels').value,tone:$('tone').value,plan,images,characterRef,updatedAt:Date.now()});await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});await refreshSaved();if(!silent)setStatus('💾 途中状態を保存しました。')}catch(e){if(!silent)setStatus('⚠️ 保存できませんでした: '+e.message,true)}}
async function refreshSaved(){try{const db=await openDb(),tx=db.transaction('projects','readonly'),r=tx.objectStore('projects').getAll();const all=await new Promise((res,rej)=>{r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)});all.sort((a,b)=>b.updatedAt-a.updatedAt);$('savedProjects').innerHTML='<option value="">保存作品を選ぶ</option>'+all.map(x=>`<option value="${x.id}">${esc(x.title)}${x.author?' / '+esc(x.author):''}</option>`).join('')}catch{}}
async function loadSaved(){const id=$('savedProjects').value;if(!id)return;try{const db=await openDb(),tx=db.transaction('projects','readonly'),r=tx.objectStore('projects').get(id);const x=await new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});if(!x)return;projectId=x.id;plan=x.plan;images=x.images||{};characterRef=x.characterRef||'';$('title').value=x.title||'';$('author').value=x.author||'';$('url').value=x.url||'';$('text').value=x.text||'';$('panels').value=x.panels||'8';$('tone').value=x.tone||'原作重視';$('rights').checked=true;render();setStatus('✅ 保存した作品を開きました。未作成コマから続けられます。');$('result').scrollIntoView({behavior:'smooth'})}catch(e){setStatus('⚠️ 読み込み失敗: '+e.message,true)}}
refreshSaved();
</script></body></html>
