<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff7eb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="文学まんがAI"><title>文学まんがAI</title>
<style>
:root{--ink:#222;--paper:#fff9ef;--line:#e5d4bd;--orange:#e36b2c;--green:#16885b;--blue:#315f91;--red:#b44;--muted:#756d64}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fff7eb,#f5eee5);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink)}main{max-width:980px;margin:auto;padding:16px 12px 110px}h1{margin:4px 0;font-size:27px}.sub{font-size:13px;color:var(--muted);margin-bottom:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 5px 18px #5d442214}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}label{display:block;font-weight:800;font-size:13px;margin:8px 0 4px}input,textarea,select{width:100%;font-size:16px;padding:11px;border:1px solid #d7c4aa;border-radius:11px;background:white}textarea{min-height:145px}button{border:0;border-radius:11px;padding:11px 13px;font-weight:800;font-size:14px}.green{background:var(--green);color:white}.orange{background:var(--orange);color:white}.blue{background:var(--blue);color:white}.red{background:var(--red);color:white}.ghost{background:#f4ecdf;color:#493d32}.disabled,button:disabled{background:#bbb!important;color:#eee!important}.notice{font-size:12px;line-height:1.55;background:#fff3d8;border:1px solid #e8c982;border-radius:11px;padding:10px}.small{font-size:12px;color:var(--muted)}.hidden{display:none!important}.status{font-weight:800;font-size:13px;margin-top:9px}.sheet{display:grid;grid-template-columns:190px 1fr;gap:14px;align-items:start}.sheet img{width:100%;border-radius:10px;border:2px solid #222}.okbox{padding:10px;border-radius:10px;background:#edf9f3;border:1px solid #b7dfca;margin:9px 0}.chapterbar{display:flex;gap:6px;overflow:auto;position:sticky;top:0;z-index:8;background:#fffaf2ef;backdrop-filter:blur(10px);padding:7px 0}.chapterbar button{white-space:nowrap;font-size:12px;padding:8px 10px}.progressWrap{height:11px;background:#eadfce;border-radius:99px;overflow:hidden}.progress{height:100%;width:0;background:var(--green)}.viewSwitch{display:flex;gap:6px}.viewSwitch button{flex:1}.manga{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.panel{background:#111;border:3px solid #111;border-radius:8px;overflow:hidden;position:relative}.visual{position:relative;background:#eee;aspect-ratio:3/4}.visual img{width:100%;height:100%;object-fit:cover;display:block}.placeholder{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;color:#6e665f;background:linear-gradient(135deg,#eee8df,#faf8f4)}.bubble{position:absolute;max-width:72%;background:#fff;border:2px solid #111;border-radius:22px;padding:8px 11px;font-weight:800;font-size:13px;line-height:1.35;box-shadow:0 2px 4px #0002;top:5%;right:5%}.narr{position:absolute;left:5%;bottom:5%;max-width:90%;background:#fffc;border:1px solid #111;padding:6px 8px;font-size:12px;line-height:1.35}.tools{display:flex;gap:5px;padding:7px;background:white}.tools button{font-size:11px;padding:7px;flex:1}.chapterTitle{grid-column:1/-1;background:#28231f;color:white;border-radius:10px;padding:10px 12px}.chapterTitle b{font-size:16px}.chapterTitle span{display:block;font-size:11px;opacity:.78;margin-top:2px}.book{display:grid;gap:16px}.bookPage{background:#fff;border:1px solid #ccc;box-shadow:0 4px 18px #0001;aspect-ratio:148/210;padding:10px;display:grid;gap:6px;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;direction:rtl}.bookPage .panel{direction:ltr}.bookPage .tools{display:none}.bookPage .bubble{font-size:10px}.bookPage .narr{font-size:9px}.pageNo{grid-column:1/-1;text-align:center;font-size:10px;color:#666;direction:ltr}.footerNav{position:fixed;left:0;right:0;bottom:0;background:#fffdf8ee;border-top:1px solid var(--line);backdrop-filter:blur(12px);z-index:20;padding:9px 10px calc(9px + env(safe-area-inset-bottom))}.footerNav>div{max-width:980px;margin:auto;display:flex;gap:7px}.footerNav button{flex:1;padding:10px 6px;font-size:12px}@media(max-width:640px){.manga{grid-template-columns:1fr}.sheet{grid-template-columns:1fr}.sheet img{max-width:220px}.bookPage{aspect-ratio:auto;min-height:640px}.bubble{font-size:12px}}@media print{body{background:white}.input,.noPrint,.footerNav,.chapterbar,.tools{display:none!important}main{max-width:none;padding:0}.book{display:block}.bookPage{page-break-after:always;box-shadow:none;border:0;width:100%;height:100vh}.manga{display:none!important}}
</style></head><body><main>
<h1>📚 文学まんがAI</h1><div class="sub">青空文庫の文学を、章立て・人物統一・漫画ページまで自動化。</div>
<section class="card input"><div class="notice"><b>著作権</b><br>著作権切れ、または必要な利用権・許諾を確認できる作品だけ漫画化してください。川端康成など保護中の作品は権利確認が必要です。</div>
<label>青空文庫URL</label><div class="row"><input id="url" placeholder="https://www.aozora.gr.jp/cards/..."><button class="orange" onclick="loadAozora()">本文を読み込む</button></div>
<div class="row"><div><label>作品名</label><input id="title"></div><div><label>著者</label><input id="author"></div></div><label>本文</label><textarea id="text"></textarea><div class="small" id="chars"></div>
<div class="row"><div><label>漫画の規模</label><select id="panels"><option value="4">4コマ</option><option value="8">8コマ</option><option value="16">16コマ</option><option value="30" selected>30コマ・本格</option><option value="40">40コマ・長編</option><option value="50">50コマ・長編</option></select></div><div><label>方向</label><select id="tone"><option>原作重視</option><option>初心者にも分かりやすく</option><option>ドラマチック</option><option>子どもにも読みやすく</option></select></div></div>
<label style="display:flex;gap:8px;align-items:flex-start;font-weight:600"><input id="rights" type="checkbox" style="width:auto;margin-top:3px">著作権切れ、または必要な利用権・許諾を確認済みです。</label><button class="green" style="width:100%;margin-top:10px" onclick="makePlan()">✨ 漫画構成を作る</button><div id="status" class="status"></div></section>
<section class="card noPrint"><b>💾 保存した作品</b><div class="row" style="margin-top:8px"><select id="savedProjects"><option value="">選択</option></select><button class="blue" onclick="loadSaved()">続きを開く</button></div></section>
<section id="result" class="hidden"><div class="card"><span class="small">AI漫画構成</span><h2 id="mangaTitle"></h2><div id="subtitle" class="sub"></div><details><summary><b>人物・時代設定</b></summary><pre id="bible" style="white-space:pre-wrap;font-family:inherit"></pre></details></div>
<div class="card noPrint"><div class="sheet"><div id="characterSheetBox"><div class="placeholder" style="aspect-ratio:3/4">人物設定シート<br>未作成</div></div><div><h3 style="margin-top:0">① 人物を固定する</h3><div class="small">本編を描く前に人物設定シートを確認します。</div><button class="orange" style="margin-top:8px" onclick="makeCharacterSheet()">👥 人物設定シートを作る</button><div id="approveBox" class="okbox hidden"><b>この人物で本編を作りますか？</b><div class="row" style="margin-top:8px"><button class="green" onclick="approveCharacters()">✅ この顔でOK</button><button class="ghost" onclick="makeCharacterSheet()">🔄 作り直す</button></div></div><div id="approvedMsg" class="okbox hidden">✅ 人物設定を承認済み。本編生成できます。</div></div></div></div>
<div class="card noPrint"><h3 style="margin-top:0">② 本編を作る</h3><div id="progressText"><b>画像 0 / 0</b></div><div class="progressWrap" style="margin:8px 0"><div id="progress" class="progress"></div></div><div class="row"><button id="allBtn" class="disabled" disabled onclick="generateAll()">🎨 未作成コマを全部作る</button><button id="pauseBtn" class="red hidden" onclick="pauseGeneration()">■ 一時停止</button></div><div class="small" id="gateText">人物設定シートを承認すると押せます。</div></div>
<div class="card noPrint"><div class="viewSwitch"><button id="editViewBtn" class="blue" onclick="setView('edit')">編集表示</button><button id="bookViewBtn" class="ghost" onclick="setView('book')">📖 漫画本表示</button></div><div class="small" style="margin-top:6px">漫画本表示は右→左読み、1ページ4コマでPDF向けに整えます。</div></div>
<div id="chapters" class="chapterbar"></div><div id="manga" class="manga"></div><div id="book" class="book hidden"></div>
<div class="card noPrint"><button class="ghost" style="width:100%" onclick="saveProject()">💾 途中保存</button><button class="green" style="width:100%;margin-top:7px" onclick="setView('book');window.print()">🖨 漫画本PDF / 印刷</button></div></section>
</main><div class="footerNav hidden" id="footer"><div><button class="ghost" onclick="document.querySelector('.input').scrollIntoView({behavior:'smooth'})">設定</button><button class="ghost" onclick="saveProject()">保存</button><button class="blue" onclick="setView('book')">漫画本</button><button class="orange" onclick="document.getElementById('result').scrollIntoView({behavior:'smooth'})">漫画へ</button></div></div>
<script>
const FN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/aozora-manga-ai';const $=id=>document.getElementById(id);let plan=null,images={},characterRef='',charactersApproved=false,projectId='',stopRequested=false,currentView='edit';
function status(s,bad=false){$('status').textContent=s;$('status').style.color=bad?'#a33':'#176b4a'}async function api(body){const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'通信エラー');return d}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[m]))}
async function loadAozora(){const u=$('url').value.trim();if(!u)return status('URLを入れてください',true);status('📖 本文を読み込み中…');try{const d=await api({action:'loadAozora',url:u});const a=(d.author||'').replace(/\s/g,'');if(/川端康成/.test(a)&&!$('rights').checked){$('author').value=d.author||'';$('title').value=d.title||'';$('text').value='';return status('⚠️ 川端康成は保護期間中です。権利確認後に使用してください。',true)}$('title').value=d.title||$('title').value;$('author').value=d.author||$('author').value;$('text').value=d.text;$('chars').textContent=`${d.chars.toLocaleString()}文字`;status('✅ 読み込みました')}catch(e){status('⚠️ '+e.message,true)}}
function rightsOK(){if(!$('rights').checked){status('著作権・利用権を確認してチェックしてください。',true);return false}return true}async function makePlan(){if(!rightsOK())return;const text=$('text').value.trim();if(text.length<100)return status('本文を100文字以上入れてください。',true);status('🧠 章立てと漫画構成を作っています…');try{plan=await api({action:'makePlan',title:$('title').value,author:$('author').value,text,panels:+$('panels').value,tone:$('tone').value});images={};characterRef='';charactersApproved=false;projectId='p'+Date.now();render();await saveProject(true);status(`✅ ${plan.panels.length}コマ構成ができました。次に人物設定シートを作ってください。`);$('result').scrollIntoView({behavior:'smooth'})}catch(e){status('⚠️ '+e.message,true)}}
function chapters(){return Array.isArray(plan?.chapters)&&plan.chapters.length?plan.chapters:[{no:1,title:'本編',purpose:'物語全体'}]}function chapterFor(n){return chapters().find(c=>Number(c.no)===Number(n))||chapters()[0]}
function render(){if(!plan)return;$('result').classList.remove('hidden');$('footer').classList.remove('hidden');$('mangaTitle').textContent=plan.title||$('title').value;$('subtitle').textContent=plan.subtitle||'';$('bible').textContent=(plan.characterBible||'')+'\n\n'+(plan.settingBible||'');$('chapters').innerHTML=chapters().map(c=>`<button class="ghost" onclick="jumpChapter(${c.no})">第${c.no}章 ${esc(c.title||'')}</button>`).join('');let last=null,html='';(plan.panels||[]).forEach((p,i)=>{if(p.chapter!==last){const c=chapterFor(p.chapter);html+=`<div class="chapterTitle" id="chapter-${p.chapter}"><b>第${c.no}章 ${esc(c.title||'')}</b><span>${esc(c.purpose||'')}</span></div>`;last=p.chapter}html+=panelHtml(p,i,false)});$('manga').innerHTML=html;renderCharacter();updateGate();updateProgress();renderBook()}
function panelHtml(p,i,book){const src=images[i];return `<article class="panel" id="panel-${i}"><div class="visual">${src?`<img src="${src}" alt="コマ${i+1}">`:`<div class="placeholder">コマ ${i+1}<br>${esc(p.scene||'')}</div>`}${p.dialogue?`<div class="bubble">${esc(p.dialogue)}</div>`:''}${p.narration?`<div class="narr">${esc(p.narration)}</div>`:''}</div>${book?'':`<div class="tools"><button class="ghost" onclick="generatePanel(${i})">🎨 描く</button><button class="ghost" onclick="editPanel(${i})">✏️ 文</button></div>`}</article>`}
function renderBook(){if(!plan)return;const ps=plan.panels||[];let out='';for(let i=0,page=1;i<ps.length;i+=4,page++){out+=`<section class="bookPage">`;for(let j=0;j<4&&i+j<ps.length;j++)out+=panelHtml(ps[i+j],i+j,true);out+=`<div class="pageNo">${page}</div></section>`}$('book').innerHTML=out}
function renderCharacter(){if(characterRef)$('characterSheetBox').innerHTML=`<img src="${characterRef}" alt="人物設定シート">`;else $('characterSheetBox').innerHTML='<div class="placeholder" style="aspect-ratio:3/4">人物設定シート<br>未作成</div>';$('approveBox').classList.toggle('hidden',!characterRef||charactersApproved);$('approvedMsg').classList.toggle('hidden',!charactersApproved)}
async function makeCharacterSheet(){if(!plan)return;charactersApproved=false;updateGate();$('characterSheetBox').innerHTML='<div class="placeholder" style="aspect-ratio:3/4">👥 人物設定シートを作成中…</div>';try{const d=await api({action:'makeCharacterSheet',characterBible:plan.characterBible,settingBible:plan.settingBible});characterRef=`data:${d.mimeType};base64,${d.data}`;renderCharacter();await saveProject(true)}catch(e){$('characterSheetBox').innerHTML=`<div class="placeholder">⚠️ ${esc(e.message)}</div>`}}
async function approveCharacters(){charactersApproved=true;renderCharacter();updateGate();await saveProject(true)}function updateGate(){const b=$('allBtn');if(!b)return;b.disabled=!charactersApproved;b.className=charactersApproved?'green':'disabled';$('gateText').textContent=charactersApproved?'人物承認済み。未作成コマを順番に生成できます。':'人物設定シートを承認すると押せます。'}
async function generatePanel(i){if(!plan)return;if(!characterRef)return status('先に人物設定シートを作ってください。',true);const p=plan.panels[i];const box=document.querySelector(`#panel-${i} .visual`);if(box&&!images[i])box.innerHTML='<div class="placeholder">🎨 描画中…</div>';try{const ref=i>0?images[i-1]:null;const d=await api({action:'makePanel',prompt:p.imagePrompt,characterBible:plan.characterBible,settingBible:plan.settingBible,continuity:p.continuity,tone:$('tone').value,characterReference:characterRef,referenceImage:ref||undefined});images[i]=`data:${d.mimeType};base64,${d.data}`;render();await saveProject(true);return true}catch(e){render();status(`⚠️ コマ${i+1}: ${e.message}`,true);return false}}
async function generateAll(){if(!charactersApproved)return status('人物設定シートを承認してください。',true);stopRequested=false;$('pauseBtn').classList.remove('hidden');for(let i=0;i<plan.panels.length;i++){if(stopRequested)break;if(images[i])continue;status(`🎨 ${i+1}/${plan.panels.length} コマを作成中…`);await generatePanel(i)}$('pauseBtn').classList.add('hidden');status(stopRequested?'⏸ 一時停止しました。ここまで保存済みです。':'✅ 未作成コマの生成が完了しました。')}function pauseGeneration(){stopRequested=true}
function updateProgress(){if(!plan)return;const done=Object.keys(images).length,total=plan.panels.length;$('progressText').innerHTML=`<b>画像 ${done} / ${total}</b>`;$('progress').style.width=`${total?done/total*100:0}%`}
function editPanel(i){const p=plan.panels[i];const n=prompt('ナレーション',p.narration||'');if(n===null)return;const d=prompt('セリフ',p.dialogue||'');if(d===null)return;p.narration=n;p.dialogue=d;render();saveProject(true)}function jumpChapter(n){document.getElementById('chapter-'+n)?.scrollIntoView({behavior:'smooth',block:'start'})}function setView(v){currentView=v;$('manga').classList.toggle('hidden',v==='book');$('book').classList.toggle('hidden',v!=='book');$('editViewBtn').className=v==='edit'?'blue':'ghost';$('bookViewBtn').className=v==='book'?'blue':'ghost'}
function openDB(){return new Promise((res,rej)=>{const q=indexedDB.open('literatureMangaDB',2);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('projects'))q.result.createObjectStore('projects',{keyPath:'id'})};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}async function saveProject(silent=false){if(!plan)return;const db=await openDB();const tx=db.transaction('projects','readwrite');tx.objectStore('projects').put({id:projectId||('p'+Date.now()),title:plan.title||$('title').value,plan,images,characterRef,charactersApproved,tone:$('tone').value,author:$('author').value,updated:Date.now()});await new Promise((r,j)=>{tx.oncomplete=r;tx.onerror=()=>j(tx.error)});await refreshSaved();if(!silent)status('💾 保存しました')}
async function refreshSaved(){try{const db=await openDB();const tx=db.transaction('projects');const req=tx.objectStore('projects').getAll();const all=await new Promise((r,j)=>{req.onsuccess=()=>r(req.result);req.onerror=()=>j(req.error)});$('savedProjects').innerHTML='<option value="">保存作品を選ぶ</option>'+all.sort((a,b)=>b.updated-a.updated).map(x=>`<option value="${x.id}">${esc(x.title)} (${new Date(x.updated).toLocaleDateString('ja-JP')})</option>`).join('')}catch{}}
async function loadSaved(){const id=$('savedProjects').value;if(!id)return;const db=await openDB();const tx=db.transaction('projects');const req=tx.objectStore('projects').get(id);const p=await new Promise((r,j)=>{req.onsuccess=()=>r(req.result);req.onerror=()=>j(req.error)});if(!p)return;projectId=p.id;plan=p.plan;images=p.images||{};characterRef=p.characterRef||'';charactersApproved=!!p.charactersApproved;$('tone').value=p.tone||'原作重視';$('author').value=p.author||'';render();$('result').scrollIntoView({behavior:'smooth'})}
window.addEventListener('load',refreshSaved)
</script></body></html>
