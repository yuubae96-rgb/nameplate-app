<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7eb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="文学まんがAI">
<title>文学まんがAI</title>
<style>
:root{--ink:#1f2430;--paper:#fffaf2;--card:#fff;--line:#eadbc7;--accent:#e36b2c;--green:#1f9d68;--muted:#7a6f65}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fff7eb,#f6efe6);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink)}main{max-width:920px;margin:auto;padding:18px 14px 100px}h1{font-size:28px;margin:4px 0 3px}.sub{color:var(--muted);font-size:14px;margin-bottom:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 5px 18px #6a4b2b10}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}label{font-size:13px;font-weight:700;display:block;margin:8px 0 5px}input,textarea,select{width:100%;border:1px solid #d8c7b2;border-radius:12px;padding:12px;font-size:16px;background:#fff}textarea{min-height:160px;resize:vertical}button{border:0;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#fff}.green{background:var(--green);color:#fff}.ghost{background:#f5ede3;color:#4d4036}.quick{display:flex;gap:8px;overflow:auto;padding-bottom:3px}.quick button{white-space:nowrap}.notice{font-size:13px;line-height:1.55;background:#fff4d8;border:1px solid #ebcf8c;padding:11px;border-radius:12px}.status{font-size:14px;font-weight:700;margin-top:10px}.manga{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.panel{background:#111;border:3px solid #111;border-radius:10px;overflow:hidden;position:relative;min-height:320px}.panel img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:#eee}.placeholder{width:100%;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#eee7dc,#faf7f2);color:#75695f;padding:20px;text-align:center}.caption{background:#fff;padding:8px 10px;border-top:2px solid #111;font-size:13px;line-height:1.45}.dialogue{display:inline-block;background:#fff;border:2px solid #111;border-radius:20px;padding:7px 10px;margin:6px 0 2px;font-weight:800}.tools{display:flex;gap:6px;padding:8px;background:#fff}.tools button{font-size:12px;padding:8px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#f2e7d8;font-size:12px;font-weight:800}.hidden{display:none!important}.footerNav{position:fixed;left:0;right:0;bottom:0;padding:10px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:#fffdf8ef;border-top:1px solid #eadbc7;backdrop-filter:blur(12px)}.footerNav>div{max-width:920px;margin:auto;display:flex;gap:8px}.footerNav button{flex:1}.small{font-size:12px;color:var(--muted)}@media(max-width:640px){.manga{grid-template-columns:1fr}h1{font-size:25px}.panel{min-height:0}}@media print{body{background:#fff}.card.input,.footerNav,.tools,.noPrint{display:none!important}main{max-width:none;padding:0}.manga{gap:6px}.panel{break-inside:avoid}.caption{font-size:11px}}
</style>
</head><body><main>
<h1>📚 文学まんがAI</h1><div class="sub">青空文庫などの文学作品を、AIが漫画のコマ構成に変換します。</div>
<section class="card input">
<div class="notice"><b>著作権について</b><br>青空文庫でも著作権保護中の作品があります。著作権切れ、または利用許諾・ライセンスを確認できる作品だけ漫画化してください。川端康成など保護期間中の作家は、権利確認なしでは漫画化を進めない仕様です。</div>
<label>すぐ試す（菊池寛）</label><div class="quick"><button class="ghost" onclick="quick('https://www.aozora.gr.jp/cards/000083/card496.html','菊池 寛','恩讐の彼方に')">恩讐の彼方に</button><button class="ghost" onclick="quick('https://www.aozora.gr.jp/cards/000083/card502.html','菊池 寛','父帰る')">父帰る</button><button class="ghost" onclick="quick('https://www.aozora.gr.jp/cards/000083/card4306.html','菊池 寛','形')">形</button></div>
<label>青空文庫の図書カードURL / XHTML URL</label><div class="row"><input id="url" placeholder="https://www.aozora.gr.jp/cards/..."><button class="primary" onclick="loadAozora()">本文を読み込む</button></div>
<div class="row"><div><label>作品名</label><input id="title"></div><div><label>著者</label><input id="author"></div></div>
<label>本文</label><textarea id="text" placeholder="本文を直接貼っても使えます"></textarea><div class="small" id="chars"></div>
<div class="row"><div><label>コマ数</label><select id="panels"><option value="4">4コマ</option><option value="8" selected>8コマ</option><option value="16">16コマ</option></select></div><div><label>漫画化の方向</label><select id="tone"><option>原作重視</option><option>初心者にも分かりやすく</option><option>ドラマチック</option><option>子どもにも読みやすく</option></select></div></div>
<label style="display:flex;gap:9px;align-items:flex-start;font-weight:600"><input id="rights" type="checkbox" style="width:auto;margin-top:3px">この作品は著作権切れ、または漫画化に必要な利用権・許諾を確認済みです。</label>
<button class="green" style="width:100%;margin-top:12px" onclick="makePlan()">✨ 漫画のコマ構成を作る</button><div id="status" class="status"></div>
</section>
<section id="result" class="hidden"><div class="card"><span class="badge">AI漫画構成</span><h2 id="mangaTitle"></h2><div id="subtitle" class="sub"></div><details><summary><b>登場人物・時代設定</b></summary><p id="bible"></p></details></div><div id="manga" class="manga"></div><div class="card noPrint"><button class="green" style="width:100%" onclick="generateAll()">🎨 全コマの絵を作る</button><button class="ghost" style="width:100%;margin-top:8px" onclick="window.print()">🖨 PDF / 印刷</button></div></section>
</main><div class="footerNav hidden" id="footer"><div><button class="ghost" onclick="document.querySelector('.input').scrollIntoView({behavior:'smooth'})">設定へ</button><button class="primary" onclick="document.getElementById('result').scrollIntoView({behavior:'smooth'})">漫画へ</button></div></div>
<script>
const FN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/aozora-manga-ai';let plan=null;const $=id=>document.getElementById(id);function setStatus(s,bad=false){$('status').textContent=s;$('status').style.color=bad?'#a93b3b':'#1f7a55'}async function api(body){const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'通信エラー');return d}function quick(url,author,title){$('url').value=url;$('author').value=author;$('title').value=title;loadAozora()}
async function loadAozora(){const u=$('url').value.trim();if(!u)return setStatus('青空文庫のURLを入れてください。',true);setStatus('📖 青空文庫から本文を読み込み中…');try{const d=await api({action:'loadAozora',url:u});const author=(d.author||$('author').value||'').replace(/\s/g,'');if(/川端康成/.test(author)&&!$('rights').checked){$('author').value=d.author||'川端康成';$('title').value=d.title||$('title').value;$('text').value='';$('chars').textContent='';return setStatus('⚠️ 川端康成は著作権保護期間中です。利用権・許諾を確認してチェックを入れた場合だけ本文を扱ってください。',true)}if(d.title&&!$('title').value)$('title').value=d.title;if(d.author&&!$('author').value)$('author').value=d.author;$('text').value=d.text;$('chars').textContent=`${d.chars.toLocaleString()}文字 読み込み済み`;setStatus('✅ 本文を読み込みました。')}catch(e){setStatus('⚠️ '+e.message,true)}}
function rightsCheck(){const a=$('author').value.replace(/\s/g,'');if(/川端康成/.test(a)&&!$('rights').checked){setStatus('川端康成は日本で著作権保護期間中です。権利を確認した本文だけ使用し、確認欄にチェックしてください。',true);return false}if(!$('rights').checked){setStatus('著作権・利用権を確認したらチェックを入れてください。',true);return false}return true}
async function makePlan(){if(!rightsCheck())return;const text=$('text').value.trim();if(text.length<100)return setStatus('本文を100文字以上入れてください。',true);setStatus('🧠 AIが原作を読んで、漫画の場面に分けています…');try{plan=await api({action:'makePlan',title:$('title').value,author:$('author').value,text,panels:+$('panels').value,tone:$('tone').value});render();setStatus('✅ コマ構成ができました。下で確認できます。');$('result').scrollIntoView({behavior:'smooth'})}catch(e){setStatus('⚠️ '+e.message,true)}}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){if(!plan)return;$('result').classList.remove('hidden');$('footer').classList.remove('hidden');$('mangaTitle').textContent=plan.title||$('title').value;$('subtitle').textContent=plan.subtitle||'';$('bible').textContent=(plan.characterBible||'')+'\n\n'+(plan.settingBible||'');$('manga').innerHTML=(plan.panels||[]).map((p,i)=>`<article class="panel" id="panel-${i}"><div class="placeholder" id="img-${i}">コマ ${i+1}<br>${esc(p.scene||'')}</div><div class="caption">${p.narration?`<div>${esc(p.narration)}</div>`:''}${p.dialogue?`<div class="dialogue">${esc(p.dialogue)}</div>`:''}</div><div class="tools"><button class="ghost" onclick="generatePanel(${i})">🎨 このコマ</button><button class="ghost" onclick="editPanel(${i})">✏️ 文を直す</button></div></article>`).join('')}
async function generatePanel(i){const p=plan.panels[i],box=$('img-'+i);box.className='placeholder';box.textContent=`🎨 コマ ${i+1} を描いています…`;try{const ref=i>0?document.querySelector('#img-'+(i-1)+' img')?.src:null;const d=await api({action:'makePanel',prompt:p.imagePrompt,characterBible:plan.characterBible,settingBible:plan.settingBible,tone:$('tone').value,referenceImage:ref||undefined});const src=`data:${d.mimeType};base64,${d.data}`;box.outerHTML=`<div id="img-${i}"><img src="${src}" alt="コマ${i+1}"></div>`}catch(e){box.textContent='⚠️ '+e.message}}async function generateAll(){for(let i=0;i<(plan.panels||[]).length;i++)await generatePanel(i)}function editPanel(i){const p=plan.panels[i];const n=prompt('ナレーション',p.narration||'');if(n===null)return;const d=prompt('セリフ',p.dialogue||'');if(d===null)return;p.narration=n;p.dialogue=d;render();document.getElementById('panel-'+i)?.scrollIntoView({behavior:'smooth',block:'center'})}
</script></body></html>
