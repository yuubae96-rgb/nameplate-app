<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-title" content="文学漫画Codex実行"><title>文学まんがAI Codex実行</title><style>*{box-sizing:border-box}body{margin:0;background:#f4eee5;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#222}.top{position:sticky;top:0;z-index:20;background:#fffdf8ee;backdrop-filter:blur(12px);border-bottom:1px solid #e7d7c2;padding:10px 12px}.wrap{max-width:980px;margin:auto}.status{font-weight:800;font-size:14px}.sub{font-size:12px;color:#756d64;margin-top:3px}.bar{height:9px;background:#e8ded2;border-radius:999px;overflow:hidden;margin-top:7px}.fill{height:100%;width:0;background:#16885b;transition:.25s}.actions{display:flex;gap:7px;margin-top:8px}.actions button{flex:1;border:0;border-radius:10px;padding:9px;font-weight:800}.green{background:#16885b;color:#fff}.ghost{background:#eee4d7}.frameWrap{max-width:1000px;margin:10px auto;padding:0 8px}iframe{width:100%;height:calc(100vh - 128px);border:1px solid #dac7af;border-radius:14px;background:#fff}@media(max-width:600px){iframe{height:calc(100vh - 146px)}.actions{flex-wrap:wrap}.actions button{min-width:46%}}</style></head><body><div class="top"><div class="wrap"><div id="status" class="status">Codexモードを準備中…</div><div id="sub" class="sub">作品URLと権利確認情報を受け取り、人物確認まで自動で進めます。</div><div class="bar"><div id="fill" class="fill"></div></div><div class="actions"><button class="ghost" onclick="showCharacters()">👥 人物を確認</button><button class="green" id="continueBtn" onclick="continueAfterApproval()">▶ 承認後の生成を続ける</button></div></div></div><div class="frameWrap"><iframe id="app" src="aozora-manga.html?v=codexrunner1"></iframe></div><script>const q=new URLSearchParams(location.search),frame=document.getElementById('app');const sourceUrl=q.get('url')||'',panels=q.get('panels')||'30',tone=q.get('tone')||'原作重視',rights=q.get('rights')==='1',auto=q.get('auto')!=='0';let stage='boot',batchStarted=false,finished=false;const sleep=ms=>new Promise(r=>setTimeout(r,ms));function setStatus(a,b='',p=0){document.getElementById('status').textContent=a;document.getElementById('sub').textContent=b;document.getElementById('fill').style.width=Math.max(0,Math.min(100,p))+'%'}function doc(){return frame.contentDocument}function win(){return frame.contentWindow}function el(id){return doc()?.getElementById(id)}async function waitFor(fn,timeout=180000,step=700){const start=Date.now();while(Date.now()-start<timeout){try{const v=fn();if(v)return v}catch{}await sleep(step)}throw new Error('処理待ちがタイムアウトしました')}async function start(){try{await waitFor(()=>el('url'));if(!sourceUrl){setStatus('青空文庫URLがありません','Codexは正規の青空文庫URLを特定してから、この実行画面を開いてください。',0);return}if(!rights){setStatus('権利確認待ち','rights=1 がありません。著作権切れまたは利用許諾を確認してから実行してください。',0);return}el('url').value=sourceUrl;el('panels').value=panels;el('tone').value=tone;el('rights').checked=true;stage='load';setStatus('① 原作本文を取得中…',sourceUrl,10);await win().loadAozora();await waitFor(()=>el('text')?.value?.trim().length>100,90000);stage='plan';setStatus('② 漫画構成を作成中…',`${panels}コマ・${tone}`,25);await win().makePlan();await waitFor(()=>!el('result')?.classList.contains('hidden'),180000);stage='character';setStatus('③ 人物設定シートを作成中…','本編の前に主人公たちの顔を固定します。',42);await win().makeCharacterSheet();await waitFor(()=>!el('approveBox')?.classList.contains('hidden'),180000);stage='approval';setStatus('④ 人物確認をお願いします','下の画面で「この顔でOK」または「作り直す」を選んでください。OK後は自動で本編生成へ進みます。',50);showCharacters();watchApproval()}catch(e){setStatus('⚠️ 自動進行で停止しました',String(e.message||e),0)}}function showCharacters(){try{el('characterSheetBox')?.scrollIntoView({behavior:'smooth',block:'center'})}catch{}}async function watchApproval(){while(stage==='approval'&&!finished){if(!el('approvedMsg')?.classList.contains('hidden')){stage='approved';setStatus('⑤ 人物承認済み','本編生成を開始します。',55);if(auto)await continueAfterApproval();return}await sleep(800)}}async function continueAfterApproval(){if(batchStarted||finished)return;if(el('approvedMsg')?.classList.contains('hidden')){setStatus('人物の承認がまだです','下の画面で「この顔でOK」を押してください。',50);showCharacters();return}batchStarted=true;stage='batch';try{setStatus('⑥ 本編を自動生成中…','完成済みコマは飛ばし、未作成だけ順番に作ります。',60);const promise=win().generateAll();while(true){const txt=el('progressText')?.textContent||'';const m=txt.match(/(\d+)\s*\/\s*(\d+)/);if(m){const done=+m[1],total=Math.max(1,+m[2]);setStatus(`⑥ 本編を自動生成中… ${done}/${total}`, 'iPhoneを閉じず、この画面を開いたままにしてください。',60+Math.round(done/total*32));if(done>=total)break}if(el('pauseBtn')?.classList.contains('hidden')&&m&&+m[1]>0&&+m[1]<+m[2])break;await sleep(1200)}await Promise.resolve(promise);const txt=el('progressText')?.textContent||'',m=txt.match(/(\d+)\s*\/\s*(\d+)/);if(m&&+m[1]>=+m[2]){finished=true;stage='done';try{win().setView('book')}catch{}setStatus('✅ 漫画本まで完成しました','「漫画本PDF / 印刷」でPDF化できます。',100)}else{batchStarted=false;stage='paused';setStatus('一時停止しました','もう一度「承認後の生成を続ける」を押すと未作成から再開します。',65)}}catch(e){batchStarted=false;setStatus('⚠️ 本編生成で停止しました',String(e.message||e)+'　再開すると未作成コマから続けます。',65)}}frame.addEventListener('load',()=>{if(auto)start()});</script></body></html>
