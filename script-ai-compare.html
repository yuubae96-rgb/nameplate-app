<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>脚本AI比較</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#17213a;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:1000px;margin:auto}.head{background:#172239;color:white;padding:calc(14px + env(safe-area-inset-top)) 16px 14px}.head h1{font-size:20px;margin:0}.main{padding:12px}.card,.pane{background:#fff;border:1px solid #d7dde6;border-radius:16px;padding:14px;margin-bottom:12px}label{display:block;font-size:13px;font-weight:800;color:#667188;margin-bottom:6px}input,select{width:100%;border:1px solid #cfd6e0;border-radius:11px;padding:12px;font-size:16px}.row{display:grid;grid-template-columns:1fr 120px;gap:8px}.btn{width:100%;border:0;border-radius:12px;padding:13px;font-weight:900;font-size:15px;background:#e44945;color:white;margin-top:10px}.status{font-size:12px;color:#667188;margin-top:8px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pane h2{margin:0 0 4px;font-size:20px}.meta{font-size:12px;color:#667188;margin-bottom:10px}.summary{font-size:14px;line-height:1.6;background:#f7f8fa;padding:10px;border-radius:10px;margin-bottom:10px}.scene{border-top:1px solid #e6e9ee;padding:11px 0}.scene:first-of-type{border-top:0}.scene h3{font-size:15px;margin:0 0 6px}.lab{font-size:11px;font-weight:900;color:#788398;margin-top:7px}.txt{font-size:13px;line-height:1.55;white-space:pre-wrap}.prompt{background:#f6f8fb;border-radius:9px;padding:8px}.fact{color:#7a5a18}.back{display:block;text-align:center;color:#344a75;padding:14px;text-decoration:none}@media(max-width:700px){.compare{grid-template-columns:1fr}.row{grid-template-columns:1fr 100px}}</style></head><body><div class="app"><header class="head"><h1>📝 OpenAI / Gemini 脚本・画像指示 比較</h1></header><main class="main"><section class="card"><div style="font-size:13px;line-height:1.6;background:#fff7df;padding:10px;border-radius:10px">一時テストです。現在のYouTube動画作成アプリは変更していません。同じ条件で脚本と画像指示だけを比較します。</div><div class="row" style="margin-top:12px"><div><label>テーマ</label><input id="topic" value="坂本龍馬の人生"></div><div><label>動画時間</label><select id="minutes"><option value="1">1分</option><option value="3" selected>3分</option><option value="5">5分</option></select></div></div><button class="btn" id="go">同じテーマでOpenAIとGeminiを比較</button><div id="status" class="status">まだ生成していません。</div></section><section class="compare"><div class="pane"><h2>OpenAI</h2><div id="ometa" class="meta">GPT-5.6 Terra</div><div id="openai">まだ生成していません</div></div><div class="pane"><h2>Gemini</h2><div id="gmeta" class="meta">Gemini 3.8 Flash</div><div id="gemini">まだ生成していません</div></div></section><a class="back" href="youtube-video.html">← YouTube動画作成へ戻る</a></main></div><script>const FN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/script-ai-compare';const $=x=>document.getElementById(x);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(d){if(!d)return '生成できませんでした';let h='<div class="summary"><b>'+esc(d.title)+'</b><br>'+esc(d.summary)+'</div>';(d.scenes||[]).forEach((s,i)=>{h+='<div class="scene"><h3>SCENE '+(i+1)+'｜'+esc(s.title)+'</h3><div class="lab">ナレーション</div><div class="txt">'+esc(s.narration)+'</div><div class="lab">画像指示</div><div class="txt prompt">'+esc(s.imagePrompt)+'</div><div class="lab">史実チェック</div><div class="txt fact">'+esc(s.factCheck)+'</div></div>'});return h}async function call(){const topic=$('topic').value.trim();if(!topic)return;$('go').disabled=true;$('status').textContent='両方のAIで構成を作成中…';$('openai').textContent='生成中…';$('gemini').textContent='生成中…';try{const t=performance.now(),r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic,minutes:Number($('minutes').value),provider:'both'})}),d=await r.json();if(!r.ok)throw new Error(d.error||'生成エラー');$('openai').innerHTML=render(d.openai?.data);$('gemini').innerHTML=render(d.gemini?.data);$('ometa').textContent=(d.openai?.model||'OpenAI')+' / '+(d.openai?.seconds??'-')+'秒';$('gmeta').textContent=(d.gemini?.model||'Gemini')+' / '+(d.gemini?.seconds??'-')+'秒';$('status').textContent='比較できました。特に「ナレーション」「画像指示」「史実チェック」を見比べてください。'}catch(e){$('status').textContent='エラー: '+e.message;$('openai').textContent='生成できませんでした';$('gemini').textContent='生成できませんでした'}finally{$('go').disabled=false}}$('go').onclick=call;</script></body></html>
