<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10243f"><title>筋肉骨格</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#10243f;background:#edf3f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 16px calc(38px + env(safe-area-inset-bottom))}h1{font-size:30px;margin:5px 0 7px}.lead{color:#526579;margin:0 0 22px;line-height:1.55}.grid{display:grid;gap:14px}.card{display:block;text-decoration:none;color:inherit;background:#fff;border-radius:22px;padding:20px;box-shadow:0 8px 28px #16324f14;border:1px solid #e4ebf1}.icon{font-size:38px}.title{font-size:21px;font-weight:900;margin:8px 0 5px}.desc{color:#64748b;line-height:1.55;font-size:14px;margin:0}.arrow{margin-top:14px;font-weight:900;color:#087c45}.three{border:2px solid #16a34a}.three .arrow{color:#15803d}.tag{display:inline-block;background:#dcfce7;color:#166534;font-weight:900;font-size:11px;padding:5px 8px;border-radius:999px;margin-left:7px;vertical-align:3px}.note{margin-top:18px;font-size:12px;line-height:1.55;color:#64748b;text-align:center}</style></head><body><main class="wrap"><h1>筋肉骨格</h1><p class="lead">見たい方法を選んでください。写真への重ね合わせと、本格3D人体図鑑を1つの入口にまとめました。</p><div class="grid"><a class="card three" href="anatomy-3d.html"><div class="icon">🧍</div><div class="title">3D人体図鑑 <span class="tag">NEW</span></div><p class="desc">人体を360°回転・拡大。骨格、筋肉、内臓、血管などを切り替え、部位を選んで詳しく見ます。</p><div class="arrow">3D人体を開く →</div></a><a class="card" href="anatomy-view.html?from=home"><div class="icon">📷</div><div class="title">写真で見る</div><p class="desc">人物写真の姿勢を読み取り、筋肉・骨格・内臓の教育用モデルを写真へ重ねて確認します。</p><div class="arrow">写真を選ぶ →</div></a></div><p class="note">3D人体図鑑は解剖学習用です。写真モードも本人の実際の体内を透視するものではありません。</p></main></body></html>
