<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff7eb"><title>文学まんがAI</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff7eb}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" src="aozora-manga.html"></iframe><script>
const f=document.getElementById('app');
f.addEventListener('load',()=>{const w=f.contentWindow,d=f.contentDocument;if(!d||w.__dragInstalled)return;w.__dragInstalled=true;
const st=d.createElement('style');st.textContent=`.bubble,.narr{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}.bubble.dragging,.narr.dragging{cursor:grabbing;outline:3px solid #2f6fab;z-index:30}.moveHint{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:999;background:#222e;color:#fff;padding:8px 12px;border-radius:99px;font-size:12px;pointer-events:none;opacity:0;transition:.15s}.moveHint.show{opacity:1}`;d.head.appendChild(st);
const hint=d.createElement('div');hint.className='moveHint';hint.textContent='指でセリフ・ナレーションを移動できます';d.body.appendChild(hint);
let pos={};try{pos=JSON.parse(localStorage.getItem('literatureMangaPositions')||'{}')}catch{}
const save=()=>localStorage.setItem('literatureMangaPositions',JSON.stringify(pos));
function key(el){const panel=el.closest('.panel');const id=panel?.id||'';return id+':'+(el.classList.contains('bubble')?'bubble':'narr')}
function apply(el){const p=pos[key(el)];if(!p)return;el.style.left=p.x+'%';el.style.top=p.y+'%';el.style.right='auto';el.style.bottom='auto'}
function bind(el){if(el.dataset.dragBound)return;el.dataset.dragBound='1';apply(el);let sx=0,sy=0,ox=0,oy=0,moved=false;
el.addEventListener('pointerdown',e=>{if(w.currentView==='book')return;const v=el.parentElement.getBoundingClientRect(),r=el.getBoundingClientRect();sx=e.clientX;sy=e.clientY;ox=r.left-v.left;oy=r.top-v.top;moved=false;el.setPointerCapture(e.pointerId);el.classList.add('dragging');hint.classList.add('show');e.preventDefault()});
el.addEventListener('pointermove',e=>{if(!el.hasPointerCapture(e.pointerId))return;const v=el.parentElement.getBoundingClientRect();let x=ox+e.clientX-sx,y=oy+e.clientY-sy;x=Math.max(0,Math.min(x,v.width-el.offsetWidth));y=Math.max(0,Math.min(y,v.height-el.offsetHeight));el.style.left=(x/v.width*100)+'%';el.style.top=(y/v.height*100)+'%';el.style.right='auto';el.style.bottom='auto';moved=true;e.preventDefault()});
el.addEventListener('pointerup',e=>{if(!el.hasPointerCapture(e.pointerId))return;el.releasePointerCapture(e.pointerId);el.classList.remove('dragging');hint.classList.remove('show');if(moved){const v=el.parentElement.getBoundingClientRect(),r=el.getBoundingClientRect();pos[key(el)]={x:(r.left-v.left)/v.width*100,y:(r.top-v.top)/v.height*100};save();try{w.renderBook()}catch{}}});}
function scan(){d.querySelectorAll('#manga .bubble,#manga .narr').forEach(bind);d.querySelectorAll('#book .bubble,#book .narr').forEach(apply)}
new MutationObserver(scan).observe(d.body,{childList:true,subtree:true});scan();
const oldRenderBook=w.renderBook;w.renderBook=function(){oldRenderBook.apply(this,arguments);setTimeout(scan,0)};
const oldPanel=w.panelHtml;w.panelHtml=function(){return oldPanel.apply(this,arguments)};
});
</script></body></html>
