<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff7eb"><title>文学まんがAI</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff7eb}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" src="aozora-manga.html"></iframe><script>
const f=document.getElementById('app');
f.addEventListener('load',()=>{const w=f.contentWindow,d=f.contentDocument;if(!d||w.__dragInstalled)return;w.__dragInstalled=true;
const st=d.createElement('style');st.textContent=`.bubble,.narr{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}.bubble.dragging,.narr.dragging{cursor:grabbing;outline:3px solid #2f6fab;z-index:30}.moveHint{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:999;background:#222e;color:#fff;padding:8px 12px;border-radius:99px;font-size:12px;pointer-events:none;opacity:0;transition:.15s}.moveHint.show{opacity:1}.authorWorks{margin:8px 0 2px;padding:10px;background:#f5f8fc;border:1px solid #cbd9e8;border-radius:12px}.authorWorksTitle{font-size:12px;font-weight:800;color:#315f91;margin-bottom:7px}.authorWorksButtons{display:flex;gap:7px;flex-wrap:wrap}.authorWorkBtn{background:#fff;color:#244d78;border:1px solid #9db7d2;padding:8px 11px;border-radius:99px;font-size:13px}.authorWorksEmpty{font-size:12px;color:#756d64}.characterTop{margin-bottom:12px}.characterTop button{width:100%;font-size:15px;padding:12px}`;d.head.appendChild(st);
const hint=d.createElement('div');hint.className='moveHint';hint.textContent='指でセリフ・ナレーションを移動できます';d.body.appendChild(hint);
const panels=d.getElementById('panels');if(panels)panels.value='4';
const sheet=d.querySelector('.sheet'),characterBox=d.getElementById('characterSheetBox');if(sheet&&characterBox){const oldBtn=[...sheet.querySelectorAll('button')].find(b=>b.textContent.includes('人物設定シートを作る'));if(oldBtn){const top=d.createElement('div');top.className='characterTop';top.appendChild(oldBtn);sheet.parentElement.insertBefore(top,sheet);}}
const AUTHOR_WORKS={'夏目漱石':['吾輩は猫である','坊っちゃん','こころ'],'芥川龍之介':['羅生門'],'太宰治':['走れメロス','人間失格'],'宮沢賢治':['銀河鉄道の夜','注文の多い料理店'],'中島敦':['山月記']};const author=d.getElementById('author'),title=d.getElementById('title');if(author&&title){author.placeholder='例：夏目漱石';const box=d.createElement('div');box.className='authorWorks hidden';box.innerHTML='<div class="authorWorksTitle">📚 この著者の作品候補</div><div class="authorWorksButtons"></div>';author.closest('.row').insertAdjacentElement('afterend',box);const norm=s=>(s||'').replace(/[\s　]/g,'');function showAuthorWorks(){const q=norm(author.value);const names=Object.keys(AUTHOR_WORKS).filter(a=>norm(a).includes(q)||q.includes(norm(a)));const works=[...new Set(names.flatMap(a=>AUTHOR_WORKS[a]))];const buttons=box.querySelector('.authorWorksButtons');if(!q){box.classList.add('hidden');return}box.classList.remove('hidden');if(!works.length){buttons.innerHTML='<span class="authorWorksEmpty">この著者はまだ候補リストにありません。作品名を直接入力できます。</span>';return}buttons.innerHTML=works.map(x=>`<button type="button" class="authorWorkBtn">${x}</button>`).join('');[...buttons.querySelectorAll('button')].forEach((b,i)=>b.addEventListener('click',()=>{title.value=works[i];title.focus();box.classList.add('hidden');try{w.status('✅ 「'+works[i]+'」を選びました。本文を自動取得できます。')}catch{}}))}author.addEventListener('input',showAuthorWorks);author.addEventListener('change',showAuthorWorks);showAuthorWorks();}
// 下部の「漫画本」は表示切替だけでなく、実際の漫画本表示位置まで移動する
const footer=d.getElementById('footer');if(footer){const bookBtn=[...footer.querySelectorAll('button')].find(b=>b.textContent.trim()==='漫画本');if(bookBtn){bookBtn.textContent='完成漫画';bookBtn.onclick=()=>{try{w.setView('book');w.renderBook();}catch{}setTimeout(()=>{const book=d.getElementById('book');if(book)book.scrollIntoView({behavior:'smooth',block:'start'});},80);};}}
let pos={};try{pos=JSON.parse(localStorage.getItem('literatureMangaPositions')||'{}')}catch{}const save=()=>localStorage.setItem('literatureMangaPositions',JSON.stringify(pos));function key(el){const panel=el.closest('.panel');const id=panel?.id||'';return id+':'+(el.classList.contains('bubble')?'bubble':'narr')}function apply(el){const p=pos[key(el)];if(!p)return;el.style.left=p.x+'%';el.style.top=p.y+'%';el.style.right='auto';el.style.bottom='auto'}function bind(el){if(el.dataset.dragBound)return;el.dataset.dragBound='1';apply(el);let sx=0,sy=0,ox=0,oy=0,moved=false;el.addEventListener('pointerdown',e=>{if(w.currentView==='book')return;const v=el.parentElement.getBoundingClientRect(),r=el.getBoundingClientRect();sx=e.clientX;sy=e.clientY;ox=r.left-v.left;oy=r.top-v.top;moved=false;el.setPointerCapture(e.pointerId);el.classList.add('dragging');hint.classList.add('show');e.preventDefault()});el.addEventListener('pointermove',e=>{if(!el.hasPointerCapture(e.pointerId))return;const v=el.parentElement.getBoundingClientRect();let x=ox+e.clientX-sx,y=oy+e.clientY-sy;x=Math.max(0,Math.min(x,v.width-el.offsetWidth));y=Math.max(0,Math.min(y,v.height-el.offsetHeight));el.style.left=(x/v.width*100)+'%';el.style.top=(y/v.height*100)+'%';el.style.right='auto';el.style.bottom='auto';moved=true;e.preventDefault()});el.addEventListener('pointerup',e=>{if(!el.hasPointerCapture(e.pointerId))return;el.releasePointerCapture(e.pointerId);el.classList.remove('dragging');hint.classList.remove('show');if(moved){const v=el.parentElement.getBoundingClientRect(),r=el.getBoundingClientRect();pos[key(el)]={x:(r.left-v.left)/v.width*100,y:(r.top-v.top)/v.height*100};save();try{w.renderBook()}catch{}}});}
function scan(){d.querySelectorAll('#manga .bubble,#manga .narr').forEach(bind);d.querySelectorAll('#book .bubble,#book .narr').forEach(apply)}new MutationObserver(scan).observe(d.body,{childList:true,subtree:true});scan();const oldRenderBook=w.renderBook;w.renderBook=function(){oldRenderBook.apply(this,arguments);setTimeout(scan,0)};
});
</script></body></html>
