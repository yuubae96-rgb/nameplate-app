<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f6e5f">
<title>会議後AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding:calc(18px + env(safe-area-inset-top)) 14px calc(45px + env(safe-area-inset-bottom))}.app{max-width:760px;margin:auto}h1{margin:0 0 5px;font-size:26px}.lead,.small{color:#687386;line-height:1.6}.lead{font-size:14px}.small{font-size:11px}.card{background:#fff;border:1px solid #dde3ea;border-radius:18px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{width:100%;min-height:54px;border:0;border-radius:13px;font-size:16px;font-weight:900}.record{background:#0f6e5f;color:#fff}.record.rec{background:#b42318}.file{display:block;text-align:center;padding:14px;border:1px solid #b9c7d8;background:#f8fbff;border-radius:12px;font-weight:900}.file input{display:none}.analyze{margin-top:10px;background:#172033;color:#fff}.btn:disabled{opacity:.35}.timer{text-align:center;font-size:28px;font-weight:900;margin:12px 0 4px}.status{text-align:center;color:#687386;font-size:13px;line-height:1.5}.progress{background:#edf6fb;color:#22577a;border-radius:12px;padding:12px;text-align:center;font-weight:800;margin-top:10px}.hidden{display:none!important}.hero{background:#e5f3ef;border-radius:14px;padding:14px}.hero b{font-size:20px;line-height:1.5}.pill{display:inline-block;background:#0f6e5f;color:white;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900;margin-top:8px}.out{margin-top:14px;padding:14px;border-radius:14px;border:1px solid #dde3ea}.out h2{font-size:17px;margin:0 0 8px}.minutes{background:#f8fafc}.tasks{background:#fff7df}.boss{background:#eef5ff}.agenda{background:#f1f8f4}.warn{background:#fff0ee}.item{padding:9px 0;border-bottom:1px dashed #ccd4de;line-height:1.55}.item:last-child{border-bottom:0}.label{font-size:11px;color:#687386;font-weight:800}.value{font-weight:800;margin-top:2px}.trans{white-space:pre-wrap;background:#f8fafc;padding:12px;border-radius:12px;max-height:280px;overflow:auto;font-size:13px;line-height:1.6}.save{margin-top:12px;background:#0f6e5f;color:#fff}.clear{margin-top:8px;background:#fff;color:#b42318;border:1px solid #efc4bf}audio{width:100%;margin-top:12px}@media(max-width:430px){.grid{grid-template-columns:1fr}.btn{font-size:15px}}
</style>
</head>
<body><div class="app">
<h1>会議後AI</h1>
<p class="lead">会議を録音するだけ。終わったら、議事録・TODO・社長判断用まとめ・次回アジェンダまで一気に作ります。</p>
<div class="card">
<div class="grid"><button id="record" class="btn record">🎙 会議を録音する</button><label class="file">📁 保存済み音声を選ぶ<input id="file" type="file" accept="audio/*,video/*"></label></div>
<div id="timer" class="timer">00:00</div><div id="status" class="status">確認音は鳴りません。</div><audio id="player" class="hidden" controls></audio>
<button id="analyze" class="btn analyze" disabled>会議後の4点セットを作る</button><div id="progress" class="progress hidden">文字起こし・整理中…</div>
</div>
<div id="result" class="card hidden">
<div class="hero"><small>会議の結論</small><br><b id="one"></b><div class="pill">会議後4点セット</div></div>
<div class="out minutes"><h2>① 議事録</h2><div id="minutes"></div></div>
<div class="out tasks"><h2>② 更新用TODO</h2><div class="small">「誰が・何を・いつまでに」。分からないものは勝手に埋めず「要確認」にします。</div><div id="tasks"></div></div>
<div class="out boss"><h2>③ 社長・上司への報告要点</h2><div id="boss"></div></div>
<div class="out agenda"><h2>④ 次回会議のアジェンダ案</h2><div id="agenda"></div></div>
<div id="warnBox" class="out warn hidden"><h2>⚠ 要確認</h2><div id="warn"></div></div>
<div class="out"><h2>文字起こし</h2><div id="trans" class="trans"></div></div>
<button id="save" class="btn save">💾 この結果を端末に保存</button><button id="clear" class="btn clear">次の会議へクリア</button><div id="saved" class="status"></div>
</div>
</div>
<script>
const E='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/script-ai-compare',K='sb_publishable_xG-tuBgxFGntT1vlbZzuVQ_AZ2Zl8QL',H='meeting_pipeline_history_v1';
let mr,ch=[],stream,t0,timer,blob=null,url='';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function fmt(ms){let s=Math.floor(ms/1000);return String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function setBlob(b){blob=b;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(b);$('player').src=url;$('player').classList.remove('hidden');$('analyze').disabled=false;$('status').textContent='音声を準備しました（'+(b.size/1024/1024).toFixed(1)+'MB）'}
$('record').onclick=async()=>{if(mr?.state==='recording'){mr.stop();return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});let mime=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(x=>MediaRecorder.isTypeSupported(x))||'';mr=new MediaRecorder(stream,mime?{mimeType:mime,audioBitsPerSecond:16000}:{audioBitsPerSecond:16000});ch=[];mr.ondataavailable=e=>e.data.size&&ch.push(e.data);mr.onstop=()=>{clearInterval(timer);stream.getTracks().forEach(t=>t.stop());$('record').classList.remove('rec');$('record').textContent='🎙 会議を録音する';setBlob(new Blob(ch,{type:mr.mimeType||'audio/webm'}))};mr.start(1000);t0=Date.now();timer=setInterval(()=>$('timer').textContent=fmt(Date.now()-t0),500);$('record').classList.add('rec');$('record').textContent='■ 録音を止める';$('status').textContent='録音中です（確認音は鳴りません）'}catch(e){$('status').textContent='マイクを使えません。iPhoneのマイク許可を確認してください。'}};
$('file').onchange=e=>{let f=e.target.files?.[0];if(f){setBlob(f);$('timer').textContent='保存済み音声'}};
function rows(a){return(a||[]).filter(Boolean).map(x=>'<div class="item">'+esc(x)+'</div>').join('')||'<div class="small">該当なし</div>'}
function extractTasks(a,t){let out=[];(a.decisions||[]).forEach(x=>out.push(x));let s=String(t||'').split(/[。\n]/).map(x=>x.trim()).filter(Boolean);for(let x of s){if(/までに|担当|対応|確認する|提出|作成|連絡|手配|実施|準備/.test(x))out.push(x)}let seen=new Set();out=out.filter(x=>{let k=x.replace(/\s/g,'');if(!k||seen.has(k))return false;seen.add(k);return true}).slice(0,12);return out.map(x=>{let due=(x.match(/(?:\d{1,2}月\d{1,2}日|\d{1,2}\/\d{1,2}|今週|来週|今日|明日|月末|今月末|まで)/)||[])[0]||'要確認';let who=(x.match(/(?:[一-龠ぁ-んァ-ンA-Za-z]{1,12})(?:さん|氏|部長|課長|係長|担当)/)||[])[0]||'要確認';return '担当：'+who+' ／ 期限：'+due+' ／ '+x})}
function build(d){let a=d.analysis||{},t=d.transcript||'';let mins=[];mins.push('【結論】 '+(a.oneLine||'要確認'));(a.plainSummary||[]).forEach(x=>mins.push('【要点】 '+x));(a.decisions||[]).forEach(x=>mins.push('【決定・判断】 '+x));(a.missing||[]).forEach(x=>mins.push('【未決・要確認】 '+x));let tasks=extractTasks(a,t);let boss=[a.oneLine,...(a.decisions||[]).slice(0,5),...(a.cautions||[]).slice(0,4)].filter(Boolean);(a.numbers||[]).slice(0,5).forEach(n=>boss.push((n.label||'数字')+'：'+(n.value||'')+(n.why?'（'+n.why+'）':'')));let agenda=[];(a.missing||[]).forEach(x=>agenda.push('未決事項：'+x));(a.questions||[]).forEach(x=>agenda.push('確認事項：'+x));(a.cautions||[]).forEach(x=>agenda.push('リスク確認：'+x));if(!agenda.length)agenda.push('前回TODOの進捗確認','新たな課題・変更点の確認','次回までの担当と期限の確定');$('one').textContent=a.oneLine||'会議内容を整理しました';$('minutes').innerHTML=rows(mins);$('tasks').innerHTML=rows(tasks);$('boss').innerHTML=rows(boss);$('agenda').innerHTML=rows(agenda.slice(0,12));let warn=[...(a.missing||[]),...(a.cautions||[])];$('warn').innerHTML=rows(warn);$('warnBox').classList.toggle('hidden',!warn.length);$('trans').textContent=t;$('result').classList.remove('hidden');$('result').scrollIntoView({behavior:'smooth'});return{analysis:a,transcript:t,minutes:mins,tasks,boss,agenda:agenda.slice(0,12),warn}}
let current=null;
$('analyze').onclick=async()=>{if(!blob)return;$('analyze').disabled=true;$('progress').classList.remove('hidden');$('progress').textContent='文字起こし・会議整理中…';try{if(blob.size>20*1024*1024)throw Error('20MBを超えています。まずは短めの録音でお試しください。');let f=new FormData();f.append('mode','plain-talk');f.append('category','会議');f.append('audio',blob,(blob.type||'').includes('mp4')?'meeting.m4a':'meeting.webm');let r=await fetch(E,{method:'POST',headers:{apikey:K},body:f}),d=await r.json();if(!r.ok)throw Error(d.error||'解析失敗');current=build(d);$('progress').textContent='✅ 4点セットを作成しました'}catch(e){$('progress').textContent='エラー：'+e.message}finally{$('analyze').disabled=false;setTimeout(()=>$('progress').classList.add('hidden'),9000)}};
$('save').onclick=()=>{if(!current)return;let h=[];try{h=JSON.parse(localStorage.getItem(H)||'[]')}catch{}h.unshift({date:new Date().toLocaleString('ja-JP'),title:current.analysis?.oneLine||'会議メモ',data:current});localStorage.setItem(H,JSON.stringify(h.slice(0,50)));$('saved').textContent='✅ この会議結果を保存しました'};
$('clear').onclick=()=>{if(!confirm('今の会議結果をクリアしますか？\n保存済みデータは残ります。'))return;current=null;blob=null;if(url)URL.revokeObjectURL(url);url='';$('player').pause();$('player').classList.add('hidden');$('player').removeAttribute('src');$('file').value='';$('analyze').disabled=true;$('timer').textContent='00:00';$('status').textContent='次の会議を録音できます。';$('result').classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})};
</script></body></html>
