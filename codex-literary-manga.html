<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-title" content="漫画Codex指示"><title>文学まんがAI Codex指示</title><style>*{box-sizing:border-box}body{margin:0;background:#f6efe6;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#222}main{max-width:760px;margin:auto;padding:18px 14px 80px}.card{background:#fff;border:1px solid #eadbc7;border-radius:18px;padding:16px;margin:12px 0}h1{font-size:26px;margin:4px 0}.sub{color:#756d64;font-size:13px}label{display:block;font-size:13px;font-weight:800;margin:12px 0 5px}input,select,textarea{width:100%;font-size:16px;padding:12px;border:1px solid #d8c7b2;border-radius:12px;background:#fff}textarea{min-height:190px}button{width:100%;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:800;margin-top:10px}.green{background:#16885b;color:#fff}.blue{background:#315f91;color:#fff}.ghost{background:#f3eadf;color:#443a32}.notice{background:#fff4d8;border:1px solid #ebcf8c;border-radius:12px;padding:11px;font-size:13px;line-height:1.55}.row{display:flex;gap:9px}.row>*{flex:1}.small{font-size:12px;color:#756d64;line-height:1.55}@media(max-width:600px){.row{display:block}}</style></head><body><main><h1>🤖 文学まんがAI × Codex</h1><div class="sub">作品を指定して、Codexへ渡す制作指示を1回で作ります。</div><section class="card"><div class="notice"><b>使い方</b><br>ここで作品と条件を決める → 「Codex用指示を作る」→ コピーしてCodexへ送る。Codexはリポジトリ内の <b>CODEX_LITERARY_MANGA.md</b> を制作ルールとして読みます。</div><label>作品</label><input id="work" placeholder="例：菊池寛『恩讐の彼方に』"><div class="row"><div><label>コマ数</label><select id="panels"><option>8</option><option>16</option><option selected>30</option><option>40</option><option>50</option></select></div><div><label>方向</label><select id="tone"><option selected>原作重視</option><option>初心者にも分かりやすく</option><option>ドラマチック</option><option>子どもにも読みやすく</option></select></div></div><label>追加希望</label><input id="extra" placeholder="例：時代考証を特に丁寧に"><button class="green" onclick="build()">✨ Codex用指示を作る</button></section><section class="card"><label>Codexへ送る指示</label><textarea id="out" readonly placeholder="ここに指示ができます"></textarea><button class="blue" onclick="copyText()">📋 指示をコピー</button><button class="ghost" onclick="location.href='aozora-manga.html?v=codex1'">📚 文学まんがAIを開く</button><div id="msg" class="small"></div></section></main><script>function build(){const w=document.getElementById('work').value.trim();if(!w){document.getElementById('msg').textContent='作品名を入れてください。';return}const n=document.getElementById('panels').value,t=document.getElementById('tone').value,e=document.getElementById('extra').value.trim();document.getElementById('out').value=`このリポジトリの CODEX_LITERARY_MANGA.md を最初に読み、そのルールに従ってください。\n\n${w}を${n}コマ、${t}で漫画にしてください。\n著作権・利用権を最初に確認し、確認できない場合は制作を止めて報告してください。\n原作本文を取得し、章立て、人物設定、時代設定、全コマ構成を作ってください。\n人物設定シートを作成したところで一度止まり、私に見せて「この顔でOK」の確認を取ってください。\n私がOKしたら、同じ人物設定を全コマで参照して本編を最後まで生成し、セリフ・ナレーションを配置し、右→左読みの漫画本にしてPDF/印刷できる状態まで完成させてください。${e?`\n追加希望：${e}`:''}`;document.getElementById('msg').textContent='できました。この文章をCodexへ送ってください。'}async function copyText(){const o=document.getElementById('out');if(!o.value)return;try{await navigator.clipboard.writeText(o.value);document.getElementById('msg').textContent='コピーしました。Codexへ貼り付けてください。'}catch{o.select();document.execCommand('copy');document.getElementById('msg').textContent='コピーしました。'}}</script></body></html>
