<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-title" content="漫画Codex指示"><title>文学まんがAI Codex指示</title><style>*{box-sizing:border-box}body{margin:0;background:#f6efe6;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#222}main{max-width:760px;margin:auto;padding:18px 14px 80px}.card{background:#fff;border:1px solid #eadbc7;border-radius:18px;padding:16px;margin:12px 0}h1{font-size:26px;margin:4px 0}.sub{color:#756d64;font-size:13px}label{display:block;font-size:13px;font-weight:800;margin:12px 0 5px}input,select,textarea{width:100%;font-size:16px;padding:12px;border:1px solid #d8c7b2;border-radius:12px;background:#fff}textarea{min-height:190px}button{width:100%;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:800;margin-top:10px}.green{background:#16885b;color:#fff}.blue{background:#315f91;color:#fff}.orange{background:#e36b2c;color:#fff}.ghost{background:#f3eadf;color:#443a32}.notice{background:#fff4d8;border:1px solid #ebcf8c;border-radius:12px;padding:11px;font-size:13px;line-height:1.55}.row{display:flex;gap:9px}.row>*{flex:1}.small{font-size:12px;color:#756d64;line-height:1.55}@media(max-width:600px){.row{display:block}}</style></head><body><main><h1>🤖 文学まんがAI × Codex</h1><div class="sub">Codexへ「この作品を漫画にして」と頼むための入口。</div><section class="card"><div class="notice"><b>いちばん簡単な使い方</b><br>作品名をCodexへ伝えるだけでもOKです。Codexは <b>CODEX_LITERARY_MANGA.md</b> を読み、青空文庫URLと権利状態を確認して自動実行ページを開きます。下では手動でも実行URLを作れます。</div><label>作品名</label><input id="work" placeholder="例：菊池寛『恩讐の彼方に』"><label>青空文庫URL</label><input id="url" placeholder="https://www.aozora.gr.jp/cards/..."><div class="row"><div><label>コマ数</label><select id="panels"><option>8</option><option>16</option><option selected>30</option><option>40</option><option>50</option></select></div><div><label>方向</label><select id="tone"><option selected>原作重視</option><option>初心者にも分かりやすく</option><option>ドラマチック</option><option>子どもにも読みやすく</option></select></div></div><label style="display:flex;gap:8px;align-items:flex-start;font-weight:600"><input id="rights" type="checkbox" style="width:auto;margin-top:3px">著作権切れ、または必要な利用権・許諾を確認済み</label><label>追加希望</label><input id="extra" placeholder="例：時代考証を特に丁寧に"><button class="green" onclick="build()">✨ Codex用指示を作る</button><button class="orange" onclick="openRunner()">🚀 自動実行を開始</button></section><section class="card"><label>Codexへ送る指示</label><textarea id="out" readonly placeholder="ここに指示ができます"></textarea><button class="blue" onclick="copyText()">📋 指示をコピー</button><button class="ghost" onclick="location.href='aozora-manga.html?v=codex2'">📚 通常の文学まんがAIを開く</button><div id="msg" class="small"></div></section></main><script>const $=id=>document.getElementById(id);function build(){const w=$('work').value.trim();if(!w){$('msg').textContent='作品名を入れてください。';return}const n=$('panels').value,t=$('tone').value,e=$('extra').value.trim();$('out').value=`このリポジトリの CODEX_LITERARY_MANGA.md を最初に読み、そのルールに従ってください。\n\n${w}を${n}コマ、${t}で漫画にしてください。\n著作権・利用権を最初に確認し、確認できない場合は制作を止めて報告してください。\n青空文庫の正規URLを特定し、権利確認後は aozora-manga-codex-runner.html を使って自動進行してください。\n人物設定シートができたところで私に見せて「この顔でOK」を確認してください。\n私がOKしたら未作成コマを最後まで生成し、右→左読みの漫画本表示まで完成させてください。${e?`\n追加希望：${e}`:''}`;$('msg').textContent='Codex用指示ができました。'}function runnerUrl(){const u=$('url').value.trim();if(!u)return'';if(!$('rights').checked)return'';const p=new URLSearchParams({url:u,panels:$('panels').value,tone:$('tone').value,rights:'1',auto:'1'});return 'aozora-manga-codex-runner.html?'+p.toString()}function openRunner(){const u=$('url').value.trim();if(!u){$('msg').textContent='青空文庫URLを入れてください。';return}if(!$('rights').checked){$('msg').textContent='権利確認後にチェックを入れてください。';return}location.href=runnerUrl()}async function copyText(){const o=$('out');if(!o.value)return;try{await navigator.clipboard.writeText(o.value);$('msg').textContent='コピーしました。Codexへ貼り付けてください。'}catch{o.select();document.execCommand('copy');$('msg').textContent='コピーしました。'}}</script></body></html>
