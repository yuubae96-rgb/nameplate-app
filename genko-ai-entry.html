<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="原稿AI"><title>原稿AI 入口 v1.0</title><style>:root{--bg:#f3f6fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#dbe2ea;--green:#16a34a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.wrap{max-width:760px;margin:auto;padding:16px}.hero{background:#111827;color:#fff;border-radius:20px;padding:20px;margin-bottom:14px}.hero h1{margin:0 0 6px;font-size:27px}.hero p{margin:0;color:#d1d5db;font-size:14px}.card{background:#fff;border-radius:18px;padding:17px;margin:13px 0;border:1px solid #edf1f5;box-shadow:0 7px 20px rgba(15,23,42,.05)}h2{font-size:18px;margin:0 0 12px}.hint{font-size:12px;color:var(--muted);margin:5px 0 12px}.drop{display:block;border:2px dashed #cbd5e1;border-radius:14px;padding:18px;text-align:center;background:#fafcff}.drop input{display:block;width:100%;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.pick{position:relative;display:block;min-width:0}.pick input{position:absolute;opacity:0;pointer-events:none}.pick span{display:flex;align-items:center;justify-content:center;min-height:46px;border:2px solid var(--line);border-radius:12px;padding:8px 4px;font-size:13px;font-weight:800;background:#fff;text-align:center;line-height:1.2;touch-action:manipulation}.pick input:checked+span{background:#111827;color:#fff;border-color:#111827}.category-grid .pick span{font-size:14px;min-height:48px}.stage{display:none;border:1px solid var(--line);border-radius:15px;padding:10px;margin-top:10px}.stage.active{display:block}.stage-title{font-size:16px;font-weight:900;margin:0 0 9px}.addbtn{width:100%;min-height:46px;border:2px dashed #94a3b8;border-radius:12px;background:#f8fafc;color:#334155;font-size:12px;font-weight:900;padding:6px}.opt{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:11px;padding:9px 7px;font-size:13px;font-weight:700}.opt input{width:18px;height:18px;flex:0 0 auto}label.title{display:block;font-size:14px;font-weight:800;margin:10px 0 6px}input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px}textarea{min-height:80px}.go{width:100%;border:0;border-radius:15px;padding:16px;background:var(--green);color:#fff;font-size:18px;font-weight:900}.note{margin-top:10px;font-size:12px;color:var(--muted)}</style></head><body><div class="wrap"><div class="hero"><h1>原稿AI</h1><p>系統 → 材料 → 工法の順に選びます。</p></div><section class="card"><h2>1. 図面を入れる</h2><label class="drop">📄 図面PDF・画像<input type="file" accept=".pdf,image/*"></label></section><section class="card"><h2>2. 系統・材料・工法を選ぶ</h2><p class="hint">系統を選ぶと材料が出ます。材料を選ぶと、その材料で使う工法を選べます。</p><div class="grid category-grid"><label class="pick"><input type="radio" name="category" value="金属系"><span>金属</span></label><label class="pick"><input type="radio" name="category" value="ラベル系"><span>ラベル</span></label><label class="pick"><input type="radio" name="category" value="樹脂・紙系"><span>樹脂・紙系</span></label></div><div id="materialStage" class="stage"><div id="materialTitle" class="stage-title">材料を選ぶ</div><div id="materialGrid" class="grid"></div></div><div id="processStage" class="stage"><div id="processTitle" class="stage-title">工法を選ぶ</div><div id="processGrid" class="grid"></div></div></section><section class="card"><h2>3. 加工・型オプション</h2><div class="grid"><label class="opt"><input type="checkbox">トムソン</label><label class="opt"><input type="checkbox">金型</label><label class="opt"><input type="checkbox">穴加工</label><label class="opt"><input type="checkbox">R加工</label><label class="opt"><input type="checkbox">ニス</label><label class="opt"><input type="checkbox">両面テープ</label><label class="opt"><input type="checkbox">保護フィルム</label><label class="opt"><input type="checkbox">その他加工</label></div><label class="title">型・加工の詳細</label><input type="text" placeholder="例：トムソン丸型42φ、金型No.○○"></section><section class="card"><h2>4. 補足</h2><label class="title">客先名</label><input type="text"><label class="title">注意事項</label><textarea></textarea></section><section class="card"><button class="go" type="button">原稿を作る</button><div class="note">材料候補は日本管理ラベル（AIM）で整理した材料を基準にしています。追加した材料・工法はこの端末に残ります。</div></section></div><script>
const MATERIAL_KEY='genkoAiMaterialsV2',PROCESS_KEY='genkoAiProcessesByMaterialV2';
const baseMaterials={
'金属系':['SUS304','SUS430','SUS316','C2801P','A1050P','A1080P','A1070P','A1100P','A1200P'],
'ラベル系':['上質紙','アート紙','ミラーコート紙','白PET','透明PET','PET消銀','発泡PET','ユポ','塩ビ白'],
'樹脂・紙系':['PET','ポリカーボネート','塩ビ']
};
const baseProcesses={'金属系':['シルク','オフセット','新フルカラー','H','紙H','新フルカラーH','アルマイト'],'ラベル系':['シルク','オフセット','新フルカラー','ラベル印刷'],'樹脂・紙系':['シルク','オフセット','新フルカラー','H','紙H','新フルカラーH']};
function load(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function uniq(a){return [...new Set(a)]}
function pick(name,type,value){const l=document.createElement('label');l.className='pick';const i=document.createElement('input');i.type='radio';i.name=type;i.value=value;const s=document.createElement('span');s.textContent=name;l.append(i,s);return l}
function showMaterials(cat){const stage=document.getElementById('materialStage'),grid=document.getElementById('materialGrid'),custom=load(MATERIAL_KEY),names=uniq([...(baseMaterials[cat]||[]),...(custom[cat]||[])]);grid.innerHTML='';document.getElementById('materialTitle').textContent=(cat==='金属系'?'金属':cat==='ラベル系'?'ラベル':'樹脂・紙系')+'の材料';names.forEach(n=>grid.append(pick(n,'material',cat+'|'+n)));const b=document.createElement('button');b.className='addbtn';b.type='button';b.textContent='＋ 新しい材料を追加';b.onclick=()=>{const n=prompt('追加する材料名を入力してください');if(!n||!n.trim())return;const clean=n.trim(),d=load(MATERIAL_KEY);d[cat]=d[cat]||[];if(names.includes(clean)){alert('「'+clean+'」はすでにあります。');return}d[cat].push(clean);save(MATERIAL_KEY,d);showMaterials(cat);const target=[...document.querySelectorAll('input[name="material"]')].find(i=>i.value===cat+'|'+clean);target.checked=true;showProcesses(cat,clean)};grid.append(b);stage.classList.add('active');document.getElementById('processStage').classList.remove('active')}
function showProcesses(cat,mat){const stage=document.getElementById('processStage'),grid=document.getElementById('processGrid'),key=cat+'|'+mat,custom=load(PROCESS_KEY),names=uniq([...(baseProcesses[cat]||[]),...(custom[key]||[])]);grid.innerHTML='';document.getElementById('processTitle').textContent=mat+'の工法';names.forEach(n=>grid.append(pick(n,'process',key+'|'+n)));const b=document.createElement('button');b.className='addbtn';b.type='button';b.textContent='＋ 新しい工法を追加';b.onclick=()=>{const n=prompt(mat+'で使う新しい工法名を入力してください');if(!n||!n.trim())return;const clean=n.trim(),d=load(PROCESS_KEY);d[key]=d[key]||[];if(names.includes(clean)){alert('「'+clean+'」はすでにあります。');return}d[key].push(clean);save(PROCESS_KEY,d);showProcesses(cat,mat);[...document.querySelectorAll('input[name="process"]')].find(i=>i.value===key+'|'+clean).checked=true};grid.append(b);stage.classList.add('active')}
document.querySelectorAll('input[name="category"]').forEach(i=>i.addEventListener('change',()=>showMaterials(i.value)));document.addEventListener('change',e=>{if(e.target.matches('input[name="material"]')){const [cat,mat]=e.target.value.split('|');showProcesses(cat,mat)}});
</script></body></html>
