<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="原稿AI"><title>原稿AI 入口 v0.9</title>
<style>:root{--bg:#f3f6fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#dbe2ea;--green:#16a34a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.wrap{max-width:760px;margin:auto;padding:16px}.hero{background:#111827;color:#fff;border-radius:20px;padding:20px;margin-bottom:14px}.hero h1{margin:0 0 6px;font-size:27px}.hero p{margin:0;color:#d1d5db;font-size:14px}.card{background:#fff;border-radius:18px;padding:17px;margin:13px 0;border:1px solid #edf1f5;box-shadow:0 7px 20px rgba(15,23,42,.05)}h2{font-size:18px;margin:0 0 12px}.hint{font-size:12px;color:var(--muted);margin:5px 0 12px}.drop{display:block;border:2px dashed #cbd5e1;border-radius:14px;padding:18px;text-align:center;background:#fafcff}.drop input{display:block;width:100%;margin-top:12px}.group{border:1px solid var(--line);border-radius:15px;padding:10px;margin:10px 0}.group legend{font-weight:900;font-size:16px;padding:0 7px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.pick{position:relative;display:block;min-width:0}.pick input{position:absolute;opacity:0;pointer-events:none}.pick span{display:flex;align-items:center;justify-content:center;min-height:46px;border:2px solid var(--line);border-radius:12px;padding:8px 4px;font-size:13px;font-weight:800;background:#fff;text-align:center;line-height:1.2;touch-action:manipulation;word-break:keep-all}.pick input:checked+span{background:#111827;color:#fff;border-color:#111827}.material-grid{margin-bottom:12px}.material-grid .pick span{font-size:14px;min-height:48px}.process-section{display:none}.process-section.active{display:block}.stock-section{display:none;margin-top:12px}.stock-section.active{display:block}.stock-title{font-weight:900;font-size:15px;margin:0 0 8px}.addbtn{width:100%;min-height:46px;border:2px dashed #94a3b8;border-radius:12px;background:#f8fafc;color:#334155;font-size:12px;font-weight:900;padding:6px}.opt{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:11px;padding:9px 7px;font-size:13px;font-weight:700}.opt input{width:18px;height:18px;flex:0 0 auto}label.title{display:block;font-size:14px;font-weight:800;margin:10px 0 6px}input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px}textarea{min-height:80px}.go{width:100%;border:0;border-radius:15px;padding:16px;background:var(--green);color:#fff;font-size:18px;font-weight:900}.note{margin-top:10px;font-size:12px;color:var(--muted)}</style></head><body><div class="wrap">
<div class="hero"><h1>原稿AI</h1><p>系統 → 工法 → 材料の順に選びます。</p></div>
<section class="card"><h2>1. 図面を入れる</h2><label class="drop">📄 図面PDF・画像<input type="file" accept=".pdf,image/*"></label></section>
<section class="card"><h2>2. 系統・工法・材料を選ぶ</h2><p class="hint">まず系統、次に工法を選ぶと、その工法で使う材料候補が表示されます。</p>
<div class="grid material-grid"><label class="pick"><input type="radio" name="category" value="金属系"><span>金属</span></label><label class="pick"><input type="radio" name="category" value="ラベル系"><span>ラベル</span></label><label class="pick"><input type="radio" name="category" value="樹脂・紙系"><span>樹脂・紙系</span></label></div>
<div id="processHint" class="hint">↑ 先に系統を選んでください</div>
<fieldset class="group process-section" data-group="金属系"><legend>金属の工法</legend><div class="grid process-grid"><label class="pick"><input type="radio" name="process" value="金属系|シルク"><span>シルク</span></label><label class="pick"><input type="radio" name="process" value="金属系|オフセット"><span>オフセット</span></label><label class="pick"><input type="radio" name="process" value="金属系|新フルカラー"><span>新フルカラー</span></label><label class="pick"><input type="radio" name="process" value="金属系|H"><span>H</span></label><label class="pick"><input type="radio" name="process" value="金属系|紙H"><span>紙H</span></label><label class="pick"><input type="radio" name="process" value="金属系|新フルカラーH"><span>新フルカラーH</span></label><label class="pick"><input type="radio" name="process" value="金属系|アルマイト"><span>アルマイト</span></label><button class="addbtn process-add" type="button">＋ 新しい工法を追加</button></div></fieldset>
<fieldset class="group process-section" data-group="ラベル系"><legend>ラベルの工法</legend><div class="grid process-grid"><label class="pick"><input type="radio" name="process" value="ラベル系|シルク"><span>シルク</span></label><label class="pick"><input type="radio" name="process" value="ラベル系|オフセット"><span>オフセット</span></label><label class="pick"><input type="radio" name="process" value="ラベル系|新フルカラー"><span>新フルカラー</span></label><label class="pick"><input type="radio" name="process" value="ラベル系|ラベル印刷"><span>ラベル印刷</span></label><button class="addbtn process-add" type="button">＋ 新しい工法を追加</button></div></fieldset>
<fieldset class="group process-section" data-group="樹脂・紙系"><legend>樹脂・紙系の工法</legend><div class="grid process-grid"><label class="pick"><input type="radio" name="process" value="樹脂・紙系|シルク"><span>シルク</span></label><label class="pick"><input type="radio" name="process" value="樹脂・紙系|オフセット"><span>オフセット</span></label><label class="pick"><input type="radio" name="process" value="樹脂・紙系|新フルカラー"><span>新フルカラー</span></label><label class="pick"><input type="radio" name="process" value="樹脂・紙系|H"><span>H</span></label><label class="pick"><input type="radio" name="process" value="樹脂・紙系|紙H"><span>紙H</span></label><label class="pick"><input type="radio" name="process" value="樹脂・紙系|新フルカラーH"><span>新フルカラーH</span></label><button class="addbtn process-add" type="button">＋ 新しい工法を追加</button></div></fieldset>
<div id="stockSection" class="stock-section"><div id="stockTitle" class="stock-title">材料を選ぶ</div><div id="stockGrid" class="grid"></div></div></section>
<section class="card"><h2>3. 加工・型オプション</h2><div class="grid"><label class="opt"><input type="checkbox">トムソン</label><label class="opt"><input type="checkbox">金型</label><label class="opt"><input type="checkbox">穴加工</label><label class="opt"><input type="checkbox">R加工</label><label class="opt"><input type="checkbox">ニス</label><label class="opt"><input type="checkbox">両面テープ</label><label class="opt"><input type="checkbox">保護フィルム</label><label class="opt"><input type="checkbox">その他加工</label></div><label class="title">型・加工の詳細</label><input type="text" placeholder="例：トムソン丸型42φ、金型No.○○"></section>
<section class="card"><h2>4. 補足</h2><label class="title">客先名</label><input type="text"><label class="title">注意事項</label><textarea></textarea></section><section class="card"><button class="go" type="button">原稿を作る</button><div class="note">工法ごとの材料候補は、正解事例と現場入力から増やしていきます。</div></section></div>
<script>
const PROCESS_KEY='genkoAiCustomProcessesV1',STOCK_KEY='genkoAiCustomStocksV1';
const knownStocks={
'ラベル系|シルク':['白ネーマ'],'ラベル系|オフセット':['白ネーマ'],'ラベル系|新フルカラー':['白ネーマ'],'ラベル系|ラベル印刷':['白ネーマ'],
'樹脂・紙系|シルク':['塩ビ'],'樹脂・紙系|オフセット':['塩ビ'],'樹脂・紙系|新フルカラー':['塩ビ']
};
function load(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function addProcess(fs,name,select){const group=fs.dataset.group,grid=fs.querySelector('.process-grid'),btn=grid.querySelector('.process-add'),label=document.createElement('label');label.className='pick custom-pick';label.innerHTML='<input type="radio" name="process" value="'+group+'|'+name.replace(/"/g,'&quot;')+'"><span></span>';label.querySelector('span').textContent=name;grid.insertBefore(label,btn);if(select){label.querySelector('input').checked=true;showStocks(group+'|'+name)}}
function renderProcesses(){const data=load(PROCESS_KEY);document.querySelectorAll('.process-section').forEach(fs=>(data[fs.dataset.group]||[]).forEach(n=>addProcess(fs,n,false)))}
function showProcesses(group){document.querySelectorAll('.process-section').forEach(fs=>fs.classList.toggle('active',fs.dataset.group===group));document.querySelectorAll('input[name="process"]').forEach(i=>i.checked=false);document.getElementById('processHint').style.display='none';document.getElementById('stockSection').classList.remove('active')}
function stockPick(name,key){const l=document.createElement('label');l.className='pick';const i=document.createElement('input');i.type='radio';i.name='stock';i.value=name;const s=document.createElement('span');s.textContent=name;l.append(i,s);return l}
function showStocks(key){const sec=document.getElementById('stockSection'),grid=document.getElementById('stockGrid');grid.innerHTML='';document.getElementById('stockTitle').textContent='材料を選ぶ（'+key.split('|')[1]+'）';const custom=load(STOCK_KEY),names=[...(knownStocks[key]||[]),...(custom[key]||[])];[...new Set(names)].forEach(n=>grid.append(stockPick(n,key)));const b=document.createElement('button');b.type='button';b.className='addbtn';b.textContent='＋ 新しい材料を追加';b.onclick=()=>{const n=prompt('この工法で使う材料名を入力してください');if(!n||!n.trim())return;const clean=n.trim(),d=load(STOCK_KEY);d[key]=d[key]||[];if(names.includes(clean)||d[key].includes(clean)){alert('「'+clean+'」はすでにあります。');return}d[key].push(clean);save(STOCK_KEY,d);showStocks(key);[...document.querySelectorAll('input[name="stock"]')].find(i=>i.value===clean).checked=true};grid.append(b);sec.classList.add('active')}
document.querySelectorAll('input[name="category"]').forEach(i=>i.addEventListener('change',()=>showProcesses(i.value)));document.addEventListener('change',e=>{if(e.target.matches('input[name="process"]'))showStocks(e.target.value)});
document.querySelectorAll('.process-add').forEach(btn=>btn.addEventListener('click',()=>{const fs=btn.closest('.process-section'),g=fs.dataset.group,n=prompt(g+'に追加する新しい工法名を入力してください');if(!n||!n.trim())return;const clean=n.trim(),d=load(PROCESS_KEY);d[g]=d[g]||[];if([...fs.querySelectorAll('input[name="process"]')].some(i=>i.value===g+'|'+clean)){alert('「'+clean+'」はすでにあります。');return}d[g].push(clean);save(PROCESS_KEY,d);addProcess(fs,clean,true)}));renderProcesses();
</script></body></html>
