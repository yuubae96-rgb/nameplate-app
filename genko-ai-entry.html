<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="原稿AI">
<title>原稿AI 入口 v0.7</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#dbe2ea;--green:#16a34a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:760px;margin:auto;padding:16px}.hero{background:#111827;color:#fff;border-radius:20px;padding:20px;margin-bottom:14px}.hero h1{margin:0 0 6px;font-size:27px}.hero p{margin:0;color:#d1d5db;font-size:14px}.card{background:#fff;border-radius:18px;padding:17px;margin:13px 0;border:1px solid #edf1f5;box-shadow:0 7px 20px rgba(15,23,42,.05)}h2{font-size:18px;margin:0 0 12px}.hint{font-size:12px;color:var(--muted);margin:5px 0 12px}.drop{display:block;border:2px dashed #cbd5e1;border-radius:14px;padding:18px;text-align:center;background:#fafcff}.drop input{display:block;width:100%;margin-top:12px}.group{border:1px solid var(--line);border-radius:15px;padding:12px;margin:12px 0}.group legend{font-weight:900;font-size:17px;padding:0 7px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.pick{position:relative;display:block}.pick input{position:absolute;opacity:0;pointer-events:none}.pick span{display:flex;align-items:center;justify-content:center;min-height:52px;border:2px solid var(--line);border-radius:13px;padding:11px 8px;font-size:15px;font-weight:800;background:#fff;text-align:center;touch-action:manipulation}.pick input:checked + span{background:#111827;color:#fff;border-color:#111827}.material-grid{margin-bottom:14px}.process-section{display:none}.process-section.active{display:block}.addbtn{width:100%;min-height:52px;border:2px dashed #94a3b8;border-radius:13px;background:#f8fafc;color:#334155;font-size:15px;font-weight:900}.opt{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:700}.opt input{width:20px;height:20px}label.title{display:block;font-size:14px;font-weight:800;margin:10px 0 6px}input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px}textarea{min-height:80px}.go{width:100%;border:0;border-radius:15px;padding:16px;background:var(--green);color:#fff;font-size:18px;font-weight:900}.note{margin-top:10px;font-size:12px;color:var(--muted)}@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<div class="hero"><h1>原稿AI</h1><p>材料を選ぶと、その材料に合った工法だけを表示します。</p></div>
<section class="card"><h2>1. 図面を入れる</h2><label class="drop">📄 図面PDF・画像<input type="file" accept=".pdf,image/*"></label></section>
<section class="card"><h2>2. 材料と工法を選ぶ</h2><p class="hint">まず材料を選んでください。選んだ材料に合った工法だけが下に表示されます。</p>
<div class="grid material-grid">
<label class="pick"><input type="radio" name="material" value="金属系"><span>金属</span></label>
<label class="pick"><input type="radio" name="material" value="ラベル系"><span>ラベル</span></label>
<label class="pick"><input type="radio" name="material" value="樹脂・紙系"><span>樹脂・紙系</span></label>
</div>
<div id="processHint" class="hint">↑ 先に材料を選んでください</div>
<fieldset class="group process-section" data-group="金属系"><legend>金属の工法</legend><div class="grid process-grid">
<label class="pick"><input type="radio" name="process" value="金属系|シルク"><span>シルク</span></label><label class="pick"><input type="radio" name="process" value="金属系|オフセット"><span>オフセット</span></label><label class="pick"><input type="radio" name="process" value="金属系|新フルカラー"><span>新フルカラー</span></label><label class="pick"><input type="radio" name="process" value="金属系|H"><span>H</span></label><label class="pick"><input type="radio" name="process" value="金属系|紙H"><span>紙H</span></label><label class="pick"><input type="radio" name="process" value="金属系|新フルカラーH"><span>新フルカラーH</span></label><label class="pick"><input type="radio" name="process" value="金属系|アルマイト印刷"><span>アルマイト印刷</span></label><button class="addbtn" type="button">＋ 新しい工法を追加</button></div></fieldset>
<fieldset class="group process-section" data-group="ラベル系"><legend>ラベルの工法</legend><div class="grid process-grid">
<label class="pick"><input type="radio" name="process" value="ラベル系|シルク"><span>シルク</span></label><label class="pick"><input type="radio" name="process" value="ラベル系|オフセット"><span>オフセット</span></label><label class="pick"><input type="radio" name="process" value="ラベル系|新フルカラー"><span>新フルカラー</span></label><label class="pick"><input type="radio" name="process" value="ラベル系|ラベル印刷"><span>ラベル印刷</span></label><button class="addbtn" type="button">＋ 新しい工法を追加</button></div></fieldset>
<fieldset class="group process-section" data-group="樹脂・紙系"><legend>樹脂・紙系の工法</legend><div class="grid process-grid">
<label class="pick"><input type="radio" name="process" value="樹脂・紙系|シルク"><span>シルク</span></label><label class="pick"><input type="radio" name="process" value="樹脂・紙系|オフセット"><span>オフセット</span></label><label class="pick"><input type="radio" name="process" value="樹脂・紙系|新フルカラー"><span>新フルカラー</span></label><label class="pick"><input type="radio" name="process" value="樹脂・紙系|H"><span>H</span></label><label class="pick"><input type="radio" name="process" value="樹脂・紙系|紙H"><span>紙H</span></label><label class="pick"><input type="radio" name="process" value="樹脂・紙系|新フルカラーH"><span>新フルカラーH</span></label><button class="addbtn" type="button">＋ 新しい工法を追加</button></div></fieldset></section>
<section class="card"><h2>3. 加工・型オプション</h2><div class="grid"><label class="opt"><input type="checkbox">トムソン</label><label class="opt"><input type="checkbox">金型</label><label class="opt"><input type="checkbox">穴加工</label><label class="opt"><input type="checkbox">R加工</label><label class="opt"><input type="checkbox">ニス</label><label class="opt"><input type="checkbox">両面テープ</label><label class="opt"><input type="checkbox">保護フィルム</label><label class="opt"><input type="checkbox">その他加工</label></div><label class="title">型・加工の詳細</label><input type="text" placeholder="例：トムソン丸型42φ、金型No.○○"></section>
<section class="card"><h2>4. 補足</h2><label class="title">客先名</label><input type="text"><label class="title">注意事項</label><textarea></textarea></section><section class="card"><button class="go" type="button">原稿を作る</button><div class="note">Codex連携は次段階です。まず入口の選択UIを確実に使える形にしています。</div></section></div>
<script>
const KEY='genkoAiCustomProcessesV1';
function loadCustom(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}
function saveCustom(v){localStorage.setItem(KEY,JSON.stringify(v))}
function addChoice(fieldset,name,select){const group=fieldset.dataset.group,grid=fieldset.querySelector('.process-grid'),btn=grid.querySelector('.addbtn');const label=document.createElement('label');label.className='pick custom-pick';const input=document.createElement('input');input.type='radio';input.name='process';input.value=group+'|'+name;const span=document.createElement('span');span.textContent=name;label.append(input,span);grid.insertBefore(label,btn);if(select)input.checked=true}
function renderCustom(){const data=loadCustom();document.querySelectorAll('.group[data-group]').forEach(fs=>{(data[fs.dataset.group]||[]).forEach(n=>addChoice(fs,n,false))})}
function showProcesses(group){document.querySelectorAll('.process-section').forEach(fs=>fs.classList.toggle('active',fs.dataset.group===group));document.querySelectorAll('input[name="process"]').forEach(i=>i.checked=false);document.getElementById('processHint').style.display='none'}
document.querySelectorAll('input[name="material"]').forEach(input=>input.addEventListener('change',()=>showProcesses(input.value)));
document.querySelectorAll('.addbtn').forEach(btn=>btn.addEventListener('click',()=>{const fs=btn.closest('.group'),group=fs.dataset.group;const name=prompt(group+'に追加する新しい工法名を入力してください');if(!name||!name.trim())return;const clean=name.trim();const data=loadCustom();data[group]=data[group]||[];const exists=[...fs.querySelectorAll('input[name="process"]')].some(i=>i.value===group+'|'+clean);if(exists){alert('「'+clean+'」はすでにあります。');return}data[group].push(clean);saveCustom(data);addChoice(fs,clean,true)}));
renderCustom();
</script></body></html>
