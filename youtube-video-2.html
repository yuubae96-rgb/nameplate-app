const wrap=d.createElement('div');wrap.className='field';wrap.id='narrationStyleField';wrap.innerHTML='<label>動画の作り方</label><select id="narrationStyle"><option value="standard">通常</option><option value="suzuyu">すずゆう風</option><option value="koala">コアラ先生風</option></select><div class="hint" id="narrationStyleHint">通常の構成で作ります。</div>';

function syncHint(){if(sel.value==='suzuyu')hint.textContent='「あなたは…ですか？」→常識的な候補→意外な本題→重厚な深掘り、の型で作ります。';else if(sel.value==='koala')hint.textContent='黒板いっぱいに文字・図解・イラストで説明。左上タイトルなし。AI画像は上下を空けず画面全体を使い、字幕は動画側で重ねます。';else hint.textContent='通常の構成で作ります。';try{localStorage.setItem('yt2NarrationStyle',sel.value)}catch(_){}}sel.onchange=syncHint;syncHint();
const SUZUYU=`【ナレーション構成：すずゆう風】\n最初の一文は必ず「あなたは……ですか？」。常識的な候補を2〜3個示し、意外だが史実に裏付けられた本題へ反転し、重厚な歴史ドキュメンタリー調で因果関係を深掘りする。単なる年代の羅列にせず、背景→狙い→転機→結果→歴史的意味→現代への接続で進める。史実の正確性を優先し、推測で埋めない。各SCENEは前後が自然につながるようにする。`;
const KOALA=`【動画構成：コアラ先生風】\nこの動画は、黒板を使った授業形式の教育動画として作る。名称に「コアラ」とあるが、コアラや動物キャラクターを画面に出す意味ではない。\n\n【画像の最重要ルール】\n・見本のように、画面の中心は黒板そのものにする。\n・黒板いっぱいに、そのSCENEの要点を「短い日本語」「チョーク風の図解」「矢印」「年表」「地図」「建物や人物の簡潔な線画」で整理する。\n・主役は板書。黒板の内容だけで話の流れが分かるようにする。\n・文章を大量に書かず、重要語・数字・年号・比較・因果関係を大きく見やすく配置する。\n・左上に動画用タイトルや見出し帯を入れない。タイトルは完成動画側でも表示しない。\n・字幕のために画像を上へ寄せたり、画面下部に空白・黒帯・安全余白を作ったりしない。AI画像は16:9の画面全体を自然に使う。字幕文は画像そのものには描かず、完成動画側で画像の上に重ねる。\n・黒板の外に立つ教師、生徒、教室風景は原則描かない。\n・コアラ、動物、マスコット、ゆるキャラ、アニメ風の案内役、擬人化キャラクターを一切描かない。\n・白衣のコアラ、眼鏡のコアラ、指し棒を持つ動物なども禁止。\n・テーマ上必要な歴史人物・実在人物を出す場合のみ、黒板上の説明用イラスト・肖像として最小限に使う。\n・画面端に先生役の人物を立たせない。\n・実写映画風・教室で先生が立って説明する写真風にはしない。\n・全SCENEで黒板、チョーク、板書の統一感を保つ。\n・完成動画ではズーム、パン、Ken Burns効果など、スーッとした画像移動を一切加えない。各SCENEは完全な固定画面。\n\n【しゃべり方の最重要ルール】\n・先生が生徒へ授業で教えるような自然な日本語にする。\n・画面に先生本人は出さないが、声は先生の授業調にする。\n・「ここが大事です」「では、なぜこうなったのでしょう」「黒板のここを見てください」「つまりこういうことです」のように順序立てて教える。\n・難しい専門用語は、その場で短く意味を説明する。\n・単なる原稿朗読ではなく、要点→理由→具体例→まとめの順で理解させる。\n・子どもっぽくしすぎず、大人の初心者にも分かりやすい授業調にする。\n・史実や事実を優先し、不明点を創作しない。\n\n画像生成指示には毎回必ず、次の禁止条件まで明記すること：\n「Blackboard-centered educational illustration. Use the full 16:9 frame naturally. Do NOT reserve empty space for subtitles, do NOT shift the artwork upward, and do NOT add a bottom black band or subtitle-safe margin. No title banner at top-left. NO koala, NO animal, NO mascot, NO cartoon teacher, NO teacher standing beside the board, NO students, NO classroom audience. Blackboard only. Static composition. No camera movement.」`;
make.addEventListener('click',()=>{if(sel.value==='standard')return;const before=extra.value;const add=sel.value==='suzuyu'?SUZUYU:KOALA;extra.value=(before?before+'\n\n':'')+add;extra.dispatchEvent(new Event('input',{bubbles:true}));setTimeout(()=>{extra.value=before;extra.dispatchEvent(new Event('input',{bubbles:true}))},180)},true);
}catch(e){setTimeout(installNarrationStyle,500)}}
function installMotion(){try{const d=getBaseDoc();if(!d){setTimeout(installMotion,500);return}if(d.documentElement.dataset.yt2Motion==='4')return;const s=d.createElement('script');s.textContent=`(()=>{if(window.__yt2Motion4)return;window.__yt2Motion4=true;document.documentElement.dataset.yt2Motion='4';
function koalaMode(){try{return document.getElementById('narrationStyle')?.value==='koala'}catch(e){return false}}
function ease(t){t=Math.max(0,Math.min(1,t||0));return t*t*(3-2*t)}
function pose(i,p){if(koalaMode())return{zoom:1,x:0,y:0};p=ease(p);const zoom=1.025+0.085*p,m=i%4;let x=0,y=0;if(m===0)x=-1.8+3.6*p;else if(m===1)x=1.8-3.6*p;else if(m===2)y=1.4-2.8*p;else y=-1.2+2.4*p;return{zoom,x,y}}
function naturalChunks(text,max=22){const src=String(text||'').replace(/\\s+/g,'').trim();if(!src)return[];const sentences=src.match(/[^。！？!?]+[。！？!?]?/g)||[src],out=[];const bad=/^(?:とです[。！？!?]?|です[。！？!?]?|ます[。！？!?]?|でした[。！？!?]?|ということです[。！？!?]?|というわけです[。！？!?]?|ことです[。！？!?]?|わけです[。！？!?]?|のです[。！？!?]?|なのです[。！？!?]?|になります[。！？!?]?)/;for(const sentence of sentences){let r=sentence;while(r.length>max){let cut=-1;for(let i=Math.min(max,r.length-1);i>=Math.max(10,max-8);i--){if(/[、，,：:；;]/.test(r[i-1])){cut=i;break}}if(cut<0){const particles=['という','ため','ので','から','けれど','しかし','そして','つまり','一方','また','では','なら','こと','わけ'];for(let i=Math.min(max,r.length-1);i>=Math.max(10,max-8)&&cut<0;i--){for(const p of particles){if(r.slice(i-p.length,i)===p){cut=i;break}}}}if(cut<0)cut=max;let left=r.slice(0,cut),right=r.slice(cut);if(bad.test(right)||right.length<=6){left+=right;r='';out.push(left);break}out.push(left);r=right}if(r){if(out.length&&(bad.test(r)||r.length<=5))out[out.length-1]+=r;else out.push(r)}}return out.filter(Boolean)}
window.speechCaption=function(s,current,duration){const lead=Math.max(0,Number(s?.leadingSilenceMs||0))/1000,manual=Number(s?.captionDelay||0),rate=Math.max(.65,Math.min(1.35,Number(s?.captionRate||1))),base=.75,start=lead+base+manual;if(current<start)return'';const ch=naturalChunks(s?.narration||'',koalaMode()?22:20);if(!ch.length)return'';const usable=Math.max(.1,(duration||1)-lead-base-manual),t=Math.max(0,Math.min(usable,current-start)),weights=ch.map(x=>Math.max(1,x.replace(/[。、，,.！？!?]/g,'').length)+(/[。！？!?]$/.test(x)?11:/[、，,]$/.test(x)?5:0)),total=weights.reduce((a,b)=>a+b,0),ratio=Math.max(0,Math.min(1,(t/usable)*rate)),pos=Math.pow(ratio,1.12)*total;let acc=0;for(let i=0;i<ch.length;i++){acc+=weights[i];if(pos<=acc)return ch[i]}return ch[ch.length-1]};
function drawMotion(ctx,c,img,title,cap,p=0,i=0){const km=koalaMode();ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height);const q=pose(i,p);let base,w,h,x,y;if(km){base=Math.max(c.width/img.width,c.height/img.height);w=img.width*base;h=img.height*base;x=(c.width-w)/2;y=(c.height-h)/2;ctx.drawImage(img,x,y,w,h)}else{base=Math.max(c.width/img.width,c.height/img.height);const sc=base*q.zoom;w=img.width*sc;h=img.height*sc;x=(c.width-w)/2+(q.x/100)*c.width;y=(c.height-h)/2+(q.y/100)*c.height;ctx.drawImage(img,x,y,w,h)}const safeX=Math.round(c.width*.075),maxW=Math.round(c.width*.85);if(title&&!km){let fs=Math.round(c.height*.047);ctx.font='900 '+fs+'px sans-serif';while(fs>22&&ctx.measureText(title).width>maxW-34){fs-=2;ctx.font='900 '+fs+'px sans-serif'}const bw=Math.min(maxW,ctx.measureText(title).width+34),bh=Math.round(fs*1.65),ty=Math.round(c.height*.055);ctx.fillStyle='#8f1d24';ctx.fillRect(safeX,ty,bw,bh);ctx.fillStyle='#fff';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(title,safeX+17,ty+bh/2)}if(cap){const txt=String(cap).trim();let fs=Math.round(c.height*(km ? 0.047 : 0.064)),minFs=Math.round(c.height*(km ? 0.038 : 0.045));ctx.font='900 '+fs+'px sans-serif';const chars=[...txt.replace(/\\n/g,'')],lines=[];let line='';for(const ch of chars){const test=line+ch;if(ctx.measureText(test).width>maxW&&line){lines.push(line);line=ch}else line=test}if(line)lines.push(line);while(lines.length>2&&fs>minFs){fs-=2;ctx.font='900 '+fs+'px sans-serif';lines.length=0;line='';for(const ch of chars){const test=line+ch;if(ctx.measureText(test).width>maxW&&line){lines.push(line);line=ch}else line=test}if(line)lines.push(line)}ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.strokeStyle='#000';ctx.lineWidth=Math.max(4,Math.round(fs*.15));ctx.fillStyle='#fff';const show=lines.slice(0,2),lh=Math.round(fs*1.24),bottomPad=Math.round(c.height*(km ? 0.026 : 0.075)),baseY=c.height-bottomPad-(show.length-1)*lh;show.forEach((ln,j)=>{const yy=baseY+j*lh;ctx.strokeText(ln,c.width/2,yy,maxW);ctx.fillText(ln,c.width/2,yy,maxW)})}}
function cssPose(i,p){const q=pose(i,p);return 'scale('+q.zoom+') translate('+q.x+'%,'+q.y+'%)'}
async function playMotion(scene,a,i){const img=document.getElementById('previewImg'),title=document.getElementById('previewTitle'),caption=document.getElementById('previewCaption'),km=koalaMode();img.src=scene.image;title.textContent=km?'':scene.title;title.style.display=km?'none':'';caption.textContent='';caption.style.fontSize=km?'clamp(18px,3.4vw,28px)':'';caption.style.bottom=km?'2.5%':'';img.style.willChange=km?'auto':'transform';img.style.transform=km?'none':'scale(1.025)';img.style.height='100%';img.style.objectFit='cover';img.style.objectPosition='center center';a.currentTime=0;await a.play();await new Promise(resolve=>{let raf=0;const tick=()=>{const dur=Number.isFinite(a.duration)&&a.duration>0?a.duration:1,p=Math.max(0,Math.min(1,a.currentTime/dur));img.style.transform=km?'none':cssPose(i,p);caption.textContent=speechCaption(scene,a.currentTime,dur);if(a.ended){cancelAnimationFrame(raf);resolve();return}raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick)});img.style.willChange=''}
window.playScene=async i=>{sync(i);if(project?.scenes?.[i]?.audio)await playMotion(project.scenes[i],document.getElementById('audio-'+i),i)};
const play=document.getElementById('playAll');if(play)play.onclick=async()=>{for(let i=0;i<project.scenes.length;i++){const sc=project.scenes[i];if(!sc.image||!sc.audio)continue;await playMotion(sc,new Audio(sc.audio),i);document.getElementById('previewProgress').style.width=Math.round((i+1)/project.scenes.length*100)+'%'}};
const make=document.getElementById('makeVideo');if(make)make.onclick=async()=>{if(project.scenes.some(s=>!s.image||!s.audio))return alert('全シーンの画像と音声を作ってください。');make.disabled=true;cancelRequested=false;document.getElementById('cancelVideo').style.display='block';let ac=null,stream=null;try{const c=document.createElement('canvas');c.width=aspect()==='9:16'?1080:1280;c.height=aspect()==='9:16'?1920:720;const ctx=c.getContext('2d'),AC=window.AudioContext||window.webkitAudioContext;ac=new AC;await ac.resume();const dest=ac.createMediaStreamDestination(),imgs=[],bufs=[];for(let i=0;i<project.scenes.length;i++){imgs.push(await loadImg(project.scenes[i].image));bufs.push(await ab(ac,project.scenes[i].audio))}const vs=c.captureStream(30);stream=new MediaStream([...vs.getVideoTracks(),...dest.stream.getAudioTracks()]);const mime=['video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x))||'',rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);const stopped=new Promise(r=>rec.onstop=r);rec.start(1000);for(let i=0;i<project.scenes.length&&!cancelRequested;i++){const scene=project.scenes[i],src=ac.createBufferSource();activeExportSource=src;src.buffer=bufs[i];src.connect(dest);src.start();const st=performance.now(),dur=bufs[i].duration;while(performance.now()-st<dur*1000&&!cancelRequested){const el=(performance.now()-st)/1000,p=Math.max(0,Math.min(1,el/dur));drawMotion(ctx,c,imgs[i],scene.title,speechCaption(scene,el,dur),p,i);document.getElementById('videoStatus').textContent='動画生成中… SCENE '+(i+1)+'/'+project.scenes.length+(koalaMode()?'（黒板・全画面・固定画面）':'（ゆっくりズーム・移動）');await wait(33)}}rec.stop();await stopped;if(cancelRequested){document.getElementById('videoStatus').textContent='動画生成を停止しました。';return}const type=rec.mimeType||mime||'video/webm',blob=new Blob(chunks,{type}),url=URL.createObjectURL(blob),ext=type.includes('mp4')?'mp4':'webm',rv=document.getElementById('resultVideo'),sl=document.getElementById('saveLink');rv.src=url;rv.style.display='block';sl.href=url;sl.download='youtube-video.'+ext;sl.textContent='完成した動画を保存';sl.style.display='block';document.getElementById('videoStatus').textContent='動画が完成しました。'}catch(e){document.getElementById('videoStatus').textContent='動画作成エラー：'+e.message}finally{activeExportSource=null;if(stream)stream.getTracks().forEach(t=>t.stop());if(ac&&ac.state!=='closed')try{await ac.close()}catch(_){}make.disabled=false;document.getElementById('cancelVideo').style.display='none'}};
})();`;d.body.appendChild(s)}catch(e){setTimeout(installMotion,500)}}
