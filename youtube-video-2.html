<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16233f"><title>YouTube動画作成2</title><style>html,body{margin:0;width:100%;height:100%;background:#f4f5f7}#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f4f5f7}</style></head><body><iframe id="app" src="youtube-video.html?v=caption-sync2" allow="microphone;camera"></iframe><script>
const frame=document.getElementById('app');

function install(){try{const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d||!d.head)return;if(d.documentElement.dataset.yt2Bridge==='5')return;d.documentElement.dataset.yt2Bridge='5';
const st=d.createElement('style');st.textContent=`.preview-title{left:8%!important;right:auto!important;top:6%!important;max-width:80%!important;white-space:normal!important;overflow-wrap:anywhere!important}.caption{left:9%!important;right:9%!important;bottom:7%!important;white-space:pre-line!important;overflow-wrap:anywhere!important;line-height:1.25!important}.outlier-brief{margin:0 0 13px;padding:15px;border:2px solid #36a265;border-radius:18px;background:#f1fbf4;color:#173d27}.outlier-brief h2{margin:0 0 10px}.outlier-grid{display:grid;gap:8px}.outlier-item{background:#fff;border-radius:11px;padding:10px;font-size:13px;line-height:1.55}.outlier-item b{display:block;color:#17683b;margin-bottom:3px}.outlier-ready{margin-top:10px;padding:9px;border-radius:10px;background:#dff4e6;font-weight:900;font-size:13px}`;d.head.appendChild(st);
const styleSel=d.getElementById('style');if(styleSel&&!styleSel.dataset.extendedStyles){styleSel.dataset.extendedStyles='1';const styles=[
['古写真・モノクロ史料風','documentary','19世紀末〜20世紀前半の歴史写真のようなモノクロ調。自然な粒子感、控えめなコントラスト、史料写真らしい質感。'],
['彩色古写真風','documentary','古い白黒写真を丁寧に手彩色したような歴史写真風。色は落ち着かせ、現代的に鮮やかすぎない。'],
['油絵・西洋歴史画風','documentary','重厚な西洋歴史画・油彩画のような表現。絵筆の質感、深い陰影、荘厳な構図。'],
['水彩・歴史挿絵風','documentary','上品な水彩の歴史挿絵風。柔らかな筆致、紙の質感、落ち着いた色彩。'],
['浮世絵・錦絵風','documentary','江戸〜明治期の浮世絵・錦絵を思わせる和風版画表現。平面的な色面、明瞭な輪郭、当時の版画らしい構図。'],
['墨絵・和風歴史画','documentary','墨絵を基調にした和風歴史画。余白を活かし、墨の濃淡と筆致で人物や情景を表現。'],
['明治・大正の新聞挿絵風','documentary','明治・大正期の新聞や雑誌の挿絵を思わせる細密な線画・版画風。歴史資料として自然な古典的表現。'],
['レトロポスター風','gekiga','20世紀前半のレトロな映画・宣伝ポスター風。大胆な構図と文字を置ける余白、少し退色した印刷質感。'],
['3DCG・博物館再現風','documentary','博物館の歴史再現展示のような精密3DCG。建物・衣装・道具の考証を重視し、過度なゲーム風表現は避ける。'],
['シネマティック再現ドラマ風','realistic','歴史再現ドラマのワンシーンのような実写シネマティック表現。自然な照明、映画的な被写界深度、人物中心。'],
['絵本・やさしい歴史イラスト','documentary','初心者にも親しみやすい歴史絵本風。分かりやすい形、柔らかな色、情報が一目で伝わる構図。'],
['地図・図解イラスト風','documentary','歴史解説用の地図・図解イラスト風。位置関係、移動、勢力、時系列が一目で理解できる情報デザイン。']
];for(const [label,val,prompt] of styles){const o=new Option(label,val);o.dataset.stylePrompt=prompt;styleSel.add(o)}}
if(!d.getElementById('yt2Style20Patch')){const sc=d.createElement('script');sc.id='yt2Style20Patch';sc.textContent=`(()=>{if(window.__yt2Style20Patched)return;window.__yt2Style20Patched=true;
function splitCaption(text,max=20){const src=String(text||'').replace(/\\s+/g,'').trim();if(!src)return[];const sentences=src.match(/[^。！？!?]+[。！？!?]?/g)||[src],out=[];for(const sentence of sentences){let rest=sentence;while(rest.length>max){let cut=max;for(let i=max;i>=Math.max(8,max-7);i--){if(/[、，,]/.test(rest[i-1])){cut=i;break}}out.push(rest.slice(0,cut));rest=rest.slice(cut)}if(rest)out.push(rest)}return out}
window.speechCaption=function(s,current,duration){const lead=Math.max(0,Number(s?.leadingSilenceMs||0))/1000;if(current<lead)return'';const chunks=splitCaption(s?.narration||'',20);if(!chunks.length)return'';const usable=Math.max(.1,(duration||1)-lead),t=Math.max(0,Math.min(usable,current-lead-.12));const weights=chunks.map(x=>Math.max(1,x.replace(/[。、，,.！？!?]/g,'').length)+(/[。！？!?]$/.test(x)?5:/[、，,]$/.test(x)?2:0));const total=weights.reduce((a,b)=>a+b,0),pos=t/usable*total;let acc=0;for(let i=0;i<chunks.length;i++){acc+=weights[i];if(pos<=acc)return chunks[i]}return chunks[chunks.length-1]};
window.draw=function(ctx,c,img,title,cap){ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height);const scale=Math.max(c.width/img.width,c.height/img.height),w=img.width*scale,h=img.height*scale;ctx.drawImage(img,(c.width-w)/2,(c.height-h)/2,w,h);const safeX=Math.round(c.width*.075),maxW=Math.round(c.width*.85);if(title){let fs=Math.round(c.height*.047);ctx.font='900 '+fs+'px sans-serif';while(fs>22&&ctx.measureText(title).width>maxW-34){fs-=2;ctx.font='900 '+fs+'px sans-serif'}const bw=Math.min(maxW,ctx.measureText(title).width+34),bh=Math.round(fs*1.65),y=Math.round(c.height*.055);ctx.fillStyle='#8f1d24';ctx.fillRect(safeX,y,bw,bh);ctx.fillStyle='#fff';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(title,safeX+17,y+bh/2)}if(cap){const txt=String(cap).trim();let fs=Math.round(c.height*.064);const minFs=Math.round(c.height*.045);ctx.font='900 '+fs+'px sans-serif';let lines=[];const wrap=()=>{const chars=[...txt.replace(/\\n/g,'')],arr=[];let line='';for(const ch of chars){const test=line+ch;if(ctx.measureText(test).width>maxW&&line){arr.push(line);line=ch}else line=test}if(line)arr.push(line);return arr};lines=wrap();while(fs>minFs&&(lines.length>2||lines.some(x=>ctx.measureText(x).width>maxW))){fs-=2;ctx.font='900 '+fs+'px sans-serif';lines=wrap()}if(lines.length>2){const joined=lines.join('');const mid=Math.ceil(joined.length/2);lines=[joined.slice(0,mid),joined.slice(mid)]}ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.strokeStyle='#000';ctx.lineWidth=Math.max(5,Math.round(fs*.16));ctx.fillStyle='#fff';const lh=Math.round(fs*1.28),base=c.height-Math.round(c.height*.075)-(lines.length-1)*lh;lines.forEach((line,j)=>{const y=base+j*lh;ctx.strokeText(line,c.width/2,y,maxW);ctx.fillText(line,c.width/2,y,maxW)})}};
const originalGenImage=window.genImage;if(typeof originalGenImage==='function'){window.genImage=async function(i){const sel=document.getElementById('style'),opt=sel?.selectedOptions?.[0],extra=opt?.dataset?.stylePrompt||'';if(!extra)return originalGenImage(i);const ta=document.getElementById('imgp-'+i);if(!ta)return originalGenImage(i);const old=ta.value;ta.value=old+'\\n\\n【画風指定】'+extra;try{return await originalGenImage(i)}finally{ta.value=old;if(typeof project!=='undefined'&&project?.scenes?.[i])project.scenes[i].imagePrompt=old}}}
const b=document.getElementById('allImages');if(b){b.onclick=async()=>{if(b.disabled||typeof project==='undefined'||!project?.scenes?.length)return;const u=document.getElementById('usage');let pending=project.scenes.map((s,i)=>s.image?null:i).filter(i=>i!==null);if(!pending.length){if(u)u.textContent='全シーンのAI画像はすでに完成しています。完成済み画像は再生成しません。';return}if(pending.length>20){if(u)u.textContent='安全装置：一度に生成できる画像は20枚までです。未完成'+pending.length+'枚あります。個別生成をご利用ください。';return}b.disabled=true;try{for(let p=0;p<pending.length;p++){const i=pending[p];b.textContent='AI画像生成中 '+(p+1)+'/'+pending.length;if(u)u.textContent='未完成シーンだけ生成中… SCENE '+(i+1)+'（'+(p+1)+'/'+pending.length+'）';try{await window.genImage(i)}catch(e){if(u)u.textContent='SCENE '+(i+1)+' の画像生成に失敗しました：'+(e?.message||e)+'。もう一度押すと未完成シーンから再開します。';return}await new Promise(r=>setTimeout(r,300))}if(u)u.textContent='未完成だった'+pending.length+'シーンのAI画像が完成しました。完成済み画像は再生成していません。'}finally{b.disabled=false;b.textContent='未完成シーンのAI画像を作る'}}}
})();`;d.body.appendChild(sc)}
let b=null;try{b=JSON.parse(localStorage.getItem('youtubeOutlierProductionBrief')||'null')}catch{}if(!b)return;
const topic=b.title||b.sourceTheme||'',thumb=b.thumbnailText||'',opening=b.opening||'',summary=b.contentSummary||b.reason||'',outline=Array.isArray(b.outline)?b.outline:[],source=b.sourceVideo||'';
const instruction=[`【外れ値YouTube AIからの制作指示】`,`動画テーマ：${topic}`,`サムネイル：${thumb||'AIでテーマに合う強い文言を作る'}`,opening?`冒頭の入り方：${opening}`:'',summary?`動画の方向性・内容：${summary}`:'',outline.length?`構成：\n${outline.map((x,i)=>`${i+1}. ${x}`).join('\n')}`:'',source?`参考になった外れ値動画：${source}`:'',`重要：参考動画をコピーしない。伸びた理由・構成・感情の動かし方だけを応用し、別のオリジナル動画として作る。`,`文章：最初の15秒で「続きを見たい」と思わせ、その後は初心者にも分かる自然な歴史解説。画面の文字を棒読みせず、背景・因果関係・人物の動機まで説明する。`,`画像：各シーンの内容を一目で理解できる歴史ドキュメンタリー風。人物が中心の場面は人物を大きくする。`,`史実：分からない事実を創作しない。断定できないことは断定しない。`].filter(Boolean).join('\n\n');
setVal(d,'topic',topic);setVal(d,'extra',instruction);const beginner=d.getElementById('beginner');if(beginner){beginner.checked=true;beginner.dispatchEvent(new Event('change',{bubbles:true}))}const mins=d.getElementById('minutes');if(mins&&!b.minutes)mins.value='5';
const main=d.querySelector('.main');if(main&&!d.getElementById('outlierBrief')){const box=d.createElement('section');box.id='outlierBrief';box.className='outlier-brief';box.innerHTML=`<h2>🔥 外れ値AIから次に作る動画を反映済み</h2><div class="outlier-grid"><div class="outlier-item"><b>動画テーマ</b>${esc(topic)}</div><div class="outlier-item"><b>サムネイル案</b>${esc(thumb||'自動作成')}</div>${opening?`<div class="outlier-item"><b>冒頭の文章・入り方</b>${esc(opening)}</div>`:''}${summary?`<div class="outlier-item"><b>内容・方向性</b>${esc(summary)}</div>`:''}${outline.length?`<div class="outlier-item"><b>構成</b>${outline.map((x,i)=>`${i+1}. ${esc(x)}`).join('<br>')}</div>`:''}</div><div class="outlier-ready">✅ 下の「動画のテーマ」と「追加の指示」にすでに入力しています。</div>`;main.insertBefore(box,main.firstChild)}
const topicEl=d.getElementById('topic'),extraEl=d.getElementById('extra');if(topicEl)topicEl.style.border='2px solid #36a265';if(extraEl){extraEl.style.border='2px solid #36a265';extraEl.style.minHeight='260px'}
}catch(e){console.warn(e);setTimeout(install,300)}}
