<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16233f"><title>YouTube動画作成2</title><style>html,body{margin:0;width:100%;height:100%;background:#f4f5f7}#core{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f4f5f7}</style></head><body><iframe id="core" src="youtube-video-2-core.html?v=motion1" allow="microphone;camera"></iframe><script>
const core=document.getElementById('core');
function installMotion(){try{const cd=core.contentDocument;if(!cd)return;const base=cd.getElementById('app');if(!base||!base.contentDocument)return;const d=base.contentDocument;if(d.documentElement.dataset.yt2Motion==='1')return;const s=d.createElement('script');s.textContent=`(()=>{if(window.__yt2Motion1)return;window.__yt2Motion1=true;document.documentElement.dataset.yt2Motion='1';
function ease(t){t=Math.max(0,Math.min(1,t||0));return t*t*(3-2*t)}
function pose(i,p){p=ease(p);const zoom=1.025+0.085*p,m=i%4;let x=0,y=0;if(m===0)x=-1.8+3.6*p;else if(m===1)x=1.8-3.6*p;else if(m===2)y=1.4-2.8*p;else y=-1.2+2.4*p;return{zoom,x,y}}
function drawMotion(ctx,c,img,title,cap,p=0,i=0){ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height);const q=pose(i,p),base=Math.max(c.width/img.width,c.height/img.height),sc=base*q.zoom,w=img.width*sc,h=img.height*sc,x=(c.width-w)/2+(q.x/100)*c.width,y=(c.height-h)/2+(q.y/100)*c.height;ctx.drawImage(img,x,y,w,h);const safeX=Math.round(c.width*.075),maxW=Math.round(c.width*.85);if(title){let fs=Math.round(c.height*.047);ctx.font='900 '+fs+'px sans-serif';while(fs>22&&ctx.measureText(title).width>maxW-34){fs-=2;ctx.font='900 '+fs+'px sans-serif'}const bw=Math.min(maxW,ctx.measureText(title).width+34),bh=Math.round(fs*1.65),ty=Math.round(c.height*.055);ctx.fillStyle='#8f1d24';ctx.fillRect(safeX,ty,bw,bh);ctx.fillStyle='#fff';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(title,safeX+17,ty+bh/2)}if(cap){const txt=String(cap).trim();let fs=Math.round(c.height*.064),minFs=Math.round(c.height*.045);ctx.font='900 '+fs+'px sans-serif';const wrap=()=>{const chars=[...txt.replace(/\\n/g,'')],arr=[];let line='';for(const ch of chars){const test=line+ch;if(ctx.measureText(test).width>maxW&&line){arr.push(line);line=ch}else line=test}if(line)arr.push(line);return arr};let lines=wrap();while(fs>minFs&&lines.length>2){fs-=2;ctx.font='900 '+fs+'px sans-serif';lines=wrap()}if(lines.length>2){const all=lines.join(''),mid=Math.ceil(all.length/2);lines=[all.slice(0,mid),all.slice(mid)]}ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.strokeStyle='#000';ctx.lineWidth=Math.max(5,Math.round(fs*.16));ctx.fillStyle='#fff';const lh=Math.round(fs*1.28),baseY=c.height-Math.round(c.height*.075)-(lines.length-1)*lh;lines.forEach((line,j)=>{const yy=baseY+j*lh;ctx.strokeText(line,c.width/2,yy,maxW);ctx.fillText(line,c.width/2,yy,maxW)})}}
function cssPose(i,p){const q=pose(i,p);return 'scale('+q.zoom+') translate('+q.x+'%,'+q.y+'%)'}
async function playMotion(s,a,i){const img=document.getElementById('previewImg'),title=document.getElementById('previewTitle'),caption=document.getElementById('previewCaption');img.src=s.image;title.textContent=s.title;caption.textContent='';img.style.willChange='transform';img.style.transform='scale(1.025)';a.currentTime=0;await a.play();await new Promise(resolve=>{let raf=0;const tick=()=>{const dur=Number.isFinite(a.duration)&&a.duration>0?a.duration:1,p=Math.max(0,Math.min(1,a.currentTime/dur));img.style.transform=cssPose(i,p);caption.textContent=speechCaption(s,a.currentTime,dur);if(a.ended){cancelAnimationFrame(raf);resolve();return}raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick)});img.style.willChange=''}
window.playScene=async i=>{sync(i);if(project?.scenes?.[i]?.audio)await playMotion(project.scenes[i],document.getElementById('audio-'+i),i)};
const play=document.getElementById('playAll');if(play)play.onclick=async()=>{for(let i=0;i<project.scenes.length;i++){const s=project.scenes[i];if(!s.image||!s.audio)continue;await playMotion(s,new Audio(s.audio),i);document.getElementById('previewProgress').style.width=Math.round((i+1)/project.scenes.length*100)+'%'}};
const make=document.getElementById('makeVideo');if(make)make.onclick=async()=>{if(project.scenes.some(s=>!s.image||!s.audio))return alert('全シーンの画像と音声を作ってください。');make.disabled=true;cancelRequested=false;document.getElementById('cancelVideo').style.display='block';let ac=null,stream=null;try{const c=document.createElement('canvas');c.width=aspect()==='9:16'?1080:1280;c.height=aspect()==='9:16'?1920:720;const ctx=c.getContext('2d'),AC=window.AudioContext||window.webkitAudioContext;ac=new AC;await ac.resume();const dest=ac.createMediaStreamDestination(),imgs=[],bufs=[];for(let i=0;i<project.scenes.length;i++){imgs.push(await loadImg(project.scenes[i].image));bufs.push(await ab(ac,project.scenes[i].audio))}const vs=c.captureStream(30);stream=new MediaStream([...vs.getVideoTracks(),...dest.stream.getAudioTracks()]);const mime=['video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x))||'',rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);const stopped=new Promise(r=>rec.onstop=r);rec.start(1000);for(let i=0;i<project.scenes.length&&!cancelRequested;i++){const scene=project.scenes[i],src=ac.createBufferSource();activeExportSource=src;src.buffer=bufs[i];src.connect(dest);src.start();const st=performance.now(),dur=bufs[i].duration;while(performance.now()-st<dur*1000&&!cancelRequested){const el=(performance.now()-st)/1000,p=Math.max(0,Math.min(1,el/dur));drawMotion(ctx,c,imgs[i],scene.title,speechCaption(scene,el,dur),p,i);document.getElementById('videoStatus').textContent='動画生成中… SCENE '+(i+1)+'/'+project.scenes.length+'（ゆっくりズーム・移動）';await wait(33)}}rec.stop();await stopped;if(cancelRequested){document.getElementById('videoStatus').textContent='動画生成を停止しました。';return}const type=rec.mimeType||mime||'video/webm',blob=new Blob(chunks,{type}),url=URL.createObjectURL(blob),ext=type.includes('mp4')?'mp4':'webm',rv=document.getElementById('resultVideo'),sl=document.getElementById('saveLink');rv.src=url;rv.style.display='block';sl.href=url;sl.download='youtube-video.'+ext;sl.textContent='完成した動画を保存';sl.style.display='block';document.getElementById('videoStatus').textContent='動画が完成しました。静止画にゆっくりした動きを入れています。'}catch(e){document.getElementById('videoStatus').textContent='動画作成エラー：'+e.message}finally{activeExportSource=null;if(stream)stream.getTracks().forEach(t=>t.stop());if(ac&&ac.state!=='closed')try{await ac.close()}catch(_){}make.disabled=false;document.getElementById('cancelVideo').style.display='none'}};
})();`;d.body.appendChild(s)}catch(e){setTimeout(installMotion,400)}}
core.addEventListener('load',()=>{setTimeout(installMotion,500);setTimeout(installMotion,1200);setTimeout(installMotion,2200)});
</script></body></html>
