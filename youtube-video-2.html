<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16233f"><title>YouTube動画作成2</title><style>html,body{margin:0;width:100%;height:100%;background:#f4f5f7}#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f4f5f7}</style></head><body><iframe id="app" src="youtube-video.html?v=outlier-autofill3" allow="microphone;camera"></iframe><script>
const frame=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function setVal(d,id,val){const e=d.getElementById(id);if(e&&val!=null){e.value=String(val);e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}))}}
function install(){try{const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d||!d.head)return;if(d.documentElement.dataset.yt2Bridge==='3')return;d.documentElement.dataset.yt2Bridge='3';
const st=d.createElement('style');st.textContent=`.preview-title{left:6%!important;right:auto!important;top:5%!important;max-width:86%!important;white-space:normal!important;overflow-wrap:anywhere!important}.caption{left:7%!important;right:7%!important;bottom:6%!important;white-space:pre-line!important;overflow-wrap:anywhere!important}.outlier-brief{margin:0 0 13px;padding:15px;border:2px solid #36a265;border-radius:18px;background:#f1fbf4;color:#173d27}.outlier-brief h2{margin:0 0 10px}.outlier-grid{display:grid;gap:8px}.outlier-item{background:#fff;border-radius:11px;padding:10px;font-size:13px;line-height:1.55}.outlier-item b{display:block;color:#17683b;margin-bottom:3px}.outlier-ready{margin-top:10px;padding:9px;border-radius:10px;background:#dff4e6;font-weight:900;font-size:13px}`;d.head.appendChild(st);
let b=null;try{b=JSON.parse(localStorage.getItem('youtubeOutlierProductionBrief')||'null')}catch{}if(!b)return;
const topic=b.title||b.sourceTheme||'',thumb=b.thumbnailText||'',opening=b.opening||'',summary=b.contentSummary||b.reason||'',outline=Array.isArray(b.outline)?b.outline:[],source=b.sourceVideo||'';
const instruction=[`【外れ値YouTube AIからの制作指示】`,`動画テーマ：${topic}`,`サムネイル：${thumb||'AIでテーマに合う強い文言を作る'}`,opening?`冒頭の入り方：${opening}`:'',summary?`動画の方向性・内容：${summary}`:'',outline.length?`構成：\n${outline.map((x,i)=>`${i+1}. ${x}`).join('\n')}`:'',source?`参考になった外れ値動画：${source}`:'',`重要：参考動画をコピーしない。伸びた理由・構成・感情の動かし方だけを応用し、別のオリジナル動画として作る。`,`文章：最初の15秒で「続きを見たい」と思わせ、その後は初心者にも分かる自然な歴史解説。画面の文字を棒読みせず、背景・因果関係・人物の動機まで説明する。`,`画像：各シーンの内容を一目で理解できる歴史ドキュメンタリー風。人物が中心の場面は人物を大きくする。`,`史実：分からない事実を創作しない。断定できないことは断定しない。`].filter(Boolean).join('\n\n');
setVal(d,'topic',topic);setVal(d,'extra',instruction);const beginner=d.getElementById('beginner');if(beginner){beginner.checked=true;beginner.dispatchEvent(new Event('change',{bubbles:true}))}const mins=d.getElementById('minutes');if(mins&&!b.minutes)mins.value='5';
const main=d.querySelector('.main');if(main&&!d.getElementById('outlierBrief')){const box=d.createElement('section');box.id='outlierBrief';box.className='outlier-brief';box.innerHTML=`<h2>🔥 外れ値AIから次に作る動画を反映済み</h2><div class="outlier-grid"><div class="outlier-item"><b>動画テーマ</b>${esc(topic)}</div><div class="outlier-item"><b>サムネイル案</b>${esc(thumb||'自動作成')}</div>${opening?`<div class="outlier-item"><b>冒頭の文章・入り方</b>${esc(opening)}</div>`:''}${summary?`<div class="outlier-item"><b>内容・方向性</b>${esc(summary)}</div>`:''}${outline.length?`<div class="outlier-item"><b>構成</b>${outline.map((x,i)=>`${i+1}. ${esc(x)}`).join('<br>')}</div>`:''}</div><div class="outlier-ready">✅ 下の「動画のテーマ」と「追加の指示」にすでに入力しています。</div>`;main.insertBefore(box,main.firstChild)}
const topicEl=d.getElementById('topic'),extraEl=d.getElementById('extra');if(topicEl)topicEl.style.border='2px solid #36a265';if(extraEl){extraEl.style.border='2px solid #36a265';extraEl.style.minHeight='260px'}
}catch(e){console.warn(e);setTimeout(install,300)}}
frame.addEventListener('load',()=>{install();setTimeout(install,300);setTimeout(install,900)});
</script></body></html>
