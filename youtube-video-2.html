<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16233f">
<title>YouTube動画作成2</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f4f5f7}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f4f5f7}
</style>
</head>
<body>
<iframe id="app" src="youtube-video.html?v=safearea1" allow="microphone;camera"></iframe>
<script>
const frame=document.getElementById('app');
function install(){
  try{
    const w=frame.contentWindow,d=frame.contentDocument;
    if(!w||!d||!d.head)return;
    if(d.documentElement.dataset.safeAreaFix==='1')return;
    d.documentElement.dataset.safeAreaFix='1';

    const style=d.createElement('style');
    style.textContent=`
      .preview-title{
        left:6%!important;
        right:auto!important;
        top:5%!important;
        max-width:86%!important;
        padding:7px 14px!important;
        font-size:clamp(15px,3vw,24px)!important;
        line-height:1.2!important;
        white-space:normal!important;
        overflow-wrap:anywhere!important;
      }
      .caption{
        left:7%!important;
        right:7%!important;
        bottom:6%!important;
        padding:2px 4px!important;
        font-size:clamp(18px,4vw,31px)!important;
        line-height:1.25!important;
        white-space:pre-line!important;
        overflow-wrap:anywhere!important;
      }
      .portrait .preview-title{left:8%!important;max-width:84%!important;top:5%!important}
      .portrait .caption{left:9%!important;right:9%!important;bottom:9%!important;font-size:clamp(19px,5.2vw,31px)!important}
    `;
    d.head.appendChild(style);

    function fitFont(ctx,text,maxWidth,start,min){
      let size=start;
      while(size>min){
        ctx.font=`900 ${size}px sans-serif`;
        if(ctx.measureText(text).width<=maxWidth)break;
        size-=2;
      }
      return size;
    }
    function wrapLine(ctx,text,maxWidth){
      const chars=[...String(text||'')],out=[];
      let line='';
      for(const ch of chars){
        const test=line+ch;
        if(line && ctx.measureText(test).width>maxWidth){out.push(line);line=ch}else line=test;
      }
      if(line)out.push(line);
      return out.length?out:[''];
    }
    function splitCaption(ctx,cap,maxWidth){
      const logical=String(cap||'').split(/\n+/),out=[];
      for(const ln of logical)out.push(...wrapLine(ctx,ln,maxWidth));
      return out.slice(0,3);
    }

    w.draw=function(ctx,c,img,title,cap){
      ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height);
      const sc=Math.max(c.width/img.width,c.height/img.height),iw=img.width*sc,ih=img.height*sc;
      ctx.drawImage(img,(c.width-iw)/2,(c.height-ih)/2,iw,ih);

      const side=Math.round(c.width*.06);
      if(title){
        const maxTitleW=c.width-side*2;
        const start=c.width<c.height?42:32;
        const min=c.width<c.height?26:22;
        const fs=fitFont(ctx,title,maxTitleW-34,start,min);
        ctx.font=`900 ${fs}px sans-serif`;
        const tw=Math.min(maxTitleW,ctx.measureText(title).width+34);
        const boxH=Math.round(fs*1.65);
        const x=side,y=Math.round(c.height*.045);
        ctx.fillStyle='#8f1d24';ctx.fillRect(x,y,tw,boxH);
        ctx.fillStyle='#fff';ctx.textAlign='left';ctx.textBaseline='middle';
        ctx.fillText(title,x+17,y+boxH/2,maxTitleW-34);
      }

      if(cap){
        const maxW=c.width-side*2;
        let fs=c.width<c.height?46:42;
        ctx.font=`900 ${fs}px sans-serif`;
        let lines=splitCaption(ctx,cap,maxW);
        while(fs>28 && lines.some(x=>ctx.measureText(x).width>maxW)){
          fs-=2;ctx.font=`900 ${fs}px sans-serif`;lines=splitCaption(ctx,cap,maxW);
        }
        const lh=Math.round(fs*1.22),bottom=Math.round(c.height*(c.width<c.height?.075:.06));
        const total=lh*lines.length;
        let y=c.height-bottom-total+fs;
        ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.lineJoin='round';
        ctx.strokeStyle='#000';ctx.lineWidth=Math.max(6,Math.round(fs*.17));ctx.fillStyle='#fff';
        for(const line of lines){
          ctx.strokeText(line,c.width/2,y,maxW);
          ctx.fillText(line,c.width/2,y,maxW);
          y+=lh;
        }
      }
    };
  }catch(e){setTimeout(install,300)}
}
frame.addEventListener('load',()=>{install();setTimeout(install,500)});
</script>
</body>
</html>
