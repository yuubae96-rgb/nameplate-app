<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16233f"><title>YouTube動画作成2</title><style>html,body{margin:0;width:100%;height:100%;background:#f4f5f7}#core{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f4f5f7}</style></head><body><iframe id="core" src="youtube-video-2-core.html?v=koala1" allow="microphone;camera"></iframe><script>
const core=document.getElementById('core');
function getBaseDoc(){try{const cd=core.contentDocument;if(!cd)return null;const base=cd.getElementById('app');if(!base||!base.contentDocument)return null;return base.contentDocument}catch(e){return null}}
function installNarrationStyle(){try{const d=getBaseDoc();if(!d){setTimeout(installNarrationStyle,500);return}if(d.documentElement.dataset.yt2NarrationStyle==='4'&&d.getElementById('narrationStyleField'))return;const extra=d.getElementById('extra'),make=d.getElementById('makeScript'),refs=d.getElementById('referenceUrls');if(!extra||!make||!refs){setTimeout(installNarrationStyle,500);return}const old=d.getElementById('narrationStyleField');if(old)old.remove();d.documentElement.dataset.yt2NarrationStyle='4';
const wrap=d.createElement('div');wrap.className='field';wrap.id='narrationStyleField';wrap.innerHTML='<label>動画の作り方</label><select id="narrationStyle"><option value="standard">通常</option><option value="suzuyu">すずゆう風</option><option value="koala">コアラ先生風</option></select><div class="hint" id="narrationStyleHint">通常の構成で作ります。</div>';
const refField=refs.closest('.field');refField.parentNode.insertBefore(wrap,refField);const sel=d.getElementById('narrationStyle'),hint=d.getElementById('narrationStyleHint');try{sel.value=localStorage.getItem('yt2NarrationStyle')||'standard'}catch(_){sel.value='standard'}
function syncHint(){if(sel.value==='suzuyu')hint.textContent='「あなたは…ですか？」→常識的な候補→意外な本題→重厚な深掘り、の型で作ります。';else if(sel.value==='koala')hint.textContent='黒板にイラストと短い文字を書きながら、先生が授業で教えるように解説します。画像は固定し、スーッと動かしません。';else hint.textContent='通常の構成で作ります。';try{localStorage.setItem('yt2NarrationStyle',sel.value)}catch(_){}}sel.onchange=syncHint;syncHint();
const SUZUYU=`【ナレーション構成：すずゆう風】\n最初の一文は必ず「あなたは……ですか？」。常識的な候補を2〜3個示し、意外だが史実に裏付けられた本題へ反転し、重厚な歴史ドキュメンタリー調で因果関係を深掘りする。単なる年代の羅列にせず、背景→狙い→転機→結果→歴史的意味→現代への接続で進める。史実の正確性を優先し、推測で埋めない。各SCENEは前後が自然につながるようにする。`;
const KOALA=`【動画構成：コアラ先生風】\nこの動画は、先生が黒板を使って授業をする教育動画として作る。\n\n【画像の絶対ルール】\n・全SCENEの背景は学校の黒板・チョークボードを基本にする。\n・黒板には、そのSCENEで説明する内容を理解しやすくする「簡潔な日本語の文字」と「手描き風のイラスト・図・矢印・年表・地図・人物の簡略画」などを組み合わせる。\n・文章を大量に書かず、重要語・数字・人物名・因果関係が一目で分かる板書にする。\n・実写映画風の画面ではなく、授業の板書として理解しやすい構成を優先する。\n・SCENEごとに黒板の内容は変えてよいが、黒板・チョークの統一感を保つ。\n・完成動画では画像にズーム、パン、Ken Burns効果などのスーッとした移動を一切加えない。各SCENEの画像は完全に固定して表示する。\n\n【しゃべり方の絶対ルール】\n・先生が生徒に授業で教えているような自然な日本語にする。\n・「ここが大事です」「では、なぜこうなったのでしょう」「黒板を見てください」「つまりこういうことです」のように、理解を確認しながら順序立てて説明する。\n・難しい専門用語は、その場で短く意味を説明する。\n・単なる文章の朗読ではなく、先生が要点を整理し、例を挙げ、前の内容とつなぎながら教える。\n・子どもっぽくしすぎず、大人の初心者にも分かりやすい授業調にする。\n・史実や事実を優先し、不明点を創作しない。\n・各SCENEは「今日ここで覚えること」が明確になるようにする。\n\n画像生成指示にも必ず「学校の黒板、チョークによる日本語の短い板書、説明用の手描きイラスト、図解、教育授業風、画面固定、カメラ移動なし」を反映する。`;
make.addEventListener('click',()=>{if(sel.value==='standard')return;const before=extra.value;const add=sel.value==='suzuyu'?SUZUYU:KOALA;extra.value=(before?before+'\n\n':'')+add;extra.dispatchEvent(new Event('input',{bubbles:true}));setTimeout(()=>{extra.value=before;extra.dispatchEvent(new Event('input',{bubbles:true}))},180)},true);
}catch(e){setTimeout(installNarrationStyle,500)}}
function installMotion(){try{const d=getBaseDoc();if(!d){setTimeout(installMotion,500);return}if(d.documentElement.dataset.yt2Motion==='2')return;const s=d.createElement('script');s.textContent=`(()=>{if(window.__yt2Motion2)return;window.__yt2Motion2=true;document.documentElement.dataset.yt2Motion='2';
function koalaMode(){try{return document.getElementById('narrationStyle')?.value==='koala'}catch(e){return false}}
function ease(t){t=Math.max(0,Math.min(1,t||0));return t*t*(3-2*t)}
function pose(i,p){if(koalaMode())return{zoom:1,x:0,y:0};p=ease(p);const zoom=1.025+0.085*p,m=i%4;let x=0,y=0;if(m===0)x=-1.8+3.6*p;else if(m===1)x=1.8-3.6*p;else if(m===2)y=1.4-2.8*p;else y=-1.2+2.4*p;return{zoom,x,y}}
function drawMotion(ctx,c,img,title,cap,p=0,i=0){ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height);const q=pose(i,p),base=Math.max(c.width/img.width,c.height/img.height),sc=base*q.zoom,w=img.width*sc,h=img.height*sc,x=(c.width-w)/2+(q.x/100)*c.width,y=(c.height-h)/2+(q.y/100)*c.height;ctx.drawImage(img,x,y,w,h);const safeX=Math.round(c.width*.075),maxW=Math.round(c.width*.85);if(title){let fs=Math.round(c.height*.047);ctx.font='900 '+fs+'px sans-serif';while(fs>22&&ctx.measureText(title).width>maxW-34){fs-=2;ctx.font='900 '+fs+'px sans-serif'}const bw=Math.min(maxW,ctx.measureText(title).width+34),bh=Math.round(fs*1.65),ty=Math.round(c.height*.055);ctx.fillStyle='#8f1d24';ctx.fillRect(safeX,ty,bw,bh);ctx.fillStyle='#fff';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(title,safeX+17,ty+bh/2)}if(cap){const txt=String(cap).trim();let fs=Math.round(c.height*.064),minFs=Math.round(c.height*.045);ctx.font='900 '+fs+'px sans-serif';const chars=[...txt.replace(/\\n/g,'')],lines=[];let line='';for(const ch of chars){const test=line+ch;if(ctx.measureText(test).width>maxW&&line){lines.push(line);line=ch}else line=test}if(line)lines.push(line);ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.strokeStyle='#000';ctx.lineWidth=Math.max(5,Math.round(fs*.16));ctx.fillStyle='#fff';const show=lines.slice(0,2),lh=Math.round(fs*1.28),baseY=c.height-Math.round(c.height*.075)-(show.length-1)*lh;show.forEach((ln,j)=>{const yy=baseY+j*lh;ctx.strokeText(ln,c.width/2,yy,maxW);ctx.fillText(ln,c.width/2,yy,maxW)})}}
function cssPose(i,p){const q=pose(i,p);return 'scale('+q.zoom+') translate('+q.x+'%,'+q.y+'%)'}
async function playMotion(scene,a,i){const img=document.getElementById('previewImg'),title=document.getElementById('previewTitle'),caption=document.getElementById('previewCaption');img.src=scene.image;title.textContent=scene.title;caption.textContent='';img.style.willChange=koalaMode()?'auto':'transform';img.style.transform=koalaMode()?'none':'scale(1.025)';a.currentTime=0;await a.play();await new Promise(resolve=>{let raf=0;const tick=()=>{const dur=Number.isFinite(a.duration)&&a.duration>0?a.duration:1,p=Math.max(0,Math.min(1,a.currentTime/dur));img.style.transform=koalaMode()?'none':cssPose(i,p);caption.textContent=speechCaption(scene,a.currentTime,dur);if(a.ended){cancelAnimationFrame(raf);resolve();return}raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick)});img.style.willChange=''}
window.playScene=async i=>{sync(i);if(project?.scenes?.[i]?.audio)await playMotion(project.scenes[i],document.getElementById('audio-'+i),i)};
const play=document.getElementById('playAll');if(play)play.onclick=async()=>{for(let i=0;i<project.scenes.length;i++){const sc=project.scenes[i];if(!sc.image||!sc.audio)continue;await playMotion(sc,new Audio(sc.audio),i);document.getElementById('previewProgress').style.width=Math.round((i+1)/project.scenes.length*100)+'%'}};
const make=document.getElementById('makeVideo');if(make)make.onclick=async()=>{if(project.scenes.some(s=>!s.image||!s.audio))return alert('全シーンの画像と音声を作ってください。');make.disabled=true;cancelRequested=false;document.getElementById('cancelVideo').style.display='block';let ac=null,stream=null;try{const c=document.createElement('canvas');c.width=aspect()==='9:16'?1080:1280;c.height=aspect()==='9:16'?1920:720;const ctx=c.getContext('2d'),AC=window.AudioContext||window.webkitAudioContext;ac=new AC;await ac.resume();const dest=ac.createMediaStreamDestination(),imgs=[],bufs=[];for(let i=0;i<project.scenes.length;i++){imgs.push(await loadImg(project.scenes[i].image));bufs.push(await ab(ac,project.scenes[i].audio))}const vs=c.captureStream(30);stream=new MediaStream([...vs.getVideoTracks(),...dest.stream.getAudioTracks()]);const mime=['video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x))||'',rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);const stopped=new Promise(r=>rec.onstop=r);rec.start(1000);for(let i=0;i<project.scenes.length&&!cancelRequested;i++){const scene=project.scenes[i],src=ac.createBufferSource();activeExportSource=src;src.buffer=bufs[i];src.connect(dest);src.start();const st=performance.now(),dur=bufs[i].duration;while(performance.now()-st<dur*1000&&!cancelRequested){const el=(performance.now()-st)/1000,p=Math.max(0,Math.min(1,el/dur));drawMotion(ctx,c,imgs[i],scene.title,speechCaption(scene,el,dur),p,i);document.getElementById('videoStatus').textContent='動画生成中… SCENE '+(i+1)+'/'+project.scenes.length+(koalaMode()?'（黒板・固定画面）':'（ゆっくりズーム・移動）');await wait(33)}}rec.stop();await stopped;if(cancelRequested){document.getElementById('videoStatus').textContent='動画生成を停止しました。';return}const type=rec.mimeType||mime||'video/webm',blob=new Blob(chunks,{type}),url=URL.createObjectURL(blob),ext=type.includes('mp4')?'mp4':'webm',rv=document.getElementById('resultVideo'),sl=document.getElementById('saveLink');rv.src=url;rv.style.display='block';sl.href=url;sl.download='youtube-video.'+ext;sl.textContent='完成した動画を保存';sl.style.display='block';document.getElementById('videoStatus').textContent='動画が完成しました。'}catch(e){document.getElementById('videoStatus').textContent='動画作成エラー：'+e.message}finally{activeExportSource=null;if(stream)stream.getTracks().forEach(t=>t.stop());if(ac&&ac.state!=='closed')try{await ac.close()}catch(_){}make.disabled=false;document.getElementById('cancelVideo').style.display='none'}};
})();`;d.body.appendChild(s)}catch(e){setTimeout(installMotion,500)}}
function installAll(){installNarrationStyle();installMotion()}
core.addEventListener('load',()=>{setTimeout(installAll,400);setTimeout(installAll,1000);setTimeout(installAll,2000)});setInterval(installNarrationStyle,1500);setTimeout(installAll,250);
</script></body></html>
