<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16233f"><title>YouTube動画作成2</title><style>html,body{margin:0;width:100%;height:100%;background:#f4f5f7}#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f4f5f7}</style></head><body><iframe id="app" src="youtube-video.html?v=outlierbridge1" allow="microphone;camera"></iframe><script>
const frame=document.getElementById('app');
function install(){try{const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d||!d.head)return;if(d.documentElement.dataset.yt2Bridge==='1')return;d.documentElement.dataset.yt2Bridge='1';const style=d.createElement('style');style.textContent=`.preview-title{left:6%!important;right:auto!important;top:5%!important;max-width:86%!important;padding:7px 14px!important;font-size:clamp(15px,3vw,24px)!important;line-height:1.2!important;white-space:normal!important;overflow-wrap:anywhere!important}.caption{left:7%!important;right:7%!important;bottom:6%!important;padding:2px 4px!important;font-size:clamp(18px,4vw,31px)!important;line-height:1.25!important;white-space:pre-line!important;overflow-wrap:anywhere!important}.outlier-brief{margin:10px 14px;padding:13px;border:2px solid #36a265;border-radius:15px;background:#f1fbf4;color:#173d27}.outlier-brief b{font-size:16px}.outlier-brief .step{font-size:13px;margin-top:5px}.outlier-brief button{width:100%;margin-top:10px;border:0;border-radius:11px;padding:12px;background:#168447;color:#fff;font-weight:900;font-size:15px}`;d.head.appendChild(style);
const raw=localStorage.getItem('youtubeOutlierProductionBrief');if(raw){try{const b=JSON.parse(raw),main=d.querySelector('.main');if(main&&!d.getElementById('outlierBrief')){const box=d.createElement('section');box.id='outlierBrief';box.className='outlier-brief';box.innerHTML=`<b>🔥 外れ値AIから制作指示を受け取りました</b><div class="step">テーマ：${esc(b.title||'')}</div><div class="step">サムネ案：${esc(b.thumbnailText||'')}</div><div class="step">①構成 → ②画像 → ③ナレーション → ④AI音声 → ⑤完成動画 の順で作ります。</div><button id="applyOutlier">この指示でYouTube動画作成を開始</button>`;main.insertBefore(box,main.firstChild);box.querySelector('#applyOutlier').onclick=()=>{const topic=d.getElementById('topic'),extra=d.getElementById('extra'),beginner=d.getElementById('beginner');if(topic)topic.value=b.title||'';if(beginner)beginner.checked=true;if(extra)extra.value=`【外れ値AIからの制作指示】\n元動画をコピーせず、伸びた構造だけを活用する。\n狙い目度: ${b.opportunityScore||''}/100\nサムネ案: ${b.thumbnailText||''}\n狙い: ${b.reason||b.angle||''}\n構成案:\n${(b.outline||[]).map((x,i)=>`${i+1}. ${x}`).join('\n')}\n\n視聴者が冒頭から続きを見たくなる構成にし、歴史的事実は推測せず正確性を優先する。`;const make=d.getElementById('makeScript');if(make){make.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>make.click(),500)}box.querySelector('button').textContent='構成作成を指示しました ✓';box.querySelector('button').disabled=true};}}}catch(e){console.warn(e)}}
function fitFont(ctx,text,maxWidth,start,min){let size=start;while(size>min){ctx.font=`900 ${size}px sans-serif`;if(ctx.measureText(text).width<=maxWidth)break;size-=2}return size}function wrapLine(ctx,text,maxWidth){const chars=[...String(text||'')],out=[];let line='';for(const ch of chars){const test=line+ch;if(line&&ctx.measureText(test).width>maxWidth){out.push(line);line=ch}else line=test}if(line)out.push(line);return out.length?out:['']}function splitCaption(ctx,cap,maxWidth){const out=[];for(const ln of String(cap||'').split(/\n+/))out.push(...wrapLine(ctx,ln,maxWidth));return out.slice(0,3)}w.draw=function(ctx,c,img,title,cap){ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height);const sc=Math.max(c.width/img.width,c.height/img.height),iw=img.width*sc,ih=img.height*sc;ctx.drawImage(img,(c.width-iw)/2,(c.height-ih)/2,iw,ih);const side=Math.round(c.width*.06);if(title){const maxW=c.width-side*2,fs=fitFont(ctx,title,maxW-34,c.width<c.height?42:32,c.width<c.height?26:22);ctx.font=`900 ${fs}px sans-serif`;const tw=Math.min(maxW,ctx.measureText(title).width+34),bh=Math.round(fs*1.65),x=side,y=Math.round(c.height*.045);ctx.fillStyle='#8f1d24';ctx.fillRect(x,y,tw,bh);ctx.fillStyle='#fff';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(title,x+17,y+bh/2,maxW-34)}if(cap){const maxW=c.width-side*2;let fs=c.width<c.height?46:42;ctx.font=`900 ${fs}px sans-serif`;let lines=splitCaption(ctx,cap,maxW);while(fs>28&&lines.some(x=>ctx.measureText(x).width>maxW)){fs-=2;ctx.font=`900 ${fs}px sans-serif`;lines=splitCaption(ctx,cap,maxW)}const lh=Math.round(fs*1.22),bottom=Math.round(c.height*(c.width<c.height?.075:.06)),total=lh*lines.length;let y=c.height-bottom-total+fs;ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.lineJoin='round';ctx.strokeStyle='#000';ctx.lineWidth=Math.max(6,Math.round(fs*.17));ctx.fillStyle='#fff';for(const line of lines){ctx.strokeText(line,c.width/2,y,maxW);ctx.fillText(line,c.width/2,y,maxW);y+=lh}}};}catch(e){setTimeout(install,300)}}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}frame.addEventListener('load',()=>{install();setTimeout(install,500)});
</script></body></html>
