const styleSel=d.getElementById('style');if(styleSel&&!styleSel.dataset.extendedStyles){styleSel.dataset.extendedStyles='1';const styles=[['古写真・モノクロ史料風','documentary','19世紀末〜20世紀前半の歴史写真のようなモノクロ調。自然な粒子感、控えめなコントラスト、史料写真らしい質感。'],['彩色古写真風','documentary','古い白黒写真を丁寧に手彩色したような歴史写真風。色は落ち着かせ、現代的に鮮やかすぎない。'],['油絵・西洋歴史画風','documentary','重厚な西洋歴史画・油彩画のような表現。絵筆の質感、深い陰影、荘厳な構図。'],['水彩・歴史挿絵風','documentary','上品な水彩の歴史挿絵風。柔らかな筆致、紙の質感、落ち着いた色彩。'],['浮世絵・錦絵風','documentary','江戸〜明治期の浮世絵・錦絵を思わせる和風版画表現。平面的な色面、明瞭な輪郭、当時の版画らしい構図。'],['墨絵・和風歴史画','documentary','墨絵を基調にした和風歴史画。余白を活かし、墨の濃淡と筆致で人物や情景を表現。'],['明治・大正の新聞挿絵風','documentary','明治・大正期の新聞や雑誌の挿絵を思わせる細密な線画・版画風。歴史資料として自然な古典的表現。'],['レトロポスター風','gekiga','20世紀前半のレトロな映画・宣伝ポスター風。大胆な構図と文字を置ける余白、少し退色した印刷質感。'],['3DCG・博物館再現風','documentary','博物館の歴史再現展示のような精密3DCG。建物・衣装・道具の考証を重視し、過度なゲーム風表現は避ける。'],['シネマティック再現ドラマ風','realistic','歴史再現ドラマのワンシーンのような実写シネマティック表現。自然な照明、映画的な被写界深度、人物中心。'],['絵本・やさしい歴史イラスト','documentary','初心者にも親しみやすい歴史絵本風。分かりやすい形、柔らかな色、情報が一目で伝わる構図。'],['地図・図解イラスト風','documentary','歴史解説用の地図・図解イラスト風。位置関係、移動、勢力、時系列が一目で理解できる情報デザイン。']];for(const [label,val,prompt] of styles){const o=new Option(label,val);o.dataset.stylePrompt=prompt;styleSel.add(o)}}
if(!d.getElementById('yt2ReadingPatch')){const sc=d.createElement('script');sc.id='yt2ReadingPatch';sc.textContent=`(()=>{if(window.__yt2ReadingPatched)return;window.__yt2ReadingPatched=true;
const DICT_KEY='yt2ReadingDictionaryV1';const DEFAULT_DICT={'宮城事件':'きゅうじょうじけん'};const KNOWN={'宮城事件':'きゅうじょうじけん','重光葵':'しげみつまもる','阿南惟幾':'あなみこれちか','近衛文麿':'このえふみまろ','鈴木貫太郎':'すずきかんたろう','木戸幸一':'きどこういち','東郷茂徳':'とうごうしげのり','迫水久常':'さこみずひさつね','畑俊六':'はたしゅんろく','梅津美治郎':'うめづよしじろう'};
function loadDict(){try{const x=JSON.parse(localStorage.getItem(DICT_KEY)||'null');if(x&&typeof x==='object')return x}catch(e){}localStorage.setItem(DICT_KEY,JSON.stringify(DEFAULT_DICT));return {...DEFAULT_DICT}}
function parseDict(text){const o={};String(text||'').split(/\\n/).forEach(line=>{const m=line.match(/^\\s*(.+?)\\s*(?:=|→|=>|：|:)\\s*(.+?)\\s*$/);if(m&&m[1]&&m[2])o[m[1]]=m[2]});return o}
function dictText(o){return Object.entries(o).map(([a,b])=>a+' = '+b).join('\\n')}
function applyReading(text,dict=loadDict()){let out=String(text||'');Object.entries(dict).sort((a,b)=>b[0].length-a[0].length).forEach(([from,to])=>{if(from)out=out.split(from).join(to)});return out}
function applyAllReadings(){if(typeof project==='undefined'||!project?.scenes?.length)return 0;const dict=loadDict();let changed=0;project.scenes.forEach((s,i)=>{const source=(document.getElementById('nar-'+i)?.value)||s.narration||'';const next=applyReading(source,dict);const read=document.getElementById('read-'+i);if(read&&read.value!==next){read.value=next;read.dispatchEvent(new Event('input',{bubbles:true}));changed++}s.reading=next});return changed}
function addReadingBox(){if(document.getElementById('readingDictionary'))return;const topic=document.getElementById('topic');if(!topic)return;const card=topic.closest('.card');if(!card)return;const box=document.createElement('details');box.className='reading-details';box.id='readingDictionary';box.innerHTML='<summary>📖 読み方辞書（必要な時だけ）</summary><div class="reading-body"><div class="reading-note">ここに一度登録すると、全SCENEの音声用の読み方へ自動反映します。字幕の文字は変わりません。次の動画でも保存されます。</div><textarea id="readingDictText"></textarea><div class="reading-example">例：宮城事件 = きゅうじょうじけん</div><div class="reading-actions"><button type="button" class="btn navy" id="saveReadingDict">保存して全ページへ反映</button><button type="button" class="btn" id="checkReadingTerms">全ページの対象語をチェック</button></div><div id="readingStatus" class="reading-status"></div><div id="readingSuggestions" class="reading-suggestions"></div></div>';const firstRef=card.querySelector('.refbox');if(firstRef)card.insertBefore(box,firstRef);else card.appendChild(box);const ta=document.getElementById('readingDictText'),status=document.getElementById('readingStatus'),sug=document.getElementById('readingSuggestions');ta.value=dictText(loadDict());document.getElementById('saveReadingDict').onclick=()=>{const obj=parseDict(ta.value);localStorage.setItem(DICT_KEY,JSON.stringify(obj));const n=applyAllReadings();status.textContent='✅ 読み方辞書を保存し、音声用の読み方へ反映しました。対象SCENE '+n+'件。字幕は元の漢字表記のままです。'};document.getElementById('checkReadingTerms').onclick=()=>{if(typeof project==='undefined'||!project?.scenes?.length){status.textContent='先に「AIで動画構成を作る」を押してください。';return}const dict=loadDict(),hits=[],known=[];project.scenes.forEach((s,i)=>{const text=(document.getElementById('nar-'+i)?.value)||s.narration||'';Object.keys(dict).forEach(k=>{if(text.includes(k))hits.push(k+'：SCENE '+(i+1))});Object.entries(KNOWN).forEach(([k,v])=>{if(text.includes(k)&&!dict[k])known.push([k,v])})});status.textContent=hits.length?'登録済みの読み方が見つかりました：'+[...new Set(hits)].join(' / '):'登録済みの対象語は見つかりませんでした。';const uniq=[];const seen=new Set;known.forEach(x=>{if(!seen.has(x[0])){seen.add(x[0]);uniq.push(x)}});if(uniq.length){sug.innerHTML='<b>読み間違い候補：</b><br>'+uniq.map(([k,v])=>'<button type="button" class="btn" style="margin:4px 4px 0 0;min-height:34px;font-size:11px" data-k="'+k+'" data-v="'+v+'">＋ '+k+' → '+v+'</button>').join('');sug.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{const obj=parseDict(ta.value);obj[btn.dataset.k]=btn.dataset.v;ta.value=dictText(obj);btn.disabled=true;btn.textContent='追加済み'})}else sug.textContent=''};}
function splitCaption(text,max=20){const src=String(text||'').replace(/\\s+/g,'').trim();if(!src)return[];const sentences=src.match(/[^。！？!?]+[。！？!?]?/g)||[src],out=[];for(const sentence of sentences){let rest=sentence;while(rest.length>max){let cut=max;for(let i=max;i>=Math.max(8,max-7);i--){if(/[、，,]/.test(rest[i-1])){cut=i;break}}out.push(rest.slice(0,cut));rest=rest.slice(cut)}if(rest)out.push(rest)}return out}
window.speechCaption=function(s,current,duration){const lead=Math.max(0,Number(s?.leadingSilenceMs||0))/1000;const manual=Number(s?.captionDelay||0);const rate=Math.max(.65,Math.min(1.35,Number(s?.captionRate||1)));const baseDelay=.75;const start=lead+baseDelay+manual;if(current<start)return'';const chunks=splitCaption(s?.narration||'',20);if(!chunks.length)return'';const usable=Math.max(.1,(duration||1)-lead-baseDelay-manual),t=Math.max(0,Math.min(usable,current-start));const weights=chunks.map(x=>Math.max(1,x.replace(/[。、，,.！？!?]/g,'').length)+(/[。！？!?]$/.test(x)?11:/[、，,]$/.test(x)?5:0));const total=weights.reduce((a,b)=>a+b,0),ratio=Math.max(0,Math.min(1,(t/usable)*rate)),pos=Math.pow(ratio,1.12)*total;let acc=0;for(let i=0;i<chunks.length;i++){acc+=weights[i];if(pos<=acc)return chunks[i]}return chunks[chunks.length-1]};
window.draw=function(ctx,c,img,title,cap){ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height);const scale=Math.max(c.width/img.width,c.height/img.height),w=img.width*scale,h=img.height*scale;ctx.drawImage(img,(c.width-w)/2,(c.height-h)/2,w,h);const safeX=Math.round(c.width*.075),maxW=Math.round(c.width*.85);if(title){let fs=Math.round(c.height*.047);ctx.font='900 '+fs+'px sans-serif';while(fs>22&&ctx.measureText(title).width>maxW-34){fs-=2;ctx.font='900 '+fs+'px sans-serif'}const bw=Math.min(maxW,ctx.measureText(title).width+34),bh=Math.round(fs*1.65),y=Math.round(c.height*.055);ctx.fillStyle='#8f1d24';ctx.fillRect(safeX,y,bw,bh);ctx.fillStyle='#fff';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(title,safeX+17,y+bh/2)}if(cap){const txt=String(cap).trim();let fs=Math.round(c.height*.064),minFs=Math.round(c.height*.045);ctx.font='900 '+fs+'px sans-serif';let lines=[];const wrap=()=>{const chars=[...txt.replace(/\\n/g,'')],arr=[];let line='';for(const ch of chars){const test=line+ch;if(ctx.measureText(test).width>maxW&&line){arr.push(line);line=ch}else line=test}if(line)arr.push(line);return arr};lines=wrap();while(fs>minFs&&(lines.length>2||lines.some(x=>ctx.measureText(x).width>maxW))){fs-=2;ctx.font='900 '+fs+'px sans-serif';lines=wrap()}if(lines.length>2){const joined=lines.join(''),mid=Math.ceil(joined.length/2);lines=[joined.slice(0,mid),joined.slice(mid)]}ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.strokeStyle='#000';ctx.lineWidth=Math.max(5,Math.round(fs*.16));ctx.fillStyle='#fff';const lh=Math.round(fs*1.28),base=c.height-Math.round(c.height*.075)-(lines.length-1)*lh;lines.forEach((line,j)=>{const y=base+j*lh;ctx.strokeText(line,c.width/2,y,maxW);ctx.fillText(line,c.width/2,y,maxW)})}};
function addTimingControls(){if(typeof project==='undefined'||!project?.scenes)return;project.scenes.forEach((s,i)=>{if(typeof s.captionDelay!=='number')s.captionDelay=0;if(typeof s.captionRate!=='number')s.captionRate=1;if(document.getElementById('captionTiming-'+i))return;const nar=document.getElementById('nar-'+i);if(!nar)return;const field=nar.closest('.field');const details=document.createElement('details');details.className='timing-details';details.id='captionTiming-'+i;details.innerHTML='<summary>字幕タイミングを調整（必要な時だけ）</summary><div class="timing-body"><div class="timing-note">普段は触らなくてOKです。このSCENEだけ字幕が早い・遅い時に調整します。変更後は「このシーンを再生」で確認してください。</div><div class="timing-grid"><div><label>字幕を全体に遅らせる／早める</label><input id="capDelay-'+i+'" type="number" min="-2" max="5" step="0.1" value="'+s.captionDelay.toFixed(1)+'"><div class="timing-value">＋で遅く、−で早く（秒）</div></div><div><label>字幕の進む速さ</label><input id="capRate-'+i+'" type="number" min="65" max="135" step="5" value="'+Math.round(s.captionRate*100)+'"><div class="timing-value">100＝標準、90＝ゆっくり</div></div></div><button type="button" class="btn timing-reset" id="capReset-'+i+'">標準に戻す</button></div>';field.insertAdjacentElement('afterend',details);const delay=document.getElementById('capDelay-'+i),rate=document.getElementById('capRate-'+i),reset=document.getElementById('capReset-'+i);delay.oninput=()=>{s.captionDelay=Math.max(-2,Math.min(5,Number(delay.value)||0))};rate.oninput=()=>{s.captionRate=Math.max(.65,Math.min(1.35,(Number(rate.value)||100)/100))};reset.onclick=()=>{s.captionDelay=0;s.captionRate=1;delay.value='0.0';rate.value='100'}})}
const originalRender=typeof render==='function'?render:null;if(originalRender){render=function(){const r=originalRender.apply(this,arguments);setTimeout(()=>{addTimingControls();applyAllReadings()},0);return r}}
const originalGenAudio=window.genAudio;if(typeof originalGenAudio==='function'){window.genAudio=async function(i){if(typeof project!=='undefined'&&project?.scenes?.[i]){const s=project.scenes[i],nar=document.getElementById('nar-'+i),read=document.getElementById('read-'+i),src=nar?.value||s.narration||'';const next=applyReading(src);if(read)read.value=next;s.reading=next}return originalGenAudio(i)}}
const originalGenImage=window.genImage;if(typeof originalGenImage==='function'){window.genImage=async function(i){const sel=document.getElementById('style'),opt=sel?.selectedOptions?.[0],extra=opt?.dataset?.stylePrompt||'';if(!extra)return originalGenImage(i);const ta=document.getElementById('imgp-'+i);if(!ta)return originalGenImage(i);const old=ta.value;ta.value=old+'\\n\\n【画風指定】'+extra;try{return await originalGenImage(i)}finally{ta.value=old;if(typeof project!=='undefined'&&project?.scenes?.[i])project.scenes[i].imagePrompt=old}}}
const b=document.getElementById('allImages');if(b){b.onclick=async()=>{if(b.disabled||typeof project==='undefined'||!project?.scenes?.length)return;const u=document.getElementById('usage');let pending=project.scenes.map((s,i)=>s.image?null:i).filter(i=>i!==null);if(!pending.length){if(u)u.textContent='全シーンのAI画像はすでに完成しています。完成済み画像は再生成しません。';return}if(pending.length>20){if(u)u.textContent='安全装置：一度に生成できる画像は20枚までです。未完成'+pending.length+'枚あります。個別生成をご利用ください。';return}b.disabled=true;try{for(let p=0;p<pending.length;p++){const i=pending[p];b.textContent='AI画像生成中 '+(p+1)+'/'+pending.length;if(u)u.textContent='未完成シーンだけ生成中… SCENE '+(i+1)+'（'+(p+1)+'/'+pending.length+'）';try{await window.genImage(i)}catch(e){if(u)u.textContent='SCENE '+(i+1)+' の画像生成に失敗しました：'+(e?.message||e)+'。もう一度押すと未完成シーンから再開します。';return}await new Promise(r=>setTimeout(r,300))}if(u)u.textContent='未完成だった'+pending.length+'シーンのAI画像が完成しました。完成済み画像は再生成していません。'}finally{b.disabled=false;b.textContent='未完成シーンのAI画像を作る'}}}
setTimeout(()=>{addReadingBox();addTimingControls();applyAllReadings()},300);
