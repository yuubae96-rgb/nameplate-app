const sc=d.createElement('script');sc.textContent=`(()=>{if(window.__yt2ReadingCheck2)return;window.__yt2ReadingCheck2=true;

function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){return{}}}
function save(o){localStorage.setItem(KEY,JSON.stringify(o))}
function parse(t){const o={};String(t||'').split(/\\n/).forEach(line=>{const m=line.match(/^\\s*(.+?)\\s*(?:=|→|=>|：|:)\\s*(.+?)\\s*$/);if(m)o[m[1]]=m[2]});return o}
function text(o){return Object.entries(o).map(([a,b])=>a+' = '+b).join('\\n')}
function applyReading(v,dict=load()){let out=String(v||'');Object.entries(dict).sort((a,b)=>b[0].length-a[0].length).forEach(([a,b])=>{out=out.split(a).join(b)});return out}
function applyAll(){if(typeof project==='undefined'||!project?.scenes?.length)return 0;const dict=load();let n=0;project.scenes.forEach((s,i)=>{const src=document.getElementById('nar-'+i)?.value||s.narration||'';const next=applyReading(src,dict);const r=document.getElementById('read-'+i);if(r&&r.value!==next){r.value=next;n++}s.reading=next});return n}
function scanCandidates(){if(typeof project==='undefined'||!project?.scenes?.length)return[];const dict=load(),found=new Map();project.scenes.forEach((s,i)=>{const src=document.getElementById('nar-'+i)?.value||s.narration||'';Object.entries(KNOWN).forEach(([term,reading])=>{if(src.includes(term)&&!dict[term]){if(!found.has(term))found.set(term,{term,reading,scenes:[]});found.get(term).scenes.push(i+1)}})});return [...found.values()]}
function addReadingBox(){if(document.getElementById('readingDictionary'))return;const topic=document.getElementById('topic');if(!topic)return;const card=topic.closest('.card');const box=document.createElement('details');box.className='reading-details';box.id='readingDictionary';box.innerHTML='<summary>📖 読み方辞書（必要な時だけ）</summary><div class="reading-body"><div class="reading-note">まず全ページを一括チェックできます。候補を登録すると、字幕は漢字のまま、AI音声用の読み方だけ直します。</div><button type="button" class="btn reading-scan" id="scanReadings">🔍 全ページの読み間違い候補をチェック</button><div id="readingCandidates" class="reading-candidates"></div><div class="reading-note">登録済みの辞書。必要なら直接編集もできます。</div><textarea id="readingDictText"></textarea><div class="reading-actions"><button type="button" class="btn navy" id="saveReadingDict">保存して全ページへ反映</button><button type="button" class="btn" id="clearReadingCandidates">候補表示を閉じる</button></div><div id="readingStatus" class="reading-status">構成作成後に上のチェックを押してください。</div></div>';const ref=card.querySelector('.refbox');if(ref)card.insertBefore(box,ref);else card.appendChild(box);const ta=document.getElementById('readingDictText'),status=document.getElementById('readingStatus'),list=document.getElementById('readingCandidates');ta.value=text(load());
document.getElementById('scanReadings').onclick=()=>{if(typeof project==='undefined'||!project?.scenes?.length){status.textContent='先に「AIで動画構成を作る」を押してください。';return}const c=scanCandidates();if(!c.length){list.innerHTML='';status.textContent='新しい読み間違い候補は見つかりませんでした。';return}status.textContent='候補を'+c.length+'件見つけました。必要なものだけ「＋登録」を押してください。';list.innerHTML=c.map(x=>'<div class="reading-candidate"><b>'+x.term+' → '+x.reading+'</b><small>SCENE '+x.scenes.join('・')+' にあります</small><button class="btn" data-term="'+x.term+'" data-reading="'+x.reading+'">＋ この読み方を登録</button></div>').join('');list.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{const o=parse(ta.value);o[btn.dataset.term]=btn.dataset.reading;ta.value=text(o);btn.disabled=true;btn.textContent='追加済み';status.textContent='追加しました。最後に「保存して全ページへ反映」を押してください。'})};
document.getElementById('saveReadingDict').onclick=()=>{const o=parse(ta.value);save(o);const n=applyAll();status.textContent='✅ 保存しました。音声用の読み方へ反映済みです。字幕は漢字表記のままです。対象 '+n+' SCENE。'};
document.getElementById('clearReadingCandidates').onclick=()=>{list.innerHTML='';status.textContent='候補表示を閉じました。辞書はそのまま残っています。'};}
function splitCaption(text,max=20){const src=String(text||'').replace(/\\s+/g,'').trim();if(!src)return[];const ss=src.match(/[^。！？!?]+[。！？!?]?/g)||[src],out=[];for(const s of ss){let r=s;while(r.length>max){let cut=max;for(let i=max;i>=Math.max(8,max-7);i--){if(/[、，,]/.test(r[i-1])){cut=i;break}}out.push(r.slice(0,cut));r=r.slice(cut)}if(r)out.push(r)}return out}
window.speechCaption=function(s,current,duration){const lead=Math.max(0,Number(s?.leadingSilenceMs||0))/1000,manual=Number(s?.captionDelay||0),rate=Math.max(.65,Math.min(1.35,Number(s?.captionRate||1))),base=.75,start=lead+base+manual;if(current<start)return'';const ch=splitCaption(s?.narration||'',20);if(!ch.length)return'';const usable=Math.max(.1,(duration||1)-lead-base-manual),t=Math.max(0,Math.min(usable,current-start)),weights=ch.map(x=>Math.max(1,x.replace(/[。、，,.！？!?]/g,'').length)+(/[。！？!?]$/.test(x)?11:/[、，,]$/.test(x)?5:0)),total=weights.reduce((a,b)=>a+b,0),ratio=Math.max(0,Math.min(1,(t/usable)*rate)),pos=Math.pow(ratio,1.12)*total;let a=0;for(let i=0;i<ch.length;i++){a+=weights[i];if(pos<=a)return ch[i]}return ch[ch.length-1]};
function addTiming(){if(typeof project==='undefined'||!project?.scenes)return;project.scenes.forEach((s,i)=>{if(typeof s.captionDelay!=='number')s.captionDelay=0;if(typeof s.captionRate!=='number')s.captionRate=1;if(document.getElementById('captionTiming-'+i))return;const nar=document.getElementById('nar-'+i);if(!nar)return;const f=nar.closest('.field'),x=document.createElement('details');x.className='timing-details';x.id='captionTiming-'+i;x.innerHTML='<summary>字幕タイミングを調整（必要な時だけ）</summary><div class="timing-body"><div class="timing-note">このSCENEだけ字幕が早い・遅い時に調整します。</div><div class="timing-grid"><input id="capDelay-'+i+'" type="number" min="-2" max="5" step="0.1" value="'+s.captionDelay.toFixed(1)+'"><input id="capRate-'+i+'" type="number" min="65" max="135" step="5" value="'+Math.round(s.captionRate*100)+'"></div><button class="btn timing-reset" id="capReset-'+i+'">標準に戻す</button></div>';f.insertAdjacentElement('afterend',x);document.getElementById('capDelay-'+i).oninput=e=>s.captionDelay=Number(e.target.value)||0;document.getElementById('capRate-'+i).oninput=e=>s.captionRate=(Number(e.target.value)||100)/100;document.getElementById('capReset-'+i).onclick=()=>{s.captionDelay=0;s.captionRate=1;document.getElementById('capDelay-'+i).value='0.0';document.getElementById('capRate-'+i).value='100'}})}
const oldRender=typeof render==='function'?render:null;if(oldRender){render=function(){const r=oldRender.apply(this,arguments);setTimeout(()=>{addTiming();applyAll()},0);return r}}
const oldAudio=window.genAudio;if(typeof oldAudio==='function'){window.genAudio=async function(i){if(typeof project!=='undefined'&&project?.scenes?.[i]){const s=project.scenes[i],src=document.getElementById('nar-'+i)?.value||s.narration||'',next=applyReading(src),r=document.getElementById('read-'+i);if(r)r.value=next;s.reading=next}return oldAudio(i)}}
const oldImg=window.genImage;if(typeof oldImg==='function'){window.genImage=async function(i){const sel=document.getElementById('style'),opt=sel?.selectedOptions?.[0],extra=opt?.dataset?.stylePrompt||'';if(!extra)return oldImg(i);const ta=document.getElementById('imgp-'+i);if(!ta)return oldImg(i);const old=ta.value;ta.value=old+'\\n\\n【画風指定】'+extra;try{return await oldImg(i)}finally{ta.value=old;if(typeof project!=='undefined'&&project?.scenes?.[i])project.scenes[i].imagePrompt=old}}}
const all=document.getElementById('allImages');if(all){all.onclick=async()=>{if(all.disabled||typeof project==='undefined'||!project?.scenes?.length)return;const u=document.getElementById('usage'),pending=project.scenes.map((s,i)=>s.image?null:i).filter(i=>i!==null);if(!pending.length){u.textContent='全シーンのAI画像はすでに完成しています。';return}if(pending.length>20){u.textContent='一度に生成できる画像は20枚までです。未完成'+pending.length+'枚あります。';return}all.disabled=true;try{for(let p=0;p<pending.length;p++){all.textContent='AI画像生成中 '+(p+1)+'/'+pending.length;u.textContent='未完成シーンだけ生成中… SCENE '+(pending[p]+1);try{await window.genImage(pending[p])}catch(e){u.textContent='SCENE '+(pending[p]+1)+' の画像生成に失敗しました：'+(e?.message||e);return}await new Promise(r=>setTimeout(r,300))}u.textContent='未完成だった'+pending.length+'シーンのAI画像が完成しました。'}finally{all.disabled=false;all.textContent='未完成シーンのAI画像を作る'}}}
setTimeout(()=>{addReadingBox();addTiming();applyAll()},300);

if(b){const topic=b.title||b.sourceTheme||'',thumb=b.thumbnailText||'',opening=b.opening||'',summary=b.contentSummary||b.reason||'',outline=Array.isArray(b.outline)?b.outline:[];setVal(d,'topic',topic);const instruction=[`【外れ値YouTube AIからの制作指示】`,`動画テーマ：${topic}`,`サムネイル：${thumb||'自動作成'}`,opening?`冒頭：${opening}`:'',summary?`内容：${summary}`:'',outline.length?`構成：\n${outline.map((x,i)=>`${i+1}. ${x}`).join('\n')}`:'',`参考動画をコピーせず、伸びた理由・構成だけ応用する。`].filter(Boolean).join('\n\n');setVal(d,'extra',instruction);const main=d.querySelector('.main');if(main&&!d.getElementById('outlierBrief')){const box=d.createElement('section');box.id='outlierBrief';box.className='outlier-brief';box.innerHTML='<h2>🔥 外れ値AIから次に作る動画を反映済み</h2><div class="outlier-item"><b>動画テーマ</b>'+esc(topic)+'</div><div class="outlier-item"><b>サムネイル案</b>'+esc(thumb||'自動作成')+'</div>';main.insertBefore(box,main.firstChild)}}
}catch(e){console.warn(e);setTimeout(install,400)}}
