<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><title>銘板原稿AI2｜直接トレース試験版</title></head><body><div style="padding:32px;text-align:center;font-weight:700">銘板原稿AI2・直接トレース試験版を読み込み中…</div><script>(async()=>{try{const base='https://raw.githubusercontent.com/yuubae96-rgb/nameplate-app/main/nameplate-original-ai-v25.html';const r=await fetch(base,{cache:'no-store'});if(!r.ok)throw new Error('元画面の読込失敗');let h=await r.text();h=h.replace("https://emauqxftmauvsffdjvyh.supabase.co/functions/v1/read-nameplate-drawing","https://emauqxftmauvsffdjvyh.supabase.co/functions/v1/read-nameplate-direct-trace-v2");h=h.replace('銘板原稿AI　テスト版59・板外形／表面加工領域を分離','銘板原稿AI2　直接トレース試験版・穴座標から四隅えぐりを作図');h=h.replace('板そのもの・穴・黒ベタや塗装等の加工領域・文字を別々に読み取ります。','元図の文字位置を優先し、四隅の黒地えぐりはAI任せにせず穴座標から幾何作図します。');const patch=`<script>
(function(){
 const NS='http://www.w3.org/2000/svg';
 const oldProof=proof;
 function qn(v){const n=Number(v);return Number.isFinite(n)?n:null}
 function addDeterministicGround(svgEl){
  const W=qn(ai.width_mm),H=qn(ai.height_mm),D=qn(ai.hole_diameter_mm);
  const hp=Array.isArray(ai.hole_positions)?ai.hole_positions.map(p=>({x:qn(p.x_mm),y:qn(p.y_mm)})).filter(p=>p.x!=null&&p.y!=null):[];
  if(!W||!H||hp.length!==4||!D)return;
  const black=/black|黒/i.test(String(ai.ground_color||''))||/black|黒/i.test(String(ai.text_line_color||''))===false&&((ai.surface_regions||[]).some(r=>/black|黒/i.test(String(r.color||''))));
  if(!black)return;
  const rootGroup=svgEl.querySelector('g[clip-path]');if(!rootGroup)return;
  const plate=[...svgEl.children].find(el=>el.tagName&&el.tagName.toLowerCase()==='rect');
  if(plate)plate.setAttribute('fill','#ddd');
  [...rootGroup.querySelectorAll('rect')].forEach(el=>{const fill=(el.getAttribute('fill')||'').toLowerCase(),ww=qn(el.getAttribute('width'))||0,hh=qn(el.getAttribute('height'))||0;if((fill==='#111'||fill==='#000'||fill==='black')&&ww>W*.7&&hh>H*.7)el.remove()});
  const defs=svgEl.querySelector('defs')||svgEl.insertBefore(document.createElementNS(NS,'defs'),svgEl.firstChild);
  const mask=document.createElementNS(NS,'mask');mask.setAttribute('id','ai2GroundMask');
  const white=document.createElementNS(NS,'rect');white.setAttribute('x','0');white.setAttribute('y','0');white.setAttribute('width',String(W));white.setAttribute('height',String(H));white.setAttribute('fill','white');mask.appendChild(white);
  const edge=Math.min(...hp.map(p=>Math.min(p.x,p.y,W-p.x,H-p.y)).filter(v=>v>0));
  const fallback=Math.max(D/2+2,edge||8);
  let cut=8;
  const sr=(Array.isArray(ai.surface_regions)?ai.surface_regions:[]).find(r=>String(r.corner_style||'')==='concave'||String(r.shape||'')==='corner_cutout_rect');
  const rr=qn(sr?.radius_mm);if(rr&&rr>D/2)cut=rr;else if(fallback>0)cut=fallback;
  hp.forEach(p=>{const c=document.createElementNS(NS,'circle');c.setAttribute('cx',String(p.x));c.setAttribute('cy',String(p.y));c.setAttribute('r',String(cut));c.setAttribute('fill','black');mask.appendChild(c)});defs.appendChild(mask);
  const ground=document.createElementNS(NS,'rect');ground.setAttribute('x','0');ground.setAttribute('y','0');ground.setAttribute('width',String(W));ground.setAttribute('height',String(H));ground.setAttribute('fill','#111');ground.setAttribute('mask','url(#ai2GroundMask)');ground.setAttribute('data-ai2-ground','deterministic');
  const firstHole=rootGroup.querySelector('circle');rootGroup.insertBefore(ground,firstHole||rootGroup.firstChild);
 }
 function refineTrace(){
  const svgEl=document.querySelector('#art svg'); if(!svgEl) return;
  addDeterministicGround(svgEl);
  const textNodes=[...svgEl.querySelectorAll('text')];
  const textEls=(Array.isArray(ai.layout?.elements)?ai.layout.elements:[]).filter(e=>e.type==='text');
  const H=Number(ai.height_mm)||100;
  textNodes.forEach((node,i)=>{const e=textEls[i]||{};node.removeAttribute('textLength');node.removeAttribute('lengthAdjust');const fp=Number(e.font_size_pct);if(Number.isFinite(fp)&&fp>0)node.setAttribute('font-size',String(H*fp/100));node.setAttribute('font-family','Hiragino Maru Gothic ProN, Yu Gothic, Meiryo, sans-serif');});
  const old=document.querySelector('.trace-note');if(old)old.remove();const tag=document.createElement('div');tag.className='trace-note';tag.style.cssText='margin-top:10px;font-size:12px;color:#5a6772';tag.textContent='AI2：四隅の黒地えぐりは、確定した穴中心座標からプログラムで固定作図しています。';const art=document.getElementById('art');if(art)art.insertAdjacentElement('afterend',tag);
 }
 proof=function(){oldProof();requestAnimationFrame(refineTrace)};const b=document.getElementById('proofBtn');if(b)b.onclick=proof;const s=document.getElementById('status');if(s)s.textContent='AI2：穴位置が確定したら四隅の黒地えぐりを幾何計算で作図します。';
})();
<\/script>`;h=h.replace('</body>',patch+'</body>');document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<div style="padding:32px;color:#b00">AI2試験版の読込に失敗しました。元版は保持されています。</div>'}})();</script></body></html>
