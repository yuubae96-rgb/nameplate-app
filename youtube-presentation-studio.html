<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16233f">
<title>プレゼン動画スタジオ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f5;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#17213a}.wrap{max-width:820px;margin:auto;padding-bottom:calc(180px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:20;background:#16233f;color:white;padding:calc(9px + env(safe-area-inset-top)) 14px 10px}.top h1{font-size:18px;margin:0}.top p{font-size:11px;margin:3px 0 0;opacity:.8}.frame{width:100%;height:calc(100vh - 74px);border:0;background:white}.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom));z-index:30;width:min(790px,calc(100% - 16px));background:rgba(255,255,255,.98);border:1px solid #ccd4df;border-radius:18px;box-shadow:0 12px 35px rgba(0,0,0,.18);padding:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:12px;min-height:44px;padding:9px;font-size:13px;font-weight:900;background:#eef1f5;color:#17213a}.primary{background:#2366b1;color:#fff}.green{background:#147a55;color:#fff}.danger{background:#8f1d24;color:#fff}.file{width:100%;font-size:12px}.audio{width:100%;height:38px;margin-top:8px}.now{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:8px 0;font-weight:900}.page{font-size:18px}.time{font-family:monospace;font-size:14px;color:#526078}.cuts{font-size:11px;line-height:1.45;color:#526078;max-height:42px;overflow:auto;margin-top:6px}.hint{font-size:11px;line-height:1.45;color:#657187;margin-top:6px}.ok{color:#147a55;font-weight:800}.err{color:#a33;font-weight:800}@media(max-width:520px){.row{grid-template-columns:1fr 1fr}.dock{padding:10px}.frame{height:calc(100vh - 65px)}}
</style>
</head>
<body>
<div class="wrap"><div class="top"><h1>🎞️ プレゼン動画スタジオ</h1><p>下の本体アプリ＋長い音声の手動ページ切替</p></div><iframe id="app" class="frame" src="youtube-presentation.html?v=manual1"></iframe></div>
<div class="dock">
  <input id="longAudio" class="file" type="file" accept="audio/*">
  <audio id="player" class="audio" controls></audio>
  <div class="now"><div class="page" id="pageNow">PDFを先に読み込んでください</div><div class="time" id="timeNow">0:00.0</div></div>
  <div class="row">
    <button class="btn primary" id="cut" disabled>ここで次ページ</button>
    <button class="btn" id="undo" disabled>1つ戻す</button>
    <button class="btn" id="preview" disabled>切替を確認</button>
    <button class="btn green" id="apply" disabled>この区切りで反映</button>
  </div>
  <div id="cuts" class="cuts"></div>
  <div id="msg" class="hint">使い方：PDFを本体で読み込む → 長い音声を選ぶ → 再生しながらページが変わる場所で「ここで次ページ」。音声そのものは切断せず、最後にページ単位へ割り当てます。</div>
</div>
<script>
const $=id=>document.getElementById(id),frame=$('app'),player=$('player');let file=null,cuts=[],previewTimer=null;function fmt(s){s=Math.max(0,s||0);let m=Math.floor(s/60),x=(s-m*60).toFixed(1).padStart(4,'0');return`${m}:${x}`}function child(){return frame.contentWindow}function pageCount(){try{return frame.contentDocument.querySelectorAll('.slide').length}catch{return 0}}function currentPage(){let n=pageCount();if(!n)return 0;let t=player.currentTime,i=0;while(i<cuts.length&&t>=cuts[i])i++;return Math.min(n,i+1)}function update(){let n=pageCount(),p=currentPage();$('timeNow').textContent=fmt(player.currentTime);$('pageNow').textContent=n?`現在 PAGE ${p} / ${n}`:'PDFを先に読み込んでください';$('cuts').textContent=cuts.length?`区切り：${cuts.map((t,i)=>`PAGE ${i+1}→${i+2} ${fmt(t)}`).join(' ｜ ')}`:'区切りはまだありません';let ready=!!file&&n>0;$('cut').disabled=!ready||cuts.length>=Math.max(0,n-1);$('undo').disabled=!cuts.length;$('preview').disabled=!ready;$('apply').disabled=!ready||cuts.length!==Math.max(0,n-1)}setInterval(update,150);$('longAudio').onchange=()=>{file=$('longAudio').files[0]||null;cuts=[];if(file){player.src=URL.createObjectURL(file);$('msg').textContent=`「${file.name}」を読み込みました。再生して、次のページへ変わる瞬間でボタンを押してください。`}update()};$('cut').onclick=()=>{let n=pageCount();if(!file||!n)return;let t=player.currentTime;if(cuts.length&&t<=cuts[cuts.length-1]+.1){$('msg').innerHTML='<span class="err">前の区切りより後の位置で押してください。</span>';return}cuts.push(t);$('msg').innerHTML=`<span class="ok">PAGE ${cuts.length} → PAGE ${cuts.length+1} を ${fmt(t)} に記録しました。</span>`;update()};$('undo').onclick=()=>{let t=cuts.pop();if(t!=null){player.currentTime=t;$('msg').textContent=`最後の区切り ${fmt(t)} を取り消しました。`}update()};$('preview').onclick=async()=>{let n=pageCount();if(!file||!n)return;$('msg').textContent='切替プレビュー中。下の本体画面のPDFページも切り替えて確認できます。';clearInterval(previewTimer);await player.play();previewTimer=setInterval(()=>{let p=currentPage();try{let img=frame.contentDocument.querySelector(`#slides .slide:nth-child(${p}) .thumb img`);if(img){let pv=frame.contentDocument.getElementById('previewImg');if(pv)pv.src=img.src}}catch{}if(player.ended){clearInterval(previewTimer)}},100)};
async function decodeFile(f){let AC=window.AudioContext||window.webkitAudioContext,ac=new AC,buf=await ac.decodeAudioData(await f.arrayBuffer());return{ac,buf}}function wavBlob(buf,startSec,endSec){let sr=buf.sampleRate,start=Math.max(0,Math.floor(startSec*sr)),end=Math.min(buf.length,Math.floor(endSec*sr)),len=Math.max(0,end-start),ab=new ArrayBuffer(44+len*2),dv=new DataView(ab),w=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');dv.setUint32(4,36+len*2,true);w(8,'WAVE');w(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,sr,true);dv.setUint32(28,sr*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);w(36,'data');dv.setUint32(40,len*2,true);let data=buf.getChannelData(0),o=44;for(let i=start;i<end;i++){let x=Math.max(-1,Math.min(1,data[i]));dv.setInt16(o,x<0?x*0x8000:x*0x7fff,true);o+=2}return new Blob([ab],{type:'audio/wav'})}
$('apply').onclick=async()=>{let n=pageCount();if(!file||!n)return;if(cuts.length!==n-1){$('msg').innerHTML=`<span class="err">${n}ページなので区切りは${n-1}か所必要です。</span>`;return}$('apply').disabled=true;$('msg').textContent='長い音声をページごとに割り当て中…';try{let {ac,buf}=await decodeFile(file),pts=[0,...cuts,buf.duration];for(let i=0;i<n;i++){let blob=wavBlob(buf,pts[i],pts[i+1]),seg=new File([blob],`manual-page-${String(i+1).padStart(2,'0')}.wav`,{type:'audio/wav'});if(typeof child().setPageAudio!=='function')throw Error('本体アプリの音声割り当て機能を確認できません。');child().setPageAudio(i,seg);await new Promise(r=>setTimeout(r,40))}await ac.close();$('msg').innerHTML='<span class="ok">手動の区切りを全ページへ反映しました。本体の「プレビュー再生」→「1本の動画を完成させる」へ進めます。</span>'}catch(e){$('msg').innerHTML=`<span class="err">反映エラー：${e.message}</span>`}finally{$('apply').disabled=false;update()}};
</script>
</body></html>
