<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>銘板原稿AI｜テスト版</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#f4f6f8;margin:0;color:#1d2733}header{background:#17324d;color:#fff;padding:18px}header h1{font-size:21px;margin:0}main{max-width:980px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px #0001}h2{font-size:18px;margin-top:0}.upload{border:2px dashed #9aa8b6;border-radius:12px;padding:20px;text-align:center}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}label{font-size:12px;font-weight:700}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd3da;border-radius:8px;margin-top:4px;font-size:16px}.warn{background:#fff4c7;border:1px solid #e5bf42;padding:10px;border-radius:8px;margin:10px 0}.ok{background:#eaf7ee;border:1px solid #77bd89;padding:10px;border-radius:8px;margin:10px 0}.error{background:#fdeaea;border:1px solid #d96b6b;padding:10px;border-radius:8px;margin:10px 0}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:9px;padding:11px 16px;font-weight:700;font-size:15px;background:#17324d;color:white}.secondary{background:#657483}button:disabled{opacity:.55}.plate-wrap{text-align:center;overflow:auto}.plate{display:inline-block;background:#111;color:#eee;border:1px solid #555;width:300px;height:300px;position:relative}.plate .row{border-bottom:2px solid #ddd;height:54px;display:flex;align-items:center;justify-content:center;font-size:22px}.plate .company{padding-top:48px;font-size:17px;line-height:1.6}.hole{position:absolute;width:35px;height:35px;border:3px solid #ddd;border-radius:50%;top:108px}.hole:after{content:"";position:absolute;width:8px;height:8px;background:#ddd;border-radius:50%;left:13px;top:13px}.hl{left:18px}.hr{right:18px}.np{position:absolute;bottom:5px;right:9px;font-size:12px}.small{font-size:12px;color:#657483}.preview{max-width:100%;max-height:360px;margin-top:12px;border-radius:8px;display:none}.status{font-weight:700;margin-top:12px}.dimbox{margin-top:12px;font-size:13px;background:#f7f9fb;padding:10px;border-radius:8px;white-space:pre-wrap}@media(max-width:650px){.grid{grid-template-columns:1fr}.plate{width:260px;height:260px}.plate .row{height:47px;font-size:19px}.hole{top:96px}.plate .company{padding-top:38px}}
</style></head>
<body><header><h1>銘板原稿AI <span style="font-size:12px">テスト版</span></h1></header><main>
<div class="card"><h2>1. 客先図面</h2><div class="upload"><input id="file" type="file" accept="image/*,.pdf"><p>客先図面のPDF・写真を選択</p><img id="preview" class="preview" alt="図面プレビュー"><div class="buttons" style="justify-content:center"><button id="readBtn" onclick="readDrawing()">AIで図面を読み取る</button></div><div id="status" class="status small">図面を選んで「AIで図面を読み取る」を押してください。</div></div></div>
<div class="card"><h2>2. AI読取結果・事務員確認</h2><div id="resultNote" class="ok">読取前です。AI結果はここへ自動入力されます。</div><div class="grid">
<label>品名<input id="name"></label><label>図番<input id="drawing"></label>
<label>材質<input id="material"></label><label>板厚 mm<input id="thick"></label>
<label>横 mm<input id="w" type="number" step="0.1"></label><label>縦 mm<input id="h" type="number" step="0.1"></label>
<label>穴径 mm<input id="hole" type="number" step="0.1"></label><label>穴数<input id="holes" type="number"></label>
<label>R<select id="radius"><option>不明</option><option>Rなし</option><option>Rあり</option></select></label><label>合格番号<input id="number"></label>
<label>合格年月<input id="date"></label><label>地色<input id="ground"></label>
<label>文字・線色<input id="ink"></label><label>会社名<input id="company"></label>
</div><div id="warnings" class="warn">⚠ AIが確信できない項目は「要確認」として残します。人が確認してから原稿化してください。</div><div id="dims" class="dimbox">寸法情報：未読取</div><div class="buttons"><button onclick="renderPlate()">確認して原稿プレビュー</button></div></div>
<div class="card"><h2>3. 原稿プレビュー</h2><div class="plate-wrap"><div class="plate" id="plate"><div class="row" id="pdate">労(----.-)検</div><div class="row" id="pnum">第----号</div><span class="hole hl"></span><span class="hole hr"></span><div class="company" id="pcompany">会社名</div><span class="np" id="pnp">NP----</span></div></div><div class="buttons"><button onclick="downloadSVG()">Illustrator用SVG出力</button><button class="secondary" onclick="window.print()">印刷/PDF保存</button></div><p class="small">SVGは入力された外形寸法をmm実寸で出力します。現段階では穴位置・罫線位置・文字位置は仮配置です。次段階で客先図面の寸法値を使って精密化します。</p></div>
</main><script>
const SUPABASE_URL='https://emauqxftmauvsffdjvyh.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtYXVxeGZ0bWF1dnNmZmRqdnloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4Njg0NzksImV4cCI6MjEwMjQ0NDQ3OX0.iN2xz71VCeP7o6nz89v0wJMrUYkGyPKATtWaCl-MIO4';
const $=id=>document.getElementById(id);
$('file').addEventListener('change',()=>{const f=$('file').files[0];if(!f)return;if(f.type.startsWith('image/')){const u=URL.createObjectURL(f);$('preview').src=u;$('preview').style.display='inline-block'}else{$('preview').style.display='none'}$('status').textContent=f.name+' を選択しました。';});
function toDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});}
function setv(id,v){$(id).value=(v===null||v===undefined)?'':v}
async function readDrawing(){const f=$('file').files[0];if(!f){alert('客先図面を選択してください');return}const b=$('readBtn');b.disabled=true;$('status').textContent='AIが図面を読んでいます…';$('resultNote').className='ok';$('resultNote').textContent='読取中です。';try{const data=await toDataURL(f);const r=await fetch(SUPABASE_URL+'/functions/v1/read-nameplate-drawing',{method:'POST',headers:{'Content-Type':'application/json','apikey':ANON,'Authorization':'Bearer '+ANON},body:JSON.stringify({data,type:f.type,name:f.name})});const j=await r.json();if(!r.ok||j.error)throw new Error(j.error||'読取に失敗しました');const x=j.result||{};setv('name',x.name);setv('drawing',x.drawing_no);setv('material',x.material);setv('thick',x.thickness_mm);setv('w',x.width_mm);setv('h',x.height_mm);setv('hole',x.hole_diameter_mm);setv('holes',x.hole_count);setv('radius',x.radius||'不明');setv('number',x.approval_number);setv('date',x.approval_date);setv('ground',x.ground_color);setv('ink',x.text_line_color);setv('company',x.company);const warnings=Array.isArray(x.warnings)?x.warnings.filter(Boolean):[];$('warnings').textContent=warnings.length?'⚠ 要確認：'+warnings.join(' ／ '):'✓ AI上の警告はありません。ただし人の最終確認は必要です。';$('warnings').className=warnings.length?'warn':'ok';const dims=Array.isArray(x.dimensions)?x.dimensions:[];$('dims').textContent='寸法情報：'+(dims.length?dims.map(d=>`${d.label||''} ${d.value_mm??''}mm ${d.note||''}`.trim()).join('\n'):'明示寸法の追加情報なし');$('resultNote').textContent='AI読取完了　信頼度: '+(x.confidence??'不明');$('status').textContent='読取が終わりました。下の項目を事務員さんが確認してください。';renderPlate();}catch(e){$('resultNote').className='error';$('resultNote').textContent='読取エラー：'+e.message;$('status').textContent='読取できませんでした。';}finally{b.disabled=false}}
function renderPlate(){$('pdate').textContent='労('+$('date').value+')検';$('pnum').textContent='第'+$('number').value+'号';$('pcompany').innerHTML=($('company').value||'会社名').replace('株式会社','株式会社<br>');$('pnp').textContent=($('drawing').value||'NP----').replace(/-1$/,'');}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));}
function downloadSVG(){const W=+$('w').value,H=+$('h').value,d=+$('hole').value;if(!W||!H){alert('横・縦寸法を確認してください');return}const r=d/2,date=esc($('date').value),num=esc($('number').value),company=esc($('company').value),dw=esc($('drawing').value.replace(/-1$/,''));const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}mm" height="${H}mm" viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="black"/><g fill="none" stroke="#eee" stroke-width="0.18"><rect x="0.15" y="0.15" width="${W-.3}" height="${H-.3}"/><line x1="0" y1="3.5" x2="${W}" y2="3.5"/><line x1="0" y1="7" x2="${W}" y2="7"/>${d?`<circle cx="3" cy="9" r="${r}"/><circle cx="${W-3}" cy="9" r="${r}"/>`:''}</g><g fill="#eee" font-family="sans-serif" text-anchor="middle"><text x="${W/2}" y="2.6" font-size="2.2">労(${date})検</text><text x="${W/2}" y="6" font-size="2.2">第${num}号</text><text x="${W/2}" y="12.5" font-size="1.6">${company}</text><text x="${W-2.5}" y="${H-0.7}" font-size="0.9">${dw}</text></g></svg>`;const blob=new Blob([svg],{type:'image/svg+xml'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(dw||'nameplate')+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
</script></body></html>
