<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>銘板原稿AI｜テスト版</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#f4f6f8;margin:0;color:#1d2733}header{background:#17324d;color:#fff;padding:18px}header h1{font-size:21px;margin:0}main{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px #0001}h2{font-size:19px;margin-top:0}.upload{border:2px dashed #9aa8b6;border-radius:12px;padding:20px;text-align:center}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}label{font-size:13px;font-weight:700}input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd3da;border-radius:8px;margin-top:4px;font-size:16px}.ok,.warn,.error,.info,.summary{padding:13px;border-radius:10px;margin:12px 0;line-height:1.65}.ok{background:#eaf7ee;border:1px solid #77bd89}.warn{background:#fff4c7;border:1px solid #e5bf42}.error{background:#fdeaea;border:1px solid #d96b6b}.info{background:#edf5ff;border:1px solid #7aa8dc}.summary{background:#f7f9fb;border:1px solid #d7dee5}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:9px;padding:12px 16px;font-weight:700;font-size:15px;background:#17324d;color:#fff}.secondary{background:#657483}button:disabled{opacity:.5}.small{font-size:12px;color:#657483}.hidden{display:none}.preview{max-width:100%;max-height:360px;margin-top:12px;border-radius:8px;display:none}.status{font-weight:700;margin-top:12px}.need{border-left:5px solid #e5a100;padding-left:12px;margin:14px 0}.need h3{font-size:16px;margin:0 0 8px}.auto-row{padding:7px 0;border-bottom:1px solid #e3e8ed}.auto-row:last-child{border:0}.check{font-weight:800;color:#16723b}.details{margin-top:14px}.details summary{font-weight:700;cursor:pointer;padding:10px 0}.plate-wrap{text-align:center;overflow:auto}.plate{display:inline-block;background:#111;color:#eee;border:1px solid #555;width:300px;height:300px;position:relative}.plate .row{border-bottom:2px solid #ddd;height:54px;display:flex;align-items:center;justify-content:center;font-size:22px}.plate .company{padding-top:48px;font-size:17px;line-height:1.6}.hole{position:absolute;width:35px;height:35px;border:3px solid #ddd;border-radius:50%;top:108px}.hole:after{content:"";position:absolute;width:8px;height:8px;background:#ddd;border-radius:50%;left:13px;top:13px}.hl{left:18px}.hr{right:18px}.np{position:absolute;bottom:5px;right:9px;font-size:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}.plate{width:260px;height:260px}.plate .row{height:47px;font-size:19px}.hole{top:96px}.plate .company{padding-top:38px}}
</style></head><body>
<header><h1>銘板原稿AI <span style="font-size:12px">テスト版</span></h1></header><main>
<div class="card"><h2>1. 客先図面</h2><div class="upload"><input id="file" type="file" accept="image/*,.pdf"><p>客先図面のPDF・写真を選択</p><img id="preview" class="preview"><div class="buttons" style="justify-content:center"><button id="readBtn">AIで図面を読み取る</button></div><div id="status" class="status small">図面を選んでAI読取してください。</div></div></div>
<div class="card hidden" id="reviewCard"><h2>2. 今回、人が確認するところ</h2><div id="autoStatus" class="ok"></div><div id="needs"></div><div id="readyBox" class="hidden"><div class="ok"><b>確認完了。</b> AI読取＋過去実績で社内指示内容を作成できます。</div><button id="confirmBtn">社内指示内容を確認</button></div><details class="details"><summary>AIが自動で確定した内容を見る</summary><div id="autoList" class="summary"></div></details><details class="details"><summary>16項目すべてを表示・修正する</summary><div class="grid" id="allFields">
<label>1. NP番号<input id="drawing"></label><label>2. 版区分<select id="version"><option>要確認</option><option>新版</option><option>工程変更（版を確認）</option><option>改版</option></select></label><label>3. 注文数<input id="qty" type="number"></label><label>4. 材料<input id="material"></label><label>5. 板厚<input id="thick"></label><label>6. 製作方法<select id="method"><option>要確認</option><option>エッチング</option><option>シール</option><option>オフセット</option><option>新フルカラー</option><option>シルク</option><option>シルク(H)</option><option>アルマイト</option><option>写真シール</option><option>彫刻</option></select></label><label>7. 地色<input id="ground"></label><label>8. 文字・線色<input id="ink"></label><label>9. 横 mm<input id="w" type="number" step="0.1"></label><label>10. 縦 mm<input id="h" type="number" step="0.1"></label><label>11. 穴径 mm<input id="hole" type="number" step="0.1"></label><label>12. 穴数<input id="holes" type="number"></label><label>13. R<select id="radius"><option>不明</option><option>Rなし</option><option>Rあり</option></select></label><label>14. データ<select id="data"><option>要確認</option><option>有</option><option>無</option></select></label><label>15. 校正<select id="proof"><option>要確認</option><option>有</option><option>有（データ）</option><option>無</option></select></label><label>16. 継続区分<select id="continuation"><option>要確認</option><option>今回限り</option><option>継続品</option></select></label></div><h3>原稿に使う文字情報</h3><div class="grid"><label>品名<input id="name"></label><label>会社名<input id="company"></label><label>合格番号<input id="number"></label><label>合格年月<input id="date"></label></div></details><div id="warnings" class="small"></div></div>
<div class="card hidden" id="instructionCard"><h2>3. 社内指示内容</h2><div id="instructionSummary" class="summary"></div><div class="buttons"><button id="makeBtn">この内容で銘板原稿を作る</button><button class="secondary" id="backBtn">修正する</button></div></div>
<div class="card hidden" id="previewCard"><h2>4. 銘板原稿</h2><div id="previewStatus" class="ok"></div><div class="plate-wrap"><div class="plate"><div class="row" id="pdate">労(----.-)検</div><div class="row" id="pnum">第----号</div><span class="hole hl"></span><span class="hole hr"></span><div class="company" id="pcompany">会社名</div><span class="np" id="pnp">NP----</span></div></div><div class="buttons"><button id="svgBtn">Illustrator用SVG出力</button><button class="secondary" onclick="window.print()">印刷/PDF保存</button></div><p class="small">原稿配置はまだ仮です。実物原稿との照合後に文字位置・穴位置を精密化します。</p></div>
</main><script>
const SUPABASE_URL='https://emauqxftmauvsffdjvyh.supabase.co';const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtYXVxeGZ0bWF1dnNmZmRqdnloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4Njg0NzksImV4cCI6MjEwMjQ0NDQ3OX0.iN2xz71VCeP7o6nz89v0wJMrUYkGyPKATtWaCl-MIO4';
const $=id=>document.getElementById(id),clean=v=>(v==null||String(v).toLowerCase()==='null')?'':String(v).trim();let history=null;
const setv=(id,x)=>{if($(id))$(id).value=clean(x)}, val=id=>clean($(id).value), norm=x=>clean(x).replace(/^第/,'').replace(/号$/,'').trim();function headers(){return {'Content-Type':'application/json','apikey':ANON,'Authorization':'Bearer '+ANON}}function dataURL(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}
$('file').onchange=()=>{const f=$('file').files[0];if(!f)return;if(f.type.startsWith('image/')){$('preview').src=URL.createObjectURL(f);$('preview').style.display='inline-block'}$('status').textContent=f.name+' を選択しました。'};
async function getHistory(no){const r=await fetch(SUPABASE_URL+'/functions/v1/nameplate-history',{method:'POST',headers:headers(),body:JSON.stringify({drawing_no:no})});const j=await r.json();if(!r.ok||j.error)throw new Error(j.error||'過去実績検索失敗');return j.history||null}
function same(a,b){return clean(a).replace(/黄銅板/g,'真鍮').replace(/黄銅/g,'真鍮').replace(/色/g,'').replace(/\s/g,'')===clean(b).replace(/黄銅板/g,'真鍮').replace(/黄銅/g,'真鍮').replace(/色/g,'').replace(/\s/g,'')}
function applyStableHistory(h){if(!h)return;[['version',h.version_type],['method',h.method],['data',h.data_status],['proof',h.proof_status],['continuation',h.continuation_status]].forEach(([id,x])=>{if(clean(x))setv(id,x)});if(val('radius')==='不明'&&clean(h.radius))setv('radius',h.radius)}
function buildReview(){const needs=[];const add=(id,label,type='text',note='')=>needs.push({id,label,type,note});if(!val('qty'))add('qty','今回の注文数','number','前回数量は参考にせず、今回の注文数を入力してください。');if(!val('date'))add('date','今回使う合格年月','text','図面に複数年月があるため、人の確認が必要です。');['version','method','data','proof','continuation'].forEach(id=>{if(!val(id)||val(id)==='要確認')add(id,{version:'版区分',method:'製作方法',data:'データ有無',proof:'校正',continuation:'継続区分'}[id])});if(val('radius')==='不明')add('radius','R');
if(history){const comps=[['material','材料',history.material],['thick','板厚',history.thickness_mm],['ground','地色',history.ground_color],['ink','文字・線色',history.text_line_color],['w','横寸法',history.width_mm],['h','縦寸法',history.height_mm],['hole','穴径',history.hole_diameter_mm],['holes','穴数',history.hole_count]];comps.forEach(([id,label,hv])=>{if(clean(hv)&&val(id)&&!same(val(id),hv))add(id,label,'text','客先図面の読取値と過去実績が違います。')})}
const box=$('needs');box.innerHTML='';needs.forEach(n=>{const d=document.createElement('div');d.className='need';let control;if($(n.id).tagName==='SELECT'){control=$(n.id).cloneNode(true);control.id='need_'+n.id;control.value=val(n.id);control.onchange=()=>{setv(n.id,control.value);buildReview()}}else{control=document.createElement('input');control.id='need_'+n.id;control.type=n.type;control.value=val(n.id);control.oninput=()=>setv(n.id,control.value);control.onchange=()=>buildReview()}d.innerHTML='<h3>要確認：'+n.label+'</h3>'+(n.note?'<div class="small">'+n.note+'</div>':'');d.appendChild(control);box.appendChild(d)});
$('autoStatus').innerHTML=history?'<b>過去実績あり。</b> AI読取と前回実績を自動照合し、一致・安定項目は自動採用しました。':'<b>過去実績なし。</b> 客先図面から確定できる項目を自動採用しました。';const rows=[['NP番号',val('drawing')],['版区分',val('version')],['材料',val('material')],['板厚',val('thick')+' mm'],['製作方法',val('method')],['地色',val('ground')],['文字・線色',val('ink')],['サイズ',val('w')+'×'+val('h')+' mm'],['穴',val('hole')+'φ×'+val('holes')+'ヶ'],['R',val('radius')],['データ',val('data')],['校正',val('proof')],['継続区分',val('continuation')],['品名',val('name')],['会社名',val('company')],['合格番号',val('number')]];$('autoList').innerHTML=rows.map(r=>'<div class="auto-row"><span class="check">✓</span> <b>'+r[0]+'</b>：'+(r[1]||'未読取')+'</div>').join('');$('readyBox').classList.toggle('hidden',needs.length>0);if(needs.length===0)$('needs').innerHTML='<div class="ok"><b>人の確認が必要な項目はありません。</b></div>'}
async function readDrawing(){const f=$('file').files[0];if(!f){alert('客先図面を選択してください');return}const b=$('readBtn');b.disabled=true;$('status').textContent='AI読取＋過去実績照合中…';try{const d=await dataURL(f);const r=await fetch(SUPABASE_URL+'/functions/v1/read-nameplate-drawing',{method:'POST',headers:headers(),body:JSON.stringify({data:d,type:f.type,name:f.name})});const j=await r.json();if(!r.ok||j.error)throw new Error(j.error||'読取失敗');const x=j.result||{};setv('drawing',x.drawing_no);setv('name',x.name);setv('material',x.material);setv('thick',x.thickness_mm);setv('w',x.width_mm);setv('h',x.height_mm);setv('hole',x.hole_diameter_mm);setv('holes',x.hole_count);setv('radius',x.radius||'不明');setv('ground',x.ground_color);setv('ink',x.text_line_color);setv('company',x.company);setv('number',norm(x.approval_number));setv('date',x.approval_date);['version','method','data','proof','continuation'].forEach(id=>setv(id,'要確認'));setv('qty','');history=await getHistory(x.drawing_no);applyStableHistory(history);$('warnings').textContent=(x.warnings||[]).join(' ／ ');$('reviewCard').classList.remove('hidden');buildReview();$('status').textContent='完了。人が確認する項目だけ下に出しました。';$('reviewCard').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){$('status').textContent='エラー：'+e.message}finally{b.disabled=false}}
function summary(){const rows=[['NP番号',val('drawing')],['版区分',val('version')],['注文数',val('qty')+'枚'],['材料',val('material')],['板厚',val('thick')+'mm'],['製作方法',val('method')],['地色',val('ground')],['文字・線色',val('ink')],['サイズ',val('w')+'×'+val('h')+'mm'],['穴',val('hole')+'φ×'+val('holes')+'ヶ'],['R',val('radius')],['データ',val('data')],['校正',val('proof')],['継続区分',val('continuation')],['品名',val('name')],['会社名',val('company')],['合格番号',val('number')],['合格年月',val('date')]];$('instructionSummary').innerHTML=rows.map(r=>'<b>'+r[0]+'</b>：'+r[1]).join('<br>');$('instructionCard').classList.remove('hidden');$('instructionCard').scrollIntoView({behavior:'smooth',block:'start'})}
function renderPlate(){const date=val('date')||'----.-',num=norm(val('number'))||'----',company=val('company')||'会社名',drawing=val('drawing')||'NP----';$('pdate').textContent='労('+date+')検';$('pnum').textContent='第'+num+'号';$('pcompany').innerHTML=company.replace(/^株式会社[ 　]*/,'株式会社<br>');$('pnp').textContent=drawing.replace(/-1$/,'');$('previewStatus').textContent='原稿作成：'+drawing;$('previewCard').classList.remove('hidden');$('previewCard').scrollIntoView({behavior:'smooth',block:'start'})}
function esc(s){return clean(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]))}function downloadSVG(){const W=+val('w'),H=+val('h'),d=+val('hole');if(!W||!H)return alert('横・縦寸法を確認してください');const date=esc(val('date')),num=esc(norm(val('number'))),company=esc(val('company')),dw=esc(val('drawing').replace(/-1$/,'')),rr=d/2;const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}mm" height="${H}mm" viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="black"/><g fill="none" stroke="#eee" stroke-width=".18"><rect x=".15" y=".15" width="${W-.3}" height="${H-.3}"/><line x1="0" y1="3.5" x2="${W}" y2="3.5"/><line x1="0" y1="7" x2="${W}" y2="7"/>${d?`<circle cx="3" cy="9" r="${rr}"/><circle cx="${W-3}" cy="9" r="${rr}"/>`:''}</g><g fill="#eee" font-family="sans-serif" text-anchor="middle"><text x="${W/2}" y="2.6" font-size="2.2">労(${date})検</text><text x="${W/2}" y="6" font-size="2.2">第${num}号</text><text x="${W/2}" y="12.5" font-size="1.6">${company}</text><text x="${W-2.5}" y="${H-.7}" font-size=".9">${dw}</text></g></svg>`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));a.download=(dw||'nameplate')+'.svg';a.click()}
$('readBtn').onclick=readDrawing;$('confirmBtn').onclick=summary;$('makeBtn').onclick=renderPlate;$('svgBtn').onclick=downloadSVG;$('backBtn').onclick=()=>{$('reviewCard').scrollIntoView({behavior:'smooth'})};['drawing','version','qty','material','thick','method','ground','ink','w','h','hole','holes','radius','data','proof','continuation','name','company','number','date'].forEach(id=>$(id).addEventListener('change',buildReview));
</script></body></html>
