<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><meta http-equiv="Pragma" content="no-cache"><title>銘板原稿AI2｜自動比較ON</title></head><body><div style="padding:32px;text-align:center;font-weight:700">銘板原稿AI2・自動比較ON版を読み込んでいます…</div><script>(async()=>{try{const u='https://raw.githubusercontent.com/yuubae96-rgb/nameplate-app/main/nameplate-original-ai-v25.html?ts='+Date.now();const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('読込失敗');let h=await r.text();h=h.replace("https://emauqxftmauvsffdjvyh.supabase.co/functions/v1/read-nameplate-drawing","https://emauqxftmauvsffdjvyh.supabase.co/functions/v1/read-nameplate-direct-trace-v2");h=h.replace('銘板原稿AI　テスト版59・板外形／表面加工領域を分離','銘板原稿AI2　直接トレース＋AI自動比較 ON');h=h.replace('</main>','<div id="autoCompare" class="card" style="border:3px solid #17324d"><h2>6. 元図と校正原稿をAIが自動比較</h2><div id="compareStatus" class="note"><b>自動比較機能：準備OK</b><br>5. 校正用銘板原稿を作ると、ここに点数・差分・製作用判定が自動表示されます。</div><div id="compareResult"></div></div></main>');const patch='<style>.cmp-ok,.cmp-warn,.cmp-ng{padding:14px;border-radius:10px;margin-top:12px}.cmp-ok{background:#eaf7ee;border:2px solid #77bd89}.cmp-warn{background:#fff3a6;border:2px solid #e0a800}.cmp-ng{background:#ffe8e8;border:2px solid #d44}.score{font-size:34px;font-weight:900}.cmp-issues{line-height:1.6}</style><script>(function(){const CMP="https://emauqxftmauvsffdjvyh.supabase.co/functions/v1/compare-nameplate-proof";function E(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}function DU(f){return new Promise((ok,ng)=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.onerror=ng;fr.readAsDataURL(f)})}async function PNG(){const s=document.querySelector("#art svg");if(!s)throw Error("校正原稿がありません");const xml=new XMLSerializer().serializeToString(s),blob=new Blob([xml],{type:"image/svg+xml"}),url=URL.createObjectURL(blob);try{const img=new Image();await new Promise((ok,ng)=>{img.onload=ok;img.onerror=ng;img.src=url});const c=document.createElement("canvas");c.width=1200;c.height=1200;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return c.toDataURL("image/png")}finally{URL.revokeObjectURL(url)}}async function compareNow(){const st=document.getElementById("compareStatus"),out=document.getElementById("compareResult");try{const f=document.getElementById("file").files[0];if(!f)throw Error("元図ファイルがありません");st.innerHTML="<b>AI自動比較中…</b> 元図と校正原稿を照合しています。";const src=await DU(f),proof=await PNG();const rr=await fetch(CMP,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({source_data:src,source_type:f.type,source_name:f.name,proof_data:proof})});const j=await rr.json();if(!rr.ok||j.error)throw Error(j.error||"比較失敗");const x=j.result||{},score=Number(x.score)||0,issues=Array.isArray(x.issues)?x.issues:[],cls=x.verdict==="OK"?"cmp-ok":x.verdict==="大きく不一致"?"cmp-ng":"cmp-warn";out.className=cls;out.innerHTML="<div><span class=\"score\">"+score+"点</span>　<b>"+E(x.verdict||"要確認")+"</b></div><div>"+E(x.summary||"")+"</div>"+(issues.length?"<ul class=\"cmp-issues\">"+issues.map(i=>"<li><b>"+E(i.item||"")+"</b>："+E(i.difference||"")+(i.suggested_fix?" → "+E(i.suggested_fix):"")+"</li>").join("")+"</ul>":"")+"<div style=\"font-weight:900;margin-top:10px\">製作用判定："+(x.can_use_for_production?"使用可":"まだ使用しない")+"</div>";st.textContent="AI自動比較 完了";document.getElementById("autoCompare").scrollIntoView({behavior:"smooth"})}catch(e){st.innerHTML="<b style=\"color:#b00\">自動比較エラー：</b> "+E(e.message)}}const b=document.getElementById("proofBtn");if(b)b.addEventListener("click",()=>setTimeout(compareNow,400));})();<\/script>';h=h.replace('</body>',patch+'</body>');document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<div style="padding:32px;color:#b00">AI2の読込に失敗しました：'+String(e.message||e)+'</div>'}})();</script></body></html>
