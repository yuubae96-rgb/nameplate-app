(async()=>{try{const r=await fetch('youtube-presentation-core.html?v=subtitle-example-20260927',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let html=await r.text();const style=`<style id="standardSubtitleBand">.caption,.live-caption{left:6%!important;right:6%!important;bottom:6%!important;line-height:1.25!important;background:rgba(0,0,0,.72)!important;padding:.34em .42em!important;border-radius:8px!important;color:#fff!important;font-weight:700!important;text-shadow:0 1px 2px rgba(0,0,0,.8)!important}.stage img,.preview img,.slide-preview img{object-fit:contain!important;object-position:center center!important;transform:none!important;margin:0!important}</style>`;const patch=`<script id="standardSubtitlePatch">(()=>{try{const setDefaults=()=>{const size=document.getElementById('capSize'),weight=document.getElementById('capWeight'),stroke=document.getElementById('capStroke');if(size)size.value='32';if(weight)weight.value='700';if(stroke)stroke.value='4'};setDefaults();window.captionStyle=function(){return{font:document.getElementById('capFont')?.value||"-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif",size:Number(document.getElementById('capSize')?.value||32),weight:Number(document.getElementById('capWeight')?.value||700),color:document.getElementById('capColor')?.value||'#ffffff',stroke:Number(document.getElementById('capStroke')?.value||4),position:Number(document.getElementById('capPosition')?.value||4)}};window.applyCaptionStyleTo=function(el,stage){if(!el)return;const s=window.captionStyle(),w=stage?.clientWidth||640,scale=w/1280;el.style.fontFamily=s.font;el.style.fontWeight='700';el.style.color=s.color;el.style.bottom='6%';el.style.left='6%';el.style.right='6%';el.style.fontSize=Math.max(11,s.size*scale)+'px';el.style.lineHeight='1.25';el.style.background='rgba(0,0,0,.72)';el.style.padding='.34em .42em';el.style.borderRadius='8px';el.style.textShadow='0 1px 2px rgba(0,0,0,.8)'};window.draw=function(ctx,c,img,cap){ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);let sc=Math.min(c.width/img.width,c.height/img.height),w=img.width*sc,h=img.height*sc;ctx.drawImage(img,(c.width-w)/2,(c.height-h)/2,w,h);if(!cap)return;const s=window.captionStyle(),lines=String(cap).split('\\n'),fs=Math.round(Math.min(c.width*.026,c.height*.045)*s.size/32),lh=Math.round(fs*1.25),padY=Math.round(fs*.34),bandW=Math.round(c.width*.88),bandH=lines.length*lh+padY*2,bandY=Math.round(c.height*.94-bandH);ctx.fillStyle='rgba(0,0,0,.72)';ctx.beginPath();ctx.roundRect(Math.round(c.width*.06),bandY,bandW,bandH,Math.round(fs*.28));ctx.fill();ctx.font=s.weight+' '+fs+'px '+s.font;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=s.color;ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=Math.max(1,Math.round(fs*.07));lines.forEach((line,j)=>{const y=bandY+padY+lh*(j+.5);ctx.fillText(line,c.width/2,y,bandW-fs*.84)});ctx.shadowBlur=0};setTimeout(()=>{setDefaults();try{window.refreshCaptionStyles&&window.refreshCaptionStyles()}catch(e){}},0);setTimeout(()=>{setDefaults();try{window.refreshCaptionStyles&&window.refreshCaptionStyles()}catch(e){}},500)}catch(e){console.error('standard subtitle patch',e)}})();<\/script>`;html=html.replace('</head>',style+'</head>').replace('</body>',patch+`<script id="confirmationCaptionSwapPatch">(()=>{function install(){document.querySelectorAll('div,p,span').forEach(el=>{const raw=(el.textContent||'').trim();if(!raw.startsWith('確認ポイント'))return;if(el.dataset.captionSwapReady)return;const text=raw.replace(/^確認ポイント\\s*[：:]\\s*/,'').trim();if(!text)return;let scene=el.closest('.slide,section,.card')||el.parentElement;if(!scene)return;let ta=[...scene.querySelectorAll('textarea')].find(x=>{const lab=x.previousElementSibling?.textContent||x.parentElement?.querySelector('label')?.textContent||'';return /ナレーション|字幕/.test(lab)})||scene.querySelector('textarea[id^="nar-"]');if(!ta)return;el.dataset.captionSwapReady='1';const b=document.createElement('button');b.type='button';b.className='btn';b.textContent='確認ポイントを字幕にする';b.style.cssText='width:100%;margin:10px 0 4px;background:#fff7df;border:1px solid #d6ad45;color:#17213a;font-weight:900';b.onclick=()=>{ta.value=text;ta.dispatchEvent(new Event('input',{bubbles:true}));b.textContent='✓ 確認ポイントを字幕にしました';setTimeout(()=>b.textContent='確認ポイントを字幕にする',1800)};el.insertAdjacentElement('afterend',b)})}new MutationObserver(install).observe(document.documentElement,{childList:true,subtree:true});install();setTimeout(install,500);setTimeout(install,1500)})();<\/script></body>`);document.open();document.write(html);document.close()}catch(e){document.getElementById('loading').textContent='読み込みエラー：'+e.message}})();
