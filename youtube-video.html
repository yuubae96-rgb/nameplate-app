<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16233f"><title>YouTube動画作成</title>
<style>
:root{--bg:#f4f5f7;--ink:#17213a;--muted:#667188;--line:#d7dde6;--red:#e44945;--navy:#16233f;--title-red:#8f1d24}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);padding-bottom:35px}.app{max-width:706px;margin:auto}.head{padding:calc(6px + env(safe-area-inset-top)) 22px 7px;background:linear-gradient(#33435f,#172239);color:#fff}.head h1{margin:0;font-size:23px}.main{padding:6px 18px}.card,.scene{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 22px;margin-bottom:14px}.field{margin-bottom:10px}h2{margin:0 0 12px;font-size:18px}label{display:block;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:5px}input,textarea,select{width:100%;border:1px solid #cfd6e0;border-radius:13px;background:#fff;color:var(--ink);font-size:15px;padding:10px 12px;min-height:46px}textarea{min-height:82px;line-height:1.5}.grid2,.bulk,.voice-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:13px;min-height:46px;padding:10px;font-weight:900;font-size:14px;background:#eef1f5;color:var(--ink)}.red{background:var(--red);color:#fff}.navy{background:var(--navy);color:#fff}.full{width:100%}.stop{display:none;width:100%;margin-top:9px;background:#8f1d24;color:#fff}.beginner{display:flex;align-items:center;gap:9px;margin:3px 0 10px;padding:10px;border:1px solid #d8dee7;border-radius:12px;background:#f7f9fb;font-weight:900}.beginner input{width:20px;height:20px;min-height:0;margin:0}.status,.usage,.hint{font-size:12px;color:var(--muted);margin-top:5px}.notice{font-size:12px;padding:10px;background:#eef5f3;border-radius:11px;line-height:1.6}.scene{padding:17px}.scene-num{display:inline-block;background:var(--navy);color:#fff;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900;margin-bottom:10px}.scene-title{background:#fff2f2;border:2px solid var(--title-red);color:#5d1116;font-weight:900}.imgbox,.video-stage{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;position:relative}.portrait .imgbox,.portrait .video-stage{aspect-ratio:9/16;max-width:360px;margin-left:auto;margin-right:auto}.imgbox{display:flex;align-items:center;justify-content:center;color:var(--muted);margin-bottom:12px}.imgbox img,.video-stage img{width:100%;height:100%;object-fit:cover}.caption{position:absolute;left:5%;right:5%;bottom:3.5%;color:#fff;padding:2px 4px;text-align:center;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;font-weight:900;font-size:clamp(22px,4.4vw,34px);line-height:1.2;text-shadow:-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000,3px 3px 0 #000,-3px 0 0 #000,3px 0 0 #000,0 -3px 0 #000,0 3px 0 #000,0 4px 6px #000;white-space:pre-line;line-break:strict;word-break:normal;overflow-wrap:anywhere;letter-spacing:.01em}.portrait .caption{left:7%;right:7%;bottom:8%;font-size:clamp(22px,6vw,34px)}.preview-title{position:absolute;left:3%;top:4%;background:var(--title-red);color:#fff;padding:6px 12px;font-weight:900;font-size:clamp(14px,2.2vw,22px);text-shadow:0 2px 3px #000;max-width:84%}.portrait .preview-title{left:5%;top:4%;font-size:clamp(14px,4vw,22px)}.scene-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.audio{width:100%;margin-top:8px}.fact{font-size:11px;background:#fff7df;padding:9px;margin-top:9px}.progress{height:7px;background:#e5e9ed;margin-top:9px}.progress div{height:100%;width:0;background:var(--red)}.saveLink{display:none;margin-top:9px;text-align:center}.portrait #resultVideo{max-width:360px;margin-left:auto!important;margin-right:auto!important}.portrait #saveLink{max-width:360px;margin-left:auto;margin-right:auto}@media(max-width:390px){.main{padding:5px 14px}.card{padding:16px}.bulk .btn,.voice-actions .btn{font-size:12px}.caption{font-size:clamp(21px,5.4vw,30px)}}
</style></head>
<body><div class="app"><header class="head"><h1>🎬 YouTube動画作成</h1></header><main class="main">
<section class="card"><h2>1. 動画のテーマ</h2><div class="field"><input id="topic" placeholder="動画のテーマを入力"></div><div class="field"><label>参考URL（任意・最大5件）</label><textarea id="referenceUrls" placeholder="WebサイトやYouTubeのURLを1行に1件貼り付け"></textarea><div class="hint">公開Webページ・YouTubeを参考に、丸写しせず動画用に再構成します。</div></div>
<div class="grid2"><div class="field"><label>動画の長さ</label><select id="minutes"><option value="1">約1分</option><option value="3" selected>約3分</option><option value="5">約5分</option><option value="8">約8分</option></select></div><div class="field"><label>動画形式</label><select id="videoFormat"><option value="16:9">横動画（YouTube通常・16:9）</option><option value="9:16">縦動画（YouTubeショート・9:16）</option></select></div></div>
<div class="field"><label>画風</label><select id="style"><option value="realistic">実写・歴史映画風</option><option value="documentary">リアル・歴史ドキュメンタリー風</option><option value="gekiga">劇画・映画ポスター風</option></select></div>
<div class="grid2"><div class="field"><label>ナレーションの声（12種類）</label><select id="voice"></select></div><div class="field"><label>読み方</label><select id="direction"><option value="落ち着いた日本語の歴史ドキュメンタリー調。自然な間、明瞭な発音、ややゆっくり。">落ち着いた解説</option><option value="重厚で落ち着いた日本語ナレーション。">重厚な解説</option><option value="聞きやすく親しみのある日本語解説。">親しみやすい解説</option></select></div></div><div class="voice-actions"><button class="btn" id="voiceSample">▶ この声を試聴</button><button class="btn" id="applyVoice">全体をこの声に変更</button></div><div id="sampleStatus" class="status"></div><audio id="sampleAudio" class="audio" controls style="display:none"></audio><label class="beginner"><input type="checkbox" id="beginner" checked>初心者にも分かりやすく</label><div class="field"><label>追加の指示</label><textarea id="extra" placeholder="例：人物を大きく。残酷な描写は避ける。"></textarea></div></section>
<section class="card"><button class="btn red full" id="makeScript">AIで動画構成を作る</button><div id="scriptStatus" class="status">テーマまたは参考URLを入力してください。</div></section>
<section class="card" id="bulkCard" style="display:none"><h2>2. シーンを仕上げる</h2><div class="notice">字幕は最大2行。句読点だけが次の行に出ないよう調整し、左右が切れないよう自動で幅を合わせます。場面切替は次の画像を先に表示し、音声冒頭の0.9秒無音後にナレーションを始めます。</div><div class="bulk"><button class="btn navy" id="allImages">全シーンのAI画像を作る</button><button class="btn navy" id="allAudio">全シーンのAIナレーションを作る</button></div><div id="usage" class="usage"></div></section><div id="scenes"></div>
<section class="card" id="videoCard" style="display:none"><h2>3. 字幕付き動画</h2><div class="video-stage"><img id="previewImg"><div id="previewTitle" class="preview-title"></div><div id="previewCaption" class="caption"></div></div><div class="progress"><div id="previewProgress"></div></div><div class="bulk"><button class="btn" id="playAll">プレビュー再生</button><button class="btn red" id="makeVideo">字幕付き動画を作る</button></div><button class="btn stop" id="cancelVideo">■ 動画生成を停止</button><div id="videoStatus" class="status"></div><video id="resultVideo" controls playsinline style="display:none;width:100%;margin-top:10px"></video><a id="saveLink" class="btn saveLink">完成した動画を保存</a></section>
</main></div>
<script>
const FN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/youtube-video-maker',$=x=>document.getElementById(x),V=['Charon','Gacrux','Sadaltager','Iapetus','Algieba','Schedar','Kore','Aoede','Sulafat','Vindemiatrix','Achernar','Puck'];let project=null,counts={script:0,image:0,audio:0},cancelRequested=false,activeExportSource=null;V.forEach(v=>voice.add(new Option(v,v)));
function aspect(){return videoFormat.value==='9:16'?'9:16':'16:9'}function applyFormat(){document.body.classList.toggle('portrait',aspect()==='9:16')}videoFormat.onchange=applyFormat;applyFormat();
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[m]))}async function call(b){let r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d}function du(m,d){return`data:${m};base64,${d}`}function usage(){$('usage').textContent=`今回の利用：構成${counts.script}回 / 画像${counts.image}枚 / 音声${counts.audio}回`}function sync(i){let s=project.scenes[i];s.title=$(`title-${i}`).value;s.narration=$(`nar-${i}`).value;s.reading=$(`read-${i}`).value;s.imagePrompt=$(`imgp-${i}`).value}
const P=/^[。、！？!?，．・：；」』）】〉》〕］｝”’]+$/;function caps(t){let a=String(t||'').trim().match(/[^。、！？!?]+[。、！？!?]?/g)||[''];return a.map(p=>{p=p.trim();if(p.length<=28)return p;let c=Math.ceil(p.length/2),x=p.slice(0,c),y=p.slice(c);while(y&&P.test(y[0])){x+=y[0];y=y.slice(1)}return y?x+'\n'+y:x}).filter(Boolean)}function capAt(t,c,d){let a=caps(t),w=a.map(x=>x.replace(/\n/g,'').length||1),sum=w.reduce((x,y)=>x+y,0),v=Math.max(0,Math.min(d||1,c||0))/(d||1)*sum,z=0;for(let i=0;i<a.length;i++){z+=w[i];if(v<=z)return a[i]}return a.at(-1)||''}function speechCaption(s,current,duration){let lead=Math.max(0,Number(s.leadingSilenceMs||0))/1000;if(current<lead)return'';return capAt(s.narration,current-lead,Math.max(.1,(duration||1)-lead))}
function scene(s,i){return`<section class="scene"><span class="scene-num">SCENE ${i+1}</span><div class="field"><label>左上タイトル</label><input class="scene-title" id="title-${i}" value="${esc(s.title)}"></div><div class="imgbox" id="imgbox-${i}">AI画像はまだありません</div><div class="field"><label>ナレーション（字幕）</label><textarea id="nar-${i}">${esc(s.narration)}</textarea></div><div class="field"><label>音声用の読み方</label><textarea id="read-${i}">${esc(s.reading||s.narration)}</textarea></div><div class="field"><label>画像の内容</label><textarea id="imgp-${i}">${esc(s.imagePrompt)}</textarea></div><div class="scene-actions"><button class="btn" onclick="genImage(${i})">AI画像を作る</button><button class="btn" onclick="genAudio(${i})">音声を作る</button><button class="btn" onclick="playScene(${i})">このシーンを再生</button></div><audio id="audio-${i}" class="audio" controls style="display:none"></audio>${s.factCheck?`<div class="fact">史実メモ：${esc(s.factCheck)}</div>`:''}</section>`}
function render(){project.scenes.forEach(s=>s.reading=s.reading||s.narration);scenes.innerHTML=project.scenes.map(scene).join('');bulkCard.style.display=videoCard.style.display='block';applyFormat()}
voiceSample.onclick=async()=>{voiceSample.disabled=true;sampleStatus.textContent='試聴音声を作成中…';try{let d=await call({action:'generateTts',text:'こんにちは。今日は歴史の物語を分かりやすくご紹介します。',voice:voice.value,direction:direction.value});sampleAudio.src=du(d.mimeType,d.data);sampleAudio.style.display='block';sampleStatus.textContent='下の▶︎を押して試聴してください。'}catch(e){sampleStatus.textContent=e.message}finally{voiceSample.disabled=false}};
makeScript.onclick=async()=>{let urls=referenceUrls.value.split(/\n/).map(x=>x.trim()).filter(Boolean).slice(0,5);if(!topic.value.trim()&&!urls.length)return;makeScript.disabled=true;scriptStatus.textContent=urls.length?'参考資料を読み取り、AIが構成を作成中…':'AIが構成を作成中…';try{let bi=beginner.checked?'初心者にも分かりやすく説明する。専門用語をかみ砕き、前提知識なしでも理解できるようにする。':'';project=await call({action:'generateScript',topic:topic.value,referenceUrls:urls,extra:[bi,extra.value.trim()].filter(Boolean).join('\n'),minutes:Number(minutes.value),aspectRatio:aspect()});counts.script++;usage();render();scriptStatus.textContent=`構成ができました。${aspect()==='9:16'?'YouTubeショート用の縦構成です。 ':''}${urls.length?`参考URL ${urls.length}件を使用。`:''}`}catch(e){scriptStatus.textContent=e.message}finally{makeScript.disabled=false}};
window.genImage=async i=>{sync(i);let s=project.scenes[i],d=await call({action:'generateImage',prompt:s.imagePrompt,style:style.value,aspectRatio:aspect()});s.image=du(d.mimeType,d.data);$(`imgbox-${i}`).innerHTML=`<img src="${s.image}">`;counts.image++;usage()};window.genAudio=async i=>{sync(i);let s=project.scenes[i],d=await call({action:'generateTts',text:s.reading,voice:voice.value,direction:direction.value});s.audio=du(d.mimeType,d.data);s.leadingSilenceMs=Number(d.leadingSilenceMs||0);let a=$(`audio-${i}`);a.src=s.audio;a.style.display='block';counts.audio++;usage()};applyVoice.onclick=async()=>{if(!project)return;for(let i=0;i<project.scenes.length;i++)await genAudio(i)};allImages.onclick=async()=>{allImages.disabled=true;try{for(let i=0;i<project.scenes.length;i++){allImages.textContent=`AI画像生成中 ${i+1}/${project.scenes.length}`;await genImage(i)}}finally{allImages.disabled=false;allImages.textContent='全シーンのAI画像を作る'}};allAudio.onclick=async()=>{allAudio.disabled=true;try{for(let i=0;i<project.scenes.length;i++){allAudio.textContent=`AIナレーション生成中 ${i+1}/${project.scenes.length}`;await genAudio(i)}}finally{allAudio.disabled=false;allAudio.textContent='全シーンのAIナレーションを作る'}};
function wait(ms){return new Promise(r=>setTimeout(r,ms))}function show(s){previewImg.src=s.image;previewTitle.textContent=s.title}async function playTimed(s,a){show(s);let tm=setInterval(()=>previewCaption.textContent=speechCaption(s,a.currentTime,a.duration),90);previewCaption.textContent='';a.currentTime=0;await a.play();await new Promise(r=>a.onended=r);clearInterval(tm)}window.playScene=async i=>{sync(i);if(project.scenes[i].audio)await playTimed(project.scenes[i],$(`audio-${i}`))};playAll.onclick=async()=>{for(let i=0;i<project.scenes.length;i++){let s=project.scenes[i];if(!s.image||!s.audio)continue;await playTimed(s,new Audio(s.audio));previewProgress.style.width=Math.round((i+1)/project.scenes.length*100)+'%';if(i<project.scenes.length-1){show(project.scenes[i+1]);previewCaption.textContent=''}}};
function loadImage(src){return new Promise((r,j)=>{let im=new Image;im.onload=()=>r(im);im.onerror=j;im.src=src})}async function ab(ac,u){return ac.decodeAudioData(await(await fetch(u)).arrayBuffer())}function wrapCaption(ctx,text,maxWidth){let lines=[],line='';for(let ch of String(text||'').replace(/\n/g,'')){let next=line+ch;if(line&&ctx.measureText(next).width>maxWidth&&!P.test(ch)){lines.push(line);line=ch}else line=next}if(line)lines.push(line);for(let i=1;i<lines.length;i++){while(lines[i]&&P.test(lines[i][0])){lines[i-1]+=lines[i][0];lines[i]=lines[i].slice(1)}}return lines.filter(Boolean)}function fitCaption(ctx,text,maxWidth,portrait){let start=portrait?72:58,min=portrait?50:42;for(let size=start;size>=min;size-=2){ctx.font=`900 ${size}px "Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif`;let lines=wrapCaption(ctx,text,maxWidth);if(lines.length<=2&&lines.every(x=>ctx.measureText(x).width<=maxWidth))return{size,lines}}ctx.font=`900 ${min}px "Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif`;let raw=String(text||'').replace(/\n/g,''),mid=Math.ceil(raw.length/2);return{size:min,lines:[raw.slice(0,mid),raw.slice(mid)].filter(Boolean).slice(0,2)}}
function draw(ctx,c,img,title,cap){let portrait=c.height>c.width;ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height);let sc=Math.max(c.width/img.width,c.height/img.height),w=img.width*sc,h=img.height*sc;ctx.drawImage(img,(c.width-w)/2,(c.height-h)/2,w,h);if(title){let fs=portrait?46:32;ctx.font=`900 ${fs}px "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif`;let max=c.width*(portrait?.82:.72),text=title;while(ctx.measureText(text).width>max&&fs>24){fs-=2;ctx.font=`900 ${fs}px "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif`}let tw=ctx.measureText(text).width,pad=portrait?24:15,x=portrait?40:35,y=portrait?70:28,bh=fs+22;ctx.fillStyle='#8f1d24';ctx.fillRect(x,y,tw+pad*2,bh);ctx.fillStyle='#fff';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(text,x+pad,y+bh/2)}if(cap){ctx.textAlign='center';ctx.textBaseline='alphabetic';let fit=fitCaption(ctx,cap,c.width*(portrait?.84:.88),portrait),ls=fit.lines,size=fit.size,lh=Math.round(size*1.18),bottom=portrait?Math.round(c.height*.09):30,y0=c.height-bottom-ls.length*lh;ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineJoin='round';ctx.miterLimit=2;ctx.lineWidth=Math.max(8,Math.round(size*.17));ls.forEach((x,j)=>{let y=y0+Math.round(size*.88)+j*lh;ctx.strokeText(x,c.width/2,y);ctx.fillText(x,c.width/2,y)})}}
function rt(s){s=Math.max(0,Math.round(s));return s<60?`約${s}秒`:`約${Math.floor(s/60)}分${s%60}秒`}cancelVideo.onclick=()=>{cancelRequested=true;videoStatus.textContent='動画生成を停止しています…';try{activeExportSource?.stop()}catch(_){}};
makeVideo.onclick=async()=>{if(project.scenes.some(s=>!s.image||!s.audio))return alert('全シーンの画像と音声を作ってください。');makeVideo.disabled=true;cancelRequested=false;cancelVideo.style.display='block';saveLink.style.display='none';resultVideo.style.display='none';let ac=null,stream=null,rec=null;try{let c=document.createElement('canvas');if(aspect()==='9:16'){c.width=1080;c.height=1920}else{c.width=1280;c.height=720}let ctx=c.getContext('2d'),AC=window.AudioContext||window.webkitAudioContext;ac=new AC;await ac.resume();let dest=ac.createMediaStreamDestination(),imgs=[],bufs=[];for(let i=0;i<project.scenes.length;i++){if(cancelRequested){videoStatus.textContent='動画生成を停止しました。';return}videoStatus.textContent=`動画素材を準備中… ${i+1}/${project.scenes.length}`;imgs.push(await loadImage(project.scenes[i].image));bufs.push(await ab(ac,project.scenes[i].audio))}if(cancelRequested)return;let total=bufs.reduce((a,x)=>a+x.duration,0),done=0,start=performance.now(),vs=c.captureStream(30);stream=new MediaStream([...vs.getVideoTracks(),...dest.stream.getAudioTracks()]);let mime=['video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x))||'';rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:aspect()==='9:16'?8000000:6000000}:undefined);let chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);let stopped=new Promise(r=>rec.onstop=r);rec.start(1000);for(let i=0;i<project.scenes.length&&!cancelRequested;i++){let s=project.scenes[i],src=ac.createBufferSource();activeExportSource=src;src.buffer=bufs[i];src.connect(dest);src.start();let st=performance.now(),dur=bufs[i].duration;while(performance.now()-st<dur*1000&&!cancelRequested){let el=(performance.now()-st)/1000;draw(ctx,c,imgs[i],s.title,speechCaption(s,el,dur));let p=Math.min(99,Math.round((done+el)/total*100)),wall=(performance.now()-start)/1000,eta=(done+el)>0?wall*(total-done-el)/(done+el):total;videoStatus.textContent=`動画生成中… ${p}%（残り${rt(eta)}）`;await wait(33)}activeExportSource=null;done+=dur}if(cancelRequested){if(rec.state!=='inactive')rec.stop();await stopped;chunks.length=0;videoStatus.textContent='動画生成を停止しました。修正後にもう一度作れます。';return}rec.stop();await stopped;let type=rec.mimeType||mime||'video/webm',blob=new Blob(chunks,{type}),url=URL.createObjectURL(blob),ext=type.includes('mp4')?'mp4':'webm';resultVideo.src=url;resultVideo.style.display='block';saveLink.href=url;saveLink.download=(aspect()==='9:16'?'youtube-short':'youtube-video')+'.'+ext;saveLink.textContent=`完成した${aspect()==='9:16'?'ショート':'動画'}を保存（${ext.toUpperCase()}）`;saveLink.style.display='block';videoStatus.textContent='100%　動画が完成しました。'}catch(e){videoStatus.textContent=cancelRequested?'動画生成を停止しました。修正後にもう一度作れます。':'動画作成エラー：'+e.message}finally{activeExportSource=null;if(stream)stream.getTracks().forEach(t=>t.stop());if(ac&&ac.state!=='closed')try{await ac.close()}catch(_){}makeVideo.disabled=false;cancelVideo.style.display='none'}};
</script></body></html>
