<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16233f"><meta name="apple-mobile-web-app-capable" content="yes"><title>YouTube動画作成</title>
<style>:root{--bg:#f4f5f7;--ink:#17213a;--muted:#667188;--line:#d7dde6;--blue:#2693e8;--red:#e44945;--navy:#16233f;--yellow:rgba(255,227,91,.72)}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);padding-bottom:35px}.app{max-width:706px;margin:auto}.head{padding:calc(6px + env(safe-area-inset-top)) 28px 7px;background:linear-gradient(#33435f,#172239);color:#fff}.head h1{margin:0;font-size:23px}.main{padding:8px 22px 14px}.card,.scene{background:#fff;border:1px solid var(--line);border-radius:18px;padding:21px 26px;margin-bottom:14px}.field{margin-bottom:10px}h2{margin:0 0 15px;font-size:18px}label{display:block;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:5px}input,textarea,select{width:100%;border:1px solid #cfd6e0;border-radius:13px;background:#fff;color:var(--ink);font-size:15px;padding:10px 12px;min-height:46px}textarea{min-height:92px;line-height:1.55}.grid2,.bulk,.voice-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2 label{white-space:nowrap;font-size:12px}.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:13px}.chip{border:1px solid #d3d9e2;background:#fff;border-radius:999px;color:var(--blue);font-size:11.5px;font-weight:800;padding:8px 2px}.btn{border:0;border-radius:13px;min-height:46px;padding:10px 13px;font-weight:900;font-size:14px;background:#eef1f5;color:var(--ink)}.btn.red{background:var(--red);color:#fff}.btn.navy{background:var(--navy);color:#fff}.btn.full{width:100%}.btn.sample,.btn.applyVoice{width:100%;border:1px solid #d8dee7;background:#fff}.btn.applyVoice{color:var(--blue)}.status,.usage,.subtle{font-size:12px;color:var(--muted);margin-top:6px}.build-card{padding:15px 26px}.notice{font-size:12px;padding:10px 12px;background:#eef5f3;border-radius:11px;line-height:1.6}.scene{padding:17px}.scene-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}.scene-num{background:var(--navy);color:#fff;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900}.pill{font-size:10px}.scene-title{background:var(--yellow);border-color:#e0c84d;font-weight:800}.imgbox,.video-stage{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;position:relative}.imgbox{display:flex;align-items:center;justify-content:center;color:var(--muted);margin-bottom:12px}.imgbox img,.video-stage img{width:100%;height:100%;object-fit:cover}.caption{position:absolute;left:5%;right:5%;bottom:5%;color:#fff;background:rgba(0,0,0,.53);padding:7px 9px;text-align:center;font-weight:900;font-size:clamp(14px,2vw,20px);line-height:1.45}.preview-title{position:absolute;left:3%;top:4%;background:var(--yellow);color:#111;padding:4px 9px;border-radius:4px;font-weight:900;font-size:clamp(12px,1.8vw,18px)}.scene-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.audio{width:100%;margin-top:8px}.fact{font-size:11px;background:#fff7df;padding:9px;margin-top:9px}.progress{height:7px;background:#e5e9ed;margin-top:9px}.progress>div{height:100%;width:0;background:var(--red)}.saveLink{display:none;margin-top:9px;text-align:center}@media(max-width:390px){.head{padding-left:20px;padding-right:20px}.main{padding:7px 14px 14px}.card{padding:18px 20px}.chip{font-size:10.5px}.voice-actions{gap:7px}.voice-actions .btn{font-size:12px;padding:8px 5px}}</style></head>
<body><div class="app"><header class="head"><h1>🎬 YouTube動画作成</h1></header><main class="main">
<section class="card"><h2>1. 動画のテーマ</h2><div class="field"><input id="topic" placeholder="例：伊藤博文の人生"></div><div class="chips"><button class="chip" data-topic="伊藤博文の人生">伊藤博文</button><button class="chip" data-topic="ペニシリン発見の歴史">ペニシリン</button><button class="chip" data-topic="坂本龍馬の人生">坂本龍馬</button><button class="chip" data-topic="ワクチンの歴史">ワクチン</button></div><div class="grid2"><div class="field"><label>動画の長さ</label><select id="minutes"><option value="1">約1分</option><option value="3" selected>約3分</option><option value="5">約5分</option><option value="8">約8分</option></select></div><div class="field"><label>画風</label><select id="style"><option value="realistic">実写・歴史映画風</option><option value="documentary">リアル・歴史ドキュメンタリー風</option></select></div></div><div class="grid2"><div class="field"><label>ナレーションの声（12種類）</label><select id="voice"></select></div><div class="field"><label>読み方</label><select id="direction"><option value="落ち着いた日本語の歴史ドキュメンタリー調。自然な間、明瞭な発音、ややゆっくり。">落ち着いた解説</option><option value="重厚で落ち着いた日本語ナレーション。">重厚な解説</option><option value="聞きやすく親しみのある日本語解説。">親しみやすい解説</option></select></div></div><div class="voice-actions"><button class="btn sample" id="voiceSample">▶ この声を試聴</button><button class="btn applyVoice" id="applyVoice">全体をこの声に変更</button></div><div id="sampleStatus" class="status"></div><audio id="sampleAudio" class="audio" controls style="display:none"></audio><div class="field"><label>追加の指示</label><textarea id="extra" placeholder="例：初心者にも分かりやすく。人物を大きく。残酷な描写は避ける。"></textarea></div></section>
<section class="card build-card"><button class="btn red full" id="makeScript">AIで動画構成を作る</button><div id="scriptStatus" class="status">テーマを入力して作成してください。</div></section><section class="card" id="bulkCard" style="display:none"><h2>2. シーンを仕上げる</h2><div class="notice">ナレーション＝字幕です。字幕は「。」「、」「！」「？」で短く区切り、最大2行ずつ音声に合わせて順番に表示します。場面切替では次の画像と左上タイトルを0.9秒無音で表示します。</div><button class="btn navy full" id="allImages">全シーンのAI画像を作る</button><div id="usage" class="usage"></div></section><div id="scenes"></div>
<section class="card" id="videoCard" style="display:none"><h2>3. 字幕付き動画</h2><div class="video-stage"><img id="previewImg"><div id="previewTitle" class="preview-title"></div><div id="previewCaption" class="caption"></div></div><div class="progress"><div id="previewProgress"></div></div><div class="bulk"><button class="btn" id="playAll">プレビュー再生</button><button class="btn red" id="makeVideo">字幕付き動画を作る</button></div><div id="videoStatus" class="status"></div><video id="resultVideo" controls playsinline style="display:none;width:100%;margin-top:10px"></video><a id="saveLink" class="btn saveLink">完成した動画を保存</a></section></main></div>
<script>const FN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/youtube-video-maker',voices=[['Charon','情報的・落ち着き'],['Gacrux','成熟・落ち着き'],['Sadaltager','知的'],['Iapetus','明瞭'],['Algieba','なめらか'],['Schedar','安定'],['Kore','しっかり'],['Aoede','軽やか'],['Sulafat','温かい'],['Vindemiatrix','やさしい'],['Achernar','柔らかい'],['Puck','明るい']];const $=x=>document.getElementById(x);let project=null,counts={script:0,image:0,audio:0};voices.forEach(([v,n])=>$('voice').add(new Option(v+'｜'+n,v)));document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>topic.value=b.dataset.topic);function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function usage(){$('usage').textContent=`今回の利用：構成${counts.script}回 / 画像${counts.image}枚 / 音声${counts.audio}回`}async function call(body){let r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d}function du(m,d){return`data:${m};base64,${d}`}function sync(i){let s=project.scenes[i];s.title=$(`title-${i}`).value;s.narration=$(`nar-${i}`).value;s.reading=$(`read-${i}`).value;s.imagePrompt=$(`imgp-${i}`).value}function syncAll(){project.scenes.forEach((_,i)=>sync(i))}
function scene(s,i){return`<section class="scene"><div class="scene-head"><span class="scene-num">SCENE ${i+1}</span><span class="pill" id="state-${i}">未生成</span></div><div class="field"><label>左上タイトル（編集できます）</label><input class="scene-title" id="title-${i}" value="${esc(s.title)}"></div><div class="imgbox" id="imgbox-${i}">AI画像はまだありません</div><div class="field"><label>ナレーション（字幕）</label><textarea id="nar-${i}">${esc(s.narration)}</textarea></div><div class="field"><label>音声用の読み方</label><textarea id="read-${i}">${esc(s.reading||s.narration)}</textarea></div><div class="field"><label>画像の内容（日本語で編集できます）</label><textarea id="imgp-${i}">${esc(s.imagePrompt)}</textarea></div><div class="scene-actions"><button class="btn" onclick="genImage(${i})">AI画像を作る</button><button class="btn" onclick="genAudio(${i})">音声を作る</button><button class="btn" onclick="playScene(${i})">このシーンを再生</button></div><audio id="audio-${i}" class="audio" controls style="display:none"></audio>${s.factCheck?`<div class="fact">史実メモ：${esc(s.factCheck)}</div>`:''}</section>`}function render(){project.scenes.forEach(s=>s.reading=s.reading||s.narration);scenes.innerHTML=project.scenes.map(scene).join('');project.scenes.forEach((s,i)=>{let n=$(`nar-${i}`),r=$(`read-${i}`),old=n.value;n.oninput=()=>{if(r.value===old)r.value=n.value;old=n.value}});bulkCard.style.display=videoCard.style.display='block'}
function splitCaptions(text){let raw=String(text||'').trim();if(!raw)return[''];let parts=raw.match(/[^。、！？!?]+[。、！？!?]?/g)||[raw],out=[];for(let p of parts){p=p.trim();if(!p)continue;if(p.length<=34){out.push(p);continue}let mid=Math.ceil(p.length/2);out.push(p.slice(0,mid)+'\n'+p.slice(mid))}return out}function captionAt(text,current,duration){let chunks=splitCaptions(text),weights=chunks.map(x=>Math.max(1,x.replace(/\n/g,'').length)),total=weights.reduce((a,b)=>a+b,0),t=Math.max(0,Math.min(duration||1,current||0))/(duration||1)*total,acc=0;for(let i=0;i<chunks.length;i++){acc+=weights[i];if(t<=acc)return chunks[i]}return chunks[chunks.length-1]||''}
voiceSample.onclick=async()=>{voiceSample.disabled=true;sampleStatus.textContent='試聴音声を作成中…';try{let d=await call({action:'generateTts',text:'こんにちは。今日は歴史の物語を分かりやすくご紹介します。',voice:voice.value,direction:direction.value});sampleAudio.src=du(d.mimeType,d.data);sampleAudio.style.display='block';sampleStatus.textContent='下の▶︎を押して試聴してください。'}catch(e){sampleStatus.textContent=e.message}finally{voiceSample.disabled=false}};applyVoice.onclick=async()=>{if(!project){sampleStatus.textContent='動画構成を作った後、このボタンで全体の声を変更できます。';return}if(!confirm(`動画全体の声を「${voice.value}」へ変更し、全シーンの音声を作り直しますか？`))return;applyVoice.disabled=true;sampleStatus.textContent=`全体を「${voice.value}」へ変更中…`;try{for(let i=0;i<project.scenes.length;i++){await genAudio(i);sampleStatus.textContent=`全体の声を変更中… ${i+1}/${project.scenes.length}`}sampleStatus.textContent=`動画全体を「${voice.value}」へ変更しました。`}catch(e){sampleStatus.textContent='声の変更エラー：'+e.message}finally{applyVoice.disabled=false}};makeScript.onclick=async()=>{if(!topic.value.trim())return;makeScript.disabled=true;scriptStatus.textContent='AIが構成を作成中…';try{project=await call({action:'generateScript',topic:topic.value,extra:extra.value,minutes:Number(minutes.value)});counts.script++;usage();render();scriptStatus.textContent='構成ができました。'}catch(e){scriptStatus.textContent=e.message}finally{makeScript.disabled=false}};
window.genImage=async i=>{sync(i);let s=project.scenes[i],d=await call({action:'generateImage',prompt:s.imagePrompt});s.image=du(d.mimeType,d.data);$(`imgbox-${i}`).innerHTML=`<img src="${s.image}">`;counts.image++;usage()};window.genAudio=async i=>{sync(i);let s=project.scenes[i],d=await call({action:'generateTts',text:s.reading,voice:voice.value,direction:direction.value});s.audio=du(d.mimeType,d.data);let a=$(`audio-${i}`);a.src=s.audio;a.style.display='block';counts.audio++;usage()};allImages.onclick=async()=>{if(confirm(`${project.scenes.length}枚の画像を生成しますか？`))for(let i=0;i<project.scenes.length;i++)await genImage(i)};function wait(ms){return new Promise(r=>setTimeout(r,ms))}function showBase(s){previewImg.src=s.image;previewTitle.textContent=s.title}async function playWithTimedCaptions(s,a){showBase(s);let timer=setInterval(()=>{previewCaption.textContent=captionAt(s.narration,a.currentTime,a.duration)},90);previewCaption.textContent=splitCaptions(s.narration)[0]||'';a.currentTime=0;try{await a.play();await new Promise(r=>{a.onended=r;a.onerror=r})}finally{clearInterval(timer)}}window.playScene=async i=>{sync(i);let s=project.scenes[i];if(!s.audio)return alert('先に音声を作ってください。');await playWithTimedCaptions(s,$(`audio-${i}`))};playAll.onclick=async()=>{syncAll();for(let i=0;i<project.scenes.length;i++){let s=project.scenes[i];if(!s.image||!s.audio)continue;await playWithTimedCaptions(s,new Audio(s.audio));previewProgress.style.width=Math.round((i+1)/project.scenes.length*100)+'%';if(i<project.scenes.length-1){showBase(project.scenes[i+1]);previewCaption.textContent='';await wait(900)}}};
function loadImage(src){return new Promise((r,j)=>{let im=new Image;im.onload=()=>r(im);im.onerror=j;im.src=src})}async function audioBuffer(ac,url){let r=await fetch(url);return ac.decodeAudioData(await r.arrayBuffer())}function wrap(ctx,text,max){let lines=[];for(let p of String(text||'').split('\n')){let l='';for(let ch of p){let t=l+ch;if(l&&ctx.measureText(t).width>max){lines.push(l);l=ch}else l=t}if(l)lines.push(l)}return lines.slice(0,2)}function draw(ctx,c,img,title,caption){ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height);let sc=Math.max(c.width/img.width,c.height/img.height),w=img.width*sc,h=img.height*sc;ctx.drawImage(img,(c.width-w)/2,(c.height-h)/2,w,h);if(title){ctx.font='bold 24px sans-serif';let tw=ctx.measureText(title).width;ctx.fillStyle='rgba(255,227,91,.72)';ctx.fillRect(35,28,tw+24,38);ctx.fillStyle='#111';ctx.textAlign='left';ctx.fillText(title,47,55)}if(caption){ctx.font='bold 32px sans-serif';ctx.textAlign='center';let ls=wrap(ctx,caption,c.width*.86),lh=43,bh=ls.length*lh+20,y0=c.height-bh-28;ctx.fillStyle='rgba(0,0,0,.53)';ctx.fillRect(c.width*.05,y0,c.width*.9,bh);ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=5;ls.forEach((x,j)=>{let y=y0+34+j*lh;ctx.strokeText(x,c.width/2,y);ctx.fillText(x,c.width/2,y)})}}makeVideo.onclick=async()=>{syncAll();if(project.scenes.some(s=>!s.image||!s.audio))return alert('全シーンの画像と音声を作ってください。');let b=makeVideo;b.disabled=true;videoStatus.textContent='字幕付き動画を作成中…';try{let c=document.createElement('canvas');c.width=1280;c.height=720;let ctx=c.getContext('2d'),AC=window.AudioContext||window.webkitAudioContext,ac=new AC;await ac.resume();let dest=ac.createMediaStreamDestination(),imgs=[],bufs=[];for(let s of project.scenes){imgs.push(await loadImage(s.image));bufs.push(await audioBuffer(ac,s.audio))}let vs=c.captureStream(30),stream=new MediaStream([...vs.getVideoTracks(),...dest.stream.getAudioTracks()]),types=['video/mp4','video/webm;codecs=vp9,opus','video/webm'],mime=types.find(x=>MediaRecorder.isTypeSupported(x))||'',rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:6000000}:undefined),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);let done=new Promise((r,j)=>{rec.onstop=r;rec.onerror=e=>j(e.error)});rec.start(1000);for(let i=0;i<project.scenes.length;i++){let s=project.scenes[i],src=ac.createBufferSource();src.buffer=bufs[i];src.connect(dest);src.start();let st=performance.now(),dur=bufs[i].duration;while(performance.now()-st<dur*1000){let elapsed=(performance.now()-st)/1000;draw(ctx,c,imgs[i],s.title,captionAt(s.narration,elapsed,dur));await wait(33)}if(i<project.scenes.length-1){let g=performance.now(),n=project.scenes[i+1];while(performance.now()-g<900){draw(ctx,c,imgs[i+1],n.title,'');await wait(33)}}}rec.stop();await done;stream.getTracks().forEach(t=>t.stop());await ac.close();let type=rec.mimeType||mime||'video/webm',blob=new Blob(chunks,{type}),url=URL.createObjectURL(blob),ext=type.includes('mp4')?'mp4':'webm';resultVideo.src=url;resultVideo.style.display='block';saveLink.href=url;saveLink.download=(project.title||'youtube-video').replace(/[\\/:*?"<>|]/g,'_')+'.'+ext;saveLink.textContent='完成した動画を保存（'+ext.toUpperCase()+'）';saveLink.style.display='block';videoStatus.textContent='動画が完成しました。'}catch(e){videoStatus.textContent='動画作成エラー：'+e.message}finally{b.disabled=false}};</script></body></html>
