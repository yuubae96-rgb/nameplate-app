<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16233f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>YouTube動画作成</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#17213a;--muted:#667188;--line:#d7dde6;--blue:#2693e8;--red:#e44945;--navy:#16233f;--ok:#257c68;--danger:#b8322b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);padding-bottom:calc(35px + env(safe-area-inset-bottom))}.app{max-width:706px;margin:auto}.head{padding:calc(10px + env(safe-area-inset-top)) 28px 14px;background:linear-gradient(180deg,#33435f,#172239);color:#fff}.head h1{margin:0;font-size:24px;font-weight:900;line-height:1.15}.head p{font-size:13px;line-height:1.55;color:#e4e8ee;margin:5px 0 0}.main{padding:22px}.card,.scene{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;margin-bottom:18px;box-shadow:0 1px 2px rgba(20,35,60,.03)}h2{margin:0 0 18px;font-size:19px}.field{margin-bottom:14px}label{display:block;font-size:14px;font-weight:800;color:var(--muted);margin-bottom:6px}input,textarea,select{width:100%;border:1px solid #cfd6e0;border-radius:13px;background:#fff;color:var(--ink);font-size:16px;padding:12px 14px;min-height:50px}textarea{min-height:116px;resize:vertical;line-height:1.6}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 16px}.chip{border:1px solid #d3d9e2;background:#fff;border-radius:999px;color:var(--blue);font-size:13px;font-weight:800;padding:10px 5px;white-space:nowrap}.btn{border:0;border-radius:13px;min-height:50px;padding:11px 14px;font-weight:900;font-size:15px;background:#eef1f5;color:var(--ink)}.btn:disabled{opacity:.5}.btn.red{background:var(--red);color:#fff}.btn.navy{background:var(--navy);color:#fff}.btn.green{background:var(--ok);color:#fff}.btn.full{width:100%}.btn.sample{width:49%;background:#fff;border:1px solid #d8dee7;color:#6f7788}.status{font-size:13px;color:var(--muted);line-height:1.6;margin-top:8px}.danger{color:var(--danger)}.build-card{padding:18px 26px}.build-card .btn{font-size:17px}.notice{font-size:12px;line-height:1.65;padding:11px 13px;background:#eef5f3;border:1px solid #c9ded8;border-radius:11px;color:#315f57}.bulk{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.usage{font-size:11px;color:var(--muted);margin-top:8px}.scene{padding:17px}.scene-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}.scene-num{background:var(--navy);color:#fff;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900;white-space:nowrap}.scene-title{flex:1;min-height:42px;font-size:15px;padding:8px 10px}.pill{font-size:10px;background:#e6f2ef;color:#21594f;border-radius:999px;padding:5px 8px;font-weight:800}.imgbox{aspect-ratio:16/9;background:#e7ebef;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:12px;margin-bottom:12px}.imgbox img{width:100%;height:100%;object-fit:cover}.scene textarea{min-height:92px;font-size:15px}.scene-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.scene-actions .btn{min-height:44px;font-size:12px;padding:9px}.audio{width:100%;margin-top:8px}.fact{font-size:11px;color:#765d16;background:#fff7df;border-radius:9px;padding:9px;line-height:1.55;margin-top:9px}.video-stage{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;position:relative}.video-stage img{width:100%;height:100%;object-fit:cover}.caption{position:absolute;left:5%;right:5%;bottom:5%;color:#fff;background:rgba(0,0,0,.53);border-radius:8px;padding:8px 10px;text-shadow:0 2px 5px #000;font-weight:900;font-size:clamp(15px,2.7vw,28px);text-align:center;line-height:1.4}.progress{height:7px;background:#e5e9ed;border-radius:999px;overflow:hidden;margin-top:9px}.progress>div{height:100%;width:0;background:var(--red)}.saveLink{display:none;margin-top:9px;text-align:center;text-decoration:none}.subtle{font-size:11px;color:var(--muted);line-height:1.6;margin-top:7px}@media(max-width:620px){.app{max-width:none}.head{padding-left:28px;padding-right:28px}.main{padding:22px}.card{padding:26px}.chips{grid-template-columns:repeat(4,1fr);gap:8px}.chip{font-size:12px;padding:9px 2px}.grid2{gap:10px}.btn.sample{width:49%}.scene-actions{grid-template-columns:1fr 1fr}.scene-actions .wide{grid-column:1/-1}}@media(max-width:390px){.head{padding-left:20px;padding-right:20px}.main{padding:14px}.card{padding:20px}.chips{gap:5px}.chip{font-size:11px}.grid2{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<header class="head"><h1>🎬 YouTube動画作成</h1><p>テーマから台本・AI画像・AIナレーション・字幕付き動画まで作成。APIキー入力は不要です。</p></header>
<main class="main">
<section class="card">
<h2>1. 動画のテーマ</h2>
<div class="field"><input id="topic" placeholder="例：伊藤博文の人生"></div>
<div class="chips"><button class="chip" data-topic="伊藤博文の人生">伊藤博文</button><button class="chip" data-topic="ペニシリン発見の歴史">ペニシリン</button><button class="chip" data-topic="坂本龍馬の人生">坂本龍馬</button><button class="chip" data-topic="ワクチンの歴史">ワクチン</button></div>
<div class="grid2"><div class="field"><label>動画の長さ</label><select id="minutes"><option value="1">約1分</option><option value="3" selected>約3分</option><option value="5">約5分</option><option value="8">約8分</option></select></div><div class="field"><label>画風</label><select id="style"><option value="realistic" selected>実写・歴史映画風</option><option value="documentary">リアル・歴史ドキュメンタリー風</option></select></div></div>
<div class="grid2"><div class="field"><label>ナレーションの声（12種類）</label><select id="voice"></select></div><div class="field"><label>読み方</label><select id="direction"><option value="落ち着いた日本語の歴史ドキュメンタリー調。自然な間、明瞭な発音、ややゆっくり。">落ち着いた解説</option><option value="重厚で落ち着いた日本語ナレーション。低めのテンションで、史実を丁寧に伝える。">重厚な解説</option><option value="聞きやすく親しみのある日本語解説。明瞭で自然なテンポ。">親しみやすい解説</option></select></div></div>
<button class="btn sample" id="voiceSample">▶ この声を試聴</button><div class="status" id="sampleStatus"></div><audio id="sampleAudio" class="audio" controls style="display:none"></audio>
<div class="field" style="margin-top:14px"><label>追加の指示</label><textarea id="extra" placeholder="例：初心者にも分かりやすく。人物を大きく。残酷な描写は避ける。"></textarea></div>
</section>
<section class="card build-card"><button class="btn red full" id="makeScript">AIで動画構成を作る</button><div class="status" id="scriptStatus">テーマを入力して作成してください。</div></section>
<section class="card" id="bulkCard" style="display:none"><h2>2. シーンを仕上げる</h2><div class="notice">「音声用の読み方」と「字幕」はナレーションと同じ文章が最初から入ります。画像はリアルな歴史映画風が標準です。</div><div class="bulk"><button class="btn navy" id="allImages">全シーンのAI画像を作る</button><button class="btn navy" id="allAudio">全シーンの音声を作る</button></div><div class="usage" id="usage">今回の利用：構成0回 / 画像0枚 / 音声0回</div></section>
<div id="scenes"></div>
<section class="card" id="videoCard" style="display:none"><h2>3. 字幕付き動画</h2><div class="video-stage"><img id="previewImg"><div class="caption" id="previewCaption"></div></div><div class="progress"><div id="previewProgress"></div></div><div class="bulk"><button class="btn" id="playAll">プレビュー再生</button><button class="btn red" id="makeVideo">字幕付き動画を作る</button></div><div class="status" id="videoStatus">全シーンの画像と音声がそろったら動画を作れます。</div><video id="resultVideo" controls playsinline style="display:none;width:100%;margin-top:10px;border-radius:12px;background:#000"></video><a id="saveLink" class="btn green full saveLink">動画を保存</a><div class="subtle">字幕は動画の中に直接入ります。端末がMP4録画に対応していない場合はWebMになります。</div></section>
</main></div>
<script>
const FN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/youtube-video-maker';
const voices=[['Charon','情報的・落ち着き'],['Gacrux','成熟・落ち着き'],['Sadaltager','知的'],['Iapetus','明瞭'],['Algieba','なめらか'],['Schedar','安定'],['Kore','しっかり'],['Aoede','軽やか'],['Sulafat','温かい'],['Vindemiatrix','やさしい'],['Achernar','柔らかい'],['Puck','明るい']];
const $=id=>document.getElementById(id);let project=null,counts={script:0,image:0,audio:0};voices.forEach(([v,n])=>{const o=document.createElement('option');o.value=v;o.textContent=`${v}｜${n}`;$('voice').appendChild(o)});document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{$('topic').value=b.dataset.topic});
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function usage(){$('usage').textContent=`今回の利用：構成${counts.script}回 / 画像${counts.image}枚 / 音声${counts.audio}回`}async function call(body){const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}function dataUrl(m,d){return `data:${m};base64,${d}`}
function syncScene(i){const s=project.scenes[i];s.title=$(`title-${i}`).value;s.narration=$(`nar-${i}`).value;s.reading=$(`read-${i}`).value;s.subtitle=$(`sub-${i}`).value;s.imagePrompt=$(`imgp-${i}`).value}function syncAll(){project?.scenes.forEach((_,i)=>syncScene(i))}function styleText(){return $('style').value==='documentary'?'premium realistic historical documentary, photorealistic live-action reconstruction':'high-budget photorealistic live-action historical feature film still'}
function sceneHtml(s,i){return `<section class="scene"><div class="scene-head"><span class="scene-num">SCENE ${i+1}</span><input class="scene-title" id="title-${i}" value="${esc(s.title||'')}"><span class="pill" id="state-${i}">未生成</span></div><div class="imgbox" id="imgbox-${i}">AI画像はまだありません</div><div class="field"><label>ナレーション</label><textarea id="nar-${i}">${esc(s.narration||'')}</textarea></div><div class="field"><label>音声用の読み方</label><textarea id="read-${i}">${esc(s.reading||s.narration||'')}</textarea></div><div class="field"><label>字幕</label><textarea id="sub-${i}">${esc(s.subtitle||s.narration||'')}</textarea></div><div class="field"><label>画像の内容</label><textarea id="imgp-${i}">${esc(s.imagePrompt||'')}</textarea></div><div class="scene-actions"><button class="btn" onclick="genImage(${i})">AI画像を作る</button><button class="btn" onclick="genAudio(${i})">音声を作る</button><button class="btn wide" onclick="playScene(${i})">このシーンを再生</button></div><audio id="audio-${i}" class="audio" controls style="display:none"></audio>${s.factCheck?`<div class="fact">史実メモ：${esc(s.factCheck)}</div>`:''}</section>`}
function render(){project.scenes.forEach(s=>{s.reading=s.reading||s.narration||'';s.subtitle=s.subtitle||s.narration||''});$('scenes').innerHTML=project.scenes.map(sceneHtml).join('');project.scenes.forEach((s,i)=>{const n=$(`nar-${i}`),r=$(`read-${i}`),sub=$(`sub-${i}`);let old=n.value;n.addEventListener('input',()=>{if(r.value===old)r.value=n.value;if(sub.value===old)sub.value=n.value;old=n.value})});$('bulkCard').style.display='block';$('videoCard').style.display='block'}
$('voiceSample').onclick=async()=>{const b=$('voiceSample');b.disabled=true;$('sampleStatus').textContent='試聴音声を作成中…';try{const d=await call({action:'generateTts',text:'こんにちは。今日は歴史の物語を分かりやすくご紹介します。',voice:$('voice').value,direction:$('direction').value});const a=$('sampleAudio');a.src=dataUrl(d.mimeType,d.data);a.style.display='block';await a.play();counts.audio++;usage();$('sampleStatus').textContent=''}catch(e){$('sampleStatus').innerHTML=`<span class="danger">${esc(e.message)}</span>`}finally{b.disabled=false}};
$('makeScript').onclick=async()=>{const topic=$('topic').value.trim();if(!topic){$('scriptStatus').innerHTML='<span class="danger">テーマを入力してください。</span>';return}const b=$('makeScript');b.disabled=true;$('scriptStatus').textContent='AIが構成を作成中…';try{project=await call({action:'generateScript',topic,extra:$('extra').value,minutes:Number($('minutes').value)});counts.script++;usage();render();$('scriptStatus').textContent=`「${project.title||topic}」の構成ができました。`}catch(e){$('scriptStatus').innerHTML=`<span class="danger">${esc(e.message)}</span>`}finally{b.disabled=false}};
window.genImage=async i=>{syncScene(i);const s=project.scenes[i],st=$(`state-${i}`);st.textContent='画像生成中…';try{const d=await call({action:'generateImage',prompt:`${styleText()}. ${s.imagePrompt}`});s.image=dataUrl(d.mimeType,d.data);$(`imgbox-${i}`).innerHTML=`<img src="${s.image}">`;counts.image++;usage();st.textContent=s.audio?'画像・音声OK':'画像OK'}catch(e){st.textContent='画像エラー';alert(e.message)}};window.genAudio=async i=>{syncScene(i);const s=project.scenes[i],st=$(`state-${i}`);st.textContent='音声生成中…';try{const d=await call({action:'generateTts',text:s.reading,voice:$('voice').value,direction:$('direction').value});s.audio=dataUrl(d.mimeType,d.data);const a=$(`audio-${i}`);a.src=s.audio;a.style.display='block';counts.audio++;usage();st.textContent=s.image?'画像・音声OK':'音声OK'}catch(e){st.textContent='音声エラー';alert(e.message)}};
$('allImages').onclick=async()=>{if(!confirm(`${project.scenes.length}枚の画像を生成します。続けますか？`))return;for(let i=0;i<project.scenes.length;i++)await genImage(i)};$('allAudio').onclick=async()=>{if(!confirm(`${project.scenes.length}シーンの音声を生成します。続けますか？`))return;for(let i=0;i<project.scenes.length;i++)await genAudio(i)};window.playScene=async i=>{syncScene(i);const s=project.scenes[i];if(!s.audio)return alert('先に音声を作ってください。');if(s.image)$('previewImg').src=s.image;$('previewCaption').textContent=s.subtitle;const a=$(`audio-${i}`);a.currentTime=0;await a.play()};$('playAll').onclick=async()=>{syncAll();for(let i=0;i<project.scenes.length;i++){const s=project.scenes[i];if(!s.image||!s.audio)continue;$('previewImg').src=s.image;$('previewCaption').textContent=s.subtitle;await new Promise(r=>{const a=new Audio(s.audio);a.onended=r;a.onerror=r;a.play().catch(r)});$('previewProgress').style.width=`${Math.round((i+1)/project.scenes.length*100)}%`}};
function loadImage(src){return new Promise((r,j)=>{const im=new Image();im.onload=()=>r(im);im.onerror=j;im.src=src})}async function audioBuffer(ac,url){const r=await fetch(url);return await ac.decodeAudioData(await r.arrayBuffer())}function wait(ms){return new Promise(r=>setTimeout(r,ms))}function wrapText(ctx,text,max){const out=[];let line='';for(const ch of String(text||'')){const t=line+ch;if(ctx.measureText(t).width>max&&line){out.push(line);line=ch}else line=t}if(line)out.push(line);return out.slice(0,3)}function drawFrame(ctx,c,img,text){ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height);const sc=Math.max(c.width/img.width,c.height/img.height),w=img.width*sc,h=img.height*sc;ctx.drawImage(img,(c.width-w)/2,(c.height-h)/2,w,h);ctx.font='bold 42px sans-serif';ctx.textAlign='center';const lines=wrapText(ctx,text,c.width*.86),lh=56,bh=lines.length*lh+24,y0=c.height-bh-30;ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(c.width*.05,y0,c.width*.9,bh);ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=6;lines.forEach((x,j)=>{const y=y0+38+j*lh;ctx.strokeText(x,c.width/2,y);ctx.fillText(x,c.width/2,y)})}
$('makeVideo').onclick=async()=>{syncAll();if(project.scenes.some(s=>!s.image||!s.audio))return alert('全シーンの画像と音声を作ってください。');if(typeof MediaRecorder==='undefined')return alert('このブラウザは動画書き出し非対応です。');const b=$('makeVideo');b.disabled=true;$('videoStatus').textContent='字幕付き動画を作成中…';try{const c=document.createElement('canvas');c.width=1280;c.height=720;const ctx=c.getContext('2d'),AC=window.AudioContext||window.webkitAudioContext,ac=new AC();await ac.resume();const dest=ac.createMediaStreamDestination(),imgs=[],bufs=[];for(const s of project.scenes){imgs.push(await loadImage(s.image));bufs.push(await audioBuffer(ac,s.audio))}const vs=c.captureStream(30),stream=new MediaStream([...vs.getVideoTracks(),...dest.stream.getAudioTracks()]),choices=['video/mp4','video/webm;codecs=vp9,opus','video/webm'],mime=choices.find(x=>MediaRecorder.isTypeSupported(x))||'',rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:6000000}:undefined),chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};const done=new Promise((r,j)=>{rec.onstop=r;rec.onerror=e=>j(e.error)});rec.start(1000);for(let i=0;i<project.scenes.length;i++){const s=project.scenes[i],buf=bufs[i],src=ac.createBufferSource();src.buffer=buf;src.connect(dest);src.start();const st=performance.now();while(performance.now()-st<buf.duration*1000){drawFrame(ctx,c,imgs[i],s.subtitle);await wait(33)}}rec.stop();await done;stream.getTracks().forEach(t=>t.stop());await ac.close();const type=rec.mimeType||mime||'video/webm',blob=new Blob(chunks,{type}),url=URL.createObjectURL(blob),ext=type.includes('mp4')?'mp4':'webm';$('resultVideo').src=url;$('resultVideo').style.display='block';$('saveLink').href=url;$('saveLink').download=`${(project.title||'youtube-video').replace(/[\\/:*?"<>|]/g,'_')}.${ext}`;$('saveLink').textContent=`動画を保存（${ext.toUpperCase()}）`;$('saveLink').style.display='block';$('videoStatus').textContent='字幕付き動画が完成しました。'}catch(e){$('videoStatus').innerHTML=`<span class="danger">動画作成エラー：${esc(e.message)}</span>`}finally{b.disabled=false}};
</script>
</body></html>
