<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16233f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>YouTube動画作成</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#17213a;--muted:#64718a;--line:#d7dde6;--blue:#2693e8;--red:#e44945;--navy:#16233f;--soft:#eef4f8;--ok:#257c68;--danger:#b8322b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);padding-bottom:calc(48px + env(safe-area-inset-bottom))}.app{max-width:760px;margin:auto}.head{padding:calc(14px + env(safe-area-inset-top)) 22px 22px;background:linear-gradient(180deg,#33435f,#172239);color:#fff}.head h1{margin:0;font-size:30px;line-height:1.15;font-weight:900}.head p{font-size:14px;line-height:1.7;color:#e4e8ee;margin:8px 0 0}.main{padding:20px 20px 34px}.card,.scene{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px;margin-bottom:20px;box-shadow:0 1px 2px rgba(20,35,60,.03)}h2{margin:0 0 20px;font-size:21px}.field{margin-bottom:16px}label{display:block;font-size:15px;font-weight:800;color:#64718a;margin-bottom:7px}input,textarea,select{width:100%;border:1px solid #cfd6e0;border-radius:14px;background:#fff;color:var(--ink);font-size:18px;padding:14px 16px;min-height:58px}textarea{min-height:132px;resize:vertical;line-height:1.65}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.chips{display:flex;gap:10px;flex-wrap:wrap;margin:-2px 0 18px}.chip{border:1px solid #d3d9e2;background:#fff;border-radius:999px;color:var(--blue);font-size:15px;font-weight:800;padding:11px 18px}.btn{border:0;border-radius:15px;min-height:58px;padding:14px 18px;font-weight:900;font-size:17px;background:#eef1f5;color:var(--ink)}.btn:disabled{opacity:.5}.btn.red{background:var(--red);color:#fff}.btn.navy{background:var(--navy);color:#fff}.btn.green{background:var(--ok);color:#fff}.btn.full{width:100%}.btn.sample{width:100%;background:#fff;border:1px solid #d8dee7;color:#6f7788}.status{font-size:14px;color:var(--muted);line-height:1.7;margin-top:12px}.danger{color:var(--danger)}.build-card{padding:26px}.build-card .btn{font-size:20px}.notice{font-size:13px;line-height:1.7;padding:13px 15px;background:#eef5f3;border:1px solid #c9ded8;border-radius:12px;color:#315f57}.bulk{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.usage{font-size:12px;color:var(--muted);margin-top:10px}.scene{padding:18px}.scene-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}.scene-num{background:var(--navy);color:#fff;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900;white-space:nowrap}.scene-title{flex:1;min-height:44px;font-size:16px;padding:9px 11px}.pill{font-size:11px;background:#e6f2ef;color:#21594f;border-radius:999px;padding:6px 9px;font-weight:800}.imgbox{aspect-ratio:16/9;background:#e7ebef;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:13px;margin-bottom:14px}.imgbox img{width:100%;height:100%;object-fit:cover}.scene textarea{min-height:104px;font-size:16px}.scene-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.scene-actions .btn{min-height:48px;font-size:13px;padding:10px}.audio{width:100%;margin-top:10px}.fact{font-size:12px;color:#765d16;background:#fff7df;border-radius:10px;padding:10px;line-height:1.6;margin-top:10px}.video-stage{aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;position:relative}.video-stage img{width:100%;height:100%;object-fit:cover}.caption{position:absolute;left:5%;right:5%;bottom:5%;color:#fff;background:rgba(0,0,0,.53);border-radius:9px;padding:9px 12px;text-shadow:0 2px 5px #000;font-weight:900;font-size:clamp(16px,3vw,30px);text-align:center;line-height:1.45}.progress{height:8px;background:#e5e9ed;border-radius:999px;overflow:hidden;margin-top:10px}.progress>div{height:100%;width:0;background:var(--red)}.saveLink{display:none;margin-top:10px;text-align:center;text-decoration:none}.subtle{font-size:12px;color:var(--muted);line-height:1.6;margin-top:8px}@media(max-width:620px){.head h1{font-size:28px}.main{padding:20px}.card{padding:26px}.grid2{grid-template-columns:1fr 1fr;gap:10px}.bulk{grid-template-columns:1fr}.scene-actions{grid-template-columns:1fr 1fr}.scene-actions .wide{grid-column:1/-1}}@media(max-width:390px){.grid2{grid-template-columns:1fr}.head{padding-left:20px;padding-right:20px}.main{padding-left:14px;padding-right:14px}.card{padding:20px}}
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <h1>🎬 YouTube動画作成</h1>
    <p>テーマから台本・AI画像・AIナレーション・字幕付き動画まで作成。APIキー入力は不要です。</p>
  </header>
  <main class="main">
    <section class="card">
      <h2>1. 動画のテーマ</h2>
      <div class="field"><input id="topic" placeholder="例：伊藤博文の人生"></div>
      <div class="chips">
        <button class="chip" data-topic="伊藤博文の人生">伊藤博文</button>
        <button class="chip" data-topic="ペニシリン発見の歴史">ペニシリン</button>
        <button class="chip" data-topic="坂本龍馬の人生">坂本龍馬</button>
        <button class="chip" data-topic="ワクチンの歴史">ワクチン</button>
      </div>
      <div class="grid2">
        <div class="field"><label>動画の長さ</label><select id="minutes"><option value="1">約1分</option><option value="3" selected>約3分</option><option value="5">約5分</option><option value="8">約8分</option></select></div>
        <div class="field"><label>画風</label><select id="style"><option value="realistic" selected>実写・歴史映画風</option><option value="documentary">リアル・歴史ドキュメンタリー風</option></select></div>
      </div>
      <div class="grid2">
        <div class="field"><label>ナレーションの声（12種類）</label><select id="voice"></select></div>
        <div class="field"><label>読み方</label><select id="direction"><option value="落ち着いた日本語の歴史ドキュメンタリー調。自然な間、明瞭な発音、ややゆっくり。">落ち着いた解説</option><option value="重厚で落ち着いた日本語ナレーション。低めのテンションで、史実を丁寧に伝える。">重厚な解説</option><option value="聞きやすく親しみのある日本語解説。明瞭で自然なテンポ。">親しみやすい解説</option></select></div>
      </div>
      <button class="btn sample" id="voiceSample">▶ この声を試聴</button>
      <div class="status" id="sampleStatus"></div>
      <audio id="sampleAudio" class="audio" controls style="display:none"></audio>
      <div class="field" style="margin-top:16px"><label>追加の指示</label><textarea id="extra" placeholder="例：初心者にも分かりやすく。人物を大きく。残酷な描写は避ける。"></textarea></div>
    </section>

    <section class="card build-card">
      <button class="btn red full" id="makeScript">AIで動画構成を作る</button>
      <div class="status" id="scriptStatus">テーマを入力して作成してください。</div>
    </section>

    <section class="card" id="bulkCard" style="display:none">
      <h2>2. シーンを仕上げる</h2>
      <div class="notice">「音声用の読み方」と「字幕」はナレーションと同じ文章が最初から入ります。読み間違いだけ「音声用の読み方」を直してください。画像はリアルな歴史映画風が標準です。</div>
      <div class="bulk"><button class="btn navy" id="allImages">全シーンのAI画像を作る</button><button class="btn navy" id="allAudio">全シーンの音声を作る</button></div>
      <div class="usage" id="usage">今回の利用：構成0回 / 画像0枚 / 音声0回</div>
    </section>

    <div id="scenes"></div>

    <section class="card" id="videoCard" style="display:none">
      <h2>3. 字幕付き動画</h2>
      <div class="video-stage"><img id="previewImg"><div class="caption" id="previewCaption"></div></div>
      <div class="progress"><div id="previewProgress"></div></div>
      <div class="bulk"><button class="btn" id="playAll">プレビュー再生</button><button class="btn red" id="makeVideo">字幕付き動画を作る</button></div>
      <div class="status" id="videoStatus">全シーンの画像と音声がそろったら動画を作れます。</div>
      <video id="resultVideo" controls playsinline style="display:none;width:100%;margin-top:12px;border-radius:12px;background:#000"></video>
      <a id="saveLink" class="btn green full saveLink">動画を保存</a>
      <div class="subtle">字幕は動画の中に直接入ります。端末がMP4録画に対応していない場合はWebMになります。</div>
    </section>
  </main>
</div>
<script>
const FN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/youtube-video-maker';
const voices=[['Charon','情報的・落ち着き'],['Gacrux','成熟・落ち着き'],['Sadaltager','知的'],['Iapetus','明瞭'],['Algieba','なめらか'],['Schedar','安定'],['Kore','しっかり'],['Aoede','軽やか'],['Sulafat','温かい'],['Vindemiatrix','やさしい'],['Achernar','柔らかい'],['Puck','明るい']];
const $=id=>document.getElementById(id);let project=null,counts={script:0,image:0,audio:0},stopPreview=false;
voices.forEach(([v,n])=>{const o=document.createElement('option');o.value=v;o.textContent=`${v}｜${n}`;$('voice').appendChild(o)});
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{$('topic').value=b.dataset.topic||b.textContent});
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function usage(){$('usage').textContent=`今回の利用：構成${counts.script}回 / 画像${counts.image}枚 / 音声${counts.audio}回`}
async function call(body){const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}
function dataUrl(mime,data){return `data:${mime};base64,${data}`}
function syncScene(i){const s=project.scenes[i];s.title=$(`title-${i}`).value;s.narration=$(`nar-${i}`).value;s.reading=$(`read-${i}`).value;s.subtitle=$(`sub-${i}`).value;s.imagePrompt=$(`imgp-${i}`).value}
function syncAll(){if(project)project.scenes.forEach((_,i)=>syncScene(i))}
function styleText(){return $('style').value==='documentary'?'premium realistic historical documentary, photorealistic live-action reconstruction':'high-budget photorealistic live-action historical feature film still'}
function sceneHtml(s,i){return `<section class="scene" id="scene-${i}"><div class="scene-head"><span class="scene-num">SCENE ${i+1}</span><input class="scene-title" id="title-${i}" value="${esc(s.title||'')}"><span class="pill" id="state-${i}">未生成</span></div><div class="imgbox" id="imgbox-${i}">AI画像はまだありません</div><div class="field"><label>ナレーション</label><textarea id="nar-${i}">${esc(s.narration||'')}</textarea></div><div class="field"><label>音声用の読み方</label><textarea id="read-${i}">${esc(s.reading||s.narration||'')}</textarea></div><div class="field"><label>字幕</label><textarea id="sub-${i}">${esc(s.subtitle||s.narration||'')}</textarea></div><div class="field"><label>画像の内容</label><textarea id="imgp-${i}">${esc(s.imagePrompt||'')}</textarea></div><div class="scene-actions"><button class="btn" onclick="genImage(${i})">AI画像を作る</button><button class="btn" onclick="genAudio(${i})">音声を作る</button><button class="btn wide" onclick="playScene(${i})">このシーンを再生</button></div><audio id="audio-${i}" class="audio" controls style="display:none"></audio>${s.factCheck?`<div class="fact">史実メモ：${esc(s.factCheck)}</div>`:''}</section>`}
function render(){project.scenes.forEach(s=>{s.reading=s.reading||s.narration||'';s.subtitle=s.subtitle||s.narration||''});$('scenes').innerHTML=project.scenes.map(sceneHtml).join('');project.scenes.forEach((s,i)=>{const n=$(`nar-${i}`),r=$(`read-${i}`),sub=$(`sub-${i}`);let old=n.value;n.addEventListener('input',()=>{if(r.value===old)r.value=n.value;if(sub.value===old)sub.value=n.value;old=n.value})});$('bulkCard').style.display='block';$('videoCard').style.display='block'}
$('voiceSample').onclick=async()=>{const b=$('voiceSample');b.disabled=true;$('sampleStatus').textContent='試聴音声を作成中…';try{const d=await call({action:'generateTts',text:'こんにちは。今日は歴史の物語を分かりやすくご紹介します。',voice:$('voice').value,direction:$('direction').value});const a=$('sampleAudio');a.src=dataUrl(d.mimeType,d.data);a.style.display='block';await a.play();counts.audio++;usage();$('sampleStatus').textContent=''}catch(e){$('sampleStatus').innerHTML=`<span class="danger">${esc(e.message)}</span>`}finally{b.disabled=false}};
$('makeScript').onclick=async()=>{const topic=$('topic').value.trim();if(!topic){$('scriptStatus').innerHTML='<span class="danger">テーマを入力してください。</span>';return}const b=$('makeScript');b.disabled=true;$('scriptStatus').textContent='AIが構成を作成中…';try{project=await call({action:'generateScript',topic,extra:$('extra').value,minutes:Number($('minutes').value)});counts.script++;usage();render();$('scriptStatus').textContent=`「${project.title||topic}」の構成ができました。下の各シーンを確認してください。`}catch(e){$('scriptStatus').innerHTML=`<span class="danger">${esc(e.message)}</span>`}finally{b.disabled=false}};
window.genImage=async i=>{syncScene(i);const s=project.scenes[i],st=$(`state-${i}`);st.textContent='画像生成中…';try{const d=await call({action:'generateImage',prompt:`${styleText()}. ${s.imagePrompt}`});s.image=dataUrl(d.mimeType,d.data);$(`imgbox-${i}`).innerHTML=`<img src="${s.image}">`;counts.image++;usage();st.textContent=s.audio?'画像・音声OK':'画像OK'}catch(e){st.textContent='画像エラー';alert(e.message)}};
window.genAudio=async i=>{syncScene(i);const s=project.scenes[i],st=$(`state-${i}`);st.textContent='音声生成中…';try{const d=await call({action:'generateTts',text:s.reading,voice:$('voice').value,direction:$('direction').value});s.audio=dataUrl(d.mimeType,d.data);const a=$(`audio-${i}`);a.src=s.audio;a.style.display='block';counts.audio++;usage();st.textContent=s.image?'画像・音声OK':'音声OK'}catch(e){st.textContent='音声エラー';alert(e.message)}};
$('allImages').onclick=async()=>{if(!project)return;if(!confirm(`${project.scenes.length}枚の画像を順番に生成します。Gemini APIを使用します。続けますか？`))return;const b=$('allImages');b.disabled=true;for(let i=0;i<project.scenes.length;i++)await genImage(i);b.disabled=false};
$('allAudio').onclick=async()=>{if(!project)return;if(!confirm(`${project.scenes.length}シーンの音声を順番に生成します。Gemini APIを使用します。続けますか？`))return;const b=$('allAudio');b.disabled=true;for(let i=0;i<project.scenes.length;i++)await genAudio(i);b.disabled=false};
window.playScene=async i=>{syncScene(i);const s=project.scenes[i];if(!s.audio){alert('先に音声を作ってください。');return}if(s.image)$('previewImg').src=s.image;$('previewCaption').textContent=s.subtitle;const a=$(`audio-${i}`);a.currentTime=0;await a.play()};
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
$('playAll').onclick=async()=>{if(!project)return;syncAll();stopPreview=false;for(let i=0;i<project.scenes.length;i++){if(stopPreview)break;const s=project.scenes[i];if(!s.image||!s.audio)continue;$('previewImg').src=s.image;$('previewCaption').textContent=s.subtitle;const a=new Audio(s.audio);await new Promise(resolve=>{a.onended=resolve;a.onerror=resolve;a.play().catch(resolve)});$('previewProgress').style.width=`${Math.round((i+1)/project.scenes.length*100)}%`}};
function loadImage(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src})}
async function audioBuffer(ac,url){const r=await fetch(url);const ab=await r.arrayBuffer();return await ac.decodeAudioData(ab)}
function wrapText(ctx,text,maxWidth){const out=[];for(const p of String(text||'').split(/\n/)){let line='';for(const ch of p){const test=line+ch;if(ctx.measureText(test).width>maxWidth&&line){out.push(line);line=ch}else line=test}if(line)out.push(line)}return out.slice(0,3)}
function drawFrame(ctx,canvas,img,text){ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);const scale=Math.max(canvas.width/img.width,canvas.height/img.height);const w=img.width*scale,h=img.height*scale;ctx.drawImage(img,(canvas.width-w)/2,(canvas.height-h)/2,w,h);ctx.font='bold 42px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';const lines=wrapText(ctx,text,canvas.width*.86),lh=58,boxH=lines.length*lh+28,y0=canvas.height-boxH-34;ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(canvas.width*.05,y0,canvas.width*.9,boxH);ctx.fillStyle='#fff';ctx.strokeStyle='rgba(0,0,0,.9)';ctx.lineWidth=6;lines.forEach((line,j)=>{const y=y0+14+lh*(j+.5);ctx.strokeText(line,canvas.width/2,y);ctx.fillText(line,canvas.width/2,y)})}
$('makeVideo').onclick=async()=>{if(!project)return;syncAll();if(project.scenes.some(s=>!s.image||!s.audio)){alert('全シーンの画像と音声を作ってから動画を作成してください。');return}if(typeof MediaRecorder==='undefined'){alert('このブラウザでは動画書き出しに対応していません。');return}const btn=$('makeVideo');btn.disabled=true;$('videoStatus').textContent='字幕付き動画を作成中… 画面を閉じずにお待ちください。';$('saveLink').style.display='none';$('resultVideo').style.display='none';try{const canvas=document.createElement('canvas');canvas.width=1280;canvas.height=720;const ctx=canvas.getContext('2d');const AC=window.AudioContext||window.webkitAudioContext;const ac=new AC();await ac.resume();const dest=ac.createMediaStreamDestination();const images=[],buffers=[];for(let i=0;i<project.scenes.length;i++){images.push(await loadImage(project.scenes[i].image));buffers.push(await audioBuffer(ac,project.scenes[i].audio))}if(!canvas.captureStream)throw new Error('このブラウザでは動画書き出しに対応していません。');const vstream=canvas.captureStream(30);const stream=new MediaStream([...vstream.getVideoTracks(),...dest.stream.getAudioTracks()]);const choices=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];const mime=choices.find(x=>MediaRecorder.isTypeSupported(x))||'';const rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:6000000}:undefined);const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};const done=new Promise((resolve,reject)=>{rec.onstop=resolve;rec.onerror=e=>reject(e.error||new Error('録画エラー'))});rec.start(1000);for(let i=0;i<project.scenes.length;i++){const s=project.scenes[i],img=images[i],buf=buffers[i];drawFrame(ctx,canvas,img,s.subtitle);$('previewImg').src=s.image;$('previewCaption').textContent=s.subtitle;const src=ac.createBufferSource();src.buffer=buf;src.connect(dest);src.start();const start=performance.now(),dur=Math.max(.5,buf.duration);while(performance.now()-start<dur*1000){drawFrame(ctx,canvas,img,s.subtitle);const local=(performance.now()-start)/(dur*1000);$('previewProgress').style.width=`${Math.round(((i+Math.min(1,local))/project.scenes.length)*100)}%`;await wait(33)}await wait(120)}await wait(250);rec.stop();await done;stream.getTracks().forEach(t=>t.stop());await ac.close();const type=rec.mimeType||mime||'video/webm';const blob=new Blob(chunks,{type});const url=URL.createObjectURL(blob);const ext=type.includes('mp4')?'mp4':'webm';const video=$('resultVideo');video.src=url;video.style.display='block';const link=$('saveLink');link.href=url;link.download=`${(project.title||$('topic').value||'youtube-video').replace(/[\\/:*?"<>|]/g,'_')}.${ext}`;link.textContent=`動画を保存（${ext.toUpperCase()}）`;link.style.display='block';$('previewProgress').style.width='100%';$('videoStatus').textContent='字幕付き動画が完成しました。下の動画で確認して保存できます。'}catch(e){console.error(e);$('videoStatus').innerHTML=`<span class="danger">動画作成エラー：${esc(e.message)}</span>`}finally{btn.disabled=false}};
</script>
</body>
</html>
