<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16233f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>YouTube動画作成</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#16233f;--muted:#68758c;--line:#dce2e8;--accent:#0f6e5f;--danger:#b83a32;--soft:#eef5f3}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);padding-bottom:calc(50px + env(safe-area-inset-bottom))}.app{max-width:920px;margin:auto}.head{padding:calc(18px + env(safe-area-inset-top)) 16px 18px;background:linear-gradient(180deg,#253756,#16233f);color:#fff}.head h1{font-size:23px;margin:0}.head p{font-size:12px;line-height:1.6;margin:6px 0 0;color:#d4dbe5}.main{padding:12px}.card,.scene{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:12px}.card h2{font-size:15px;margin:0 0 13px}.field{margin-bottom:12px}label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font-size:16px;padding:11px;min-height:46px}textarea{min-height:96px;resize:vertical;line-height:1.6}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:11px;min-height:48px;padding:10px 12px;font-weight:900;font-size:14px;background:#e9edf2;color:var(--ink)}.btn.primary{background:var(--accent);color:#fff}.btn.navy{background:var(--ink);color:#fff}.btn:disabled{opacity:.45}.status{font-size:12px;color:var(--muted);line-height:1.6;margin-top:8px}.danger{color:var(--danger)}.note{font-size:12px;line-height:1.65;background:var(--soft);border:1px solid #c9ded8;padding:11px;border-radius:10px;color:#315f57}.usage{font-size:11px;color:var(--muted);margin-top:8px}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}.scene-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.scene-title-wrap{display:flex;align-items:center;gap:8px;flex:1}.scene-num{font-size:11px;background:var(--ink);color:#fff;border-radius:999px;padding:5px 8px;white-space:nowrap}.scene-title{font-weight:900;font-size:15px;flex:1}.pill{display:inline-block;background:#e6f2ef;color:#21594f;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;white-space:nowrap}.imgbox{aspect-ratio:16/9;background:#e9edf1;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:12px;margin-bottom:10px}.imgbox img{width:100%;height:100%;object-fit:cover}.scene-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.small{min-height:42px;font-size:12px}.fact{font-size:11px;color:#765d16;background:#fff7df;border-radius:9px;padding:9px;line-height:1.55;margin-top:9px}.audio{width:100%;margin-top:8px}.video-stage{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;position:relative}.video-stage img,.video-stage video{width:100%;height:100%;object-fit:cover}.caption{position:absolute;left:5%;right:5%;bottom:5%;color:#fff;background:rgba(0,0,0,.5);border-radius:8px;padding:8px 12px;text-shadow:0 2px 5px #000;font-weight:900;font-size:clamp(16px,2.8vw,30px);text-align:center;line-height:1.45}.progress{height:8px;background:#e5e9ed;border-radius:999px;overflow:hidden;margin-top:10px}.progress>div{height:100%;width:0;background:var(--accent)}.saveLink{display:none;margin-top:10px;text-align:center;text-decoration:none}.subtle{font-size:11px;color:var(--muted);line-height:1.6}@media(max-width:620px){.row,.toolbar{grid-template-columns:1fr}.scene-actions{grid-template-columns:1fr 1fr}.scene-actions .wide{grid-column:1/-1}.scene-head{align-items:flex-start}.scene-title-wrap{align-items:flex-start;flex-direction:column}.scene-title{width:100%}}
</style>
</head>
<body>
<div class="app">
  <div class="head"><h1>YouTube動画作成</h1><p>テーマ → AI構成 → Gemini画像 → 12種類のナレーション → 字幕付き動画</p></div>
  <div class="main">
    <div class="card">
      <h2>1. 動画の内容</h2>
      <div class="field"><label>テーマ</label><input id="topic" placeholder="例：坂本龍馬の人生"></div>
      <div class="field"><label>追加指示（任意）</label><textarea id="extra" placeholder="例：初心者にも分かりやすく。史実を優先。"></textarea></div>
      <div class="field"><label>長さ</label><select id="minutes"><option value="1">約1分</option><option value="3" selected>約3分</option><option value="5">約5分</option><option value="8">約8分</option></select></div>
      <button class="btn primary" id="makeScript">AIで動画構成を作る</button>
      <div class="status" id="scriptStatus">まだ構成を作っていません。</div>
    </div>

    <div class="card" id="voiceCard" style="display:none">
      <h2>2. ナレーション</h2>
      <div class="row">
        <div class="field"><label>声（12種類）</label><select id="voice"></select></div>
        <div class="field"><label>読み方</label><select id="direction"><option>落ち着いた日本語の歴史ドキュメンタリー調。自然な間、明瞭な発音、ややゆっくり。</option><option>重厚で落ち着いた日本語ナレーション。低めのテンションで、史実を丁寧に伝える。</option><option>聞きやすく親しみのある日本語解説。明瞭で自然なテンポ。</option></select></div>
      </div>
      <button class="btn" id="voiceSample">この声を試聴</button>
      <audio id="sampleAudio" class="audio" controls style="display:none"></audio>
    </div>

    <div class="card" id="bulk" style="display:none">
      <h2>3. 各シーンを作る</h2>
      <div class="note">画像は<strong>実写の歴史映画・高品質ドキュメンタリー風</strong>を標準にしています。「音声用の読み方」と「字幕」はナレーション本文が最初から自動入力されます。</div>
      <div class="toolbar" style="margin-top:10px"><button class="btn navy" id="allImages">全シーンのAI画像を作る</button><button class="btn navy" id="allAudio">全シーンの音声を作る</button></div>
      <div class="usage" id="usage">今回の利用：構成0回 / 画像0枚 / 音声0回</div>
    </div>

    <div id="scenes"></div>

    <div class="card" id="videoCard" style="display:none">
      <h2>4. 字幕付き動画</h2>
      <div class="video-stage"><img id="previewImg"><div class="caption" id="previewCaption"></div></div>
      <div class="progress"><div id="previewProgress"></div></div>
      <div class="toolbar" style="margin-top:10px"><button class="btn" id="playAll">プレビュー再生</button><button class="btn primary" id="makeVideo">字幕付き動画を作る</button></div>
      <div class="status" id="videoStatus">全シーンの画像と音声がそろったら動画を作れます。</div>
      <video id="resultVideo" controls playsinline style="display:none;width:100%;margin-top:12px;border-radius:12px;background:#000"></video>
      <a id="saveLink" class="btn primary saveLink">動画を保存</a>
      <div class="subtle">字幕は動画の中に直接焼き込みます。対応ブラウザではMP4、非対応の場合はWebMで作成します。</div>
    </div>
  </div>
</div>
<script>
const FN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/youtube-video-maker';
const voices=[['Charon','男声・解説向け'],['Gacrux','男声・落ち着き'],['Sadaltager','男声・知的'],['Iapetus','男声・明瞭'],['Algieba','男声・なめらか'],['Schedar','男声・安定'],['Kore','女声・しっかり'],['Aoede','女声・軽やか'],['Sulafat','女声・温かい'],['Vindemiatrix','女声・やさしい'],['Achernar','女声・柔らかい'],['Puck','明るい・軽快']];
const $=id=>document.getElementById(id);let project=null,counts={script:0,image:0,audio:0},stopPreview=false;
voices.forEach(([v,n])=>{const o=document.createElement('option');o.value=v;o.textContent=`${v}｜${n}`;$('voice').appendChild(o)});
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function usage(){$('usage').textContent=`今回の利用：構成${counts.script}回 / 画像${counts.image}枚 / 音声${counts.audio}回`}
async function call(body){const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}
function dataUrl(mime,data){return `data:${mime};base64,${data}`}
function syncScene(i){const s=project.scenes[i];s.title=$(`title-${i}`).value;s.narration=$(`nar-${i}`).value;s.reading=$(`read-${i}`).value;s.subtitle=$(`sub-${i}`).value;s.imagePrompt=$(`imgp-${i}`).value}
function syncAll(){if(project)project.scenes.forEach((_,i)=>syncScene(i))}
function sceneHtml(s,i){return `<div class="scene" id="scene-${i}"><div class="scene-head"><div class="scene-title-wrap"><span class="scene-num">SCENE ${i+1}</span><input class="scene-title" id="title-${i}" value="${esc(s.title||'')}"></div><span class="pill" id="state-${i}">未生成</span></div><div class="imgbox" id="imgbox-${i}">AI画像はまだありません</div><div class="field"><label>ナレーション</label><textarea id="nar-${i}">${esc(s.narration||'')}</textarea></div><div class="field"><label>音声用の読み方</label><textarea id="read-${i}">${esc(s.reading||s.narration||'')}</textarea></div><div class="field"><label>字幕</label><textarea id="sub-${i}">${esc(s.subtitle||s.narration||'')}</textarea></div><div class="field"><label>画像の内容</label><textarea id="imgp-${i}">${esc(s.imagePrompt||'')}</textarea></div><div class="scene-actions"><button class="btn small" onclick="genImage(${i})">AI画像を作る</button><button class="btn small" onclick="genAudio(${i})">音声を作る</button><button class="btn small wide" onclick="playScene(${i})">このシーンを再生</button></div><audio id="audio-${i}" class="audio" controls style="display:none"></audio>${s.factCheck?`<div class="fact">史実メモ：${esc(s.factCheck)}</div>`:''}</div>`}
function render(){project.scenes.forEach(s=>{s.reading=s.reading||s.narration||'';s.subtitle=s.subtitle||s.narration||''});$('scenes').innerHTML=project.scenes.map(sceneHtml).join('');$('voiceCard').style.display='block';$('bulk').style.display='block';$('videoCard').style.display='block'}
$('makeScript').onclick=async()=>{const topic=$('topic').value.trim();if(!topic){$('scriptStatus').innerHTML='<span class="danger">テーマを入力してください。</span>';return}const b=$('makeScript');b.disabled=true;$('scriptStatus').textContent='AIが構成を作成中…';try{project=await call({action:'generateScript',topic,extra:$('extra').value,minutes:Number($('minutes').value)});counts.script++;usage();render();$('scriptStatus').textContent=`「${project.title||topic}」の構成ができました。内容を確認して画像・音声を作ってください。`}catch(e){$('scriptStatus').innerHTML=`<span class="danger">${esc(e.message)}</span>`}finally{b.disabled=false}};
window.genImage=async i=>{syncScene(i);const s=project.scenes[i],st=$(`state-${i}`);st.textContent='画像生成中…';try{const d=await call({action:'generateImage',prompt:s.imagePrompt});s.image=dataUrl(d.mimeType,d.data);$(`imgbox-${i}`).innerHTML=`<img src="${s.image}">`;counts.image++;usage();st.textContent=s.audio?'画像・音声OK':'画像OK'}catch(e){st.textContent='画像エラー';alert(e.message)}};
window.genAudio=async i=>{syncScene(i);const s=project.scenes[i],st=$(`state-${i}`);st.textContent='音声生成中…';try{const d=await call({action:'generateTts',text:s.reading,voice:$('voice').value,direction:$('direction').value});s.audio=dataUrl(d.mimeType,d.data);const a=$(`audio-${i}`);a.src=s.audio;a.style.display='block';counts.audio++;usage();st.textContent=s.image?'画像・音声OK':'音声OK'}catch(e){st.textContent='音声エラー';alert(e.message)}};
$('allImages').onclick=async()=>{if(!project)return;if(!confirm(`${project.scenes.length}枚の画像を順番に生成します。続けますか？`))return;const b=$('allImages');b.disabled=true;for(let i=0;i<project.scenes.length;i++)await genImage(i);b.disabled=false};
$('allAudio').onclick=async()=>{if(!project)return;if(!confirm(`${project.scenes.length}シーンの音声を順番に生成します。続けますか？`))return;const b=$('allAudio');b.disabled=true;for(let i=0;i<project.scenes.length;i++)await genAudio(i);b.disabled=false};
$('voiceSample').onclick=async()=>{const b=$('voiceSample');b.disabled=true;b.textContent='生成中…';try{const d=await call({action:'generateTts',text:'こんにちは。今日は歴史の物語を分かりやすくご紹介します。',voice:$('voice').value,direction:$('direction').value});const a=$('sampleAudio');a.src=dataUrl(d.mimeType,d.data);a.style.display='block';await a.play();counts.audio++;usage()}catch(e){alert(e.message)}finally{b.disabled=false;b.textContent='この声を試聴'}};
window.playScene=async i=>{syncScene(i);const s=project.scenes[i];if(!s.image||!s.audio){alert('このシーンの画像と音声を先に作ってください。');return}$('previewImg').src=s.image;$('previewCaption').textContent=s.subtitle;const a=new Audio(s.audio);await a.play().catch(()=>{})};
$('playAll').onclick=async()=>{if(!project)return;syncAll();stopPreview=false;const ready=project.scenes.filter(s=>s.image&&s.audio);if(ready.length!==project.scenes.length){alert('全シーンの画像と音声を作ってください。');return}for(let i=0;i<project.scenes.length;i++){if(stopPreview)break;const s=project.scenes[i];$('previewImg').src=s.image;$('previewCaption').textContent=s.subtitle;$('previewProgress').style.width=`${Math.round(i/project.scenes.length*100)}%`;await new Promise(resolve=>{const a=new Audio(s.audio);a.onended=resolve;a.onerror=resolve;a.play().catch(resolve)});}$('previewProgress').style.width='100%'};
function loadImage(src){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=src})}
async function audioBuffer(ctx,url){const ab=await fetch(url).then(r=>r.arrayBuffer());return await ctx.decodeAudioData(ab.slice(0))}
function wrapLines(ctx,text,maxWidth){const raw=String(text||'').replace(/\s+/g,'').split('');const lines=[];let line='';for(const ch of raw){const test=line+ch;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=ch}else line=test}if(line)lines.push(line);return lines.slice(0,4)}
function drawFrame(ctx,canvas,img,subtitle){ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);const scale=Math.max(canvas.width/img.width,canvas.height/img.height);const w=img.width*scale,h=img.height*scale;ctx.drawImage(img,(canvas.width-w)/2,(canvas.height-h)/2,w,h);ctx.font='900 42px -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';const lines=wrapLines(ctx,subtitle,canvas.width*.84);const lh=58,boxH=Math.max(78,lines.length*lh+24),y0=canvas.height-boxH-28;ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(canvas.width*.06,y0,canvas.width*.88,boxH);ctx.strokeStyle='rgba(0,0,0,.9)';ctx.lineWidth=8;ctx.fillStyle='#fff';lines.forEach((line,n)=>{const y=y0+boxH/2+(n-(lines.length-1)/2)*lh;ctx.strokeText(line,canvas.width/2,y);ctx.fillText(line,canvas.width/2,y)})}
async function wait(ms){return new Promise(r=>setTimeout(r,ms))}
$('makeVideo').onclick=async()=>{if(!project)return;syncAll();if(project.scenes.some(s=>!s.image||!s.audio)){alert('全シーンの画像と音声を作ってから動画を作成してください。');return}if(typeof MediaRecorder==='undefined'){alert('このブラウザでは動画書き出しに対応していません。');return}const btn=$('makeVideo');btn.disabled=true;$('videoStatus').textContent='字幕付き動画を作成中… 画面を閉じずにお待ちください。';$('saveLink').style.display='none';$('resultVideo').style.display='none';try{const canvas=document.createElement('canvas');canvas.width=1280;canvas.height=720;const ctx=canvas.getContext('2d');const AC=window.AudioContext||window.webkitAudioContext;const ac=new AC();await ac.resume();const dest=ac.createMediaStreamDestination();const images=[],buffers=[];for(let i=0;i<project.scenes.length;i++){images.push(await loadImage(project.scenes[i].image));buffers.push(await audioBuffer(ac,project.scenes[i].audio))}if(!canvas.captureStream)throw new Error('このブラウザでは動画書き出しに対応していません。');const vstream=canvas.captureStream(30);const stream=new MediaStream([...vstream.getVideoTracks(),...dest.stream.getAudioTracks()]);const choices=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];const mime=choices.find(x=>MediaRecorder.isTypeSupported(x))||'';const rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:6000000}:undefined);const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};const done=new Promise((resolve,reject)=>{rec.onstop=resolve;rec.onerror=e=>reject(e.error||new Error('録画エラー'))});rec.start(1000);for(let i=0;i<project.scenes.length;i++){const s=project.scenes[i],img=images[i],buf=buffers[i];drawFrame(ctx,canvas,img,s.subtitle);$('previewImg').src=s.image;$('previewCaption').textContent=s.subtitle;const src=ac.createBufferSource();src.buffer=buf;src.connect(dest);src.start();const start=performance.now(),dur=Math.max(.5,buf.duration);while(performance.now()-start<dur*1000){drawFrame(ctx,canvas,img,s.subtitle);const local=(performance.now()-start)/(dur*1000);$('previewProgress').style.width=`${Math.round(((i+Math.min(1,local))/project.scenes.length)*100)}%`;await wait(33)}await wait(150)}await wait(250);rec.stop();await done;stream.getTracks().forEach(t=>t.stop());await ac.close();const type=rec.mimeType||mime||'video/webm';const blob=new Blob(chunks,{type});const url=URL.createObjectURL(blob);const ext=type.includes('mp4')?'mp4':'webm';const video=$('resultVideo');video.src=url;video.style.display='block';const link=$('saveLink');link.href=url;link.download=`${(project.title||$('topic').value||'youtube-video').replace(/[\\/:*?"<>|]/g,'_')}.${ext}`;link.textContent=`動画を保存（${ext.toUpperCase()}）`;link.style.display='block';$('previewProgress').style.width='100%';$('videoStatus').textContent='字幕付き動画が完成しました。下の動画で確認して保存できます。'}catch(e){console.error(e);$('videoStatus').innerHTML=`<span class="danger">動画作成エラー：${esc(e.message)}</span>`}finally{btn.disabled=false}};
</script>
</body>
</html>
