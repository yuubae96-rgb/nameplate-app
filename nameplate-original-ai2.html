</div><div id="analysis" class="card hidden"><h2>2. ChatGPT 図面分析・MASTER</h2><div id="scope"></div><div id="dims"></div><div id="verify"></div></div><div id="instruction" class="card hidden"><h2>3. 社内指示内容（16項目）</h2><div id="items" class="grid"></div><div id="notes" class="notesbox hidden"></div><p><button id="batchBtn" class="btn batch">3点を同時生成</button></p><div class="note">図面に明記され確定できる材質・板厚などは自動確定。人の判断が必要な項目だけ黄色で確認します。</div></div><div id="outputsCard" class="card hidden"><h2>4. 製作用データ 3点セット</h2><div class="outputs"><div id="outAi" class="out"><b>① Illustrator製作用原稿</b><button id="svgBtn" class="btn alt">SVGを保存</button></div><div id="outProof" class="out"><b>② お客様用校正PDF</b><button id="customerPdfBtn" class="btn">校正PDFを保存・印刷</button></div><div id="outFactory" class="out"><b>③ 工場用16項目製作指示書</b><button id="factoryPdfBtn" class="btn">製作指示書を保存・印刷</button></div></div></div><div id="proofCard" class="card hidden"><h2>5. 校正用銘板原稿</h2><div class="stage"><div id="spec" class="spec"></div><br><div id="art" class="art"></div></div></div><div id="customerCard" class="card hidden"><h2>お客様用校正PDFプレビュー</h2><div class="stage"><div id="customerProof" class="proofdoc"></div></div></div><div id="sheetCard" class="card hidden"><h2>工場用16項目製作指示書</h2><div class="stage"><div id="sheet" class="sheet"></div></div></div></main><script>const U='https://emauqxftmauvsffdjvyh.supabase.co/functions/v1/read-nameplate-drawing-ai2',g=x=>document.getElementById(x),c=x=>(x==null?'':String(x).trim());let ai={},formItems=[],notesValue='',readStarted=0,readTimer=null,lastElapsed='',expectedMs=60000,lastSvg='';const esc=s=>c(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');const holes=()=>Array.isArray(ai.hole_positions)?ai.hole_positions:[];const els=()=>Array.isArray(ai.layout?.elements)?ai.layout.elements:[];const sourceItems=()=>Array.isArray(ai.work_instruction?.items)?ai.work_instruction.items:[];const choices={edition:['新版','改版','不明'],material:['SUS304','SUS430','ア =g('file').files[0];if(!f)return;loadEstimate();g('readBtn').disabled=true;readStarted=Date.now();clearInterval(readTimer);const tick=()=>{let remain=expectedMs-(Date.now()-readStarted);g('status').innerHTML=remain>0?'<span class="timer">AI読取完了予想まで　約'+fmt(remain)+'</span>':'<span class="timer">AI読取完了までもう少し…</span>'};tick();readTimer=setInterval(tick,1000);try{let d=await du(f),r=await fetch(U,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:d,type:f.type,name:f.name})}),j=await r.json();if(!r.ok||j.error)throw Error(j.error||'読取失敗');let ms=Date.now()-readStarted;saveDuration(ms);lastElapsed=fmt(ms);ai=j.result||{};show()}catch(e){lastElapsed=fmt(Date.now()-readStarted);g('status').textContent='AI読取エラー（'+lastElapsed+'）：'+e.message}finally{clearInterval(readTimer);g('readBtn').disabled=false}}function show(){let s=ai.scope||{},conf=Math.round((+s.confidence||0)*100),all=!!ai.verification?.all_verified,m=ai.master||{},geo=m.geometry||{},hh=geo.holes||{},outerOk=chk('width')&&chk('height'),holeOk=chk('hole_diameter')&&chk('hole_count'),holeText=ai.hole_count?((ai.hole_diameter_mm||'?')+'φ-'+ai.hole_count+'ヶ'):'未確定';g('scope').className=s.target_found&&conf>=80?'ok':'warn';g('scope').innerHTML='<b>完成銘板：</b>'+esc(s.description||'特定できません')+'<span class="ev">認識 '+conf+'%'+(s.boundary_evidence?' / '+esc(s.boundary_evidence):'')+'</span>';g('dims').innerHTML='<div class="'+(outerOk?'ok':'warn')+'"><b>外形：</b>'+esc((ai.width_mm||'?')+' × '+(ai.height_mm||'?')+' mm')+' '+(outerOk?'✓':'⚠ 要確認')+'</div><div class="'+(holeOk?'ok':'warn')+'"><b>穴：</b>'+esc(holeText)+' '+(holeOk?'✓':'⚠ 要確認')+'</div>'+bx('板外角',ai.radius||'不明','corner_radius',geo.corner?.evidence||'')+bx('穴位置',holes().length+'ヶ','hole_positions',holes().map(q=>'('+q.x_mm+','+q.y_mm+')').join(' '));g('verify').className=all?'ok':'warn';g('verify').innerHTML=all?'<b>MASTER確定。3つの出力はこのMASTERを共通使用します。</b>':'<b>要確認があります。</b>';buildForm();renderItems();g('batchBtn').disabled=!all;g('analysis unction saveSvg(){if(!lastSvg)lastSvg=svg();let blob=new Blob([lastSvg],{type:'image/svg+xml;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nameplate-'+(ai.width_mm||'')+'x'+(ai.height_mm||'')+'.svg';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}function printSection(id,title){let node=g(id);if(!node)return;let w=window.open('','_blank');w.document.write('<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>'+esc(title)+'</title><style>@page{size:A4 landscape;margin:10mm}body{font-family:"Yu Gothic",sans-serif;color:#111;margin:0}.proofdoc{width:100%;box-sizing:border-box}.proofdoc h2{text-align:center;margin:0 0 4mm}.proofArt{text-align:center;height:125mm}.proofArt svg{height:115mm!important;width:auto!important;max-width:150mm!important}.proofmeta{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #222;border-left:1px solid #222}.proofmeta div{padding:7px;border-right:1px solid #222;border-bottom:1px solid #222}.proofmeta b{display:block;font-size:11px}.sheetgrid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #222;border-left:1px solid #222}.sheetcell{padding:10px;border-right:1px solid #222;border-bottom:1px solid #222}.sheetcell b{display:block;font-size:12px}.sheetcell strong{font-size:20px}h2{text-align:center}</style></head><body>'+node.outerHTML+'</body></html>');w.document.close();setTimeout(()=>{w.focus();w.print()},400)}g('readBtn').onclick=read;g('batchBtn').onclick=batch;g('svgBtn').onclick=saveSvg;g('customerPdfBtn').onclick=()=>printSection('customerProof','お客様用校正PDF');g('factoryPdfBtn').onclick=()=>printSection('sheet','工場用製作指示書');</script></body></html>
