 #222}.sheetcell{min-height:74px;padding:10px;border-right:1px solid #222;border-bottom:1px solid #222}.sheetcell b{display:block;font-size:14px}.sheetcell strong{font-size:23px}.spec{display:inline-block;background:#fff;border:2px solid #17324d;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:18px;font-weight:800}.art{background:#fff;display:inline-block;padding:30px}.art svg{display:block;width:min(76vw,680px);height:auto;overflow:visible}.note{color:#657483;line-height:1.6}.timer{font-weight:800;color:#17324d}.outputs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.out{border:1px solid #cbd5df;border-radius:12px;padding:14px;background:#f8fafc}.out b{display:block;margin-bottom:8px}.out.ready{background:#eaf7ee;border-color:#77bd89}.proofdoc{background:#fff;color:#111;width:900px;max-width:100%;margin:auto;text-align:left;padding:28px;box-sizing:border-box}.proofdoc h2{text-align:center}.proofArt{text-align:center;padding:10px 0}.proofArt svg{width:auto!important;height:115mm!important;max-width:150mm!important;overflow:visible}.proofmeta{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #333;border-left:1px solid #333}.proofmeta div{padding:9px;border-right:1px solid #333;border-bottom:1px solid #333}.proofmeta b{display:block;font-size:12px}@media(max-width:600px){.grid,.outputs{grid-template-columns:1fr}.card{padding:14px}.art{padding:22px}header{font-size:18px}.proofArt svg{height:auto!important;width:90%!important}}</style></head><body><header>銘板原稿AI2　Ver.1-22・コーチ検印APPROVEDのみ描画</header><main><div class="card"><h2>1. 客先図面</h2><input id="file" type="file" accept="image/*,.pdf"><p><button id="readBtn" class="btn">ChatGPTが図面を読む</button></p><div id="status" class="note">AI2 Ver.1-22／読取エンジン Ver.13。AI担当→最終検印コーチ→必要なら差戻し→再検印。APPROVEDになるまで描画しません。</div></div><div id="analysis" class="card hidden"><h2>2. ChatGPT 図面分析・MASTER</h2><div id="scope"></div><div id="dims"></div><div id="fontResult"></div><div id="ve const U='https://emauqxftmauvsffdjvyh.supabase.co/functions/v1/read-nameplate-drawing-ai2',g=x=>document.getElementById(x),c=x=>(x==null?'':String(x).trim());let ai={},formItems=[],readStarted=0,readTimer=null,lastElapsed='',lastSvg='';const esc=s=>c(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');const holes=()=>Array.isArray(ai.hole_positions)?ai.hole_positions:[];const els=()=>Array.isArray(ai.layout?.elements)?ai.layout.elements:[];const sourceItems=()=>Array.isArray(ai.work_instruction?.items)?ai.work_instruction.items:[];const labels={material:'材質',thickness:'板厚',size:'サイズ',quantity:'数量',edition:'新版・改版',method:'製作方法',ground_color:'地色',text_color:'文字色',colors:'色数',supplied_material:'支給材',shape:'矩形・異形',corner:'R・外角',holes:'穴',hole_positions:'穴位置',processing:'加工・仕上げ',customer:'客先・品名'};const choices={edition:['新版','改版','不明'],method:['新フルカラー','新フルカラー(H)','オフセット','写真シール','ラベル印刷','文字凸加工','エッチング','アルマイト','シルク印刷','彫刻','レーザーマーキング','その他','不明'],supplied_material:['なし','あり','支給材','その他','不明']};const manual=new Set(['edition','method','supplied_material']);function du(f){return new Promise((a,b)=>{let r=new FileReader;r.onload=()=>a(r.result);r.onerror=b;r.readAsDataURL(f)})}function fmt(ms){let s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+'分'+String(s%60).padStart(2,'0')+'秒'}function explicit(v){return !!c(v)&&!/不明|要確認/i.test(c(v))}function coachApproved(){return ai.draw_permission===true&&ai.coach?.approved===true&&ai.coach?.verdict==='APPROVED'}function updateBatch(){let miss=formItems.filter(x=>x.needsHuman&&!explicit(x.value));let approved=coachApproved();g('batchBtn').disabled=!approved||miss.length>0;if(!approved){g('confirmStatus').className='stop';g('confirmStatus').innerHTML='<b>描画禁止：</b>コーチ検印がAPPROVEDではありません。原稿・SVG・校正PDFは生成できません。';return}g('confirmStatus').className=miss.length?'warn':'ok';g('confirmStatus').innerHTML=miss.length?'<b>コーチ検印APPROVED。</b> 人確認待ち：'+esc(miss.map(x=>x.label).join('、')):'<b>✓ コーチ検印APPROVED＋人確認完了。3点を生成できます。</b>'}function buildForm(){let by=Object.fromEntries(sourceItems().map(x=>[x.key,x]));formItems=Object.keys(labels).map(k=>{let x=by[k]||{key:k,label:labels[k],value:''},v=c(x.value),need=manual.has(k)||k==='quantity'||!explicit(v);return{...x,label:x.label||labels[k],value:v,aiValue:v,needsHuman:need}})}function renderItems(){g('items').innerHTML=formItems.map((x,i)=>{if(!x.needsHuman)return '<div class="item"><b>'+esc(x.label)+' ✓ 図面から確定</b><span class="value">'+esc(x.value)+'</span></div>';let done=explicit(x.value),cl='item confirm '+(done?'done':'');if(x.key==='quantity')return '<div class="'+cl+'"><b>'+esc(x.label)+(done?' ✓ 確認済み':'')+'</b><small class="hint">AI候補：'+esc(x.aiValue||'不明')+'　※必要なら修正</small><input data-i="'+i+'" value="'+esc(x.value)+'"></div>';let op=choices[x.key];if(op)return '<div class="'+cl+'"><b>'+esc(x.label)+(done?' ✓ 確認済み':'')+'</b><small class="hint">AI候補：'+esc(x.aiValue||'不明')+'</small><select data-i="'+i+'"><option value="">選択してください</option>'+op.map(v=>'<option value="'+esc(v)+'"'+(v===x.value?' selected':'')+'>'+esc(v)+'</option>').join('')+'</select></div>';return '<div class="'+cl+'"><b>'+esc(x.label)+(done?' ✓ 確認済み':'')+'</b><input data-i="'+i+'" value="'+esc(x.value)+'"></div>'}).join('');g('items').querySelectorAll('input,select').forEach(n=>{let change=()=>{let x=formItems[+n.dataset.i];x.value=c(n.value);let done=explicit(x.value),card=n.closest('.item');card.classList.toggle('done',done);card.querySelector('b').textContent=x.label+(done?' ✓ 確認済み':'');updateBatch()};n.oninput=change;n.onchange=change});updateBatch()}async function read(){let f=g('file').files[0];if(!f)return;g('readBtn').disabled=true;readStarted=Date.now();clearInterval(readTimer);const tick=()=>{let s=Math.floor((Date.now()-readStarted)/1000);g('status').innerHTML=s<45?'<span class="timer">AI担当が図面を読取中…</span>':s<90?'<span class="timer">最終検印コーチが元図面と照合中…</span>':s<140?'<span class="timer">コーチ差戻し内容を自動修正中…</span>':'<span class="timer">再検印中… 複雑図面は少し時間がかかります</span>'};tick();readTimer=setInterval(tick,1000);try{let d=await du(f),r=await fetch(U,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:d,type:f.type,name:f.name})}),j=await r.json();if(!r.ok||j.error)throw Error(j.error||'読取失敗');lastElapsed=fmt(Date.now()-readStarted);ai=j.result||{};show()}catch(e){g('status').textContent='AI読取エラー：'+e.message}finally{clearInterval(readTimer);g('readBtn').disabled=false}}function globalFont(){let v=ai.master?.visual||{},spec=c(v.global_font_spec),src=c(v.global_font_source),fam=c(v.global_family_generic);if(spec)return{spec,src:src||'specified',fam};let e=els().find(x=>x.type==='text'&&c(x.font_source)==='specified'&&c(x.font_spec));return e?{spec:c(e.font_spec),src:'specified',fam:c(e.family_generic)}:{spec:'',src:'',fam:''}}function familyName(f){return f==='rounded_gothic'?'丸ゴシック系':f==='mincho'?'明朝系':f==='gothic'?'ゴシック系':f==='serif'?'セリフ系':f==='sans'?'サンセリフ系':'判定できず'}function fontLabel(){let gf=globalFont();if(gf.spec)return gf.spec+'（図面指定）';let a=[];for(const e of els().filter(e=>e.type==='text')){let n=c(e.font_spec)||familyName(c(e.family_generic));if(e.font_height_mm)n+=' / '+e.font_height_mm+'mm';if(!a.includes(n))a.push(n)}return a.length?a.join(' ／ '):'判定できず'}function holeText(){if(ai.hole_shape==='slot')return (ai.slot_width_mm||'?')+'×'+(ai.slot_height_mm||'?')+'長穴-'+(ai.hole_count||'?')+'ヶ';return ai.hole_count?ai.hole_diameter_mm+'φ-'+ai.hole_count+'ヶ':'なし'}function show(){let s=ai.scope||{},all=!!ai.verification?.all_verified,ck=ai.verification?.checks||{},ok=k=>ck[k]!==false,co=ai.coach||{};g('scope').className=s.target_found?'ok':'warn';g('scope').innerHTML='<b>完成銘板：</b>'+esc(s.description||'特定できません');g('dims').innerHTML='<div class="'+(ok('width')&&ok('height')?'ok':'warn')+'"><b>外形：</b>'+esc((ai.width_mm||'?')+' × '+(ai.height_mm||'?')+' mm')+'</div><div class="'+(ok('hole_size')&&ok('hole_count')?'ok':'warn')+'"><b>穴：</b>'+esc(holeText())+'</div><div class="'+(ok('corner')?'ok':'warn')+'"><b>板外角：</b>'+esc(ai.radius||'不明')+'</div><div class="'+(ok('hole_positions')?'ok':'warn')+'"><b>穴位置：</b>'+esc(holes().map(q=>'('+q.x_mm+','+q.y_mm+')').join(' '))+'</div>';g('fontResult').className='ok';g('fontResult').innerHTML='<b>文字の書体：</b>'+esc(fontLabel());let mm=Array.isArray(ai.verification?.mismatches)?ai.verification.mismatches:[];g('verify').className=coachApproved()?'ok':'stop';g('verify').innerHTML=(co.retry_used?'<b>コーチ差戻し→自動修正→再検印を実施</b><br>':'')+(coachApproved()?'<b>✓ 最終検印：APPROVED</b><br>承認済みMASTERだけを描画します。':'<b>✕ 最終検印：REJECTED</b><br>描画は禁止されています。'+esc(mm.length?'<br>理由：'+mm.join('／'):''));buildForm();renderItems();g('analysis').classList.remove('hidden');g('instruction').classList.remove('hidden');g('status').textContent='AI読取＋最終検印完了：実測 '+lastElapsed}function fontInfo(e){let gf=globalFont(),spec=c(e.font_spec)||gf.spec,fam=c(e.family_generic)||gf.fam,stack='"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif';if(fam==='mincho'||fam==='serif')stack='"Yu Mincho","Hiragino Mincho ProN",serif';else if(fam==='rounded_gothic'||/丸ゴシック/.test(spec))stack='"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif';let weight=e.weight==='bold'?700:e.weight==='light'?300:400,spacing={very_tight:-.08,tight:-.04,normal:0,wide:.08,very_wide:.15}[e.char_spacing]||0;return{stack,weight,spacing}}function charUnits(t){let u=0;for(const ch of [...c(t)])u+=(ch.charCodeAt(0)<128?.56:1);return Math.max(u,1)}function fontSizeFromHeight(hh,h,e){let fs=+e.font_height_mm||hh*.86;return Math.max(h*.018,Math.min(fs,h*.14))}function scallop(x,y,w,h,r){let id='m'+Math.random().toString(36).slice(2),cut=holes().map(p=>'<circle cx="'+p.x_mm+'" cy="'+p.y_mm+'" r="'+r+'" fill="#000"/>').join('');return '<defs><mask id="'+id+'"><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="#fff"/>'+cut+'</mask></defs><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="#111" mask="url(#'+id+')"/>'}function val(k){return c(formItems.find(x=>x.key===k)?.value)}function plateColors(){let ground=val('ground_color'),text=val('text_color'),bg=/黒|black/i.test(ground)?'#111':'#f8f8f5',fg=/白|white/i.test(text)?'#fff':/黒|black/i.test(text)?'#111':bg==='#111'?'#fff':'#111';return{bg,fg}}function slot(q,bg){let sw=+ai.slot_width_mm||0,sh=+ai.slot_height_mm||0;if(ai.slot_orientation==='vertical'&&sw>sh)[sw,sh]=[sh,sw];if(ai.slot_orientation==='horizontal'&&sh>sw)[sw,sh]=[sh,sw];return '<rect x="'+(q.x_mm-sw/2)+'" y="'+(q.y_mm-sh/2)+'" width="'+sw+'" height="'+sh+'" rx="'+Math.min(sw,sh)/2+'" fill="'+bg+'" stroke="#777" stroke-width=".2"/>'}function svg(){if(!coachApproved())throw Error('コーチ検印APPROVEDなし。描画禁止');let w=+ai.width_mm,h=+ai.height_mm,rad=ai.plate?.corner_radius_none?0:(+ai.plate?.corner_radius_mm||0),elements=els(),col=plateColors(),z='<rect x="0" y="0" width="'+w+'" height="'+h+'" rx="'+rad+'" fill="'+col.bg+'" stroke="#555" stroke-width=".45"/>';for(const e of elements.filter(e=>e.type==='shape')){let x=(+e.x_pct||0)/100*w,y=(+e.y_pct||0)/100*h,ww=(+e.w_pct||0)/100*w,hh=(+e.h_pct||0)/100*h,r=+e.radius_mm||0;if(e.shape_kind==='inner_field_scalloped'&&r>0)z+=scallop(x,y,ww,hh,r);else z+='<rect x="'+x+'" y="'+y+'" width="'+ww+'" height="'+hh+'" rx="'+r+'" fill="'+(e.fill==='white'?'#fff':e.fill==='none'?'none':'#111')+'"/>'}holes().forEach(q=>z+=ai.hole_shape==='slot'?slot(q,col.bg):'<circle cx="'+q.x_mm+'" cy="'+q.y_mm+'" r="'+(+ai.hole_diameter_mm/2)+'" fill="'+col.bg+'" stroke="#777" stroke-width=".2"/>');for(const e of elements.filter(e=>e.type!=='shape')){let x=(+e.x_pct||0)/100*w,y=(+e.y_pct||0)/100*h,ww=(+e.w_pct||0)/100*w,hh=(+e.h_pct||0)/100*h;if(e.type==='text'||e.type==='logo'||e.type==='mark'){let t=c(e.text||e.label),fi=fontInfo(e),fs=fontSizeFromHeight(Math.max(hh,1.2),h,e),pad=Math.min(.5,ww*.02),cw=Math.max(.5,ww-pad*2),natural=charUnits(t)*fs,fit=natural>cw*1.02,an=e.align==='center'?'middle':e.align==='right'?'end':'start',xx=e.align==='center'?x+ww/2:e.align==='right'?x+ww-pad:x+pad,len=fit?' textLength="'+cw+'" lengthAdjust="spacingAndGlyphs"':'';z+='<text x="'+xx+'" y="'+(y+hh*.82)+'" fill="'+col.fg+'" font-size="'+fs+'" text-anchor="'+an+'" font-family="'+esc(fi.stack)+'" font-weight="'+fi.weight+'" letter-spacing="'+fi.spacing+'em"'+len+'>'+esc(t)+'</text>'}else if(e.type==='line')z+='<line x1="'+x+'" y1="'+(y+hh/2)+'" x2="'+(x+ww)+'" y2="'+(y+hh/2)+'" stroke="'+col.fg+'" stroke-width=".25"/>';else if(e.type==='box')z+='<rect x="'+x+'" y="'+y+'" width="'+ww+'" height="'+hh+'" fill="none" stroke="'+col.fg+'" stroke-width=".25"/>'}return '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'mm" height="'+h+'mm" viewBox="-6 -6 '+(w+12)+' '+(h+12)+'">'+z+'</svg>'}function buildFactory(){g('sheet').innerHTML='<h2>社内製作指示書（16項目）</h2><div class="sheetgrid">'+formItems.map(x=>'<div class="sheetcell"><b>'+esc(x.label)+'</b><strong>'+esc(x.value)+'</strong></div>').join('')+'</div>'}function buildCustomer(){g('customerProof').innerHTML='<h2>校正をお願い致します。</h2><div class="proofArt">'+lastSvg+'</div><div class="proofmeta"><div><b>サイズ</b>'+esc(val('size'))+'</div><div><b>材質</b>'+esc(val('material'))+'</div><div><b>板厚</b>'+esc(val('thickness'))+'</div><div><b>数量</b>'+esc(val('quantity'))+'</div><div><b>穴</b>'+esc(val('holes'))+'</div><div><b>新版・改版</b>'+esc(val('edition'))+'</div></div>'}function batch(){if(!coachApproved()){alert('コーチ検印APPROVEDがないため描画できません。');return}let miss=formItems.filter(x=>x.needsHuman&&!explicit(x.value)).map(x=>x.label);if(miss.length){alert('未確認：'+miss.join('、'));return}lastSvg=svg();g('spec').textContent=ai.width_mm+' × '+ai.height_mm+' mm　｜　'+holeText()+'　｜　'+ai.radius;g('art').innerHTML=lastSvg;buildFactory();buildCustomer();['outAi','outProof','outFactory'].forEach(x=>g(x).classList.add('ready'));['outputsCard','proofCard','customerCard','sheetCard'].forEach(x=>g(x).classList.remove('hidden'))}function saveSvg(){if(!coachApproved()){alert('コーチ検印APPROVEDがないためSVG保存できません。');return}let blob=new Blob([lastSvg||svg()],{type:'image/svg+xml;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nameplate-'+ai.width_mm+'x'+ai.height_mm+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function printSection(id,title){if(!coachApproved()){alert('コーチ検印APPROVEDがないため出力できません。');return}let node=g(id),w=window.open('','_blank');w.document.write('<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>'+esc(title)+'</title><style>@page{size:A4 landscape;margin:10mm}body{font-family:"Yu Gothic",sans-serif}.proofdoc{width:100%}.proofdoc h2{text-align:center}.proofArt{text-align:center;height:125mm}.proofArt svg{height:115mm!important;width:auto!important}.proofmeta,.sheetgrid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #222;border-left:1px solid #222}.proofmeta div,.sheetcell{padding:8px;border-right:1px solid #222;border-bottom:1px solid #222}</style></head><body>'+node.outerHTML+'</body></html>');w.document.close();setTimeout(()=>w.print(),400)}g('readBtn').onclick=read;g('batchBtn').onclick=batch;g('svgBtn').onclick=saveSvg;g('customerPdfBtn').onclick=()=>printSection('customerProof','お客様用校正PDF');g('factoryPdfBtn').onclick=()=>printSection('sheet','工場用製作指示書');
