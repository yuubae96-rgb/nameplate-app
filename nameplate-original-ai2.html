<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><meta http-equiv="Pragma" content="no-cache"><title>銘板原稿AI2｜Ver.1-2</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;margin:0;background:#f3f5f7;color:#172231}header{background:#17324d;color:#fff;padding:20px;font-size:20px;font-weight:800}main{max-width:980px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px}.hidden{display:none}.btn{border:0;border-radius:10px;padding:14px 18px;font-size:17px;font-weight:800;color:#fff;background:#17324d}.btn:disabled{background:#9ba6b0}.ok,.warn{padding:13px;border-radius:10px;margin:9px 0}.ok{background:#eaf7ee;border:1px solid #77bd89}.warn{background:#fff3a6;border:2px solid #e0a800}.ev{display:block;font-size:12px;color:#657483;margin-top:5px;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{border:1px solid #d7dde3;border-radius:11px;padding:13px;background:#fff}.item.editable{background:#fff3a6;border:2px solid #e0a800}.item b{display:block;font-size:13px;color:#536273;margin-bottom:7px}.item span{font-size:20px;font-weight:800}.item select{width:100%;font-size:20px;font-weight:800;padding:10px 36px 10px 10px;border-radius:9px;border:1px solid #b79000;background:#fff;color:#172231}.stage{text-align:center;background:#eef1f4;padding:20px;border-radius:12px;overflow:auto}.sheet{background:#fff;border:2px solid #172231;padding:18px;text-align:left;min-width:760px}.sheet h2{text-align:center;margin:0 0 14px}.sheetgrid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #222;border-left:1px solid #222}.sheetcell{min-height:74px;padding:10px;border-right:1px solid #222;border-bottom:1px solid #222;overflow-wrap:anywhere}.sheetcell b{display:block;font-size:14px}.sheetcell strong{font-size:23px}.spec{display:inline-block;background:#fff;border:2px solid #17324d;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:18px;font-weight:800}.art{background:#fff;display:inline-block;padding:26px}.art svg{display:block;width:min(76vw,680px);height:auto;overflow:visible}.note{color:#657483;line-height:1.6}.timer{font-weight:800;color:#17324d}@media(max-width:600px){.grid{grid-template-columns:1fr}.card{padding:14px}.art{padding:22px}header{font-size:18px}}</style></head><body><header>銘板原稿AI2　Ver.1-2・ChatGPT人間読み方式</header><main><div class="card"><h2>1. 客先図面</h2><input id="file" type="file" accept="image/*,.pdf"><p><button id="readBtn" class="btn">ChatGPTが図面を読む</button></p><div id="status" class="note">AI2 Ver.1-2。図面全体を理解し、MASTERから社内製作指示書・校正原稿まで共通生成します。</div></div><div id="analysis" class="card hidden"><h2>2. ChatGPT 図面分析・MASTER</h2><div id="scope"></div><div id="dims"></div><div id="verify"></div></div><div id="instruction" class="card hidden"><h2>3. 社内指示内容（16項目）</h2><div id="items" class="grid"></div><p><button id="sheetBtn" class="btn">4. 社内製作指示書（16項目）を作る</button></p></div><div id="sheetCard" class="card hidden"><h2>4. 社内製作指示書（16項目）</h2><div class="stage"><div id="sheet" class="sheet"></div></div><p><button id="proofBtn" class="btn" disabled>5. 校正用銘板原稿を見る</button></p></div><div id="proofCard" class="card hidden"><h2>5. 校正用銘板原稿</h2><div class="stage"><div id="spec" class="spec"></div><br><div id="art" class="art"></div></div></div></main><script>const U='https://emauqxftmauvsffdjvyh.supabase.co/functions/v1/read-nameplate-drawing-ai2',g=x=>document.getElementById(x),c=x=>(x==null?'':String(x).trim());let ai={},readStarted=0,readTimer=null,lastElapsed='';const esc=s=>c(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');const holes=()=>Array.isArray(ai.hole_positions)?ai.hole_positions:[];const els=()=>Array.isArray(ai.layout?.elements)?ai.layout.elements:[];const wi=()=>Array.isArray(ai.work_instruction?.items)?ai.work_instruction.items:[];const choices={material:['','SUS304','SUS430','アルミ','鉄','真鍮','銅','アクリル','その他'],thickness:['','0.3mm','0.5mm','0.8mm','1mm','1.2mm','1.5mm','2mm','3mm','その他'],quantity:['','1枚','2枚','3枚','5枚','10枚','その他'],method:['','文字凸加工','エッチング','アルマイト','シルク印刷','彫刻','レーザーマーキング','その他'],ground_color:['','黒','白','SUS地色','アルミ地色','赤','青','黄','緑','その他'],text_color:['','白','黒','地色','赤','青','黄','緑','その他'],colors:['','1色','2色','3色','多色','その他'],supplied_material:['','なし','あり','支給材','その他'],shape:['','矩形','矩形・Rなし・4穴','角丸矩形','異形','その他'],corner:['','Rなし','R1','R2','R3','R5','R8','その他']};function du(f){return new Promise((a,b)=>{let r=new FileReader;r.onload=()=>a(r.result);r.onerror=b;r.readAsDataURL(f)})}function chk(k){return !!ai.verification?.checks?.[k]}function bx(l,v,k,e=''){return '<div class="'+(chk(k)?'ok':'warn')+'"><b>'+esc(l)+'：</b>'+esc(v)+' '+(chk(k)?'✓':'⚠ 要確認')+(e?'<span class="ev">'+esc(e)+'</span>':'')+'</div>'}function fmtElapsed(ms){let s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/60)+'分'+String(s%60).padStart(2,'0')+'秒'}function renderItems(){g('items').innerHTML=wi().map((x,i)=>{let opts=choices[x.key];if(!opts)return '<div class="item '+(!x.verified?'warn':'')+'"><b>'+esc(x.label)+'</b><span>'+esc(x.value||'')+'</span></div>';let cur=c(x.value),vals=[...opts];if(cur&&!vals.includes(cur))vals.splice(1,0,cur);return '<div class="item editable"><b>'+esc(x.label)+' ▼</b><select data-i="'+i+'">'+vals.map(v=>'<option value="'+esc(v)+'"'+(v===cur?' selected':'')+'>'+esc(v||'未選択')+'</option>').join('')+'</select></div>'}).join('');g('items').querySelectorAll('select').forEach(s=>s.onchange=()=>{let i=+s.dataset.i;if(wi()[i])wi()[i].value=s.value})}async function read(){let f=g('file').files[0];if(!f)return;g('readBtn').disabled=true;readStarted=Date.now();clearInterval(readTimer);const tick=()=>g('status').innerHTML='<span class="timer">AI読取中… '+fmtElapsed(Date.now()-readStarted)+'</span>';tick();readTimer=setInterval(tick,1000);try{let d=await du(f),r=await fetch(U,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:d,type:f.type,name:f.name})}),j=await r.json();if(!r.ok||j.error)throw Error(j.error||'読取失敗');ai=j.result||{};lastElapsed=fmtElapsed(Date.now()-readStarted);show()}catch(e){lastElapsed=fmtElapsed(Date.now()-readStarted);g('status').textContent='AI読取エラー（'+lastElapsed+'）：'+e.message}finally{clearInterval(readTimer);g('readBtn').disabled=false}}function show(){let s=ai.scope||{},conf=Math.round((+s.confidence||0)*100),all=!!ai.verification?.all_verified,m=ai.master||{},geo=m.geometry||{},hh=geo.holes||{};g('scope').className=s.target_found&&conf>=80?'ok':'warn';g('scope').innerHTML='<b>完成銘板：</b>'+esc(s.description||'特定できません')+'<span class="ev">認識 '+conf+'%'+(s.boundary_evidence?' / '+esc(s.boundary_evidence):'')+'</span>';let outerOk=chk('width')&&chk('height'),holeOk=chk('hole_diameter')&&chk('hole_count');let holeText=ai.hole_count?((ai.hole_diameter_mm||'?')+'φ-'+ai.hole_count+'ヶ'):'未確定';g('dims').innerHTML='<div class="'+(outerOk?'ok':'warn')+'"><b>外形：</b>'+esc((ai.width_mm||'?')+' × '+(ai.height_mm||'?')+' mm')+' '+(outerOk?'✓':'⚠ 要確認')+'<span class="ev">幅：'+esc(geo.width_evidence||'')+' / 高さ：'+esc(geo.height_evidence||'')+'</span></div>'+'<div class="'+(holeOk?'ok':'warn')+'"><b>穴：</b>'+esc(holeText)+' '+(holeOk?'✓':'⚠ 要確認')+'<span class="ev">'+esc(hh.evidence||hh.callout_raw||'')+'</span></div>'+bx('板外角',ai.radius||'不明','corner_radius',geo.corner?.evidence||'')+bx('穴位置',holes().length+'ヶ','hole_positions',holes().map(q=>'('+q.x_mm+','+q.y_mm+')').join(' '));let issues=[...(ai.verification?.audit_issues||[]),...(ai.verification?.mismatches||[])];g('verify').className=all?'ok':'warn';g('verify').innerHTML=all?'<b>MASTER確定。3・4・5はこのMASTERをそのまま共通使用します。</b>':'<b>要確認があります。5は止めています。</b>'+(issues.length?'<span class="ev">'+issues.map(esc).join(' / ')+'</span>':'');renderItems();g('proofBtn').disabled=!all;g('analysis').classList.remove('hidden');g('instruction').classList.remove('hidden');g('status').textContent='AI読取完了：'+lastElapsed+'。'+(all?'MASTER確定。':'要確認項目があります。')}function sheet(){let a=wi();g('sheet').innerHTML='<h2>社内製作指示書（16項目）</h2><div class="sheetgrid">'+a.map(x=>'<div class="sheetcell"><b>'+esc(x.label)+'</b><strong>'+esc(x.value||'')+'</strong></div>').join('')+'</div>';g('sheetCard').classList.remove('hidden');g('sheetCard').scrollIntoView({behavior:'smooth'})}function fit(t,w,m){let n=[...c(t)].length||1;return Math.max(1.8,Math.min(m,w/n))}function svg(){let w=+ai.width_mm,h=+ai.height_mm,bg=/black|黒/i.test(c(ai.ground_color))?'#111':'#fff',fg=bg==='#111'?'#fff':'#111',rad=ai.plate?.corner_radius_none?0:(+ai.plate?.corner_radius_mm||0),z='<rect x="0" y="0" width="'+w+'" height="'+h+'" rx="'+rad+'" fill="'+bg+'" stroke="#666" stroke-width=".5"/>';holes().forEach(q=>z+='<circle cx="'+q.x_mm+'" cy="'+q.y_mm+'" r="'+(+ai.hole_diameter_mm/2)+'" fill="#fff" stroke="#777" stroke-width=".2"/>');els().forEach(e=>{let x=(+e.x_pct||0)/100*w,y=(+e.y_pct||0)/100*h,ww=(+e.w_pct||0)/100*w,hh=(+e.h_pct||0)/100*h;if(e.type==='text'){let t=c(e.text)||[e.label,e.value].filter(Boolean).join('　'),an=e.align==='center'?'middle':e.align==='right'?'end':'start',xx=e.align==='center'?x+ww/2:e.align==='right'?x+ww:x;z+='<text x="'+xx+'" y="'+(y+hh*.72)+'" fill="'+fg+'" font-size="'+fit(t,Math.max(ww,8),Math.max(hh*.8,h*.018))+'" text-anchor="'+an+'" font-family="Yu Gothic,Arial">'+esc(t)+'</text>'}else if(e.type==='line')z+='<line x1="'+x+'" y1="'+(y+hh/2)+'" x2="'+(x+ww)+'" y2="'+(y+hh/2)+'" stroke="'+fg+'" stroke-width=".35"/>';else if(e.type==='box')z+='<rect x="'+x+'" y="'+y+'" width="'+ww+'" height="'+hh+'" rx="'+(e.radius_mm||0)+'" fill="none" stroke="'+fg+'" stroke-width=".35"/>'});return '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'mm" height="'+h+'mm" viewBox="-5 -5 '+(w+10)+' '+(h+10)+'" overflow="visible">'+z+'</svg>'}function proof(){if(!ai.verification?.all_verified)return;g('spec').textContent=ai.width_mm+' × '+ai.height_mm+' mm　｜　'+(ai.hole_count?ai.hole_diameter_mm+'φ-'+ai.hole_count+'ヶ':'穴なし')+'　｜　'+ai.radius;g('art').innerHTML=svg();g('proofCard').classList.remove('hidden');g('proofCard').scrollIntoView({behavior:'smooth'})}g('readBtn').onclick=read;g('sheetBtn').onclick=sheet;g('proofBtn').onclick=proof;</script></body></html>
