ction" class="card hidden"><h2>3. 社内指示内容（16項目）</h2><div id="items" class="grid"></div><p><button id="batchBtn" class="btn batch">3点を同時生成</button></p><div class="note">図面から確定できる項目は自動確定。判断が残る項目だけ黄色で確認します。</div></div><div id="outputsCard" class="card hidden"><h2>4. 製作用データ 3点セット</h2><div class="outputs"><div id="outAi" class="out"><b>① Illustrator製作用原稿</b><button id="svgBtn" class="btn alt">SVGを保存</button></div><div id="outProof" class="out"><b>② お客様用校正PDF</b><button id="customerPdfBtn" class="btn">校正PDFを保存・印刷</button></div><div id="outFactory" class="out"><b>③ 工場用16項目製作指示書</b><button id="factoryPdfBtn" class="btn">製作指示書を保存・印刷</button></div></div></div><div id="proofCard" class="card hidden"><h2>5. 校正用銘板原稿</h2><div class="stage"><div id="spec" class="spec"></div><br><div id="art" class="art"></div></div></div><div id="customerCard" class="card hidden"><h2>お客様用校正PDFプレビュー</h2><div class="stage"><div id="customerProof" class="proofdoc"></div></div></div><div id="sheetCard" class="card hidden"><h2>工場用16項目製作指示書</h2><div class="stage"><div id="sheet" class="sheet"></div></div></div></main><script>const U='https://emauqxftmauvsffdjvyh.supabase.co/functions/v1/read-nameplate-drawing-ai2',g=x=>document.getElementById(x),c=x=>(x==null?'':String(x).trim());let ai={},formItems=[],readStarted=0,readTimer=null,lastElapsed='',lastSvg='';const esc=s=>c(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');const holes=()=>Array.isArray(ai.hole_positions)?ai.hole_positions:[];const els=()=>Array.isArray(ai.layout?.elements)?ai.layout.elements:[];const sourceItems=()=>Array.isArray(ai.work_instruction?.items)?ai.work_instruction.items:[];const labels={material:'材質',thickness:'板厚',size:'サイズ',quantity:'数量',edition:'新版・改版',method:'製作方法',ground_color:'地色',text_color:'文字色',colors:'色数',supplied_material:'支給材',shape:'矩形・異形',corner:'R・外角',holes:'穴',hole_positions:'穴位置',processing:'加工・仕上げ',customer:'客先・品名'};const choices={edition:['新版','改版','不明'],method:['新フルカラー','新フルカラー(H)','オフセット','写真シール','ラベル印刷','文字凸加工','エッチング','アルマイト','シルク印刷','彫刻','レーザーマーキング','その他','不明'],supplied_material:['なし','あり','支給材','その他','不明']};const manual=new Set(['edition','method','supplied_material']);function du(f){return new Promise((a,b)=>{let r=new FileReader;r.onload=()=>a(r.result);r.onerror=b;r.readAsDataURL(f)})}function fmt(ms){let s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+'分'+String(s%60).padStart(2,'0')+'秒'}function explicit(v){return !!c(v)&&!/不明|要確認/i.test(c(v))}function buildForm(){let by=Object.fromEntries(sourceItems().map(x=>[x.key,x]));formItems=Object.keys(labels).map(k=>{let x=by[k]||{key:k,label:labels[k],value:''},v=c(x.value),need=manual.has(k)||k==='quantity'||!explicit(v);return{...x,label:x.label||labels[k],value:v,aiValue:v,needsHuman:need,confirmed:!need}})}function renderItems(){g('items').innerHTML=formItems.map((x,i)=>{if(!x.needsHuman)return '<div class="item"><b>'+esc(x.label)+' ✓ 図面から確定</b><span class="value">'+esc(x.value)+'</span></div>';if(x.key==='quantity')return '<div class="item confirm '+(explicit(x.value)?'done':'')+'" data-card="'+i+'"><b>'+esc(x.label)+'</b><small class="hint">AI候補：'+esc(x.aiValue||'不明')+'　※任意入力</small><input data-i="'+i+'" inputmode="numeric" value="'+esc(x.value)+'" placeholder="例：10枚 / 125枚"></div>';let op=choices[x.key];if(op)return '<div class="item confirm" data-card="'+i+'"><b>'+esc(x.label)+' ▼</b><small class="hint">AI候補：'+esc(x.aiValue||'不明')+'</small><select data-i="'+i+'"><option value="" selected disabled>選択してください</option>'+op.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('')+'</select></div>';return '<div class="item confirm '+(explicit(x.value)?'done':'')+'" data-card="'+i+'"><b>'+esc(x.label)+'</b><input data-i="'+i+'" value="'+esc(x.value)+'"></div>'}).join('');g('items').querySelectorAll('select').forEach(s=>s.onchange=()=>{let x=formItems[+s.dataset.i];x.value=s.value;x.confirmed=true;s.closest('.item').classList.add('done')});g('items').querySelectorAll('input').forEach(s=>s.oninput=()=>{let x=formItems[+s.dataset.i];x.value=c(s.value);x.confirmed=explicit(x.value);s.closest('.item').classList.toggle('done',x.confirmed)})}async function read(){let f=g('file').files[0];if(!f)return;g('readBtn').disabled=true;readStarted=Date.now();clearInterval(readTimer);const tick=()=>{let r=40000-(Date.now()-readStarted);g('status').innerHTML=r>0?'<span class="timer">AI読取完了予想まで　約'+fmt(r)+'</span>':'<span class="timer">出力中</span>'};tick();readTimer=setInterval(tick,1000);try{let d=await du(f),r=await fetch(U,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:d,type:f.type,name:f.name})}),j=await r.json();if(!r.ok||j.error)throw Error(j.error||'読取失敗');lastElapsed=fmt(Date.now()-readStarted);ai=j.result||{};show()}catch(e){g('status').textContent='AI読取エラー：'+e.message}finally{clearInterval(readTimer);g('readBtn').disabled=false}}function globalFont(){let v=ai.master?.visual||{},spec=c(v.global_font_spec),src=c(v.global_font_source),fam=c(v.global_family_generic);if(spec)return{spec,src:src||'specified',fam};let e=els().find(x=>x.type==='text'&&c(x.font_source)==='specified'&&c(x.font_spec));return e?{spec:c(e.font_spec),src:'specified',fam:c(e.family_generic)}:{spec:'',src:'',fam:''}}function familyName(f){return f==='rounded_gothic'?'丸ゴシック系':f==='mincho'?'明朝系':f==='gothic'?'ゴシック系':f==='serif'?'セリフ系':f==='sans'?'サンセリフ系':'判定できず'}function fontLabel(){let gf=globalFont();if(gf.spec)return gf.spec+'（図面指定）';let a=[];for(const e of els().filter(e=>e.type==='text')){let n=c(e.font_spec)||familyName(c(e.family_generic)),s=c(e.font_source)==='visual'?'（字形から判定）':'';let v=n+s;if(!a.includes(v))a.push(v)}return a.length?a.join(' ／ '):'判定できず'}function show(){let s=ai.scope||{},all=!!ai.verification?.all_verified;g('scope').className=s.target_found?'ok':'warn';g('scope').innerHTML='<b>完成銘板：</b>'+esc(s.description||'特定できません');g('dims').innerHTML='<div class="'+(all?'ok':'warn')+'"><b>外形：</b>'+esc((ai.width_mm||'?')+' × '+(ai.height_mm||'?')+' mm')+'</div><div class="'+(all?'ok':'warn')+'"><b>穴：</b>'+esc(ai.hole_count?ai.hole_diameter_mm+'φ-'+ai.hole_count+'ヶ':'なし')+'</div><div class="'+(all?'ok':'warn')+'"><b>板外角：</b>'+esc(ai.radius||'不明')+'</div><div class="'+(all?'ok':'warn')+'"><b>穴位置：</b>'+esc(holes().map(q=>'('+q.x_mm+','+q.y_mm+')').join(' '))+'</div>';g('fontResult').className='ok';g('fontResult').innerHTML='<b>文字の書体：</b>'+esc(fontLabel());g('verify').className=all?'ok':'warn';g('verify').innerHTML=all?'<b>MASTER確定。</b>':'<b>要確認があります。</b>';buildForm();renderItems();g('batchBtn').disabled=!all;g('analysis').classList.remove('hidden');g('instruction').classList.remove('hidden');g('status').textContent='AI読取完了：実測 '+lastElapsed}function fontInfo(e){let gf=globalFont(),spec=c(e.font_spec)||gf.spec,fam=c(e.family_generic)||gf.fam,stack='"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif';if(fam==='mincho'||fam==='serif')stack='"Yu Mincho","Hiragino Mincho ProN",serif';else if(fam==='rounded_gothic'||/丸ゴシック/.test(spec))stack='"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif';if(spec&&c(e.font_source||gf.src)==='specified')stack='"'+spec.replace(/["']/g,'')+'",'+stack;let weight=e.weight==='bold'?700:e.weight==='light'?300:400,spacing={very_tight:-.08,tight:-.04,normal:0,wide:.08,very_wide:.15}[e.char_spacing]||0;return{stack,weight,spacing}}function charUnits(t){let u=0;for(const ch of [...c(t)])u+=(ch.charCodeAt(0)<128?.56:1);return Math.max(u,1)}function fontSizeFromHeight(hh,h){let fs=hh*.86;return Math.max(h*.026,Math.min(fs,h*.12))}function scallop(x,y,w,h,r){let id='m'+Math.random().toString(36).slice(2),cut=holes().map(p=>'<circle cx="'+p.x_mm+'" cy="'+p.y_mm+'" r="'+r+'" fill="#000"/>').join('');return '<defs><mask id="'+id+'"><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="#fff"/>'+cut+'</mask></defs><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="#111" mask="url(#'+id+')"/>'}function val(k){return c(formItems.find(x=>x.key===k)?.value)}function svg(){let w=+ai.width_mm,h=+ai.height_mm,rad=ai.plate?.corner_radius_none?0:(+ai.plate?.corner_radius_mm||0),elements=els(),fg='#fff',z='<rect x="0" y="0" width="'+w+'" height="'+h+'" rx="'+rad+'" fill="#f8f8f5" stroke="#555" stroke-width=".45"/>';for(const e of elements.filter(e=>e.type==='shape')){let x=(+e.x_pct||0)/100*w,y=(+e.y_pct||0)/100*h,ww=(+e.w_pct||0)/100*w,hh=(+e.h_pct||0)/100*h,r=+e.radius_mm||0;if(e.shape_kind==='inner_field_scalloped'&&r>0)z+=scallop(x,y,ww,hh,r);else z+='<rect x="'+x+'" y="'+y+'" width="'+ww+'" height="'+hh+'" rx="'+r+'" fill="'+(e.fill==='white'?'#fff':e.fill==='none'?'none':'#111')+'"/>'}holes().forEach(q=>z+='<circle cx="'+q.x_mm+'" cy="'+q.y_mm+'" r="'+(+ai.hole_diameter_mm/2)+'" fill="#fff" stroke="#777" stroke-width=".2"/>');let clipN=0;for(const e of elements.filter(e=>e.type!=='shape')){let x=(+e.x_pct||0)/100*w,y=(+e.y_pct||0)/100*h,ww=(+e.w_pct||0)/100*w,hh=(+e.h_pct||0)/100*h;if(e.type==='text'){let t=c(e.text),fi=fontInfo(e),fs=fontSizeFromHeight(Math.max(hh,2),h),pad=Math.min(.8,ww*.025),cw=Math.max(.5,ww-pad*2),natural=charUnits(t)*fs*(1+Math.max(0,fi.spacing)),fitNeeded=natural>cw*1.02,an=e.align==='center'?'middle':e.align==='right'?'end':'start',xx=e.align==='center'?x+ww/2:e.align==='right'?x+ww-pad:x+pad,id='tc'+(++clipN),len=fitNeeded?' textLength="'+cw+'" lengthAdjust="spacingAndGlyphs"':'';z+='<defs><clipPath id="'+id+'"><rect x="'+x+'" y="'+(y-.4)+'" width="'+ww+'" height="'+(hh+1)+'"/></clipPath></defs><text x="'+xx+'" y="'+(y+hh*.84)+'" fill="'+fg+'" font-size="'+fs+'" text-anchor="'+an+'" font-family="'+esc(fi.stack)+'" font-weight="'+fi.weight+'" letter-spacing="'+fi.spacing+'em"'+len+' clip-path="url(#'+id+')">'+esc(t)+'</text>'}else if(e.type==='line')z+='<line x1="'+x+'" y1="'+(y+hh/2)+'" x2="'+(x+ww)+'" y2="'+(y+hh/2)+'" stroke="'+fg+'" stroke-width=".32"/>';else if(e.type==='box')z+='<rect x="'+x+'" y="'+y+'" width="'+ww+'" height="'+hh+'" fill="none" stroke="'+fg+'" stroke-width=".32"/>'}return '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'mm" height="'+h+'mm" viewBox="-6 -6 '+(w+12)+' '+(h+12)+'">'+z+'</svg>'}function buildFactory(){g('sheet').innerHTML='<h2>社内製作指示書（16項目）</h2><div class="sheetgrid">'+formItems.map(x=>'<div class="sheetcell"><b>'+esc(x.label)+'</b><strong>'+esc(x.value)+'</strong></div>').join('')+'</div>'}function buildCustomer(){g('customerProof').innerHTML='<h2>校正をお願い致します。</h2><div class="proofArt">'+lastSvg+'</div><div class="proofmeta"><div><b>サイズ</b>'+esc(val('size'))+'</div><div><b>材質</b>'+esc(val('material'))+'</div><div><b>板厚</b>'+esc(val('thickness'))+'</div><div><b>数量</b>'+esc(val('quantity'))+'</div><div><b>穴</b>'+esc(val('holes'))+'</div><div><b>新版・改版</b>'+esc(val('edition'))+'</div></div>'}function batch(){if(!ai.verification?.all_verified)return;let miss=formItems.filter(x=>x.needsHuman&&!explicit(x.value)).map(x=>x.label);if(miss.length){alert('未確認：'+miss.join('、'));return}lastSvg=svg();g('spec').textContent=ai.width_mm+' × '+ai.height_mm+' mm　｜　'+(ai.hole_count?ai.hole_diameter_mm+'φ-'+ai.hole_count+'ヶ':'穴なし')+'　｜　'+ai.radius;g('art').innerHTML=lastSvg;buildFactory();buildCustomer();['outAi','outProof','outFactory'].forEach(x=>g(x).classList.add('ready'));['outputsCard','proofCard','customerCard','sheetCard'].forEach(x=>g(x).classList.remove('hidden'))}function saveSvg(){let blob=new Blob([lastSvg||svg()],{type:'image/svg+xml;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nameplate-'+ai.width_mm+'x'+ai.height_mm+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function printSection(id,title){let node=g(id),w=window.open('','_blank');w.document.write('<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>'+esc(title)+'</title><style>@page{size:A4 landscape;margin:10mm}body{font-family:"Yu Gothic",sans-serif}.proofdoc{width:100%}.proofdoc h2{text-align:center}.proofArt{text-align:center;height:125mm}.proofArt svg{height:115mm!important
