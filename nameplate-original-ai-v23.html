<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>銘板原稿AI｜テスト版23</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;margin:0;background:#f3f5f7;color:#172231}header{background:#17324d;color:#fff;padding:18px}main{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px}.hidden{display:none}.btn{border:0;border-radius:9px;padding:13px 18px;font-size:16px;font-weight:800;color:#fff;background:#17324d}.stage{text-align:center;background:#eef1f4;padding:20px;border-radius:12px;overflow:auto}.spec{display:inline-block;background:#fff;border:2px solid #17324d;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:18px;font-weight:800}.spec small{display:block;color:#657483;font-size:12px;margin-top:4px}.art{background:#fff;display:inline-block;padding:16px}.art svg{display:block;width:min(80vw,680px);height:auto}.note{color:#657483;line-height:1.6}.readback{background:#f7f9fb;padding:14px;border-radius:10px;line-height:1.8}</style></head><body><header><b>銘板原稿AI　テスト版23・製作寸法表示</b></header><main><div class="card"><h2>1. 客先図面</h2><input id="file" type="file" accept="image/*,.pdf"><p><button class="btn" id="readBtn">ChatGPTのように図面を読む</button></p><div id="status" class="note">元PDF推奨。完成銘板と製作寸法を読みます。</div></div><div class="card hidden" id="readCard"><h2>2. AIが理解した完成銘板</h2><div id="readback" class="readback"></div><p><button class="btn" id="proofBtn">3. 校正図面を作る</button></p></div><div class="card hidden" id="proofCard"><h2>3. 校正用銘板原稿</h2><div class="stage"><div id="specBox" class="spec"></div><br><div id="proofArt" class="art"></div></div><div id="proofStatus" class="note"></div></div></main><script>const U='https://emauqxftmauvsffdjvyh.supabase.co/functions/v1/read-nameplate-drawing',g=x=>document.getElementById(x),c=x=>(x==null?'':String(x).trim());let ai={};function du(f){return new Promise((a,b)=>{let r=new FileReader;r.onload=()=>a(r.result);r.onerror=b;r.readAsDataURL(f)})}function esc(s){return c(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function rows(){return Array.isArray(ai.layout?.rows)?ai.layout.rows:[]}function holes(){return Array.isArray(ai.hole_positions)?ai.hole_positions.filter(q=>isFinite(+q.x_mm)&&isFinite(+q.y_mm)):[]}function spec(){let a=[];if(ai.width_mm&&ai.height_mm)a.push(ai.width_mm+' × '+ai.height_mm+' mm');if(ai.hole_diameter_mm&&ai.hole_count)a.push(ai.hole_diameter_mm+'φ-'+ai.hole_count+'ヶ');if(c(ai.radius))a.push(ai.radius);return a.join('　｜　')||'製作寸法 要確認'}async function read(){let f=g('file').files[0];if(!f)return;g('status').textContent='図面全体を理解中…';let d=await du(f),r=await fetch(U,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:d,type:f.type,name:f.name})}),j=await r.json();if(!r.ok||j.error){g('status').textContent='エラー：'+(j.error||'読取失敗');return}ai=j.result||{};let lines=rows().map(x=>esc(x.text||[x.label,x.value].filter(Boolean).join('　'))).filter(Boolean);g('readback').innerHTML='<b>外形：</b>'+esc(ai.width_mm||'?')+' × '+esc(ai.height_mm||'?')+' mm　<b>R：</b>'+esc(ai.radius||'不明')+'<br><b>穴：</b>'+esc(ai.hole_diameter_mm||'?')+'φ × '+esc(ai.hole_count||'?')+'ヶ　座標確定 '+holes().length+'ヶ<hr><b>完成銘板に入る文字</b><br>'+lines.join('<br>');g('readCard').classList.remove('hidden');g('status').textContent='読取完了。製作寸法を確認してください。'}function fit(t,maxW,maxFs){let n=[...c(t)].reduce((s,ch)=>s+(/[ -~]/.test(ch)?.55:1),0)||1;return Math.max(1.7,Math.min(maxFs,maxW/(n*.92)))}function build(){let w=+ai.width_mm||100,h=+ai.height_mm||50,bg=/黒/.test(c(ai.ground_color))?'#111':'#fff',fg=bg==='#111'?'#fff':'#111',rad=Math.max(0,+ai.plate?.corner_radius_mm||0),s='<rect x=".25" y=".25" width="'+(w-.5)+'" height="'+(h-.5)+'" rx="'+rad+'" fill="'+bg+'" stroke="#555" stroke-width=".5"/>';let hs=holes(),d=+ai.hole_diameter_mm||0;hs.forEach(q=>s+='<circle cx="'+q.x_mm+'" cy="'+q.y_mm+'" r="'+d/2+'" fill="#fff"/>');let rr=rows(),n=rr.length;if(n){let left=w*.07,right=w*.93,top=h*.18,bottom=h*.82,step=(bottom-top)/n,two=(ai.layout?.columns||1)===2;rr.forEach((r,i)=>{let y=top+step*(i+.5),maxFs=Math.min(step*.58,h*.055);if(two&&(c(r.label)||c(r.value))){let lx=left,vx=left+(right-left)*.29,lf=fit(r.label,(right-left)*.25,maxFs),vf=fit(r.value,right-vx,maxFs);s+='<text x="'+lx+'" y="'+y+'" fill="'+fg+'" font-size="'+lf+'" font-family="Yu Gothic,Arial" dominant-baseline="middle">'+esc(r.label)+'</text><text x="'+vx+'" y="'+y+'" fill="'+fg+'" font-size="'+vf+'" font-family="Yu Gothic,Arial" dominant-baseline="middle">'+esc(r.value)+'</text>'}else{let t=c(r.text)||[r.label,r.value].filter(Boolean).join('　'),fs=fit(t,right-left,maxFs);s+='<text x="'+w/2+'" y="'+y+'" fill="'+fg+'" font-size="'+fs+'" font-family="Yu Gothic,Arial" text-anchor="middle" dominant-baseline="middle">'+esc(t)+'</text>'}})}return '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'mm" height="'+h+'mm" viewBox="0 0 '+w+' '+h+'">'+s+'</svg>'}function proof(){g('specBox').innerHTML=esc(spec())+'<small>AI読取 製作寸法</small>';g('proofArt').innerHTML=build();let ok=ai.hole_count?holes().length===+ai.hole_count:true;g('proofStatus').innerHTML='<b>寸法確認：</b>'+esc(spec())+'<br><b>穴座標：</b>'+(ai.hole_count?(ok?'全'+holes().length+'ヶ確定':'要確認 '+holes().length+'/'+ai.hole_count+'ヶ'):'穴なし／不明');g('proofCard').classList.remove('hidden')}g('readBtn').onclick=read;g('proofBtn').onclick=proof;</script></body></html>
