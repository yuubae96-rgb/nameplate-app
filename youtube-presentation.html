<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16233f"><title>プレゼン資料→YouTube動画</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#f4f5f7;--ink:#17213a;--muted:#667188;--line:#d7dde6;--red:#e44945;--navy:#16233f;--green:#147a55}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);padding-bottom:35px}.app{max-width:760px;margin:auto}.head{padding:calc(10px + env(safe-area-inset-top)) 20px 12px;background:linear-gradient(#33435f,#172239);color:#fff}.head h1{font-size:21px;margin:0}.head p{margin:5px 0 0;font-size:12px;opacity:.85}.main{padding:10px 13px}.card,.slide{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:13px}h2{font-size:18px;margin:0 0 12px}.field{margin-bottom:11px}label{display:block;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:5px}input,textarea,select{width:100%;border:1px solid #cfd6e0;border-radius:13px;background:#fff;color:var(--ink);font-size:15px;padding:10px 12px;min-height:46px}input[type=file]{padding:8px;font-size:13px}textarea{min-height:95px;line-height:1.55}.grid2,.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:13px;min-height:46px;padding:10px;font-weight:900;font-size:14px;background:#eef1f5;color:var(--ink)}.red{background:var(--red);color:#fff}.navy{background:var(--navy);color:#fff}.green{background:var(--green);color:#fff}.full{width:100%}.status,.hint{font-size:12px;color:var(--muted);line-height:1.55;margin-top:6px}.notice{padding:10px;border-radius:11px;background:#eef5f3;font-size:12px;line-height:1.6}.slide-num{display:inline-block;background:var(--navy);color:#fff;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900;margin-bottom:9px}.thumb{background:#111;border-radius:12px;overflow:hidden;margin-bottom:10px;display:flex;justify-content:center}.thumb img{display:block;width:100%;height:auto;object-fit:contain;max-height:420px;background:#fff}.slide-title{font-weight:900;background:#fff5f5;border:2px solid #9b3034}.audio{width:100%;margin-top:8px}.video-stage{aspect-ratio:16/9;background:#fff;border-radius:12px;overflow:hidden;position:relative;border:1px solid #ddd;display:flex;align-items:center;justify-content:center}.video-stage img{width:100%;height:100%;object-fit:contain}.caption{position:absolute;left:4%;right:4%;bottom:3.5%;color:#fff;text-align:center;font-weight:900;font-size:clamp(20px,4vw,32px);line-height:1.2;text-shadow:-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000,3px 3px 0 #000;white-space:pre-line}.progress{height:7px;background:#e5e9ed;margin-top:9px}.progress div{height:100%;width:0;background:var(--red)}.save{display:none;text-align:center;text-decoration:none;margin-top:10px}.bar{height:8px;background:#e7ebef;border-radius:99px;overflow:hidden;margin-top:8px}.bar div{height:100%;width:0;background:var(--green)}.tag{font-size:11px;font-weight:900;display:inline-block;background:#eef5ff;border:1px solid #cbdaf4;color:#314a76;border-radius:999px;padding:5px 8px;margin:3px 0 8px}.stop{display:none;background:#8f1d24;color:#fff;width:100%;margin-top:9px}@media(max-width:480px){.grid2,.actions{grid-template-columns:1fr}.main{padding:8px 10px}.card,.slide{padding:14px}}
</style></head>
<body><div class="app"><header class="head"><h1>🎞️ プレゼン資料 → YouTube動画</h1><p>PDFを渡すだけで、各ページのナレーション → 音声 → 1本の動画まで作成</p></header><main class="main">
<section class="card"><h2>1. プレゼンPDFを選ぶ</h2><div class="field"><input type="file" id="pdfFile" accept="application/pdf"></div><div id="pdfStatus" class="status">PDFを選んでください。</div><div class="bar"><div id="pdfProgress"></div></div><div class="field" style="margin-top:12px"><label>ナレーションの長さ</label><select id="narLength"><option value="short">短め（1枚20〜35秒目安）</option><option value="standard" selected>標準（1枚35〜55秒目安）</option><option value="long">詳しく（1枚55〜80秒目安）</option></select></div><div class="field"><label>追加の指示（任意）</label><textarea id="extra" placeholder="例：経営者向け。画面の文字は棒読みせず、意味をつないで説明する。"></textarea></div><button class="btn red full" id="makeNarration" disabled>ChatGPTで全ページのナレーションを作る</button><div id="narStatus" class="status"></div></section>
<section class="card"><h2>2. 声を選ぶ</h2><div class="grid2"><div class="field"><label>Google Gemini TTS・12種類</label><select id="voice"></select><div id="voiceNote" class="hint"></div></div><div class="field"><label>読み方</label><select id="direction"><option value="落ち着いた日本語のドキュメンタリー調。自然な間、明瞭な発音、ややゆっくり。">落ち着いた解説</option><option value="重厚で落ち着いた日本語ナレーション。">重厚な解説</option><option value="聞きやすく親しみのある日本語解説。">親しみやすい解説</option></select></div></div><div class="actions"><button class="btn" id="sampleVoice">▶ 声を試聴</button><button class="btn navy" id="allAudio" disabled>全ページの音声を作る</button></div><div id="audioStatus" class="status"></div><audio id="sampleAudio" class="audio" controls style="display:none"></audio></section>
<div id="slides"></div>
<section class="card" id="videoCard" style="display:none"><h2>3. 完成動画</h2><label style="display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--ink)"><input id="showCaption" type="checkbox" checked style="width:20px;min-height:0">字幕を表示する</label><div class="video-stage"><img id="previewImg"><div id="previewCaption" class="caption"></div></div><div class="progress"><div id="videoProgress"></div></div><div class="actions" style="margin-top:9px"><button class="btn" id="previewAll">プレビュー再生</button><button class="btn green" id="makeVideo">1本の動画を完成させる</button></div><button class="btn stop" id="cancelVideo">■ 動画生成を停止</button><div id="videoStatus" class="status"></div><video id="resultVideo" controls playsinline style="display:none;width:100%;margin-top:10px"></video><a id="saveLink" class="btn green save">完成した動画を保存</a></section>
<section class="card"><div class="notice"><strong>このモードは資料のページをそのまま映像に使います。</strong><br>AIが勝手に別画像へ描き直しません。ナレーションだけChatGPTが作り、音声はGoogle Gemini TTSで読み上げます。</div></section>
</main></div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const NAR_FN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/youtube-presentation-maker';
const TTS_FN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/youtube-video-maker-safe';
const $=x=>document.getElementById(x);const VOICES=[['Charon','重厚・低め・落ち着いた印象'],['Gacrux','知的・静か・ドキュメンタリー向き'],['Sadaltager','穏やか・自然・聞き疲れしにくい'],['Iapetus','力強い・はっきり・重め'],['Algieba','柔らかい・親しみやすい'],['Schedar','端正・落ち着き・説明向き'],['Kore','知的・明瞭・すっきり'],['Aoede','穏やか・やわらか・上品'],['Sulafat','明るめ・自然・テンポ良好'],['Vindemiatrix','静か・丁寧・しっとり'],['Achernar','落ち着き・安定感・ナレーション向き'],['Puck','軽快・親しみ・やや明るめ']];
let pages=[],cancelRequested=false,activeSource=null;VOICES.forEach(([v,d])=>$('voice').add(new Option(`${v}（${d}）`,v)));function voiceNote(){let v=VOICES.find(x=>x[0]===$('voice').value);$('voiceNote').textContent=v?`声の印象：${v[1]}`:''}$('voice').onchange=voiceNote;voiceNote();
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function dataUrl(m,d){return`data:${m};base64,${d}`}async function call(url,b){let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),t=await r.text(),d;try{d=JSON.parse(t)}catch{d={error:t||`HTTP ${r.status}`}}if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);return d}function fileBuf(f){return new Promise((r,j)=>{let fr=new FileReader;fr.onload=()=>r(fr.result);fr.onerror=j;fr.readAsArrayBuffer(f)})}function loadImg(src){return new Promise((r,j)=>{let im=new Image;im.onload=()=>r(im);im.onerror=j;im.src=src})}function wait(ms){return new Promise(r=>setTimeout(r,ms))}
$('pdfFile').onchange=async()=>{let f=$('pdfFile').files[0];if(!f)return;pages=[];$('slides').innerHTML='';$('videoCard').style.display='none';$('makeNarration').disabled=true;$('pdfStatus').textContent='PDFを読み込み中…';try{let pdf=await pdfjsLib.getDocument({data:await fileBuf(f)}).promise;if(pdf.numPages>30)throw Error('30ページを超えるPDFは一度に処理できません。');for(let n=1;n<=pdf.numPages;n++){let p=await pdf.getPage(n),vp=p.getViewport({scale:1.6}),c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;let img=c.toDataURL('image/jpeg',.88);pages.push({page:n,image:img,title:`PAGE ${n}`,narration:'',reading:'',audio:'',leadingSilenceMs:0});$('pdfProgress').style.width=Math.round(n/pdf.numPages*100)+'%';$('pdfStatus').textContent=`PDF読込中… ${n}/${pdf.numPages}ページ`;}render();$('pdfStatus').textContent=`${pdf.numPages}ページを読み込みました。`; $('makeNarration').disabled=false;}catch(e){$('pdfStatus').textContent='PDF読込エラー：'+e.message}};
function slideHtml(s,i){return`<section class="slide"><span class="slide-num">PAGE ${i+1}</span><div class="thumb"><img src="${s.image}"></div><div class="field"><label>このページの見出し</label><input class="slide-title" id="title-${i}" value="${esc(s.title)}"></div><div class="field"><label>ナレーション（字幕）</label><textarea id="nar-${i}">${esc(s.narration)}</textarea></div><div class="field"><label>音声用の読み方</label><textarea id="read-${i}">${esc(s.reading||s.narration)}</textarea></div><div class="tag" id="provider-${i}" style="display:${s.narration?'inline-block':'none'}">OpenAI GPT-5.6 Terra</div><div class="actions"><button class="btn" onclick="redoNarration(${i})">このページだけ作り直す</button><button class="btn" id="audioBtn-${i}" onclick="makeAudio(${i})">このページの音声を作る</button></div><audio id="audio-${i}" class="audio" controls style="display:${s.audio?'block':'none'}" ${s.audio?`src="${s.audio}"`:''}></audio><div class="status" id="status-${i}"></div></section>`}function render(){$('slides').innerHTML=pages.map(slideHtml).join('');if(pages.length)$('videoCard').style.display='block'}function sync(i){pages[i].title=$(`title-${i}`).value;pages[i].narration=$(`nar-${i}`).value;pages[i].reading=$(`read-${i}`).value}
async function narrateOne(i,previous=''){let d=await call(NAR_FN,{action:'narrateSlide',pageImage:pages[i].image,page:i+1,total:pages.length,previousContext:previous,extra:$('extra').value.trim(),length:$('narLength').value});pages[i].title=d.title;pages[i].narration=d.narration;pages[i].reading=d.reading||d.narration;pages[i].context=d.context||d.narration.slice(0,300);return pages[i].context}
$('makeNarration').onclick=async()=>{if(!pages.length)return;let b=$('makeNarration');b.disabled=true;let context='';try{for(let i=0;i<pages.length;i++){$('narStatus').textContent=`ChatGPTが資料を読んでいます… ${i+1}/${pages.length}ページ`;context=await narrateOne(i,context);render();window.scrollTo({top:Math.max(0,document.body.scrollHeight-900),behavior:'smooth'});await wait(150)}$('narStatus').textContent=`全${pages.length}ページのナレーションが完成しました。内容を確認したら音声を作れます。`;$('allAudio').disabled=false;}catch(e){$('narStatus').textContent=`PAGE ${pages.findIndex(x=>!x.narration)+1} で停止：${e.message}。もう一度押すと最初から再作成します。`}finally{b.disabled=false}};
window.redoNarration=async i=>{let st=$(`status-${i}`);st.textContent='このページのナレーションを作成中…';try{let prev=i?pages[i-1].context||pages[i-1].narration.slice(0,300):'';await narrateOne(i,prev);render();st=$(`status-${i}`);st.textContent='作り直しました。'}catch(e){st.textContent='作成エラー：'+e.message}};
async function tts(text){return call(TTS_FN,{action:'generateTts',text,voice:$('voice').value,direction:$('direction').value})}window.makeAudio=async i=>{sync(i);let b=$(`audioBtn-${i}`);if(!pages[i].reading.trim())return;b.disabled=true;b.textContent='音声生成中…';try{let d=await tts(pages[i].reading);pages[i].audio=dataUrl(d.mimeType||'audio/wav',d.data);pages[i].leadingSilenceMs=Number(d.leadingSilenceMs||0);let a=$(`audio-${i}`);a.src=pages[i].audio;a.style.display='block';$(`status-${i}`).textContent=`${$('voice').value} で音声を作りました。`;return true}catch(e){$(`status-${i}`).textContent='音声生成エラー：'+e.message;return false}finally{b.disabled=false;b.textContent='このページの音声を作る'}};
$('sampleVoice').onclick=async()=>{let b=$('sampleVoice');b.disabled=true;$('audioStatus').textContent='試聴音声を作成中…';try{let d=await tts('こんにちは。プレゼン資料の内容を、分かりやすく自然にご紹介します。');$('sampleAudio').src=dataUrl(d.mimeType||'audio/wav',d.data);$('sampleAudio').style.display='block';$('audioStatus').textContent='下の再生ボタンで声を確認できます。'}catch(e){$('audioStatus').textContent='試聴エラー：'+e.message}finally{b.disabled=false}};
$('allAudio').onclick=async()=>{if(!pages.every(x=>x.narration))return alert('先に全ページのナレーションを作ってください。');let b=$('allAudio');b.disabled=true;let done=pages.filter(x=>x.audio).length;try{for(let i=0;i<pages.length;i++){if(pages[i].audio)continue;$('audioStatus').textContent=`音声生成中… PAGE ${i+1}（${done}/${pages.length}完成）`;let ok=await makeAudio(i);if(!ok)return;done++;await wait(250)}$('audioStatus').textContent=`全${done}ページの音声が完成しました。`}finally{b.disabled=false}};
const P=/^[。、！？!?，．・：；」』）】〉》〕］｝”’]+$/;function caps(t){let a=String(t||'').trim().match(/[^。、！？!?]+[。、！？!?]?/g)||[''];return a.map(p=>{p=p.trim();if(p.length<=30)return p;let c=Math.ceil(p.length/2),x=p.slice(0,c),y=p.slice(c);while(y&&P.test(y[0])){x+=y[0];y=y.slice(1)}return y?x+'\n'+y:x}).filter(Boolean)}function capAt(t,c,d){let a=caps(t),w=a.map(x=>x.replace(/\n/g,'').length||1),sum=w.reduce((x,y)=>x+y,0),v=Math.max(0,Math.min(d||1,c||0))/(d||1)*sum,z=0;for(let i=0;i<a.length;i++){z+=w[i];if(v<=z)return a[i]}return a.at(-1)||''}function speechCaption(s,current,duration){if(!$('showCaption').checked)return'';let lead=Math.max(0,Number(s.leadingSilenceMs||0))/1000;if(current<lead)return'';return capAt(s.narration,current-lead,Math.max(.1,(duration||1)-lead))}async function playTimed(s,a){$('previewImg').src=s.image;$('previewCaption').textContent='';let tm=setInterval(()=>$('previewCaption').textContent=speechCaption(s,a.currentTime,a.duration),90);a.currentTime=0;await a.play();await new Promise(r=>a.onended=r);clearInterval(tm)}$('previewAll').onclick=async()=>{for(let i=0;i<pages.length;i++){sync(i);if(!pages[i].audio)continue;await playTimed(pages[i],new Audio(pages[i].audio));$('videoProgress').style.width=Math.round((i+1)/pages.length*100)+'%'}};
async function decode(ac,u){return ac.decodeAudioData(await(await fetch(u)).arrayBuffer())}function draw(ctx,c,img,cap){ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);let sc=Math.min(c.width/img.width,c.height/img.height),w=img.width*sc,h=img.height*sc;ctx.drawImage(img,(c.width-w)/2,(c.height-h)/2,w,h);if(cap){let lines=cap.split('\n');ctx.font='900 40px sans-serif';ctx.textAlign='center';ctx.lineJoin='round';ctx.strokeStyle='#000';ctx.lineWidth=8;ctx.fillStyle='#fff';let y=c.height-55-(lines.length-1)*48;for(let line of lines){ctx.strokeText(line,c.width/2,y);ctx.fillText(line,c.width/2,y);y+=48}}}$('cancelVideo').onclick=()=>{cancelRequested=true;try{activeSource?.stop()}catch{}};$('makeVideo').onclick=async()=>{pages.forEach((_,i)=>sync(i));if(pages.some(s=>!s.audio))return alert('先に全ページの音声を作ってください。');let b=$('makeVideo');b.disabled=true;cancelRequested=false;$('cancelVideo').style.display='block';let ac=null,stream=null;try{let c=document.createElement('canvas');c.width=1280;c.height=720;let ctx=c.getContext('2d'),AC=window.AudioContext||window.webkitAudioContext;ac=new AC;await ac.resume();let dest=ac.createMediaStreamDestination(),imgs=[],bufs=[];for(let s of pages){imgs.push(await loadImg(s.image));bufs.push(await decode(ac,s.audio))}let vs=c.captureStream(30);stream=new MediaStream([...vs.getVideoTracks(),...dest.stream.getAudioTracks()]);let mime=['video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x))||'',rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);let stopped=new Promise(r=>rec.onstop=r);rec.start(1000);for(let i=0;i<pages.length&&!cancelRequested;i++){let s=pages[i],src=ac.createBufferSource();activeSource=src;src.buffer=bufs[i];src.connect(dest);src.start();let st=performance.now(),dur=bufs[i].duration;while(performance.now()-st<dur*1000&&!cancelRequested){let el=(performance.now()-st)/1000;draw(ctx,c,imgs[i],speechCaption(s,el,dur));$('videoStatus').textContent=`動画生成中… PAGE ${i+1}/${pages.length}`;$('videoProgress').style.width=Math.round((i+el/dur)/pages.length*100)+'%';await wait(33)}}rec.stop();await stopped;if(cancelRequested){$('videoStatus').textContent='動画生成を停止しました。';return}let type=rec.mimeType||mime||'video/webm',blob=new Blob(chunks,{type}),url=URL.createObjectURL(blob),ext=type.includes('mp4')?'mp4':'webm';$('resultVideo').src=url;$('resultVideo').style.display='block';$('saveLink').href=url;$('saveLink').download='presentation-video.'+ext;$('saveLink').style.display='block';$('videoProgress').style.width='100%';$('videoStatus').textContent='動画が完成しました。下のボタンから保存できます。'}catch(e){$('videoStatus').textContent='動画作成エラー：'+e.message}finally{activeSource=null;if(stream)stream.getTracks().forEach(t=>t.stop());if(ac&&ac.state!=='closed')try{await ac.close()}catch{}b.disabled=false;$('cancelVideo').style.display='none'}};
</script></body></html>
