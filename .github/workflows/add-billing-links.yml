name: Add billing links
on:
  push:
    paths: ['.github/workflows/add-billing-links.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('youtube-video.html')
          s=p.read_text(encoding='utf-8')
          old='''<a id="saveLink" class="btn saveLink">完成した動画を保存</a></section></main></div>'''
          new='''<a id="saveLink" class="btn saveLink">完成した動画を保存</a></section><section class="card"><h2>API料金を確認</h2><div class="hint" style="margin-bottom:10px">動画を作った後の料金確認用です。</div><div class="grid2"><a class="btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="https://platform.openai.com/settings/organization/billing/overview" target="_blank" rel="noopener noreferrer">OpenAI 料金・残高</a><a class="btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="https://console.cloud.google.com/billing" target="_blank" rel="noopener noreferrer">Google 料金・利用額</a></div></section></main></div>'''
          if old not in s: raise SystemExit('insertion point not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git add youtube-video.html
          git commit -m 'Add OpenAI and Google billing links to video app'
          git push
