name: Patch YouTube video image safety

on:
  push:
    paths:
      - '.github/workflows/patch-youtube-video-image-safety.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch youtube-video.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('youtube-video.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace("$('allImages').textContent='全シーンのAI画像を作る'", "$('allImages').textContent='未完成シーンのAI画像を作る'")
          s = s.replace("<button class=\"btn navy\" id=\"allImages\">全シーンのAI画像を作る</button>", "<button class=\"btn navy\" id=\"allImages\">未完成シーンのAI画像を作る</button>")
          s = s.replace("OpenAIが失敗した場合はGeminiへ自動で切り替わります。主人公・画風の基準画像を使う生成や人物調整ではGemini画像を使用します。", "OpenAI画像生成が失敗した場合は安全のため停止します。主人公・画風の基準画像を使う生成や人物調整だけGemini画像を使用します。")

          old = "$('allImages').onclick=async()=>{let b=$('allImages');b.disabled=true;try{for(let i=0;i<project.scenes.length;i++){b.textContent=`AI画像生成中 ${i+1}/${project.scenes.length}`;await genImage(i)}}finally{b.disabled=false;updateCostLabels()}};"
          new = "$('allImages').onclick=async()=>{let b=$('allImages');if(b.disabled||!project?.scenes?.length)return;let pending=project.scenes.map((s,i)=>s.image?null:i).filter(i=>i!==null);if(!pending.length){$('usage').textContent='全シーンのAI画像はすでに完成しています。完成済み画像は再生成しません。';return}if(pending.length>12){$('usage').textContent=`安全装置：一度に生成できる画像は12枚までです。未完成${pending.length}枚あります。個別生成をご利用ください。`;return}b.disabled=true;try{for(let p=0;p<pending.length;p++){let i=pending[p];b.textContent=`AI画像生成中 ${p+1}/${pending.length}`;$('usage').textContent=`未完成シーンだけ生成中… SCENE ${i+1}（${p+1}/${pending.length}）`;try{await genImage(i)}catch(e){$('usage').textContent=`SCENE ${i+1} の画像生成に失敗しました：${e?.message||e}。もう一度押すと未完成シーンから再開します。`;return}await wait(300)}$('usage').textContent=`未完成だった${pending.length}シーンのAI画像が完成しました。完成済み画像は再生成していません。`}finally{b.disabled=false;updateCostLabels()}};"
          if old not in s:
              raise SystemExit('target allImages handler not found; aborting without changes')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- youtube-video.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add youtube-video.html
          git commit -m 'Prevent duplicate bulk image generation'
          git push
