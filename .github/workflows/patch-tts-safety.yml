name: Patch TTS safety

on:
  push:
    paths:
      - '.github/workflows/patch-tts-safety.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch youtube-video.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('youtube-video.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('<button class="btn" onclick="genAudio(${i})">音声を作る</button>', '<button class="btn" id="audioBtn-${i}" onclick="genAudio(${i})">音声を作る</button>')

          old="window.genAudio=async i=>{sync(i);let s=project.scenes[i],d=await call({action:'generateTts',text:s.reading,voice:$('voice').value,direction:$('direction').value});if(!d?.data)throw Error('音声データを取得できませんでした。');s.audio=du(d.mimeType||'audio/wav',d.data);s.leadingSilenceMs=Number(d.leadingSilenceMs||0);s.audioProvider=`Google Gemini TTS・${$('voice').value}`;let a=$(`audio-${i}`);a.src=s.audio;a.style.display='block';let tag=$(`audioProvider-${i}`);tag.textContent=s.audioProvider;tag.style.display='inline-block';counts.audio++;usage();return true};"
          new="window.genAudio=async i=>{let btn=$(`audioBtn-${i}`);if(btn?.disabled)return false;if(btn){btn.disabled=true;btn.textContent='音声生成中…'}try{sync(i);let s=project.scenes[i],d=await call({action:'generateTts',text:s.reading,voice:$('voice').value,direction:$('direction').value});if(!d?.data)throw Error('音声データを取得できませんでした。');s.audio=du(d.mimeType||'audio/wav',d.data);s.leadingSilenceMs=Number(d.leadingSilenceMs||0);s.audioProvider=`Google Gemini TTS・${$('voice').value}`;let a=$(`audio-${i}`);a.src=s.audio;a.style.display='block';let tag=$(`audioProvider-${i}`);tag.textContent=s.audioProvider;tag.style.display='inline-block';counts.audio++;usage();return true}finally{if(btn){btn.disabled=false;btn.textContent='音声を作る'}}};"
          if old not in s:
              raise SystemExit('target genAudio handler not found; aborting')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- youtube-video.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add youtube-video.html
          git commit -m 'Prevent duplicate individual TTS generation'
          git push

# trigger 2
