name: Add AI usage display

on:
  push:
    paths:
      - '.github/workflows/add-ai-usage-display.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch AI usage display
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('youtube-video.html')
          s=p.read_text(encoding='utf-8')

          old='''<div id="usage" class="usage"></div></section><div id="scenes"></div>'''
          new='''<div id="usage" class="usage"></div><div id="aiUsageSummary" class="notice" style="margin-top:10px;display:none"></div></section><div id="scenes"></div>'''
          if old not in s: raise SystemExit('summary insertion point not found')
          s=s.replace(old,new,1)

          marker="function show(s){$('previewImg').src=s.image;$('previewTitle').textContent=s.title}"
          fn='''function updateAiUsageSummary(){let el=$('aiUsageSummary');if(!el||!project?.scenes?.length)return;let script=project.scriptProvider||'未生成';let imgs={},audios={};for(let s of project.scenes){let ip=s.imageProvider||'未生成';imgs[ip]=(imgs[ip]||0)+1;let ap=s.audioProvider||'未生成';audios[ap]=(audios[ap]||0)+1}let rows=o=>Object.entries(o).map(([k,v])=>`${k}：${v}シーン`).join('<br>');el.innerHTML=`<strong>今回使ったAI</strong><br>脚本・画像指示：${script}<br>画像：${rows(imgs)}<br>音声：${rows(audios)}`;el.style.display='block'};'''
          if marker not in s: raise SystemExit('function marker not found')
          s=s.replace(marker,fn+marker,1)

          # Refresh summary whenever the existing usage/cost UI refreshes.
          old2='''counts.audio++;usage();return true}finally'''
          new2='''counts.audio++;usage();updateAiUsageSummary();return true}finally'''
          if old2 not in s: raise SystemExit('audio update point not found')
          s=s.replace(old2,new2,1)

          old3='''counts.image++;usage()};window.refineScene'''
          new3='''counts.image++;usage();updateAiUsageSummary()};window.refineScene'''
          if old3 not in s: raise SystemExit('image update point not found')
          s=s.replace(old3,new3,1)

          old4='''counts.image++;usage();st.textContent='調整しました。' }'''
          # minified source has no guaranteed space; use exact observed fragment instead
          if old4 in s:
              s=s.replace(old4,'''counts.image++;usage();updateAiUsageSummary();st.textContent='調整しました。' }''',1)
          else:
              s=s.replace("counts.image++;usage();st.textContent='調整しました。'", "counts.image++;usage();updateAiUsageSummary();st.textContent='調整しました。'",1)

          old5='''counts.script++;usage();render();$('scriptStatus').textContent='''
          new5='''counts.script++;usage();render();updateAiUsageSummary();$('scriptStatus').textContent='''
          if old5 not in s: raise SystemExit('script update point not found')
          s=s.replace(old5,new5,1)

          # Per-scene labels: make the provider labels explicit and easy to understand.
          s=s.replace('''<span class="provider-tag" id="imgProvider-${i}"''','''<span class="provider-tag" id="imgProvider-${i}"''')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git add youtube-video.html
          git commit -m 'Show AI providers used in each video'
          git push
