name: Fix YouTube safe endpoint

on:
  push:
    paths:
      - '.github/workflows/fix-youtube-safe-endpoint.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix endpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('youtube-video.html')
          s=p.read_text(encoding='utf-8')
          bad='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/youtube-video-maker-safe-safe'
          good='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/youtube-video-maker-safe'
          if bad not in s:
              raise SystemExit('bad endpoint not found')
          s=s.replace(bad,good,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git add youtube-video.html
          git commit -m 'Fix YouTube safe TTS endpoint'
          git push
