name: Switch YouTube app to safe TTS proxy

on:
  push:
    paths:
      - '.github/workflows/switch-tts-safe-proxy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch endpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('youtube-video.html')
          s=p.read_text(encoding='utf-8')
          old="https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/youtube-video-maker"
          new="https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/youtube-video-maker-safe"
          if old not in s:
              raise SystemExit('target endpoint not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit endpoint change
        run: |
          if git diff --quiet -- youtube-video.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add youtube-video.html
          git commit -m 'Route YouTube TTS through safety proxy'
          git push
