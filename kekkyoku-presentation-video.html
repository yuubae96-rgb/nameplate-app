<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16233f"><title>結局なに？ 音声プレゼン</title><style>*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:#17213a;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding-bottom:calc(90px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:20;background:#16233f;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}.top h1{font-size:19px;margin:0}.top p{font-size:11px;margin:4px 0 0;opacity:.8}.wrap{max-width:820px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #d7dde6;border-radius:18px;padding:15px;margin-bottom:12px}.fileBtn,.btn{width:100%;min-height:48px;border:0;border-radius:13px;font-weight:900;font-size:14px}.btn{background:#16233f;color:#fff}.green{background:#147a55}.blue{background:#2366b1}.red{background:#8f1d24}.btn:disabled{opacity:.35}.hist{display:grid;gap:8px;margin-top:10px}.hist button{border:1px solid #d7dde6;background:#f8fafc;border-radius:12px;padding:11px;text-align:left;font-weight:800}.hist small{display:block;color:#687386;margin-top:3px}.status{font-size:12px;line-height:1.55;color:#667188;margin-top:8px}.stage{aspect-ratio:16/9;background:#111;border-radius:16px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}.stage img{width:100%;height:100%;object-fit:contain;background:#fff}.nav{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px;margin-top:9px}.nav button{border:0;border-radius:11px;min-height:44px;font-weight:900}.count{background:#2366b1;color:#fff}.pageList{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.pageList button{border:0;border-radius:10px;min-height:40px;font-weight:900;background:#eef1f5}.pageList button.on{background:#2366b1;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.nar{white-space:pre-wrap;background:#f8fafc;border-radius:12px;padding:11px;font-size:13px;line-height:1.6;max-height:180px;overflow:auto}.voiceRow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.voiceRow select{width:100%;min-height:44px;border:1px solid #cfd6e0;border-radius:11px;padding:8px}.playOverlay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:82px;height:82px;border:3px solid #fff;border-radius:50%;background:rgba(22,35,63,.9);color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;padding-left:5px;z-index:5}.playOverlay.playing{left:auto;right:12px;top:12px;transform:none;width:48px;height:48px;font-size:20px;padding:0;background:rgba(143,29,36,.95)}audio{width:100%;margin-top:8px}.note{background:#eaf7f3;border:1px solid #c6e4da;border-radius:12px;padding:10px;font-size:12px;line-height:1.55;color:#315f54}.hidden{display:none!important}@media(max-width:520px){.row,.voiceRow{grid-template-columns:1fr}.pageList{grid-template-columns:repeat(4,1fr)}}</style></head><body><div class="top"><h1>🎬 結局なに？ 音声プレゼン</h1><p>保存した面談 → ChatGPTナレーション → AI音声 → 自動ページ送り</p></div><div class="wrap"><div class="card"><b>1. 面談を選ぶ</b><div class="note" style="margin-top:9px">「結局なに？AI」で保存した面談を使います。要点を6〜8枚に整理し、各ページをChatGPTが説明するナレーションへ変えます。</div><div id="history" class="hist"></div><div id="selectStatus" class="status"></div></div><div class="card"><b>2. 音声付きプレゼンを作る</b><div class="voiceRow" style="margin-top:10px"><div><div class="status">声</div><select id="voice"><option value="Charon">Charon（重厚・落ち着き）</option><option value="Gacrux" selected>Gacrux（知的・静か）</option><option value="Sadaltager">Sadaltager（穏やか・自然）</option><option value="Algieba">Algieba（柔らかい）</option><option value="Kore">Kore（明瞭・すっきり）</option><option value="Aoede">Aoede（穏やか・上品）</option></select></div><div><div class="status">読み方</div><select id="direction"><option value="落ち着いた日本語のドキュメンタリー調。自然な間、明瞭な発音、ややゆっくり。" selected>落ち着いた解説</option><option value="聞きやすく親しみのある日本語解説。">親しみやすい解説</option><option value="重厚で落ち着いた日本語ナレーション。">重厚な解説</option></select></div></div><button id="build" class="btn green" style="margin-top:10px" disabled>✨ ChatGPTでナレーション＋AI音声を作る</button><div id="buildStatus" class="status"></div></div><div id="playerCard" class="card hidden"><div class="stage" id="stage"><img id="slideImg"><button id="play" class="playOverlay">▶</button></div><div class="nav"><button id="prev">◀ 前へ</button><button id="count" class="count">1 / 1</button><button id="next">次へ ▶</button></div><div id="pageList" class="pageList"></div><audio id="audio" controls></audio><div style="margin-top:10px"><b>このページの説明</b><div id="nar" class="nar"></div></div><div class="row"><button id="replay" class="btn blue">▶ このページだけ再生</button><button id="stop" class="btn red">■ 停止</button></div></div></div><script>const H='kekkyoku_history_v1',NAR='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/youtube-presentation-maker',TTS='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/youtube-video-maker-safe';const $=x=>document.getElementById(x);let selected=null,pages=[],idx=0,playing=false;function getHist(){try{return JSON.parse(localStorage.getItem(H)||'[]')}catch{return[]}}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function call(url,b){return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(async r=>{let t=await r.text(),d;try{d=JSON.parse(t)}catch{d={error:t}}if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d})}function dataUrl(m,d){return`data:${m};base64,${d}`}function list(){let h=getHist();$('history').innerHTML=h.length?h.map((x,i)=>`<button data-i="${i}">${esc(x.title||'面談メモ')}<small>${esc(x.date||'')}・${esc(x.category||'自動')}</small></button>`).join(''):'<div class="status">保存した面談がありません。先に「結局なに？AI」で解析結果を保存してください。</div>'}function items(a){return(a||[]).filter(Boolean).map(x=>String(x))}function deckFrom(d){let a=d.analysis||{},v=d.visual||{},out=[];out.push({title:'結局なに？',bullets:[a.oneLine||'面談内容のまとめ']});if(a.plainSummary?.length)out.push({title:'相手が言っていること',bullets:items(a.plainSummary).slice(0,6)});if(a.numbers?.length)out.push({title:'金額・率・期間・期限',bullets:a.numbers.slice(0,6).map(n=>`${n.label}：${n.value}${n.why?'｜'+n.why:''}`)});if(v.visualSummary?.length||v.visualScenes?.length)out.push({title:'映像も合わせると',bullets:[...items(v.visualSummary),...(v.visualScenes||[]).slice(0,4).map(s=>`${s.time||''} ${s.seen||''} → ${s.meaning||s.said||''}`)].slice(0,6)});if(a.cautions?.length)out.push({title:'注意しておくところ',bullets:items(a.cautions).slice(0,6)});out.push({title:'あなたが決めること',bullets:items(a.decisions).length?items(a.decisions).slice(0,6):['現時点では明確な決定事項はありません。']});out.push({title:'次に相手へ聞くこと',bullets:items(a.questions).length?items(a.questions).slice(0,6):['追加で確認する質問はありません。']});let last=[...(a.terms||[]).slice(0,4).map(t=>`${t.term}：${t.meaning}`),...items(a.missing).slice(0,3)];if(last.length)out.push({title:'用語・まだ分からないこと',bullets:last.slice(0,6)});return out.slice(0,8)}function wrap(ctx,text,maxWidth){let chars=String(text),lines=[],line='';for(const ch of chars){let test=line+ch;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=ch}else line=test}if(line)lines.push(line);return lines}function slideImage(p,n,total){let c=document.createElement('canvas');c.width=1280;c.height=720;let x=c.getContext('2d');x.fillStyle='#f7f9fb';x.fillRect(0,0,1280,720);x.fillStyle='#16233f';x.fillRect(0,0,1280,105);x.fillStyle='#fff';x.font='bold 42px sans-serif';x.fillText(p.title,65,68);x.fillStyle='#0f6e5f';x.fillRect(65,130,1150,6);x.font='30px sans-serif';x.fillStyle='#17213a';let y=195;for(const b of p.bullets){let ls=wrap(x,'・'+b,1080);for(const l of ls){x.fillText(l,85,y);y+=43;if(y>625)break}y+=10;if(y>625)break}x.fillStyle='#687386';x.font='18px sans-serif';x.fillText(`結局なに？AI  ${n}/${total}`,65,685);return c.toDataURL('image/jpeg',.9)}function render(){if(!pages.length)return;$('playerCard').classList.remove('hidden');idx=Math.max(0,Math.min(idx,pages.length-1));$('slideImg').src=pages[idx].image;$('nar').textContent=pages[idx].narration||'ナレーション未作成';$('count').textContent=`${idx+1} / ${pages.length}`;$('pageList').innerHTML=pages.map((p,i)=>`<button data-i="${i}" class="${i===idx?'on':''}">${i+1}</button>`).join('');$('audio').src=pages[idx].audio||'';$('prev').disabled=idx===0;$('next').disabled=idx===pages.length-1}async function build(){if(!selected)return;let b=$('build');b.disabled=true;try{let base=deckFrom(selected.data),total=base.length;pages=base.map((p,i)=>({...p,image:slideImage(p,i+1,total),narration:'',reading:'',audio:''}));$('buildStatus').textContent=`ChatGPTが${total}ページの説明を作っています…`;let context='';for(let i=0;i<pages.length;i++){$('buildStatus').textContent=`ChatGPTがナレーション作成中… ${i+1}/${pages.length}`;let d=await call(NAR,{action:'narrateSlide',pageImage:pages[i].image,page:i+1,total:pages.length,previousContext:context,extra:'これは営業・契約・サービス説明を一般の人向けに整理したプレゼンです。画面の文字を棒読みせず、「つまり何か」が分かるようにやさしく説明してください。金額・期限・条件・注意点は省略しないでください。1ページ30〜50秒程度。',beginnerMode:true,length:'standard'});pages[i].narration=d.narration||'';pages[i].reading=d.reading||d.narration||'';context=d.context||pages[i].narration.slice(0,300);$('buildStatus').textContent=`AI音声を作成中… ${i+1}/${pages.length}`;let t=await call(TTS,{action:'generateTts',text:pages[i].reading,voice:$('voice').value,direction:$('direction').value});pages[i].audio=dataUrl(t.mimeType||'audio/wav',t.data)}idx=0;render();$('buildStatus').textContent=`✅ ${pages.length}ページの音声付きプレゼンが完成しました。中央の▶で自動説明できます。`}catch(e){$('buildStatus').textContent='作成エラー：'+e.message}finally{b.disabled=false}}async function playAll(){if(!pages.length)return;if(playing){stopAll();return}playing=true;$('play').classList.add('playing');$('play').textContent='■';for(let i=idx;i<pages.length&&playing;i++){idx=i;render();await new Promise(res=>{let a=$('audio');a.currentTime=0;a.onended=res;a.onerror=res;a.play().catch(res)});if(playing&&i<pages.length-1)await new Promise(r=>setTimeout(r,700))}playing=false;$('play').classList.remove('playing');$('play').textContent='▶'}function stopAll(){playing=false;let a=$('audio');try{a.pause();a.currentTime=0}catch{}$('play').classList.remove('playing');$('play').textContent='▶'}$('history').onclick=e=>{let b=e.target.closest('button[data-i]');if(!b)return;let h=getHist(),x=h[+b.dataset.i];if(!x)return;selected=x;$('selectStatus').textContent='選択：'+(x.title||'面談メモ');$('build').disabled=false};$('build').onclick=build;$('play').onclick=playAll;$('stop').onclick=stopAll;$('replay').onclick=async()=>{stopAll();let a=$('audio');a.currentTime=0;try{await a.play()}catch{}};$('prev').onclick=()=>{stopAll();idx--;render()};$('next').onclick=()=>{stopAll();idx++;render()};$('pageList').onclick=e=>{let b=e.target.closest('button[data-i]');if(!b)return;stopAll();idx=+b.dataset.i;render()};list();let h=getHist();if(h.length){selected=h[0];$('selectStatus').textContent='最新の保存面談を選択済み：'+(h[0].title||'面談メモ');$('build').disabled=false}</script></body></html>
