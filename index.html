<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>銘板見積もりアプリ</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="銘板見積り"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#16233F">
<style>:root{--bg:#F4F6F8;--card:#FFF;--border:#E1E5EA;--navy:#16233F;--navy-soft:#4B5A78;--accent:#0F6E5F;--accent-soft:#E4F2EF;--danger:#C0392B}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:"Hiragino Sans","Yu Gothic",sans-serif;color:var(--navy);padding:calc(20px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}.app{max-width:720px;margin:0 auto}header{margin-bottom:18px}header h1{font-size:20px;margin:0 0 4px}header p{font-size:13px;color:var(--navy-soft);margin:0}.tabs{display:flex;gap:8px;margin-bottom:16px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:5px}.tab-btn{flex:1;border:0;background:transparent;padding:11px 10px;font-size:14px;font-weight:600;color:var(--navy-soft);border-radius:8px;min-height:44px}.tab-btn.active{background:var(--navy);color:#fff}.panel{display:none}.panel.active{display:block}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px 18px;margin-bottom:14px}.card h2{font-size:15px;margin:0 0 14px;display:flex;align-items:center;gap:8px}.card h2 .n{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}.field{margin-bottom:14px}.field label{display:block;font-size:12px;color:var(--navy-soft);margin-bottom:6px;font-weight:600}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}select,input[type=number],input[type=text]{width:100%;font-family:inherit;font-size:15px;padding:11px 10px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--navy);min-height:44px}.radio-group{display:flex;gap:10px}.radio-option{flex:1;border:1px solid var(--border);border-radius:10px;padding:11px 10px;text-align:center;font-size:14px;min-height:44px;display:flex;align-items:center;justify-content:center}.radio-option input{display:none}.radio-option.selected{background:var(--navy);color:#fff;border-color:var(--navy)}.checkbox-row{display:flex!important;align-items:center;gap:8px;font-size:13px!important;color:var(--navy-soft);margin-bottom:8px!important}.checkbox-row input{width:18px;height:18px;flex:0 0 auto}.quote-options{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}.result-card{background:var(--navy);color:#fff;border-radius:14px;padding:22px 18px}.result-total-label{font-size:12px;color:#A9B6CC;margin-bottom:4px}.result-total{font-size:36px;font-weight:700;font-family:"SF Mono","Menlo",monospace;margin-bottom:16px}.breakdown-row{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-top:1px solid rgba(255,255,255,.12);color:#C7D0DF}.breakdown-row.total-row{color:#fff;font-weight:700;border-top:1px solid rgba(255,255,255,.3);margin-top:4px}.note{font-size:12px;color:var(--navy-soft);background:var(--accent-soft);padding:10px 12px;border-radius:10px;margin-bottom:14px;line-height:1.6}.price-table{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}.price-row{display:grid;grid-template-columns:1fr 100px 40px;gap:8px;align-items:center}.icon-btn{min-height:40px;border:1px solid var(--border);background:#fff;border-radius:8px;color:var(--danger);font-size:16px}.add-row-btn{width:100%;min-height:44px;border:1px dashed var(--border);background:transparent;border-radius:10px;color:var(--navy-soft);font-size:13px;font-weight:600}.unit-suffix{font-size:12px;color:var(--navy-soft);margin-top:-8px;margin-bottom:12px}.save-btn{width:100%;min-height:52px;border:0;background:var(--accent);color:#fff;font-size:15px;font-weight:700;border-radius:12px;margin-top:6px}.save-status{text-align:center;font-size:12px;color:var(--accent);margin-top:10px;min-height:16px}.discount-row{display:grid;grid-template-columns:1fr 1fr 40px;gap:8px;align-items:center;margin-bottom:8px}.discount-row span{font-size:12px;color:var(--navy-soft)}.material-block{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:12px}.material-block-header{display:grid;grid-template-columns:1fr 40px;gap:8px;margin-bottom:10px}.thickness-row{display:grid;grid-template-columns:90px 1fr 40px;gap:8px;align-items:center;margin-bottom:8px}.add-thickness-btn{width:100%;min-height:38px;border:1px dashed var(--border);background:transparent;border-radius:8px;color:var(--navy-soft);font-size:12px;font-weight:600}</style></head>
<body><div class="app"><header><h1>銘板見積もりアプリ</h1><p>必要な項目を入力すると見積もり金額が自動で計算されます</p></header><div class="tabs"><button class="tab-btn active" data-tab="quote">見積もり</button><button class="tab-btn" data-tab="settings">単価設定</button></div>
<div class="panel active" id="panel-quote"><div class="card"><h2><span class="n">1</span>製品仕様</h2><div class="field"><label>材質</label><select id="material"></select></div><div class="field"><label>板厚</label><select id="thickness"></select></div><div class="field"><label>サイズ(mm)</label><div class="row2"><input type="number" id="width" placeholder="縦"><input type="number" id="height" placeholder="横"></div></div><div class="field"><label>数量(枚)</label><input type="number" id="quantity" placeholder="例:100"></div><div class="field"><label>加工方法</label><select id="process"></select></div><div class="row2"><div class="field"><label>穴の数</label><input type="number" id="holes" value="0"></div><div class="field"><label>色数</label><input type="number" id="colors" value="1"></div></div><div class="field"><label>形状</label><div class="radio-group" id="shape-group"><label class="radio-option selected" data-value="rect"><input type="radio" name="shape" checked>矩形</label><label class="radio-option" data-value="irregular"><input type="radio" name="shape">変形</label></div></div><div class="field" style="margin-bottom:0"><label class="checkbox-row"><input type="checkbox" id="include-plate" checked>版代を含める(初回・新規版下作成時のみ)</label><div class="quote-options"><label class="checkbox-row"><input type="checkbox" id="supplied-material">支給材有り</label><label class="checkbox-row"><input type="checkbox" id="data-available">データ有り</label></div></div></div>
<div class="result-card"><div class="result-total-label">見積もり合計(税別)</div><div class="result-total" id="result-total">¥0</div><div class="breakdown-row"><span>材料費(1枚)</span><span id="b-material">¥0</span></div><div class="breakdown-row"><span>加工費(1枚)</span><span id="b-process">¥0</span></div><div class="breakdown-row"><span>穴加工費(1枚)</span><span id="b-hole">¥0</span></div><div class="breakdown-row"><span>色数追加費(1枚)</span><span id="b-color">¥0</span></div><div class="breakdown-row"><span>変形追加費(1枚)</span><span id="b-shape">¥0</span></div><div class="breakdown-row"><span>1枚あたり単価</span><span id="b-unit">¥0</span></div><div class="breakdown-row"><span>数量割引率</span><span id="b-discount">×1.00</span></div><div class="breakdown-row"><span>版代</span><span id="b-plate">¥0</span></div><div class="breakdown-row total-row"><span>合計</span><span id="b-total">¥0</span></div></div></div>
<div class="panel" id="panel-settings"><div class="note">ここで設定した単価が、見積もりタブの計算にそのまま使われます。</div><div class="card"><h2><span class="n">1</span>材質・板厚ごとの単価</h2><div class="unit-suffix">単価は「1cm² あたりの円」で入力してください</div><div id="material-table"></div><button class="add-row-btn" id="add-material">＋ 材質を追加</button></div><div class="card"><h2><span class="n">2</span>加工方法ごとの単価</h2><div id="process-table"></div><button class="add-row-btn" id="add-process">＋ 加工方法を追加</button></div><div class="card"><h2><span class="n">3</span>加工オプション単価</h2><div class="field"><label>穴あけ加工(1穴あたり・円)</label><input type="number" id="hole-price"></div><div class="field"><label>色追加(1色増えるごと・円/枚)</label><input type="number" id="color-price"></div><div class="field"><label>変形加工の追加料金(円/枚)</label><input type="number" id="shape-price"></div></div><div class="card"><h2><span class="n">4</span>版代・数量割引</h2><div class="field"><label>版代(円・固定)</label><input type="number" id="plate-price"></div><div class="field"><label>支給材有りの加工費率（例：0.5＝50％）</label><input type="number" id="supplied-material-rate" min="0" step="0.01"></div><div class="field"><label>データ有りの版代(円)</label><input type="number" id="data-plate-price"></div><div class="discount-row"><span>枚数(以上)</span><span>割引率(例:0.9=10%引)</span><span></span></div><div id="discount-table"></div><button class="add-row-btn" id="add-discount">＋ 割引ラインを追加</button></div><button class="save-btn" id="save-settings-btn">この内容で保存する</button><div class="save-status" id="save-status">&nbsp;</div></div></div>
<script>
const DEFAULT_SETTINGS={materials:[{name:"アルミ",thicknesses:[{mm:.3,price:.3},{mm:.5,price:.5},{mm:.8,price:.8},{mm:1,price:1},{mm:1.5,price:1.5},{mm:2,price:2}]},{name:"ステンレス",thicknesses:[{mm:.3,price:.72},{mm:.5,price:1.2},{mm:.8,price:1.92},{mm:1,price:2.4},{mm:1.5,price:3.6},{mm:2,price:4.8}]},{name:"真鍮・銅",thicknesses:[{mm:.3,price:1.08},{mm:.5,price:1.8},{mm:.8,price:2.88},{mm:1,price:3.6},{mm:1.5,price:5.4},{mm:2,price:7.2}]}],processes:[{name:"アルマイト印刷",price:150},{name:"UVインクジェット",price:200},{name:"シルク印刷",price:180},{name:"エッチング",price:400},{name:"レーザー彫刻",price:250}],holePrice:50,colorPrice:80,shapePrice:300,platePrice:9500,suppliedMaterialRate:.5,dataPlatePrice:4500,discounts:[{min:100,rate:.9},{min:300,rate:.8},{min:500,rate:.7}]};
const SETTINGS_KEY="meiban-price-settings";let settings=JSON.parse(JSON.stringify(DEFAULT_SETTINGS));const $=id=>document.getElementById(id),materialSelect=$("material"),thicknessSelect=$("thickness"),processSelect=$("process"),widthInput=$("width"),heightInput=$("height"),quantityInput=$("quantity"),holesInput=$("holes"),colorsInput=$("colors"),includePlateCheckbox=$("include-plate"),suppliedMaterialCheckbox=$("supplied-material"),dataAvailableCheckbox=$("data-available"),shapeGroup=$("shape-group");let selectedShape="rect";
document.querySelectorAll(".tab-btn").forEach(btn=>btn.addEventListener("click",()=>{document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));btn.classList.add("active");$("panel-"+btn.dataset.tab).classList.add("active")}));shapeGroup.querySelectorAll(".radio-option").forEach(opt=>opt.addEventListener("click",()=>{shapeGroup.querySelectorAll(".radio-option").forEach(o=>o.classList.remove("selected"));opt.classList.add("selected");selectedShape=opt.dataset.value;calculateQuote()}));
function rebuildSelectOptions(){materialSelect.innerHTML=settings.materials.map((m,i)=>`<option value="${i}">${m.name}</option>`).join("");rebuildThicknessOptions();processSelect.innerHTML=settings.processes.map((p,i)=>`<option value="${i}">${p.name}(¥${p.price}/枚)</option>`).join("")}function rebuildThicknessOptions(){const m=settings.materials[materialSelect.value],ts=m?.thicknesses||[];thicknessSelect.innerHTML=ts.map((t,i)=>`<option value="${i}">${t.mm}mm(¥${t.price}/cm²)</option>`).join("")}materialSelect.addEventListener("change",()=>{rebuildThicknessOptions();calculateQuote()});const yen=n=>"¥"+Math.round(n).toLocaleString();
function calculateQuote(){const material=settings.materials[materialSelect.value],thickness=material?.thicknesses?.[thicknessSelect.value],process=settings.processes[processSelect.value],area=((parseFloat(widthInput.value)||0)/10)*((parseFloat(heightInput.value)||0)/10),quantity=parseInt(quantityInput.value)||0,holes=parseInt(holesInput.value)||0,colors=parseInt(colorsInput.value)||1;const materialCost=thickness?thickness.price*area:0;const baseProcessCost=process?process.price:0;const processCost=suppliedMaterialCheckbox.checked?baseProcessCost*settings.suppliedMaterialRate:baseProcessCost;const holeCost=settings.holePrice*holes,colorCost=settings.colorPrice*Math.max(0,colors-1),shapeCost=selectedShape==="irregular"?settings.shapePrice:0,unitPrice=materialCost+processCost+holeCost+colorCost+shapeCost;let discountRate=1;settings.discounts.slice().sort((a,b)=>a.min-b.min).forEach(d=>{if(quantity>=d.min)discountRate=d.rate});const plateFee=includePlateCheckbox.checked?(dataAvailableCheckbox.checked?settings.dataPlatePrice:settings.platePrice):0,total=unitPrice*quantity*discountRate+plateFee;$("b-material").textContent=yen(materialCost);$("b-process").textContent=yen(processCost);$("b-hole").textContent=yen(holeCost);$("b-color").textContent=yen(colorCost);$("b-shape").textContent=yen(shapeCost);$("b-unit").textContent=yen(unitPrice);$("b-discount").textContent="×"+discountRate.toFixed(2);$("b-plate").textContent=yen(plateFee);$("b-total").textContent=yen(total);$("result-total").textContent=yen(total)}
[materialSelect,thicknessSelect,processSelect,widthInput,heightInput,quantityInput,holesInput,colorsInput,includePlateCheckbox,suppliedMaterialCheckbox,dataAvailableCheckbox].forEach(el=>{el.addEventListener("input",calculateQuote);el.addEventListener("change",calculateQuote)});
function renderMaterialTable(){const c=$("material-table");c.innerHTML="";settings.materials.forEach((m,mi)=>{const b=document.createElement("div");b.className="material-block";b.innerHTML=`<div class="material-block-header"><input type="text" value="${m.name}" data-name><button class="icon-btn">✕</button></div><div class="ths"></div><button class="add-thickness-btn">＋ 板厚を追加</button>`;b.querySelector("[data-name]").oninput=e=>settings.materials[mi].name=e.target.value;b.querySelector(".icon-btn").onclick=()=>{settings.materials.splice(mi,1);renderMaterialTable()};const tc=b.querySelector(".ths");m.thicknesses.forEach((t,ti)=>{const r=document.createElement("div");r.className="thickness-row";r.innerHTML=`<input type="number" value="${t.mm}" step="0.1"><input type="number" value="${t.price}" step="0.01"><button class="icon-btn">✕</button>`;const ins=r.querySelectorAll("input");ins[0].oninput=e=>settings.materials[mi].thicknesses[ti].mm=parseFloat(e.target.value)||0;ins[1].oninput=e=>settings.materials[mi].thicknesses[ti].price=parseFloat(e.target.value)||0;r.querySelector("button").onclick=()=>{settings.materials[mi].thicknesses.splice(ti,1);renderMaterialTable()};tc.appendChild(r)});b.querySelector(".add-thickness-btn").onclick=()=>{settings.materials[mi].thicknesses.push({mm:.5,price:0});renderMaterialTable()};c.appendChild(b)})}
function renderProcessTable(){const c=$("process-table");c.innerHTML="";settings.processes.forEach((p,i)=>{const r=document.createElement("div");r.className="price-row";r.innerHTML=`<input type="text" value="${p.name}"><input type="number" value="${p.price}"><button class="icon-btn">✕</button>`;const ins=r.querySelectorAll("input");ins[0].oninput=e=>settings.processes[i].name=e.target.value;ins[1].oninput=e=>settings.processes[i].price=parseFloat(e.target.value)||0;r.querySelector("button").onclick=()=>{settings.processes.splice(i,1);renderProcessTable()};c.appendChild(r)})}function renderDiscountTable(){const c=$("discount-table");c.innerHTML="";settings.discounts.forEach((d,i)=>{const r=document.createElement("div");r.className="discount-row";r.innerHTML=`<input type="number" value="${d.min}"><input type="number" value="${d.rate}" step=".01"><button class="icon-btn">✕</button>`;const ins=r.querySelectorAll("input");ins[0].oninput=e=>settings.discounts[i].min=parseInt(e.target.value)||0;ins[1].oninput=e=>settings.discounts[i].rate=parseFloat(e.target.value)||1;r.querySelector("button").onclick=()=>{settings.discounts.splice(i,1);renderDiscountTable()};c.appendChild(r)})}
function renderAllSettingsUI(){renderMaterialTable();renderProcessTable();renderDiscountTable();$("hole-price").value=settings.holePrice;$("color-price").value=settings.colorPrice;$("shape-price").value=settings.shapePrice;$("plate-price").value=settings.platePrice;$("supplied-material-rate").value=settings.suppliedMaterialRate;$("data-plate-price").value=settings.dataPlatePrice;rebuildSelectOptions()}
$("add-material").onclick=()=>{settings.materials.push({name:"新しい材質",thicknesses:[{mm:.5,price:0}]});renderMaterialTable()};$("add-process").onclick=()=>{settings.processes.push({name:"新しい加工方法",price:0});renderProcessTable()};$("add-discount").onclick=()=>{settings.discounts.push({min:0,rate:1});renderDiscountTable()};$("hole-price").oninput=e=>settings.holePrice=parseFloat(e.target.value)||0;$("color-price").oninput=e=>settings.colorPrice=parseFloat(e.target.value)||0;$("shape-price").oninput=e=>settings.shapePrice=parseFloat(e.target.value)||0;$("plate-price").oninput=e=>settings.platePrice=parseFloat(e.target.value)||0;$("supplied-material-rate").oninput=e=>settings.suppliedMaterialRate=parseFloat(e.target.value);$("data-plate-price").oninput=e=>settings.dataPlatePrice=parseFloat(e.target.value)||0;
function saveSettings(){const s=$("save-status");try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));s.textContent="保存しました。見積もりタブに反映されています。";rebuildSelectOptions();calculateQuote()}catch(e){s.textContent="保存に失敗しました。"}setTimeout(()=>s.textContent="\u00a0",3000)}function loadSettings(){try{const saved=localStorage.getItem(SETTINGS_KEY);if(saved){settings=JSON.parse(saved);if(settings.platePrice===8000)settings.platePrice=9500;if(typeof settings.suppliedMaterialRate!=="number")settings.suppliedMaterialRate=.5;if(typeof settings.dataPlatePrice!=="number")settings.dataPlatePrice=4500;localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings))}}catch(e){settings=JSON.parse(JSON.stringify(DEFAULT_SETTINGS))}renderAllSettingsUI();calculateQuote()}$("save-settings-btn").onclick=saveSettings;loadSettings();
</script></body></html>
