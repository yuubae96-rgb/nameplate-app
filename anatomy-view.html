<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10243f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="骨格・内臓学習アプリ">
  <link rel="manifest" href="anatomy-view-manifest.json?v=5">
  <title>骨格・内臓学習アプリ</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#10243f;background:#edf3f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(34px + env(safe-area-inset-bottom))}h1{font-size:28px;margin:5px 0}.lead{margin:5px 0 16px;color:#475569}.card{background:#fff;border-radius:20px;padding:15px;box-shadow:0 8px 28px #16324f12}.pick{display:block;border:2px dashed #8da1b5;border-radius:15px;padding:19px;text-align:center;font-weight:900;background:#f8fafc}.pick input{display:none}.go{width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:900;background:#16a34a;color:white;margin-top:12px}.go:disabled{opacity:.42}.viewer{display:none;position:relative;background:#0b1728;border-radius:16px;overflow:hidden;margin-top:14px;touch-action:manipulation}.viewer canvas{display:block;width:100%;height:auto}.badge{display:none;position:absolute;left:9px;top:9px;background:#07111dcc;color:white;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800;backdrop-filter:blur(5px)}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.modes button{border:1px solid #cad5df;background:white;border-radius:12px;padding:12px 3px;font-weight:800;color:#253b50}.modes button.active{background:#10243f;color:white;border-color:#10243f}.status{text-align:center;font-weight:800;color:#526579;margin:11px 4px;min-height:21px}.status.error{color:#b91c1c}.slider{display:flex;gap:10px;align-items:center;margin-top:12px}.slider input{width:100%;accent-color:#16a34a}.note{font-size:12px;line-height:1.55;color:#8c3c0d;background:#fff7ed;border:1px solid #fed7aa;padding:11px;border-radius:12px;margin-top:13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.actions button{padding:12px;border:1px solid #cbd5e1;border-radius:12px;background:white;font-weight:800}.small{font-size:11px;color:#64748b;text-align:center;margin:9px 0 0}
  </style>
</head>
<body><main class="wrap">
  <h1>骨格・内臓学習アプリ</h1><p class="lead">人物の姿勢・肩幅・骨盤・手足の長さに合わせて標準人体モデルを重ねます。</p>
  <section class="card">
    <label class="pick">📷 人物の写真を選ぶ<input id="file" type="file" accept="image/*"></label>
    <div id="status" class="status">正面を向いた上半身または全身写真を選んでください</div>
    <button id="analyze" class="go" disabled>写真を読み取る</button>
    <div id="viewer" class="viewer"><canvas id="canvas"></canvas><div id="badge" class="badge">標準人体モデル（推定）</div></div>
    <div id="controls" hidden>
      <div class="modes"><button data-mode="skin" class="active">👤 肌</button><button data-mode="muscle">💪 筋肉</button><button data-mode="skeleton">🦴 骨格</button><button data-mode="organs">🫀 内臓</button><button data-mode="combo">🩻 骨＋内臓</button><button data-mode="transparent">🔀 半透明</button></div>
      <div class="slider"><span>濃さ</span><input id="opacity" type="range" min="0" max="100" value="72"><b id="opacityVal">72%</b></div>
      <div class="actions"><button id="save">画像を保存</button><button id="another">別の写真</button></div>
      <p class="small">正面に近く、頭から足先まで写った写真ほど自然に重なります。</p>
    </div>
  </section>
  <p class="note"><b>重要：</b>これは教育・観察用の推定表示です。写真から本人の実際の骨・筋肉・臓器を透視したものではなく、医療診断には使用できません。</p>
</main>
<script type="module">
const $=s=>document.querySelector(s),file=$('#file'),analyze=$('#analyze'),statusEl=$('#status'),viewer=$('#viewer'),controls=$('#controls'),canvas=$('#canvas'),ctx=canvas.getContext('2d'),opacity=$('#opacity'),opacityVal=$('#opacityVal'),badge=$('#badge');
let img=null,landmarks=null,landmarker=null,mode='skin',objectURL='';
const CDN='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const anatomyArt={skeleton:new Image(),organs:new Image()};
anatomyArt.skeleton.src='anatomy-assets/skeleton-real.webp?v=1';
anatomyArt.organs.src='anatomy-assets/organs-real.webp?v=1';
Object.values(anatomyArt).forEach(x=>x.onload=()=>landmarks&&render());
file.addEventListener('change',()=>{const f=file.files?.[0];if(!f)return;if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(f);img=new Image();img.onload=()=>{analyze.disabled=false;status('写真を読み込みました。「写真を読み取る」を押してください');render()};img.onerror=()=>status('写真を開けませんでした。別の写真を選んでください',true);img.src=objectURL});
function status(t,error=false){statusEl.textContent=t;statusEl.classList.toggle('error',error)}
async function makeLandmarker(vision,delegate){return vision.PoseLandmarker.createFromOptions(await vision.FilesetResolver.forVisionTasks(CDN+'/wasm'),{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate},runningMode:'IMAGE',numPoses:1,minPoseDetectionConfidence:.45,minPosePresenceConfidence:.45,minTrackingConfidence:.45})}
async function initPose(){if(landmarker)return;status('姿勢AIを準備しています…');let vision;try{vision=await import(CDN+'/+esm')}catch(e){throw new Error('LIBRARY_LOAD')}try{landmarker=await makeLandmarker(vision,'GPU')}catch(gpuError){status('iPhone互換モードで姿勢AIを準備しています…');try{landmarker=await makeLandmarker(vision,'CPU')}catch(cpuError){console.error({gpuError,cpuError});throw new Error('MODEL_LOAD')}}}
if(new URLSearchParams(location.search).has('selftest')){initPose().then(()=>status('姿勢AIの起動確認OK。人物写真を選んでください')).catch(e=>status('姿勢AIの起動確認に失敗しました：'+e.message,true))}
analyze.addEventListener('click',async()=>{if(!img)return;analyze.disabled=true;try{await initPose();status('身体の位置を解析しています…');const result=landmarker.detect(img);landmarks=result.landmarks?.[0]||null;if(!landmarks){status('人物を認識できませんでした。正面に近い写真を選んでください',true);return}viewer.style.display='block';controls.hidden=false;badge.style.display='block';status('肩・骨盤・手足の位置まで読み取りました');render()}catch(e){console.error(e);status(e.message==='LIBRARY_LOAD'?'姿勢AIの通信読込に失敗しました。通信状態を確認して再度お試しください':'姿勢AIを起動できませんでした。Safariを閉じて再度お試しください',true)}finally{analyze.disabled=false}});
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;render()}));
opacity.addEventListener('input',()=>{opacityVal.textContent=opacity.value+'%';render()});
$('#another').addEventListener('click',()=>location.reload());
$('#save').addEventListener('click',()=>{canvas.toBlob(blob=>{const a=document.createElement('a');a.download='anatomy-view.png';a.href=URL.createObjectURL(blob);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png')});
function fit(){const s=Math.min(1,1400/img.naturalWidth,1400/img.naturalHeight);canvas.width=Math.max(1,Math.round(img.naturalWidth*s));canvas.height=Math.max(1,Math.round(img.naturalHeight*s))}
function p(i,fallback=null,min=.18){const q=landmarks?.[i];return q&&q.visibility>min&&q.x>=-.05&&q.x<=1.05&&q.y>=-.05&&q.y<=1.05?{x:q.x*canvas.width,y:q.y*canvas.height}:fallback}
const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2}),dist=(a,b)=>Math.hypot(b.x-a.x,b.y-a.y);
function frame(){const ls=p(11),rs=p(12),lh=p(23),rh=p(24);if(!ls||!rs)return null;const shoulders=mid(ls,rs),sw=Math.max(30,dist(ls,rs));const hips=(lh&&rh)?mid(lh,rh):{x:shoulders.x,y:shoulders.y+sw*1.22};const hw=(lh&&rh)?dist(lh,rh):sw*.72;const torso=Math.max(sw*.72,dist(shoulders,hips));const angle=Math.atan2(hips.y-shoulders.y,hips.x-shoulders.x)-Math.PI/2;const nose=p(0,{x:shoulders.x,y:shoulders.y-sw*.68});const ears=[p(7),p(8)].filter(Boolean);const headW=ears.length===2?dist(ears[0],ears[1]):sw*.38;return{ls,rs,lh,rh,shoulders,hips,sw,hw,torso,angle,nose,headR:Math.max(sw*.16,headW*.56)}}
function local(B,fn){ctx.save();ctx.translate(B.shoulders.x,B.shoulders.y);ctx.rotate(B.angle);fn();ctx.restore()}
function path(fill,stroke,draw){ctx.beginPath();draw();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function limbShape(A,C,wA,wC,fill,stroke,a=1){if(!A||!C)return;const dx=C.x-A.x,dy=C.y-A.y,L=Math.hypot(dx,dy);if(L<7)return;const nx=-dy/L,ny=dx/L;ctx.save();ctx.globalAlpha*=a;const g=ctx.createLinearGradient(A.x+nx*wA,A.y+ny*wA,A.x-nx*wA,A.y-ny*wA);g.addColorStop(0,'#63151c');g.addColorStop(.34,fill);g.addColorStop(.55,'#db7465');g.addColorStop(1,'#5c1218');ctx.lineWidth=Math.max(1,(wA+wC)*.035);path(g,stroke,()=>{ctx.moveTo(A.x+nx*wA,A.y+ny*wA);ctx.bezierCurveTo(A.x+dx*.28+nx*wA*.96,A.y+dy*.28+ny*wA*.96,A.x+dx*.70+nx*wC*1.06,A.y+dy*.70+ny*wC*1.06,C.x+nx*wC,C.y+ny*wC);ctx.lineTo(C.x-nx*wC,C.y-ny*wC);ctx.bezierCurveTo(A.x+dx*.70-nx*wC*1.06,A.y+dy*.70-ny*wC*1.06,A.x+dx*.28-nx*wA*.96,A.y+dy*.28-ny*wA*.96,A.x-nx*wA,A.y-ny*wA);ctx.closePath()});ctx.strokeStyle='rgba(255,211,193,.35)';ctx.lineWidth=Math.max(1,(wA+wC)*.025);ctx.beginPath();ctx.moveTo(A.x+nx*wA*.20,A.y+ny*wA*.20);ctx.lineTo(C.x+nx*wC*.14,C.y+ny*wC*.14);ctx.stroke();ctx.restore()}
function drawMuscles(B,a=1){ctx.save();ctx.globalAlpha=a;local(B,()=>{const g=ctx.createLinearGradient(-B.sw*.55,0,B.sw*.55,0);g.addColorStop(0,'#64151c');g.addColorStop(.26,'#b43a3d');g.addColorStop(.5,'#dc7664');g.addColorStop(.74,'#b43a3d');g.addColorStop(1,'#64151c');ctx.lineWidth=Math.max(1,B.sw*.012);path(g,'#681b22',()=>{ctx.moveTo(-B.sw*.50,0);ctx.bezierCurveTo(-B.sw*.56,B.torso*.24,-B.sw*.42,B.torso*.62,-B.hw*.48,B.torso);ctx.quadraticCurveTo(0,B.torso*1.06,B.hw*.48,B.torso);ctx.bezierCurveTo(B.sw*.42,B.torso*.62,B.sw*.56,B.torso*.24,B.sw*.50,0);ctx.quadraticCurveTo(0,B.torso*.16,-B.sw*.50,0);ctx.closePath()});ctx.strokeStyle='rgba(255,220,202,.48)';ctx.lineWidth=Math.max(1,B.sw*.01);ctx.beginPath();ctx.moveTo(0,B.torso*.18);ctx.lineTo(0,B.torso*.91);for(let y=.34;y<.88;y+=.13){ctx.moveTo(-B.sw*.22,B.torso*y);ctx.quadraticCurveTo(0,B.torso*(y+.035),B.sw*.22,B.torso*y)}ctx.stroke()});const segs=[[11,13,.16,.12],[13,15,.13,.08],[12,14,.16,.12],[14,16,.13,.08],[23,25,.19,.14],[25,27,.15,.10],[24,26,.19,.14],[26,28,.15,.10]];segs.forEach(([i,j,wa,wc])=>limbShape(p(i,null,.30),p(j,null,.30),B.sw*wa,B.sw*wc,'#b83c40','#6a1c22'));ctx.restore()}
function cropBetween(art,src,A,C,outW,a){if(!A||!C)return;const dx=C.x-A.x,dy=C.y-A.y,L=Math.hypot(dx,dy);if(L<8)return;ctx.save();ctx.globalAlpha=a;ctx.translate((A.x+C.x)/2,(A.y+C.y)/2);ctx.rotate(Math.atan2(dy,dx)-Math.PI/2);ctx.drawImage(art,src[0],src[1],src[2],src[3],-outW/2,-L*.51,outW,L*1.02);ctx.restore()}
function proceduralBone(A,C,w,a){if(!A||!C)return;ctx.save();ctx.globalAlpha=a;ctx.strokeStyle='#eee6cf';ctx.lineCap='round';ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(C.x,C.y);ctx.stroke();ctx.strokeStyle='rgba(112,101,82,.55)';ctx.lineWidth=Math.max(1,w*.12);ctx.stroke();ctx.restore()}
function realSkeleton(B,a){const art=anatomyArt.skeleton;if(!art.complete||!art.naturalWidth){[[11,13],[13,15],[12,14],[14,16],[23,25],[25,27],[24,26],[26,28]].forEach(([i,j])=>proceduralBone(p(i),p(j),B.sw*.055,a));return}const L=p(11,null,.30),R=p(12,null,.30),HL=p(23,null,.35),HR=p(24,null,.35),shoulders=L&&R?mid(L,R):B.shoulders,hips=HL&&HR?mid(HL,HR):B.hips;ctx.save();ctx.globalAlpha=a;ctx.save();ctx.translate(B.nose.x,B.nose.y-B.headR*.05);ctx.rotate(B.angle);ctx.drawImage(art,270,0,170,170,-B.headR*.72,-B.headR*.93,B.headR*1.44,B.headR*1.78);ctx.restore();const torsoLen=Math.max(B.sw*.72,dist(shoulders,hips));ctx.save();ctx.translate(shoulders.x,shoulders.y);ctx.rotate(B.angle);ctx.drawImage(art,190,150,325,340,-B.sw*.50,-B.sw*.05,B.sw,torsoLen*.78);ctx.restore();if(HL&&HR){ctx.save();ctx.translate(hips.x,hips.y);ctx.rotate(B.angle);ctx.drawImage(art,205,455,300,205,-B.hw*.62,-torsoLen*.17,B.hw*1.24,torsoLen*.31);ctx.restore()}cropBetween(art,[155,175,105,285],p(11,null,.30),p(13,null,.30),B.sw*.17,a);cropBetween(art,[90,405,135,300],p(13,null,.30),p(15,null,.30),B.sw*.16,a);cropBetween(art,[447,175,105,285],p(12,null,.30),p(14,null,.30),B.sw*.17,a);cropBetween(art,[480,405,135,300],p(14,null,.30),p(16,null,.30),B.sw*.16,a);cropBetween(art,[220,570,115,310],p(23,null,.40),p(25,null,.40),B.sw*.21,a);cropBetween(art,[230,830,120,365],p(25,null,.42),p(27,null,.42),B.sw*.18,a);cropBetween(art,[372,570,115,310],p(24,null,.40),p(26,null,.40),B.sw*.21,a);cropBetween(art,[357,830,120,365],p(26,null,.42),p(28,null,.42),B.sw*.18,a);ctx.restore()}
function drawOrgansFallback(B,a=1){ctx.save();ctx.globalAlpha=a;local(B,()=>{const w=B.sw,L=B.torso;ctx.lineWidth=Math.max(1,w*.008);path('#d87980','#7f1d1d',()=>{ctx.ellipse(-w*.17,L*.28,w*.19,L*.19,-.08,0,Math.PI*2)});path('#d87980','#7f1d1d',()=>{ctx.ellipse(w*.17,L*.28,w*.19,L*.19,.08,0,Math.PI*2)});path('#a81620','#670b13',()=>{ctx.ellipse(w*.02,L*.37,w*.10,L*.14,-.18,0,Math.PI*2)});path('#713b25','#422015',()=>{ctx.ellipse(-w*.06,L*.57,w*.31,L*.11,.04,0,Math.PI*2)});path('#dc8b4b','#8c4c22',()=>{ctx.ellipse(w*.10,L*.68,w*.16,L*.16,.18,0,Math.PI*2)});ctx.strokeStyle='#c98562';ctx.lineWidth=w*.065;ctx.beginPath();ctx.ellipse(0,L*.84,w*.27,L*.16,0,0,Math.PI*2);ctx.stroke()});ctx.restore()}
function realOrgans(B,a){const art=anatomyArt.organs;if(!art.complete||!art.naturalWidth){drawOrgansFallback(B,a);return}ctx.save();ctx.globalAlpha=a;ctx.save();ctx.translate(B.shoulders.x,B.shoulders.y);ctx.rotate(B.angle);ctx.beginPath();ctx.moveTo(-B.sw*.43,B.torso*.08);ctx.bezierCurveTo(-B.sw*.43,B.torso*.40,-B.hw*.42,B.torso*.72,-B.hw*.38,B.torso*.96);ctx.quadraticCurveTo(0,B.torso*1.01,B.hw*.38,B.torso*.96);ctx.bezierCurveTo(B.hw*.42,B.torso*.72,B.sw*.43,B.torso*.40,B.sw*.43,B.torso*.08);ctx.closePath();ctx.clip();const w=B.sw*.72,h=B.torso*.88;ctx.drawImage(art,-w/2,B.torso*.08,w,h);ctx.restore();ctx.restore()}
function render(){if(!img)return;fit();ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);if(mode==='skin'||!landmarks)return;const B=frame();if(!B)return;const a=Number(opacity.value)/100;if(mode==='muscle')drawMuscles(B,a);if(mode==='skeleton')realSkeleton(B,a);if(mode==='organs')realOrgans(B,a);if(mode==='combo'){realSkeleton(B,a*.58);realOrgans(B,a*.92)}if(mode==='transparent'){ctx.save();ctx.fillStyle='rgba(226,239,246,.12)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.restore();drawMuscles(B,a*.22);realSkeleton(B,a*.38);realOrgans(B,a*.58)}}
</script></body></html>
