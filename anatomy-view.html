<style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#10243f;background:#edf3f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(34px + env(safe-area-inset-bottom))}h1{font-size:28px;margin:5px 0}.lead{margin:5px 0 16px;color:#475569}.card{background:#fff;border-radius:20px;padding:15px;box-shadow:0 8px 28px #16324f12}.pick{display:block;border:2px dashed #8da1b5;border-radius:15px;padding:19px;text-align:center;font-weight:900;background:#f8fafc}.pick input{display:none}.go{width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:900;background:#16a34a;color:#fff;margin-top:12px}.go:disabled{opacity:.42}.viewer{display:none;position:relative;background:#0b1728;border-radius:16px;overflow:hidden;margin-top:14px}.viewer canvas{display:block;width:100%;height:auto}.badge{display:none;position:absolute;left:9px;top:9px;background:#07111dcc;color:#fff;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.modes button{border:1px solid #cad5df;background:#fff;border-radius:12px;padding:12px 3px;font-weight:800;color:#253b50}.modes button.active{background:#10243f;color:#fff;border-color:#10243f}.status{text-align:center;font-weight:800;color:#526579;margin:11px 4px;min-height:21px}.status.error{color:#b91c1c}.slider{display:flex;gap:10px;align-items:center;margin-top:12px}.slider input{width:100%;accent-color:#16a34a}.note{font-size:12px;line-height:1.55;color:#8c3c0d;background:#fff7ed;border:1px solid #fed7aa;padding:11px;border-radius:12px;margin-top:13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.actions button{padding:12px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;font-weight:800}.small{font-size:11px;color:#64748b;text-align:center;margin:9px 0 0}</style></head>
<body><main class="wrap"><h1>骨格・内臓学習アプリ</h1><p class="lead">写真の関節位置に合わせて標準人体モデルを重ねます。</p><section class="card"><label class="pick">📷 人物の写真を選ぶ<input id="file" type="file" accept="image/*"></label><div id="status" class="status">正面を向いた全身写真を選んでください</div><button id="analyze" class="go" disabled>写真を読み取る</button><div id="viewer" class="viewer"><canvas id="canvas"></canvas><div id="badge" class="badge">標準人体モデル（推定）</div></div><div id="controls" hidden><div class="modes"><button data-mode="skin" class="active">👤 肌</button><button data-mode="muscle">💪 筋肉</button><button data-mode="skeleton">🦴 骨格</button><button data-mode="organs">🫀 内臓</button><button data-mode="combo">🩻 骨＋内臓</button><button data-mode="transparent">🔀 半透明</button></div><div class="slider"><span>濃さ</span><input id="opacity" type="range" min="0" max="100" value="62"><b id="opacityVal">62%</b></div><div class="actions"><button id="save">画像を保存</button><button id="another">別の写真</button></div><p class="small">正面に近い全身写真向け。表示は教育用の推定です。</p></div></section><p class="note"><b>重要：</b>写真から本人の実際の骨・筋肉・臓器を透視したものではなく、医療診断には使用できません。</p></main>
<script type="module">
const $=s=>document.querySelector(s),file=$('#file'),analyze=$('#analyze'),statusEl=$('#status'),viewer=$('#viewer'),controls=$('#controls'),canvas=$('#canvas'),ctx=canvas.getContext('2d'),opacity=$('#opacity'),opacityVal=$('#opacityVal'),badge=$('#badge');let img=null,landmarks=null,landmarker=null,mode='skin',objectURL='';const CDN='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
file.onchange=()=>{const f=file.files?.[0];if(!f)return;if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(f);img=new Image();img.onload=()=>{analyze.disabled=false;status('写真を読み込みました。「写真を読み取る」を押してください');render()};img.src=objectURL};function status(t,e=false){statusEl.textContent=t;statusEl.classList.toggle('error',e)}
async function initPose(){if(landmarker)return;status('姿勢AIを準備しています…');const vision=await import(CDN+'/+esm');const files=await vision.FilesetResolver.forVisionTasks(CDN+'/wasm');const opts={baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task'},runningMode:'IMAGE',numPoses:1,minPoseDetectionConfidence:.45,minPosePresenceConfidence:.45};try{opts.baseOptions.delegate='GPU';landmarker=await vision.PoseLandmarker.createFromOptions(files,opts)}catch(e){delete opts.baseOptions.delegate;landmarker=await vision.PoseLandmarker.createFromOptions(files,opts)}}
analyze.onclick=async()=>{if(!img)return;analyze.disabled=true;try{await initPose();status('身体の位置を解析しています…');landmarks=landmarker.detect(img).landmarks?.[0]||null;if(!landmarks)throw Error('人物を認識できませんでした');viewer.style.display='block';controls.hidden=false;badge.style.display='block';status('姿勢を読み取りました');render()}catch(e){status(e.message||'姿勢AIを起動できませんでした',true)}finally{analyze.disabled=false}};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;render()});opacity.oninput=()=>{opacityVal.textContent=opacity.value+'%';render()};$('#another').onclick=()=>location.reload();$('#save').onclick=()=>canvas.toBlob(blob=>{const a=document.createElement('a');a.download='anatomy-view.png';a.href=URL.createObjectURL(blob);a.click()},'image/png');
function fit(){const s=Math.min(1,1400/img.naturalWidth,1400/img.naturalHeight);canvas.width=Math.round(img.naturalWidth*s);canvas.height=Math.round(img.naturalHeight*s)}function p(i,min=.22){const q=landmarks?.[i];return q&&q.visibility>min?{x:q.x*canvas.width,y:q.y*canvas.height}:null}const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2}),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function body(){const ls=p(11),rs=p(12),lh=p(23),rh=p(24);if(!ls||!rs||!lh||!rh)return null;return{ls,rs,lh,rh,sc:mid(ls,rs),hc:mid(lh,rh),sw:dist(ls,rs),hw:dist(lh,rh)}}
function limb(A,B,w1,w2,fill,a){if(!A||!B)return;const dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy);if(L<5)return;const nx=-dy/L,ny=dx/L;ctx.save();ctx.globalAlpha=a;ctx.fillStyle=fill;ctx.strokeStyle='rgba(80,20,20,.45)';ctx.lineWidth=Math.max(1,w1*.08);ctx.beginPath();ctx.moveTo(A.x+nx*w1,A.y+ny*w1);ctx.bezierCurveTo(A.x+dx*.35+nx*w1*.92,A.y+dy*.35+ny*w1*.92,A.x+dx*.7+nx*w2*1.05,A.y+dy*.7+ny*w2*1.05,B.x+nx*w2,B.y+ny*w2);ctx.lineTo(B.x-nx*w2,B.y-ny*w2);ctx.bezierCurveTo(A.x+dx*.7-nx*w2*1.05,A.y+dy*.7-ny*w2*1.05,A.x+dx*.35-nx*w1*.92,A.y+dy*.35-ny*w1*.92,A.x-nx*w1,A.y-ny*w1);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
function torso(B,a,fill='#a92f35'){ctx.save();ctx.globalAlpha=a;ctx.fillStyle=fill;ctx.strokeStyle='rgba(80,20,20,.45)';ctx.lineWidth=Math.max(1,B.sw*.01);ctx.beginPath();ctx.moveTo(B.ls.x,B.ls.y);ctx.bezierCurveTo(B.ls.x-B.sw*.03,B.ls.y+B.sw*.45,B.lh.x-B.hw*.08,B.lh.y-B.sw*.15,B.lh.x,B.lh.y);ctx.quadraticCurveTo(B.hc.x,B.hc.y+B.sw*.05,B.rh.x,B.rh.y);ctx.bezierCurveTo(B.rh.x+B.hw*.08,B.rh.y-B.sw*.15,B.rs.x+B.sw*.03,B.rs.y+B.sw*.45,B.rs.x,B.rs.y);ctx.quadraticCurveTo(B.sc.x,B.sc.y+B.sw*.08,B.ls.x,B.ls.y);ctx.fill();ctx.stroke();ctx.restore()}
function muscles(B,a){torso(B,a,'#a7353b');[[11,13,.13,.105],[13,15,.105,.075],[12,14,.13,.105],[14,16,.105,.075],[23,25,.17,.13],[25,27,.13,.09],[24,26,.17,.13],[26,28,.13,.09]].forEach(([i,j,w1,w2])=>limb(p(i,.3),p(j,.3),B.sw*w1,B.sw*w2,'#b84448',a))}
function bone(A,C,w,a){if(!A||!C)return;ctx.save();ctx.globalAlpha=a;ctx.strokeStyle='#e9dfc7';ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(C.x,C.y);ctx.stroke();ctx.restore()}
function skeleton(B,a){const segs=[[11,13],[13,15],[12,14],[14,16],[23,25],[25,27],[24,26],[26,28]];segs.forEach(([i,j])=>bone(p(i,.3),p(j,.3),Math.max(3,B.sw*.035),a));ctx.save();ctx.globalAlpha=a;ctx.strokeStyle='#e9dfc7';ctx.lineWidth=Math.max(2,B.sw*.018);const torsoL=dist(B.sc,B.hc);for(let k=0;k<6;k++){const t=.1+k*.1,y=B.sc.y+(B.hc.y-B.sc.y)*t,x=B.sc.x+(B.hc.x-B.sc.x)*t,w=B.sw*(.38-k*.025);ctx.beginPath();ctx.ellipse(x,y,w,torsoL*.045,0,0,Math.PI*2);ctx.stroke()}bone(B.sc,B.hc,Math.max(3,B.sw*.035),a);ctx.beginPath();ctx.ellipse(B.hc.x,B.hc.y,B.hw*.48,B.sw*.12,0,0,Math.PI*2);ctx.stroke();const nose=p(0,.2),le=p(7,.15),re=p(8,.15);if(nose){const r=le&&re?dist(le,re)*.55:B.sw*.18;ctx.beginPath();ctx.ellipse(nose.x,nose.y,r*.72,r,0,0,Math.PI*2);ctx.stroke()}ctx.restore()}
function organs(B,a){const torsoL=dist(B.sc,B.hc),ang=Math.atan2(B.hc.y-B.sc.y,B.hc.x-B.sc.x)-Math.PI/2;ctx.save();ctx.globalAlpha=a;ctx.translate(B.sc.x,B.sc.y);ctx.rotate(ang);const w=B.sw;function ell(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}ell(-w*.16,torsoL*.28,w*.16,torsoL*.22,'#cf737b');ell(w*.16,torsoL*.28,w*.16,torsoL*.22,'#cf737b');ell(0,torsoL*.37,w*.09,torsoL*.13,'#a81e29');ell(-w*.08,torsoL*.58,w*.29,torsoL*.11,'#75402a');ctx.strokeStyle='#c88662';ctx.lineWidth=w*.06;ctx.beginPath();ctx.roundRect(-w*.24,torsoL*.68,w*.48,torsoL*.25,w*.08);ctx.stroke();ctx.strokeStyle='#e4aa87';ctx.lineWidth=w*.035;for(let i=0;i<4;i++){const y=torsoL*(.72+i*.055);ctx.beginPath();ctx.moveTo(-w*.17,y);ctx.bezierCurveTo(w*.12,y-torsoL*.03,-w*.12,y+torsoL*.03,w*.17,y);ctx.stroke()}ctx.restore()}
function render(){if(!img)return;fit();ctx.drawImage(img,0,0,canvas.width,canvas.height);if(mode==='skin'||!landmarks)return;const B=body();if(!B)return;const a=+opacity.value/100;if(mode==='muscle')muscles(B,a);if(mode==='skeleton')skeleton(B,a);if(mode==='organs')organs(B,a);if(mode==='combo'){skeleton(B,a*.5);organs(B,a*.85)}if(mode==='transparent'){muscles(B,a*.2);skeleton(B,a*.35);organs(B,a*.55)}}
</script></body></html>
