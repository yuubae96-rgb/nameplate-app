<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="人体透視AI">
<link rel="manifest" href="anatomy-view-manifest.json?v=1">
<title>人体透視AI</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0f172a;background:#eef2f7}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(34px + env(safe-area-inset-bottom))}h1{font-size:28px;margin:6px 0}.sub{margin:0 0 14px;color:#64748b;line-height:1.55}.card{background:#fff;border-radius:18px;padding:15px;margin:12px 0;box-shadow:0 4px 20px #0f172a0f}.pick{display:block;border:2px dashed #94a3b8;border-radius:14px;padding:18px;text-align:center;font-size:18px;font-weight:900;background:#f8fafc}.pick input{display:none}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.modes button{border:1px solid #cbd5e1;background:#fff;border-radius:12px;padding:12px 5px;font-size:14px;font-weight:800}.modes button.active{background:#0f172a;color:white;border-color:#0f172a}.viewer{display:none;position:relative;background:#111827;border-radius:16px;overflow:hidden;margin-top:14px}.viewer canvas{display:block;width:100%;height:auto}.status{font-weight:800;text-align:center;margin:10px 0;color:#475569;min-height:22px}.sliderRow{display:flex;align-items:center;gap:10px;margin-top:12px}.sliderRow input{width:100%}.small{font-size:12px;color:#64748b;line-height:1.5}.legend{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.pill{font-size:12px;font-weight:800;padding:5px 8px;border-radius:999px;background:#f1f5f9}.go{width:100%;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:900;background:#16a34a;color:#fff}.go:disabled{opacity:.45}.note{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.55;color:#9a3412}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.actions button{border:1px solid #cbd5e1;border-radius:12px;padding:12px;font-weight:800;background:white}
</style>
</head>
<body><main class="wrap">
<h1>人体透視AI</h1>
<p class="sub">写真の姿勢を推定して、同じ人物・同じポーズに骨格や内臓の標準モデルを重ねて見られます。</p>
<section class="card">
<label class="pick">📷 人物の写真を選ぶ<input id="file" type="file" accept="image/*"></label>
<div id="status" class="status">全身または上半身が写った写真がおすすめです</div>
<button id="analyze" class="go" disabled>写真を読み取る</button>
<div id="viewer" class="viewer"><canvas id="canvas"></canvas></div>
<div id="controls" style="display:none">
<div class="modes" id="modes">
<button data-mode="skin" class="active">👤 肌</button>
<button data-mode="muscle">💪 筋肉</button>
<button data-mode="skeleton">🦴 骨格</button>
<button data-mode="organs">🫀 内臓</button>
<button data-mode="combo">🩻 骨＋内臓</button>
<button data-mode="transparent">🔀 半透明</button>
</div>
<div class="sliderRow"><span>透過</span><input id="opacity" type="range" min="20" max="100" value="85"><strong id="opacityVal">85%</strong></div>
<div class="legend"><span class="pill">心臓</span><span class="pill">肺</span><span class="pill">肝臓</span><span class="pill">胃</span><span class="pill">腸</span></div>
<div class="actions"><button id="save">画像を保存</button><button id="reset">別の写真</button></div>
</div>
</section>
<p class="note">これは教育・観察用の推定表示です。普通の写真から本人の実際の骨や臓器を透視しているわけではなく、医療診断には使えません。</p>
<p class="small">姿勢推定は端末上で行います。人物が小さい、体の一部が隠れている、極端な角度の写真では位置がずれることがあります。</p>
</main>
<script type="module">
const file=document.querySelector('#file'),analyze=document.querySelector('#analyze'),statusEl=document.querySelector('#status'),viewer=document.querySelector('#viewer'),controls=document.querySelector('#controls'),canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),opacity=document.querySelector('#opacity'),opacityVal=document.querySelector('#opacityVal');
let img=null,landmarks=null,mode='skin',poseLandmarker=null;
file.onchange=async()=>{const f=file.files?.[0];if(!f)return;img=new Image();img.onload=()=>{analyze.disabled=false;statusEl.textContent='写真を読み込みました。「写真を読み取る」を押してください';draw()};img.src=URL.createObjectURL(f)};
async function initPose(){if(poseLandmarker)return;statusEl.textContent='姿勢推定AIを準備しています…';const vision=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm');const fileset=await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');poseLandmarker=await vision.PoseLandmarker.createFromOptions(fileset,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task',delegate:'GPU'},runningMode:'IMAGE',numPoses:1});}
analyze.onclick=async()=>{if(!img)return;analyze.disabled=true;try{await initPose();statusEl.textContent='肩・腰・手足の位置を読み取っています…';const r=poseLandmarker.detect(img);landmarks=r.landmarks?.[0]||null;if(landmarks){statusEl.textContent='読み取り完了。下のボタンで切り替えられます';}else{statusEl.textContent='人物を十分に認識できなかったため、標準位置で表示します';}viewer.style.display='block';controls.style.display='block';draw();viewer.scrollIntoView({behavior:'smooth',block:'center'});}catch(e){console.error(e);landmarks=null;statusEl.textContent='姿勢AIを読み込めなかったため、標準位置で表示します';viewer.style.display='block';controls.style.display='block';draw();}finally{analyze.disabled=false}};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;draw()});opacity.oninput=()=>{opacityVal.textContent=opacity.value+'%';draw()};
function fit(){const max=1200,scale=Math.min(1,max/img.naturalWidth,max/img.naturalHeight);canvas.width=Math.round(img.naturalWidth*scale);canvas.height=Math.round(img.naturalHeight*scale)}
function P(i){if(landmarks?.[i])return{x:landmarks[i].x*canvas.width,y:landmarks[i].y*canvas.height};return null}
function fallback(){const w=canvas.width,h=canvas.height;return{ls:{x:w*.42,y:h*.26},rs:{x:w*.58,y:h*.26},lh:{x:w*.45,y:h*.56},rh:{x:w*.55,y:h*.56},nose:{x:w*.5,y:h*.15},le:{x:w*.46,y:h*.73},re:{x:w*.54,y:h*.73},lf:{x:w*.44,y:h*.94},rf:{x:w*.56,y:h*.94},lw:{x:w*.34,y:h*.55},rw:{x:w*.66,y:h*.55}}}
function pts(){const f=fallback();return{ls:P(11)||f.ls,rs:P(12)||f.rs,le:P(13)||{x:f.ls.x-30,y:f.ls.y+120},re:P(14)||{x:f.rs.x+30,y:f.rs.y+120},lw:P(15)||f.lw,rw:P(16)||f.rw,lh:P(23)||f.lh,rh:P(24)||f.rh,lk:P(25)||f.le,rk:P(26)||f.re,la:P(27)||f.lf,ra:P(28)||f.rf,nose:P(0)||f.nose}}
function line(a,b,width=8,color='#f8fafc'){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
function joint(p,r=9,color='#f8fafc'){ctx.fillStyle=color;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill()}
function torsoBox(p){const topY=(p.ls.y+p.rs.y)/2,bottomY=(p.lh.y+p.rh.y)/2,left=Math.min(p.ls.x,p.lh.x),right=Math.max(p.rs.x,p.rh.x);return{cx:(left+right)/2,top:topY,bottom:bottomY,w:Math.max(80,right-left),h:Math.max(120,bottomY-topY)}}
function drawSkeleton(p,a=1){ctx.save();ctx.globalAlpha=a;const midS={x:(p.ls.x+p.rs.x)/2,y:(p.ls.y+p.rs.y)/2},midH={x:(p.lh.x+p.rh.x)/2,y:(p.lh.y+p.rh.y)/2};line(p.ls,p.rs,7);line(midS,midH,9);line(p.lh,p.rh,8);[[p.ls,p.le],[p.le,p.lw],[p.rs,p.re],[p.re,p.rw],[p.lh,p.lk],[p.lk,p.la],[p.rh,p.rk],[p.rk,p.ra]].forEach(([a,b])=>line(a,b,8));[p.ls,p.rs,p.le,p.re,p.lw,p.rw,p.lh,p.rh,p.lk,p.rk,p.la,p.ra].forEach(x=>joint(x,7));const headR=Math.max(22,Math.abs(p.rs.x-p.ls.x)*.17);ctx.strokeStyle='#f8fafc';ctx.lineWidth=7;ctx.beginPath();ctx.arc(p.nose.x,p.nose.y,headR,0,Math.PI*2);ctx.stroke();const t=torsoBox(p);for(let i=0;i<5;i++){ctx.strokeStyle='#f8fafc';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(t.cx,t.top+t.h*(.18+i*.1),t.w*(.28-i*.018),t.h*.08,0,0,Math.PI*2);ctx.stroke()}ctx.restore()}
function drawMuscle(p,a=1){ctx.save();ctx.globalAlpha=a;ctx.fillStyle='#b91c1c';ctx.strokeStyle='#7f1d1d';ctx.lineWidth=2;const limbs=[[p.ls,p.le,18],[p.le,p.lw,14],[p.rs,p.re,18],[p.re,p.rw,14],[p.lh,p.lk,23],[p.lk,p.la,18],[p.rh,p.rk,23],[p.rk,p.ra,18]];limbs.forEach(([a,b,w])=>line(a,b,w,'#b91c1c'));const t=torsoBox(p);ctx.beginPath();ctx.ellipse(t.cx,t.top+t.h*.45,t.w*.38,t.h*.43,0,0,Math.PI*2);ctx.fill();ctx.restore()}
function organEllipse(x,y,rx,ry,color,a){ctx.save();ctx.globalAlpha=a;ctx.fillStyle=color;ctx.strokeStyle='#ffffffcc';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore()}
function drawOrgans(p,a=1){const t=torsoBox(p),cx=t.cx,top=t.top,w=t.w,h=t.h;organEllipse(cx-w*.14,top+h*.28,w*.13,h*.19,'#60a5fa',a);organEllipse(cx+w*.14,top+h*.28,w*.13,h*.19,'#60a5fa',a);organEllipse(cx+w*.03,top+h*.32,w*.07,h*.09,'#ef4444',a);organEllipse(cx+w*.12,top+h*.55,w*.18,h*.09,'#92400e',a);organEllipse(cx-w*.10,top+h*.57,w*.10,h*.11,'#f59e0b',a);organEllipse(cx,top+h*.78,w*.28,h*.16,'#f97316',a)}
function draw(){if(!img)return;fit();ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);const p=pts(),a=Number(opacity.value)/100;if(mode==='skin')return;if(mode==='transparent'){ctx.fillStyle=`rgba(255,255,255,${.42*(1-a+.2)})`;ctx.fillRect(0,0,canvas.width,canvas.height);drawSkeleton(p,a*.72);drawOrgans(p,a*.9);return}if(mode==='muscle')drawMuscle(p,a);if(mode==='skeleton')drawSkeleton(p,a);if(mode==='organs')drawOrgans(p,a);if(mode==='combo'){drawSkeleton(p,a*.78);drawOrgans(p,a*.92)}}
document.querySelector('#save').onclick=()=>{const a=document.createElement('a');a.download='anatomy-view.png';a.href=canvas.toDataURL('image/png');a.click()};document.querySelector('#reset').onclick=()=>{location.reload()};
</script>
</body></html>
