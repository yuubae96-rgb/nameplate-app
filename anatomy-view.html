<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="人体透視AI"><link rel="manifest" href="anatomy-view-manifest.json?v=2"><title>人体透視AI</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0f172a;background:#eef2f7}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(34px + env(safe-area-inset-bottom))}.card{background:#fff;border-radius:18px;padding:15px;margin:12px 0}.pick{display:block;border:2px dashed #94a3b8;border-radius:14px;padding:18px;text-align:center;font-weight:900}.pick input{display:none}.go{width:100%;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:900;background:#16a34a;color:white}.go:disabled{opacity:.45}.viewer{display:none;background:#111827;border-radius:16px;overflow:hidden;margin-top:14px}.viewer canvas{display:block;width:100%}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.modes button{border:1px solid #cbd5e1;background:white;border-radius:12px;padding:12px 4px;font-weight:800}.modes button.active{background:#0f172a;color:white}.status{text-align:center;font-weight:800;color:#475569;margin:10px}.slider{display:flex;gap:10px;align-items:center;margin-top:12px}.slider input{width:100%}.note{font-size:12px;line-height:1.5;color:#9a3412;background:#fff7ed;padding:10px;border-radius:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.actions button{padding:12px;border:1px solid #cbd5e1;border-radius:12px;background:white;font-weight:800}</style></head><body><main class="wrap"><h1>人体透視AI</h1><p>写真の身体に解剖学的な標準モデルを重ねて観察します。</p><section class="card"><label class="pick">📷 人物の写真を選ぶ<input id="file" type="file" accept="image/*"></label><div id="status" class="status">上半身または全身写真を選んでください</div><button id="analyze" class="go" disabled>写真を読み取る</button><div id="viewer" class="viewer"><canvas id="canvas"></canvas></div><div id="controls" style="display:none"><div class="modes"><button data-mode="skin" class="active">👤 肌</button><button data-mode="muscle">💪 筋肉</button><button data-mode="skeleton">🦴 骨格</button><button data-mode="organs">🫀 内臓</button><button data-mode="combo">🩻 骨＋内臓</button><button data-mode="transparent">🔀 半透明</button></div><div class="slider"><span>透過</span><input id="opacity" type="range" min="20" max="100" value="85"><b id="opacityVal">85%</b></div><div class="actions"><button id="save">画像を保存</button><button onclick="location.reload()">別の写真</button></div></div></section><p class="note">教育・観察用の推定表示です。写真から本人の実際の骨や臓器を透視するものではなく、医療診断には使用できません。</p></main><script type="module">const $=s=>document.querySelector(s),file=$('#file'),analyze=$('#analyze'),statusEl=$('#status'),viewer=$('#viewer'),controls=$('#controls'),canvas=$('#canvas'),ctx=canvas.getContext('2d'),opacity=$('#opacity'),opacityVal=$('#opacityVal');let img,LM,pose,mode='skin';file.onchange=()=>{const f=file.files?.[0];if(!f)return;img=new Image;img.onload=()=>{analyze.disabled=false;statusEl.textContent='写真を読み込みました';draw()};img.src=URL.createObjectURL(f)};async function init(){if(pose)return;statusEl.textContent='姿勢AIを準備しています…';const v=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm');const fs=await v.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');pose=await v.PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task',delegate:'GPU'},runningMode:'IMAGE',numPoses:1})}analyze.onclick=async()=>{analyze.disabled=true;try{await init();LM=pose.detect(img).landmarks?.[0];statusEl.textContent=LM?'身体の位置を読み取りました':'人物を認識できませんでした';if(!LM)return;viewer.style.display='block';controls.style.display='block';draw()}catch(e){statusEl.textContent='姿勢AIの読み込みに失敗しました'}finally{analyze.disabled=false}};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;draw()});opacity.oninput=()=>{opacityVal.textContent=opacity.value+'%';draw()};function fit(){let s=Math.min(1,1200/img.naturalWidth,1200/img.naturalHeight);canvas.width=img.naturalWidth*s;canvas.height=img.naturalHeight*s}function P(i){let p=LM?.[i];return p&&p.visibility>.25?{x:p.x*canvas.width,y:p.y*canvas.height}:null}function body(){let ls=P(11),rs=P(12),lh=P(23),rh=P(24);if(!ls||!rs)return null;let sw=Math.hypot(rs.x-ls.x,rs.y-ls.y),sc={x:(ls.x+rs.x)/2,y:(ls.y+rs.y)/2};if(!lh||!rh){let down=Math.max(sw*1.35,canvas.height*.20);lh={x:sc.x-sw*.32,y:sc.y+down};rh={x:sc.x+sw*.32,y:sc.y+down}}let hc={x:(lh.x+rh.x)/2,y:(lh.y+rh.y)/2},len=Math.hypot(hc.x-sc.x,hc.y-sc.y),ang=Math.atan2(hc.y-sc.y,hc.x-sc.x)-Math.PI/2;return{ls,rs,lh,rh,sc,hc,sw,len,ang}}function bone(a,b,w){if(!a||!b)return;ctx.strokeStyle='#f5f0df';ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.strokeStyle='#a8a29e';ctx.lineWidth=Math.max(1,w*.10);ctx.stroke()}function skeleton(B,a){ctx.save();ctx.globalAlpha=a;let mid={x:(B.sc.x+B.hc.x)/2,y:(B.sc.y+B.hc.y)/2};bone(B.sc,B.hc,Math.max(5,B.sw*.045));bone(B.ls,B.rs,Math.max(5,B.sw*.035));bone(B.lh,B.rh,Math.max(6,B.sw*.05));[[11,13],[13,15],[12,14],[14,16],[23,25],[25,27],[24,26],[26,28]].forEach(q=>bone(P(q[0]),P(q[1]),Math.max(6,B.sw*.055)));ctx.translate(mid.x,mid.y);ctx.rotate(B.ang);ctx.strokeStyle='#f5f0df';ctx.lineWidth=Math.max(3,B.sw*.018);for(let i=0;i<6;i++){let y=-B.len*.36+i*B.len*.105;ctx.beginPath();ctx.ellipse(0,y,B.sw*(.36-i*.012),B.len*.085,0,0,Math.PI*2);ctx.stroke()}ctx.restore()}function organs(B,a){ctx.save();ctx.globalAlpha=a;let ox=B.sc.x,oy=B.sc.y;ctx.translate(ox,oy);ctx.rotate(B.ang);let w=B.sw,L=B.len;function e(x,y,rx,ry,c,rot=0){ctx.fillStyle=c;ctx.strokeStyle='#ffffffbb';ctx.lineWidth=Math.max(1,w*.008);ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot,0,Math.PI*2);ctx.fill();ctx.stroke()}e(-w*.17,L*.25,w*.16,L*.20,'#d98b91',-.10);e(w*.17,L*.25,w*.16,L*.20,'#d98b91',.10);e(w*.035,L*.31,w*.085,L*.105,'#b91c1c',-.10);e(-w*.12,L*.54,w*.27,L*.105,'#8b4513',.06);e(w*.15,L*.56,w*.10,L*.13,'#d97706',.25);ctx.strokeStyle='#d6a76b';ctx.lineWidth=Math.max(7,w*.055);ctx.lineCap='round';ctx.beginPath();for(let i=0;i<6;i++){let y=L*(.67+i*.045),x=(i%2?1:-1)*w*.10;ctx.lineTo(x,y)}ctx.stroke();ctx.restore()}function muscles(B,a){ctx.save();ctx.globalAlpha=a;let mid={x:(B.sc.x+B.hc.x)/2,y:(B.sc.y+B.hc.y)/2};ctx.translate(mid.x,mid.y);ctx.rotate(B.ang);ctx.fillStyle='#a92828';ctx.beginPath();ctx.moveTo(-B.sw*.48,-B.len*.5);ctx.bezierCurveTo(-B.sw*.42,0,-B.sw*.30,B.len*.5,0,B.len*.5);ctx.bezierCurveTo(B.sw*.30,B.len*.5,B.sw*.42,0,B.sw*.48,-B.len*.5);ctx.closePath();ctx.fill();ctx.restore();[[11,13],[13,15],[12,14],[14,16],[23,25],[25,27],[24,26],[26,28]].forEach(q=>bone(P(q[0]),P(q[1]),Math.max(12,B.sw*.12)))}function draw(){if(!img)return;fit();ctx.drawImage(img,0,0,canvas.width,canvas.height);if(mode==='skin'||!LM)return;let B=body();if(!B)return;let a=+opacity.value/100;if(mode==='transparent'){ctx.save();ctx.fillStyle='rgba(255,255,255,.30)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.restore();skeleton(B,a*.65);organs(B,a*.82)}if(mode==='skeleton')skeleton(B,a);if(mode==='organs')organs(B,a);if(mode==='combo'){skeleton(B,a*.7);organs(B,a)}if(mode==='muscle')muscles(B,a)}$('#save').onclick=()=>{let a=document.createElement('a');a.download='anatomy-view.png';a.href=canvas.toDataURL();a.click()};</script></body></html>
