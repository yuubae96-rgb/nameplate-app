<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10243f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="人体透視AI">
  <link rel="manifest" href="anatomy-view-manifest.json?v=3">
  <title>人体透視AI</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#10243f;background:#edf3f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(34px + env(safe-area-inset-bottom))}h1{font-size:28px;margin:5px 0}.lead{margin:5px 0 16px;color:#475569}.card{background:#fff;border-radius:20px;padding:15px;box-shadow:0 8px 28px #16324f12}.pick{display:block;border:2px dashed #8da1b5;border-radius:15px;padding:19px;text-align:center;font-weight:900;background:#f8fafc}.pick input{display:none}.go{width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:900;background:#16a34a;color:white;margin-top:12px}.go:disabled{opacity:.42}.viewer{display:none;position:relative;background:#0b1728;border-radius:16px;overflow:hidden;margin-top:14px;touch-action:manipulation}.viewer canvas{display:block;width:100%;height:auto}.badge{display:none;position:absolute;left:9px;top:9px;background:#07111dcc;color:white;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800;backdrop-filter:blur(5px)}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.modes button{border:1px solid #cad5df;background:white;border-radius:12px;padding:12px 3px;font-weight:800;color:#253b50}.modes button.active{background:#10243f;color:white;border-color:#10243f}.status{text-align:center;font-weight:800;color:#526579;margin:11px 4px;min-height:21px}.status.error{color:#b91c1c}.slider{display:flex;gap:10px;align-items:center;margin-top:12px}.slider input{width:100%;accent-color:#16a34a}.note{font-size:12px;line-height:1.55;color:#8c3c0d;background:#fff7ed;border:1px solid #fed7aa;padding:11px;border-radius:12px;margin-top:13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.actions button{padding:12px;border:1px solid #cbd5e1;border-radius:12px;background:white;font-weight:800}.small{font-size:11px;color:#64748b;text-align:center;margin:9px 0 0}
  </style>
</head>
<body><main class="wrap">
  <h1>人体透視AI</h1><p class="lead">人物の姿勢に標準人体モデルを合わせて観察します。</p>
  <section class="card">
    <label class="pick">📷 人物の写真を選ぶ<input id="file" type="file" accept="image/*"></label>
    <div id="status" class="status">正面を向いた上半身または全身写真を選んでください</div>
    <button id="analyze" class="go" disabled>写真を読み取る</button>
    <div id="viewer" class="viewer"><canvas id="canvas"></canvas><div id="badge" class="badge">標準人体モデル（推定）</div></div>
    <div id="controls" hidden>
      <div class="modes"><button data-mode="skin" class="active">👤 肌</button><button data-mode="muscle">💪 筋肉</button><button data-mode="skeleton">🦴 骨格</button><button data-mode="organs">🫀 内臓</button><button data-mode="combo">🩻 骨＋内臓</button><button data-mode="transparent">🔀 半透明</button></div>
      <div class="slider"><span>濃さ</span><input id="opacity" type="range" min="20" max="100" value="88"><b id="opacityVal">88%</b></div>
      <div class="actions"><button id="save">画像を保存</button><button id="another">別の写真</button></div>
      <p class="small">正面に近く、頭から足先まで写った写真ほど自然に重なります。</p>
    </div>
  </section>
  <p class="note"><b>重要：</b>これは教育・観察用の推定表示です。写真から本人の実際の骨・筋肉・臓器を透視したものではなく、医療診断には使用できません。</p>
</main>
<script type="module">
const $=s=>document.querySelector(s),file=$('#file'),analyze=$('#analyze'),statusEl=$('#status'),viewer=$('#viewer'),controls=$('#controls'),canvas=$('#canvas'),ctx=canvas.getContext('2d'),opacity=$('#opacity'),opacityVal=$('#opacityVal'),badge=$('#badge');
let img=null,landmarks=null,landmarker=null,mode='skin',objectURL='';
const CDN='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
file.addEventListener('change',()=>{const f=file.files?.[0];if(!f)return;if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(f);img=new Image();img.onload=()=>{analyze.disabled=false;status('写真を読み込みました。「写真を読み取る」を押してください');render()};img.onerror=()=>status('写真を開けませんでした。別の写真を選んでください',true);img.src=objectURL});
function status(t,error=false){statusEl.textContent=t;statusEl.classList.toggle('error',error)}
async function makeLandmarker(vision,delegate){return vision.PoseLandmarker.createFromOptions(await vision.FilesetResolver.forVisionTasks(CDN+'/wasm'),{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate},runningMode:'IMAGE',numPoses:1,minPoseDetectionConfidence:.45,minPosePresenceConfidence:.45,minTrackingConfidence:.45})}
async function initPose(){if(landmarker)return;status('姿勢AIを準備しています…');let vision;try{vision=await import(CDN+'/+esm')}catch(e){throw new Error('LIBRARY_LOAD')}
  try{landmarker=await makeLandmarker(vision,'GPU')}catch(gpuError){status('iPhone互換モードで姿勢AIを準備しています…');try{landmarker=await makeLandmarker(vision,'CPU')}catch(cpuError){console.error({gpuError,cpuError});throw new Error('MODEL_LOAD')}}}
if(new URLSearchParams(location.search).has('selftest')){initPose().then(()=>status('姿勢AIの起動確認OK。人物写真を選んでください')).catch(e=>status('姿勢AIの起動確認に失敗しました：'+e.message,true))}
analyze.addEventListener('click',async()=>{if(!img)return;analyze.disabled=true;try{await initPose();status('身体の位置を解析しています…');const result=landmarker.detect(img);landmarks=result.landmarks?.[0]||null;if(!landmarks){status('人物を認識できませんでした。正面に近い写真を選んでください',true);return}viewer.style.display='block';controls.hidden=false;badge.style.display='block';status('身体の位置を読み取りました');render()}catch(e){console.error(e);status(e.message==='LIBRARY_LOAD'?'姿勢AIの通信読込に失敗しました。通信状態を確認して再度お試しください':'姿勢AIを起動できませんでした。Safariを閉じて再度お試しください',true)}finally{analyze.disabled=false}});
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;render()}));
opacity.addEventListener('input',()=>{opacityVal.textContent=opacity.value+'%';render()});
$('#another').addEventListener('click',()=>location.reload());
$('#save').addEventListener('click',()=>{canvas.toBlob(blob=>{const a=document.createElement('a');a.download='anatomy-view.png';a.href=URL.createObjectURL(blob);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png')});
function fit(){const s=Math.min(1,1400/img.naturalWidth,1400/img.naturalHeight);canvas.width=Math.max(1,Math.round(img.naturalWidth*s));canvas.height=Math.max(1,Math.round(img.naturalHeight*s))}
function p(i,fallback=null){const q=landmarks?.[i];return q&&q.visibility>.18?{x:q.x*canvas.width,y:q.y*canvas.height}:fallback}
const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2}),dist=(a,b)=>Math.hypot(b.x-a.x,b.y-a.y);
function frame(){const ls=p(11),rs=p(12),lh=p(23),rh=p(24);if(!ls||!rs)return null;const shoulders=mid(ls,rs),sw=Math.max(30,dist(ls,rs));let hips=(lh&&rh)?mid(lh,rh):{x:shoulders.x,y:shoulders.y+sw*1.25};let hw=(lh&&rh)?dist(lh,rh):sw*.72;const len=Math.max(sw*.75,dist(shoulders,hips));const angle=Math.atan2(hips.y-shoulders.y,hips.x-shoulders.x)-Math.PI/2;const nose=p(0,{x:shoulders.x,y:shoulders.y-sw*.72});return{ls,rs,lh:lh||{x:hips.x-hw/2,y:hips.y},rh:rh||{x:hips.x+hw/2,y:hips.y},shoulders,hips,sw,hw,len,angle,nose,headR:Math.max(sw*.17,dist(nose,shoulders)*.34)}}
function line(a,b,w,color){if(!a||!b)return;ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
function joint(a,r,fill,stroke='#9b8c78'){if(!a)return;ctx.fillStyle=fill;ctx.strokeStyle=stroke;ctx.lineWidth=Math.max(1,r*.12);ctx.beginPath();ctx.arc(a.x,a.y,r,0,Math.PI*2);ctx.fill();ctx.stroke()}
function local(B,fn){ctx.save();ctx.translate(B.shoulders.x,B.shoulders.y);ctx.rotate(B.angle);fn();ctx.restore()}
function path(fill,stroke,draw){ctx.beginPath();draw();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function drawSkeleton(B,a=1){ctx.save();ctx.globalAlpha=a;const ivory='#f1ead5',edge='#897f70';
  const neck={x:B.shoulders.x,y:B.shoulders.y-B.sw*.12};line(B.nose,neck,B.sw*.07,ivory);line(B.shoulders,B.hips,B.sw*.055,ivory);
  const limbs=[[11,13],[13,15],[12,14],[14,16],[23,25],[25,27],[24,26],[26,28]];limbs.forEach(([i,j])=>{const A=p(i),C=p(j);line(A,C,Math.max(5,B.sw*.048),ivory);line(A,C,Math.max(1,B.sw*.009),edge)});
  [11,12,13,14,15,16,23,24,25,26,27,28].forEach(i=>joint(p(i),Math.max(3,B.sw*(i===23||i===24?.035:.026)),ivory));
  local(B,()=>{ctx.lineWidth=Math.max(2,B.sw*.014);ctx.strokeStyle=ivory;for(let i=0;i<7;i++){const y=B.len*(.08+i*.075),wide=B.sw*(.38-i*.018);path(null,ivory,()=>{ctx.moveTo(0,y-B.len*.035);ctx.bezierCurveTo(-wide*.22,y-B.len*.09,-wide,y-B.len*.08,-wide,y);ctx.bezierCurveTo(-wide,y+B.len*.07,-wide*.25,y+B.len*.055,0,y+B.len*.075);ctx.bezierCurveTo(wide*.25,y+B.len*.055,wide,y+B.len*.07,wide,y);ctx.bezierCurveTo(wide,y-B.len*.08,wide*.22,y-B.len*.09,0,y-B.len*.035)})}
    ctx.lineWidth=B.sw*.045;line({x:0,y:B.len*.02},{x:0,y:B.len*.89},B.sw*.045,ivory);
    path(ivory,edge,()=>{ctx.moveTo(-B.hw*.55,B.len*.82);ctx.bezierCurveTo(-B.sw*.5,B.len*.92,-B.sw*.34,B.len*1.12,0,B.len*1.04);ctx.bezierCurveTo(B.sw*.34,B.len*1.12,B.sw*.5,B.len*.92,B.hw*.55,B.len*.82);ctx.lineTo(B.hw*.22,B.len*.72);ctx.quadraticCurveTo(0,B.len*.86,-B.hw*.22,B.len*.72);ctx.closePath()})});
  ctx.save();ctx.translate(B.nose.x,B.nose.y);ctx.rotate(B.angle);path(ivory,edge,()=>{ctx.ellipse(0,0,B.headR*.78,B.headR,0,0,Math.PI*2)});ctx.fillStyle='#4b463f';ctx.beginPath();ctx.arc(-B.headR*.24,-B.headR*.05,B.headR*.15,0,Math.PI*2);ctx.arc(B.headR*.24,-B.headR*.05,B.headR*.15,0,Math.PI*2);ctx.fill();ctx.restore();ctx.restore()}
function muscleLimb(a,b,w,color){if(!a||!b)return;const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L;ctx.fillStyle=color;ctx.strokeStyle='#661d24';ctx.lineWidth=Math.max(1,w*.06);path(color,'#661d24',()=>{ctx.moveTo(a.x+nx*w*.25,a.y+ny*w*.25);ctx.bezierCurveTo(a.x+dx*.25+nx*w*.58,a.y+dy*.25+ny*w*.58,a.x+dx*.72+nx*w*.42,a.y+dy*.72+ny*w*.42,b.x+nx*w*.12,b.y+ny*w*.12);ctx.lineTo(b.x-nx*w*.12,b.y-ny*w*.12);ctx.bezierCurveTo(a.x+dx*.72-nx*w*.42,a.y+dy*.72-ny*w*.42,a.x+dx*.25-nx*w*.58,a.y+dy*.25-ny*w*.58,a.x-nx*w*.25,a.y-ny*w*.25);ctx.closePath()})}
function drawMuscles(B,a=1){ctx.save();ctx.globalAlpha=a;local(B,()=>{path('#9f2730','#64161d',()=>{ctx.moveTo(-B.sw*.48,0);ctx.bezierCurveTo(-B.sw*.55,B.len*.27,-B.sw*.34,B.len*.78,-B.hw*.5,B.len);ctx.lineTo(B.hw*.5,B.len);ctx.bezierCurveTo(B.sw*.34,B.len*.78,B.sw*.55,B.len*.27,B.sw*.48,0);ctx.quadraticCurveTo(0,B.len*.20,-B.sw*.48,0);ctx.closePath()});ctx.strokeStyle='#f3b2a8';ctx.lineWidth=Math.max(1,B.sw*.01);ctx.beginPath();ctx.moveTo(0,B.len*.18);ctx.lineTo(0,B.len*.86);for(let y=.35;y<.83;y+=.14){ctx.moveTo(-B.sw*.19,B.len*y);ctx.lineTo(B.sw*.19,B.len*y)}ctx.stroke()});[[11,13],[13,15],[12,14],[14,16],[23,25],[25,27],[24,26],[26,28]].forEach(([i,j])=>muscleLimb(p(i),p(j),B.sw*(i>=23?.16:.12),'#ad3038'));ctx.restore()}
function drawOrgans(B,a=1){ctx.save();ctx.globalAlpha=a;local(B,()=>{const w=B.sw,L=B.len;ctx.lineWidth=Math.max(1,w*.008);
  path('#d67d83','#7f1d1d',()=>{ctx.moveTo(-w*.05,L*.13);ctx.bezierCurveTo(-w*.37,L*.11,-w*.39,L*.46,-w*.11,L*.49);ctx.quadraticCurveTo(-w*.02,L*.38,-w*.05,L*.13);ctx.closePath()});path('#d67d83','#7f1d1d',()=>{ctx.moveTo(w*.05,L*.13);ctx.bezierCurveTo(w*.37,L*.11,w*.39,L*.46,w*.11,L*.49);ctx.quadraticCurveTo(w*.02,L*.38,w*.05,L*.13);ctx.closePath()});
  path('#a81620','#670b13',()=>{ctx.moveTo(0,L*.27);ctx.bezierCurveTo(-w*.12,L*.19,-w*.17,L*.34,-w*.04,L*.46);ctx.bezierCurveTo(w*.10,L*.58,w*.20,L*.31,w*.08,L*.25);ctx.closePath()});
  path('#713b25','#422015',()=>{ctx.moveTo(-w*.34,L*.51);ctx.bezierCurveTo(-w*.1,L*.42,w*.2,L*.48,w*.35,L*.58);ctx.bezierCurveTo(w*.15,L*.68,-w*.16,L*.65,-w*.36,L*.60);ctx.closePath()});
  path('#dc8b4b','#8c4c22',()=>{ctx.moveTo(w*.12,L*.55);ctx.bezierCurveTo(w*.34,L*.5,w*.31,L*.76,w*.08,L*.78);ctx.bezierCurveTo(-w*.05,L*.69,w*.04,L*.58,w*.12,L*.55);ctx.closePath()});
  path('#c98562','#744128',()=>{ctx.moveTo(-w*.27,L*.70);ctx.bezierCurveTo(-w*.39,L*.87,-w*.27,L*1.02,0,L*1.04);ctx.bezierCurveTo(w*.27,L*1.02,w*.39,L*.87,w*.27,L*.70);ctx.lineWidth=w*.065;ctx.strokeStyle='#c98562';ctx.stroke()});ctx.strokeStyle='#e7b08e';ctx.lineWidth=w*.045;ctx.beginPath();for(let i=0;i<5;i++){const y=L*(.76+i*.055),sgn=i%2?1:-1;ctx.moveTo(-w*.18,y);ctx.bezierCurveTo(sgn*w*.15,y-L*.03,-sgn*w*.15,y+L*.035,w*.18,y)}ctx.stroke()
  });ctx.restore()}
function veil(B){ctx.save();ctx.fillStyle='rgba(225,240,247,.28)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.restore()}
function render(){if(!img)return;fit();ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);if(mode==='skin'||!landmarks)return;const B=frame();if(!B)return;const a=Number(opacity.value)/100;if(mode==='muscle')drawMuscles(B,a);if(mode==='skeleton')drawSkeleton(B,a);if(mode==='organs')drawOrgans(B,a);if(mode==='combo'){drawSkeleton(B,a*.72);drawOrgans(B,a)}if(mode==='transparent'){veil(B);drawMuscles(B,a*.35);drawSkeleton(B,a*.55);drawOrgans(B,a*.78)}}
</script></body></html>
