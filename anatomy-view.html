<style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#10243f;background:#edf3f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(34px + env(safe-area-inset-bottom))}h1{font-size:28px;margin:5px 0}.lead{margin:5px 0 16px;color:#475569}.card{background:#fff;border-radius:20px;padding:15px;box-shadow:0 8px 28px #16324f12}.pick{display:block;border:2px dashed #8da1b5;border-radius:15px;padding:19px;text-align:center;font-weight:900;background:#f8fafc}.pick input{display:none}.go{width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:900;background:#16a34a;color:#fff;margin-top:12px}.go:disabled{opacity:.42}.viewer{display:none;position:relative;background:#0b1728;border-radius:16px;overflow:hidden;margin-top:14px}.viewer canvas{display:block;width:100%;height:auto}.badge{display:none;position:absolute;left:9px;top:9px;background:#07111dcc;color:#fff;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.modes button{border:1px solid #cad5df;background:#fff;border-radius:12px;padding:12px 3px;font-weight:800;color:#253b50}.modes button.active{background:#10243f;color:#fff;border-color:#10243f}.status{text-align:center;font-weight:800;color:#526579;margin:11px 4px;min-height:21px}.status.error{color:#b91c1c}.slider{display:flex;gap:10px;align-items:center;margin-top:12px}.slider input{width:100%;accent-color:#16a34a}.note{font-size:12px;line-height:1.55;color:#8c3c0d;background:#fff7ed;border:1px solid #fed7aa;padding:11px;border-radius:12px;margin-top:13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.actions button{padding:12px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;font-weight:800}.small{font-size:11px;color:#64748b;text-align:center;margin:9px 0 0}</style></head>
<body><main class="wrap"><h1>筋肉骨格</h1><p class="lead">正面・斜め・横向きなど、写真の姿勢と体の向きを推定して人体モデルを重ねます。</p><section class="card"><label class="pick">📷 人物の写真を選ぶ<input id="file" type="file" accept="image/*"></label><div id="status" class="status">全身または体の主要部分が写った人物写真を選んでください</div><button id="analyze" class="go" disabled>写真を読み取る</button><div id="viewer" class="viewer"><canvas id="canvas"></canvas><div id="badge" class="badge">標準人体モデル（推定）</div></div><div id="controls" hidden><div class="modes"><button data-mode="skin" class="active">👤 肌</button><button data-mode="muscle">💪 筋肉</button><button data-mode="skeleton">🦴 骨格</button><button data-mode="organs">🫀 内臓</button><button data-mode="combo">🩻 骨＋内臓</button><button data-mode="transparent">🔀 半透明</button></div><div class="slider"><span>濃さ</span><input id="opacity" type="range" min="0" max="100" value="82"><b id="opacityVal">82%</b></div><div class="actions"><button id="save">画像を保存</button><button id="another">別の写真</button></div><p class="small">正面・斜め・横向き、座位や脚を交差した姿勢にも対応。隠れた部位は推定表示です。</p></div></section><p class="note"><b>重要：</b>写真から本人の実際の骨・筋肉・臓器を透視したものではなく、医療診断には使用できません。写真に写っていない部位は推定になります。</p></main>
<script type="module">
const $=s=>document.querySelector(s),file=$('#file'),analyze=$('#analyze'),statusEl=$('#status'),viewer=$('#viewer'),controls=$('#controls'),canvas=$('#canvas'),ctx=canvas.getContext('2d'),opacity=$('#opacity'),opacityVal=$('#opacityVal'),badge=$('#badge');let img=null,landmarks=null,landmarker=null,mode='skin',objectURL='',view='front';const CDN='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';const muscleTex=new Image(),organsImg=new Image(),skeletonImg=new Image();muscleTex.src='anatomy-assets/muscle-texture.webp?v=3';organsImg.src='anatomy-assets/organs-real.webp?v=3';skeletonImg.src='anatomy-assets/skeleton-real.webp?v=3';[muscleTex,organsImg,skeletonImg].forEach(x=>x.onload=()=>landmarks&&render());
file.onchange=()=>{const f=file.files?.[0];if(!f)return;if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(f);img=new Image();img.onload=()=>{analyze.disabled=false;status('写真を読み込みました。「写真を読み取る」を押してください');render()};img.src=objectURL};function status(t,e=false){statusEl.textContent=t;statusEl.classList.toggle('error',e)}
async function initPose(){if(landmarker)return;status('姿勢AIを準備しています…');const vision=await import(CDN+'/+esm');const files=await vision.FilesetResolver.forVisionTasks(CDN+'/wasm');const opts={baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task'},runningMode:'IMAGE',numPoses:1,minPoseDetectionConfidence:.35,minPosePresenceConfidence:.35};try{opts.baseOptions.delegate='GPU';landmarker=await vision.PoseLandmarker.createFromOptions(files,opts)}catch(e){delete opts.baseOptions.delegate;landmarker=await vision.PoseLandmarker.createFromOptions(files,opts)}}
analyze.onclick=async()=>{if(!img)return;analyze.disabled=true;try{await initPose();status('身体の向きと関節位置を解析しています…');landmarks=landmarker.detect(img).landmarks?.[0]||null;if(!landmarks)throw Error('人物を認識できませんでした。体の主要部分が見える写真を試してください');const B=body();if(!B)throw Error('肩と腰の位置を十分に認識できませんでした');view=detectView(B);viewer.style.display='block';controls.hidden=false;badge.style.display='block';badge.textContent=`標準人体モデル（推定・${view==='side'?'横向き':view==='angle'?'斜め':'正面'}）`;status(`${view==='side'?'横向き':view==='angle'?'斜め':'正面'}の姿勢として読み取りました`);render()}catch(e){status(e.message||'姿勢AIを起動できませんでした',true)}finally{analyze.disabled=false}};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;render()});opacity.oninput=()=>{opacityVal.textContent=opacity.value+'%';render()};$('#another').onclick=()=>location.reload();$('#save').onclick=()=>canvas.toBlob(blob=>{const a=document.createElement('a');a.download='anatomy-view.png';a.href=URL.createObjectURL(blob);a.click()},'image/png');
function fit(){const s=Math.min(1,1400/img.naturalWidth,1400/img.naturalHeight);canvas.width=Math.round(img.naturalWidth*s);canvas.height=Math.round(img.naturalHeight*s)}function p(i,min=.12){const q=landmarks?.[i];return q&&q.visibility>min?{x:q.x*canvas.width,y:q.y*canvas.height,z:q.z||0}:null}const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2,z:((a.z||0)+(b.z||0))/2}),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function body(){const ls=p(11,.1),rs=p(12,.1),lh=p(23,.1),rh=p(24,.1);if(!ls||!rs||!lh||!rh)return null;const sc=mid(ls,rs),hc=mid(lh,rh),L=dist(sc,hc),rawSW=dist(ls,rs),rawHW=dist(lh,rh);return{ls,rs,lh,rh,sc,hc,L,rawSW,rawHW,sw:Math.max(rawSW,L*.28),hw:Math.max(rawHW,L*.22)}}function detectView(B){const shoulderDepth=Math.abs(B.ls.z-B.rs.z),hipDepth=Math.abs(B.lh.z-B.rh.z),ratio=B.rawSW/Math.max(B.L,1),depth=Math.max(shoulderDepth,hipDepth);if(ratio<.22||depth>.32)return'side';if(ratio<.38||depth>.16)return'angle';return'front'}
function muscleFill(){if(muscleTex.complete&&muscleTex.naturalWidth)return ctx.createPattern(muscleTex,'repeat');return'#a92f36'}function muscleOval(x,y,rx,ry,rot,a){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);ctx.clip();ctx.globalAlpha=a;ctx.fillStyle=muscleFill();ctx.fillRect(-rx,-ry,rx*2,ry*2);ctx.strokeStyle='rgba(84,18,23,.82)';ctx.lineWidth=Math.max(1,rx*.07);ctx.stroke();ctx.restore()}function muscleLimb(A,C,w1,w2,a){if(!A||!C)return;const dx=C.x-A.x,dy=C.y-A.y,L=Math.hypot(dx,dy),ang=Math.atan2(dy,dx);[[.22,.25,1],[.5,.28,.92],[.78,.24,.72]].forEach(([t,len,f])=>muscleOval(A.x+dx*t,A.y+dy*t,L*len,(w1+(w2-w1)*t)*f,ang,a))}
function muscles(B,a){const L=B.L,w=B.sw,limbs=[[11,13,.125,.088],[13,15,.09,.06],[12,14,.125,.088],[14,16,.09,.06],[23,25,.17,.12],[25,27,.125,.08],[24,26,.17,.12],[26,28,.125,.08]].map(v=>({v,A:p(v[0]),C:p(v[1])})).filter(x=>x.A&&x.C).sort((x,y)=>((y.A.z+y.C.z)-(x.A.z+x.C.z)));limbs.forEach(x=>muscleLimb(x.A,x.C,w*x.v[2],w*x.v[3],a));const ang=Math.atan2(B.hc.y-B.sc.y,B.hc.x-B.sc.x)-Math.PI/2,side=view==='side'?.58:view==='angle'?.8:1;ctx.save();ctx.translate(B.sc.x,B.sc.y);ctx.rotate(ang);muscleOval(-w*.2*side,L*.2,w*.205*side,L*.12,-.1,a);muscleOval(w*.2*side,L*.2,w*.205*side,L*.12,.1,a);for(let i=0;i<4;i++){const y=L*(.36+i*.135),rx=w*(.105-i*.008)*side;muscleOval(-w*.115*side,y,rx,L*.058,-.04,a);muscleOval(w*.115*side,y,rx,L*.058,.04,a)}ctx.restore()}
function joint(P,r,a){if(!P)return;ctx.save();ctx.globalAlpha=a;ctx.fillStyle='#e4dac4';ctx.strokeStyle='#91836d';ctx.lineWidth=Math.max(1,r*.12);ctx.beginPath();ctx.ellipse(P.x,P.y,r,r*.82,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore()}function boneLine(A,C,w,a,double=false){if(!A||!C)return;ctx.save();ctx.globalAlpha=a;ctx.strokeStyle='#eee5cf';ctx.lineCap='round';ctx.lineWidth=Math.max(2,w*(double?.65:1));ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(C.x,C.y);ctx.stroke();if(double){ctx.strokeStyle='#9e9078';ctx.lineWidth=Math.max(1,w*.12);ctx.stroke()}ctx.restore()}
function skeleton(B,a){const segs=[[11,13,.052,false],[13,15,.043,true],[12,14,.052,false],[14,16,.043,true],[23,25,.064,false],[25,27,.052,true],[24,26,.064,false],[26,28,.052,true],[27,31,.038,true],[28,32,.038,true]].map(v=>({v,A:p(v[0]),C:p(v[1])})).filter(x=>x.A&&x.C).sort((x,y)=>((y.A.z+y.C.z)-(x.A.z+x.C.z)));segs.forEach(x=>boneLine(x.A,x.C,B.sw*x.v[2],a,x.v[3]));const nose=p(0,.08),le=p(7,.08),re=p(8,.08);if(nose){const fw=le&&re?Math.max(dist(le,re)*1.05,B.L*.1):B.L*.12;ctx.save();ctx.globalAlpha=a;ctx.fillStyle='#e7ddc7';ctx.beginPath();ctx.ellipse(nose.x,nose.y,fw*.48,fw*.62,0,0,Math.PI*2);ctx.fill();ctx.restore()}[11,12,13,14,15,16,23,24,25,26,27,28].forEach(i=>joint(p(i),B.sw*.026,a));boneLine(B.sc,B.hc,B.sw*.055,a,false)}
function organs(B,a){const L=B.L,ang=Math.atan2(B.hc.y-B.sc.y,B.hc.x-B.sc.x)-Math.PI/2,side=view==='side'?.55:view==='angle'?.78:1,w=Math.min(B.sw*.96,B.hw*2.08)*side,h=L*.98;if(organsImg.complete&&organsImg.naturalWidth){ctx.save();ctx.globalAlpha=a;ctx.translate(B.sc.x,B.sc.y);ctx.rotate(ang);ctx.beginPath();ctx.ellipse(0,L*.5,w*.5,h*.5,0,0,Math.PI*2);ctx.clip();ctx.drawImage(organsImg,-w/2,L*.02,w,h);ctx.restore();return}ctx.save();ctx.globalAlpha=a;ctx.translate(B.sc.x,B.sc.y);ctx.rotate(ang);ctx.fillStyle='#a71924';ctx.beginPath();ctx.ellipse(0,L*.38,w*.12,L*.12,0,0,Math.PI*2);ctx.fill();ctx.restore()}
function render(){if(!img)return;fit();ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);if(mode==='skin'||!landmarks)return;const B=body();if(!B)return;const a=+opacity.value/100;if(mode==='muscle')muscles(B,a);if(mode==='skeleton')skeleton(B,a);if(mode==='organs')organs(B,a);if(mode==='combo'){skeleton(B,a*.72);organs(B,a*.92)}if(mode==='transparent'){muscles(B,a*.28);skeleton(B,a*.48);organs(B,a*.72)}}
</script></body></html>
