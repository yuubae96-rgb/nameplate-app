<body><main class="wrap"><h1>人体学習アプリ 検証版</h1><p class="lead">写真の姿勢に合わせて、より詳細な人体モデルを重ねます。</p><section class="card"><label class="pick">📷 人物の写真を選ぶ<input id="file" type="file" accept="image/*"></label><div id="status" class="status">正面を向いた全身写真を選んでください</div><button id="analyze" class="go" disabled>写真を読み取る</button><div id="viewer" class="viewer"><canvas id="canvas"></canvas><div id="badge" class="badge">標準人体モデル（推定）</div></div><div id="controls" hidden><div class="modes"><button data-mode="skin" class="active">👤 肌</button><button data-mode="muscle">💪 筋肉</button><button data-mode="skeleton">🦴 骨格</button><button data-mode="organs">🫀 内臓</button><button data-mode="combo">🩻 骨＋内臓</button><button data-mode="transparent">🔀 半透明</button></div><div class="slider"><span>濃さ</span><input id="opacity" type="range" min="0" max="100" value="82"><b id="opacityVal">82%</b></div><div class="actions"><button id="save">画像を保存</button><button id="another">別の写真</button></div><p class="small">正面〜斜め前の写真向け。教育用の推定表示です。</p></div></section><p class="note"><b>重要：</b>写真から本人の実際の骨・筋肉・臓器を透視したものではなく、医療診断には使用できません。</p></main>
<script type="module">
const $=s=>document.querySelector(s),file=$('#file'),analyze=$('#analyze'),statusEl=$('#status'),viewer=$('#viewer'),controls=$('#controls'),canvas=$('#canvas'),ctx=canvas.getContext('2d'),opacity=$('#opacity'),opacityVal=$('#opacityVal'),badge=$('#badge');let img=null,landmarks=null,landmarker=null,mode='skin',objectURL='';const CDN='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';const muscleTex=new Image(),organsImg=new Image();muscleTex.src='anatomy-assets/muscle-texture.webp?v=3';organsImg.src='anatomy-assets/organs-real.webp?v=3';[muscleTex,organsImg].forEach(x=>x.onload=()=>landmarks&&render());
file.onchange=()=>{const f=file.files?.[0];if(!f)return;if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(f);img=new Image();img.onload=()=>{analyze.disabled=false;status('写真を読み込みました。「写真を読み取る」を押してください');render()};img.src=objectURL};function status(t,e=false){statusEl.textContent=t;statusEl.classList.toggle('error',e)}
async function initPose(){if(landmarker)return;status('姿勢AIを準備しています…');const vision=await import(CDN+'/+esm');const files=await vision.FilesetResolver.forVisionTasks(CDN+'/wasm');const opts={baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate:'CPU'},runningMode:'IMAGE',numPoses:1,minPoseDetectionConfidence:.45,minPosePresenceConfidence:.45};landmarker=await vision.PoseLandmarker.createFromOptions(files,opts)}

analyze.onclick=async()=>{if(!img)return;analyze.disabled=true;try{status('身体の位置を解析しています…');if(new URLSearchParams(location.search).has('visualtest'))landmarks=visualTestPose();else{await initPose();landmarks=landmarker.detect(img).landmarks?.[0]||null}if(!landmarks)throw Error('人物を認識できませんでした');viewer.style.display='block';controls.hidden=false;badge.style.display='block';status('姿勢を読み取りました');render()}catch(e){status(e.message||'姿勢AIを起動できませんでした',true)}finally{analyze.disabled=false}};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;render()});opacity.oninput=()=>{opacityVal.textContent=opacity.value+'%';render()};$('#another').onclick=()=>location.reload();$('#save').onclick=()=>canvas.toBlob(blob=>{const a=document.createElement('a');a.download='anatomy-view.png';a.href=URL.createObjectURL(blob);a.click()},'image/png');
function fit(){const s=Math.min(1,1400/img.naturalWidth,1400/img.naturalHeight);canvas.width=Math.round(img.naturalWidth*s);canvas.height=Math.round(img.naturalHeight*s)}function p(i,min=.22){const q=landmarks?.[i];return q&&q.visibility>min?{x:q.x*canvas.width,y:q.y*canvas.height}:null}const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2}),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function body(){const ls=p(11),rs=p(12),lh=p(23),rh=p(24);if(!ls||!rs||!lh||!rh)return null;return{ls,rs,lh,rh,sc:mid(ls,rs),hc:mid(lh,rh),sw:dist(ls,rs),hw:dist(lh,rh)}}
function limbPath(A,B,w1,w2){const dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L;ctx.beginPath();ctx.moveTo(A.x+nx*w1,A.y+ny*w1);ctx.bezierCurveTo(A.x+dx*.28+nx*w1*.98,A.y+dy*.28+ny*w1*.98,A.x+dx*.72+nx*w2*1.08,A.y+dy*.72+ny*w2*1.08,B.x+nx*w2,B.y+ny*w2);ctx.lineTo(B.x-nx*w2,B.y-ny*w2);ctx.bezierCurveTo(A.x+dx*.72-nx*w2*1.08,A.y+dy*.72-ny*w2*1.08,A.x+dx*.28-nx*w1*.98,A.y+dy*.28-ny*w1*.98,A.x-nx*w1,A.y-ny*w1);ctx.closePath()}
function muscleFill(){if(muscleTex.complete&&muscleTex.naturalWidth)return ctx.createPattern(muscleTex,'repeat');const g=ctx.createLinearGradient(0,0,canvas.width,0);g.addColorStop(0,'#72151c');g.addColorStop(.45,'#c84d4f');g.addColorStop(1,'#6d1219');return g}

function muscles(B,a){const L=dist(B.sc,B.hc),ang=Math.atan2(B.hc.y-B.sc.y,B.hc.x-B.sc.x)-Math.PI/2,w=B.sw;ctx.save();ctx.translate(B.sc.x,B.sc.y);ctx.rotate(ang);muscleOval(-w*.20,L*.20,w*.205,L*.12,-.10,a);muscleOval(w*.20,L*.20,w*.205,L*.12,.10,a);muscleOval(-w*.38,L*.13,w*.12,L*.105,-.32,a);muscleOval(w*.38,L*.13,w*.12,L*.105,.32,a);for(let i=0;i<4;i++){const y=L*(.36+i*.135),rx=w*(.105-i*.008);muscleOval(-w*.115,y,rx,L*.058,-.04,a);muscleOval(w*.115,y,rx,L*.058,.04,a)}muscleOval(-w*.315,L*.55,w*.095,L*.27,-.08,a);muscleOval(w*.315,L*.55,w*.095,L*.27,.08,a);ctx.restore();[[11,13,.125,.088],[13,15,.09,.06],[12,14,.125,.088],[14,16,.09,.06],[23,25,.17,.12],[25,27,.125,.08],[24,26,.17,.12],[26,28,.125,.08]].forEach(([i,j,w1,w2])=>muscleLimb(p(i,.3),p(j,.3),w*w1,w*w2,a))}
function joint(P,r,a){if(!P)return;ctx.save();ctx.globalAlpha=a;const g=ctx.createRadialGradient(P.x-r*.25,P.y-r*.3,r*.08,P.x,P.y,r);g.addColorStop(0,'#fffdf3');g.addColorStop(1,'#c9bda4');ctx.fillStyle=g;ctx.strokeStyle='#91836d';ctx.lineWidth=Math.max(1,r*.12);ctx.beginPath();ctx.ellipse(P.x,P.y,r,r*.82,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore()}function boneLine(A,C,w,a,double=false){if(!A||!C)return;const dx=C.x-A.x,dy=C.y-A.y,L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L;ctx.save();ctx.globalAlpha=a;const offs=double?[-w*.28,w*.28]:[0],bw=double?w*.23:w*.5;offs.forEach(o=>{const ax=A.x+nx*o,ay=A.y+ny*o,cx=C.x+nx*o,cy=C.y+ny*o;ctx.beginPath();ctx.moveTo(ax+nx*bw,ay+ny*bw);ctx.bezierCurveTo(ax+dx*.2+nx*bw*.55,ay+dy*.2+ny*bw*.55,ax+dx*.8+nx*bw*.6,ay+dy*.8+ny*bw*.6,cx+nx*bw,cy+ny*bw);ctx.quadraticCurveTo(cx+dx*.02,cy+dy*.02,cx-nx*bw,cy-ny*bw);ctx.bezierCurveTo(ax+dx*.8-nx*bw*.6,ay+dy*.8-ny*bw*.6,ax+dx*.2-nx*bw*.55,ay+dy*.2-ny*bw*.55,ax-nx*bw,ay-ny*bw);ctx.closePath();const g=ctx.createLinearGradient(ax+nx*bw,ay+ny*bw,ax-nx*bw,ay-ny*bw);g.addColorStop(0,'#fffdf0');g.addColorStop(.55,'#e4dac4');g.addColorStop(1,'#ad9e84');ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#8f826c';ctx.lineWidth=Math.max(1,w*.08);ctx.stroke()});ctx.restore()}
function skeleton(B,a){const torsoL=dist(B.sc,B.hc);ctx.save();ctx.globalAlpha=a;ctx.strokeStyle='#efe5cf';ctx.fillStyle='#efe5cf';ctx.lineWidth=Math.max(2,B.sw*.018);const neck=p(0)?{x:B.sc.x,y:B.sc.y-B.sw*.18}:B.sc;boneLine(neck,B.sc,B.sw*.045,a);boneLine(B.sc,B.hc,B.sw*.045,a);boneLine(B.ls,B.rs,B.sw*.026,a);for(let i=0;i<7;i++){const t=.11+i*.075,cx=B.sc.x+(B.hc.x-B.sc.x)*t,cy=B.sc.y+(B.hc.y-B.sc.y)*t,rx=B.sw*(.34-i*.018),ry=torsoL*.045;ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);ctx.stroke()}ctx.beginPath();ctx.moveTo(B.ls.x,B.ls.y);ctx.quadraticCurveTo(B.sc.x,B.sc.y-B.sw*.06,B.rs.x,B.rs.y);ctx.stroke();ctx.beginPath();ctx.ellipse(B.hc.x,B.hc.y,B.hw*.47,B.sw*.13,0,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.ellipse(B.hc.x,B.hc.y+B.sw*.03,B.hw*.24,B.sw*.08,0,0,Math.PI*2);ctx.stroke();const nose=p(0,.18),le=p(7,.15),re=p(8,.15);if(nose){const r=le&&re?dist(le,re)*.56:B.sw*.18;ctx.beginPath();ctx.ellipse(nose.x,nose.y,r*.75,r,0,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(nose.x-r*.23,nose.y-r*.06,r*.12,0,Math.PI*2);ctx.arc(nose.x+r*.23,nose.y-r*.06,r*.12,0,Math.PI*2);ctx.stroke()}ctx.restore();[[11,13,.046,false],[13,15,.038,true],[12,14,.046,false],[14,16,.038,true],[23,25,.055,false],[25,27,.048,true],[24,26,.055,false],[26,28,.048,true]].forEach(([i,j,w,d])=>boneLine(p(i,.3),p(j,.3),B.sw*w,a,d));[11,12,13,14,15,16,23,24,25,26,27,28].forEach(i=>joint(p(i,.3),B.sw*(i===23||i===24?.032:.022),a));const lf=p(31,.2),rf=p(32,.2),la=p(27,.2),ra=p(28,.2);boneLine(la,lf,B.sw*.032,a,true);boneLine(ra,rf,B.sw*.032,a,true)}
function organs(B,a){const torsoL=dist(B.sc,B.hc),ang=Math.atan2(B.hc.y-B.sc.y,B.hc.x-B.sc.x)-Math.PI/2;if(organsImg.complete&&organsImg.naturalWidth){ctx.save();ctx.globalAlpha=a;ctx.translate(B.sc.x,B.sc.y);ctx.rotate(ang);const w=Math.min(B.sw*.70,B.hw*1.55),h=torsoL*.80;ctx.beginPath();ctx.moveTo(-w*.45,torsoL*.11);ctx.quadraticCurveTo(-w*.52,torsoL*.42,-w*.36,torsoL*.72);ctx.quadraticCurveTo(0,torsoL*.91,w*.36,torsoL*.72);ctx.quadraticCurveTo(w*.52,torsoL*.42,w*.45,torsoL*.11);ctx.closePath();ctx.clip();ctx.drawImage(organsImg,-w/2,torsoL*.11,w,h);ctx.restore();return}ctx.save();ctx.globalAlpha=a;ctx.translate(B.sc.x,B.sc.y);ctx.rotate(ang);const w=B.sw;const e=(x,y,rx,ry,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()};e(-w*.15,torsoL*.27,w*.15,torsoL*.2,'#d06f78');e(w*.15,torsoL*.27,w*.15,torsoL*.2,'#d06f78');e(0,torsoL*.36,w*.08,torsoL*.12,'#a71924');e(-w*.08,torsoL*.57,w*.28,torsoL*.1,'#75402a');ctx.restore()}
