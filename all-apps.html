<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="全アプリ"><meta name="theme-color" content="#0f6e5f"><title>全アプリ</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f3f5f7;color:#172033;padding:calc(18px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom))}.wrap{max-width:720px;margin:auto}h1{font-size:25px;margin:4px 0 5px}p{margin:0 0 15px;color:#687386;font-size:13px}.search{width:100%;border:1px solid #d9dee6;border-radius:13px;background:#fff;padding:13px 14px;font-size:16px;margin-bottom:18px}.section{margin:19px 0 9px;font-size:14px;color:#5d6879;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.app{background:#fff;border:1px solid #e0e4e9;border-radius:16px;padding:13px 7px 11px;text-decoration:none;color:#172033;text-align:center;min-height:118px;box-shadow:0 2px 8px #0000000a}.icon{width:58px;height:58px;margin:0 auto 8px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#33250f;font-size:25px;font-weight:800;background:linear-gradient(145deg,#e1c48b,#9f6a27)}.name{font-size:12px;font-weight:700;line-height:1.25;word-break:keep-all}.hide{display:none}@media(max-width:350px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><h1>全アプリ</h1><p>会社・AI・YouTubeツールをここから開けます</p><input id="q" class="search" placeholder="アプリを検索"><div id="apps"></div></div><script src="app-registry.js?v=20260915"></script><script>
const root=document.getElementById('apps');const cats=[...new Set(APP_REGISTRY.map(a=>a.c))];
function draw(filter=''){root.innerHTML='';const s=filter.trim().toLowerCase();cats.forEach(c=>{const items=APP_REGISTRY.filter(a=>a.c===c&&(!s||(a.n+' '+a.d).toLowerCase().includes(s)));if(!items.length)return;const h=document.createElement('div');h.className='section';h.textContent=c;const g=document.createElement('div');g.className='grid';items.forEach(a=>{const x=document.createElement('a');x.className='app';x.href=a.u;x.innerHTML=`<div class="icon">${a.i}</div><div class="name">${a.n}</div>`;g.appendChild(x)});root.append(h,g)})}
document.getElementById('q').addEventListener('input',e=>draw(e.target.value));draw();
</script></body></html>
