<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>筋肉骨格 Human Atlas姿勢合わせ</title></head><body><div style="font-family:-apple-system,sans-serif;padding:24px;text-align:center">最新版を読み込み中…</div><script>
(async()=>{
const base='https://raw.githubusercontent.com/yuubae96-rgb/nameplate-app/9b1bd3739e02bc79880eacd833187a7fdb8e650d/anatomy-pose-3d.html';let html=await(await fetch(base,{cache:'no-store'})).text();
const old=`      let q=new THREE.Quaternion(),eyeLeft=eyesConsistent?faceEyeLeft:poseEyeLeft,eyeRight=eyesConsistent?faceEyeRight:poseEyeRight;
      if(eyeLeft&&eyeRight){
        const axis=eyeRight.clone().sub(eyeLeft),roll=Math.atan2(axis.y,axis.x);
        const qRoll=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),roll);
        let yaw=0,pitch=0;
        if(faceNose&&eyeDistance){yaw=THREE.MathUtils.clamp((faceNose.x-eyeCenter.x)/eyeDistance*1.28,-.85,.85);const noseDrop=(eyeCenter.y-faceNose.y)/eyeDistance;pitch=THREE.MathUtils.clamp((noseDrop-.55)*.9,-.52,.52)}
        const qYaw=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),yaw),qPitch=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),pitch);
        q.copy(qRoll).multiply(qYaw).multiply(qPitch);
      }else if(faceLeft&&faceRight){
        const a=faceRight.clone().sub(faceLeft);q.setFromAxisAngle(new THREE.Vector3(0,0,1),Math.atan2(a.y,a.x))
      }`;
const improved=`      let q=new THREE.Quaternion(),eyeLeft=eyesConsistent?faceEyeLeft:poseEyeLeft,eyeRight=eyesConsistent?faceEyeRight:poseEyeRight;
      if(eyeLeft&&eyeRight){
        const eyeAxis=eyeRight.clone().sub(eyeLeft),eyeRoll=Math.atan2(eyeAxis.y,eyeAxis.x);let roll=eyeRoll,yaw=0,pitch=0;
        if(faceChin){const ec=mid(eyeLeft,eyeRight),down=faceChin.clone().sub(ec),chinRoll=Math.atan2(down.x,-down.y);roll=THREE.MathUtils.clamp(eyeRoll*.82+chinRoll*.18,-1.05,1.05)}
        if(faceNose&&eyeDistance){const ec=mid(eyeLeft,eyeRight),noseSide=(faceNose.x-ec.x)/eyeDistance,depthSide=(eyeRight.z-eyeLeft.z)/Math.max(eyeDistance,.001);yaw=THREE.MathUtils.clamp(noseSide*1.12+depthSide*.45,-1,1);const noseDrop=(ec.y-faceNose.y)/eyeDistance;pitch=THREE.MathUtils.clamp((noseDrop-.53)*.76,-.55,.55);if(Math.abs(noseSide)<.075&&Math.abs(depthSide)<.09)yaw*=.22}
        q.setFromEuler(new THREE.Euler(pitch,yaw,roll,'YXZ'));
      }else if(faceLeft&&faceRight){const a=faceRight.clone().sub(faceLeft);q.setFromAxisAngle(new THREE.Vector3(0,0,1),Math.atan2(a.y,a.x))}`;
if(!html.includes(old))throw Error('頭部姿勢コードを確認できませんでした');html=html.replace(old,improved);
// 骨格と筋肉の頭部を同じ顔アンカーで合わせる。従来の筋肉専用0.26比率は顔筋を過大化するため廃止。
const headOld=`      const eyeRatio=system==='muscular'?.26:.43,eyeY=system==='muscular'?.88:.55,eyeZ=system==='muscular'?.90:.82,sourceEyeDistance=Math.max(g.size.x*eyeRatio,.001),sourceEyeCenter=new THREE.Vector3(g.center.x,g.box.min.y+g.size.y*eyeY,g.box.min.z+g.size.z*eyeZ);
      let headScale=eyeDistance?eyeDistance/sourceEyeDistance:base*.84;
      headScale=THREE.MathUtils.clamp(headScale,base*.68,base*1.08);`;
const headNew=`      const eyeRatio=system==='muscular'?.40:.43,eyeY=system==='muscular'?.79:.55,eyeZ=system==='muscular'?.88:.82,sourceEyeDistance=Math.max(g.size.x*eyeRatio,.001),sourceEyeCenter=new THREE.Vector3(g.center.x,g.box.min.y+g.size.y*eyeY,g.box.min.z+g.size.z*eyeZ);
      let headScale=eyeDistance?eyeDistance/sourceEyeDistance:base*.84;
      if(faceW&&g.size.x>0){const faceScale=faceW/(g.size.x*(system==='muscular'?.92:.90));headScale=headScale*.65+faceScale*.35}
      headScale=THREE.MathUtils.clamp(headScale,base*.58,base*.98)*(system==='muscular'?1.16:1.07);`;
if(!html.includes(headOld))throw Error('頭部倍率コードを確認できませんでした');html=html.replace(headOld,headNew);
// 胸郭・体幹は全身倍率ではなく左右肩幅と肩〜腰の長さで個別に校正。筋肉が腹部下まで巨大化するのを防ぐ。
const torsoOld=`      placeUniform(g,base*.94*sizesNow.torso,q,torsoCenter.clone().add(shift),g.center);continue`;
const torsoNew=`      let torsoFit=base*.94;if(g.size.x>0&&g.size.y>0){const sx=shoulderW/(g.size.x*(system==='muscular'?.78:.86)),sy=torsoLen/(g.size.y*(system==='muscular'?.78:.88));torsoFit=THREE.MathUtils.clamp(Math.min(sx,sy),base*.62,base*.98)}placeUniform(g,torsoFit*(system==='muscular'?.90:1)*sizesNow.torso,q,torsoCenter.clone().add(shift),g.center);continue`;
if(!html.includes(torsoOld))throw Error('体幹コードを確認できませんでした');html=html.replace(torsoOld,torsoNew);
// MediaPipe already keeps left/right landmark identities.  Re-pairing by the
// shortest screen distance breaks crossed legs, so preserve each anatomical
// chain exactly as detected.
const legChainsOld=`function legChains(){const h=[joint(23,.55),joint(24,.55)],k=[joint(25,.58),joint(26,.58)],a=[joint(27,.62),joint(28,.62)],f=[joint(31,.55)||joint(29,.55),joint(32,.55)||joint(30,.55)];if(h[0]&&h[1]&&k[0]&&k[1]&&pairCost(h[0],h[1],k[1],k[0])<pairCost(h[0],h[1],k[0],k[1]))k.reverse();if(k[0]&&k[1]&&a[0]&&a[1]&&pairCost(k[0],k[1],a[1],a[0])<pairCost(k[0],k[1],a[0],a[1]))a.reverse();if(a[0]&&a[1]&&f[0]&&f[1]&&pairCost(a[0],a[1],f[1],f[0])<pairCost(a[0],a[1],f[0],f[1]))f.reverse();return[[h[0],k[0],a[0],f[0]],[h[1],k[1],a[1],f[1]]]}`;
const legChainsNew=`function legChains(){const h=[joint(23,.34),joint(24,.34)],k=[joint(25,.34),joint(26,.34)],a=[joint(27,.34),joint(28,.34)],f=[joint(31,.30)||joint(29,.30),joint(32,.30)||joint(30,.30)];return[[h[0],k[0],a[0],f[0]],[h[1],k[1],a[1],f[1]]]}`;
if(!html.includes(legChainsOld))throw Error('脚の左右判定コードを確認できませんでした');html=html.replace(legChainsOld,legChainsNew);

// Keep difficult limbs visible when segmentation is weak (gloves, crossed
// limbs, video UI overlays), while still rejecting segments that are mostly
// outside the person.
const insideOld=`function segmentInside(A,B){if(!poseMask||manualAdjusted)return true;let good=0;for(const t of [.18,.38,.58,.78]){const p=A.clone().lerp(B,t);if(maskValue(p)>.22)good++}return good>=3}`;
const insideNew=`function segmentInside(A,B){if(!poseMask||manualAdjusted)return true;let good=0;for(const t of [.12,.30,.50,.70,.88]){const p=A.clone().lerp(B,t);if(maskValue(p)>.16)good++}return good>=2}`;
if(!html.includes(insideOld))throw Error('人物領域判定コードを確認できませんでした');html=html.replace(insideOld,insideNew);

// Clamp implausible limb lengths without changing their detected direction.
// This prevents one uncertain elbow/knee from stretching a bone across the
// body, but preserves back-bends and crossed-leg directions.
const rawSegmentOld=`    const [rawProx,rawDist]=segment(k);if(!rawProx||!rawDist||!limbRef)continue;const prox=rawProx.clone().add(shift),dist=rawDist.clone().add(shift);`;
const rawSegmentNew=`    const [rawProx,rawDist]=segment(k);if(!rawProx||!rawDist||!limbRef)continue;const prox=rawProx.clone().add(shift),dist=rawDist.clone().add(shift),rawVector=dist.clone().sub(prox);let minLen=.10,maxLen=1.10;if(k.startsWith('upperArm')){minLen=.28;maxLen=1.18}else if(k.startsWith('foreArm')){minLen=.24;maxLen=1.12}else if(k.startsWith('thigh')){minLen=.44;maxLen=1.34}else if(k.startsWith('shin')){minLen=.38;maxLen=1.26}const rawLen=rawVector.length();if(rawLen>.001&&(k.startsWith('upperArm')||k.startsWith('foreArm')||k.startsWith('thigh')||k.startsWith('shin'))){const fixedLen=THREE.MathUtils.clamp(rawLen,limbRef*minLen,limbRef*maxLen);dist.copy(prox).add(rawVector.normalize().multiplyScalar(fixedLen))}`;
if(!html.includes(rawSegmentOld))throw Error('手足の配置コードを確認できませんでした');html=html.replace(rawSegmentOld,rawSegmentNew);

// When a hat or a strong profile prevents FaceLandmarker detection, derive
// roll/yaw/pitch from pose ears, eyes and nose instead of leaving the skull
// upright.  Face landmarks still take priority when available.
const headPoseOld=`        const eyeAxis=eyeRight.clone().sub(eyeLeft),eyeRoll=Math.atan2(eyeAxis.y,eyeAxis.x);let roll=eyeRoll,yaw=0,pitch=0;
        if(faceChin){const ec=mid(eyeLeft,eyeRight),down=faceChin.clone().sub(ec),chinRoll=Math.atan2(down.x,-down.y);roll=THREE.MathUtils.clamp(eyeRoll*.82+chinRoll*.18,-1.05,1.05)}
        if(faceNose&&eyeDistance){const ec=mid(eyeLeft,eyeRight),noseSide=(faceNose.x-ec.x)/eyeDistance,depthSide=(eyeRight.z-eyeLeft.z)/Math.max(eyeDistance,.001);yaw=THREE.MathUtils.clamp(noseSide*1.12+depthSide*.45,-1,1);const noseDrop=(ec.y-faceNose.y)/eyeDistance;pitch=THREE.MathUtils.clamp((noseDrop-.53)*.76,-.55,.55);if(Math.abs(noseSide)<.075&&Math.abs(depthSide)<.09)yaw*=.22}
        q.setFromEuler(new THREE.Euler(pitch,yaw,roll,'YXZ'));`;
const headPoseNew=`        let rollAxis=eyeRight.clone().sub(eyeLeft),turnLeft=eyeLeft,turnRight=eyeRight;if(!faceLm&&earL&&earR){turnLeft=earL.x<earR.x?earL:earR;turnRight=earL.x<earR.x?earR:earL;const earAxis=turnRight.clone().sub(turnLeft);if(earAxis.lengthSq()>.001)rollAxis.lerp(earAxis,.72)}const eyeRoll=Math.atan2(rollAxis.y,rollAxis.x);let roll=eyeRoll,yaw=0,pitch=0;
        if(faceChin){const ec=mid(eyeLeft,eyeRight),down=faceChin.clone().sub(ec),chinRoll=Math.atan2(down.x,-down.y);roll=THREE.MathUtils.clamp(eyeRoll*.82+chinRoll*.18,-1.05,1.05)}
        const turnNose=faceNose||poseNose,turnWidth=eyeDistance||faceW;if(turnNose&&turnWidth){const ec=faceNose?mid(eyeLeft,eyeRight):(turnLeft&&turnRight?mid(turnLeft,turnRight):mid(eyeLeft,eyeRight)),noseSide=(turnNose.x-ec.x)/turnWidth,depthSide=turnLeft&&turnRight?(turnRight.z-turnLeft.z)/Math.max(turnWidth,.001):0;yaw=THREE.MathUtils.clamp(noseSide*1.02+depthSide*.52,-1,1);const noseDrop=(ec.y-turnNose.y)/turnWidth;pitch=THREE.MathUtils.clamp((noseDrop-(faceNose?.53:.22))*(faceNose?.76:.50),-.55,.55);if(Math.abs(noseSide)<.075&&Math.abs(depthSide)<.09)yaw*=.22}
        q.setFromEuler(new THREE.Euler(pitch,yaw,roll,'YXZ'));`;
if(!html.includes(headPoseOld))throw Error('頭部の補正コードを確認できませんでした');html=html.replace(headPoseOld,headPoseNew);

// Prefer head width over tiny pose-eye distances on strong profiles.
const headBlendOld=`      if(faceW&&g.size.x>0){const faceScale=faceW/(g.size.x*(system==='muscular'?.92:.90));headScale=headScale*.65+faceScale*.35}`;
const headBlendNew=`      if(faceW&&g.size.x>0){const faceScale=faceW/(g.size.x*(system==='muscular'?.92:.90)),faceWeight=faceLm?.55:.72;headScale=headScale*(1-faceWeight)+faceScale*faceWeight}`;
if(!html.includes(headBlendOld))throw Error('頭部サイズ補正コードを確認できませんでした');html=html.replace(headBlendOld,headBlendNew);
// Use MediaPipe's highest-accuracy single-person model for sports poses.  It
// is heavier than the full model, but is substantially better when arms
// overlap, the torso bends backward, or legs cross.
html=html.replace('pose_landmarker_full/float16/1/pose_landmarker_full.task','pose_landmarker_heavy/float16/1/pose_landmarker_heavy.task');
html=html.replace("minPoseDetectionConfidence:.4,minPosePresenceConfidence:.4","minPoseDetectionConfidence:.28,minPosePresenceConfidence:.28");
html=html.replace("earL=joint(7,.32),earR=joint(8,.32),poseNose=joint(0,.28),poseEyeA=joint(2,.25),poseEyeB=joint(5,.25)","earL=joint(7,.16),earR=joint(8,.16),poseNose=joint(0,.16),poseEyeA=joint(2,.16),poseEyeB=joint(5,.16)");
html=html.replace("case'upperArmL':return[joint(11,.38),joint(13,.42)];case'upperArmR':return[joint(12,.38),joint(14,.42)];case'foreArmL':return[joint(13,.42),joint(15,.45)];case'foreArmR':return[joint(14,.42),joint(16,.45)]","case'upperArmL':return[joint(11,.28),joint(13,.28)];case'upperArmR':return[joint(12,.28),joint(14,.28)];case'foreArmL':return[joint(13,.28),joint(15,.28)];case'foreArmR':return[joint(14,.28),joint(16,.28)]");
// Keep the normal iPhone path on GPU, while allowing automated visual QA on
// browsers without a usable MediaPipe WebGL context.
html=html.replace("const MP='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14',ROOT=", "const MP='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14',FORCE_CPU=new URLSearchParams(location.search).has('cpu'),ROOT=");
html=html.replace("try{o.baseOptions.delegate='GPU';pose=await v.PoseLandmarker.createFromOptions(fs,o)}catch{delete o.baseOptions.delegate;pose=await v.PoseLandmarker.createFromOptions(fs,o)}", "if(!FORCE_CPU){try{o.baseOptions.delegate='GPU';pose=await v.PoseLandmarker.createFromOptions(fs,o)}catch{o.baseOptions.delegate='CPU';pose=await v.PoseLandmarker.createFromOptions(fs,o)}}else{o.baseOptions.delegate='CPU';pose=await v.PoseLandmarker.createFromOptions(fs,o)}");
html=html.replace("try{o.baseOptions.delegate='GPU';face=await v.FaceLandmarker.createFromOptions(fs,o)}catch{delete o.baseOptions.delegate;face=await v.FaceLandmarker.createFromOptions(fs,o)}", "if(!FORCE_CPU){try{o.baseOptions.delegate='GPU';face=await v.FaceLandmarker.createFromOptions(fs,o)}catch{o.baseOptions.delegate='CPU';face=await v.FaceLandmarker.createFromOptions(fs,o)}}else{o.baseOptions.delegate='CPU';face=await v.FaceLandmarker.createFromOptions(fs,o)}");
// HTMLImageElement input is uploaded through WebGL even with the CPU delegate.
// Feed ImageData in QA mode so browsers without a WebGL context can run the
// same pose and face models entirely through the CPU/WASM path.
html=html.replace("const poseResult=pose.detect(photo);", "const inferenceImage=FORCE_CPU?(()=>{const c=document.createElement('canvas');c.width=photo.naturalWidth;c.height=photo.naturalHeight;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(photo,0,0);return x.getImageData(0,0,c.width,c.height)})():photo;const poseResult=pose.detect(inferenceImage);");
html=html.replace("faceLm=face.detect(photo).faceLandmarks?.[0]||null", "faceLm=face.detect(inferenceImage).faceLandmarks?.[0]||null");
// Include the failing stage in QA-only errors; normal users see the original
// short message.
html=html.replace("go.onclick=async()=>{go.disabled=true;try{await initPose();", "go.onclick=async()=>{go.disabled=true;let qaPhase='initPose';try{await initPose();qaPhase='poseDetect';");
html=html.replace("const poseResult=pose.detect(inferenceImage);", "const poseResult=pose.detect(inferenceImage);qaPhase='poseReady';");
html=html.replace("try{faceLm=face.detect(inferenceImage).faceLandmarks?.[0]||null}", "qaPhase='faceDetect';try{faceLm=face.detect(inferenceImage).faceLandmarks?.[0]||null}");
html=html.replace("stage.style.display='block';controls.hidden=false;", "qaPhase='renderer';stage.style.display='block';controls.hidden=false;");
html=html.replace("await loadSkeleton();", "qaPhase='skeleton';await loadSkeleton();");
html=html.replace("st(e.message||'解析できませんでした',true)", "st((FORCE_CPU?'['+qaPhase+'] ':'')+(e.message||'解析できませんでした'),true)");
html=html.replace("badge.textContent=(faceLm?'顔方向追従':'姿勢推定')+'・Human Atlas'+modeName(displayMode);","badge.textContent=(faceLm?'顔・関節アンカー追従':'姿勢推定')+'・Human Atlas'+modeName(displayMode);").replace("badge.textContent=(faceLm?'顔方向追従':'姿勢推定')+'・Human Atlas'+modeName(mode);","badge.textContent=(faceLm?'顔・関節アンカー追従':'姿勢推定')+'・Human Atlas'+modeName(mode);");
document.open();document.write(html);document.close();
})().catch(e=>document.body.innerHTML='<div style="font-family:-apple-system,sans-serif;padding:24px;color:#b91c1c"><b>読み込みに失敗しました</b><br>'+String(e.message||e)+'</div>');
</script></body></html>
