<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>筋肉骨格 Human Atlas姿勢合わせ</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#10243f;background:#edf3f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px 40px}h1{font-size:27px}.lead{color:#526579;line-height:1.55}.card{background:#fff;border-radius:20px;padding:15px}.pick{display:block;border:2px dashed #8da1b5;border-radius:15px;padding:18px;text-align:center;font-weight:900}.pick input{display:none}.go{width:100%;margin-top:10px;padding:14px;border:0;border-radius:14px;background:#16a34a;color:#fff;font-weight:900;font-size:16px}.go:disabled{opacity:.4}.stage{display:none;position:relative;margin-top:13px;border-radius:16px;overflow:hidden}.stage img{display:block;width:100%;height:auto}.stage canvas{position:absolute;inset:0;width:100%;height:100%}.status{text-align:center;font-weight:800;color:#526579;margin:10px}.atlas{margin-top:10px;padding:10px;border-radius:12px;background:#eef7f1;font-size:12px;color:#315744}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.controls button{padding:12px;border:1px solid #ccd6df;border-radius:12px;background:#fff;font-weight:800}.controls button.active{background:#10243f;color:#fff}.range{grid-column:1/-1;background:#f4f7fa;padding:10px;border-radius:12px}.range input{width:100%}.note{font-size:12px;line-height:1.55;color:#8c3c0d;background:#fff7ed;border:1px solid #fed7aa;padding:10px;border-radius:12px;margin-top:12px}.badge{position:absolute;left:8px;top:8px;background:#07111dcc;color:#fff;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800;z-index:3}</style></head><body><main class="wrap"><h1>筋肉骨格</h1><p class="lead">写真の姿勢を3D解析し、Human Atlas / BodyParts3Dの実骨格を、骨のまとまりを保ったまま写真へ重ねます。</p><section class="card"><label class="pick">📷 人物写真を選ぶ<input id="file" type="file" accept="image/*"></label><div id="status" class="status">Human Atlas骨格データを準備中…</div><button id="go" class="go" disabled>Human Atlas骨格を写真に合わせる</button><div id="atlas" class="atlas">Human Atlasへ接続しています…</div><div id="stage" class="stage"><img id="photo"><canvas id="gl"></canvas><span id="badge" class="badge"></span></div><div id="controls" class="controls" hidden><button id="bones" class="active">🦴 実骨格</button><button id="photoOnly">👤 写真だけ</button><label class="range">骨格の濃さ <input id="opacity" type="range" min="10" max="100" value="88"></label></div></section><p class="note"><b>教育用：</b>本人の骨を透視しているものではありません。BodyParts3Dの参照解剖を写真から推定した姿勢へ変形・配置しています。</p></main><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const $=s=>document.querySelector(s),file=$('#file'),go=$('#go'),statusEl=$('#status'),stage=$('#stage'),photo=$('#photo'),gl=$('#gl'),badge=$('#badge'),atlasEl=$('#atlas'),controls=$('#controls'),opacity=$('#opacity');
const MP='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14',ROOT='https://raw.githubusercontent.com/ashemag/human-atlas/main/public/models/';let atlas,skel=[],imgURL='',pose,lm,renderer,scene,camera,root,meshes=[],loaded=false,visible=true,groups={};
function st(t,e=false){statusEl.textContent=t;statusEl.style.color=e?'#b91c1c':'#526579'}
function side(n){n=n.toLowerCase();if(/\bright\b|\br\.\b/.test(n))return'R';if(/\bleft\b|\bl\.\b/.test(n))return'L';return'C'}
function region(n){n=n.toLowerCase();if(/skull|crani|mandib|maxilla|zygom|nasal bone/.test(n))return'head';if(/clavicle|scapula|sternum|rib|vertebr|spine/.test(n))return'torso';if(/sacrum|pelvi|ilium|ischium|pubis|hip bone/.test(n))return'pelvis';if(/humerus/.test(n))return'upperArm';if(/radius|ulna/.test(n))return'foreArm';if(/carpal|metacarp|phalan.*hand|finger/.test(n))return'hand';if(/femur/.test(n))return'thigh';if(/tibia|fibula|patella/.test(n))return'shin';if(/tarsal|metatars|phalan.*foot|toe|calcane|talus/.test(n))return'foot';return'other'}
function key(p){const r=region(p.name),s=side(p.name);return ['upperArm','foreArm','hand','thigh','shin','foot'].includes(r)?r+s:r}
async function decode(resp,expected,compressed){if(!resp.ok)throw Error('3D骨格ファイルを取得できません');const p=await resp.arrayBuffer(),s=new Uint8Array(p,0,2),gz=compressed&&s[0]===31&&s[1]===139,b=gz?await new Response(new Blob([p]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer():p;if(b.byteLength!==expected)throw Error('3D骨格ファイルが不完全です');return b}
async function loadAtlas(){try{atlas=await(await fetch(ROOT+'atlas.json')).json();skel=atlas.parts.filter(p=>p.system==='skeletal');atlasEl.textContent=`Human Atlas：実骨格 ${skel.length}パーツ／全${atlas.parts.length}パーツ。骨ごとではなく身体区分ごとに姿勢変換します。`;st('Human Atlas実骨格の準備ができました');if(photo.src)go.disabled=false}catch(e){st('Human Atlasを取得できませんでした',true)}}loadAtlas();
file.onchange=()=>{const f=file.files?.[0];if(!f)return;if(imgURL)URL.revokeObjectURL(imgURL);imgURL=URL.createObjectURL(f);photo.onload=()=>{go.disabled=!atlas;st(atlas?'写真を読み込みました':'Human Atlasを準備中…')};photo.src=imgURL};
async function initPose(){if(pose)return;const v=await import(MP+'/+esm'),fs=await v.FilesetResolver.forVisionTasks(MP+'/wasm'),o={baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task'},runningMode:'IMAGE',numPoses:1,minPoseDetectionConfidence:.4,minPosePresenceConfidence:.4};try{o.baseOptions.delegate='GPU';pose=await v.PoseLandmarker.createFromOptions(fs,o)}catch{delete o.baseOptions.delegate;pose=await v.PoseLandmarker.createFromOptions(fs,o)}}
function init3D(){if(renderer)return;renderer=new THREE.WebGLRenderer({canvas:gl,alpha:true,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;scene=new THREE.Scene();camera=new THREE.OrthographicCamera(-1,1,1,-1,-10,10);camera.position.z=4;scene.add(new THREE.HemisphereLight(0xffffff,0x6b7280,2.2));const d=new THREE.DirectionalLight(0xffffff,2.5);d.position.set(-2,3,4);scene.add(d);root=new THREE.Group();scene.add(root)}
function buildGroups(){groups={};for(const m of meshes){const k=key(m.userData.part);if(k==='other')continue;if(!groups[k])groups[k]={meshes:[],box:new THREE.Box3()};groups[k].meshes.push(m);const p=m.userData.part;groups[k].box.expandByPoint(new THREE.Vector3().fromArray(p.bounds[0]));groups[k].box.expandByPoint(new THREE.Vector3().fromArray(p.bounds[1]))}for(const g of Object.values(groups)){g.center=g.box.getCenter(new THREE.Vector3());g.size=g.box.getSize(new THREE.Vector3())}}
async function loadSkeleton(){if(loaded)return;init3D();const chunks=[...new Set(skel.map(p=>p.chunk))],mat=new THREE.MeshStandardMaterial({color:0xeadfbe,roughness:.56,transparent:true,opacity:.88,side:THREE.DoubleSide});let done=0;for(const ci of chunks){const ch=atlas.chunks[ci],compressed=!!ch.gzip&&typeof DecompressionStream!=='undefined',u=ROOT+(compressed?(ch.gzip||ch.url):ch.url).replace(/^.*models\//,'').replace(/^\//,'');const b=await decode(await fetch(u),ch.bytes,compressed);for(const p of skel.filter(q=>q.chunk===ci)){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(b,p.positions,p.vertexCount*3),3));g.setAttribute('normal',new THREE.BufferAttribute(new Int16Array(b,p.normals,p.vertexCount*3),3,true));g.setIndex(new THREE.BufferAttribute(new Uint32Array(b,p.indices,p.indexCount),1));const m=new THREE.Mesh(g,mat.clone());m.userData={part:p};root.add(m);meshes.push(m)}done++;st(`Human Atlas実骨格を読み込み中… ${Math.round(done/chunks.length*100)}%`)}buildGroups();loaded=true}
function L(i){const p=lm?.[i];return p&&p.visibility>.12?p:null}function xy(i){const p=L(i);return p?new THREE.Vector3((p.x-.5)*2,(.5-p.y)*2,-(p.z||0)*.55):null}function mid(a,b){return a&&b?a.clone().add(b).multiplyScalar(.5):a||b}function orient(){const a=L(11),b=L(12);if(!a||!b)return'姿勢';const dz=Math.abs((a.z||0)-(b.z||0)),w=Math.abs(a.x-b.x);return dz>.16||w<.10?'横向き':dz>.07||w<.18?'斜め':'正面'}
function target(k){switch(k){case'head':return[mid(xy(11),xy(12)),xy(0)];case'torso':return[mid(xy(23),xy(24)),mid(xy(11),xy(12))];case'pelvis':{const h=mid(xy(23),xy(24));return[h?.clone().add(new THREE.Vector3(0,-.13,0)),h]};case'upperArmL':return[xy(13),xy(11)];case'upperArmR':return[xy(14),xy(12)];case'foreArmL':return[xy(15),xy(13)];case'foreArmR':return[xy(16),xy(14)];case'handL':return[xy(19)||xy(15),xy(15)];case'handR':return[xy(20)||xy(16),xy(16)];case'thighL':return[xy(25),xy(23)];case'thighR':return[xy(26),xy(24)];case'shinL':return[xy(27),xy(25)];case'shinR':return[xy(28),xy(26)];case'footL':return[xy(31),xy(27)];case'footR':return[xy(32),xy(28)];default:return[null,null]}}
function poseGroups(){for(const m of meshes)m.visible=false;for(const [k,g] of Object.entries(groups)){const [distal,prox]=target(k);if(!distal||!prox)continue;const dst=distal.distanceTo(prox),src=Math.max(g.size.y,.001);let sc=dst/src;if(k==='head')sc=Math.min(sc,xy(11)&&xy(12)?xy(11).distanceTo(xy(12))/Math.max(g.size.x,.001)*.42:sc);if(k==='torso')sc=Math.min(sc,xy(11).distanceTo(xy(12))/Math.max(g.size.x,.001)*1.08);if(k==='pelvis')sc=(xy(23).distanceTo(xy(24))/Math.max(g.size.x,.001))*1.06;sc=Math.min(sc,0.018);const dir=prox.clone().sub(distal).normalize(),q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),dir),dstCenter=mid(distal,prox);for(const m of g.meshes){m.visible=visible;m.scale.setScalar(sc);m.quaternion.copy(q);m.position.copy(dstCenter).sub(g.center.clone().multiplyScalar(sc).applyQuaternion(q))}}
resize3D();render()}
function resize3D(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);const a=w/h;camera.left=-a;camera.right=a;camera.top=1;camera.bottom=-1;camera.updateProjectionMatrix()}function render(){renderer?.render(scene,camera)}
go.onclick=async()=>{go.disabled=true;try{await initPose();st('写真の3D姿勢を解析しています…');lm=pose.detect(photo).landmarks?.[0];if(!lm)throw Error('人物を認識できませんでした');stage.style.display='block';controls.hidden=false;badge.textContent=orient()+'・Human Atlas実骨格';await new Promise(r=>requestAnimationFrame(r));await loadSkeleton();poseGroups();st('実骨格を部位ごとのまとまりを保って写真姿勢へ配置しました')}catch(e){console.error(e);st(e.message||'解析できませんでした',true)}finally{go.disabled=false}};
$('#bones').onclick=()=>{visible=true;$('#bones').classList.add('active');$('#photoOnly').classList.remove('active');poseGroups()};$('#photoOnly').onclick=()=>{visible=false;$('#photoOnly').classList.add('active');$('#bones').classList.remove('active');meshes.forEach(m=>m.visible=false);render()};opacity.oninput=()=>{meshes.forEach(m=>m.material.opacity=+opacity.value/100);render()};addEventListener('resize',()=>{if(renderer){resize3D();render()}});
</script></body></html>
