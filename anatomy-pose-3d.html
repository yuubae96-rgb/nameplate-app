<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>筋肉骨格 Human Atlas姿勢合わせ</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#10243f;background:#edf3f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px 40px}h1{font-size:27px;margin:4px 0}.lead{color:#526579;line-height:1.55}.card{background:#fff;border-radius:20px;padding:15px;box-shadow:0 8px 28px #16324f12}.pick{display:block;border:2px dashed #8da1b5;border-radius:15px;padding:18px;text-align:center;font-weight:900}.pick input{display:none}.go{width:100%;margin-top:10px;padding:14px;border:0;border-radius:14px;background:#16a34a;color:white;font-weight:900;font-size:16px}.go:disabled{opacity:.4}.stage{display:none;position:relative;margin-top:13px;border-radius:16px;overflow:hidden;background:#08111d}.stage canvas{display:block;width:100%;height:auto}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.tabs button{padding:11px 3px;border:1px solid #ccd6df;border-radius:12px;background:white;font-weight:800}.tabs button.active{background:#10243f;color:#fff}.status{text-align:center;font-weight:800;color:#526579;margin:10px 0}.atlas{margin-top:10px;padding:10px;border-radius:12px;background:#eef7f1;font-size:12px;line-height:1.5;color:#315744}.note{font-size:12px;line-height:1.55;color:#8c3c0d;background:#fff7ed;border:1px solid #fed7aa;padding:10px;border-radius:12px;margin-top:12px}.badge{position:absolute;left:8px;top:8px;background:#07111dcc;color:#fff;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800}</style></head><body><main class="wrap"><h1>筋肉骨格</h1><p class="lead">写真の3D姿勢にHuman Atlas / BodyParts3Dの骨格を対応付ける実装版です。正面・斜め・横向きを解析します。</p><section class="card"><label class="pick">📷 人物写真を選ぶ<input id="file" type="file" accept="image/*"></label><div id="status" class="status">Human Atlas骨格データを準備中…</div><button id="go" class="go" disabled>写真の姿勢に骨格を合わせる</button><div id="atlas" class="atlas">Human Atlasへ接続しています…</div><div id="stage" class="stage"><canvas id="c"></canvas><span id="badge" class="badge"></span></div><div id="tabs" class="tabs" hidden><button data-v="bones" class="active">🦴 骨格</button><button data-v="joints">● 関節</button><button data-v="photo">👤 写真</button></div></section><p class="note"><b>教育用：</b>写真から本人の骨を透視するものではありません。BodyParts3Dの成人男性参照解剖を、写真から推定した姿勢へ対応付けます。</p></main><script type="module">const $=s=>document.querySelector(s),file=$('#file'),go=$('#go'),statusEl=$('#status'),stage=$('#stage'),tabs=$('#tabs'),c=$('#c'),x=c.getContext('2d'),badge=$('#badge'),atlasEl=$('#atlas');let img,pose,lm,url='',view='bones',atlas=null,skel=[];const CDN='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14',ATLAS='https://raw.githubusercontent.com/ashemag/human-atlas/main/public/models/atlas.json';function st(t,e=false){statusEl.textContent=t;statusEl.style.color=e?'#b91c1c':'#526579'}function region(n){n=n.toLowerCase();if(/skull|crani|mandib|maxilla|zygom|nasal bone/.test(n))return'頭';if(/clavicle|scapula|sternum|rib|vertebr|spine|sacrum/.test(n))return'体幹';if(/pelvi|ilium|ischium|pubis|hip bone/.test(n))return'骨盤';if(/humerus/.test(n))return'上腕';if(/radius|ulna/.test(n))return'前腕';if(/carpal|metacarp|phalan.*hand|finger/.test(n))return'手';if(/femur/.test(n))return'大腿';if(/tibia|fibula|patella/.test(n))return'下腿';if(/tarsal|metatars|phalan.*foot|toe|calcane|talus/.test(n))return'足';return'その他'}async function loadAtlas(){try{const r=await fetch(ATLAS);if(!r.ok)throw Error('atlas');atlas=await r.json();skel=atlas.parts.filter(p=>p.system==='skeletal');const groups={};skel.forEach(p=>groups[region(p.name)]=(groups[region(p.name)]||0)+1);atlasEl.textContent=`Human Atlas接続済み：骨格 ${skel.length}パーツ／全 ${atlas.parts.length}パーツ。姿勢対応：`+Object.entries(groups).filter(([k])=>k!=='その他').map(([k,v])=>`${k}${v}`).join('・');st('Human Atlas骨格の準備ができました');if(img)go.disabled=false}catch(e){atlasEl.textContent='Human Atlasデータの取得に失敗しました。再読み込みしてください';st('Human Atlas骨格を取得できませんでした',true)}}loadAtlas();file.onchange=()=>{const f=file.files?.[0];if(!f)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);img=new Image;img.onload=()=>{go.disabled=!atlas;st(atlas?'写真を読み込みました。骨格を合わせられます':'写真を読み込みました。Human Atlasを準備中…')};img.src=url};async function init(){if(pose)return;st('3D姿勢AIを準備しています…');const v=await import(CDN+'/+esm'),fs=await v.FilesetResolver.forVisionTasks(CDN+'/wasm'),o={baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task'},runningMode:'IMAGE',numPoses:1,minPoseDetectionConfidence:.4,minPosePresenceConfidence:.4};try{o.baseOptions.delegate='GPU';pose=await v.PoseLandmarker.createFromOptions(fs,o)}catch(e){delete o.baseOptions.delegate;pose=await v.PoseLandmarker.createFromOptions(fs,o)}}go.onclick=async()=>{go.disabled=true;try{await init();st('Human Atlas骨格を写真の肩・腰・腕・脚へ対応付けています…');const r=pose.detect(img);lm=r.landmarks?.[0];if(!lm)throw Error('人物を認識できませんでした');stage.style.display='block';tabs.hidden=false;draw();st(`姿勢を読み取りました。Human Atlas骨格 ${skel.length}パーツを身体部位へ分類済み`)}catch(e){st(e.message||'解析できませんでした',true)}finally{go.disabled=false}};document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-v]').forEach(q=>q.classList.remove('active'));b.classList.add('active');view=b.dataset.v;draw()});function P(i){const p=lm?.[i];return p&&p.visibility>.15?{x:p.x*c.width,y:p.y*c.height,z:p.z||0}:null}function bone(a,b,w){if(!a||!b)return;const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,wa=w*(1-Math.max(-.4,Math.min(.4,(a.z+b.z)/2))*.32);x.save();x.globalAlpha=.94;x.fillStyle='#eee5cf';x.strokeStyle='#796f60';x.lineWidth=1;x.beginPath();x.moveTo(a.x+nx*wa,a.y+ny*wa);x.quadraticCurveTo((a.x+b.x)/2+nx*wa*.65,(a.y+b.y)/2+ny*wa*.65,b.x+nx*wa*.72,b.y+ny*wa*.72);x.lineTo(b.x-nx*wa*.72,b.y-ny*wa*.72);x.quadraticCurveTo((a.x+b.x)/2-nx*wa*.65,(a.y+b.y)/2-ny*wa*.65,a.x-nx*wa,a.y-ny*wa);x.closePath();x.fill();x.stroke();x.restore()}function joint(p,r){if(!p)return;x.save();const g=x.createRadialGradient(p.x-r*.3,p.y-r*.3,1,p.x,p.y,r);g.addColorStop(0,'#fffdf1');g.addColorStop(1,'#c4b69c');x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,r,0,7);x.fill();x.restore()}function orientation(){const l=P(11),r=P(12);if(!l||!r)return'姿勢';const dz=Math.abs(l.z-r.z),w=Math.abs(l.x-r.x)/c.width;if(dz>.16||w<.10)return'横向き';if(dz>.07||w<.18)return'斜め';return'正面'}function draw(){if(!img)return;const s=Math.min(1,1400/img.naturalWidth,1400/img.naturalHeight);c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);x.clearRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);if(!lm)return;badge.textContent=orientation()+'・Human Atlas対応';if(view==='photo')return;const pairs=[[11,12],[11,23],[12,24],[23,24],[11,13],[13,15],[12,14],[14,16],[23,25],[25,27],[27,31],[24,26],[26,28],[28,32]],sh=Math.hypot(P(11).x-P(12).x,P(11).y-P(12).y);if(view==='bones')pairs.map(q=>({q,z:((P(q[0])?.z||0)+(P(q[1])?.z||0))/2})).sort((a,b)=>b.z-a.z).forEach(o=>bone(P(o.q[0]),P(o.q[1]),sh*.025));[0,11,12,13,14,15,16,23,24,25,26,27,28,31,32].forEach(i=>joint(P(i),sh*((i===23||i===24)?.032:.021)));const nose=P(0),le=P(7),re=P(8);if(nose){const fw=le&&re?Math.hypot(le.x-re.x,le.y-re.y):sh*.3;x.save();x.globalAlpha=.92;x.fillStyle='#e9dfc8';x.strokeStyle='#796f60';x.lineWidth=2;x.beginPath();x.ellipse(nose.x,nose.y-fw*.08,fw*.48,fw*.62,0,0,7);x.fill();x.stroke();x.restore()}}</script></body></html>
