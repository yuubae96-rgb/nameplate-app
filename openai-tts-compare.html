<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OpenAI TTS ナレーション比較</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#17213a;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.head{background:#172239;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}.head h1{font-size:20px;margin:0}.main{max-width:760px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #d7dde6;border-radius:16px;padding:14px;margin-bottom:12px}label{display:block;font-weight:800;font-size:13px;margin:0 0 6px}textarea{width:100%;min-height:110px;border:1px solid #ccd4df;border-radius:12px;padding:10px;font-size:15px;line-height:1.6}select{width:100%;height:46px;border:1px solid #ccd4df;border-radius:12px;background:#fff;padding:0 10px;font-size:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.btn{width:100%;border:0;border-radius:12px;min-height:48px;background:#172239;color:#fff;font-weight:900;font-size:15px}.status{font-size:12px;color:#667188;margin-top:8px;line-height:1.5}audio{width:100%;margin-top:12px}.note{background:#fff7df;border-radius:10px;padding:10px;font-size:12px;line-height:1.6}.back{display:block;text-align:center;margin:16px 0;color:#172239}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><header class="head"><h1>🎙 OpenAI TTS ナレーション試聴</h1></header><main class="main"><section class="card"><div class="note">本番のYouTube動画作成アプリは変更していません。OpenAIのGPT-4o Mini TTSだけを別ページで試聴します。</div><div style="margin-top:12px"><label>試聴文章</label><textarea id="text">幕末の日本。時代が大きく動こうとしていたその時、一人の男が新しい国の姿を思い描いていました。その名は、坂本龍馬。</textarea></div><div class="grid"><div><label>声</label><select id="voice"><option value="onyx">Onyx</option><option value="alloy">Alloy</option><option value="ash">Ash</option><option value="ballad">Ballad</option><option value="coral">Coral</option><option value="echo">Echo</option><option value="fable">Fable</option><option value="nova">Nova</option><option value="sage">Sage</option><option value="shimmer">Shimmer</option><option value="verse">Verse</option></select></div><div style="align-self:end"><button class="btn" id="go">この声を試聴する</button></div></div><div id="status" class="status">接続確認中…</div><audio id="audio" controls></audio></section><a class="back" href="youtube-video.html">← YouTube動画作成へ戻る</a></main><script>const FN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/openai-tts-compare';const $=x=>document.getElementById(x);async function call(b){const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}async function check(){try{const d=await call({action:'status'});$('status').textContent=d.configured?'OpenAI API接続OK。声を選んで試聴できます。':'OPENAI_API_KEYが未設定です。'}catch(e){$('status').textContent='接続エラー: '+e.message}}$('go').onclick=async()=>{const btn=$('go');btn.disabled=true;$('status').textContent='音声生成中…';try{const d=await call({action:'generate',text:$('text').value,voice:$('voice').value});$('audio').src='data:'+(d.mimeType||'audio/mpeg')+';base64,'+d.data;$('audio').play();$('status').textContent=`${d.voice} / GPT-4o Mini TTS`;}catch(e){$('status').textContent=e.message}finally{btn.disabled=false}};check();</script></body></html>
