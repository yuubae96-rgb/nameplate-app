<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>筋肉骨格 Human Atlas姿勢合わせ</title></head><body><div style="font-family:-apple-system,sans-serif;padding:24px;text-align:center">関節固定版を読み込み中…</div><script>
(async()=>{
  const pinned='https://raw.githubusercontent.com/yuubae96-rgb/nameplate-app/91de6129dcd92db79f0c46ede35eedc90bafe104/anatomy-pose-3d.html';
  let wrapper=await(await fetch(pinned,{cache:'no-store'})).text();

  const before="eyeY=system==='muscular'?.79:.55,eyeZ=system==='muscular'?.88:.82";
  // Human Atlas頭蓋骨の眼窩中心。旧値 .63 は眼窩より頭頂寄りを
  // 固定点にしてしまい、描画された眼窩が写真の目より下へ落ちていた。
  const after ="eyeY=system==='muscular'?.79:.535,eyeZ=system==='muscular'?.88:.82";
  if(!wrapper.includes(before))throw new Error('眼窩基準コードを確認できませんでした');
  wrapper=wrapper.replace(before,after);
  wrapper=wrapper.replace("const faceScale=faceW/(g.size.x*(system==='muscular'?.92:.90)),faceWeight=faceLm?.55:.72;headScale=headScale*(1-faceWeight)+faceScale*faceWeight", "const faceScale=faceW/(g.size.x*(system==='muscular'?.92:.90)),faceWeight=system==='skeletal'?(faceLm?.18:.38):(faceLm?.55:.72);headScale=headScale*(1-faceWeight)+faceScale*faceWeight");

  // 非等方倍率でも基準点を写真の関節へ固定する処理を、基底HTMLの
  // 展開時に注入する（このファイルは過去版を展開する互換ラッパー）。
  const writeMarker="document.open();document.write(html);document.close();";
  const injectScaled=`const poseMarker2="function poseSingleSystem(system,clear=true){";const placeScaled2="function placeScaled(g,sx,sy,sz,q,anchor,sourceAnchor){for(const m of g.meshes){m.visible=visible;m.scale.set(sx,sy,sz);m.quaternion.copy(q);const scaled=new THREE.Vector3(sourceAnchor.x*sx,sourceAnchor.y*sy,sourceAnchor.z*sz);m.position.copy(anchor).sub(scaled.applyQuaternion(q))}}\\n";if(!html.includes(poseMarker2))throw Error('姿勢配置コードを確認できませんでした');html=html.replace(poseMarker2,placeScaled2+poseMarker2);\n`;
  const torsoCss=`.torso-touch-zone{display:none;position:absolute;z-index:4;border-radius:24%;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}.torso-touch-zone.active{outline:2px solid #38bdf8aa;background:#38bdf812;cursor:grabbing}.torsogesture-help{grid-column:1/-1;background:#eef7ff;border:1px solid #bae6fd;padding:11px;border-radius:12px;color:#164e63;line-height:1.5}.torsogesture-help b{display:block;margin-bottom:4px}`;
  const torsoMarkup='<div id="torsoGesture" class="torso-touch-zone" aria-label="胸郭を直接調整"></div>';
  const torsoGestureCode=`
const torsoGesture=document.getElementById('torsoGesture'),torsoPointers=new Map();let torsoGestureState=null;
function torsoSystem(){return displayMode==='both'?adjustMode:displayMode}
function torsoGestureGeometry(){const a=lm?.[11],b=lm?.[12],c=lm?.[23],d=lm?.[24];if(!a||!b)return null;const w=stage.clientWidth,h=stage.clientHeight,sx=(a.x+b.x)*.5,sy=(a.y+b.y)*.5,hx=c&&d?(c.x+d.x)*.5:sx,hy=c&&d?(c.y+d.y)*.5:sy+.28;const shoulderPx=Math.hypot((b.x-a.x)*w,(b.y-a.y)*h),bodyPx=Math.max(Math.hypot((hx-sx)*w,(hy-sy)*h),shoulderPx*.78);return{x:(sx+hx)*.5*w,y:(sy+hy)*.5*h,width:THREE.MathUtils.clamp(shoulderPx*1.18,92,w*.78),height:THREE.MathUtils.clamp(bodyPx*1.08,100,h*.48)}}
function updateTorsoGesture(){if(!torsoGesture||!lm||!visible||torsoSystem()==='photo'){if(torsoGesture)torsoGesture.style.display='none';return}const g=torsoGestureGeometry();if(!g){torsoGesture.style.display='none';return}torsoGesture.style.display='block';torsoGesture.style.width=g.width+'px';torsoGesture.style.height=g.height+'px';torsoGesture.style.left=(g.x-g.width/2)+'px';torsoGesture.style.top=(g.y-g.height/2)+'px'}
function torsoPair(){const p=[...torsoPointers.values()];if(p.length<2)return null;return{distance:Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y),x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2}}
function beginTorsoSingle(){const first=torsoPointers.entries().next().value;if(!first)return;const [id,p]=first,system=torsoSystem(),o=offsets[system].torso;torsoGestureState={mode:'single',id,x:p.x,y:p.y,system,ox:o.x,oy:o.y}}
torsoGesture.onpointerdown=e=>{if(!visible||torsoSystem()==='photo')return;e.preventDefault();torsoGesture.setPointerCapture(e.pointerId);torsoPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});torsoGesture.classList.add('active');if(torsoPointers.size===1)beginTorsoSingle();else{const p=torsoPair(),system=torsoSystem(),o=offsets[system].torso,values=system==='muscular'?muscleSizes:sizes;torsoGestureState={mode:'dual',distance:Math.max(p.distance,1),x:p.x,y:p.y,system,size:values.torso,ox:o.x,oy:o.y}}};
torsoGesture.onpointermove=e=>{if(!torsoPointers.has(e.pointerId))return;e.preventDefault();torsoPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const sw=stage.clientWidth||1,sh=stage.clientHeight||1;if(torsoPointers.size===1&&torsoGestureState?.mode==='single'){const p=torsoPointers.get(torsoGestureState.id);if(!p)return;const o=offsets[torsoGestureState.system].torso;o.x=torsoGestureState.ox+(p.x-torsoGestureState.x)*2*photoAspect()/sw;o.y=torsoGestureState.oy-(p.y-torsoGestureState.y)*2/sh;poseGroups(true)}else if(torsoPointers.size>=2){const p=torsoPair();if(!p)return;if(torsoGestureState?.mode!=='dual'){const system=torsoSystem(),o=offsets[system].torso,values=system==='muscular'?muscleSizes:sizes;torsoGestureState={mode:'dual',distance:Math.max(p.distance,1),x:p.x,y:p.y,system,size:values.torso,ox:o.x,oy:o.y}}const values=torsoGestureState.system==='muscular'?muscleSizes:sizes,o=offsets[torsoGestureState.system].torso;values.torso=THREE.MathUtils.clamp(torsoGestureState.size*p.distance/torsoGestureState.distance,.55,1.8);o.x=torsoGestureState.ox+(p.x-torsoGestureState.x)*2*photoAspect()/sw;o.y=torsoGestureState.oy-(p.y-torsoGestureState.y)*2/sh;if(adjustMode===torsoGestureState.system&&sizePart.value==='torso')syncSizeControl();poseGroups(true)}};
function finishTorsoPointer(e){torsoPointers.delete(e.pointerId);if(torsoPointers.size===0){torsoGesture.classList.remove('active');torsoGestureState=null}else if(torsoPointers.size===1)beginTorsoSingle()}
torsoGesture.onpointerup=finishTorsoPointer;torsoGesture.onpointercancel=finishTorsoPointer;addEventListener('resize',updateTorsoGesture);
`;
  const injectTorso=`html=html.replace('</style>',${JSON.stringify(torsoCss)}+'</style>');html=html.replace('<div id="headGesture" class="head-touch-zone"',${JSON.stringify(torsoMarkup)}+'<div id="headGesture" class="head-touch-zone"');html=html.replace("if(!skipHandles)refreshHandles();updateHeadGesture()}","if(!skipHandles)refreshHandles();updateHeadGesture();updateTorsoGesture()}");const torsoGestureCode2=${JSON.stringify(torsoGestureCode)};html=html.replace(moduleEnd,torsoGestureCode2+moduleEnd);html=html.replace('<div class="headgesture-help"><b>👆 写真の上で頭蓋骨を直接操作</b>','<div class="torsogesture-help"><b>🫁 写真の上で胸郭を直接操作</b>1本指：位置を上下左右へ移動<br>2本指：開閉で拡大縮小</div><div class="headgesture-help"><b>👆 写真の上で頭蓋骨を直接操作</b>');\n`;
  if(!wrapper.includes(writeMarker))throw new Error('HTML展開コードを確認できませんでした');
  wrapper=wrapper.replace(writeMarker,injectScaled+injectTorso+writeMarker);

  // 縦は肩〜股関節長で決定し、横幅は肩幅へ合わせる。
  // g.obj は存在しなかったため、実メッシュを直接縦横別に配置する。
  const torsoOld="let torsoFit=base*.94;if(g.size.x>0&&g.size.y>0){const sx=shoulderW/(g.size.x*(system==='muscular'?.78:.86)),sy=torsoLen/(g.size.y*(system==='muscular'?.78:.88));torsoFit=THREE.MathUtils.clamp(Math.min(sx,sy),base*.62,base*.98)}placeUniform(g,torsoFit*(system==='muscular'?.90:1)*sizesNow.torso,q,torsoCenter.clone().add(shift),g.center);continue";
  const torsoNew="let torsoFit=base*.90,wide=1;if(g.size.x>0&&g.size.y>0){const sx=shoulderW/(g.size.x*(system==='muscular'?.84:.90)),sy=torsoLen/(g.size.y*(system==='muscular'?1.00:1.10));torsoFit=THREE.MathUtils.clamp(sy,base*.56,base*.88);wide=THREE.MathUtils.clamp(sx/Math.max(torsoFit,.001),1.04,1.28)}const jointTorsoAnchor=torsoCenter.clone().add(shift);jointTorsoAnchor.y+=torsoLen*.105;const ls=joint(11,.24),rs=joint(12,.24);if(ls&&rs){const neckX=(ls.x+rs.x)*.5;jointTorsoAnchor.x=neckX+shift.x}const torsoScale=torsoFit*(system==='muscular'?.88:1)*sizesNow.torso;placeScaled(g,torsoScale*wide,torsoScale,torsoScale,q,jointTorsoAnchor,g.center);continue";
  if(!wrapper.includes(torsoOld))throw new Error('体幹サイズコードを確認できませんでした');
  wrapper=wrapper.replace(torsoOld,torsoNew);

  // 遮蔽箇所で presence だけが高い推測関節を除外する。
  wrapper=wrapper.replace("function L(i,min=.12){const p=lm?.[i],score=p?Math.max(p.visibility||0,(p.presence||0)*.55):0;return p&&score>min?p:null}", "function L(i,min=.12){const p=lm?.[i],visibility=p?.visibility||0,presence=p?.presence||0,core=[0,2,5,7,8,11,12,23,24].includes(i),score=core?Math.max(visibility,presence*.42):visibility;return p&&score>min?p:null}");
  wrapper=wrapper.replace("case'upperArmL':return[joint(11,.28),joint(13,.28)];case'upperArmR':return[joint(12,.28),joint(14,.28)];case'foreArmL':return[joint(13,.28),joint(15,.28)];case'foreArmR':return[joint(14,.28),joint(16,.28)]", "case'upperArmL':return[joint(11,.24),joint(13,.24)];case'upperArmR':return[joint(12,.24),joint(14,.24)];case'foreArmL':return[joint(13,.30),joint(15,.34)];case'foreArmR':return[joint(14,.30),joint(16,.34)]");
  wrapper=wrapper.replace("function legChains(){const h=[joint(23,.18),joint(24,.18)],k=[joint(25,.18),joint(26,.18)],a=[joint(27,.18),joint(28,.18)],f=[joint(31,.16)||joint(29,.16),joint(32,.16)||joint(30,.16)];return[[h[0],k[0],a[0],f[0]],[h[1],k[1],a[1],f[1]]]}", "function legChains(){const h=[joint(23,.24),joint(24,.24)],k=[joint(25,.30),joint(26,.30)],a=[joint(27,.34),joint(28,.34)],f=[joint(31,.32)||joint(29,.32),joint(32,.32)||joint(30,.32)];return[[h[0],k[0],a[0],f[0]],[h[1],k[1],a[1],f[1]]]}");

  wrapper=wrapper.replace("badge.textContent=(faceLm?'顔・関節アンカー追従':'姿勢推定')+'・Human Atlas'+modeName(displayMode);", "badge.textContent=(faceLm?'眼窩・全身関節固定':'姿勢推定')+'・Human Atlas'+modeName(displayMode);");
  wrapper=wrapper.replace("badge.textContent=(faceLm?'顔・関節アンカー追従':'姿勢推定')+'・Human Atlas'+modeName(mode);", "badge.textContent=(faceLm?'眼窩・全身関節固定':'姿勢推定')+'・Human Atlas'+modeName(mode);");

  document.open();document.write(wrapper);document.close();
})().catch(e=>{document.body.innerHTML='<div style="font-family:-apple-system,sans-serif;padding:24px;color:#b91c1c"><b>読み込みに失敗しました</b><br>'+String(e.message||e)+'</div>'});
</script></body></html>
