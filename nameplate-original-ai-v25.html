<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>銘板原稿AI｜テスト版59</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;margin:0;background:#f3f5f7;color:#172231}header{background:#17324d;color:#fff;padding:18px}main{max-width:980px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px}.hidden{display:none}.btn{border:0;border-radius:9px;padding:13px 18px;font-size:16px;font-weight:800;color:#fff;background:#17324d}.btn:disabled{background:#9ba6b0}.ok,.warn{padding:12px;border-radius:9px;margin:8px 0}.ok{background:#eaf7ee;border:1px solid #77bd89}.warn{background:#fff3a6;border:2px solid #e0a800}.ev{display:block;font-size:12px;color:#657483;margin-top:4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{border:1px solid #d7dde3;border-radius:10px;padding:12px}.item b{display:block;font-size:13px;color:#536273}.item span{font-size:19px;font-weight:800}.stage{text-align:center;background:#eef1f4;padding:20px;border-radius:12px;overflow:auto}.spec{display:inline-block;background:#fff;border:2px solid #17324d;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:18px;font-weight:800}.art{background:#fff;display:inline-block;padding:16px}.art svg{display:block;width:min(80vw,680px);height:auto}.note{color:#657483;line-height:1.6}.sheet{background:#fff;border:2px solid #172231;padding:18px;text-align:left;min-width:760px}.sheet h2{text-align:center;margin:0 0 14px}.sheetgrid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #222;border-left:1px solid #222}.sheetcell{min-height:70px;padding:9px;border-right:1px solid #222;border-bottom:1px solid #222}.sheetcell b{display:block;font-size:13px}.sheetcell strong{font-size:22px}@media(max-width:600px){.grid{grid-template-columns:1fr}.card{padding:14px}}</style></head><body><header><b>銘板原稿AI　テスト版59・板外形／表面加工領域を分離</b></header><main><div class="card"><h2>1. 客先図面</h2><input id="file" type="file" accept="image/*,.pdf"><p><button id="readBtn" class="btn">ChatGPTが図面を読む</button></p><div id="status" class="note">板そのもの・穴・黒ベタや塗装等の加工領域・文字を別々に読み取ります。</div></div><div id="analysis" class="card hidden"><h2>2. ChatGPT 図面分析・原本MASTER</h2><div id="scope"></div><div id="dims"></div><div id="verify"></div></div><div id="instruction" class="card hidden"><h2>3. 社内指示内容（16項目）</h2><div id="items" class="grid"></div><p><button id="sheetBtn" class="btn">4. 横長A4の社内製作指示書を作る</button></p></div><div id="sheetCard" class="card hidden"><h2>4. 横長A4 社内製作指示書</h2><div class="stage"><div id="sheet" class="sheet"></div></div><p><button id="proofBtn" class="btn" disabled>5. 校正用銘板原稿を見る</button></p></div><div id="proofCard" class="card hidden"><h2>5. 校正用銘板原稿</h2><div class="stage"><div id="spec" class="spec"></div><br><div id="art" class="art"></div></div></div></main><script>const U='https://emauqxftmauvsffdjvyh.supabase.co/functions/v1/read-nameplate-drawing',g=x=>document.getElementById(x),c=x=>(x==null?'':String(x).trim());let ai={};const esc=s=>c(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');const holes=()=>Array.isArray(ai.hole_positions)?ai.hole_positions:[];const els=()=>Array.isArray(ai.layout?.elements)?ai.layout.elements:[];const regs=()=>Array.isArray(ai.surface_regions)?ai.surface_regions:[];const wi=()=>Array.isArray(ai.work_instruction?.items)?ai.work_instruction.items:[];function du(f){return new Promise((a,b)=>{let r=new FileReader;r.onload=()=>a(r.result);r.onerror=b;r.readAsDataURL(f)})}function chk(k){return !!ai.verification?.checks?.[k]}function bx(l,v,k){return '<div class="'+(chk(k)?'ok':'warn')+'"><b>'+esc(l)+'：</b>'+esc(v)+' '+(chk(k)?'✓':'⚠ 要確認')+'</div>'}async function read(){let f=g('file').files[0];if(!f)return;g('readBtn').disabled=true;g('status').textContent='板外形・穴・加工領域・文字を分離してMASTER作成中…';try{let d=await du(f),r=await fetch(U,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:d,type:f.type,name:f.name})}),j=await r.json();if(!r.ok||j.error)throw Error(j.error||'読取失敗');ai=j.result||{};show()}catch(e){g('status').textContent='エラー：'+e.message}finally{g('readBtn').disabled=false}}function show(){let s=ai.scope||{},conf=Math.round((+s.confidence||0)*100),all=!!ai.verification?.all_verified;g('scope').className=s.target_found&&conf>=80?'ok':'warn';g('scope').innerHTML='<b>完成銘板：</b>'+esc(s.description||'特定できません')+'<span class="ev">認識 '+conf+'%</span>';let outerOk=chk('width')&&chk('height'),holeOk=chk('hole_diameter')&&chk('hole_count');let holeText=ai.hole_count?((ai.hole_diameter_mm||'?')+'φ-'+ai.hole_count+'ヶ'):'未確定';g('dims').innerHTML='<div class="'+(outerOk?'ok':'warn')+'"><b>外形：</b>'+esc((ai.width_mm||'?')+' × '+(ai.height_mm||'?')+' mm')+' '+(outerOk?'✓':'⚠ 要確認')+'</div>'+'<div class="'+(holeOk?'ok':'warn')+'"><b>穴：</b>'+esc(holeText)+' '+(holeOk?'✓':'⚠ 要確認')+'</div>'+bx('板外角',ai.radius||'不明','corner_radius')+bx('穴位置',holes().length+'ヶ','hole_positions')+'<div class="ok"><b>表面加工領域：</b>'+regs().length+'領域</div>';let issues=[...(ai.verification?.audit_issues||[]),...(ai.verification?.mismatches||[])];g('verify').className=all?'ok':'warn';g('verify').innerHTML=(all?'<b>外形・穴・板外角・穴位置が一致。表面加工領域は板外形と別データで原稿化します。</b>':'<b>要確認があります。5は止めています。</b>')+(issues.length?'<span class="ev">'+issues.map(esc).join(' / ')+'</span>':'');g('items').innerHTML=wi().map(x=>'<div class="item '+(!x.verified?'warn':'')+'"><b>'+esc(x.label)+'</b><span>'+esc(x.value||'')+'</span></div>').join('');g('proofBtn').disabled=!all;g('analysis').classList.remove('hidden');g('instruction').classList.remove('hidden');g('status').textContent=all?'読取完了。MASTER確定。':'読取完了。要確認項目があります。'}function sheet(){let a=wi();g('sheet').innerHTML='<h2>社内製作指示書</h2><div class="sheetgrid">'+a.map(x=>'<div class="sheetcell"><b>'+esc(x.label)+'</b><strong>'+esc(x.value||'')+'</strong></div>').join('')+'</div>';g('sheetCard').classList.remove('hidden');g('sheetCard').scrollIntoView({behavior:'smooth'})}function textSize(t,ww,hh,w,h){let n=[...c(t)].length||1,usable=Math.max(1,ww*.94),byWidth=usable/(n*.78),byHeight=Math.max(1,hh*.68);return Math.max(1.35,Math.min(byWidth,byHeight,h*.05))}function col(v){return /black|黒/i.test(c(v))?'#111':/white|白/i.test(c(v))?'#fff':'#ddd'}function surfaceSvg(r,i,w,h){let x=(+r.x_pct||0)/100*w,y=(+r.y_pct||0)/100*h,ww=(+r.w_pct||0)/100*w,hh=(+r.h_pct||0)/100*h,fill=col(r.color),rr=Math.max(0,+r.radius_mm||0);if(ww<=0||hh<=0)return'';if(r.shape==='polygon'&&Array.isArray(r.points_pct)&&r.points_pct.length>2){let p=r.points_pct.map(q=>(+q[0]||0)/100*w+','+(+q[1]||0)/100*h).join(' ');return '<polygon points="'+p+'" fill="'+fill+'"/>'}if(r.shape==='corner_cutout_rect'||r.corner_style==='concave'){let id='rm'+i,rad=Math.min(rr||Math.min(ww,hh)*.08,ww/3,hh/3);return '<mask id="'+id+'"><rect x="'+x+'" y="'+y+'" width="'+ww+'" height="'+hh+'" fill="white"/><circle cx="'+x+'" cy="'+y+'" r="'+rad+'" fill="black"/><circle cx="'+(x+ww)+'" cy="'+y+'" r="'+rad+'" fill="black"/><circle cx="'+x+'" cy="'+(y+hh)+'" r="'+rad+'" fill="black"/><circle cx="'+(x+ww)+'" cy="'+(y+hh)+'" r="'+rad+'" fill="black"/></mask><rect x="'+x+'" y="'+y+'" width="'+ww+'" height="'+hh+'" fill="'+fill+'" mask="url(#'+id+')"/>'}return '<rect x="'+x+'" y="'+y+'" width="'+ww+'" height="'+hh+'" rx="'+(r.shape==='rounded_rect'?rr:0)+'" fill="'+fill+'"/>'}function svg(){let w=+ai.width_mm,h=+ai.height_mm,rad=ai.plate?.corner_radius_none?0:(+ai.plate?.corner_radius_mm||0),hasRegs=regs().length>0,plateFill=hasRegs?col(ai.plate?.color):col(ai.ground_color),textFg=/white|白/i.test(c(ai.text_line_color))?'#fff':/black|黒/i.test(c(ai.text_line_color))?'#111':(/black|黒/i.test(c(ai.ground_color))?'#fff':'#111'),z='<defs><clipPath id="plateClip"><rect x=".5" y=".5" width="'+(w-1)+'" height="'+(h-1)+'" rx="'+rad+'"/></clipPath></defs><rect x=".25" y=".25" width="'+(w-.5)+'" height="'+(h-.5)+'" rx="'+rad+'" fill="'+plateFill+'" stroke="#666" stroke-width=".5"/><g clip-path="url(#plateClip)">';regs().forEach((r,i)=>z+=surfaceSvg(r,i,w,h));holes().forEach(q=>z+='<circle cx="'+q.x_mm+'" cy="'+q.y_mm+'" r="'+(+ai.hole_diameter_mm/2)+'" fill="#fff" stroke="#aaa" stroke-width=".2"/>');els().forEach(e=>{let x=Math.max(.8,(+e.x_pct||0)/100*w),y=Math.max(.8,(+e.y_pct||0)/100*h),ww=Math.min((+e.w_pct||0)/100*w,w-x-.8),hh=Math.min((+e.h_pct||0)/100*h,h-y-.8);if(ww<=0||hh<=0)return;if(e.type==='text'){let t=c(e.text)||[e.label,e.value].filter(Boolean).join('　'),fs=textSize(t,ww,hh,w,h),an=e.align==='center'?'middle':e.align==='right'?'end':'start',pad=Math.min(ww*.03,1.2),xx=e.align==='center'?x+ww/2:e.align==='right'?x+ww-pad:x+pad;z+='<text x="'+xx+'" y="'+(y+hh*.68)+'" fill="'+textFg+'" font-size="'+fs+'" text-anchor="'+an+'" font-family="Yu Gothic,Arial" textLength="'+Math.max(1,ww-pad*2)+'" lengthAdjust="spacingAndGlyphs">'+esc(t)+'</text>'}else if(e.type==='line')z+='<line x1="'+x+'" y1="'+(y+hh/2)+'" x2="'+(x+ww)+'" y2="'+(y+hh/2)+'" stroke="'+textFg+'" stroke-width=".35"/>';else if(e.type==='box')z+='<rect x="'+x+'" y="'+y+'" width="'+ww+'" height="'+hh+'" fill="none" stroke="'+textFg+'" stroke-width=".35"/>'});return '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'mm" height="'+h+'mm" viewBox="0 0 '+w+' '+h+'">'+z+'</g></svg>'}function proof(){if(!ai.verification?.all_verified)return;g('spec').textContent=ai.width_mm+' × '+ai.height_mm+' mm　｜　'+(ai.hole_count?ai.hole_diameter_mm+'φ-'+ai.hole_count+'ヶ':'穴なし')+'　｜　'+ai.radius;g('art').innerHTML=svg();g('proofCard').classList.remove('hidden');g('proofCard').scrollIntoView({behavior:'smooth'})}g('readBtn').onclick=read;g('sheetBtn').onclick=sheet;g('proofBtn').onclick=proof;</script></body></html>
