<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>銘板原稿AI｜テスト版38</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;margin:0;background:#f3f5f7;color:#172231}header{background:#17324d;color:#fff;padding:18px}main{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px}.hidden{display:none}.btn{border:0;border-radius:9px;padding:13px 18px;font-size:16px;font-weight:800;color:#fff;background:#17324d}.btn:disabled{background:#9ba6b0}.ok,.warn{padding:12px;border-radius:9px;margin:8px 0}.ok{background:#eaf7ee;border:1px solid #77bd89}.warn{background:#fff3a6;border:2px solid #e0a800}.ev{display:block;font-size:12px;color:#657483;margin-top:4px}.row{padding:9px;border-bottom:1px solid #ddd}.stage{text-align:center;background:#eef1f4;padding:20px;border-radius:12px;overflow:auto}.spec{display:inline-block;background:#fff;border:2px solid #17324d;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:18px;font-weight:800}.art{background:#fff;display:inline-block;padding:16px}.art svg{display:block;width:min(80vw,680px);height:auto}.note{color:#657483;line-height:1.6}</style></head><body><header><b>銘板原稿AI　テスト版38・忠実トレース方式</b></header><main><div class="card"><h2>1. 客先図面</h2><input id="file" type="file" accept="image/*,.pdf"><p><button id="readBtn" class="btn">ChatGPTが銘板本体を忠実トレース</button></p><div id="status" class="note">図面を説明文に変えず、完成銘板の中に実際にある文字・罫線・ロゴ・穴・形状を要素ごとにトレースします。製作寸法は寸法線の根拠があるものだけ採用します。</div></div><div id="readCard" class="card hidden"><h2>2. ChatGPTが理解した完成銘板</h2><div id="scopeBox"></div><div id="dims"></div><h3>銘板内部のトレース要素</h3><div id="texts"></div><div id="audit"></div><div id="verifyBox"></div><p><button id="proofBtn" class="btn" disabled>3. 忠実トレース校正図を見る</button></p></div><div id="proofCard" class="card hidden"><h2>3. 校正用銘板原稿</h2><div class="stage"><div id="specBox" class="spec"></div><br><div id="proofArt" class="art"></div></div></div></main><script>const U='https://emauqxftmauvsffdjvyh.supabase.co/functions/v1/read-nameplate-drawing',g=x=>document.getElementById(x),c=x=>(x==null?'':String(x).trim());let ai={};function du(f){return new Promise((a,b)=>{let r=new FileReader;r.onload=()=>a(r.result);r.onerror=b;r.readAsDataURL(f)})}function esc(s){return c(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function rows(){return Array.isArray(ai.layout?.rows)?ai.layout.rows:[]}function holes(){return Array.isArray(ai.hole_positions)?ai.hole_positions:[]}function elements(){return Array.isArray(ai.layout?.elements)?ai.layout.elements:[]}function chk(k){return !!ai.verification?.checks?.[k]}function box(l,v,k){return '<div class="'+(chk(k)?'ok':'warn')+'"><b>'+esc(l)+'：</b>'+esc(v)+' '+(chk(k)?'✓ 根拠確認':'⚠ 未確定')+'</div>'}async function read(){let f=g('file').files[0];if(!f)return;g('readBtn').disabled=true;g('status').textContent='銘板本体を特定 → 内部を忠実トレース → 寸法線の指示先を確認 → 最終校正中…';try{let d=await du(f),r=await fetch(U,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:d,type:f.type,name:f.name})}),j=await r.json();if(!r.ok||j.error)throw Error(j.error||'読取失敗');ai=j.result||{};show()}catch(e){g('status').textContent='エラー：'+e.message}finally{g('readBtn').disabled=false}}function show(){let s=ai.scope||{};g('scopeBox').className=s.target_found?'ok':'warn';g('scopeBox').innerHTML=s.target_found?'<b>完成銘板を特定：</b>'+esc(s.description||'銘板')+'<span class="ev">信頼度 '+Math.round((+s.confidence||0)*100)+'%</span>':'<b>完成銘板を特定できません。製作図は作りません。</b>';g('dims').innerHTML=box('外形',(ai.width_mm||'?')+' × '+(ai.height_mm||'?')+' mm','width')+box('穴径',(ai.hole_diameter_mm||'?')+'φ','hole_diameter')+box('穴数',(ai.hole_count||'?')+'ヶ','hole_count')+box('板外角',ai.radius||'不明','corner_radius')+box('穴位置',holes().length+'ヶ','hole_positions');g('texts').innerHTML=elements().map(x=>'<div class="row '+(x.verified?'':'warn')+'"><b>'+esc(x.type+'：'+(c(x.text)||[x.label,x.value].filter(Boolean).join('　')||x.description||''))+'</b><span class="ev">'+(x.verified?'原図確認 ✓':'要確認 ⚠')+(x.evidence?'　'+esc(x.evidence):'')+'</span></div>').join('');let issues=ai.verification?.audit_issues||[];g('audit').innerHTML=issues.length?'<div class="warn"><b>最終校正の指摘</b>'+issues.map(x=>'<span class="ev">・'+esc(x)+'</span>').join('')+'</div>':'<div class="ok"><b>最終校正：指摘なし</b></div>';let all=!!ai.verification?.all_verified;g('verifyBox').className=all?'ok':'warn';g('verifyBox').innerHTML=all?'<b>製作寸法と銘板内部の原図確認が完了しました。</b>':'<b>根拠不足の箇所があります。推測して校正図には進みません。</b>';g('proofBtn').disabled=!all;g('status').textContent=all?'忠実トレース＋寸法根拠確認が完了しました。':'読取完了。未確定箇所を止めています。';g('readCard').classList.remove('hidden')}function fit(t,maxW,maxFs){let n=[...c(t)].length||1;return Math.max(1.8,Math.min(maxFs,maxW/n))}function build(){let w=+ai.width_mm,h=+ai.height_mm,bg=/black|黒/i.test(c(ai.ground_color))?'#111':'#fff',fg=bg==='#111'?'#fff':'#111',rad=ai.plate?.corner_radius_none?0:(+ai.plate?.corner_radius_mm||0),z='<rect x=".25" y=".25" width="'+(w-.5)+'" height="'+(h-.5)+'" rx="'+rad+'" fill="'+bg+'" stroke="#666" stroke-width=".5"/>';holes().forEach(q=>z+='<circle cx="'+q.x_mm+'" cy="'+q.y_mm+'" r="'+(+ai.hole_diameter_mm/2)+'" fill="#fff" stroke="#777" stroke-width=".15"/>');elements().forEach(e=>{let x=(+e.x_pct||0)/100*w,y=(+e.y_pct||0)/100*h,ww=(+e.w_pct||0)/100*w,hh=(+e.h_pct||0)/100*h;if(e.type==='text'){let tx=c(e.text)||[e.label,e.value].filter(Boolean).join('　'),anchor=e.align==='center'?'middle':e.align==='right'?'end':'start',xx=e.align==='center'?x+ww/2:e.align==='right'?x+ww:x,fs=fit(tx,Math.max(ww,8),Math.max(hh*.8,h*.018));z+='<text x="'+xx+'" y="'+(y+hh*.72)+'" fill="'+fg+'" font-size="'+fs+'" text-anchor="'+anchor+'" font-family="Yu Gothic,Arial">'+esc(tx)+'</text>'}else if(e.type==='line'){z+='<line x1="'+x+'" y1="'+(y+hh/2)+'" x2="'+(x+ww)+'" y2="'+(y+hh/2)+'" stroke="'+fg+'" stroke-width=".35"/>'}else if(e.type==='box'){z+='<rect x="'+x+'" y="'+y+'" width="'+ww+'" height="'+hh+'" fill="none" stroke="'+fg+'" stroke-width=".35"/>'}else if(e.type==='mark'||e.type==='logo'){let tx=c(e.text)||c(e.label)||'MARK';z+='<text x="'+(x+ww/2)+'" y="'+(y+hh*.72)+'" fill="'+fg+'" font-size="'+Math.max(hh*.65,h*.02)+'" text-anchor="middle" font-family="Arial">'+esc(tx)+'</text>'}});return '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'mm" height="'+h+'mm" viewBox="0 0 '+w+' '+h+'">'+z+'</svg>'}function proof(){if(!ai.verification?.all_verified)return;g('specBox').textContent=ai.width_mm+' × '+ai.height_mm+' mm　｜　'+ai.hole_diameter_mm+'φ-'+ai.hole_count+'ヶ　｜　'+ai.radius;g('proofArt').innerHTML=build();g('proofCard').classList.remove('hidden')}g('readBtn').onclick=read;g('proofBtn').onclick=proof;</script></body></html>
