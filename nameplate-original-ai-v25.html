<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>銘板原稿AI｜テスト版36</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;margin:0;background:#f3f5f7;color:#172231}header{background:#17324d;color:#fff;padding:18px}main{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px}.hidden{display:none}.btn{border:0;border-radius:9px;padding:13px 18px;font-size:16px;font-weight:800;color:#fff;background:#17324d}.btn:disabled{background:#9ba6b0}.ok,.warn{padding:12px;border-radius:9px;margin:8px 0}.ok{background:#eaf7ee;border:1px solid #77bd89}.warn{background:#fff3a6;border:2px solid #e0a800}.ev{display:block;font-size:12px;color:#657483;margin-top:4px}.row{padding:9px;border-bottom:1px solid #ddd}.stage{text-align:center;background:#eef1f4;padding:20px;border-radius:12px;overflow:auto}.spec{display:inline-block;background:#fff;border:2px solid #17324d;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:18px;font-weight:800}.art{background:#fff;display:inline-block;padding:16px}.art svg{display:block;width:min(80vw,680px);height:auto}.note{color:#657483;line-height:1.6}.dimtable{width:100%;border-collapse:collapse;font-size:14px}.dimtable td,.dimtable th{padding:8px;border-bottom:1px solid #ddd;text-align:left}</style></head><body><header><b>銘板原稿AI　テスト版36・対象銘板スコープ方式</b></header><main><div class="card"><h2>1. 客先図面</h2><input id="file" type="file" accept="image/*,.pdf"><p><button id="readBtn" class="btn">完成銘板を特定して寸法を読む</button></p><div id="status" class="note">完成銘板本体を先に特定し、その銘板に属する寸法線・引出線だけを3回照合します。</div></div><div id="readCard" class="card hidden"><h2>2. AIが理解した完成銘板</h2><div id="scopeBox"></div><div id="dims"></div><div id="derive"></div><h3>寸法原文3回照合</h3><div id="ann"></div><h3>完成銘板に入る文字</h3><div id="texts"></div><div id="verifyBox"></div><p><button id="proofBtn" class="btn" disabled>3. 校正図面を作る</button></p></div><div id="proofCard" class="card hidden"><h2>3. 校正用銘板原稿</h2><div class="stage"><div id="specBox" class="spec"></div><br><div id="proofArt" class="art"></div></div></div></main><script>const U='https://emauqxftmauvsffdjvyh.supabase.co/functions/v1/read-nameplate-drawing',g=x=>document.getElementById(x),c=x=>(x==null?'':String(x).trim());let ai={};const labels={outer_width:'外形幅',outer_height:'外形高さ',hole_pitch_x:'穴ピッチ横',hole_pitch_y:'穴ピッチ縦',edge_x:'端→穴中心 横',edge_y:'端→穴中心 縦',hole_callout:'穴注記',outer_corner_instruction:'外角指示'};function du(f){return new Promise((a,b)=>{let r=new FileReader;r.onload=()=>a(r.result);r.onerror=b;r.readAsDataURL(f)})}function esc(s){return c(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function rows(){return Array.isArray(ai.layout?.rows)?ai.layout.rows:[]}function holes(){return Array.isArray(ai.hole_positions)?ai.hole_positions:[]}function chk(k){return !!ai.verification?.checks?.[k]}function box(l,v,k){return '<div class="'+(chk(k)?'ok':'warn')+'"><b>'+esc(l)+'：</b>'+esc(v)+' '+(chk(k)?'✓ 確定':'⚠ 未確定')+'</div>'}async function read(){let f=g('file').files[0];if(!f)return;g('readBtn').disabled=true;g('status').textContent='完成銘板を特定 → 寸法線を収集 → 3回照合中…';try{let d=await du(f),r=await fetch(U,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:d,type:f.type,name:f.name})}),j=await r.json();if(!r.ok||j.error)throw Error(j.error||'読取失敗');ai=j.result||{};show()}catch(e){g('status').textContent='エラー：'+e.message}finally{g('readBtn').disabled=false}}function show(){let s=ai.scope||{};g('scopeBox').className=s.target_found?'ok':'warn';g('scopeBox').innerHTML=s.target_found?'<b>完成銘板本体を特定：</b>'+esc(s.description||'銘板')+'<span class="ev">'+esc(s.reason||'')+' / 信頼度 '+Math.round((+s.confidence||0)*100)+'%</span>':'<b>完成銘板を特定できません。</b>';g('dims').innerHTML=box('外形',(ai.width_mm||'?')+' × '+(ai.height_mm||'?')+' mm','width')+box('穴径',(ai.hole_diameter_mm||'?')+'φ','hole_diameter')+box('穴数',(ai.hole_count||'?')+'ヶ','hole_count')+box('板外角',ai.radius||'不明','corner_radius')+box('穴座標',holes().length+'ヶ','hole_positions');let ds=ai.derivations||[];g('derive').innerHTML=ds.length?'<div class="ok"><b>寸法関係から算出</b>'+ds.map(x=>'<span class="ev">'+esc(x.field)+'：'+esc(x.formula)+'　'+esc(x.reason)+'</span>').join('')+'</div>':'';let rc=ai.raw_consensus||{},keys=Object.keys(labels);g('ann').innerHTML='<table class="dimtable"><tr><th>項目</th><th>採用原文</th><th>一致</th></tr>'+keys.map(k=>{let z=rc[k]||{};return '<tr><td>'+esc(labels[k])+'</td><td><b>'+esc(z.value||'未確定')+'</b><span class="ev">3回: '+esc((z.variants||[]).join(' / '))+'</span></td><td>'+((z.count||0)>=2?z.count+'/3 ✓':'不一致 ⚠')+'</td></tr>'}).join('')+'</table>';g('texts').innerHTML=rows().map(x=>'<div class="row '+(x.verified?'':'warn')+'"><b>'+esc(c(x.text)||[x.label,x.value].filter(Boolean).join('　'))+'</b> '+(x.verified?'✓':'⚠ 要確認')+'</div>').join('');let all=!!ai.verification?.all_verified;g('verifyBox').className=all?'ok':'warn';g('verifyBox').innerHTML=all?'<b>製作に必要な寸法と文字を確認しました。校正図面を作れます。</b>':'<b>未確定項目があります。校正図面はまだ作れません。</b>';g('proofBtn').disabled=!all;g('status').textContent=all?'読取完了。必要項目が確定しました。':'読取完了。未確定項目を黄色で止めています。';g('readCard').classList.remove('hidden')}function fit(t,maxW,maxFs){let n=[...c(t)].length||1;return Math.max(1.8,Math.min(maxFs,maxW/n))}function build(){let w=+ai.width_mm,h=+ai.height_mm,bg=/黒/.test(c(ai.ground_color))?'#111':'#fff',fg=bg==='#111'?'#fff':'#111',rad=ai.plate?.corner_radius_none?0:(+ai.plate?.corner_radius_mm||0),z='<rect x=".25" y=".25" width="'+(w-.5)+'" height="'+(h-.5)+'" rx="'+rad+'" fill="'+bg+'" stroke="#666" stroke-width=".5"/>';holes().forEach(q=>z+='<circle cx="'+q.x_mm+'" cy="'+q.y_mm+'" r="'+(+ai.hole_diameter_mm/2)+'" fill="#fff"/>');let rr=rows(),top=h*.25,bottom=h*.78,step=(bottom-top)/Math.max(rr.length-1,1);rr.forEach((r,i)=>{let y=top+i*step,l=c(r.label),v=c(r.value),tx=c(r.text);if(l||v){if(l)z+='<text x="'+w*.12+'" y="'+y+'" fill="'+fg+'" font-size="'+fit(l,w*.22,h*.036)+'" font-family="Yu Gothic" dominant-baseline="middle">'+esc(l)+'</text>';if(v)z+='<text x="'+w*.39+'" y="'+y+'" fill="'+fg+'" font-size="'+fit(v,w*.49,h*.036)+'" font-family="Yu Gothic" dominant-baseline="middle">'+esc(v)+'</text>'}else z+='<text x="'+w/2+'" y="'+y+'" fill="'+fg+'" font-size="'+fit(tx,w*.76,h*.036)+'" text-anchor="middle" font-family="Yu Gothic" dominant-baseline="middle">'+esc(tx)+'</text>'});return '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'mm" height="'+h+'mm" viewBox="0 0 '+w+' '+h+'">'+z+'</svg>'}function proof(){if(!ai.verification?.all_verified)return;g('specBox').textContent=(ai.width_mm+' × '+ai.height_mm+' mm　｜　'+ai.hole_diameter_mm+'φ-'+ai.hole_count+'ヶ　｜　'+ai.radius);g('proofArt').innerHTML=build();g('proofCard').classList.remove('hidden')}g('readBtn').onclick=read;g('proofBtn').onclick=proof;</script></body></html>
