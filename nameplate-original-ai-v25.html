<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>銘板原稿AI｜テスト版41</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;margin:0;background:#f3f5f7;color:#172231}header{background:#17324d;color:#fff;padding:18px}main{max-width:980px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px}.hidden{display:none}.btn{border:0;border-radius:9px;padding:13px 18px;font-size:16px;font-weight:800;color:#fff;background:#17324d}.btn:disabled{background:#9ba6b0}.ok,.warn{padding:12px;border-radius:9px;margin:8px 0}.ok{background:#eaf7ee;border:1px solid #77bd89}.warn{background:#fff3a6;border:2px solid #e0a800}.ev{display:block;font-size:12px;color:#657483;margin-top:4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{border:1px solid #d7dde3;border-radius:10px;padding:12px}.item b{display:block;font-size:13px;color:#536273}.item span{font-size:19px;font-weight:800}.stage{text-align:center;background:#eef1f4;padding:20px;border-radius:12px;overflow:auto}.spec{display:inline-block;background:#fff;border:2px solid #17324d;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:18px;font-weight:800}.art{background:#fff;display:inline-block;padding:16px}.art svg{display:block;width:min(80vw,680px);height:auto}.note{color:#657483;line-height:1.6}.sheet{background:#fff;border:2px solid #172231;padding:18px;text-align:left;min-width:760px}.sheet h2{text-align:center;margin:0 0 14px}.sheetgrid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #222;border-left:1px solid #222}.sheetcell{min-height:70px;padding:9px;border-right:1px solid #222;border-bottom:1px solid #222}.sheetcell b{display:block;font-size:13px}.sheetcell strong{font-size:22px}.dimtable{width:100%;border-collapse:collapse;font-size:13px}.dimtable th,.dimtable td{padding:8px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}@media(max-width:600px){.grid{grid-template-columns:1fr}.card{padding:14px}}</style></head><body><header><b>銘板原稿AI　テスト版41・厳格MASTER方式</b></header><main><div class="card"><h2>1. 客先図面</h2><input id="file" type="file" accept="image/*,.pdf"><p><button id="readBtn" class="btn">ChatGPTが原本MASTERを作る</button></p><div id="status" class="note">まず完成銘板本体を特定し、周囲の寸法注記を全部棚卸ししてから、外周・穴・内側形状へ分類します。根拠不足ならMASTER確定しません。</div></div><div id="analysis" class="card hidden"><h2>2. 原本MASTER</h2><div id="scope"></div><div id="dims"></div><h3>寸法注記の棚卸し</h3><div id="ann"></div><div id="verify"></div></div><div id="instruction" class="card hidden"><h2>3. 社内指示内容（16項目）</h2><div class="note">※ サイズ・R・穴・穴位置は2のMASTERからのみ表示します。</div><div id="items" class="grid"></div><p><button id="sheetBtn" class="btn">4. 横長A4の社内製作指示書を作る</button></p></div><div id="sheetCard" class="card hidden"><h2>4. 横長A4 社内製作指示書</h2><div class="stage"><div id="sheet" class="sheet"></div></div><p><button id="proofBtn" class="btn" disabled>5. 校正用銘板原稿を見る</button></p></div><div id="proofCard" class="card hidden"><h2>5. 校正用銘板原稿</h2><div class="note">※ 外形・R・穴・穴位置は2のMASTERと完全に同一です。</div><div class="stage"><div id="spec" class="spec"></div><br><div id="art" class="art"></div></div></div></main><script>const U='https://emauqxftmauvsffdjvyh.supabase.co/functions/v1/read-nameplate-drawing',g=x=>document.getElementById(x),c=x=>(x==null?'':String(x).trim());let ai={};const esc=s=>c(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');const holes=()=>Array.isArray(ai.hole_positions)?ai.hole_positions:[];const els=()=>Array.isArray(ai.layout?.elements)?ai.layout.elements:[];const wi=()=>Array.isArray(ai.work_instruction?.items)?ai.work_instruction.items:[];const anns=()=>Array.isArray(ai.master?.inventory?.annotations)?ai.master.inventory.annotations:[];function du(f){return new Promise((a,b)=>{let r=new FileReader;r.onload=()=>a(r.result);r.onerror=b;r.readAsDataURL(f)})}function chk(k){return !!ai.verification?.checks?.[k]}function bx(l,v,k){return '<div class="'+(chk(k)?'ok':'warn')+'"><b>'+esc(l)+'：</b>'+esc(v)+' '+(chk(k)?'✓ MASTER確定':'⚠ 未確定')+'</div>'}async function read(){let f=g('file').files[0];if(!f)return;g('readBtn').disabled=true;g('status').textContent='完成銘板特定 → 寸法注記棚卸し → 外周/穴/内側へ分類 → 文字転記 → 最終校正中…';try{let d=await du(f),r=await fetch(U,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:d,type:f.type,name:f.name})}),j=await r.json();if(!r.ok||j.error)throw Error(j.error||'読取失敗');ai=j.result||{};show()}catch(e){g('status').textContent='エラー：'+e.message}finally{g('readBtn').disabled=false}}function show(){let s=ai.scope||{},conf=Math.round((+s.confidence||0)*100),all=!!ai.verification?.all_verified;g('scope').className=s.target_found&&conf>=80?'ok':'warn';g('scope').innerHTML='<b>完成銘板：</b>'+esc(s.description||'特定できません')+'<span class="ev">MASTER信頼度 '+conf+'%</span>';g('dims').innerHTML=bx('外形',(ai.width_mm||'?')+' × '+(ai.height_mm||'?')+' mm','width')+bx('穴',(ai.hole_count?((ai.hole_diameter_mm||'?')+'φ-'+ai.hole_count+'ヶ'):'未確定'),'hole_diameter')+bx('板外角',ai.radius||'不明','corner_radius')+bx('穴位置',holes().length+'ヶ','hole_positions');let a=anns();g('ann').innerHTML=a.length?'<table class="dimtable"><tr><th>原文</th><th>接続先</th><th>向き</th><th>根拠</th></tr>'+a.map(x=>'<tr><td><b>'+esc(x.raw||'')+'</b></td><td>'+esc(x.target_relation||'')+'</td><td>'+esc(x.orientation||'')+'</td><td>'+esc(x.evidence||'')+'</td></tr>').join('')+'</table>':'<div class="warn">寸法注記を棚卸しできませんでした。</div>';let issues=ai.verification?.audit_issues||[],mis=ai.verification?.mismatches||[];g('verify').className=all?'ok':'warn';g('verify').innerHTML=all?'<b>このMASTERを3・4・5の唯一の原本として使用します。</b>':'<b>MASTER未確定。5の校正原稿は作れません。</b><span class="ev">'+[...issues,...mis].map(esc).join(' / ')+'</span>';g('items').innerHTML=wi().map(x=>'<div class="item '+(!x.verified?'warn':'')+'"><b>'+esc(x.label)+'</b><span>'+esc(x.value||'')+'</span>'+(x.verified?'':'<small> MASTER未確定</small>')+'</div>').join('');g('proofBtn').disabled=!all;g('analysis').classList.remove('hidden');g('instruction').classList.remove('hidden');g('status').textContent=all?'MASTER確定。3・4・5はこの値からのみ生成します。':'MASTERは未確定です。黄色の根拠不足を確認してください。'}function sheet(){let a=wi();g('sheet').innerHTML='<h2>社内製作指示書</h2><div class="sheetgrid">'+a.map(x=>'<div class="sheetcell"><b>'+esc(x.label)+'</b><strong>'+esc(x.value||'')+'</strong></div>').join('')+'</div>';g('sheetCard').classList.remove('hidden');g('sheetCard').scrollIntoView({behavior:'smooth'})}function fit(t,w,m){let n=[...c(t)].length||1;return Math.max(1.8,Math.min(m,w/n))}function svg(){let w=+ai.width_mm,h=+ai.height_mm,bg=/black|黒/i.test(c(ai.ground_color))?'#111':'#fff',fg=bg==='#111'?'#fff':'#111',rad=ai.plate?.corner_radius_none?0:(+ai.plate?.corner_radius_mm||0),z='<rect x=".25" y=".25" width="'+(w-.5)+'" height="'+(h-.5)+'" rx="'+rad+'" fill="'+bg+'" stroke="#666" stroke-width=".5"/>';holes().forEach(q=>z+='<circle cx="'+q.x_mm+'" cy="'+q.y_mm+'" r="'+(+ai.hole_diameter_mm/2)+'" fill="#fff"/>');els().forEach(e=>{let x=(+e.x_pct||0)/100*w,y=(+e.y_pct||0)/100*h,ww=(+e.w_pct||0)/100*w,hh=(+e.h_pct||0)/100*h;if(e.type==='text'){let t=c(e.text)||[e.label,e.value].filter(Boolean).join('　'),an=e.align==='center'?'middle':e.align==='right'?'end':'start',xx=e.align==='center'?x+ww/2:e.align==='right'?x+ww:x;z+='<text x="'+xx+'" y="'+(y+hh*.72)+'" fill="'+fg+'" font-size="'+fit(t,Math.max(ww,8),Math.max(hh*.8,h*.018))+'" text-anchor="'+an+'" font-family="Yu Gothic,Arial">'+esc(t)+'</text>'}else if(e.type==='line')z+='<line x1="'+x+'" y1="'+(y+hh/2)+'" x2="'+(x+ww)+'" y2="'+(y+hh/2)+'" stroke="'+fg+'" stroke-width=".35"/>';else if(e.type==='box')z+='<rect x="'+x+'" y="'+y+'" width="'+ww+'" height="'+hh+'" fill="none" stroke="'+fg+'" stroke-width=".35"/>'});return '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'mm" height="'+h+'mm" viewBox="0 0 '+w+' '+h+'">'+z+'</svg>'}function proof(){if(!ai.verification?.all_verified)return;g('spec').textContent=ai.width_mm+' × '+ai.height_mm+' mm　｜　'+(ai.hole_count?ai.hole_diameter_mm+'φ-'+ai.hole_count+'ヶ':'穴なし')+'　｜　'+ai.radius;g('art').innerHTML=svg();g('proofCard').classList.remove('hidden');g('proofCard').scrollIntoView({behavior:'smooth'})}g('readBtn').onclick=read;g('sheetBtn').onclick=sheet;g('proofBtn').onclick=proof;</script></body></html>
