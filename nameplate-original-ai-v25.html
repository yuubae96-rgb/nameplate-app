<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>銘板原稿AI｜テスト版35</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;margin:0;background:#f3f5f7;color:#172231}header{background:#17324d;color:#fff;padding:18px}main{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px}.hidden{display:none}.btn{border:0;border-radius:9px;padding:13px 18px;font-size:16px;font-weight:800;color:#fff;background:#17324d}.ok,.warn{padding:12px;border-radius:9px;margin:8px 0}.ok{background:#eaf7ee;border:1px solid #77bd89}.warn{background:#fff3a6;border:2px solid #e0a800}.ev{display:block;font-size:12px;color:#657483;margin-top:4px}.row{padding:9px;border-bottom:1px solid #ddd}.stage{text-align:center;background:#eef1f4;padding:20px;border-radius:12px;overflow:auto}.spec{display:inline-block;background:#fff;border:2px solid #17324d;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:18px;font-weight:800}.art{background:#fff;display:inline-block;padding:16px}.art svg{display:block;width:min(80vw,680px);height:auto}.note{color:#657483;line-height:1.6}.dimtable{width:100%;border-collapse:collapse;font-size:14px}.dimtable td,.dimtable th{padding:8px;border-bottom:1px solid #ddd;text-align:left}.small{font-size:12px;color:#657483}</style></head><body><header><b>銘板原稿AI　テスト版35・寸法線接続確認方式</b></header><main><div class="card"><h2>1. 客先図面</h2><input id="file" type="file" accept="image/*,.pdf"><p><button id="readBtn" class="btn">原文を3回読んで照合</button></p><div id="status" class="note">同じ数字を3回読むだけでは確定しません。寸法線・引出線が実際に完成銘板へ接続していることまで確認して採用します。</div></div><div id="readCard" class="card hidden"><h2>2. AIが理解した完成銘板</h2><div id="dims"></div><h3>原文3回照合</h3><div id="ann"></div><h3>完成銘板に入る文字</h3><div id="texts"></div><div id="verifyBox"></div><p><button id="proofBtn" class="btn">3. 校正図面を作る</button></p></div><div id="proofCard" class="card hidden"><h2>3. 校正用銘板原稿</h2><div class="stage"><div id="specBox" class="spec"></div><br><div id="proofArt" class="art"></div></div><div id="proofStatus"></div></div></main><script>const U='https://emauqxftmauvsffdjvyh.supabase.co/functions/v1/read-nameplate-drawing',g=x=>document.getElementById(x),c=x=>(x==null?'':String(x).trim());let ai={};const labels={outer_width:'外形幅',outer_height:'外形高さ',hole_pitch_x:'穴ピッチ横',hole_pitch_y:'穴ピッチ縦',edge_x:'端→穴中心 横',edge_y:'端→穴中心 縦',hole_callout:'穴注記',outer_corner_instruction:'外角指示'};function du(f){return new Promise((a,b)=>{let r=new FileReader;r.onload=()=>a(r.result);r.onerror=b;r.readAsDataURL(f)})}async function hashFile(f){let ab=await f.arrayBuffer(),h=await crypto.subtle.digest('SHA-256',ab);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}function esc(s){return c(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function rows(){return Array.isArray(ai.layout?.rows)?ai.layout.rows:[]}function holes(){return Array.isArray(ai.hole_positions)?ai.hole_positions.filter(q=>isFinite(+q.x_mm)&&isFinite(+q.y_mm)):[]}function chk(k){return !!ai.verification?.checks?.[k]}function box(l,v,k){return '<div class="'+(chk(k)?'ok':'warn')+'"><b>'+esc(l)+'：</b>'+esc(v)+' '+(chk(k)?'✓ 確定':'⚠ 未確定')+'</div>'}function show(){g('dims').innerHTML=box('外形',(ai.width_mm||'?')+' × '+(ai.height_mm||'?')+' mm','width')+box('穴径',(ai.hole_diameter_mm||'?')+'φ','hole_diameter')+box('穴数',(ai.hole_count||'?')+'ヶ','hole_count')+box('板外角',ai.radius||'不明','corner_radius')+box('穴座標',holes().length+'ヶ','hole_positions');let rc=ai.raw_consensus||{},keys=['outer_width','outer_height','hole_pitch_x','hole_pitch_y','edge_x','edge_y','hole_callout','outer_corner_instruction'];g('ann').innerHTML='<table class="dimtable"><tr><th>項目</th><th>採用原文</th><th>一致</th></tr>'+keys.map(k=>{let z=rc[k]||{},ok=(z.count||0)>=2;return '<tr><td>'+esc(labels[k])+'</td><td><b>'+esc(z.value||'未確定')+'</b><span class="ev">3回: '+esc((z.variants||[]).join(' / '))+'</span></td><td>'+(ok?z.count+'/3 ✓':'不一致 ⚠')+'</td></tr>'}).join('')+'</table>';let rr=rows(),pr=rc.printed_rows||[];g('texts').innerHTML=rr.map((x,i)=>'<div class="row"><b>'+esc(c(x.text)||[x.label,x.value].filter(Boolean).join('　'))+'</b><span class="ev">原文一致 '+esc(pr[i]?.count||0)+'/3</span></div>').join('');let all=!!ai.verification?.all_verified;g('verifyBox').className=all?'ok':'warn';g('verifyBox').innerHTML=all?'<b>原文一致＋寸法線接続確認が取れた値で製作値へ変換済みです。</b>':'<b>原文または寸法線の接続確認が取れない項目があります。そこは製作確定にしません。</b>';g('readCard').classList.remove('hidden')}async function read(){let f=g('file').files[0];if(!f)return;g('readBtn').disabled=true;try{let h=await hashFile(f),key='nameplate-v35:'+h,cache=localStorage.getItem(key);if(cache){ai=JSON.parse(cache);g('status').textContent='同じPDFのテスト35確認済み結果を使用しました。';show();return}g('status').textContent='原文3回読取＋寸法線・引出線の接続先を確認中…';let d=await du(f),r=await fetch(U,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:d,type:f.type,name:f.name})}),j=await r.json();if(!r.ok||j.error)throw Error(j.error||'読取失敗');ai=j.result||{};if(ai.verification?.all_verified)localStorage.setItem(key,JSON.stringify(ai));show();g('status').textContent=ai.verification?.all_verified?'読取完了。原文一致と接続先確認で確定しました。':'読取完了。接続先を確認できない寸法は未確定です。'}catch(e){g('status').textContent='エラー：'+e.message}finally{g('readBtn').disabled=false}}function fit(t,maxW,maxFs){let n=[...c(t)].reduce((s,ch)=>s+(/[ -~]/.test(ch)?.55:1),0)||1;return Math.max(1.8,Math.min(maxFs,maxW/(n*.96)))}function build(){let w=+ai.width_mm||100,h=+ai.height_mm||50,bg=/黒/.test(c(ai.ground_color))?'#111':'#fff',fg=bg==='#111'?'#fff':'#111',rad=(ai.plate?.corner_radius_none||!chk('corner_radius'))?0:Math.max(0,+ai.plate?.corner_radius_mm||0),s='<rect x=".25" y=".25" width="'+(w-.5)+'" height="'+(h-.5)+'" rx="'+rad+'" fill="'+bg+'" stroke="#666" stroke-width=".5"/>';let hs=(chk('hole_diameter')&&chk('hole_positions'))?holes():[],d=+ai.hole_diameter_mm||0;hs.forEach(q=>s+='<circle cx="'+q.x_mm+'" cy="'+q.y_mm+'" r="'+d/2+'" fill="#fff" stroke="#666" stroke-width=".25"/>');let rr=rows(),n=rr.length;if(n){let top=h*.25,bottom=h*.78,step=(bottom-top)/Math.max(n-1,1),lx=w*.12,vx=w*.39,right=w*.88,maxFs=Math.min(h*.036,step*.48);rr.forEach((r,i)=>{let y=n===1?h/2:top+i*step,label=c(r.label),value=c(r.value),text=c(r.text);if(label||value){if(label)s+='<text x="'+lx+'" y="'+y+'" fill="'+fg+'" font-size="'+fit(label,vx-lx-5,maxFs)+'" font-family="Yu Gothic,Arial" dominant-baseline="middle">'+esc(label)+'</text>';if(value)s+='<text x="'+vx+'" y="'+y+'" fill="'+fg+'" font-size="'+fit(value,right-vx,maxFs)+'" font-family="Yu Gothic,Arial" dominant-baseline="middle">'+esc(value)+'</text>'}else if(text)s+='<text x="'+w/2+'" y="'+y+'" fill="'+fg+'" font-size="'+fit(text,w*.76,maxFs)+'" font-family="Yu Gothic,Arial" text-anchor="middle" dominant-baseline="middle">'+esc(text)+'</text>'})}return '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'mm" height="'+h+'mm" viewBox="0 0 '+w+' '+h+'">'+s+'</svg>'}function proof(){g('specBox').innerHTML=esc((ai.width_mm||'?')+' × '+(ai.height_mm||'?')+' mm　｜　'+(ai.hole_diameter_mm||'?')+'φ-'+(ai.hole_count||'?')+'ヶ　｜　'+(ai.radius||'不明'));g('proofArt').innerHTML=build();g('proofStatus').className=ai.verification?.all_verified?'ok':'warn';g('proofStatus').innerHTML=ai.verification?.all_verified?'<b>接続先まで確認した寸法だけで校正図を生成。</b>':'<b>未確定項目があります。参考表示です。</b>';g('proofCard').classList.remove('hidden')}g('readBtn').onclick=read;g('proofBtn').onclick=proof;</script></body></html>
