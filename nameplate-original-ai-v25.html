<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>銘板原稿AI｜テスト版30</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;margin:0;background:#f3f5f7;color:#172231}header{background:#17324d;color:#fff;padding:18px}main{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px}.hidden{display:none}.btn{border:0;border-radius:9px;padding:13px 18px;font-size:16px;font-weight:800;color:#fff;background:#17324d}.stage{text-align:center;background:#eef1f4;padding:20px;border-radius:12px;overflow:auto}.spec{display:inline-block;background:#fff;border:2px solid #17324d;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:18px;font-weight:800}.art{background:#fff;display:inline-block;padding:16px}.art svg{display:block;width:min(80vw,680px);height:auto}.note{color:#657483;line-height:1.6}.ok{background:#eaf7ee;border:1px solid #77bd89;padding:12px;border-radius:9px;margin:7px 0}.warn{background:#fff3a6;border:2px solid #e0a800;padding:12px;border-radius:9px;margin:7px 0}.ev{display:block;font-size:12px;color:#657483;margin-top:4px}.row{padding:8px 10px;border-bottom:1px solid #ddd}.readback{background:#f7f9fb;padding:14px;border-radius:10px;line-height:1.8}.dimtable{width:100%;border-collapse:collapse;font-size:14px;margin:12px 0}.dimtable th,.dimtable td{border-bottom:1px solid #ddd;padding:8px;text-align:left}.selected{font-weight:800;background:#eef8f0}</style></head><body><header><b>銘板原稿AI　テスト版30・対称寸法まで完成</b></header><main><div class="card"><h2>1. 客先図面</h2><input id="file" type="file" accept="image/*,.pdf"><p><button class="btn" id="readBtn">完成銘板→寸法分類→対称確認</button></p><div id="status" class="note">外形・穴ピッチ・端寸法・穴径・Rを分類し、正方形や4穴対称が図面上で明白な場合だけ不足方向を補完します。</div></div><div class="card hidden" id="readCard"><h2>2. AIが理解した完成銘板</h2><div id="targetBox"></div><div id="dims"></div><div id="inferBox"></div><h3>寸法の意味分類</h3><div id="dimList"></div><h3>完成銘板に入る文字</h3><div id="texts" class="readback"></div><div id="verifyBox"></div><p><button class="btn" id="proofBtn">3. 校正図面を作る</button></p></div><div class="card hidden" id="proofCard"><h2>3. 校正用銘板原稿</h2><div class="stage"><div id="specBox" class="spec"></div><br><div id="proofArt" class="art"></div></div><div id="proofStatus"></div></div></main><script>const U='https://emauqxftmauvsffdjvyh.supabase.co/functions/v1/read-nameplate-drawing',g=x=>document.getElementById(x),c=x=>(x==null?'':String(x).trim());let ai={};const names={outer_width:'外形・幅',outer_height:'外形・高さ',hole_pitch_x:'穴ピッチ横',hole_pitch_y:'穴ピッチ縦',hole_edge_x:'端→穴中心 横',hole_edge_y:'端→穴中心 縦',hole_diameter:'穴径',hole_count:'穴数',outer_corner_radius:'板外角R',print_cutout_radius:'印刷面切欠きR',other:'その他'};function du(f){return new Promise((a,b)=>{let r=new FileReader;r.onload=()=>a(r.result);r.onerror=b;r.readAsDataURL(f)})}function esc(s){return c(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function rows(){return Array.isArray(ai.layout?.rows)?ai.layout.rows:[]}function holes(){return Array.isArray(ai.hole_positions)?ai.hole_positions.filter(q=>isFinite(+q.x_mm)&&isFinite(+q.y_mm)):[]}function chk(k){return !!ai.verification?.checks?.[k]}function ev(k){return ai.verification?.evidence?.[k]||''}function box(label,value,k){let ok=chk(k);return '<div class="'+(ok?'ok':'warn')+'"><b>'+esc(label)+'：</b>'+esc(value)+' '+(ok?'✓ 確定':'⚠ 未確定')+(ev(k)?'<span class="ev">根拠：'+esc(ev(k))+'</span>':'')+'</div>'}async function read(){let f=g('file').files[0];if(!f)return;g('readBtn').disabled=true;g('status').textContent='完成銘板を特定 → 寸法分類 → 正方形・4穴対称を確認中…';try{let d=await du(f),r=await fetch(U,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:d,type:f.type,name:f.name})}),j=await r.json();if(!r.ok||j.error)throw Error(j.error||'読取失敗');ai=j.result||{};let t=ai.target||{};g('targetBox').className=t.target_found?'ok':'warn';g('targetBox').innerHTML=t.target_found?'<b>完成銘板を特定：</b>'+esc(t.description||'矩形銘板')+'<span class="ev">'+esc(t.reason||'')+' / 信頼度 '+Math.round((+t.confidence||0)*100)+'%</span>':'<b>完成銘板を特定できません。</b>';g('dims').innerHTML=box('外形',(ai.width_mm||'?')+' × '+(ai.height_mm||'?')+' mm','width')+box('高さ',ai.height_mm||'?','height')+box('穴径',(ai.hole_diameter_mm||'?')+'φ','hole_diameter')+box('穴数',(ai.hole_count||'?')+'ヶ','hole_count')+box('板外角R',ai.radius||'不明','corner_radius')+box('穴座標',holes().length+'ヶ','hole_positions');let inf=Array.isArray(ai.dimension_inferences)?ai.dimension_inferences:[];g('inferBox').innerHTML=inf.length?'<div class="ok"><b>図面の対称性から補完した寸法</b>'+inf.map(x=>'<span class="ev">'+esc(x.type)+'：'+esc(x.value_mm)+' mm　'+esc(x.reason)+'</span>').join('')+'</div>':'';let dl=Array.isArray(ai.dimension_candidates)?ai.dimension_candidates:[];g('dimList').innerHTML='<table class="dimtable"><tr><th>図面の寸法</th><th>意味</th><th>判断理由</th></tr>'+dl.map(x=>'<tr class="'+(String(x.category).startsWith('outer_')?'selected':'')+'"><td>'+esc(x.raw_text||x.value_mm)+'</td><td>'+esc(names[x.category]||x.category)+'</td><td>'+esc(x.reason)+'</td></tr>').join('')+'</table>';g('texts').innerHTML=rows().map(x=>'<div class="row"><b>'+esc(c(x.text)||[x.label,x.value].filter(Boolean).join('　'))+'</b></div>').join('');let all=!!ai.verification?.all_verified;g('verifyBox').className=all?'ok':'warn';g('verifyBox').innerHTML=all?'<b>必要寸法がそろいました。校正図を作れます。</b>':'<b>未確定項目があります。製作確定にはしません。</b>';g('readCard').classList.remove('hidden');g('status').textContent='読取完了。125の縦横、8の縦横、φ・Rの分類を確認してください。'}catch(e){g('status').textContent='エラー：'+e.message}finally{g('readBtn').disabled=false}}function fit(t,maxW,maxFs){let n=[...c(t)].reduce((s,ch)=>s+(/[ -~]/.test(ch)?.55:1),0)||1;return Math.max(1.7,Math.min(maxFs,maxW/(n*.92)))}function build(){let w=+ai.width_mm||100,h=+ai.height_mm||50,bg=/黒/.test(c(ai.ground_color))?'#111':'#fff',fg=bg==='#111'?'#fff':'#111',rad=chk('corner_radius')?Math.max(0,+ai.plate?.corner_radius_mm||0):0,s='<rect x=".25" y=".25" width="'+(w-.5)+'" height="'+(h-.5)+'" rx="'+rad+'" fill="'+bg+'" stroke="#555" stroke-width=".5"/>';let hs=(chk('hole_diameter')&&chk('hole_positions'))?holes():[],d=+ai.hole_diameter_mm||0;hs.forEach(q=>s+='<circle cx="'+q.x_mm+'" cy="'+q.y_mm+'" r="'+d/2+'" fill="#fff"/>');let rr=rows(),n=rr.length;if(n){let left=w*.07,right=w*.93,top=h*.18,bottom=h*.82,step=(bottom-top)/n;rr.forEach((r,i)=>{let y=top+step*(i+.5),maxFs=Math.min(step*.58,h*.055),label=c(r.label),value=c(r.value),text=c(r.text);if(label||value){let vx=left+(right-left)*.29,lf=fit(label,(right-left)*.25,maxFs),vf=fit(value,right-vx,maxFs);if(label)s+='<text x="'+left+'" y="'+y+'" fill="'+fg+'" font-size="'+lf+'" font-family="Yu Gothic,Arial" dominant-baseline="middle">'+esc(label)+'</text>';if(value)s+='<text x="'+vx+'" y="'+y+'" fill="'+fg+'" font-size="'+vf+'" font-family="Yu Gothic,Arial" dominant-baseline="middle">'+esc(value)+'</text>'}else if(text){let fs=fit(text,right-left,maxFs);s+='<text x="'+w/2+'" y="'+y+'" fill="'+fg+'" font-size="'+fs+'" font-family="Yu Gothic,Arial" text-anchor="middle" dominant-baseline="middle">'+esc(text)+'</text>'}})}return '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'mm" height="'+h+'mm" viewBox="0 0 '+w+' '+h+'">'+s+'</svg>'}function proof(){g('specBox').innerHTML=esc((ai.width_mm||'?')+' × '+(ai.height_mm||'?')+' mm　｜　'+(ai.hole_diameter_mm||'?')+'φ-'+(ai.hole_count||'?')+'ヶ　｜　'+(ai.radius||'不明'));g('proofArt').innerHTML=build();g('proofStatus').className=ai.verification?.all_verified?'ok':'warn';g('proofStatus').innerHTML=ai.verification?.all_verified?'<b>確定寸法で校正図を生成。</b>':'<b>未確定項目があります。</b>';g('proofCard').classList.remove('hidden')}g('readBtn').onclick=read;g('proofBtn').onclick=proof;</script></body></html>
