<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>銘板原稿AI｜テスト版26</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;margin:0;background:#f3f5f7;color:#172231}header{background:#17324d;color:#fff;padding:18px}main{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px}.hidden{display:none}.btn{border:0;border-radius:9px;padding:13px 18px;font-size:16px;font-weight:800;color:#fff;background:#17324d}.stage{text-align:center;background:#eef1f4;padding:20px;border-radius:12px;overflow:auto}.spec{display:inline-block;background:#fff;border:2px solid #17324d;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:18px;font-weight:800}.spec small{display:block;color:#657483;font-size:12px;margin-top:4px}.art{background:#fff;display:inline-block;padding:16px}.art svg{display:block;width:min(80vw,680px);height:auto}.note{color:#657483;line-height:1.6}.readback{background:#f7f9fb;padding:14px;border-radius:10px;line-height:1.8}.ok{background:#eaf7ee;border:1px solid #77bd89;padding:12px;border-radius:9px;margin-top:12px}.warn{background:#fff3a6;border:2px solid #e0a800;padding:12px;border-radius:9px;margin-top:12px}.tagok{background:#eaf7ee;padding:3px 7px;border-radius:6px}.tagwarn{background:#fff3a6;padding:3px 7px;border-radius:6px;font-weight:800}</style></head><body><header><b>銘板原稿AI　テスト版26・監査照合</b></header><main><div class="card"><h2>1. 客先図面</h2><input id="file" type="file" accept="image/*,.pdf"><p><button class="btn" id="readBtn">ChatGPTのように図面を読む＋監査</button></p><div id="status" class="note">元PDF推奨。1回目に自然読取し、2回目はその候補が元図面に本当に書かれているかを項目別に監査します。</div></div><div class="card hidden" id="readCard"><h2>2. AIが理解した完成銘板</h2><div id="readback" class="readback"></div><div id="verifyBox"></div><p><button class="btn" id="proofBtn">3. 校正図面を作る</button></p></div><div class="card hidden" id="proofCard"><h2>3. 校正用銘板原稿</h2><div class="stage"><div id="specBox" class="spec"></div><br><div id="proofArt" class="art"></div></div><div id="proofStatus"></div></div></main><script>const U='https://emauqxftmauvsffdjvyh.supabase.co/functions/v1/read-nameplate-drawing',g=x=>document.getElementById(x),c=x=>(x==null?'':String(x).trim());let ai={};function du(f){return new Promise((a,b)=>{let r=new FileReader;r.onload=()=>a(r.result);r.onerror=b;r.readAsDataURL(f)})}function esc(s){return c(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function rows(){return Array.isArray(ai.layout?.rows)?ai.layout.rows:[]}function holes(){return Array.isArray(ai.hole_positions)?ai.hole_positions.filter(q=>isFinite(+q.x_mm)&&isFinite(+q.y_mm)):[]}function chk(k){return !!ai.verification?.checks?.[k]}function val(v,ok){return '<span class="'+(ok?'tagok':'tagwarn')+'">'+esc(v==null?'要確認':v)+(ok?' ✓':' 要確認')+'</span>'}function spec(){return (ai.width_mm||'?')+' × '+(ai.height_mm||'?')+' mm　｜　'+(ai.hole_diameter_mm||'?')+'φ-'+(ai.hole_count||'?')+'ヶ　｜　'+(ai.radius||'不明')}async function read(){let f=g('file').files[0];if(!f)return;g('readBtn').disabled=true;g('status').textContent='1回目を読取中…続けて候補を元図面に照合します。';try{let d=await du(f),r=await fetch(U,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:d,type:f.type,name:f.name})}),j=await r.json();if(!r.ok||j.error)throw Error(j.error||'読取失敗');ai=j.result||{};let lines=rows().map(x=>esc(x.text||[x.label,x.value].filter(Boolean).join('　'))).filter(Boolean);g('readback').innerHTML='<b>外形：</b>'+val((ai.width_mm||'?')+' × '+(ai.height_mm||'?')+' mm',chk('width')&&chk('height'))+'<br><b>穴径・穴数：</b>'+val((ai.hole_diameter_mm||'?')+'φ × '+(ai.hole_count||'?')+'ヶ',chk('hole_diameter')&&chk('hole_count'))+'<br><b>R：</b>'+val(ai.radius||'不明',chk('corner_radius'))+'<br><b>穴座標：</b>'+val(holes().length+'ヶ',chk('hole_positions'))+'<hr><b>完成銘板に入る文字</b> '+(ai.verification?.text_verified?'<span class="tagok">監査一致 ✓</span>':'<span class="tagwarn">監査 要確認</span>')+'<br>'+lines.join('<br>');let mm=ai.verification?.mismatches||[];g('verifyBox').className=mm.length?'warn':'ok';g('verifyBox').innerHTML=mm.length?'<b>元図面との監査で要確認があります。製作用に確定しません。</b><br>'+mm.map(esc).join('<br>'):'<b>監査照合一致。</b> 候補値を元図面で確認できました。';g('readCard').classList.remove('hidden');g('status').textContent='監査照合完了。黄色は未確定です。'}catch(e){g('status').textContent='エラー：'+e.message}finally{g('readBtn').disabled=false}}function fit(t,maxW,maxFs){let n=[...c(t)].reduce((s,ch)=>s+(/[ -~]/.test(ch)?.55:1),0)||1;return Math.max(1.7,Math.min(maxFs,maxW/(n*.92)))}function build(){let w=+ai.width_mm||100,h=+ai.height_mm||50,bg=/黒/.test(c(ai.ground_color))?'#111':'#fff',fg=bg==='#111'?'#fff':'#111',rad=chk('corner_radius')?Math.max(0,+ai.plate?.corner_radius_mm||0):0,s='<rect x=".25" y=".25" width="'+(w-.5)+'" height="'+(h-.5)+'" rx="'+rad+'" fill="'+bg+'" stroke="#555" stroke-width=".5"/>';let hs=(chk('hole_diameter')&&chk('hole_positions'))?holes():[],d=+ai.hole_diameter_mm||0;hs.forEach(q=>s+='<circle cx="'+q.x_mm+'" cy="'+q.y_mm+'" r="'+d/2+'" fill="#fff"/>');let rr=rows(),n=rr.length;if(n){let left=w*.07,right=w*.93,top=h*.18,bottom=h*.82,step=(bottom-top)/n;rr.forEach((r,i)=>{let y=top+step*(i+.5),maxFs=Math.min(step*.58,h*.055),label=c(r.label),value=c(r.value),text=c(r.text);if(label||value){let lx=left,vx=left+(right-left)*.29,lf=fit(label,(right-left)*.25,maxFs),vf=fit(value,right-vx,maxFs);if(label)s+='<text x="'+lx+'" y="'+y+'" fill="'+fg+'" font-size="'+lf+'" font-family="Yu Gothic,Arial" dominant-baseline="middle">'+esc(label)+'</text>';if(value)s+='<text x="'+vx+'" y="'+y+'" fill="'+fg+'" font-size="'+vf+'" font-family="Yu Gothic,Arial" dominant-baseline="middle">'+esc(value)+'</text>'}else if(text){let fs=fit(text,right-left,maxFs);s+='<text x="'+w/2+'" y="'+y+'" fill="'+fg+'" font-size="'+fs+'" font-family="Yu Gothic,Arial" text-anchor="middle" dominant-baseline="middle">'+esc(text)+'</text>'}})}return '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'mm" height="'+h+'mm" viewBox="0 0 '+w+' '+h+'">'+s+'</svg>'}function proof(){g('specBox').innerHTML=esc(spec())+'<small>黄色項目は未確定・SVG製作値に使用しません</small>';g('proofArt').innerHTML=build();let mm=ai.verification?.mismatches||[];g('proofStatus').className=mm.length?'warn':'ok';g('proofStatus').innerHTML=mm.length?'<b>校正図は参考表示です。</b> 監査未確定の寸法は製作確定値として使用していません。<br>'+mm.map(esc).join('<br>'):'<b>監査照合一致。</b> 製作寸法・穴・文字を元図面で確認済み。';g('proofCard').classList.remove('hidden')}g('readBtn').onclick=read;g('proofBtn').onclick=proof;</script></body></html>
