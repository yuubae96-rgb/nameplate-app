<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>銘板図面変換アプリ</title><style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1f2328;--muted:#667085;--line:#dfe3e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:16px 18px;font-size:22px;font-weight:800}main{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px #0000000d}h1{font-size:24px;margin:0 0 8px}h2{font-size:20px;margin:0 0 12px}h3{margin:0 0 6px}.lead{font-size:17px;font-weight:700;line-height:1.6}.muted{color:var(--muted);font-size:14px;line-height:1.5}.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:640px){.pair{grid-template-columns:1fr}}.upload{border:2px dashed #bfc5cc;border-radius:16px;padding:20px;background:#fafafa}.pickers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.pick-btn{border:1px solid #d5d9df;border-radius:12px;padding:12px 7px;background:#fff;font:inherit;font-weight:800}.hidden{position:absolute;width:1px;height:1px;opacity:0}.filename{margin-top:10px;font-size:14px;font-weight:700;min-height:20px;word-break:break-all;color:#157347}.primary,.secondary{width:100%;border:0;border-radius:12px;font-weight:800}.primary{padding:16px;font-size:17px;margin-top:16px;background:#111;color:#fff}.secondary{padding:14px;font-size:16px;margin-top:10px;background:#eceef1;color:#111}.primary:disabled{opacity:.45}.queue-item,.change,.rule,.example{padding:13px 0;border-bottom:1px solid #e7e9ed}.status{display:inline-block;border-radius:999px;padding:4px 8px;background:#e9f9ee;font-size:12px;font-weight:800;margin-top:6px}.score{font-weight:800}.result{margin-top:14px;padding:14px;border-radius:12px;background:#f7f8fa}.error{background:#fff1f1;color:#a40000}.rule strong{display:block;margin-bottom:4px}.pill{display:inline-block;font-size:12px;background:#eef2ff;border-radius:999px;padding:3px 7px;margin:3px 5px 0 0}.note{font-size:13px;line-height:1.6;color:#667085}.preview{margin-top:14px;border:1px solid #dfe3e8;border-radius:12px;overflow:auto;background:#fff}.preview svg{display:block;width:100%;height:auto;min-width:600px}.warn{margin-top:8px;padding:10px;border-radius:10px;background:#fff7e6;color:#7a4d00}.cloud{margin-top:10px;padding:12px;border-radius:10px;background:#eef8f0;color:#176b2c;font-size:13px;font-weight:800}.meter{margin-top:10px;height:10px;background:#eceff3;border-radius:99px;overflow:hidden}.meter>div{height:100%;background:#222}.growth{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.growth div{background:#f7f8fa;border-radius:10px;padding:10px;text-align:center;font-weight:800}.growth span{display:block;font-size:12px;color:#667085;font-weight:600;margin-top:3px}
</style></head><body><header>銘板図面変換アプリ</header><main>
<section class="card"><h1>育てるAI・正解ペア学習</h1><p class="lead">客先図面と村上図面の正解ペアを覚え、法則だけでなく「似た過去事例」も使って次の村上図面を予測します。</p><div class="cloud" id="cloudStatus">☁️ 学習データを読み込み中…</div><div class="growth"><div id="gPairs">0<span>正解ペア</span></div><div id="gRules">0<span>学習法則</span></div><div id="gLevel">1<span>成長レベル</span></div></div><div class="pair" style="margin-top:14px">
<div class="upload"><h3>① 客先図面</h3><div class="muted">PDF・写真（AIファイルはPDF保存）</div><div class="pickers"><button class="pick-btn" id="sourcePhotoBtn">📷 写真から選ぶ</button><button class="pick-btn" id="sourceFileBtn">📁 ファイルから選ぶ</button></div><input id="sourcePhoto" class="hidden" type="file" accept="image/*"><input id="sourceFile" class="hidden" type="file" accept=".pdf,image/*,application/pdf"><div id="sourceName" class="filename"></div></div>
<div class="upload"><h3>② 村上図面（正解）</h3><div class="muted">完成PDF・写真</div><div class="pickers"><button class="pick-btn" id="finishedPhotoBtn">📷 写真から選ぶ</button><button class="pick-btn" id="finishedFileBtn">📁 ファイルから選ぶ</button></div><input id="finishedPhoto" class="hidden" type="file" accept="image/*"><input id="finishedFile" class="hidden" type="file" accept=".pdf,image/*,application/pdf"><div id="finishedName" class="filename"></div></div></div>
<button class="primary" id="analyzeBtn">この正解ペアをAIに覚えさせる</button><div id="progress"></div><div id="latest"></div></section>
<section class="card"><h2>現在の学習法則</h2><div class="muted">同じ判断が何度も確認されるほど重みが上がります。学習内容はクラウド保存され、次回も継続します。</div><div id="rules"></div></section>
<section class="card"><h2>新しい客先図面から村上図面を予測</h2><p class="lead">学習法則＋似た過去の正解事例を使って予測します。</p><div class="upload"><h3>新しい客先図面</h3><div class="pickers"><button class="pick-btn" id="predictPhotoBtn">📷 写真から選ぶ</button><button class="pick-btn" id="predictFileBtn">📁 ファイルから選ぶ</button></div><input id="predictPhoto" class="hidden" type="file" accept="image/*"><input id="predictFile" class="hidden" type="file" accept=".pdf,image/*,application/pdf"><div id="predictName" class="filename"></div></div><button class="primary" id="predictBtn">成長したAIで村上図面を予測する</button><div id="predictProgress"></div><div id="prediction"></div></section>
<section class="card"><h2>比較済みの正解ペア</h2><div id="queue"></div></section>
</main><script>
const API='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/drawing-rule-ai';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#039;'}[m]));let source=null,finished=null,predictSource=null,pairs=[],rules=[];
function choose(w,f){if(w==='s')source=f;else if(w==='f')finished=f;else predictSource=f;$(w==='s'?'sourceName':w==='f'?'finishedName':'predictName').textContent=f?'✅ '+f.name:''}function wire(b,i,w){$(b).onclick=()=>$(i).click();$(i).onchange=function(){choose(w,this.files[0]||null)}}wire('sourcePhotoBtn','sourcePhoto','s');wire('sourceFileBtn','sourceFile','s');wire('finishedPhotoBtn','finishedPhoto','f');wire('finishedFileBtn','finishedFile','f');wire('predictPhotoBtn','predictPhoto','p');wire('predictFileBtn','predictFile','p');
function file64(file){return new Promise((res,rej)=>{if(file.size>18*1024*1024)return rej(new Error('1ファイル18MB以下にしてください'));const r=new FileReader();r.onload=()=>res({name:file.name,mime:file.type||(/\.pdf$/i.test(file.name)?'application/pdf':'application/octet-stream'),data:String(r.result).split(',')[1]});r.onerror=()=>rej(new Error('ファイルを読めませんでした'));r.readAsDataURL(file)})}
async function api(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok||d.error)throw new Error(d.error||'処理に失敗しました');return d}
function growthLevel(){return Math.max(1,Math.min(10,1+Math.floor(pairs.length/5)))}
function render(){rules.sort((a,b)=>(b.count-a.count)||(b.confidence-a.confidence));$('gPairs').innerHTML=`${pairs.length}<span>正解ペア</span>`;$('gRules').innerHTML=`${rules.length}<span>学習法則</span>`;$('gLevel').innerHTML=`${growthLevel()}<span>成長レベル</span>`;$('rules').innerHTML=rules.length?rules.slice(0,80).map(r=>`<div class="rule"><strong>${esc(r.rule)}</strong><span class="pill">${esc(r.category||'')}</span><span class="pill">確認 ${Number(r.count)||0}回</span><span class="pill">AI信頼度 ${Number(r.confidence)||0}%</span></div>`).join(''):'<p class="muted">まだ法則はありません。正解ペアを1組教えてください。</p>';$('queue').innerHTML=pairs.length?pairs.slice().reverse().map((p,i)=>`<div class="queue-item"><strong>正解ペア ${pairs.length-i}</strong><br><span class="muted">客先：${esc(p.source)}<br>村上：${esc(p.finished)}</span><br><span class="status">学習済み</span><div class="note">${esc(p.summary||'')}</div></div>`).join(''):'<p class="muted">まだ正解ペアはありません。</p>'}
async function load(){try{const d=await api({action:'load'}),s=d.state||{};rules=Array.isArray(s.rules)?s.rules:[];pairs=Array.isArray(s.pairs)?s.pairs:[];$('cloudStatus').textContent=`☁️ 学習データ読込済み｜正解ペア ${pairs.length}組・法則 ${rules.length}件`;render()}catch(e){$('cloudStatus').textContent='⚠️ 学習データの読込に失敗しました：'+e.message;render()}}
$('analyzeBtn').onclick=async()=>{if(!source)return alert('客先図面を選んでください');if(!finished)return alert('村上図面を選んでください');const btn=$('analyzeBtn');btn.disabled=true;$('progress').innerHTML='<div class="result">AIが2枚を比較し、今回の判断と図面の特徴を学習しています…</div>';$('latest').innerHTML='';try{const [s,f]=await Promise.all([file64(source),file64(finished)]),d=await api({action:'compare',source:s,finished:f});const a=d.analysis||{},st=d.state||{};rules=st.rules||rules;pairs=st.pairs||pairs;$('cloudStatus').textContent=`☁️ 学習保存済み｜正解ペア ${pairs.length}組・法則 ${rules.length}件`;$('latest').innerHTML=`<div class="result"><h3>今回覚えたこと</h3><p>${esc(a.summary||'')}</p>${(a.changes||[]).map(x=>`<div class="change"><strong>${esc(x.category)}</strong> <span class="score">${Number(x.confidence)||0}%</span><br><span class="muted">客先：</span>${esc(x.before)}<br><span class="muted">村上：</span>${esc(x.after)}<br><b>→ ${esc(x.rule)}</b><div class="note">根拠：${esc(x.evidence)}</div></div>`).join('')}${(a.needsMoreExamples||[]).length?`<div class="warn"><b>まだ断定しない点</b><br>${a.needsMoreExamples.map(x=>'・'+esc(x)).join('<br>')}</div>`:''}</div>`;$('progress').innerHTML='';render()}catch(e){$('progress').innerHTML=`<div class="result error">${esc(e.message||e)}</div>`}finally{btn.disabled=false}};
$('predictBtn').onclick=async()=>{if(!predictSource)return alert('新しい客先図面を選んでください');if(!pairs.length)return alert('先に正解ペアを学習させてください');const btn=$('predictBtn');btn.disabled=true;$('predictProgress').innerHTML='<div class="result">保存済みの法則と似た過去事例を探して、村上図面を予測中です…</div>';$('prediction').innerHTML='';try{const s=await file64(predictSource),d=await api({action:'predict',source:s}),p=d.prediction||{},svg=String(p.svg||'').trim(),sim=p.similarExamples||[];$('prediction').innerHTML=`<div class="result"><h3>${esc(p.title||'予測村上図面')}</h3><p>${esc(p.summary||'')}</p><div class="score">予測信頼度 ${Number(p.confidence)||0}%</div><div class="note">学習参照：正解ペア ${d.learningStats?.pairCount||0}組・法則 ${d.learningStats?.ruleCount||0}件</div>${sim.length?`<h3 style="margin-top:14px">似ている過去の正解事例</h3>${sim.map(x=>`<div class="example"><b>${esc(x.source)} → ${esc(x.finished)}</b><div class="note">${esc(x.reason)}</div></div>`).join('')}`:''}${(p.appliedRules||[]).length?`<h3 style="margin-top:14px">適用した法則</h3>${p.appliedRules.map(x=>`<div class="note">・${esc(x)}</div>`).join('')}`:''}${(p.warnings||[]).length?`<div class="warn"><b>要確認</b><br>${p.warnings.map(x=>`・${esc(x)}`).join('<br>')}</div>`:''}${svg?`<div class="preview">${svg}</div><button class="secondary" id="saveSvgBtn">Illustrator用SVGを保存</button><button class="secondary" id="savePdfBtn">予測結果をPDF保存・印刷</button>`:''}<div class="warn"><b>さらに賢くするには</b><br>この予測に対して実際に社員さんが作った正解図面を、上の「正解ペア学習」に追加してください。間違えた箇所も次回の学習材料になります。</div></div>`;$('predictProgress').innerHTML='';if(svg){$('saveSvgBtn').onclick=()=>{const blob=new Blob([svg],{type:'image/svg+xml'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='predicted-murakami-drawing.svg';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('savePdfBtn').onclick=()=>{const w=window.open('','_blank');if(!w)return alert('PDF画面を開けませんでした。Safariのポップアップ許可を確認してください。');const title=esc(p.title||'予測村上図面'),summary=esc(p.summary||''),warnings=(p.warnings||[]).map(x=>`<li>${esc(x)}</li>`).join('');w.document.open();w.document.write(`<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>${title}</title><style>@page{size:A4 landscape;margin:10mm}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;color:#111}h1{font-size:20px;margin:0 0 8px}.meta{font-size:12px;margin-bottom:8px}.sheet{width:100%;page-break-inside:avoid}.sheet svg{width:100%;height:auto;max-height:170mm}.warnpdf{font-size:11px;margin-top:6px;color:#a33}button{display:block;margin:18px auto;padding:12px 24px;font-size:16px;font-weight:700}@media print{button{display:none}}</style></head><body><h1>${title}</h1><div class="meta">${summary}<br>予測信頼度 ${Number(p.confidence)||0}%</div><div class="sheet">${svg}</div>${warnings?`<div class="warnpdf"><b>要確認</b><ul>${warnings}</ul></div>`:''}<button onclick="window.print()">PDF保存・印刷</button><script>setTimeout(()=>window.print(),500)<\/script></body></html>`);w.document.close();}}}catch(e){$('predictProgress').innerHTML=`<div class="result error">${esc(e.message||e)}</div>`}finally{btn.disabled=false}};
load();
</script></body></html>
