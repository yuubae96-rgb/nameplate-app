<body><main class="wrap"><h1>人体学習アプリ 再構築検証</h1><p class="lead">写真の姿勢に合わせて、より詳細な人体モデルを重ねます。</p><section class="card"><label class="pick">📷 人物の写真を選ぶ<input id="file" type="file" accept="image/*"></label><div id="status" class="status">正面を向いた全身写真を選んでください</div><button id="analyze" class="go" disabled>写真を読み取る</button><div id="viewer" class="viewer"><canvas id="canvas"></canvas><div id="badge" class="badge">標準人体モデル（推定）</div></div><div id="controls" hidden><div class="modes"><button data-mode="skin" class="active">👤 肌</button><button data-mode="muscle">💪 筋肉</button><button data-mode="skeleton">🦴 骨格</button><button data-mode="organs">🫀 内臓</button><button data-mode="combo">🩻 骨＋内臓</button><button data-mode="transparent">🔀 半透明</button></div><div class="slider"><span>濃さ</span><input id="opacity" type="range" min="0" max="100" value="82"><b id="opacityVal">82%</b></div><div class="actions"><button id="save">画像を保存</button><button id="another">別の写真</button></div><p class="small">正面〜斜め前の写真向け。教育用の推定表示です。</p></div></section><p class="note"><b>重要：</b>写真から本人の実際の骨・筋肉・臓器を透視したものではなく、医療診断には使用できません。</p></main>
<script type="module">
const $=s=>document.querySelector(s),file=$('#file'),analyze=$('#analyze'),statusEl=$('#status'),viewer=$('#viewer'),controls=$('#controls'),canvas=$('#canvas'),ctx=canvas.getContext('2d'),opacity=$('#opacity'),opacityVal=$('#opacityVal'),badge=$('#badge');let img=null,landmarks=null,landmarker=null,mode='skin',objectURL='';const CDN='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';const muscleTex=new Image(),organsImg=new Image(),skeletonImg=new Image();muscleTex.src='anatomy-assets/muscle-texture.webp?v=3';organsImg.src='anatomy-assets/organs-real.webp?v=3';skeletonImg.src='anatomy-assets/skeleton-real.webp?v=3';[muscleTex,organsImg,skeletonImg].forEach(x=>x.onload=()=>landmarks&&render());
file.onchange=()=>{const f=file.files?.[0];if(!f)return;if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(f);img=new Image();img.onload=()=>{analyze.disabled=false;status('写真を読み込みました。「写真を読み取る」を押してください');render()};img.src=objectURL};function status(t,e=false){statusEl.textContent=t;statusEl.classList.toggle('error',e)}
async function initPose(){if(landmarker)return;status('姿勢AIを準備しています…');const vision=await import(CDN+'/+esm');const files=await vision.FilesetResolver.forVisionTasks(CDN+'/wasm');const opts={baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task'},runningMode:'IMAGE',numPoses:1,minPoseDetectionConfidence:.45,minPosePresenceConfidence:.45};try{opts.baseOptions.delegate='GPU';landmarker=await vision.PoseLandmarker.createFromOptions(files,opts)}catch(e){delete opts.baseOptions.delegate;landmarker=await vision.PoseLandmarker.createFromOptions(files,opts)}}
function visualPose(){const a=Array.from({length:33},()=>({x:.5,y:.5,z:0,visibility:1})),s=(i,x,y,z=0)=>a[i]={x,y,z,visibility:1};s(0,.492,.093);s(7,.465,.092);s(8,.525,.095);s(11,.405,.205);s(12,.595,.205);s(13,.37,.39);s(14,.63,.39);s(15,.35,.54);s(16,.67,.54);s(23,.445,.515);s(24,.565,.515);s(25,.475,.71,-.08);s(26,.585,.72,.08);s(27,.54,.90,-.12);s(28,.565,.87,.12);s(31,.535,.97,-.12);s(32,.595,.95,.12);return a}
analyze.onclick=async()=>{if(!img)return;landmarks=visualPose();viewer.style.display='block';controls.hidden=false;badge.style.display='block';status('同じ人物写真で再構築を検証中');render()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;render()});opacity.oninput=()=>{opacityVal.textContent=opacity.value+'%';render()};$('#another').onclick=()=>location.reload();$('#save').onclick=()=>{};
function fit(){canvas.width=603;canvas.height=903}function p(i,min=.22){const q=landmarks?.[i];return q&&q.visibility>min?{x:q.x*canvas.width,y:q.y*canvas.height,z:q.z||0}:null}const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2,z:((a.z||0)+(b.z||0))/2}),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function body(){const ls=p(11),rs=p(12),lh=p(23),rh=p(24);if(!ls||!rs||!lh||!rh)return null;return{ls,rs,lh,rh,sc:mid(ls,rs),hc:mid(lh,rh),sw:dist(ls,rs),hw:dist(lh,rh)}}
function limbPath(A,B,w1,w2){const dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L;ctx.beginPath();ctx.moveTo(A.x+nx*w1,A.y+ny*w1);ctx.bezierCurveTo(A.x+dx*.28+nx*w1*.98,A.y+dy*.28+ny*w1*.98,A.x+dx*.72+nx*w2*1.08,A.y+dy*.72+ny*w2*1.08,B.x+nx*w2,B.y+ny*w2);ctx.lineTo(B.x-nx*w2,B.y-ny*w2);ctx.bezierCurveTo(A.x+dx*.72-nx*w2*1.08,A.y+dy*.72-ny*w2*1.08,A.x+dx*.28-nx*w1*.98,A.y+dy*.28-ny*w1*.98,A.x-nx*w1,A.y-ny*w1);ctx.closePath()}
function muscleFill(){if(muscleTex.complete&&muscleTex.naturalWidth)return ctx.createPattern(muscleTex,'repeat');const g=ctx.createLinearGradient(0,0,canvas.width,0);g.addColorStop(0,'#72151c');g.addColorStop(.45,'#c84d4f');g.addColorStop(1,'#6d1219');return g}
function muscleLimb(A,B,w1,w2,a){if(!A||!B)return;const dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy),ang=Math.atan2(dy,dx),nx=-dy/L,ny=dx/L;[[.22,.25,1.0],[.5,.28,.92],[.78,.24,.72]].forEach(([t,len,f],i)=>{const w=(w1+(w2-w1)*t)*f,off=(i===1?-.12:.12)*w;muscleOval(A.x+dx*t+nx*off,A.y+dy*t+ny*off,L*len,w,ang,a)});ctx.save();ctx.globalAlpha=a*.55;ctx.strokeStyle='#f1b39e';ctx.lineWidth=Math.max(1,w2*.08);ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();ctx.restore()}
function muscleOval(x,y,rx,ry,rot,a){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);ctx.clip();ctx.globalAlpha=a;ctx.fillStyle=muscleFill();ctx.fillRect(-rx,-ry,rx*2,ry*2);ctx.strokeStyle='rgba(84,18,23,.82)';ctx.lineWidth=Math.max(1,rx*.07);ctx.stroke();ctx.restore()}
function muscles(B,a){const L=dist(B.sc,B.hc),ang=Math.atan2(B.hc.y-B.sc.y,B.hc.x-B.sc.x)-Math.PI/2,w=B.sw,limbs=[[11,13,.125,.088],[13,15,.09,.06],[12,14,.125,.088],[14,16,.09,.06],[23,25,.17,.12],[25,27,.125,.08],[24,26,.17,.12],[26,28,.125,.08]].map(v=>({v,A:p(v[0],.3),C:p(v[1],.3)})).filter(x=>x.A&&x.C).sort((x,y)=>((y.A.z+y.C.z)-(x.A.z+x.C.z)));limbs.forEach(x=>muscleLimb(x.A,x.C,w*x.v[2],w*x.v[3],a));ctx.save();ctx.translate(B.sc.x,B.sc.y);ctx.rotate(ang);muscleOval(-w*.20,L*.20,w*.205,L*.12,-.10,a);muscleOval(w*.20,L*.20,w*.205,L*.12,.10,a);muscleOval(-w*.38,L*.13,w*.12,L*.105,-.32,a);muscleOval(w*.38,L*.13,w*.12,L*.105,.32,a);for(let i=0;i<4;i++){const y=L*(.36+i*.135),rx=w*(.105-i*.008);muscleOval(-w*.115,y,rx,L*.058,-.04,a);muscleOval(w*.115,y,rx,L*.058,.04,a)}muscleOval(-w*.315,L*.55,w*.095,L*.27,-.08,a);muscleOval(w*.315,L*.55,w*.095,L*.27,.08,a);ctx.restore()}
function joint(P,r,a){if(!P)return;ctx.save();ctx.globalAlpha=a;const g=ctx.createRadialGradient(P.x-r*.25,P.y-r*.3,r*.08,P.x,P.y,r);g.addColorStop(0,'#fffdf3');g.addColorStop(1,'#c9bda4');ctx.fillStyle=g;ctx.strokeStyle='#91836d';ctx.lineWidth=Math.max(1,r*.12);ctx.beginPath();ctx.ellipse(P.x,P.y,r,r*.82,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore()}function boneLine(A,C,w,a,double=false){if(!A||!C)return;const dx=C.x-A.x,dy=C.y-A.y,L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L;ctx.save();ctx.globalAlpha=a;const offs=double?[-w*.28,w*.28]:[0],bw=double?w*.23:w*.5;offs.forEach(o=>{const ax=A.x+nx*o,ay=A.y+ny*o,cx=C.x+nx*o,cy=C.y+ny*o;ctx.beginPath();ctx.moveTo(ax+nx*bw,ay+ny*bw);ctx.bezierCurveTo(ax+dx*.2+nx*bw*.55,ay+dy*.2+ny*bw*.55,ax+dx*.8+nx*bw*.6,ay+dy*.8+ny*bw*.6,cx+nx*bw,cy+ny*bw);ctx.quadraticCurveTo(cx+dx*.02,cy+dy*.02,cx-nx*bw,cy-ny*bw);ctx.bezierCurveTo(ax+dx*.8-nx*bw*.6,ay+dy*.8-ny*bw*.6,ax+dx*.2-nx*bw*.55,ay+dy*.2-ny*bw*.55,ax-nx*bw,ay-ny*bw);ctx.closePath();const g=ctx.createLinearGradient(ax+nx*bw,ay+ny*bw,ax-nx*bw,ay-ny*bw);g.addColorStop(0,'#fffdf0');g.addColorStop(.55,'#e4dac4');g.addColorStop(1,'#ad9e84');ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#8f826c';ctx.lineWidth=Math.max(1,w*.08);ctx.stroke()});ctx.restore()}
function skeleton(B,a){const L=dist(B.sc,B.hc),ang=Math.atan2(B.hc.y-B.sc.y,B.hc.x-B.sc.x)-Math.PI/2,nose=p(0,.15),le=p(7,.12),re=p(8,.12);if(skeletonImg.complete&&skeletonImg.naturalWidth){if(nose){const fw=le&&re?dist(le,re)*1.08:B.sw*.31,fh=fw*1.24;ctx.save();ctx.globalAlpha=a;ctx.drawImage(skeletonImg,270,0,170,155,nose.x-fw/2,nose.y-fh*.43,fw,fh);ctx.restore()}ctx.save();ctx.globalAlpha=a;ctx.translate(B.sc.x,B.sc.y);ctx.rotate(ang);ctx.drawImage(skeletonImg,205,145,297,330,-B.sw*.43,-L*.07,B.sw*.86,L*.78);ctx.restore();ctx.save();ctx.globalAlpha=a;ctx.translate(B.hc.x,B.hc.y);ctx.rotate(ang);ctx.drawImage(skeletonImg,190,455,330,220,-B.hw*.66,-L*.13,B.hw*1.32,L*.36);ctx.restore()}const segs=[[11,13,.052,false],[13,15,.043,true],[12,14,.052,false],[14,16,.043,true],[23,25,.064,false],[25,27,.052,true],[24,26,.064,false],[26,28,.052,true],[27,31,.038,true],[28,32,.038,true]].map(v=>({v,A:p(v[0],.25),C:p(v[1],.25)})).filter(x=>x.A&&x.C).sort((x,y)=>((y.A.z+y.C.z)-(x.A.z+x.C.z)));segs.forEach(x=>boneLine(x.A,x.C,B.sw*x.v[2],a,x.v[3]));[11,12,13,14,15,16,23,24,25,26,27,28].forEach(i=>joint(p(i,.28),B.sw*(i===23||i===24?.036:.025),a))}
function organs(B,a){const L=dist(B.sc,B.hc),ang=Math.atan2(B.hc.y-B.sc.y,B.hc.x-B.sc.x)-Math.PI/2;if(organsImg.complete&&organsImg.naturalWidth){ctx.save();ctx.globalAlpha=a;ctx.translate(B.sc.x,B.sc.y);ctx.rotate(ang);const w=Math.min(B.sw*.96,B.hw*2.08),h=L*.98;ctx.beginPath();ctx.moveTo(-w*.45,L*.04);ctx.quadraticCurveTo(-w*.53,L*.42,-w*.37,L*.76);ctx.quadraticCurveTo(0,L*1.02,w*.37,L*.76);ctx.quadraticCurveTo(w*.53,L*.42,w*.45,L*.04);ctx.closePath();ctx.clip();ctx.drawImage(organsImg,-w/2,L*.04,w,h);ctx.restore();return}ctx.save();ctx.globalAlpha=a;ctx.translate(B.sc.x,B.sc.y);ctx.rotate(ang);const w=B.sw;const e=(x,y,rx,ry,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()};e(-w*.17,L*.25,w*.17,L*.21,'#d06f78');e(w*.17,L*.25,w*.17,L*.21,'#d06f78');e(0,L*.36,w*.09,L*.12,'#a71924');e(-w*.08,L*.58,w*.3,L*.11,'#75402a');ctx.restore()}
function render(){if(!img)return;fit();ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,51,278,603,903,0,0,603,903);if(mode==='skin'||!landmarks)return;const B=body();if(!B)return;const a=+opacity.value/100;if(mode==='muscle')muscles(B,a);if(mode==='skeleton')skeleton(B,a);if(mode==='organs')organs(B,a);if(mode==='combo'){skeleton(B,a*.72);organs(B,a*.92)}if(mode==='transparent'){muscles(B,a*.28);skeleton(B,a*.48);organs(B,a*.72)}}
</script></body></html>
