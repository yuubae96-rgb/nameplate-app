<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="外れ値YouTube"><title>外れ値YouTube AI</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f5;color:#17211b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:780px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 14px calc(80px + env(safe-area-inset-bottom))}.card{background:#fff;border:1px solid #dfe7e1;border-radius:18px;padding:15px;margin:13px 0;box-shadow:0 4px 18px #0001}.hero{background:linear-gradient(135deg,#e8f6ec,#fff)}h1{font-size:26px;margin:7px 0}h2{font-size:20px;margin:0 0 10px}.sub,.muted{color:#68736c;line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:block;font-weight:800;margin:8px 0 5px}input,select{width:100%;padding:12px;font-size:16px;border:1px solid #cad6cd;border-radius:11px;background:#fff}button,a.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:850;text-align:center;text-decoration:none;margin-top:10px;background:#168447;color:#fff}.secondary{background:#edf5ef!important;color:#17683b!important}.dark{background:#1b2a21!important}.hidden{display:none}.status{padding:11px;border-radius:11px;background:#f5f8f6;font-size:14px;line-height:1.5;margin-top:10px}.ok{background:#eef8f1;color:#28623b}.error{background:#fff2f0;color:#8d2d22}.video{border-top:1px solid #e6ece8;padding:14px 0}.video:first-child{border-top:0}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:#eee}.pill,.badge{display:inline-block;border-radius:999px;font-weight:850}.pill{font-size:12px;padding:4px 8px;background:#eef4f0;color:#365944}.badge{padding:6px 10px;background:#fff0dc;color:#9b4c00}.title{font-size:17px;font-weight:900;line-height:1.45;margin:7px 0}.score{font-size:27px;font-weight:950;color:#c65b00}.opp{font-size:22px;font-weight:950;color:#17683b}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:8px}.stat{background:#f6f9f7;border-radius:10px;padding:8px;font-size:12px;color:#65716a}.stat b{display:block;color:#18231c;font-size:16px}.bar{height:8px;background:#e8eee9;border-radius:20px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:#e57b21}.idea,.factor{padding:11px 0;border-top:1px solid #e5ebe7}.best{border:2px solid #36a265;background:#f2fbf5}.small{font-size:13px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.tabs button{margin:0;background:#eaf1ec;color:#28523a}.tabs button.active{background:#17683b;color:#fff}.stars{letter-spacing:1px}@media(max-width:480px){h1{font-size:24px}}</style></head><body><main class="wrap"><section class="card hero"><span class="badge">🔥 OUTLIER</span><h1>外れ値YouTube AI</h1><p class="sub">「そのチャンネルで珍しく跳ねた動画」を見つけ、次に研究する価値まで総合評価します。</p></section><section class="card"><h2>① 外れ値動画を探す</h2><label>調べたいテーマ</label><input id="theme" placeholder="例：伊藤博文、太平洋戦争"><div class="grid"><div><label>通常値</label><select id="base"><option value="20">直近20本</option><option value="10">直近10本</option><option value="30">直近30本</option></select></div><div><label>外れ値</label><select id="threshold"><option value="3">3倍以上</option><option value="5">5倍以上</option><option value="10">10倍以上</option></select></div></div><button id="searchBtn">🔥 YouTubeから外れ値を自動発見</button><div id="searchStatus" class="status hidden"></div></section><section id="resultsCard" class="card hidden"><h2>② ランキング</h2><div id="summary" class="status ok"></div><div class="tabs"><button id="tabOpp" class="active">🎯 狙い目総合</button><button id="tabRatio">🔥 倍率順</button></div><button id="batchBtn" class="dark">🤖 上位5本をまとめてAI分析</button><p class="small muted">狙い目度は、通常比・絶対再生数・登録者比・公開後の勢いを組み合わせた研究優先度です。未来の再生数を保証する点数ではありません。</p><div id="results"></div></section><section id="analysisCard" class="card hidden"><h2>③ AI分析</h2><div id="analysisTarget"></div><div id="analysisStatus" class="status hidden"></div><div id="analysis"></div></section></main><script>const SEARCH='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/youtube-outlier-search',ANALYZE='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/youtube-outlier-analyze';const $=id=>document.getElementById(id),fmt=n=>new Intl.NumberFormat('ja-JP').format(Math.round(+n||0));let state={theme:'',videos:[],sort:'opp',best:null};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const dur=s=>{s=+s||0;return Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0')};function daysOld(d){return Math.max(1,(Date.now()-new Date(d).getTime())/86400000)}function opportunity(v){const ratio=Math.max(1,+v.viewRatio||1),views=Math.max(1,+v.views||1),subs=Math.max(100,+v.subscriberCount||100),days=daysOld(v.publishedAt);const ratioPts=45*Math.min(1,Math.log10(ratio)/Math.log10(20));const viewPts=25*Math.min(1,Math.log10(views)/6);const subPts=15*Math.min(1,views/subs);const velocity=views/Math.max(30,days);const velPts=15*Math.min(1,Math.log10(Math.max(1,velocity))/4);return Math.max(1,Math.min(100,Math.round(ratioPts+viewPts+subPts+velPts)))}function rank(r){return r>=10?'超アウトライアー 🔥🔥🔥':r>=5?'強いアウトライアー 🔥🔥':r>=3?'アウトライアー 🔥':'通常以上'}async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw new Error(d.error||'処理に失敗しました');return d}function status(el,msg,c=''){el.className='status '+c;el.textContent=msg;el.classList.remove('hidden')}
$('searchBtn').onclick=async()=>{const theme=$('theme').value.trim();if(!theme)return alert('テーマを入力してください');state.theme=theme;$('searchBtn').disabled=true;status($('searchStatus'),'YouTubeを調査しています…');$('resultsCard').classList.add('hidden');try{const d=await post(SEARCH,{theme,baseCount:+$('base').value,threshold:+$('threshold').value});state.videos=(d.results||[]).map(v=>({...v,opportunityScore:opportunity(v)}));render()}catch(e){status($('searchStatus'),'検索できませんでした：'+e.message,'error')}finally{$('searchBtn').disabled=false}};
function sorted(){return [...state.videos].sort((a,b)=>state.sort==='ratio'?b.viewRatio-a.viewRatio:b.opportunityScore-a.opportunityScore)}function render(){status($('searchStatus'),`${state.videos.length}本を比較しました。`,'ok');$('summary').innerHTML=`<b>${esc(state.theme)}</b> の候補を比較中。倍率だけでなく「次に研究する価値」も見ます。`;$('results').innerHTML=sorted().map((v,i)=>`<article class="video"><img class="thumb" src="${esc(v.thumbnail)}"><div><span class="pill">${i+1}位</span> <span class="pill">${dur(v.durationSeconds)}</span></div><div class="title">${esc(v.title)}</div><div class="muted small">${esc(v.channelTitle)} ・ ${String(v.publishedAt||'').slice(0,10)}</div><div class="grid"><div><div class="score">${(+v.viewRatio).toFixed(1)}倍</div><div class="small">通常比</div></div><div><div class="opp">狙い目度 ${v.opportunityScore}</div><div class="small">研究優先度 / 100</div></div></div><div class="stats"><div class="stat">この動画<b>${fmt(v.views)}回</b></div><div class="stat">通常中央値<b>${fmt(v.medianViews)}回</b></div><div class="stat">登録者<b>${fmt(v.subscriberCount)}</b></div><div class="stat">判定<b>${rank(v.viewRatio)}</b></div></div><button onclick="analyze('${v.videoId}')">🤖 この1本をAI分析</button><a class="btn secondary" target="_blank" href="${esc(v.url)}">YouTubeで動画を見る</a></article>`).join('');$('resultsCard').classList.remove('hidden');$('resultsCard').scrollIntoView({behavior:'smooth'})}
$('tabOpp').onclick=()=>{state.sort='opp';$('tabOpp').classList.add('active');$('tabRatio').classList.remove('active');render()};$('tabRatio').onclick=()=>{state.sort='ratio';$('tabRatio').classList.add('active');$('tabOpp').classList.remove('active');render()};
window.analyze=async id=>{const v=state.videos.find(x=>x.videoId===id);$('analysisCard').classList.remove('hidden');$('analysisTarget').innerHTML=`<div class="title">${esc(v.title)}</div><div class="opp">狙い目度 ${v.opportunityScore}</div>`;$('analysis').innerHTML='';status($('analysisStatus'),'動画を見ながらAI分析しています…');$('analysisCard').scrollIntoView({behavior:'smooth'});try{const a=await post(ANALYZE,{action:'single',theme:state.theme,video:v});renderSingle(a)}catch(e){status($('analysisStatus'),'AI分析に失敗：'+e.message,'error')}};
$('batchBtn').onclick=async()=>{const top=sorted().slice(0,5);$('analysisCard').classList.remove('hidden');$('analysisTarget').innerHTML=`<span class="badge">上位${top.length}本 横断分析</span><div class="title">共通する「勝ち構造」を探します</div>`;$('analysis').innerHTML='';status($('analysisStatus'),'上位動画をまとめて見ながら、共通点と次の企画を作っています…');$('analysisCard').scrollIntoView({behavior:'smooth'});try{const a=await post(ANALYZE,{action:'batch',theme:state.theme,videos:top});renderBatch(a)}catch(e){status($('analysisStatus'),'一括AI分析に失敗：'+e.message,'error')}};
function renderSingle(a){status($('analysisStatus'),'AI分析完了','ok');const fs=(a.factors||[]).map(x=>`<div class="factor"><b>${esc(x.label)}</b> <span class="pill">確度 ${esc(x.confidence)}</span><div class="muted">${esc(x.detail)}</div></div>`).join('');const ideas=(a.ideas||[]).map((x,i)=>`<div class="idea"><b>${i+1}. ${esc(x.title)}</b><div class="muted">${esc(x.angle)}</div><div>サムネ：<b>${esc(x.thumbnailText)}</b></div></div>`).join('');$('analysis').innerHTML=`<div class="status"><b>結論</b><br>${esc(a.summary)}</div>${fs}<h3>新企画10案</h3>${ideas}`}
function stars(n){return '★'.repeat(Math.max(0,Math.min(5,+n||0)))+'☆'.repeat(5-Math.max(0,Math.min(5,+n||0)))}function renderBatch(a){status($('analysisStatus'),'上位動画の横断分析が完了しました。','ok');const cp=(a.commonPatterns||[]).map(x=>`<div class="factor"><b>${esc(x.label)}</b> <span class="pill">確度 ${esc(x.confidence)}</span><div class="muted">${esc(x.detail)}</div></div>`).join('');const ideas=(a.ideas||[]).sort((x,y)=>(+y.opportunityScore||0)-(+x.opportunityScore||0)).map((x,i)=>`<div class="idea"><b>${i+1}. ${esc(x.title)}</b><div class="opp">狙い目 ${x.opportunityScore||'-'}/100</div><div class="muted">${esc(x.angle)}</div><div>競合の少なさ <span class="stars">${stars(x.competition)}</span></div><div>歴史系との相性 <span class="stars">${stars(x.fit)}</span></div><div>サムネ：<b>${esc(x.thumbnailText)}</b></div><div class="small">${esc(x.reason)}</div></div>`).join('');const b=a.bestIdea||{};state.best=b;$('analysis').innerHTML=`<div class="status"><b>全体結論</b><br>${esc(a.summary)}</div><h3>複数動画に共通する勝ちパターン</h3>${cp}<h3>次に狙う新企画ランキング</h3>${ideas}<div class="card best"><span class="badge">🏆 AIおすすめ第1位</span><div class="title">${esc(b.title)}</div><div class="opp">狙い目 ${b.opportunityScore||'-'}/100</div><div>サムネ：<b>${esc(b.thumbnailText)}</b></div><div class="muted">${esc(b.reason)}</div>${(b.outline||[]).map((x,i)=>`<div class="small">${i+1}. ${esc(x)}</div>`).join('')}<button class="dark" onclick="copyBest()">この企画をコピー</button><a class="btn" target="_blank" href="youtube-presentation-studio.html?v=outlier2">🎬 この企画で動画作成へ</a></div>`}window.copyBest=async()=>{const b=state.best||{},t=`テーマ: ${b.title||''}\nサムネ: ${b.thumbnailText||''}\n構成:\n${(b.outline||[]).map((x,i)=>`${i+1}. ${x}`).join('\n')}`;try{await navigator.clipboard.writeText(t);alert('企画をコピーしました')}catch{alert(t)}};</script></body></html>
