<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>外れ値YouTube AI</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f7f5;color:#17211b;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.wrap{max-width:780px;margin:auto;padding:16px 14px 110px}.card{background:#fff;border:1px solid #dfe7e1;border-radius:18px;padding:15px;margin:13px 0}.hero{background:linear-gradient(135deg,#e8f6ec,#fff)}h1{font-size:26px}h2{font-size:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}input,select{width:100%;padding:12px;font-size:16px;border:1px solid #cad6cd;border-radius:11px}label{display:block;font-weight:800;margin:8px 0 5px}button,a.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:850;text-align:center;text-decoration:none;margin-top:10px;background:#168447;color:#fff}.dark{background:#1b2a21}.secondary{background:#edf5ef!important;color:#17683b!important}.hidden{display:none}.status{padding:11px;border-radius:11px;background:#eef8f1;font-size:14px;line-height:1.5;margin-top:10px}.warn{background:#fff7df;color:#765a11}.error{background:#fff2f0;color:#8d2d22}.video{border-top:1px solid #e6ece8;padding:14px 0}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px}.pill,.badge{display:inline-block;border-radius:999px;font-weight:850;padding:5px 9px;background:#eef4f0;color:#365944}.badge{background:#fff0dc;color:#9b4c00}.content-ok{display:inline-block;margin:7px 0;padding:7px 10px;border-radius:10px;background:#e8f7ed;color:#116b37;font-weight:900}.content-no{display:inline-block;margin:7px 0;padding:7px 10px;border-radius:10px;background:#fff4d9;color:#7b5b08;font-weight:900}.content-check{display:inline-block;margin:7px 0;padding:7px 10px;border-radius:10px;background:#eef1f0;color:#5c6861;font-weight:800}.title{font-size:17px;font-weight:900;line-height:1.45;margin:7px 0}.score{font-size:27px;font-weight:950;color:#c65b00}.opp{font-size:22px;font-weight:950;color:#17683b}.muted,.small{color:#68736c}.small{font-size:13px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat{background:#f6f9f7;border-radius:10px;padding:8px;font-size:12px}.stat b{display:block;font-size:16px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs button{background:#eaf1ec;color:#28523a}.tabs .active{background:#17683b;color:#fff}.idea,.factor{padding:11px 0;border-top:1px solid #e5ebe7}.best{border:2px solid #36a265;background:#f2fbf5}.handoff{background:#eaf8ef;border:2px solid #2d9b5d}.contentbox{background:#f7faf8;border:1px solid #dce7df;border-radius:14px;padding:12px;margin:12px 0}.contentrow{padding:8px 0;border-top:1px solid #e1e8e3}.contentrow:first-of-type{border-top:0}.pick{display:flex;align-items:center;gap:9px;background:#f3f7f4;border-radius:11px;padding:10px 12px;margin:9px 0;font-weight:900}.pick input{width:24px;height:24px;accent-color:#168447}.picked{outline:3px solid #62b880;outline-offset:2px;border-radius:14px}.selectbar{position:sticky;top:8px;z-index:5;background:#fff;border:2px solid #168447;border-radius:14px;padding:10px;margin:10px 0;box-shadow:0 4px 15px #0002}.selectbar button{margin-top:7px}.count{font-size:18px;font-weight:950;color:#17683b}.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.mode button{background:#eaf1ec;color:#28523a}.mode button.active{background:#17683b;color:#fff}</style></head><body><main class="wrap">
<section class="card hero"><span class="badge">🔥 OUTLIER</span><h1>外れ値YouTube AI</h1><p>キーワードでも、ざっくりジャンルでも、伸びた動画を探して分析します。</p><div class="status"><b>表示の意味</b><br>🟢 内容取得済み＝字幕本文までAIが読んだ<br>🟡 内容未取得＝タイトル・説明・再生データのみ</div></section>
<section class="card"><h2>① 外れ値動画を探す</h2><div class="mode"><button id="modeKeyword" class="active">🔎 キーワード</button><button id="modeGenre">🧭 ジャンル</button></div><div id="keywordBox"><label>調べたいテーマ</label><input id="theme" placeholder="例：伊藤博文、太平洋戦争"></div><div id="genreBox" class="hidden"><label>ざっくりジャンル</label><select id="genre"><option>日本史</option><option>世界史</option><option>戦争史</option><option>人物伝</option><option>幕末・明治</option><option>昭和史</option><option>事件史</option><option>科学史</option><option>経済・企業</option><option>雑学・教養</option></select><div class="small">1語だけでなく、関連する複数の検索語から広めに探します。</div></div><div class="grid"><div><label>通常値</label><select id="base"><option value="20">直近20本</option><option value="10">直近10本</option><option value="30">直近30本</option></select></div><div><label>外れ値</label><select id="threshold"><option value="3">3倍以上</option><option value="5">5倍以上</option><option value="10">10倍以上</option></select></div></div><button id="searchBtn">🔥 YouTubeから外れ値を自動発見</button><div id="searchStatus" class="status hidden"></div></section>
<section id="resultsCard" class="card hidden"><h2>② ランキング</h2><div class="tabs"><button id="tabOpp" class="active">🎯 狙い目総合</button><button id="tabRatio">🔥 倍率順</button></div><div id="selectBar" class="selectbar hidden"><div class="count" id="selectedCount">0本選択中</div><div class="small">比較したい動画にチェックを入れてください。</div><button id="selectedBtn">🤖 選んだ動画をまとめてAI分析</button><button id="clearBtn" class="secondary">選択を解除</button></div><button id="checkBtn" class="secondary">📖 上位5本の内容取得可否を確認</button><button id="batchBtn" class="dark">🤖 上位5本をAI分析</button><div id="results"></div></section>
<section id="analysisCard" class="card hidden"><h2>③ AI分析</h2><div id="analysisStatus" class="status hidden"></div><div id="analysis"></div></section></main>
<script>
const BASE='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/',SEARCH=BASE+'youtube-outlier-search',ANALYZE=BASE+'youtube-outlier-analyze',TRANSCRIPT=BASE+'youtube-transcript',$=id=>document.getElementById(id),fmt=n=>new Intl.NumberFormat('ja-JP').format(Math.round(+n||0));let state={theme:'',mode:'keyword',videos:[],sort:'opp',brief:null,selected:new Set()};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function daysOld(d){return Math.max(1,(Date.now()-new Date(d).getTime())/86400000)}function opportunity(v){const r=Math.max(1,+v.viewRatio||1),views=Math.max(1,+v.views||1),subs=Math.max(100,+v.subscriberCount||100),days=daysOld(v.publishedAt);return Math.max(1,Math.min(100,Math.round(45*Math.min(1,Math.log10(r)/Math.log10(20))+25*Math.min(1,Math.log10(views)/6)+15*Math.min(1,views/subs)+15*Math.min(1,Math.log10(Math.max(1,views/Math.max(30,days)))/4))))}async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||'処理失敗');return d}async function getTranscript(v){try{const d=await post(TRANSCRIPT,{url:v.url,videoId:v.videoId});return d.available?d:{available:false,error:d.error||'字幕取得できず'}}catch(e){return{available:false,error:e.message||'字幕取得できず'}}}function sorted(){return[...state.videos].sort((a,b)=>state.sort==='ratio'?b.viewRatio-a.viewRatio:b.opportunityScore-a.opportunityScore)}function setSearch(msg,c=''){const e=$('searchStatus');e.className='status '+c;e.textContent=msg;e.classList.remove('hidden')}function availability(v){if(v.transcriptAvailable===true)return '<div class="content-ok">🟢 内容取得済み｜字幕本文まで分析できます</div>';if(v.transcriptAvailable===false)return `<div class="content-no">🟡 内容未取得｜タイトル・説明・再生データのみ${v.transcriptError?'<div class="small">'+esc(v.transcriptError)+'</div>':''}</div>`;return '<div class="content-check">⚪ 内容取得：未確認</div>'}
function setMode(m){state.mode=m;$('modeKeyword').classList.toggle('active',m==='keyword');$('modeGenre').classList.toggle('active',m==='genre');$('keywordBox').classList.toggle('hidden',m!=='keyword');$('genreBox').classList.toggle('hidden',m!=='genre')}$('modeKeyword').onclick=()=>setMode('keyword');$('modeGenre').onclick=()=>setMode('genre');
function updateSelection(){const n=state.selected.size;$('selectedCount').textContent=`${n}本選択中`;$('selectBar').classList.toggle('hidden',n===0);$('selectedBtn').textContent=n>=2?`🤖 選んだ${n}本を比較してAI分析`:'🤖 選んだ動画をAI分析'}window.togglePick=id=>{state.selected.has(id)?state.selected.delete(id):state.selected.add(id);render()};
function render(){$('results').innerHTML=sorted().map((v,i)=>`<article class="video ${state.selected.has(v.videoId)?'picked':''}"><img class="thumb" src="${esc(v.thumbnail)}"><div class="pick"><input type="checkbox" ${state.selected.has(v.videoId)?'checked':''} onchange="togglePick('${v.videoId}')"><span>この動画を比較対象に選ぶ</span></div><span class="pill">${i+1}位</span><div class="title">${esc(v.title)}</div>${availability(v)}<div class="score">${(+v.viewRatio).toFixed(1)}倍 🔥</div><div class="opp">狙い目度 ${v.opportunityScore}/100</div><div class="stats"><div class="stat">再生<b>${fmt(v.views)}回</b></div><div class="stat">通常中央値<b>${fmt(v.medianViews)}回</b></div></div><button onclick="analyzeOne('${v.videoId}')">${v.transcriptAvailable===true?'🤖 内容まで読んでAI分析':v.transcriptAvailable===false?'📊 データ中心でAI分析':'📖 内容取得を確認してAI分析'}</button><a class="btn secondary" target="_blank" href="${esc(v.url)}">YouTubeで動画を見る</a></article>`).join('');$('resultsCard').classList.remove('hidden');updateSelection()}
$('searchBtn').onclick=async()=>{const value=state.mode==='genre'?$('genre').value:$('theme').value.trim();if(!value)return alert(state.mode==='genre'?'ジャンルを選んでください':'テーマを入力してください');state.theme=value;state.selected.clear();$('searchBtn').disabled=true;setSearch(state.mode==='genre'?`${value}を広めに調査しています…`:'YouTubeを調査しています…');try{const d=await post(SEARCH,{mode:state.mode,theme:value,genre:value,baseCount:+$('base').value,threshold:+$('threshold').value});state.videos=(d.results||[]).map(v=>({...v,opportunityScore:opportunity(v),transcriptAvailable:null}));render();setSearch(state.mode==='genre'?`${value}から${state.videos.length}本を比較しました。気になる動画を自分で選んで比較できます。`:`${state.videos.length}本を比較しました。比較したい動画は自分で複数選べます。`)}catch(e){setSearch('検索できませんでした：'+e.message,'error')}finally{$('searchBtn').disabled=false}};
$('tabOpp').onclick=()=>{state.sort='opp';$('tabOpp').classList.add('active');$('tabRatio').classList.remove('active');render()};$('tabRatio').onclick=()=>{state.sort='ratio';$('tabRatio').classList.add('active');$('tabOpp').classList.remove('active');render()};async function ensureTranscript(v){if(v.transcriptAvailable!==null&&v.transcriptAvailable!==undefined)return v;const tr=await getTranscript(v);v.transcriptAvailable=!!tr.available;v.transcriptError=tr.error||'';if(tr.available)v.transcriptData=tr;return v}async function checkTop(){const top=sorted().slice(0,5);$('checkBtn').disabled=true;for(let i=0;i<top.length;i++){$('checkBtn').textContent=`📖 内容取得を確認中… ${i+1}/${top.length}`;await ensureTranscript(top[i]);render()}$('checkBtn').textContent='✅ 上位5本の確認完了';$('checkBtn').disabled=false;return top}$('checkBtn').onclick=checkTop;
window.analyzeOne=async id=>{const v=state.videos.find(x=>x.videoId===id);$('analysisCard').classList.remove('hidden');$('analysisStatus').classList.remove('hidden');$('analysisStatus').className='status';$('analysisStatus').textContent='動画内容を取得できるか確認しています…';$('analysis').innerHTML='';$('analysisCard').scrollIntoView({behavior:'smooth'});try{await ensureTranscript(v);render();const tr=v.transcriptData||{available:false,error:v.transcriptError};$('analysisStatus').className='status '+(tr.available?'':'warn');$('analysisStatus').textContent=tr.available?'🟢 内容取得済み → 字幕本文までAIが読んで分析中…':'🟡 内容未取得 → タイトル・説明・再生データだけで分析中…';const a=await post(ANALYZE,{action:'single',theme:state.theme,video:v,transcript:tr.available?tr.transcript:''});renderSingle(a,v,tr)}catch(e){$('analysisStatus').className='status error';$('analysisStatus').textContent='AI分析に失敗：'+e.message}};
async function analyzeGroup(group,label){if(group.length<2)return alert('比較したい動画を2本以上選んでください');$('analysisCard').classList.remove('hidden');$('analysis').innerHTML='';$('analysisStatus').classList.remove('hidden');$('analysisStatus').className='status';$('analysisCard').scrollIntoView({behavior:'smooth'});for(let i=0;i<group.length;i++){$('analysisStatus').textContent=`${label}の内容取得を確認中… ${i+1}/${group.length}本`;await ensureTranscript(group[i]);render()}$('analysisStatus').textContent=`${label}を横断分析しています…`;const enriched=group.map(v=>({...v,transcript:v.transcriptData?.transcript||'',transcriptAvailable:!!v.transcriptAvailable}));const a=await post(ANALYZE,{action:'batch',theme:state.theme,videos:enriched});renderBatch(a,enriched)}$('batchBtn').onclick=async()=>{try{await analyzeGroup(sorted().slice(0,5),'上位5本')}catch(e){$('analysisStatus').className='status error';$('analysisStatus').textContent='AI分析に失敗：'+e.message}};$('selectedBtn').onclick=async()=>{const group=state.videos.filter(v=>state.selected.has(v.videoId));try{await analyzeGroup(group,`選んだ${group.length}本`)}catch(e){$('analysisStatus').className='status error';$('analysisStatus').textContent='AI分析に失敗：'+e.message}};$('clearBtn').onclick=()=>{state.selected.clear();render()};
function handoffButton(){return`<div class="card handoff"><b>🎬 次の工程</b><div class="small">この分析結果をそのままYouTube動画作成2へ渡します。</div><button onclick="sendToVideo2()">🚀 この分析を使ってYouTube動画作成2へ</button></div>`}function renderSingle(a,v,tr){$('analysisStatus').className='status '+(tr.available?'':'warn');$('analysisStatus').textContent=tr.available?'🟢 内容取得済み｜字幕本文まで含めてAI分析完了':'🟡 内容未取得｜タイトル・説明・再生データの範囲で分析完了';const content=tr.available?`<div class="contentbox"><h3>📖 実際の動画内容から分析</h3><div class="contentrow"><b>内容要約</b><div>${esc(a.contentSummary||'')}</div></div><div class="contentrow"><b>冒頭のフック</b><div>${esc(a.hook||'')}</div></div><div class="contentrow"><b>展開</b><div>${esc(a.structure||'')}</div></div><div class="contentrow"><b>結論</b><div>${esc(a.ending||'')}</div></div></div>`:`<div class="status warn"><b>🟡 動画内容は未取得</b><br>以下はタイトル・説明・再生データを根拠にした分析です。動画の中身を読んだ分析ではありません。</div>`;const fs=(a.factors||[]).map(x=>`<div class="factor"><b>${esc(x.label)}</b><div class="muted">${esc(x.detail||'')}</div></div>`).join(''),ideas=(a.ideas||[]).map((x,i)=>`<div class="idea"><b>${i+1}. ${esc(x.title)}</b><div class="muted">${esc(x.angle||'')}</div><div>サムネ：<b>${esc(x.thumbnailText||'')}</b></div></div>`).join(''),b=a.bestIdea||a.ideas?.[0]||{};state.brief={title:b.title||v.title,thumbnailText:b.thumbnailText||'',reason:a.summary||'',opening:b.opening||'',outline:b.outline||[],sourceTheme:state.theme,sourceVideo:v.title,contentSummary:a.contentSummary||'',analysisType:'single',contentAcquired:!!tr.available};$('analysis').innerHTML=content+`<div class="status"><b>ヒット要因の結論</b><br>${esc(a.summary||'')}</div>${fs}<h3>新企画10案</h3>${ideas}<div class="card best"><span class="badge">AIおすすめ</span><div class="title">${esc(state.brief.title)}</div><div>サムネ：<b>${esc(state.brief.thumbnailText)}</b></div></div>${handoffButton()}`}
function stars(n){return'★'.repeat(Math.min(5,+n||0))+'☆'.repeat(5-Math.min(5,+n||0))}function renderBatch(a,enriched){const total=enriched.length,got=enriched.filter(x=>x.transcriptAvailable).length;$('analysisStatus').className='status '+(got?'':'warn');$('analysisStatus').textContent=`横断分析完了：${total}本中${got}本は🟢内容取得済み、${total-got}本は🟡内容未取得`;const insights=enriched.map(x=>`<div class="contentrow"><b>${esc(x.title||'')}</b><div>${x.transcriptAvailable?'<span class="content-ok">🟢 内容取得済み</span>':'<span class="content-no">🟡 内容未取得</span>'}</div></div>`).join('');const ideas=(a.ideas||[]).sort((x,y)=>(+y.opportunityScore||0)-(+x.opportunityScore||0)).map((x,i)=>`<div class="idea"><b>${i+1}. ${esc(x.title)}</b><div class="opp">狙い目 ${x.opportunityScore||'-'}/100</div><div>競合 ${stars(x.competition)}　相性 ${stars(x.fit)}</div><div>サムネ：<b>${esc(x.thumbnailText||'')}</b></div></div>`).join(''),b=a.bestIdea||a.ideas?.[0]||{};state.brief={...b,sourceTheme:state.theme,reason:b.reason||a.summary||'',analysisType:'batch',contentAcquiredCount:got,comparedCount:total};$('analysis').innerHTML=`<div class="contentbox"><h3>📖 選んだ${total}本の内容取得状況</h3>${insights}</div><div class="status"><b>共通する勝ちパターン</b><br>${esc(a.summary||'')}</div><h3>次の企画</h3>${ideas}<div class="card best"><span class="badge">🏆 AIおすすめ第1位</span><div class="title">${esc(b.title||'')}</div><div class="opp">狙い目 ${b.opportunityScore||'-'}/100</div><div>サムネ：<b>${esc(b.thumbnailText||'')}</b></div></div>${handoffButton()}`}
window.sendToVideo2=()=>{const b=state.brief||{};if(!b.title)return alert('分析結果がありません');localStorage.setItem('youtubeOutlierProductionBrief',JSON.stringify({...b,createdAt:new Date().toISOString()}));location.href='youtube-video-2.html?v=outlierbridge6'};</script></body></html>
