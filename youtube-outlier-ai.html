<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="外れ値YouTube"><title>外れ値YouTube AI</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7f6;color:#17211b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px 70px}h1{font-size:28px;margin:6px 0}.sub{color:#5b665f;line-height:1.6}.card{background:#fff;border:1px solid #dde5df;border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 4px 18px #0000000a}label{font-weight:700;display:block;margin:8px 0}input,select,textarea{width:100%;font-size:16px;padding:13px;border:1px solid #cbd6ce;border-radius:12px;background:#fff}button{width:100%;border:0;border-radius:13px;padding:14px;font-size:17px;font-weight:800;margin-top:12px;background:#168447;color:white}button.secondary{background:#edf4ef;color:#17663b}.badge{display:inline-block;background:#fff0df;color:#a54d00;padding:6px 9px;border-radius:99px;font-weight:800}.score{font-size:31px;font-weight:900;margin:8px 0}.muted{color:#68736c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f7faf8;border-radius:12px;padding:11px}.metric b{display:block;font-size:19px}.hidden{display:none}.idea{padding:12px 0;border-top:1px solid #e7ece8}.warn{font-size:13px;color:#66726b;line-height:1.55}.hero{background:linear-gradient(135deg,#eaf7ee,#fff)}@media(max-width:480px){h1{font-size:25px}.grid{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><section class="card hero"><span class="badge">🔥 OUTLIER</span><h1>外れ値YouTube AI</h1><p class="sub">「そのチャンネルでは異常に伸びた動画」を見つけ、伸びた構造から次の企画を作ります。丸写しではなく、勝ちパターンを研究します。</p></section><section class="card"><label>調べたいテーマ</label><input id="theme" placeholder="例：伊藤博文、明治時代、太平洋戦争"><div class="grid"><div><label>基準動画数</label><select id="base"><option>20</option><option>10</option><option>30</option></select></div><div><label>表示基準</label><select id="threshold"><option value="3">3倍以上</option><option value="5">5倍以上</option><option value="10">10倍以上</option></select></div></div><button id="search">伸びている動画を探す</button><p class="warn">第1版は分析画面と計算ロジックを先に実装しています。YouTube API接続後は検索結果を自動取得できます。</p></section><section class="card"><h2 style="margin-top:0">手元の動画をすぐ判定</h2><label>この動画の再生数</label><input id="views" type="number" inputmode="numeric" placeholder="例：1870000"><label>そのチャンネル最近の通常再生数（中央値）</label><input id="median" type="number" inputmode="numeric" placeholder="例：100000"><button class="secondary" id="calc">アウトライアー度を計算</button><div id="result" class="hidden"><div class="score" id="score"></div><div class="grid"><div class="metric">判定<b id="rank"></b></div><div class="metric">通常比<b id="ratio"></b></div></div><button id="make">この型から新企画を作る</button></div></section><section id="ideas" class="card hidden"><h2 style="margin-top:0">次の動画企画</h2><div id="ideaList"></div></section></main><script>const $=id=>document.getElementById(id);function n(v){return Number(v||0)}function fmt(v){return new Intl.NumberFormat('ja-JP').format(Math.round(v))}function classify(r){if(r>=10)return['超アウトライアー 🔥🔥🔥','10倍超'];if(r>=5)return['強いアウトライアー 🔥🔥','5倍超'];if(r>=3)return['アウトライアー 🔥','3倍超'];if(r>=1.5)return['やや強い','1.5倍超'];return['通常範囲','通常']}function calculate(){const v=n($('views').value),m=n($('median').value);if(!v||!m){alert('再生数と通常再生数を入力してください');return}const r=v/m,[rank]=classify(r);$('score').textContent=r.toFixed(1)+'倍';$('rank').textContent=rank;$('ratio').textContent='+'+fmt(v-m)+'回';$('result').classList.remove('hidden')}function ideas(){const t=$('theme').value.trim()||'このテーマ';const patterns=[['知られざる転換点',`${t}で「実はここが歴史を変えた」という一点に絞る`],['人物の意外な一面',`${t}の有名人物について一般的イメージと違う一面を扱う`],['もし○○がなかったら',`${t}の重要事件を反実仮想から理解する`],['対立で見せる',`${t}を二人・二勢力の対立構造で整理する`],['一枚の史料から',`${t}に関する写真・文書・地図一枚を入口に物語を展開する`]];$('ideaList').innerHTML=patterns.map((x,i)=>`<div class="idea"><b>${i+1}. ${x[0]}</b><div class="muted">${x[1]}</div></div>`).join('');$('ideas').classList.remove('hidden');$('ideas').scrollIntoView({behavior:'smooth'})}$('calc').onclick=calculate;$('make').onclick=ideas;$('search').onclick=()=>{const t=$('theme').value.trim();if(!t){alert('調べたいテーマを入力してください');return}alert('検索条件を保存しました。次の接続段階でYouTube APIから「通常比3倍以上」の動画を自動収集します。\n\nテーマ：'+t)};</script></body></html>
