<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="外れ値YouTube"><title>外れ値YouTube AI</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f5;color:#17211b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:780px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 14px calc(80px + env(safe-area-inset-bottom))}h1{font-size:27px;margin:7px 0}h2{font-size:20px;margin:0 0 10px}.sub,.muted{color:#66716a;line-height:1.55}.card{background:#fff;border:1px solid #dfe7e1;border-radius:18px;padding:15px;margin:13px 0;box-shadow:0 4px 18px #00000009}.hero{background:linear-gradient(135deg,#e8f6ec,#fff)}.badge,.pill{display:inline-block;border-radius:999px;font-weight:800}.badge{background:#fff0dc;color:#9b4c00;padding:6px 10px}.pill{font-size:12px;padding:4px 8px;background:#eef4f0;color:#365944}label{display:block;font-weight:750;margin:9px 0 6px}input,select{width:100%;font-size:16px;padding:12px;border:1px solid #cad6cd;border-radius:11px;background:white}button,a.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:800;text-align:center;text-decoration:none;margin-top:10px;background:#168447;color:white;cursor:pointer}button:disabled{opacity:.55}.secondary{background:#edf5ef!important;color:#17683b!important}.dark{background:#17251d!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.hidden{display:none}.status{padding:11px;border-radius:11px;background:#f5f8f6;font-size:14px;line-height:1.5;margin-top:10px}.video{border-top:1px solid #e6ece8;padding:14px 0}.video:first-child{border-top:0;padding-top:0}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:#eee}.title{font-size:17px;font-weight:850;line-height:1.45;margin:7px 0}.score{font-size:28px;font-weight:950;color:#c65b00}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.stat{background:#f6f9f7;border-radius:10px;padding:8px;font-size:12px;color:#65716a}.stat b{display:block;color:#18231c;font-size:16px;margin-top:2px}.factor,.idea{padding:11px 0;border-top:1px solid #e5ebe7}.factor:first-child,.idea:first-child{border-top:0}.loading:after{content:' …';animation:dots 1s infinite}@keyframes dots{0%{content:' .'}50%{content:' ..'}100%{content:' ...'}}.error{background:#fff2f0;color:#8d2d22}.ok{background:#eef8f1;color:#28623b}.best{border:2px solid #36a265;background:#f2fbf5}.small{font-size:13px}.bar{height:8px;background:#e8eee9;border-radius:20px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:#e57b21;max-width:100%}@media(max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:24px}}
</style></head><body><main class="wrap">
<section class="card hero"><span class="badge">🔥 OUTLIER</span><h1>外れ値YouTube AI</h1><p class="sub">人気動画そのものを真似せず、<b>そのチャンネルの通常より異常に伸びた動画</b>を見つけ、伸びた構造を次の企画へ転用します。</p></section>
<section class="card"><h2>① 外れ値動画を探す</h2><label>調べたいテーマ</label><input id="theme" placeholder="例：伊藤博文、明治時代、太平洋戦争"><div class="grid"><div><label>通常値の基準</label><select id="base"><option value="20">直近20本</option><option value="10">直近10本</option><option value="30">直近30本</option></select></div><div><label>外れ値判定</label><select id="threshold"><option value="3">3倍以上</option><option value="5">5倍以上</option><option value="10">10倍以上</option></select></div></div><button id="searchBtn">🔥 YouTubeから外れ値を自動発見</button><div id="searchStatus" class="status hidden"></div><p class="small muted">短い動画と通常動画はできるだけ分けて比較し、各チャンネル直近動画の<b>中央値</b>を通常値として使います。</p></section>
<section id="resultsCard" class="card hidden"><h2>② 外れ値ランキング</h2><div id="summary" class="status ok"></div><div id="results"></div></section>
<section id="analysisCard" class="card hidden"><h2>③ AIが「なぜ伸びた？」を分解</h2><div id="analysisTarget"></div><div id="analysisStatus" class="status hidden"></div><div id="analysis"></div></section>
<section class="card"><details><summary><b>手元の数字だけで判定する</b></summary><label>動画の再生数</label><input id="views" type="number" inputmode="numeric" placeholder="例：1870000"><label>チャンネル通常再生数（中央値）</label><input id="median" type="number" inputmode="numeric" placeholder="例：100000"><button class="secondary" id="calcBtn">アウトライアー度を計算</button><div id="manualResult" class="status hidden"></div></details></section>
</main><script>
const SEARCH='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/youtube-outlier-search';
const ANALYZE='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/youtube-outlier-analyze';
const $=id=>document.getElementById(id), fmt=n=>new Intl.NumberFormat('ja-JP').format(Math.round(Number(n)||0));
let state={theme:'',videos:[],selected:null};
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function rank(r){return r>=10?'超アウトライアー 🔥🔥🔥':r>=5?'強いアウトライアー 🔥🔥':r>=3?'アウトライアー 🔥':r>=1.5?'やや強い':'通常範囲'}
function duration(s){s=Number(s)||0;const m=Math.floor(s/60),x=Math.round(s%60);return `${m}:${String(x).padStart(2,'0')}`}
async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d;try{d=await r.json()}catch{d={error:'応答を読み取れませんでした'}}if(!r.ok)throw Object.assign(new Error(d.error||'処理に失敗しました'),{data:d});return d}
function setStatus(el,msg,type=''){el.className='status '+type;el.textContent=msg;el.classList.remove('hidden')}
$('searchBtn').onclick=async()=>{const theme=$('theme').value.trim();if(!theme){alert('調べたいテーマを入力してください');return}state.theme=theme;$('searchBtn').disabled=true;$('searchBtn').textContent='YouTubeを調査中';setStatus($('searchStatus'),'関連動画を探し、各チャンネルの直近動画と比較しています…');$('searchStatus').classList.add('loading');$('resultsCard').classList.add('hidden');$('analysisCard').classList.add('hidden');try{const d=await post(SEARCH,{action:'search',theme,baseCount:+$('base').value,threshold:+$('threshold').value});state.videos=d.results||[];renderResults(d)}catch(e){const hint=e.data?.hint?'\n'+e.data.hint:'';setStatus($('searchStatus'),'検索できませんでした：'+e.message+hint,'error')}finally{$('searchStatus').classList.remove('loading');$('searchBtn').disabled=false;$('searchBtn').textContent='🔥 YouTubeから外れ値を自動発見'}};
function renderResults(d){const all=d.results||[],outs=d.outliers||[];setStatus($('searchStatus'),`${all.length}本を比較しました。外れ値は${outs.length}本です。`,'ok');$('summary').innerHTML=`<b>${esc(d.theme)}</b>：通常比 ${d.threshold}倍以上を外れ値として表示。上位ほど「そのチャンネルでは珍しく跳ねた」動画です。`;$('results').innerHTML=all.map((v,i)=>`<article class="video"><img class="thumb" src="${esc(v.thumbnail)}" alt=""><div><span class="pill">${i+1}位</span> <span class="pill">${duration(v.durationSeconds)}</span></div><div class="title">${esc(v.title)}</div><div class="muted small">${esc(v.channelTitle)} ・ ${String(v.publishedAt||'').slice(0,10)}</div><div class="score">${Number(v.viewRatio).toFixed(1)}倍 ${Number(v.viewRatio)>=3?'🔥':''}</div><div class="bar"><i style="width:${Math.min(100,Number(v.viewRatio)*10)}%"></i></div><div class="stats"><div class="stat">この動画<b>${fmt(v.views)}回</b></div><div class="stat">通常中央値<b>${fmt(v.medianViews)}回</b></div><div class="stat">登録者<b>${fmt(v.subscriberCount)}</b></div><div class="stat">判定<b>${rank(v.viewRatio)}</b></div></div><button onclick="analyze(${i})">🤖 この外れ値をAI分析</button><a class="btn secondary" target="_blank" href="${esc(v.url)}">YouTubeで動画を見る</a></article>`).join('')||'<p class="muted">比較できる動画がありませんでした。</p>';$('resultsCard').classList.remove('hidden');$('resultsCard').scrollIntoView({behavior:'smooth'})}
window.analyze=async i=>{const v=state.videos[i];state.selected=v;$('analysisCard').classList.remove('hidden');$('analysisTarget').innerHTML=`<div class="title">${esc(v.title)}</div><div class="score">通常の ${Number(v.viewRatio).toFixed(1)}倍</div>`;$('analysis').innerHTML='';setStatus($('analysisStatus'),'動画本体も参考にしながら、伸びた要因と次の企画を作っています…');$('analysisStatus').classList.add('loading');$('analysisCard').scrollIntoView({behavior:'smooth'});try{const a=await post(ANALYZE,{theme:state.theme,video:v});renderAnalysis(a)}catch(e){setStatus($('analysisStatus'),'AI分析に失敗しました：'+e.message,'error')}finally{$('analysisStatus').classList.remove('loading')}};
function renderAnalysis(a){setStatus($('analysisStatus'),'AI分析が完了しました。','ok');const factors=(a.factors||[]).map(x=>`<div class="factor"><b>${esc(x.label)} <span class="pill">確度 ${esc(x.confidence||'')}</span></b><div class="muted">${esc(x.detail)}</div></div>`).join('');const ideas=(a.ideas||[]).map((x,i)=>`<div class="idea"><b>${i+1}. ${esc(x.title)}</b><div class="muted">切り口：${esc(x.angle)}</div><div>サムネ：<b>${esc(x.thumbnailText)}</b></div><div class="small">冒頭：${esc(x.opening)}</div></div>`).join('');const best=a.bestIdea||{};$('analysis').innerHTML=`<div class="status"><b>結論</b><br>${esc(a.summary||'')}</div><h3>伸びた可能性がある要因</h3>${factors}<div class="grid"><div class="status"><b>タイトルの型</b><br>${esc(a.titlePattern||'')}</div><div class="status"><b>サムネの型</b><br>${esc(a.thumbnailPattern||'')}</div></div><div class="status"><b>冒頭の型</b><br>${esc(a.hookPattern||'')}</div><h3>この構造から作る新企画10案</h3>${ideas}<div class="card best"><span class="badge">AI最有力</span><div class="title">${esc(best.title||'')}</div><div>サムネ文言：<b>${esc(best.thumbnailText||'')}</b></div>${(best.outline||[]).map((x,i)=>`<div class="small">${i+1}. ${esc(x)}</div>`).join('')}<button class="dark" onclick="copyBest()">この企画をコピー</button><a class="btn" target="_blank" href="youtube-presentation-studio.html?v=outlier1">🎬 プレゼン動画スタジオを開く</a></div>`;state.best=best}
window.copyBest=async()=>{const b=state.best||{};const text=`テーマ: ${b.title||''}\nサムネ: ${b.thumbnailText||''}\n構成:\n${(b.outline||[]).map((x,i)=>`${i+1}. ${x}`).join('\n')}`;try{await navigator.clipboard.writeText(text);alert('最有力企画をコピーしました')}catch{alert(text)}};
$('calcBtn').onclick=()=>{const v=+$('views').value,m=+$('median').value;if(!v||!m){alert('2つの数字を入力してください');return}const r=v/m;$('manualResult').innerHTML=`<b>${r.toFixed(1)}倍　${rank(r)}</b><br>通常より ${fmt(v-m)}回 多い再生数です。`;$('manualResult').classList.remove('hidden')};
</script></body></html>
