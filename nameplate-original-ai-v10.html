<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>銘板原稿AI｜テスト版21</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#172231;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif}header{background:#17324d;color:#fff;padding:18px}main{max-width:1080px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid input,.grid select{width:100%;padding:11px;font-size:16px}.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:9px;padding:13px 18px;font-size:16px;font-weight:800;color:#fff;background:#17324d}.secondary{background:#657483}.note{color:#657483;line-height:1.6}.stage{padding:22px;background:#eef1f4;border-radius:12px;text-align:center;overflow:auto}.art{display:inline-block;background:#fff;padding:18px}.art svg{display:block;width:min(82vw,720px);height:auto}.ok,.warn{padding:12px;border-radius:9px;margin-top:12px}.ok{background:#eaf7ee}.warn{background:#fff4c7}.readback{background:#f7f9fb;padding:14px;border-radius:10px;line-height:1.8}@media(max-width:650px){.grid{grid-template-columns:1fr}.btns button{flex:1 1 45%}}</style></head><body><header><b>銘板原稿AI　テスト版21・ChatGPT自然読取方式</b></header><main><div class="card"><h2>1. 客先図面</h2><input id="file" type="file" accept="image/*,.pdf"><div class="btns"><button id="readBtn">ChatGPTのように図面を読む</button></div><div id="status" class="note">客先の元PDF推奨。図面全体の意味を理解して、完成銘板だけを読みます。</div></div><div class="card hidden" id="readCard"><h2>2. AIが理解した完成銘板</h2><div id="readback" class="readback"></div><div class="grid"><label>会社名<input id="company"></label><label>NP番号<input id="drawing"></label><label>注文数<input id="qty" type="number"></label><label>合格年月<input id="date"></label></div><div class="btns"><button id="proofBtn">3. この内容で校正図面を作る</button></div></div><div class="card hidden" id="proofCard"><h2>3. 校正用銘板原稿</h2><p class="note">AIは「読む」担当。四角い板・R・穴・文字配置はプログラムが機械的に描きます。寸法不明の穴は推測しません。</p><div class="stage"><div class="art" id="proofArt"></div></div><div class="btns"><button id="svgBtn">Illustrator用SVGを保存</button><button id="printBtn">校正PDFを保存・印刷</button><button class="secondary" id="editBtn">寸法を修正</button></div><div id="proofStatus"></div><div class="grid hidden" id="edit"><label>幅mm<input id="pW"></label><label>高さmm<input id="pH"></label></div><div class="btns hidden" id="editBtns"><button id="rerender">校正図を更新</button></div></div></main><script>const U='https://emauqxftmauvsffdjvyh.supabase.co',K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhc2UiLCJyZWYiOiJlbWF1cXhmdG1hdXZzZmZkanZ5aCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzg2ODY4NDc5LCJleHAiOjIxMDI0NDQ0Nzl9.iN2xz71VCeP7o6nz89v0wJMrUYkGyPKATtWaCl-MIO4',$=x=>document.getElementById(x),c=x=>(x==null?'':String(x).trim()),H=()=>({'Content-Type':'application/json',apikey:K,Authorization:'Bearer '+K});let ai={},svg='';function du(f){return new Promise((a,b)=>{let r=new FileReader;r.onload=()=>a(r.result);r.onerror=b;r.readAsDataURL(f)})}function esc(s){return c(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function set(id,v){$(id).value=c(v)}function rows(){return Array.isArray(ai.layout?.rows)?ai.layout.rows:[]}function holes(){return Array.isArray(ai.hole_positions)?ai.hole_positions.filter(q=>isFinite(+q.x_mm)&&isFinite(+q.y_mm)):[]}async function read(){let f=$('file').files[0];if(!f)return alert('図面を選択してください');$('readBtn').disabled=true;$('status').textContent='図面全体を理解中…「何が銘板に入る内容か」を判断しています。';try{let d=await du(f),r=await fetch(U+'/functions/v1/read-nameplate-drawing',{method:'POST',headers:H(),body:JSON.stringify({data:d,type:f.type,name:f.name})}),j=await r.json();if(!r.ok||j.error)throw Error(j.error||'読取失敗');ai=j.result||{};set('company',ai.company);set('drawing',ai.drawing_no);set('date',ai.approval_date);let rr=rows(),lines=rr.map(x=>esc(x.text||[x.label,x.value].filter(Boolean).join('　'))).filter(Boolean);$('readback').innerHTML='<b>外形：</b>'+esc(ai.width_mm||'?')+' × '+esc(ai.height_mm||'?')+' mm　 <b>R：</b>'+esc(ai.radius||'不明')+'<br><b>穴：</b>'+esc(ai.hole_diameter_mm||'?')+'φ × '+esc(ai.hole_count||'?')+'ヶ　確定座標 '+holes().length+'ヶ<br><b>地色／文字：</b>'+esc(ai.ground_color||'不明')+' ／ '+esc(ai.text_line_color||'不明')+'<hr><b>完成銘板に入る文字</b><br>'+lines.join('<br>');$('readCard').classList.remove('hidden');$('status').textContent='読取完了。まずこの「AIが理解した内容」が人間の見方と合っているか確認してください。';$('readCard').scrollIntoView({behavior:'smooth'})}catch(e){$('status').textContent='エラー：'+e.message}finally{$('readBtn').disabled=false}}function colors(){let bg=/黒/.test(c(ai.ground_color))?'#111':'#fff',fg=/黄/.test(c(ai.text_line_color))?'#e6c934':bg==='#111'?'#fff':'#111';return{bg,fg}}function build(){let w=+$('pW').value||+ai.width_mm||100,h=+$('pH').value||+ai.height_mm||50,z=colors(),rad=+ai.plate?.corner_radius_mm||0,body='<rect x=".2" y=".2" width="'+(w-.4)+'" height="'+(h-.4)+'" rx="'+rad+'" fill="'+z.bg+'" stroke="#555" stroke-width=".4"/>';let rr=rows(),n=rr.length;if(n){let top=h*.16,bottom=h*.84,step=n>1?(bottom-top)/(n-1):0;rr.forEach((r,i)=>{let y=isFinite(+r.y_pct)?(+r.y_pct*h/100):(n===1?h/2:top+i*step),fs=isFinite(+r.font_pct)?Math.max(1,+r.font_pct*h/100):Math.max(1.8,Math.min(h*.065,w*.035));if((ai.layout?.columns||1)===2&&(c(r.label)||c(r.value))){let lx=isFinite(+r.label_x_pct)?+r.label_x_pct*w/100:w*.18,vx=isFinite(+r.value_x_pct)?+r.value_x_pct*w/100:w*.42;body+='<text x="'+lx+'" y="'+y+'" fill="'+z.fg+'" font-size="'+fs+'" font-family="Yu Gothic,Arial" text-anchor="start" dominant-baseline="middle">'+esc(r.label)+'</text><text x="'+vx+'" y="'+y+'" fill="'+z.fg+'" font-size="'+fs+'" font-family="Yu Gothic,Arial" text-anchor="start" dominant-baseline="middle">'+esc(r.value)+'</text>'}else{let t=c(r.text)||[r.label,r.value].filter(Boolean).join('　');body+='<text x="'+w/2+'" y="'+y+'" fill="'+z.fg+'" font-size="'+fs+'" font-family="Yu Gothic,Arial" text-anchor="middle" dominant-baseline="middle">'+esc(t)+'</text>'}})}(Array.isArray(ai.visual_elements)?ai.visual_elements:[]).forEach(e=>{if(!['line','rect','logo','mark'].includes(e.type))return;let x=(+e.x_pct||50)*w/100,y=(+e.y_pct||50)*h/100,ww=(+e.w_pct||0)*w/100,hh=(+e.h_pct||0)*h/100;if(e.type==='line')body+=e.orientation==='vertical'?'<line x1="'+x+'" y1="'+(y-hh/2)+'" x2="'+x+'" y2="'+(y+hh/2)+'" stroke="'+z.fg+'" stroke-width=".25"/>':'<line x1="'+(x-ww/2)+'" y1="'+y+'" x2="'+(x+ww/2)+'" y2="'+y+'" stroke="'+z.fg+'" stroke-width=".25"/>';else if(e.type==='rect')body+='<rect x="'+(x-ww/2)+'" y="'+(y-hh/2)+'" width="'+ww+'" height="'+hh+'" fill="none" stroke="'+z.fg+'" stroke-width=".25"/>';else if(c(e.text))body+='<text x="'+x+'" y="'+y+'" fill="'+z.fg+'" font-size="'+Math.max(1,(+e.font_pct||5)*h/100)+'" font-family="Yu Gothic,Arial" text-anchor="middle">'+esc(e.text)+'</text>'});let d=+ai.hole_diameter_mm||0;holes().forEach(q=>body+='<circle cx="'+q.x_mm+'" cy="'+q.y_mm+'" r="'+d/2+'" fill="#fff" stroke="#555" stroke-width=".3"/>');svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'mm" height="'+h+'mm" viewBox="0 0 '+w+' '+h+'">'+body+'</svg>';return svg}function proof(){set('pW',ai.width_mm||100);set('pH',ai.height_mm||50);$('proofCard').classList.remove('hidden');render();$('proofCard').scrollIntoView({behavior:'smooth'})}function render(){$('proofArt').innerHTML=build();let ok=rows().length>0;$('proofStatus').className=ok?'ok':'warn';$('proofStatus').innerHTML=ok?'<b>標準銘板方式：</b>AIが読んだ '+rows().length+' 行を、外形寸法上にプログラムで配置。穴は確定座標のみ '+holes().length+'ヶ配置。':'<b>要確認：</b>完成銘板の文字行を確定できませんでした。勝手に文字を作りません。'}function save(){let a=document.createElement('a'),b=new Blob([build()],{type:'image/svg+xml'});a.href=URL.createObjectURL(b);a.download=(c($('drawing').value)||'nameplate')+'.svg';a.click()}function printP(){let p=window.open('','_blank');p.document.write('<meta charset="utf-8"><style>@page{size:A4 landscape;margin:10mm}body{height:190mm;margin:0;display:flex;align-items:center;justify-content:center}svg{max-width:250mm;max-height:170mm}</style>'+build()+'<script>setTimeout(()=>print(),300)<\/script>');p.document.close()}$('readBtn').onclick=read;$('proofBtn').onclick=proof;$('svgBtn').onclick=save;$('printBtn').onclick=printP;$('editBtn').onclick=()=>{$('edit').classList.remove('hidden');$('editBtns').classList.remove('hidden')};$('rerender').onclick=render;</script></body></html>
