<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>銘板原稿AI｜テスト版15</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#172231;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif}header{background:#17324d;color:#fff;padding:18px}main{max-width:1080px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px #0001}.hidden{display:none!important}h2{margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid label{font-size:13px;font-weight:700}.grid input,.grid select{width:100%;padding:11px;border:1px solid #cbd3da;border-radius:8px;margin-top:4px;font-size:16px;background:#fff}.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:9px;padding:13px 18px;font-size:16px;font-weight:800;color:#fff;background:#17324d}.secondary{background:#657483}.note{font-size:13px;color:#657483;line-height:1.6}.ok,.warn,.coords{padding:12px;border-radius:9px;margin-top:12px;line-height:1.65}.ok{background:#eaf7ee;border:1px solid #77bd89}.warn{background:#fff4c7;border:1px solid #e0b93e}.coords{background:#f7f9fb}.sheet-scroll{overflow-x:auto;background:#e9edf1;padding:10px;border-radius:10px}.sheet{width:277mm;min-width:277mm;height:190mm;margin:auto;background:#fff;color:#111;padding:4mm}.sheet-title{text-align:center;font-size:20px;font-weight:800;margin-bottom:3mm}.sheet-table{width:100%;height:174mm;border-collapse:collapse;table-layout:fixed;font-size:12px}.sheet-table th,.sheet-table td{border:1px solid #111;padding:1.4mm;vertical-align:top}.sheet-table th{text-align:center;vertical-align:middle}.field{width:100%;border:0;padding:1mm;background:transparent;font:800 15px/1.25 "Yu Gothic";min-height:8mm}.field.small{font-size:13px}.field.attention{background:#fff3a6!important;outline:2px solid #e0a800;outline-offset:-2px}.mini{font-size:10px;font-weight:700}.line{height:8mm;border-bottom:1px solid #777}.stack{display:grid;gap:1mm}.row1{height:25mm}.row2{height:45mm}.row3{height:34mm}.row4{height:28mm}.proof-hero{text-align:center}.stage{margin-top:12px;padding:22px;background:#eef1f4;border-radius:12px;text-align:center;overflow:auto}.art{display:inline-block;background:#fff;padding:18px;box-shadow:0 2px 12px #0002}.art svg{display:block;width:min(72vw,560px);height:auto}.proof-actions{justify-content:center}.edit-panel{margin-top:14px;padding:14px;border:1px solid #d7dee5;border-radius:10px;background:#fafbfc}.proof-summary{text-align:left;margin-top:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}.sheet-scroll{margin-left:-18px;margin-right:-18px;border-radius:0}.art svg{width:min(78vw,520px)}.proof-actions button{flex:1 1 46%}}@page{size:A4 landscape;margin:10mm}@media print{body{background:#fff}header,main>.card{display:none!important}main{padding:0}.card#printCard{display:block!important;box-shadow:none!important;padding:0!important}.card#printCard h2,.card#printCard>.btns,.card#printCard>.note{display:none!important}.sheet-scroll{padding:0;background:#fff;overflow:visible}.sheet{width:277mm!important;min-width:277mm!important;height:190mm!important;padding:0!important}.field.attention{background:transparent!important;outline:0!important}}</style></head><body><header><b>銘板原稿AI　テスト版15</b></header><main><div class="card"><h2>1. 客先図面</h2><input id="file" type="file" accept="image/*,.pdf"><div class="btns"><button id="readBtn">AIで図面を読み取る</button></div><div id="status" class="note">図面を選んでください。</div></div><div class="card hidden" id="editCard"><h2>2. 社内指示を確認</h2><div class="grid"><label>会社名<input id="company"></label><label>NP番号<input id="drawing"></label><label>注文数<input id="qty" type="number"></label><label>合格年月<input id="date"></label></div><div class="btns"><button id="sheetBtn">3. 社内製作指示書を作る</button></div><div id="warnings" class="note"></div></div><div class="card hidden" id="printCard"><h2>3. 社内製作指示書</h2><div class="sheet-scroll"><section class="sheet"><div class="sheet-title">銘板　社内製作指示書</div><table class="sheet-table"><tr><th>会社名・NP番号</th><th>注文数</th><th>材料</th><th>製作方法</th><th>色</th><th>加工</th><th>備考</th></tr><tr class="row2"><td><input class="field" id="fCompany"><input class="field" id="fDrawing"></td><td><input class="field" id="fQty"></td><td><select class="field choice" id="fMaterial"><option></option><option>ステンレス</option><option>アルミ</option><option>真鍮</option><option>その他</option></select><input class="field small" id="fThick"></td><td><select class="field choice" id="fMethod"><option></option><option>エッチング</option><option>シルク</option><option>アルマイト</option><option>その他</option></select></td><td><input class="field small" id="fGround"><input class="field small" id="fInk"></td><td><select class="field choice" id="fProcess"><option></option><option>保護テープ</option><option>ニス</option><option>接着剤</option><option>その他</option></select></td><td><div class="mini">R</div><select class="field small choice" id="fRadius"><option></option><option>Rなし</option><option>Rあり</option></select><div class="mini">穴径・穴数</div><input class="field small" id="fHole"><div class="mini">穴位置</div><input class="field small" id="fHolePos"><div class="mini">サイズ</div><input class="field small" id="fSize"></td></tr><tr><th>品名</th><th>合格番号</th><th>合格年月</th><th>版区分</th><th>校正</th><th>データ</th><th>製作・検査メモ</th></tr><tr class="row3"><td><input class="field" id="fName"></td><td><input class="field" id="fNumber"></td><td><input class="field" id="fDate"></td><td><select class="field choice"><option></option><option>新版</option><option>改版</option></select></td><td><select class="field choice"><option></option><option>有</option><option>無</option></select></td><td><select class="field choice"><option></option><option>有</option><option>無</option></select></td><td></td></tr></table></section></div><div class="btns"><button id="printBtn">A4横でPDF保存・印刷</button><button id="proofBtn">4. 校正用銘板原稿へ進む</button></div><p class="note">黄色は人が判断する項目です。印刷時は黄色を消します。</p></div><div class="card hidden" id="proofCard"><h2>4. 校正用銘板原稿</h2><p class="note">表示文字は客先原稿を再現します。一方、穴・罫線の製作用座標は数値寸法が明記されたものだけ確定します。</p><div class="proof-hero"><div class="stage"><div class="art" id="proofArt"></div></div><div class="btns proof-actions"><button id="svgBtn">Illustrator用SVGを保存</button><button id="proofPrintBtn">校正PDFを保存・印刷</button><button class="secondary" id="editProofBtn">内容を修正</button></div></div><div class="edit-panel hidden" id="proofEditPanel"><div class="grid"><label>幅<input id="pW"></label><label>高さ<input id="pH"></label><label>1行目<input id="pLine1"></label><label>2行目<input id="pLine2"></label><label>会社名<input id="pCompany"></label><label>NP番号<input id="pDrawing"></label></div><div class="btns"><button id="renderProofBtn">修正を原稿へ反映</button></div></div><div class="proof-summary"><div id="textStatus"></div><div id="holeStatus"></div><div id="lineStatus"></div><div id="coordList" class="coords hidden"></div></div></div></main><script>const U='https://emauqxftmauvsffdjvyh.supabase.co',K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtYXVxeGZ0bWF1dnNmZmRqdnloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4Njg0NzksImV4cCI6MjEwMjQ0NDQ3OX0.iN2xz71VCeP7o6nz89v0wJMrUYkGyPKATtWaCl-MIO4',$=x=>document.getElementById(x),c=x=>(x==null?'':String(x).trim()),H=()=>({'Content-Type':'application/json',apikey:K,Authorization:'Bearer '+K});let ai={},currentSvg='';function du(f){return new Promise((a,b)=>{let r=new FileReader;r.onload=()=>a(r.result);r.onerror=b;r.readAsDataURL(f)})}function esc(s){return c(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function set(id,v){if($(id))$(id).value=c(v)}function holes(){return(Array.isArray(ai.hole_positions)?ai.hole_positions:[])}function rules(){return(Array.isArray(ai.rule_lines)?ai.rule_lines:[])}function mark(){document.querySelectorAll('.choice').forEach(s=>s.classList.toggle('attention',!c(s.value)))}document.addEventListener('change',mark);async function read(){let f=$('file').files[0];if(!f)return alert('図面を選択してください');$('readBtn').disabled=true;$('status').textContent='AI解析中…';try{let r=await fetch(U+'/functions/v1/read-nameplate-drawing',{method:'POST',headers:H(),body:JSON.stringify({data:await du(f),type:f.type,name:f.name})}),j=await r.json();if(!r.ok||j.error)throw Error(j.error||'読取失敗');ai=j.result||{};set('company',ai.company);set('drawing',ai.drawing_no);set('date',ai.approval_date);$('warnings').textContent=(ai.warnings||[]).join(' ／ ');$('editCard').classList.remove('hidden');$('status').textContent='読取完了。外形・穴径/穴数・表示文字を取得。穴位置は明示寸法がある場合のみ確定。';$('editCard').scrollIntoView({behavior:'smooth'})}catch(e){$('status').textContent='エラー：'+e.message}finally{$('readBtn').disabled=false}}function fillSheet(){set('fCompany',$('company').value);set('fDrawing',$('drawing').value);set('fQty',$('qty').value);set('fThick',ai.thickness_mm?ai.thickness_mm+'t':'');set('fGround',ai.ground_color);set('fInk',ai.text_line_color);set('fHole',(ai.hole_diameter_mm&&ai.hole_count)?ai.hole_diameter_mm+'φ-'+ai.hole_count+'ヶ':'');set('fHolePos',holes().length?holes().map((q,i)=>(i+1)+':X'+q.x_mm+' Y'+q.y_mm).join(' / '):'寸法記載なし・要確認');set('fSize',(ai.width_mm&&ai.height_mm)?ai.width_mm+'×'+ai.height_mm+'mm':'');set('fName',ai.name);set('fNumber',c(ai.approval_number).replace(/^第/,'').replace(/号$/,''));set('fDate',$('date').value);if(ai.radius==='Rなし')$('fRadius').value='Rなし';mark();$('printCard').classList.remove('hidden');$('printCard').scrollIntoView({behavior:'smooth'})}function colors(){let g=c(ai.ground_color),i=c(ai.text_line_color),bg=/黒/.test(g)?'#111':'#fff',fg=/黄/.test(i)?'#f3d34a':(bg==='#111'?'#fff':'#111');return{bg,fg}}function renderProof(){let w=+$('pW').value||20,h=+$('pH').value||20,cl=colors(),fs=Math.max(1.2,Math.min(w,h)*.12),sh='';/* Production geometry only: no guessed holes or lines. */holes().forEach(q=>{let d=+ai.hole_diameter_mm||0;if(d)sh+='<circle cx="'+q.x_mm+'" cy="'+q.y_mm+'" r="'+d/2+'" fill="'+cl.bg+'" stroke="'+cl.fg+'" stroke-width=".25"/>'});rules().forEach(q=>{let p=+q.position_mm,s=Number.isFinite(+q.start_mm)?+q.start_mm:0,e=Number.isFinite(+q.end_mm)?+q.end_mm:(q.orientation==='horizontal'?w:h);sh+=q.orientation==='horizontal'?'<line x1="'+s+'" y1="'+p+'" x2="'+e+'" y2="'+p+'" stroke="'+cl.fg+'" stroke-width=".25"/>':'<line x1="'+p+'" y1="'+s+'" x2="'+p+'" y2="'+e+'" stroke="'+cl.fg+'" stroke-width=".25"/>'});currentSvg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'mm" height="'+h+'mm" viewBox="0 0 '+w+' '+h+'"><rect x=".15" y=".15" width="'+(w-.3)+'" height="'+(h-.3)+'" fill="'+cl.bg+'" stroke="#777" stroke-width=".3"/>'+sh+'<text x="'+w/2+'" y="'+h*.16+'" text-anchor="middle" dominant-baseline="middle" fill="'+cl.fg+'" font-family="Yu Gothic" font-size="'+fs+'" font-weight="700">'+esc($('pLine1').value)+'</text><text x="'+w/2+'" y="'+h*.34+'" text-anchor="middle" dominant-baseline="middle" fill="'+cl.fg+'" font-family="Yu Gothic" font-size="'+fs+'" font-weight="700">'+esc($('pLine2').value)+'</text><text x="'+w/2+'" y="'+h*.68+'" text-anchor="middle" fill="'+cl.fg+'" font-family="Yu Gothic" font-size="'+Math.max(1,fs*.65)+'" font-weight="700">'+esc($('pCompany').value)+'</text><text x="'+(w-.7)+'" y="'+(h-.7)+'" text-anchor="end" fill="'+cl.fg+'" font-family="Arial" font-size="'+Math.max(.7,fs*.45)+'">'+esc($('pDrawing').value)+'</text></svg>';$('proofArt').innerHTML=currentSvg;$('textStatus').className='ok';$('textStatus').innerHTML='<b>表示文字：</b>客先原稿で読めた文字を使用。補完はしていません。';$('holeStatus').className=holes().length?'ok':'warn';$('holeStatus').innerHTML=holes().length?'<b>穴位置確定：</b>明示寸法から'+holes().length+'ヶを配置。':'<b>穴径・穴数は取得／穴位置は未確定：</b>位置寸法が無いためSVGへ穴を推測配置していません。';$('lineStatus').className=rules().length?'ok':'warn';$('lineStatus').innerHTML=rules().length?'<b>製品罫線位置確定：</b>数値寸法から配置。':'<b>罫線位置は未確定：</b>見た目に罫線があっても、位置寸法が無ければ製作用SVGへ推測配置しません。';let a=holes().map((q,i)=>'穴'+(i+1)+'：X='+q.x_mm+' / Y='+q.y_mm+'　根拠：'+esc(q.source||''));$('coordList').classList.toggle('hidden',!a.length);$('coordList').innerHTML=a.join('<br>')}function openProof(){let t=Array.isArray(ai.display_text_lines)?ai.display_text_lines.filter(Boolean):(Array.isArray(ai.text_lines)?ai.text_lines.filter(Boolean):[]);set('pW',ai.width_mm||20);set('pH',ai.height_mm||20);set('pLine1',t[0]||'');set('pLine2',t[1]||'');let companyLine=t.slice(2).find(x=>/坂本|株式会社|製作所/.test(x));set('pCompany',companyLine||ai.company||$('company').value);set('pDrawing',ai.drawing_no||$('drawing').value);$('proofCard').classList.remove('hidden');$('proofEditPanel').classList.add('hidden');renderProof();$('proofCard').scrollIntoView({behavior:'smooth'})}function saveSvg(){renderProof();let b=new Blob([currentSvg],{type:'image/svg+xml'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(c($('pDrawing').value)||'nameplate')+'.svg';a.click()}function printProof(){renderProof();let w=window.open('','_blank');if(w){w.document.write('<html><head><style>@page{size:A4 portrait;margin:12mm}body{text-align:center;padding-top:15mm}</style></head><body>'+$('proofArt').innerHTML+'<script>setTimeout(()=>print(),300)<\/script></body></html>');w.document.close()}}$('readBtn').onclick=read;$('sheetBtn').onclick=fillSheet;$('printBtn').onclick=()=>window.print();$('proofBtn').onclick=openProof;$('svgBtn').onclick=saveSvg;$('proofPrintBtn').onclick=printProof;$('editProofBtn').onclick=()=>$('proofEditPanel').classList.remove('hidden');$('renderProofBtn').onclick=()=>{renderProof();$('proofEditPanel').classList.add('hidden')};</script></body></html>
