<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>銘板原稿AI｜テスト版10</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#172231;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif}header{background:#17324d;color:#fff;padding:18px}header h1{margin:0;font-size:22px}main{max-width:1050px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px #0001}h2{font-size:20px;margin:0 0 15px}.upload{text-align:center;border:2px dashed #9aa8b6;border-radius:12px;padding:18px}.preview{display:none;max-width:100%;max-height:400px;margin:14px auto;border-radius:8px}.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:9px;padding:13px 18px;font-size:16px;font-weight:800;color:#fff;background:#17324d}.secondary{background:#657483}.status{margin-top:12px;font-weight:700}.hidden{display:none!important}.legacy-grid,.proof-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.legacy-grid label,.proof-grid label{font-size:13px;font-weight:700}.legacy-grid input,.proof-grid input,.legacy-grid select{width:100%;padding:10px;margin-top:4px;border:1px solid #ccd4dc;border-radius:8px;font-size:16px;background:#fff}.note{font-size:12px;color:#657483}.proof-stage{margin-top:16px;padding:18px;background:#eef1f4;border-radius:12px;text-align:center;overflow:auto}.proof-art{display:inline-block;background:#fff;padding:14px;box-shadow:0 2px 12px #0002}.proof-art svg{display:block;max-width:78vw;height:auto}.proof-warn{background:#fff4c7;border:1px solid #e0b93e;padding:12px;border-radius:9px;margin-top:12px;line-height:1.65;font-size:13px}.proof-ok{background:#eaf7ee;border:1px solid #77bd89;padding:12px;border-radius:9px;margin-top:12px;line-height:1.65;font-size:13px}.coord-list{margin-top:10px;padding:10px;background:#f7f9fb;border-radius:8px;font-size:13px;line-height:1.7;text-align:left}.sheet-scroll{overflow-x:auto;background:#e9edf1;padding:10px;border-radius:10px}.sheet{width:190mm;min-width:190mm;height:135mm;margin:auto;background:#fff;color:#111;padding:2mm}.title{text-align:center;font-size:14px;font-weight:800;margin-bottom:1mm}.t{width:100%;height:126mm;border-collapse:collapse;table-layout:fixed;font-size:8.8px}.t td,.t th{border:1px solid #111;padding:.55mm;vertical-align:top;overflow:hidden}.t th{font-size:8.8px;text-align:center;vertical-align:middle;background:#fafafa}.field{width:100%;border:0;padding:0;margin:0;background:transparent;font:700 10.2px/1.2 "Yu Gothic",sans-serif;color:#111}.mini{font-size:7.8px;font-weight:700}.line{border-bottom:1px solid #777;height:8px;margin:1px 0}@media(max-width:650px){main{padding:12px}.legacy-grid,.proof-grid{grid-template-columns:1fr}.sheet-scroll{margin-left:-18px;margin-right:-18px;border-radius:0}}@page{size:A4 portrait;margin:10mm}@media print{body{background:#fff}header,main>.card{display:none!important}main{padding:0;margin:0;max-width:none}.card#printCard{display:block!important;padding:0;margin:0;box-shadow:none}.card#printCard h2,.card#printCard>.btns,.card#printCard>.note{display:none!important}.sheet-scroll{padding:0;margin:0;border:0;overflow:visible;background:#fff}.sheet{width:190mm!important;min-width:190mm!important;height:135mm!important;margin:0 auto;padding:0}body.proof-only header,body.proof-only main>.card{display:none!important}body.proof-only #proofCard{display:block!important;box-shadow:none!important;padding:0!important;margin:0!important}body.proof-only #proofCard h2,body.proof-only #proofCard .proof-grid,body.proof-only #proofCard .btns,body.proof-only #proofCard .proof-warn,body.proof-only #proofCard .proof-ok,body.proof-only #proofCard .coord-list,body.proof-only #proofCard .note{display:none!important}body.proof-only .proof-stage{background:#fff!important;padding:0!important;margin:0!important}body.proof-only .proof-art{box-shadow:none!important;padding:0!important}body.proof-only .proof-art svg{max-width:none!important}}</style></head><body><header><h1>銘板原稿AI <small>テスト版10・穴位置AI対応</small></h1></header><main><div class="card"><h2>1. 客先図面</h2><div class="upload"><input id="file" type="file" accept="image/*,.pdf"><p>客先図面のPDF・写真を選択</p><img id="preview" class="preview"><button id="readBtn">AIで図面を読み取る</button><div id="status" class="status note">図面を選んでください。</div></div></div><div class="card hidden" id="editCard"><h2>2. 社内指示を確認</h2><div class="legacy-grid"><label>会社名<input id="company"></label><label>NP番号<input id="drawing"></label><label>注文数<input id="qty" type="number"></label><label>合格年月<input id="date"></label></div><div class="btns"><button id="sheetBtn">社内指示書を作る</button></div><div id="warnings" class="note"></div></div><div class="card hidden" id="printCard"><h2>3. 社内製作指示書</h2><div class="sheet-scroll"><section class="sheet"><div class="title">銘板　社内製作指示書</div><table class="t"><tr><th>会社名</th><th>NP番号</th><th>注文数</th><th>材料</th><th>板厚</th><th>製作方法</th><th>備考</th></tr><tr style="height:24mm"><td><input class="field" id="fCompany"></td><td><input class="field" id="fDrawing"></td><td><input class="field" id="fQty"></td><td><input class="field" id="fMaterial"></td><td><input class="field" id="fThick"></td><td><input class="field" id="fMethod"></td><td><span class="mini">穴</span><input class="field" id="fHole"><br><span class="mini">穴位置</span><input class="field" id="fHolePos"></td></tr><tr><th>地色</th><th>文字・線色</th><th>サイズ</th><th>品名</th><th>合格番号</th><th>合格年月</th><th>R</th></tr><tr style="height:24mm"><td><input class="field" id="fGround"></td><td><input class="field" id="fInk"></td><td><input class="field" id="fSize"></td><td><input class="field" id="fName"></td><td><input class="field" id="fNumber"></td><td><input class="field" id="fDate"></td><td><input class="field" id="fRadius"></td></tr><tr><th colspan="7">社内記入欄</th></tr><tr style="height:60mm"><td colspan="7"><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div></td></tr></table></section></div><div class="btns"><button id="printBtn">PDF保存・印刷</button><button id="proofBtn">4. 校正用銘板原稿へ進む</button><button class="secondary" id="backBtn">内容を修正</button></div></div><div class="card hidden" id="proofCard"><h2>4. 校正用銘板原稿</h2><p class="note">穴位置は、図面の寸法からAIが一意に確定できた場合だけ配置します。見た目からの推測配置はしません。</p><div class="proof-grid"><label>幅 mm<input id="pW"></label><label>高さ mm<input id="pH"></label><label>1行目<input id="pLine1"></label><label>2行目<input id="pLine2"></label><label>会社名<input id="pCompany"></label><label>NP番号<input id="pDrawing"></label></div><div class="btns"><button id="renderProofBtn">原稿を更新</button><button id="svgBtn">Illustrator用SVGを保存</button><button id="proofPrintBtn">校正PDFを保存・印刷</button></div><div id="proofWarn" class="proof-warn"></div><div id="coordList" class="coord-list hidden"></div><div class="proof-stage"><div class="proof-art" id="proofArt"></div></div></div></main><script>const U='https://emauqxftmauvsffdjvyh.supabase.co',K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtYXVxeGZ0bWF1dnNmZmRqdnloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4Njg0NzksImV4cCI6MjEwMjQ0NDQ3OX0.iN2xz71VCeP7o6nz89v0wJMrUYkGyPKATtWaCl-MIO4',$=x=>document.getElementById(x),c=x=>(x==null?'':String(x).trim()),short=x=>c(x).replace(/株式会社/g,'').replace(/製作所/g,'').replace(/[　 ]+/g,' ').trim(),H=()=>({'Content-Type':'application/json',apikey:K,Authorization:'Bearer '+K});let ai={},hist=null,currentSvg='';function set(id,v){if($(id))$(id).value=c(v)}function esc(s){return c(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function du(f){return new Promise((a,b)=>{let r=new FileReader;r.onload=()=>a(r.result);r.onerror=b;r.readAsDataURL(f)})}function validHoles(){let w=+ai.width_mm,h=+ai.height_mm,d=+ai.hole_diameter_mm,p=Array.isArray(ai.hole_positions)?ai.hole_positions:[];return p.filter(q=>Number.isFinite(+q.x_mm)&&Number.isFinite(+q.y_mm)&&+q.x_mm>=0&&+q.y_mm>=0&&+q.x_mm<=w&&+q.y_mm<=h&&d>0)}function holeText(){let p=validHoles();return p.length?p.map((q,i)=>(i+1)+': X'+(+q.x_mm)+' Y'+(+q.y_mm)).join(' / '):''}$('file').onchange=()=>{let f=$('file').files[0];if(!f)return;$('status').textContent=f.name;if(f.type.startsWith('image/')){$('preview').src=URL.createObjectURL(f);$('preview').style.display='block'}};async function history(no){let r=await fetch(U+'/functions/v1/nameplate-history',{method:'POST',headers:H(),body:JSON.stringify({drawing_no:no})}),j=await r.json();return j.history||null}async function read(){let f=$('file').files[0];if(!f)return alert('図面を選択してください');$('status').textContent='AI解析中…穴位置も寸法線から確認しています。';$('readBtn').disabled=true;try{let r=await fetch(U+'/functions/v1/read-nameplate-drawing',{method:'POST',headers:H(),body:JSON.stringify({data:await du(f),type:f.type,name:f.name})}),j=await r.json();if(!r.ok||j.error)throw Error(j.error||'読取失敗');ai=j.result||{};hist=await history(ai.drawing_no);set('company',short(ai.company||hist?.company));set('drawing',ai.drawing_no);set('date',ai.approval_date||'');set('qty','');$('warnings').textContent=(ai.warnings||[]).join(' ／ ');$('editCard').classList.remove('hidden');let n=validHoles().length;$('status').textContent=n?('読取完了。穴中心座標 '+n+'ヶを確定しました。'):('読取完了。穴位置は一意に確定できないため推測配置しません。');$('editCard').scrollIntoView({behavior:'smooth'})}catch(e){$('status').textContent='エラー：'+e.message}finally{$('readBtn').disabled=false}}function fill(){set('fCompany',short($('company').value));set('fDrawing',$('drawing').value);set('fQty',$('qty').value);set('fMaterial',ai.material||hist?.material);set('fThick',c(ai.thickness_mm||hist?.thickness_mm)+(c(ai.thickness_mm||hist?.thickness_mm)?'t':''));set('fMethod',hist?.method||'');set('fGround',ai.ground_color||hist?.ground_color);set('fInk',ai.text_line_color||hist?.text_line_color);set('fHole',(ai.hole_diameter_mm&&ai.hole_count)?ai.hole_diameter_mm+'φ - '+ai.hole_count+'ヶ':'');set('fHolePos',holeText());set('fSize',(ai.width_mm&&ai.height_mm)?ai.width_mm+'×'+ai.height_mm:'');set('fName',ai.name||hist?.item_name);set('fNumber',c(ai.approval_number||hist?.approval_number).replace(/^第/,'').replace(/号$/,''));set('fDate',$('date').value);set('fRadius',ai.radius||hist?.radius||'');$('printCard').classList.remove('hidden');$('printCard').scrollIntoView({behavior:'smooth'})}function proofColors(){let g=c($('fGround').value||ai.ground_color||hist?.ground_color),i=c($('fInk').value||ai.text_line_color||hist?.text_line_color);let bg=/黒/.test(g)?'#111111':/赤/.test(g)?'#b92323':'#ffffff';let fg=/黄/.test(i)?'#f3d34a':/赤/.test(i)?'#d92b2b':/黒/.test(i)?'#111111':(bg==='#111111'?'#f5f5f5':'#111111');return{bg,fg}}function renderProof(){let w=parseFloat($('pW').value)||20,h=parseFloat($('pH').value)||20,cl=proofColors(),l1=esc($('pLine1').value),l2=esc($('pLine2').value),co=esc($('pCompany').value),np=esc($('pDrawing').value),fs=Math.max(1.2,Math.min(w,h)*.12),companyFs=Math.max(1,Math.min(w,h)*.09),npFs=Math.max(.75,Math.min(w,h)*.055),d=+ai.hole_diameter_mm||0,holes=validHoles(),lines=Array.isArray(ai.line_positions)?ai.line_positions:[];let shapes='';lines.forEach(x=>{let p=+x.position_mm;if(!Number.isFinite(p))return;if(x.orientation==='horizontal'&&p>=0&&p<=h)shapes+='<line x1="0" y1="'+p+'" x2="'+w+'" y2="'+p+'" stroke="'+cl.fg+'" stroke-width="0.25"/>';if(x.orientation==='vertical'&&p>=0&&p<=w)shapes+='<line x1="'+p+'" y1="0" x2="'+p+'" y2="'+h+'" stroke="'+cl.fg+'" stroke-width="0.25"/>'});holes.forEach(q=>{shapes+='<circle cx="'+(+q.x_mm)+'" cy="'+(+q.y_mm)+'" r="'+(d/2)+'" fill="'+cl.bg+'" stroke="'+cl.fg+'" stroke-width="0.25"/>'});if(!lines.length){shapes+='<line x1="0.5" y1="'+(h*.28)+'" x2="'+(w-.5)+'" y2="'+(h*.28)+'" stroke="'+cl.fg+'" stroke-width="0.25"/><line x1="0.5" y1="'+(h*.52)+'" x2="'+(w-.5)+'" y2="'+(h*.52)+'" stroke="'+cl.fg+'" stroke-width="0.25"/>'}currentSvg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'mm" height="'+h+'mm" viewBox="0 0 '+w+' '+h+'"><rect x="0.15" y="0.15" width="'+(w-.3)+'" height="'+(h-.3)+'" fill="'+cl.bg+'" stroke="#777" stroke-width="0.3"/>'+shapes+'<text x="'+(w/2)+'" y="'+(h*.18)+'" text-anchor="middle" dominant-baseline="middle" fill="'+cl.fg+'" font-family="Yu Gothic, sans-serif" font-size="'+fs+'" font-weight="700">'+l1+'</text><text x="'+(w/2)+'" y="'+(h*.40)+'" text-anchor="middle" dominant-baseline="middle" fill="'+cl.fg+'" font-family="Yu Gothic, sans-serif" font-size="'+fs+'" font-weight="700">'+l2+'</text><text x="'+(w/2)+'" y="'+(h*.72)+'" text-anchor="middle" dominant-baseline="middle" fill="'+cl.fg+'" font-family="Yu Gothic, sans-serif" font-size="'+companyFs+'" font-weight="700">'+co+'</text><text x="'+(w-.7)+'" y="'+(h-.7)+'" text-anchor="end" fill="'+cl.fg+'" font-family="Arial, sans-serif" font-size="'+npFs+'">'+np+'</text></svg>';$('proofArt').innerHTML=currentSvg;updateHoleStatus()}function updateHoleStatus(){let p=validHoles(),expected=+ai.hole_count||0;if(p.length&&(!expected||p.length===expected)){$('proofWarn').className='proof-ok';$('proofWarn').innerHTML='<b>穴位置確定。</b> 図面の寸法から穴中心座標を確定できたため、SVGへ配置しました。';$('coordList').classList.remove('hidden');$('coordList').innerHTML='<b>穴中心座標（左上原点）</b><br>'+p.map((q,i)=>(i+1)+'ヶ目：X='+q.x_mm+'mm / Y='+q.y_mm+'mm'+(q.source?'　根拠：'+esc(q.source):'')).join('<br>')}else{$('proofWarn').className='proof-warn';$('proofWarn').innerHTML='<b>穴位置は未配置です。</b> 穴径・穴数が読めても、中心座標を寸法から一意に確定できない場合は勝手に置きません。客先図面で位置寸法を確認してください。';$('coordList').classList.add('hidden');$('coordList').innerHTML=''}}function openProof(){set('pW',ai.width_mm||hist?.width_mm||20);set('pH',ai.height_mm||hist?.height_mm||20);let d=c($('fDate').value||ai.approval_date||hist?.approval_date),n=c($('fNumber').value||ai.approval_number||hist?.approval_number).replace(/^第/,'').replace(/号$/,'');set('pLine1',d?'労('+d+')検':'');set('pLine2',n?'第'+n+'号':'');set('pCompany',short($('fCompany').value||ai.company||hist?.company));set('pDrawing',c($('fDrawing').value||ai.drawing_no).replace(/-1$/,''));$('proofCard').classList.remove('hidden');renderProof();$('proofCard').scrollIntoView({behavior:'smooth'})}function saveSvg(){if(!currentSvg)renderProof();let p=validHoles(),expected=+ai.hole_count||0;if(expected&&p.length!==expected&&!confirm('穴位置が全数確定していません。穴未配置のSVGとして保存しますか？'))return;let blob=new Blob([currentSvg],{type:'image/svg+xml;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(c($('pDrawing').value)||'nameplate')+'.svg';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}function printProof(){renderProof();document.body.classList.add('proof-only');window.print();setTimeout(()=>document.body.classList.remove('proof-only'),500)}$('readBtn').onclick=read;$('sheetBtn').onclick=fill;$('printBtn').onclick=()=>window.print();$('backBtn').onclick=()=>$('editCard').scrollIntoView({behavior:'smooth'});$('proofBtn').onclick=openProof;$('renderProofBtn').onclick=renderProof;$('svgBtn').onclick=saveSvg;$('proofPrintBtn').onclick=printProof;</script></body></html>
