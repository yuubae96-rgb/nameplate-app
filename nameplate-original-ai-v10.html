<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>銘板原稿AI｜テスト版20</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#172231;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif}header{background:#17324d;color:#fff;padding:18px}main{max-width:1080px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px}.hidden{display:none!important}h2{margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid input{width:100%;padding:11px;font-size:16px}.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:9px;padding:13px 18px;font-size:16px;font-weight:800;color:#fff;background:#17324d}.secondary{background:#657483}.note{color:#657483;line-height:1.6}.stage{padding:22px;background:#eef1f4;border-radius:12px;text-align:center;overflow:auto}.art{display:inline-block;background:#fff;padding:18px}.art svg{display:block;width:min(82vw,720px);height:auto}.ok,.warn{padding:12px;border-radius:9px;margin-top:12px}.ok{background:#eaf7ee}.warn{background:#fff4c7}@media(max-width:650px){.grid{grid-template-columns:1fr}.btns button{flex:1 1 45%}}</style></head><body><header><b>銘板原稿AI　テスト版20・PDF再構成方式</b></header><main><div class="card"><h2>1. 客先図面</h2><input id="file" type="file" accept="image/*,.pdf"><div class="btns"><button id="readBtn">AIで図面を読み取る</button></div><div id="status" class="note">できれば元PDFを選択してください。</div></div><div class="card hidden" id="editCard"><h2>2. 社内指示を確認</h2><div class="grid"><label>会社名<input id="company"></label><label>NP番号<input id="drawing"></label><label>注文数<input id="qty" type="number"></label><label>合格年月<input id="date"></label></div><div class="btns"><button id="sheetBtn">3. 社内製作指示書を確認</button></div></div><div class="card hidden" id="printCard"><h2>3. 社内製作指示書</h2><p class="note">AI読取内容を確認してから校正原稿へ進みます。</p><div id="sheetSummary"></div><div class="btns"><button id="proofBtn">4. 校正用銘板原稿へ進む</button></div></div><div class="card hidden" id="proofCard"><h2>4. 校正用銘板原稿</h2><p class="note"><b>テスト版20では写真の切り抜きは使いません。</b> PDF／図面から読んだ文字・罫線・穴・外形を、銘板寸法上に再配置して校正図を作ります。</p><div class="stage"><div class="art" id="proofArt"></div></div><div class="btns"><button id="svgBtn">Illustrator用SVGを保存</button><button id="proofPrintBtn">校正PDFを保存・印刷</button><button class="secondary" id="editProofBtn">内容を修正</button></div><div id="proofStatus"></div><div class="grid hidden" id="proofEdit"><label>幅<input id="pW"></label><label>高さ<input id="pH"></label></div><div class="btns hidden" id="proofEditBtns"><button id="rerenderBtn">原稿を更新</button></div></div></main><script>const U='https://emauqxftmauvsffdjvyh.supabase.co',K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtYXVxeGZ0bWF1dnNmZmRqdnloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4Njg0NzksImV4cCI6MjEwMjQ0NDQ3OX0.iN2xz71VCeP7o6nz89v0wJMrUYkGyPKATtWaCl-MIO4',$=x=>document.getElementById(x),c=x=>(x==null?'':String(x).trim()),H=()=>({'Content-Type':'application/json',apikey:K,Authorization:'Bearer '+K});let ai={},svg='';function dataURL(f){return new Promise((ok,no)=>{let r=new FileReader;r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}function esc(s){return c(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function set(id,v){$(id).value=c(v)}function holes(){return Array.isArray(ai.hole_positions)?ai.hole_positions.filter(q=>isFinite(+q.x_mm)&&isFinite(+q.y_mm)):[]}function els(){return Array.isArray(ai.visual_elements)?ai.visual_elements:[]}async function read(){let f=$('file').files[0];if(!f)return alert('図面を選択してください');$('readBtn').disabled=true;$('status').textContent='AI解析中…文字・罫線・穴・外形を分解しています。';try{let d=await dataURL(f),r=await fetch(U+'/functions/v1/read-nameplate-drawing',{method:'POST',headers:H(),body:JSON.stringify({data:d,type:f.type,name:f.name})}),j= /2)+'" width="'+ww+'" height="'+hh+'" fill="none" stroke="'+z.fg+'" stroke-width=".25"/>'});let d=+ai.hole_diameter_mm||0;holes().forEach(q=>body+='<circle cx="'+q.x_mm+'" cy="'+q.y_mm+'" r="'+d/2+'" fill="'+(z.bg==='#111'?'#fff':'none')+'" stroke="'+z.fg+'" stroke-width=".3"/>');svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'mm" height="'+h+'mm" viewBox="0 0 '+w+' '+h+'">'+body+'</svg>';return svg}function render(){$('proofArt').innerHTML=build();let n=els().length,h=holes().length;$('proofStatus').className=n?'ok':'warn';$('proofStatus').innerHTML=n?'<b>再構成：</b>'+n+'要素／穴 '+h+'ヶ。原図写真は使用していません。':'<b>要確認：</b>文字・罫線の位置情報が不足しています。勝手な配置はしません。'}function proof(){set('pW',ai.width_mm||100);set('pH',ai.height_mm||50);$('proofCard').classList.remove('hidden');render();$('proofCard').scrollIntoView({behavior:'smooth'})}function save(){let b=new Blob([build()],{type:'image/svg+xml'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(c($('drawing').value)||'nameplate')+'.svg';a.click()}function printProof(){let p=window.open('','_blank');if(!p)return;p.document.write('<!doctype html><meta charset="utf-8"><style>@page{size:A4 landscape;margin:10mm}body{margin:0;height:190mm;display:flex;align-items:center;justify-content:center}svg{max-width:250mm;max-height:170mm}</style>'+build()+'<script>setTimeout(()=>print(),300)<\/script>');p.document.close()}$('readBtn').onclick=read;$('sheetBtn').onclick=sheet;$('proofBtn').onclick=proof;$('svgBtn').onclick=save;$('proofPrintBtn').onclick=printProof;$('editProofBtn').onclick=()=>{$('proofEdit').classList.remove('hidden');$('proofEditBtns').classList.remove('hidden')};$('rerenderBtn').onclick=render;</script></body></html>
