<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>銘板原稿AI｜テスト版22</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#172231;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif}header{background:#17324d;color:#fff;padding:18px}main{max-width:1080px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid input{width:100%;padding:11px;font-size:16px}.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:9px;padding:13px 18px;font-size:16px;font-weight:800;color:#fff;background:#17324d}.secondary{background:#657483}.note{color:#657483;line-height:1.6}.stage{padding:22px;background:#eef1f4;border-radius:12px;text-align:center;overflow:auto}.art{display:inline-block;background:#fff;padding:18px}.art svg{display:block;width:min(82vw,720px);height:auto}.ok,.warn{padding:12px;border-radius:9px;margin-top:12px}.ok{background:#eaf7ee}.warn{background:#fff4c7}.readback{background:#f7f9fb;padding:14px;border-radius:10px;line-height:1.8}@media(max-width:650px){.grid{grid-template-columns:1fr}.btns button{flex:1 1 45%}}</style></head><body><header><b>銘板原稿AI　テスト版22・標準銘板レイアウト</b></header><main><div class="card"><h2>1. 客先図面</h2><input id="file" type="file" accept="image/*,.pdf"><div class="btns"><button id="readBtn">ChatGPTのように図面を読む</button></div><div id="status" class="note">元PDF推奨。完成銘板に入る内容だけを自然に読みます。</div></div><div class="card hidden" id="readCard"><h2>2. AIが理解した完成銘板</h2><div id="readback" class="readback"></div><div class="grid"><label>会社名<input id="company"></label><label>NP番号<input id="drawing"></label><label>注文数<input id="qty" type="number"></label><label>合格年月<input id="date"></label></div><div class="btns"><button id="proofBtn">3. この内容で校正図面を作る</button></div></div><div class="card hidden" id="proofCard"><h2>3. 校正用銘板原稿</h2><p class="note">四隅の穴を先に確保し、その内側の安全領域へ文字を自動配置します。標準銘板ではAIの曖昧な罫線座標を使いません。</p><div class="stage"><div class="art" id="proofArt"></div></div><div class="btns"><button id="svgBtn">Illustrator用SVGを保存</button><button id="printBtn">校正PDFを保存・印刷</button><button class="secondary" id="editBtn">寸法を修正</button></div><div id="proofStatus"></div><div class="grid hidden" id="edit"><label>幅mm<input id="pW"></label><label>高さmm<input id="pH"></label></div><div class="btns hidden" id="editBtns"><button id="rerender">校正図を更新</button></div></div></main><script>const U='https://emauqxftmauvsffdjvyh.supabase.co',K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhc2UiLCJyZWYiOiJlbWF1cXhmdG1hdXZzZmZkanZ5aCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzg2ODY4NDc5LCJleHAiOjIxMDI0NDQ0Nzl9.iN2xz71VCeP7o6nz89v0wJMrUYkGyPKATtWaCl-MIO4',$=x=>document.getElementById(x),c=x=>(x==null?'':String(x).trim()),H=()=>({'Content-Type':'application/json',apikey:K,Authorization:'Bearer '+K});let ai={},svg='';function du(f){return new Promise((a,b)=>{let r=new FileReader;r.onload=()=>a(r.result);r.onerror=b;r.readAsDataURL(f)})}function esc(s){return c(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function set(id,v){$(id).value=c(v)}function rows(){return Array.isArray(ai.layout?.rows)?ai.layout.rows:[]}function holes(){return Array.isArray(ai.hole_positions)?ai.hole_positions.filter(q=>isFinite(+q.x_mm)&&isFinite(+q.y_mm)):[]}async function read(){let f=$('file').files[0];if(!f)return alert('図面を選択してください');$('readBtn').disabled=true;$('status').textContent='図面全体の意味を理解中…';try{let d=await du(f),r=await fetch(U+'/functions/v1/read-nameplate-drawing',{method:'POST',headers:H(),body:JSON.stringify({data:d,type:f.type,name:f.name})}),j=await r.json();if(!r.ok||j.error)throw Error(j.error||'読取失敗');ai=j.result||{};set('company',ai.company);set('drawing',ai.drawing_no);set('date',ai.approval_date);let lines=rows().map(x=>esc(x.text||[x.label,x.value].filter(Boolean).join('　'))).filter(Boolean);$('readback').innerHTML='<b>外形：</b>'+esc(ai.width_mm||'?')+' × '+esc(ai.height_mm||'?')+' mm　<b>R：</b>'+esc(ai.radius||'不明')+'<br><b>穴：</b>'+esc(ai.hole_diameter_mm||'?')+'φ × '+esc(ai.hole_count||'?')+'ヶ　確定座標 '+holes().length+'ヶ<br><b>地色／文字：</b>'+esc(ai.ground_color||'不明')+' ／ '+esc(ai.text_line_color||'不明')+'<hr><b>完成銘板に入る文字</b><br>'+lines.join('<br>');$('readCard').classList.remove('hidden');$('status').textContent='読取完了。下の内容を確認してください。';$('readCard').scrollIntoView({behavior:'smooth'})}catch(e){$('status').textContent='エラー：'+e.message}finally{$('readBtn').disabled=false}}function colors(){let bg=/黒/.test(c(ai.ground_color))?'#111':'#fff',fg=/黄/.test(c(ai.text_line_color))?'#e6c934':bg==='#111'?'#fff':'#111';return{bg,fg}}function fit(text,maxW,maxFs,minFs){let n=[...c(text)].reduce((s,ch)=>s+(/[ -~]/.test(ch)?.55:1),0)||1;return Math.max(minFs,Math.min(maxFs,maxW/(n*.92)))}function build(){let w=+$('pW').value||+ai.width_mm||100,h=+$('pH').value||+ai.height_mm||50,z=colors(),rad=Math.max(0,+ai.plate?.corner_radius_mm||0),body='<rect x=".25" y=".25" width="'+(w-.5)+'" height="'+(h-.5)+'" rx="'+rad+'" fill="'+z.bg+'" stroke="#555" stroke-width=".5"/>';let hs=holes(),d=+ai.hole_diameter_mm||0;hs.forEach(q=>body+='<circle cx="'+q.x_mm+'" cy="'+q.y_mm+'" r="'+d/2+'" fill="#fff" stroke="#555" stroke-width=".3"/>');let rr=rows(),n=rr.length;if(n){let holeGuard=d?d/2+3:3,left=Math.max(w*.07,holeGuard),right=w-left,top=Math.max(h*.12,holeGuard),bottom=h-top;if(hs.length){let topH=hs.filter(q=>+q.y_mm<h/2);if(topH.length)top=Math.max(top,...topH.map(q=>+q.y_mm+d/2+3));let botH=hs.filter(q=>+q.y_mm>=h/2);if(botH.length)bottom=Math.min(bottom,...botH.map(q=>+q.y_mm-d/2-3));}let availH=Math.max(h*.45,bottom-top),step=availH/n,maxFs=Math.min(step*.58,h*.055),minFs=Math.max(1.6,h*.018),two=(ai.layout?.columns||1)===2;rr.forEach((r,i)=>{let y=top+step*(i+.5);if(two&&(c(r.label)||c(r.value))){let label=c(r.label),value=c(r.value),lx=left,vx=left+(right-left)*.29,labelW=(right-left)*.25,valueW=right-vx,lf=fit(label,labelW,maxFs,minFs),vf=fit(value,valueW,maxFs,minFs);body+='<text x="'+lx+'" y="'+y+'" fill="'+z.fg+'" font-size="'+lf+'" font-family="Yu Gothic,Arial" text-anchor="start" dominant-baseline="middle">'+esc(label)+'</text><text x="'+vx+'" y="'+y+'" fill="'+z.fg+'" font-size="'+vf+'" font-family="Yu Gothic,Arial" text-anchor="start" dominant-baseline="middle">'+esc(value)+'</text>'}else{let t=c(r.text)||[r.label,r.value].filter(Boolean).join('　'),fs=fit(t,right-left,maxFs,minFs);body+='<text x="'+w/2+'" y="'+y+'" fill="'+z.fg+'" font-size="'+fs+'" font-family="Yu Gothic,Arial" text-anchor="middle" dominant-baseline="middle">'+esc(t)+'</text>'}})}svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'mm" height="'+h+'mm" viewBox="0 0 '+w+' '+h+'">'+body+'</svg>';return svg}function proof(){set('pW',ai.width_mm||100);set('pH',ai.height_mm||50);$('proofCard').classList.remove('hidden');render();$('proofCard').scrollIntoView({behavior:'smooth'})}function render(){$('proofArt').innerHTML=build();$('proofStatus').className=rows().length?'ok':'warn';$('proofStatus').innerHTML=rows().length?'<b>配置完了：</b>'+rows().length+'行。文字は穴を避けた安全領域に収め、長い文章は自動縮小しています。':'<b>要確認：</b>完成銘板の文字を確定できませんでした。'}function save(){let a=document.createElement('a'),b=new Blob([build()],{type:'image/svg+xml'});a.href=URL.createObjectURL(b);a.download=(c($('drawing').value)||'nameplate')+'.svg';a.click()}function printP(){let p=window.open('','_blank');if(!p)return;p.document.write('<meta charset="utf-8"><style>@page{size:A4 landscape;margin:10mm}body{height:190mm;margin:0;display:flex;align-items:center;justify-content:center}svg{max-width:250mm;max-height:170mm}</style>'+build()+'<script>setTimeout(()=>print(),300)<\/script>');p.document.close()}$('readBtn').onclick=read;$('proofBtn').onclick=proof;$('svgBtn').onclick=save;$('printBtn').onclick=printP;$('editBtn').onclick=()=>{$('edit').classList.remove('hidden');$('editBtns').classList.remove('hidden')};$('rerender').onclick=render;</script></body></html>
