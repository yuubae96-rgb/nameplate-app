<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>銘板原稿AI｜テスト版11</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#172231;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif}header{background:#17324d;color:#fff;padding:18px}main{max-width:1050px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid input{width:100%;padding:10px;font-size:16px}.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:9px;padding:13px 18px;font-size:16px;font-weight:800;color:#fff;background:#17324d}.note{font-size:13px;color:#657483}.ok,.warn,.coords{padding:12px;border-radius:9px;margin-top:12px;line-height:1.65}.ok{background:#eaf7ee;border:1px solid #77bd89}.warn{background:#fff4c7;border:1px solid #e0b93e}.coords{background:#f7f9fb}.stage{margin-top:16px;padding:18px;background:#eef1f4;text-align:center;overflow:auto}.art{display:inline-block;background:#fff;padding:14px}.art svg{display:block;max-width:78vw;height:auto}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header><b>銘板原稿AI　テスト版11・罫線位置AI対応</b></header><main><div class="card"><h2>1. 客先図面</h2><input id="file" type="file" accept="image/*,.pdf"><div class="btns"><button id="readBtn">AIで図面を読み取る</button></div><div id="status" class="note">図面を選んでください。</div></div><div class="card hidden" id="proof"><h2>2. 校正用銘板原稿</h2><p class="note">穴と罫線は、客先図面の寸法・注記から位置を一意に確定できたものだけ配置します。AIが勝手な位置に線を追加することはありません。</p><div class="grid"><label>幅 mm<input id="w"></label><label>高さ mm<input id="h"></label><label>1行目<input id="l1"></label><label>2行目<input id="l2"></label><label>会社名<input id="co"></label><label>NP番号<input id="np"></label></div><div class="btns"><button id="render">原稿を更新</button><button id="svg">Illustrator用SVGを保存</button><button id="print">校正PDFを保存・印刷</button></div><div id="holeStatus"></div><div id="lineStatus"></div><div id="coords" class="coords hidden"></div><div class="stage"><div class="art" id="art"></div></div></div></main><script>const U='https://emauqxftmauvsffdjvyh.supabase.co',K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtYXVxeGZ0bWF1dnNmZmRqdnloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4Njg0NzksImV4cCI6MjEwMjQ0NDQ3OX0.iN2xz71VCeP7o6nz89v0wJMrUYkGyPKATtWaCl-MIO4',$=x=>document.getElementById(x),c=x=>(x==null?'':String(x).trim()),H=()=>({'Content-Type':'application/json',apikey:K,Authorization:'Bearer '+K});let ai={},current='';function du(f){return new Promise((a,b)=>{let r=new FileReader;r.onload=()=>a(r.result);r.onerror=b;r.readAsDataURL(f)})}function esc(s){return c(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function holes(){let w=+ai.width_mm,h=+ai.height_mm,d=+ai.hole_diameter_mm;return(Array.isArray(ai.hole_positions)?ai.hole_positions:[]).filter(q=>d>0&&Number.isFinite(+q.x_mm)&&Number.isFinite(+q.y_mm)&&+q.x_mm>=0&&+q.x_mm<=w&&+q.y_mm>=0&&+q.y_mm<=h)}function rules(){let w=+ai.width_mm,h=+ai.height_mm;return(Array.isArray(ai.rule_lines)?ai.rule_lines:[]).filter(q=>Number.isFinite(+q.position_mm)&&((q.orientation==='horizontal'&&+q.position_mm>=0&&+q.position_mm<=h)||(q.orientation==='vertical'&&+q.position_mm>=0&&+q.position_mm<=w)))}async function read(){let f=$('file').files[0];if(!f)return alert('図面を選択してください');$('readBtn').disabled=true;$('status').textContent='AI解析中…穴位置と製品罫線を寸法から確認しています。';try{let r=await fetch(U+'/functions/v1/read-nameplate-drawing',{method:'POST',headers:H(),body:JSON.stringify({data:await du(f),type:f.type,name:f.name})}),j=await r.json();if(!r.ok||j.error)throw Error(j.error||'読取失敗');ai=j.result||{};$('w').value=c(ai.width_mm||20);$('h').value=c(ai.height_mm||20);let t=Array.isArray(ai.text_lines)?ai.text_lines:[];$('l1').value=c(t[0]||(ai.approval_date?'労('+ai.approval_date+')検':''));$('l2').value=c(t[1]||(ai.approval_number?'第'+c(ai.approval_number).replace(/^第/,'').replace(/号$/,'')+'号':''));$('co').value=c(ai.company).replace(/株式会社/g,'');$('np').value=c(ai.drawing_no).replace(/-1$/,'');$('proof').classList.remove('hidden');render();$('status').textContent='読取完了。穴 '+holes().length+'ヶ、製品罫線 '+rules().length+'本を確定。';$('proof').scrollIntoView({behavior:'smooth'})}catch(e){$('status').textContent='エラー：'+e.message}finally{$('readBtn').disabled=false}}function render(){let w=+$('w').value||20,h=+$('h').value||20,bg=/黒/.test(c(ai.ground_color))?'#111':'#fff',fg=/黄/.test(c(ai.text_line_color))?'#f3d34a':(bg==='#111'?'#fff':'#111'),d=+ai.hole_diameter_mm||0,sh='';rules().forEach(q=>{let p=+q.position_mm,s=Number.isFinite(+q.start_mm)?+q.start_mm:0,e=Number.isFinite(+q.end_mm)?+q.end_mm:(q.orientation==='horizontal'?w:h);if(q.orientation==='horizontal')sh+='<line x1="'+s+'" y1="'+p+'" x2="'+e+'" y2="'+p+'" stroke="'+fg+'" stroke-width=".25"/>';else sh+='<line x1="'+p+'" y1="'+s+'" x2="'+p+'" y2="'+e+'" stroke="'+fg+'" stroke-width=".25"/>'});holes().forEach(q=>sh+='<circle cx="'+q.x_mm+'" cy="'+q.y_mm+'" r="'+(d/2)+'" fill="'+bg+'" stroke="'+fg+'" stroke-width=".25"/>');let fs=Math.max(1.2,Math.min(w,h)*.12);current='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'mm" height="'+h+'mm" viewBox="0 0 '+w+' '+h+'"><rect x=".15" y=".15" width="'+(w-.3)+'" height="'+(h-.3)+'" fill="'+bg+'" stroke="#777" stroke-width=".3"/>'+sh+'<text x="'+w/2+'" y="'+h*.18+'" text-anchor="middle" dominant-baseline="middle" fill="'+fg+'" font-family="Yu Gothic" font-size="'+fs+'" font-weight="700">'+esc($('l1').value)+'</text><text x="'+w/2+'" y="'+h*.40+'" text-anchor="middle" dominant-baseline="middle" fill="'+fg+'" font-family="Yu Gothic" font-size="'+fs+'" font-weight="700">'+esc($('l2').value)+'</text><text x="'+w/2+'" y="'+h*.72+'" text-anchor="middle" fill="'+fg+'" font-family="Yu Gothic" font-size="'+Math.max(1,fs*.75)+'" font-weight="700">'+esc($('co').value)+'</text><text x="'+(w-.7)+'" y="'+(h-.7)+'" text-anchor="end" fill="'+fg+'" font-family="Arial" font-size="'+Math.max(.7,fs*.45)+'">'+esc($('np').value)+'</text></svg>';$('art').innerHTML=current;let hp=holes(),rl=rules();$('holeStatus').className=hp.length?'ok':'warn';$('holeStatus').innerHTML=hp.length?'<b>穴位置確定：</b>'+hp.length+'ヶをSVGへ配置。':'<b>穴位置未確定：</b>推測配置していません。';$('lineStatus').className=rl.length?'ok':'warn';$('lineStatus').innerHTML=rl.length?'<b>製品罫線確定：</b>'+rl.length+'本を図面寸法どおりSVGへ配置。':'<b>製品罫線は未配置：</b>図面から位置を一意に確定できない線は追加していません。';let a=[];hp.forEach((q,i)=>a.push('穴'+(i+1)+'：X='+q.x_mm+' / Y='+q.y_mm+(q.source?'　根拠：'+esc(q.source):'')));rl.forEach((q,i)=>a.push('罫線'+(i+1)+'：'+(q.orientation==='horizontal'?'Y=':'X=')+q.position_mm+'mm'+(q.source?'　根拠：'+esc(q.source):'')));$('coords').classList.toggle('hidden',!a.length);$('coords').innerHTML=a.join('<br>')}function save(){render();let b=new Blob([current],{type:'image/svg+xml;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(c($('np').value)||'nameplate')+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}$('readBtn').onclick=read;$('render').onclick=render;$('svg').onclick=save;$('print').onclick=()=>window.print();</script></body></html>
