2px 12px #0002}.art svg{display:block;max-width:78vw;height:auto}@page{size:A4 landscape;margin:10mm}@media print{body{background:#fff}header,main>.card{display:none!important}main{padding:0;margin:0;max-width:none}.card#printCard{display:block!important;box-shadow:none!important;padding:0!important;margin:0!important}.card#printCard h2,.card#printCard>.btns,.card#printCard>.note{display:none!important}.sheet-scroll{padding:0;margin:0;background:#fff;overflow:visible}.sheet{width:277mm!important;min-width:277mm!important;height:190mm!important;padding:0!important}body.proof-only header,body.proof-only main>.card{display:none!important}body.proof-only #proofCard{display:block!important;box-shadow:none!important;padding:0!important;margin:0!important}body.proof-only #proofCard h2,body.proof-only #proofCard .grid,body.proof-only #proofCard .btns,body.proof-only #proofCard .ok,body.proof-only #proofCard .warn,body.proof-only #proofCard .coords,body.proof-only #proofCard .note{display:none!important}body.proof-only .stage{background:#fff!important;padding:0!important;margin:0!important}body.proof-only .art{box-shadow:none!important;padding:0!important}body.proof-only .art svg{max-width:none!important}}@media(max-width:650px){.grid{grid-template-columns:1fr}.sheet-scroll{margin-left:-18px;margin-right:-18px;border-radius:0}}</style></head><body><header><b>銘板原稿AI　テスト版12</b></header><main><div class="card"><h2>1. 客先図面</h2><input id="file" type="file" accept="image/*,.pdf"><div class="btns"><button id="readBtn">AIで図面を読み取る</button></div><div id="status" class="note">図面を選んでください。</div></div><div class="card hidden" id="editCard"><h2>2. 社内指示を確認</h2><div class="grid"><label>会社名<input id="company"></label><label>NP番号<input id="drawing"></label><label>注文数<input id="qty" type="number"></label><label>合格年月<input id="date"></label></div><div class="btns"><button id="sheetBtn">3. 社内製作指示書を作る</button></div><div id="warnings" class="note"></div></div><div class="card hidden" id="printCard"><h2>3. 社内製作指示書</h2><div class="sheet-scroll"><section class="sheet"><div class="sheet-title">銘板　社内製作指示書</div><table class="sheet-table"><tr><th>会社名</th><th>NP番号</th><th>注文数</th><th>材料</th><th>板厚</th><th>製作方法</th></tr><tr><td class="big" id="sCompany"></td><td class="big" id="sDrawing"></td><td class="big" id="sQty"></td><td class="big" id="sMaterial"></td><td class="big" id="sThick"></td><td class="big" id="sMethod"></td></tr><tr><th>地色</th><th>文字・線色</th><th>サイズ</th><th>R</th><th>穴径・穴数</th><th>穴位置</th></tr><tr><td class="big" id="sGround"></td><td class="big" id="sInk"></td><td class="big" id="sSize"></td><td class="big" id="sRadius"></td><td class="big" id="sHole"></td><td class="big" id="sHolePos"></td></tr><tr><th>品名</th><th>合格番号</th><th>合格年月</th><th colspan="3">備考・社内記入欄</th></tr><tr><td class="big" id="sName"></td><td class="big" id="sNumber"></td><td class="big" id="sDate"></td><td colspan="3" class="write"></td></tr><tr><th colspan="6">製作・検査メモ</th></tr><tr><td colspan="6" class="write"></td></tr></table></section></div><div class="btns"><button id="printBtn">A4横でPDF保存・印刷</button><button id="proofBtn">4. 校正用銘板原稿へ進む</button><button class="secondary" id="backBtn">内容を修正</button></div><p class="note">AIで確定できた内容だけ表示します。穴位置は左上原点のX/Yです。</p></div><div class="card hidden" id="proofCard"><h2>4. 校正用銘板原稿</h2><p class="note">穴と罫線は、図面の明示寸法から一意に確定できたものだけ配置します。見た目からは推測しません。</p><div class="grid"><label>幅 mm<input id="pW"></label><label>高さ mm<input id="pH"></label><label>1行目<input id="pLine1"></label><label>2行目<input id="pLine2"></label><label>会社名<input id="pCompany"></label><label>NP番号<input id="pDrawing"></label></div><div class="btns"><button id="renderProofBtn">原稿を更新</button><button id="svgBtn">Illustrator用SVGを保存</button><button id="proofPrintBtn">校正PDFを保存・印刷</button></div><div id="holeStatus"></div><div id="lineStatus"></div><div id="coordList" class="coords hidden"></div><div class="stage"><div class="art" id="proofArt"></div></div></div></main><script>const U='https://emauqxftmauvsffdjvyh.supabase.co',K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtYXVxeGZ0bWF1dnNmZmRqdnloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4Njg0NzksImV4cCI6MjEwMjQ0NDQ3OX0.iN2xz71VCeP7o6nz89v0wJMrUYkGyPKATtWaCl-MIO4',$=x=>document.getElementById(x),c=x=>(x==null?'':String(x).trim()),short=x=>c(x).replace(/株式会社/g,'').replace(/製作所/g,'').trim(),H=()=>({'Content-Type':'application/json',apikey:K,Authorization:'Bearer '+K});let ai={},hist=null,currentSvg='';function du(f){return new Promise((a,b)=>{let r=new FileReader;r.onload=()=>a(r.result);r.onerror=b;r.readAsDataURL(f)})}function esc(s){return c(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function set(id,v){if($(id))$(id).value=c(v)}async function history(no){try{let r=await fetch(U+'/functions/v1/nameplate-history',{method:'POST',headers:H(),body:JSON.stringify({drawing_no:no})}),j=await r.json();return j.history||null}catch{return null}}function holes(){let w=+ai.width_mm,h=+ai.height_mm,d=+ai.hole_diameter_mm;return(Array.isArray(ai.hole_positions)?ai.hole_positions:[]).filter(q=>d>0&&Number.isFinite(+q.x_mm)&&Number.isFinite(+q.y_mm)&&+q.x_mm>=0&&+q.x_mm<=w&&+q.y_mm>=0&&+q.y_mm<=h)}function rules(){let w=+ai.width_mm,h=+ai.height_mm;return(Array.isArray(ai.rule_lines)?ai.rule_lines:[]).filter(q=>q.confirmed_by_dimension===true&&/\d/.test(c(q.source))&&Number.isFinite(+q.position_mm)&&((q.orientation==='horizontal'&&+q.position_mm>=0&&+q.position_mm<=h)||(q.orientation==='vertical'&&+q.position_mm>=0&&+q.position_mm<=w)))}async function read(){let f=$('file').files[0];if(!f)return alert('図面を選択してください');$('readBtn').disabled=true;$('status').textContent='AI解析中…';try{let r=await fetch(U+'/functions/v1/read-nameplate-drawing',{method:'POST',headers:H(),body:JSON.stringify({data:await du(f),type:f.type,name:f.name})}),j=await r.json();if(!r.ok||j.error)throw Error(j.error||'読取失敗');ai=j.result||{};hist=await history(ai.drawing_no);set('company',short(ai.company||hist?.company));set('drawing',ai.drawing_no);set('date',ai.approval_date||'');set('qty','');$('warnings').textContent=(ai.warnings||[]).join(' ／ ');$('editCard').classList.remove('hidden');$('status').textContent='読取完了。穴位置 '+holes().length+'ヶ、確定罫線 '+rules().length+'本。';$('editCard').scrollIntoView({behavior:'smooth'})}catch(e){$('status').textContent='エラー：'+e.message}finally{$('readBtn').disabled=false}}function fillSheet(){let put=(id,v)=>$(id).textContent=c(v);put('sCompany',short($('company').value));put('sDrawing',$('drawing').value);put('sQty',$('qty').value?$('qty').value+'枚':'');put('sMaterial',ai.material||hist?.material);put('sThick',c(ai.thickness_mm||hist?.thickness_mm)+(c(ai.thickness_mm||hist?.thickness_mm)?'t':''));put('sMethod',hist?.method||'');put('sGround',ai.ground_color||hist?.ground_color);put('sInk',ai.text_line_color||hist?.text_line_color);put('sSize',(ai.width_mm&&ai.height_mm)?ai.width_mm+'×'+ai.height_mm+'mm':'');put('sRadius',ai.radius||hist?.radius||'');put('sHole',(ai.hole_diameter_mm&&ai.hole_count)?ai.hole_diameter_mm+'φ × '+ai.hole_count+'ヶ':'');put('sHolePos',holes().map((q,i)=>(i+1)+'：X'+q.x_mm+' Y'+q.y_mm).join(' / '));put('sName',ai.name||hist?.item_name);put('sNumber',c(ai.approval_number||hist?.approval_number).replace(/^第/,'').replace(/号$/,''));put('sDate',$('date').value);$('printCard').classList.remove('hidden');$('printCard').scrollIntoView({behavior:'smooth'})}function colors(){let g=c(ai.ground_color||hist?.ground_color),i=c(ai.text_line_color||hist?.text_line_color),bg=/黒/.test(g)?'#111':'#fff',fg=/黄/.test(i)?'#f3d34a':(bg==='#111'?'#fff':'#111');return{bg,fg}}function renderProof(){let w=+$('pW').value||20,h=+$('pH').value||20,cl=colors(),d=+ai.hole_diameter_mm||0,sh='';rules().forEach(q=>{let p=+q.position_mm,s=Number.isFinite(+q.start_mm)?+q.start_mm:0,e=Number.isFinite(+q.end_mm)?+q.end_mm:(q.orientation==='horizontal'?w:h);if(q.orientation==='horizontal')sh+='<line x1="'+s+'" y1="'+p+'" x2="'+e+'" y2="'+p+'" stroke="'+cl.fg+'" stroke-width=".25"/>';else sh+='<line x1="'+p+'" y1="'+s+'" x2="'+p+'" y2="'+e+'" stroke="'+cl.fg+'" stroke-width=".25"/>'});holes().forEach(q=>sh+='<circle cx="'+q.x_mm+'" cy="'+q.y_mm+'" r="'+(d/2)+'" fill="'+cl.bg+'" stroke="'+cl.fg+'" stroke-width=".25"/>');let fs=Math.max(1.2,Math.min(w,h)*.12);currentSvg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'mm" height="'+h+'mm" viewBox="0 0 '+w+' '+h+'"><rect x=".15" y=".15" width="'+(w-.3)+'" height="'+(h-.3)+'" fill="'+cl.bg+'" stroke="#777" stroke-width=".3"/>'+sh+'<text x="'+w/2+'" y="'+h*.18+'" text-anchor="middle" dominant-baseline="middle" fill="'+cl.fg+'" font-family="Yu Gothic" font-size="'+fs+'" font-weight="700">'+esc($('pLine1').value)+'</text><text x="'+w/2+'" y="'+h*.40+'" text-anchor="middle" dominant-baseline="middle" fill="'+cl.fg+'" font-family="Yu Gothic" font-size="'+fs+'" font-weight="700">'+esc($('pLine2').value)+'</text><text x="'+w/2+'" y="'+h*.72+'" text-anchor="middle" fill="'+cl.fg+'" font-family="Yu Gothic" font-size="'+Math.max(1,fs*.75)+'" font-weight="700">'+esc($('pCompany').value)+'</text><text x="'+(w-.7)+'" y="'+(h-.7)+'" text-anchor="end" fill="'+cl.fg+'" font-family="Arial" font-size="'+Math.max(.7,fs*.45)+'">'+esc($('pDrawing').value)+'</text></svg>';$('proofArt').innerHTML=currentSvg;let hp=holes(),rl=rules();$('holeStatus').className=hp.length?'ok':'warn';$('holeStatus').innerHTML=hp.length?'<b>穴位置確定：</b>'+hp.length+'ヶを配置。':'<b>穴位置未確定：</b>推測配置していません。';$('lineStatus').className=rl.length?'ok':'warn';$('lineStatus').innerHTML=rl.length?'<b>製品罫線確定：</b>'+rl.length+'本。数値寸法が明示された線だけ配置。':'<b>製品罫線は未配置：</b>数値寸法で確定できない線は描いていません。';let a=[];hp.forEach((q,i)=>a.push('穴'+(i+1)+'：X='+q.x_mm+' / Y='+q.y_mm+(q.source?'　根拠：'+esc(q.source):'')));rl.forEach((q,i)=>a.push('罫線'+(i+1)+'：'+(q.orientation==='horizontal'?'Y=':'X=')+q.position_mm+'mm　根拠：'+esc(q.source)));$('coordList').classList.toggle('hidden',!a.length);$('coordList').innerHTML=a.join('<br>')}function openProof(){set('pW',ai.width_mm||hist?.width_mm||20);set('pH',ai.height_mm||hist?.height_mm||20);let t=Array.isArray(ai.text_lines)?ai.text_lines:[],d=c($('date').value||ai.approval_date),n=c(ai.approval_number||hist?.approval_number).replace(/^第/,'').replace(/号$/,'');set('pLine1',t[0]||(d?'労('+d+')検':''));set('pLine2',t[1]||(n?'第'+n+'号':''));set('pCompany',short($('company').value||ai.company||hist?.company));set('pDrawing',c($('drawing').value||ai.drawing_no).replace(/-1$/,''));$('proofCard').classList.remove('hidden');renderProof();$('proofCard').scrollIntoView({behavior:'smooth'})}function saveSvg(){renderProof();let b=new Blob([currentSvg],{type:'image/svg+xml;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(c($('pDrawing').value)||'nameplate')+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function printProof(){renderProof();document.body.classList.add('proof-only');window.print();setTimeout(()=>document.body.classList.remove('proof-only'),500)}$('readBtn').onclick=read;$('sheetBtn').onclick=fillSheet;$('printBtn').onclick=()=>window.print();$('proofBtn').onclick=openProof;$('backBtn').onclick=()=>$('editCard').scrollIntoView({behavior:'smooth'});$('renderProofBtn').onclick=renderProof;$('svgBtn').onclick=saveSvg;$('proofPrintBtn').onclick=printProof;</script></body></html>
